  // ==================================================================
  // SAVING — coalesced
  //
  // Every save POSTs the ENTIRE snapshot as a new append-only row (~100 KB
  // each). One trip had accumulated 792 rows / 83 MB that way, because every
  // background touch wrote its own row: applying one AI suggestion produced
  // 2-3 rows, generating a fresh trip produced 40+.
  //
  // So writes are now queued instead of fired:
  //   • "user" changes debounce ~1s and collapse into ONE row
  //   • "upkeep" (recomputed transit, fetched ratings, geocoding, photos)
  //     NEVER starts a timer of its own — it just marks the snapshot dirty
  //     and rides along with the next real save. That is the whole mechanism
  //     for "background work doesn't get its own history entry".
  //   • a flush whose snapshot is byte-identical to the last persisted one
  //     is skipped entirely
  // Nothing is lost: a periodic flush covers long runs (generation takes
  // minutes), hiding the tab flushes immediately, and a failed write falls
  // back to a localStorage mirror.
  // ==================================================================
  const saver = {
    lastPersistedJson: "",
    pendingUser: [],          // human summaries, in order, deduped
    pendingUpkeep: false,
    timer: null, maxTimer: null, periodic: null,
    inFlight: null, again: false,
    paused: false,            // true while previewing an old version
  };
  function snapJson(){ try { return JSON.stringify(state.snapshot); } catch (e){ return ""; } }
  function saverDirty(){ return saver.pendingUser.length > 0 || saver.pendingUpkeep; }
  function combinedSummary(){
    const seen = [], out = [];
    saver.pendingUser.forEach(s => { const t = String(s || "").trim(); if (t && !seen.includes(t)){ seen.push(t); out.push(t); } });
    if (!out.length) return "自動更新（交通／評分／座標）";
    if (out.length === 1) return out[0];
    if (out.length === 2) return out[0] + "、" + out[1];
    return `${out[0]} 等 ${out.length} 項改動`;
  }
  function mirrorPending(){
    if (!saverDirty() || !state.tripId) return;
    try { localStorage.setItem(`trip:${state.tripId}:pending`, JSON.stringify({ at: Date.now(), snapshot: state.snapshot })); }
    catch (e){ /* quota — nothing better to do than drop the mirror */ }
  }
  function clearMirror(){
    try { localStorage.removeItem(`trip:${state.tripId}:pending`); } catch (e){}
  }
  function cancelPending(){
    clearTimeout(saver.timer); clearTimeout(saver.maxTimer);
    saver.timer = saver.maxTimer = null;
    saver.pendingUser = []; saver.pendingUpkeep = false;
  }
  function scheduleFlush(delay){
    clearTimeout(saver.timer);
    saver.timer = setTimeout(() => flushSaves("debounce"), delay);
    // however fast edits keep arriving, land something within 8s
    if (!saver.maxTimer) saver.maxTimer = setTimeout(() => flushSaves("max"), 8000);
  }
  function queueSave(summary, kind){
    if (kind === "upkeep"){ saver.pendingUpkeep = true; return; }
    saver.pendingUser.push(summary);
    flash("改咗，未存…", true);
    scheduleFlush(1000);
  }
  async function flushSaves(reason){
    clearTimeout(saver.timer); clearTimeout(saver.maxTimer);
    saver.timer = saver.maxTimer = null;
    if (saver.paused || !saverDirty() || !state.snapshot) return;
    if (saver.inFlight){ saver.again = true; return saver.inFlight; }

    const json = snapJson();
    if (json && json === saver.lastPersistedJson){   // nothing actually changed
      saver.pendingUser = []; saver.pendingUpkeep = false;
      flash("已儲存");
      return;
    }
    const summary = combinedSummary();
    const trivial = saver.pendingUser.length === 0;
    saver.pendingUser = []; saver.pendingUpkeep = false;

    flash("儲存緊…", true);
    saver.inFlight = (async () => {
      let lastErr = null;
      for (let attempt = 0; attempt < 3; attempt++){
        try {
          await saveVersion(state.snapshot, "manual", summary, trivial);
          saver.lastPersistedJson = json;
          clearMirror();
          flash("已儲存");
          return true;
        } catch (e){
          lastErr = e;
          await new Promise(r => setTimeout(r, [1000, 4000, 0][attempt]));
        }
      }
      // put the work back so a later flush retries it, and keep a local copy
      saver.pendingUser.unshift(summary);
      mirrorPending();
      flash("儲存唔到，改動暫時只留喺呢部機");
      return false;
    })();
    try { await saver.inFlight; } finally { saver.inFlight = null; }
    if (saver.again){ saver.again = false; return flushSaves("again"); }
  }

  // Resolve on ENQUEUE, not on persistence: ~50 call sites `await saveNow(...)`,
  // and if each of those waited for a real POST the coalescing would never
  // happen. Nothing reads a version row back after saving, so this is safe.
  function saveNow(summary, trivial){
    queueSave(summary, trivial ? "upkeep" : "user");
    if (!trivial) scheduleFlush(600);
    return Promise.resolve();
  }
  function saveSoon(summary, trivial){
    queueSave(summary, trivial ? "upkeep" : "user");
    if (!trivial) scheduleFlush(1200);
    return Promise.resolve();
  }
  // Long AI runs mutate the snapshot for minutes at a time; without this a
  // crash mid-generation would lose everything, which the old save-on-every-
  // step behaviour did not.
  setInterval(() => { if (saverDirty()) flushSaves("periodic"); }, 60000);
  document.addEventListener("visibilitychange", () => {
    if (document.visibilityState === "hidden" && saverDirty()) flushSaves("hidden");
  });
  // pagehide is too late for a 100 KB POST (fetch keepalive caps at 64 KiB and
  // sendBeacon can't set the auth headers PostgREST needs), so mirror instead.
  window.addEventListener("pagehide", mirrorPending);
  window.addEventListener("online", () => { if (saverDirty()) flushSaves("online"); });

  // ==================================================================
  // MODEL HELPERS
  // ==================================================================
  function dayById(id){ return state.snapshot.days.find(d => d.id === id); }

  // A connector describes the trip INTO the stop that follows it, so the two
  // travel together as one unit whenever a stop is moved.
  function toUnits(items){
    const units = [];
    for (let i = 0; i < items.length; i++){
      if (items[i].kind === "connector" && items[i+1] && items[i+1].kind === "stop"){
        units.push({ seg: items[i], stop: items[i+1] });
        i++;
      } else if (items[i].kind === "stop"){
        units.push({ seg: null, stop: items[i] });
      } else if (items[i].kind === "note"){
        // its own kind of unit — deliberately NOT a stop, so it stays out of
        // the map, the ratings sweep and everything the AI is shown
        units.push({ seg: null, stop: null, note: items[i] });
      } else {
        units.push({ seg: items[i], stop: null });
      }
    }
    return units;
  }
  function fromUnits(units){
    const out = [];
    units.forEach(u => {
      if (u.seg) out.push(u.seg);
      if (u.note) out.push(u.note);
      if (u.stop) out.push(u.stop);
    });
    return out;
  }
  // index of the unit holding the first real stop — a note pinned above it
  // must not make that stop start showing a "how you got here" line, because
  // nothing comes before the first stop of a day
  function firstStopUnit(units){ return units.findIndex(u => u.stop); }
  function blankStop(){
    return { kind:"stop", type:"normal", marker:"", time:"", title:"", kr:"",
             niecepick:[], desc:"", eatboxHtml:"", eatMeta:[], mapUrl:"",
             accessBadges:[], tip:"", photoUrl:"", placeId:"", lat:null, lng:null };
  }
  // a free-text reminder that lives between two places ("買定 T-money",
  // "呢度落車行 5 分鐘") — not a place, so it has no time, coords or rating
  function blankNote(){ return { kind:"note", text:"" }; }

  // ==================================================================
  // DATES ⇄ DAYS
  // Changing the trip's dates used to touch nothing but meta, so the day
  // list kept the old count and — worse — kept the old weekday in each
  // day.date label, which stopClosedOnDay() parses to decide whether a
  // place is shut. A stale label therefore produced confidently WRONG
  // closure warnings. These keep the two in step.
  //
  // Invariant: only ever grow or shrink the TAIL. Moving the start date
  // slides the whole trip, so day1..dayN keep their ids and just get
  // relabelled. That's what lets `day.id.replace('day','')` (used at every
  // render site), stays.from/to, state.open keys and in-flight AI dayIds
  // all stay valid without remapping.
  // ==================================================================
  const WEEKDAY_CH = ["日","一","二","三","四","五","六"];
  function isValidIso(s){
    if (!/^\d{4}-\d{2}-\d{2}$/.test(String(s || ""))) return false;
    const t = Date.parse(String(s) + "T00:00:00Z");
    return Number.isFinite(t);
  }
  // All arithmetic in UTC: a local-midnight day count is off by one across a
  // DST boundary, which would silently add or drop a day.
  function isoToUtc(iso){ return new Date(String(iso) + "T00:00:00Z"); }
  function isoAddDays(iso, n){
    const d = isoToUtc(iso);
    d.setUTCDate(d.getUTCDate() + n);
    return d.toISOString().slice(0, 10);
  }
  function isoDayLabel(iso){
    const d = isoToUtc(iso);
    return `${d.getUTCMonth() + 1}月${d.getUTCDate()}日（${WEEKDAY_CH[d.getUTCDay()]}）`;
  }
  function isoSpan(a, b){
    if (!isValidIso(a) || !isValidIso(b)) return 0;
    const days = Math.round((isoToUtc(b) - isoToUtc(a)) / 86400000) + 1;
    return days > 0 ? days : 0;
  }
  function blankDay(n, iso){
    // shortTag MUST be an explicit "" — normalizeSnapshot only backfills when
    // it is null, and a null here would inherit a label meant for another day.
    return { id: "day" + n, num: "DAY " + n, date: isoDayLabel(iso), title: "第 " + n + " 日",
             desc: "", shortTag: "", badges: [], items: [], mapPoints: null, mapCap: "" };
  }

  // Works out what changing the dates would do, without touching anything —
  // so the UI can show the consequences and let the user back out.
  function planDayReconcile(snap, newStart, newEnd){
    const m = snap.meta || {};
    const oldStart = m.dateStart, oldEnd = m.dateEnd;
    if (!isValidIso(newStart) || !isValidIso(newEnd)) return { ok:false, error:"日期格式要係 YYYY-MM-DD。" };
    const newCount = isoSpan(newStart, newEnd);
    if (!newCount) return { ok:false, error:"結束日期唔可以早過開始日期。" };
    if (newCount > 60) return { ok:false, error:"行程超過 60 日，應該分開幾個行程會好用啲。" };

    const days = snap.days || [];
    const oldCount = days.length;
    const relabel = [], added = [], dropped = [], closureFlips = [];

    for (let i = 0; i < Math.min(oldCount, newCount); i++){
      const iso = isoAddDays(newStart, i);
      const to = isoDayLabel(iso);
      if (days[i].date !== to) relabel.push({ id: days[i].id, fromDate: days[i].date, toDate: to });
      // Opening-hours warnings are derived at render time from day.date, so
      // they fix themselves — but the user deserves to know which places
      // change state, since that's the whole point of moving dates.
      (days[i].items || []).forEach(it => {
        if (it.kind !== "stop") return;
        const was = stopClosedOnDay(it, days[i]);
        const now = stopClosedOnDay(it, { date: to });
        if (was !== now) closureFlips.push({ dayId: days[i].id, title: plain(it.title), wasClosed: was, nowClosed: now });
      });
    }
    for (let i = oldCount; i < newCount; i++) added.push({ n: i + 1, iso: isoAddDays(newStart, i) });
    for (let i = newCount; i < oldCount; i++){
      const d = days[i];
      const stops = (d.items || []).filter(x => x.kind === "stop");
      dropped.push({ id: d.id, date: d.date, title: d.title,
                     stops, stopTitles: stops.map(x => plain(x.title)).filter(Boolean),
                     noteCount: (d.items || []).filter(x => x.kind === "note").length });
    }

    // meta.eyebrow / the "N 日行程" fact are only auto-updated when the user
    // hasn't hand-written something — detectable exactly, because the value
    // we'd have generated is a pure function of the OLD dates.
    const derivedOldEyebrow = formatEyebrow(oldStart, oldEnd);
    const eyebrowCustomised = !!(m.eyebrow && m.eyebrow !== derivedOldEyebrow);
    const factIdx = (m.facts || []).findIndex(f => /^\s*\d+\s*日行程\s*$/.test(String(f)));

    const monthChanged = String(oldStart || "").slice(0, 7) !== String(newStart).slice(0, 7);
    const shifted = isValidIso(oldStart) ? Math.abs(Math.round((isoToUtc(newStart) - isoToUtc(oldStart)) / 86400000)) : 0;

    return {
      ok: true, oldStart, oldEnd, newStart, newEnd, oldCount, newCount,
      relabel, added, dropped, closureFlips,
      eyebrowCustomised, derivedNewEyebrow: formatEyebrow(newStart, newEnd), factIdx,
      seasonShift: monthChanged || shifted > 20,
    };
  }

  // Applies a plan. Dropped stops go to a board by default rather than being
  // deleted — boards exist exactly for "somewhere to park a place that isn't
  // scheduled", and losing hand-picked places to a date typo would be brutal.
  function applyDayReconcile(snap, plan){
    const m = snap.meta;
    const notices = [];
    const days = snap.days || [];

    let parked = 0, boardName = "";
    if (plan.dropped.length){
      const withStops = plan.dropped.filter(d => d.stops.length);
      if (withStops.length){
        snap.boards = snap.boards || [];
        const lo = plan.newCount + 1, hi = plan.oldCount;
        boardName = `原本 Day ${lo}${hi > lo ? "-" + hi : ""}（改咗日期）`;
        const b = newBoard(boardName);
        withStops.forEach(d => d.stops.forEach(st => { b.items.push(st); parked++; }));
        snap.boards.push(b);
        notices.push(`${parked} 個地點搬咗去新清單「${boardName}」，時間同交通資料會冇咗，但地點本身留返。`);
      }
      const lostNotes = plan.dropped.reduce((n, d) => n + d.noteCount, 0);
      if (lostNotes) notices.push(`${lostNotes} 個 note 跟住嗰幾日一齊冇咗（清單度冇 note 呢種嘢）。`);
      days.length = plan.newCount;
    }

    for (let i = 0; i < Math.min(days.length, plan.newCount); i++){
      const iso = isoAddDays(plan.newStart, i);
      days[i].id = "day" + (i + 1);
      days[i].num = "DAY " + (i + 1);
      days[i].date = isoDayLabel(iso);
    }
    plan.added.forEach(a => days.push(blankDay(a.n, a.iso)));

    m.dateStart = plan.newStart;
    m.dateEnd = plan.newEnd;
    if (!plan.eyebrowCustomised) m.eyebrow = plan.derivedNewEyebrow;
    else notices.push("「日期細字」你自己改過，所以冇動佢——想更新就入去改返。");
    if (plan.factIdx >= 0) m.facts[plan.factIdx] = `${plan.newCount} 日行程`;

    // A stay whose whole range fell off the end must not silently re-point at
    // the entire trip — that would invent a hotel booking nobody made.
    const validIds = new Set(days.map(d => d.id));
    (snap.stays || []).forEach(s => {
      const fromGone = s.from && !validIds.has(s.from);
      const toGone = s.to && !validIds.has(s.to);
      if (!fromGone && !toGone) return;
      const last = days[days.length - 1] ? days[days.length - 1].id : "";
      if (fromGone && toGone){
        s.from = last; s.to = last;
        notices.push(`「${plain(s.name) || "住宿"}」本來排喺已經冇咗嘅日子，暫時擺咗喺最後一日，記得改返。`);
      } else {
        if (fromGone) s.from = days[0] ? days[0].id : "";
        if (toGone) s.to = last;
      }
      if (dayIndexById(snap, s.from) > dayIndexById(snap, s.to)){ const t = s.from; s.from = s.to; s.to = t; }
    });
    syncAccommodation(snap);

    // a view/selection pointing at a day that no longer exists
    if (!dayById(state.view) && state.view !== "overview" && state.view !== "notes" && !boardById(state.view)) state.view = "overview";
    state.open.clear(); state.mapsShut.clear(); state.selectMode = null;

    const bits = [];
    if (plan.added.length) bits.push(`加咗 ${plan.added.length} 日`);
    if (plan.dropped.length) bits.push(`減咗 ${plan.dropped.length} 日`);
    if (plan.relabel.length) bits.push(`更新咗 ${plan.relabel.length} 日嘅日期`);
    return {
      notices, parked, boardName,
      summary: `改咗行程日期（${plan.oldStart || "?"} → ${plan.newStart}）${bits.length ? "：" + bits.join("、") : ""}`,
    };
  }

  // ==================================================================
  // BOOKMARK BOARDS — a place to park "maybe" spots that aren't slotted
  // into a day yet. Same stop shape as an itinerary stop (so nothing is
  // lost moving a place either direction), just no time/connectors.
  // ==================================================================
  function blankBoardItem(){
    return { title:"", kr:"", desc:"", mapUrl:"", photoUrl:"", placeId:"", lat:null, lng:null, tip:"", niecepick:[] };
  }
  // distinct from DAY_HEX so a list never gets mistaken for a day's own route colour
  const BOARD_PALETTE = ["#6B6FD1","#E38FB0","#3CC177","#E5964A","#4FB6D9","#B98CE0","#D9574A","#7FD1BE"];
  function pickBoardColor(existingBoards){
    const used = new Set((existingBoards || []).map(b => b.color).filter(Boolean));
    const free = BOARD_PALETTE.find(c => !used.has(c));
    return free || BOARD_PALETTE[(existingBoards || []).length % BOARD_PALETTE.length];
  }
  function newBoard(name){
    const id = "board_" + Date.now().toString(36) + Math.random().toString(36).slice(2, 6);
    return { id, name: name || "新清單", items: [], color: pickBoardColor(state.snapshot && state.snapshot.boards) };
  }
  function boardById(id){
    return (state.snapshot.boards || []).find(b => b.id === id);
  }
  // 表妹美食清單 used to be a standalone, hand-maintained array (snap.foodCards)
  // completely detached from day.items — its "day" field was plain text
  // ("Day 2"), never a real dayId, so deleting or moving the actual stop
  // never touched it: it kept claiming a niece's pick was still scheduled
  // long after it wasn't. Turning each entry into a real board item means it
  // gets the SAME live re-check every other board item already has
  // (findInItinerary, re-derived fresh every render — see boardItemHtml)
  // instead of a second, silently-drifting copy of the same information,
  // and it can be copied into a specific day the same way any board item can.
  function migrateFoodCardsToBoard(snap){
    if (!snap || !Array.isArray(snap.foodCards) || !snap.foodCards.length) return;
    const items = snap.foodCards.map(f => {
      const nameHtml = String(f.name || "");
      const krMatch = nameHtml.match(/<span class="kr">([^<]*)<\/span>/);
      return {
        title: plain(nameHtml.split(/<span/)[0]) || plain(nameHtml),
        kr: krMatch ? plain(krMatch[1]) : "",
        desc: f.must || "", mapUrl: "", photoUrl: "", placeId: "", lat: null, lng: null, tip: "",
        niecepick: f.niecepicks || [],
        eatMeta: f.chips || [],
      };
    });
    snap.boards = snap.boards || [];
    snap.boards.push({
      id: "board_niecepicks_" + Date.now().toString(36),
      name: "表妹美食清單",
      color: pickBoardColor(snap.boards),
      items,
    });
    snap.foodCards = [];
  }

  // older snapshots (saved before this feature existed) simply have no boards array,
  // and boards saved before per-list colour existed have no colour — assign one so
  // the overview map has something consistent to draw with
  function normalizeSnapshot(snap){
    if (snap && !Array.isArray(snap.boards)) snap.boards = [];
    if (snap && !Array.isArray(snap.sections)) snap.sections = [];
    if (snap && !Array.isArray(snap.hiddenSections)) snap.hiddenSections = [];
    migrateStays(snap);
    migrateFoodCardsToBoard(snap);
    if (snap) snap.boards.forEach(b => { if (!b.color) b.color = pickBoardColor(snap.boards); });
    // The sticky day-nav's short label is per-day editable data. It used to
    // fall back to a fixed table of one particular trip's day themes, which
    // meant every OTHER trip's nav pills showed that trip's place names.
    if (snap && Array.isArray(snap.days)) snap.days.forEach(d => {
      if (d.shortTag == null) d.shortTag = "";
    });
    // Destination coordinates / search hint / date range are per-trip data,
    // set when the trip is created. Deliberately NOT backfilled with any
    // default here: a missing field must render blank and prompt the user to
    // fill it in, never silently inherit some other trip's city or dates.
    if (snap) snap.meta = snap.meta || {};
    // per-session opt-in for "let AI refresh this with the latest info" —
    // defaults true for the two built-in sessions (matches the behaviour
    // they already had, since they've always had a live-check button).
    if (snap && !snap.aiRefreshToggles) snap.aiRefreshToggles = { weather: true, foliage: true };
    // custom sections gained the same opt-in refresh mechanism; AI-authored
    // ones default ON (they already came from a topic, so refreshing makes
    // sense), hand-written ones default OFF (no topic to refresh against
    // unless the user sets one via ✏️).
    if (snap && Array.isArray(snap.sections)) snap.sections.forEach(s => {
      if (s.aiRefresh == null) s.aiRefresh = s.source === "ai";
      if (s.topic == null) s.topic = s.title || "";
      // 📌 was never chosen — it was this app's default for every new section,
      // so every section wore the same pin. Clear that one, and only that one:
      // an icon the family actually picked is theirs and stays.
      if (s.icon === "📌") s.icon = "";
    });
    return snap;
  }
  const MODES = [
    { key:"walk",  icon:"🚶", label:"步行" },
    { key:"metro", icon:"🚇", label:"地鐵" },
    { key:"bus",   icon:"🚌", label:"巴士" },
    { key:"taxi",  icon:"🚕", label:"的士" },
    { key:"air",   icon:"✈",  label:"航班" }
  ];
  // Legacy segments carry their mode only as an emoji inside stored HTML, so
  // that stays readable; new ones record `mode` outright and the icon is drawn
  // at render time from the current icon set instead of being baked into data.
  function segMode(seg){
    if (seg && typeof seg === "object" && seg.mode) return seg.mode;
    const s = String((seg && seg.html) != null ? seg.html : seg || "");
    if (s.includes("🚶")) return "walk";
    if (s.includes("🚇") || s.includes("🚉") || s.includes("🚊") || s.includes("🚆")) return "metro";
    if (s.includes("🚌")) return "bus";
    if (s.includes("🚕") || s.includes("🚗")) return "taxi";
    if (s.includes("✈")) return "air";
    return "other";
  }
  const MODE_ICON = { walk:"walk", metro:"metro", bus:"bus", taxi:"car", air:"plane", other:"walk" };
  // what to draw for a segment, old data or new
  function segHtmlOf(seg){
    const mode = segMode(seg);
    const text = seg && seg.text != null ? seg.text : segPlain(seg && seg.html);
    return `<span class="icon">${icon(MODE_ICON[mode] || "walk")}</span>${esc(text)}`;
  }
  // The time column only works if the digits line up, so pull the clock time
  // out of whatever was typed ("約 14:00", "14:00 前後") and set it on its own.
  // "約" becomes a leading ~ so it survives without costing a whole column of
  // width; anything with no clock time in it falls back to the raw words.
  function timeLabelHtml(t){
    const raw = plain(t).trim();
    if (!raw) return "";
    const m = raw.match(/(\d{1,2})\s*[:：]\s*(\d{2})/);
    if (!m) return `<span class="raw">${esc(raw)}</span>`;
    const approx = /約|大概|前後|左右|ish/i.test(raw);
    const hhmm = `${m[1].padStart(2, "0")}:${m[2]}`;
    return `${approx ? `<span class="approx">~</span>` : ""}${esc(hhmm)}`;
  }

  function segPlain(html){
    const tmp = document.createElement("div");
    tmp.innerHTML = String(html || "");
    return tmp.textContent.replace(/^[\s\u{1F300}-\u{1FAFF}\u{2600}-\u{27BF}️]+/u, "").trim();
  }
  function buildSeg(mode, text, route){
    const m = MODES.find(x => x.key === mode) || MODES[0];
    // `html` is kept for older clients and for the export/diff paths that read
    // it; `mode` + `text` are what this client actually renders from.
    const seg = { kind:"connector", mode:m.key, text:String(text || ""),
                  html:`<span class="icon">${m.icon}</span>${esc(text)}` };
    if (route) seg.route = route;   // e.g. 安國 ─3號線・4站─ 忠武路 ─4號線・2站─ 明洞
    return seg;
  }

  // Quick outbound links for a stop. Local-language name searches better than
  // the Cantonese title, so prefer it; appending the trip's destination hint
  // narrows a bare name like "황생가칼국수" to the right city — read fresh off
  // meta (not hardcoded) so this works for whichever trip is loaded.
  function searchTerm(s){
    const kr = plain(s.kr), title = plain(s.title);
    return kr || title;
  }
  function destHint(){
    const m = (state.snapshot && state.snapshot.meta) || {};
    return m.destinationLocal ? " " + m.destinationLocal : "";
  }
  function googleSearchUrl(s){
    const q = searchTerm(s);
    return q ? `https://www.google.com/search?q=${encodeURIComponent(q + destHint())}` : null;
  }
  // The Maps "search action" URL (Google's documented format) lands on the
  // place card with its star rating and review count visible immediately.
  function googleReviewsUrl(s){
    const q = searchTerm(s);
    if (!q) return null;
    const base = `https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(q + destHint())}`;
    return s.placeId ? `${base}&query_place_id=${encodeURIComponent(s.placeId)}` : base;
  }

  // how to name a stop to Google: its place id if we have one, else coordinates,
  // else just its name
  function stopRef(s){
    if (!s) return null;
    if (s.placeId) return { placeId: s.placeId };
    if (Number.isFinite(s.lat) && Number.isFinite(s.lng)) return { lat: s.lat, lng: s.lng };
    if ((s.title || "").trim()) return { text: s.title.trim() };
    return null;
  }

  // The day's first stop is usually a "leaving the hotel" logistics line
  // ("酒店寄存行李後出發") with no coordinates or Google id of its own —
  // stopRef() falls back to sending that whole description SENTENCE to
  // Google as free-text origin, which can silently resolve to an arbitrary
  // wrong place (this is what broke a leg's recomputed route after a
  // mid-day stop between it and the hotel got deleted: the "fixed" result
  // still looked plausible, just from the wrong starting point). Use the
  // day's real accommodation coordinates for that leg instead.
  function stayRef(day){
    const stay = stayForDay(state.snapshot, day);
    if (stay && Number.isFinite(Number(stay.lat)) && Number.isFinite(Number(stay.lng)))
      return { lat: Number(stay.lat), lng: Number(stay.lng) };
    return null;
  }

  // After the order changes, the transit note before a stop describes a journey
  // that no longer happens. Flag those, then ask Google for the real numbers.
  async function refreshTransit(day, indices){
    let units = toUnits(day.items);
    // nothing comes before the first stop of a day, so it carries no transit note
    const first = firstStopUnit(units);
    const firstStopObj = first >= 0 ? units[first].stop : null;
    if (first >= 0 && units[first].seg){ units[first].seg = null; day.items = fromUnits(units); }
    // notes sit between stops without being one, so "the leg into this stop"
    // starts at the previous STOP, not simply at the previous unit
    const prevStop = i => { for (let j = i - 1; j >= 0; j--) if (units[j].stop) return units[j].stop; return null; };
    const todo = [...new Set(indices)]
      .filter(i => i > 0 && i < units.length && units[i] && units[i].stop && i !== first);
    if (!todo.length){ render(); return; }

    todo.forEach(i => {
      units[i].seg = Object.assign({ kind:"connector", html:"" }, units[i].seg, { stale:true, checking:true });
    });
    day.items = fromUnits(units);
    render();

    let why = "";
    for (const i of todo){
      const prev = prevStop(i);
      const from = (prev && prev === firstStopObj && !isRealPlace(prev) && stayRef(day)) || stopRef(prev);
      const to = stopRef(units[i].stop);
      let done = false;
      if (from && to){
        try {
          const r = await callAi({ action:"transit", from, to });
          if (r && r.ok !== false && r.text){ units[i].seg = buildSeg(r.mode || "walk", r.text, r.route); done = true; }
          else if (r && r.message) why = r.message;
        } catch (e){ why = e.message; }   // leave it flagged rather than show a wrong number
      }
      if (!done) units[i].seg.checking = false;
      day.items = fromUnits(units);
      render();
    }
    if (why) state.transitProblem = why;
    render();
    await saveNow("更新咗交通時間", true);
  }

  // ==================================================================
  // RENDER — shell
  // ==================================================================
  // Bookmark boards used to live at the tail end of this strip, past all 6
  // day tabs — invisible unless you scrolled all the way right, and easy to
  // not know existed at all. They now have their own always-visible entry
  // point (the 📌 button in the bottom dock) instead of competing for space
  // here; this strip stays just overview + days + notes, however many boards
  // you make.
  // Most shortTags were written as "D3 聖水洞" back when the tab didn't print
  // the day number itself, so the tab read "D3  D3 聖水洞". The number is the
  // tab's own label now, so drop a leading copy of it from the tag.
  function shortTagText(d){
    const n = String(d.id).replace("day", "");
    return String(d.shortTag || "").replace(new RegExp("^\\s*D" + n + "\\s*[.·・:：-]?\\s*", "i"), "").trim();
  }

  function renderLines(){
    const el = $("#lines");
    const days = state.snapshot ? state.snapshot.days : [];
    el.innerHTML = `
      <button class="linebtn" role="tab" data-go="overview" aria-selected="${state.view==='overview'}" style="--lc:var(--ink-faint)">
        <span class="bullet"></span><span class="lbl">全程</span>
      </button>
      ${days.map(d => `
        <button class="linebtn" role="tab" data-go="${d.id}" aria-selected="${state.view===d.id}" style="--lc:${dayColorVar(d.id)}">
          <span class="bullet"></span>
          <span class="lbl">D${d.id.replace('day','')}</span>
          <span>${esc(shortTagText(d))}</span>
        </button>`).join("")}
      <button class="linebtn" role="tab" data-go="notes" aria-selected="${state.view==='notes'}" style="--lc:var(--info)">
        <span class="bullet"></span><span>問過啲咩</span>
      </button>
    `;
    el.querySelectorAll("[data-go]").forEach(b => b.addEventListener("click", () => {
      state.view = b.dataset.go;
      state.open.clear();
      state.renamingBoard = null;
      window.scrollTo({ top: 0, behavior: "auto" });
      render();
      const active = $("#lines [aria-selected='true']");
      if (active) active.scrollIntoView({ block:"nearest", inline:"center" });
    }));
  }

  // The topbar brandmark sits outside #app (it's part of the fixed header,
  // not the per-view render), so it needs its own explicit update — it used
  // to be static markup hardcoded to "Seoul"/"서울 · 가을", which silently
  // kept saying Seoul on every other trip.
  function renderBrandmark(){
    const m = (state.snapshot && state.snapshot.meta) || {};
    const sys = $(".brandmark .sys"), ko = $(".brandmark .ko");
    if (sys) sys.textContent = m.title || m.destinationLocal || "行程";
    if (ko) ko.textContent = (m.destinationLocal && m.destinationLocal !== m.title) ? m.destinationLocal : (m.eyebrow || "");
    // The tab title is markup, so it can't come from the snapshot at parse
    // time — set it here or every trip shares whatever was typed in the file.
    const t = plain(m.title || "").trim();
    document.title = t ? `${t}${m.eyebrow ? " ｜ " + plain(m.eyebrow) : ""}` : "行程";
  }
  function render(){
    renderBrandmark();
    renderLines();
    const app = $("#app");
    if (!state.snapshot){ app.innerHTML = `<p class="loading">載入緊行程…</p>`; return; }
    if (state.view === "notes"){ app.innerHTML = notesPageHtml(); wireNotes(); return; }
    const board = boardById(state.view);
    if (board){ app.innerHTML = boardHtml(board); wireBoard(board); return; }
    app.innerHTML = state.view === "overview" ? overviewHtml() : dayHtml(dayById(state.view));
    if (state.view === "overview") wireOverview(); else wireDay(dayById(state.view));
  }

  // ==================================================================
  // RENDER — overview
  // ==================================================================
  // A pencil next to a heading, wired generically to HOME_EDITORS[key]
  function secEditBtn(key){
    return `<button class="secedit" data-editsec="${key}" title="改呢一段" aria-label="改呢一段">${icon("pencil")}</button>`;
  }
  // edit + hide, for the fixed home-page panels ("session" 用戶叫法) that
  // aren't custom sections but should still be removable. Hiding is soft —
  // it only stops overviewHtml from rendering the block; the underlying data
  // (stays, tripBrief, etc.) is untouched, so nothing else that reads it
  // (day pages, the AI calls) is affected, and it can always be brought back.
  const HIDDEN_SECTION_LABELS = { acc:"住宿", weather:"天氣", clothing:"點著衫", access:"無障礙標記", ai:"AI 設定", foliage:"季節提示" };
  // editKey lets a block whose editor lives under a different name (季節提示 is
  // edited by the shared "notes" sheet) still get exactly ONE pencil — passing
  // the editor key here instead of adding a second secEditBtn beside it.
  function secTools(key, editKey){
    const label = HIDDEN_SECTION_LABELS[key] || key;
    return `<span class="sectools">${secEditBtn(editKey || key)}<button class="secedit secdel" data-delsec="${key}" data-seclabel="${esc(label)}" title="隱藏呢一段" aria-label="隱藏呢一段">${icon("trash")}</button></span>`;
  }
  function isSectionHidden(snap, key){ return Array.isArray(snap.hiddenSections) && snap.hiddenSections.includes(key); }

  // 「出發前必讀」入面嗰4嚿——住宿/天氣/點著衫/無障礙——用戶可以拉住 ⠿ 自己
  // 排先後，順序存喺 snap.homeOrder。新裝／舊快照冇呢個欄嘅話，用返而家嘅
  // 預設次序；如果之後加多種類，未存過嘅key會自動補喺尾，唔會冇咗。
  const HOME_ORDER_KEYS = ["acc", "weather", "clothing", "access"];
  function homeOrder(snap){
    const saved = Array.isArray(snap.homeOrder) ? snap.homeOrder.filter(k => HOME_ORDER_KEYS.includes(k)) : [];
    const rest = HOME_ORDER_KEYS.filter(k => !saved.includes(k));
    return [...saved, ...rest];
  }
  async function reorderHomeBlocks(snap, from, to){
    const order = homeOrder(snap);
    const [moved] = order.splice(from, 1);
    order.splice(to, 0, moved);
    snap.homeOrder = order;
    render();
    await saveNow("調整咗主頁段落次序");
  }
  const HOME_DRAG_HANDLE = `<button class="secedit sechandle" data-hsdrag title="拉上拉落改次序" aria-label="拉上拉落改次序">${icon("grip")}</button>`;
  // Used to say "10 月下旬天氣" no matter what trip was loaded — a leftover
  // Seoul-trip literal that silently mislabelled every other destination's
  // weather block. Derived from the trip's own dates instead.
  function weatherHeadingLabel(meta){
    const ds = String((meta && meta.dateStart) || "").split("-");
    const de = String((meta && meta.dateEnd) || "").split("-");
    if (ds.length < 2) return "天氣參考";
    const sm = +ds[1], sd = +ds[2];
    if (de.length < 2 || +de[1] === sm){
      const third = sd <= 10 ? "上旬" : sd <= 20 ? "中旬" : "下旬";
      return `${sm} 月${third}天氣`;
    }
    return `${sm} 月 — ${+de[1]} 月天氣`;
  }
  function homeBlockHtml(d, key){
    if (isSectionHidden(d, key)) return "";
    if (key === "acc"){
      return `<div class="hsblock" data-hskey="acc">
        <div class="k">住宿${secTools("acc")}${HOME_DRAG_HANDLE}</div>
        ${(d.stays || []).length ? (d.stays || []).map(st => `
          <div class="stayrow">
            <div class="staywhen">${esc(stayRangeLabel(d, st))}</div>
            <div class="v">${esc(st.name || "未填")}</div>
            ${st.desc ? `<div class="d">${esc(st.desc)}</div>` : ""}
            ${st.hoursChip ? `<div class="chiprow"><span class="meta-chip hours">${esc(st.hoursChip)}</span></div>` : ""}
            ${st.warning ? `<div class="d">${esc(st.warning)}</div>` : ""}
            ${st.mapUrl ? `<div class="chiprow"><a class="maplink" href="${esc(st.mapUrl)}" target="_blank" rel="noopener">${icon("pin")}喺地圖開啟</a></div>` : ""}
          </div>`).join("")

  async function hideSection(key, label){

    if (!snap.hiddenSections.includes(key)) snap.hiddenSections.push(key);
    render();

  async function unhideSection(key, label){
    const snap = state.snapshot;
    snap.hiddenSections = (snap.hiddenSections || []).filter(k => k !== key);
    render();

  // A quick "check the real thing now" button sitting right under the static
  // historical-average content, instead of only living inside the separate
  // AI 助手 sheet — the copy said "check 返實時預報" but gave no way to
  // actually do that without leaving the page to hunt for the right button.
  // Gated on a per-session opt-in toggle (aiRefreshToggleHtml) — a user who
  // doesn't want THIS particular block bothering Gemini can turn it off, and
  // the button just disappears rather than sitting there disabled.
  function liveCheckButtonHtml(kind, label){
    const last = (state.snapshot.lastLiveCheck || {})[kind];
    return `<button class="btn" data-livecheck="${kind}" style="margin-top:9px;">${esc(label)}</button>
            <div class="lastupd" id="lastupd-${kind}">${last ? "上次 check：" + esc(whenLabel(last)) : ""}</div>
            <div class="ai-out" id="livecheck-${kind}"></div>`;
  }
  // "16:20" today, "8月15日 16:20" before that — a bare ISO string tells the
  // reader nothing about whether what they're looking at is fresh.
  function whenLabel(iso){
    const t = new Date(iso);
    if (!Number.isFinite(t.getTime())) return "";
    const now = new Date();
    const mins = Math.round((now - t) / 60000);
    if (mins < 1) return "啱啱";
    if (mins < 60) return mins + " 分鐘前";
    const sameDay = t.toDateString() === now.toDateString();
    const hm = t.toLocaleTimeString("zh-HK", { hour:"2-digit", minute:"2-digit", hour12:false });
    return sameDay ? "今日 " + hm : `${t.getMonth() + 1}月${t.getDate()}日 ${hm}`;
  }
  function markLiveChecked(kind){
    const d = state.snapshot;
    d.lastLiveCheck = d.lastLiveCheck || {};
    d.lastLiveCheck[kind] = new Date().toISOString();
    // patch the label in place — a full render would wipe the answer the user
    // is reading right now
    const el = document.getElementById("lastupd-" + kind);
    if (el) el.textContent = "上次 check：啱啱";
    saveNow("check 咗最新資料", true);
  }
  // There used to be a 「🔄 AI 自動更新（開）」 checkbox in front of every one of
  // these buttons, gating whether the button showed at all. It never actually
  // auto-updated anything — nothing here runs without someone tapping it — so
  // the checkbox was one extra line of UI per block explaining a setting that
  // did nothing but hide a button. The stored aiRefresh / aiRefreshToggles
  // fields are left alone in old snapshots; they're simply not read any more.
  function wireLiveChecks(){
    document.querySelectorAll("[data-livecheck]").forEach(btn => btn.addEventListener("click", async () => {
      if (btn.disabled) return;
      const kind = btn.dataset.livecheck;   // "weather" | "foliage"
      const out = document.getElementById(`livecheck-${kind}`);
      if (!out) return;
      btn.disabled = true;
      const stop = busyIn(out, { steps:[kind === "weather" ? "問緊實時天氣" : "問緊當地季節情況"], hint:"大約 10-30 秒。" });
      try {
        const r = await callAi({ action: kind });
        stop();
        if (kind === "weather"){
          out.innerHTML = `<div class="ai-msg">${esc(r.summary||"")}</div>` +
                          (r.aiSummary ? `<div class="ai-msg">${esc(r.aiSummary)}</div>` : "") +
                          (!r.aiSummary && r.aiNotice ? `<div class="ai-msg">${esc(r.aiNotice)}</div>` : "");
          saveAiNote("weather", "實時天氣", [r.summary, r.aiSummary || r.aiNotice].filter(Boolean).join("\n\n"));
          if (r.summary || r.aiSummary) markLiveChecked(kind);
        } else {
          const a = r.aiSummary || r.message || "冇回覆";
          out.innerHTML = `<div class="ai-msg">${esc(a)}</div>`;
          if (r.aiSummary){ saveAiNote("foliage", "季節情況", a); markLiveChecked(kind); }
        }
      } catch (e){
        stop(); out.innerHTML = `<div class="ai-msg">出咗問題：${esc(e.message)}</div>`;
      }
      btn.disabled = false;
    }));
  }

            <button class="btn" data-secrefresh="${i}" style="margin-top:9px;">${icon("refresh")}問 AI 攞「${esc(s.topic || s.title || "呢個題目")}」最新資料</button>

  function blankSection(){ return { icon:"", title:"", sub:"", lines:[], links:[], source:"manual", topic:"", aiRefresh:false }; }
  async function reorderCustomSections(snap, from, to){
    if (!Array.isArray(snap.sections)) return;
    const [moved] = snap.sections.splice(from, 1);
    snap.sections.splice(to, 0, moved);
    render();
    await saveNow("調整咗自己加嘅 section 次序");
  }

  function openSectionEditor(idx){
    const d = state.snapshot;
    if (!Array.isArray(d.sections)) d.sections = [];
    const s = idx == null ? blankSection() : d.sections[idx];
    if (!s) return;
    openEditSheet(idx == null ? "加一個 section" : "改「" + (s.title || "未命名") + "」",
      "一行一個重點。連結一行一個，寫做「名 | https://…」。", [
        { key:"icon",  label:"標題前面嘅符號（唔填就冇）", type:"text", value:s.icon || "", placeholder:"留空就得" },
        { key:"title", label:"標題",  type:"text", value:s.title || "", placeholder:"例如：手信買咩好" },
        { key:"sub",   label:"副標題（可以留空）", type:"text", value:s.sub || "" },
        { key:"lines", label:"內容（一行一個重點）", type:"lines", value:(s.lines||[]).join("\n"), rows:9 },
        { key:"links", label:"連結（一行一個，名 | 網址）", type:"lines",
          value:(s.links||[]).map(l => `${l.name || ""} | ${l.url || ""}`).join("\n"), rows:3 },
        { key:"topic", label:"AI 更新用嘅題目",
          hint:"撳嗰粒「問 AI 攞最新資料」嗰陣，會攞呢個題目再問一次 AI。留空就用返標題。",
          type:"text", value:s.topic || "", placeholder:"例如：手信買咩好" },
      ], async out => {
        const links = (out.links || []).map(row => {
          const parts = String(row).split("|");
          const url = (parts.length > 1 ? parts.slice(1).join("|") : parts[0]).trim();
          const name = (parts.length > 1 ? parts[0] : "").trim() || url;
          return /^https?:\/\//.test(url) ? { name, url } : null;   // a broken link is worse than none
        }).filter(Boolean);
        const next = Object.assign({}, s, {
          icon: out.icon || "", title: out.title || "未命名", sub: out.sub || "",
          lines: out.lines || [], links, topic: out.topic || "",
        });
        if (idx == null) d.sections.push(next); else d.sections[idx] = next;
        render();
        await saveNow(idx == null ? `加咗一個 section：${next.title}` : `改咗 section：${next.title}`);
      });
  }

  // AI writes the first draft from a topic; it lands in the same editable
  // shape as a hand-written one, so nothing is locked to the AI's version
  function openNewSectionSheet(){
    openSheet(`
      <h3>加一個 section</h3>
      <p class="sec-sub">例如：手信買咩好、換錢攻略、上網卡、行李清單、雨天備案。</p>
      <div class="askrow">
        <input class="input" id="usec-topic" placeholder="講個題目，例如：手信買咩好">
        <button class="btn primary" id="usec-ai">${icon("sparkle")}AI 幫手寫</button>
      </div>
      <div id="usec-out"></div>
      <button class="btn wide" id="usec-manual" style="margin-top:10px;">我自己寫</button>
    `, sheet => {
      const out = sheet.querySelector("#usec-out");
      const topic = sheet.querySelector("#usec-topic");
      sheet.querySelector("#usec-manual").addEventListener("click", () => { closeLayer(); openSectionEditor(null); });
      sheet.querySelector("#usec-ai").addEventListener("click", async () => {
        const t = topic.value.trim();
        if (!t){ topic.focus(); return; }
        const stop = busyIn(out, { steps:["AI 寫緊內容"], extra:`「${t}」`,
          hint:"AI 要睇埋你哋個行程先寫，大約 10-20 秒。" });
        let r;
        try { r = await callAi({ action:"make-section", topic:t, itinerary: state.snapshot }); }
        catch (e){ stop(); out.innerHTML = `<div class="ai-msg">出咗問題：${esc(e.message)}</div>`; return; }
        stop();
        if (!r || r.ok === false || !r.section){
          out.innerHTML = `<div class="ai-msg">${esc((r && r.message) || "AI 冇回覆到。")}</div>`;
          return;
        }
        const d = state.snapshot;
        if (!Array.isArray(d.sections)) d.sections = [];
        d.sections.push(Object.assign(blankSection(), r.section, { source:"ai", topic:t, aiRefresh:true }));
        closeLayer();
        render();
        await saveNow(`AI 加咗一個 section：${r.section.title || t}`);
        flash("加咗喺主頁下面，可以再改");
      });
    });
  }

  function wireCustomSections(){
    const add = $("#addusec");
    if (add) add.addEventListener("click", openNewSectionSheet);
    document.querySelectorAll("[data-usecedit]").forEach(b =>
      b.addEventListener("click", () => openSectionEditor(+b.dataset.usecedit)));
    document.querySelectorAll("[data-usecdel]").forEach(b => b.addEventListener("click", async () => {
      const i = +b.dataset.usecdel;
      const s = (state.snapshot.sections || [])[i];
      if (!s) return;
      if (!confirm(`刪走「${s.title || "呢個 section"}」？舊版本仲會記住，隨時喺歷史紀錄還原返。`)) return;
      state.snapshot.sections.splice(i, 1);
      render();
      await saveNow(`刪咗 section：${s.title || "未命名"}`);
    }));
    wireSimpleDrag($("#usecorder"), ".usec", "[data-usecdrag]",
      (from, to) => reorderCustomSections(state.snapshot, from, to));
    document.querySelectorAll("[data-secrefresh]").forEach(btn => btn.addEventListener("click", async () => {
      if (btn.disabled) return;
      const i = +btn.dataset.secrefresh;
      const s = (state.snapshot.sections || [])[i];
      if (!s) return;
      const topic = s.topic || s.title;
      if (!topic) return;
      const origText = btn.textContent;
      // A button that only changes its own label gives no way to tell "still
      // thinking" from "hung" — busyIn paints a spinner, a bar and a running
      // seconds counter, which is what makes a slow answer legible as slow.
      const out = document.getElementById("secout-" + i);
      const stop = out ? busyIn(out, { steps:[`AI 更新緊「${topic}」`], hint:"大約 10-30 秒。行得太耐會自動停，唔會一路吊住。" }) : () => {};
      btn.disabled = true; btn.textContent = "AI 更新緊…";
      try {
        const r = await callAi({ action:"make-section", topic, itinerary: state.snapshot });
        stop();
        if (!r || r.ok === false || !r.section){
          if (out) out.innerHTML = `<div class="ai-msg">${esc((r && r.message) || "AI 冇回覆到，試多次？")}</div>`;
          else flash((r && r.message) || "AI 冇回覆到，試多次？");
          btn.disabled = false; btn.textContent = origText;
          return;
        }
        // keep icon/title/topic as the user has them — refresh is about the
        // CONTENT going stale, not about undoing a rename
        s.sub = r.section.sub || ""; s.lines = r.section.lines || []; s.links = r.section.links || [];
        s.updatedAt = new Date().toISOString();
        render();
        // render() rebuilt the block, so the "just updated" note goes into the
        // FRESH element — otherwise it lands on a node already thrown away
        const after = document.getElementById("secout-" + i);
        if (after) after.innerHTML = `<div class="ai-msg ok">${icon("check")}更新咗，內容係上面嗰啲。</div>`;
        await saveNow(`AI 更新咗「${s.title}」嘅資料`);
        flash(`已經更新「${s.title}」`);
      } catch (e){
        stop();
        if (out) out.innerHTML = `<div class="ai-msg">出咗問題：${esc(e.message)}</div>`;
        else flash("出咗問題：" + e.message);
        btn.disabled = false; btn.textContent = origText;
      }
    }));
  }

  function wireOverview(){

  // ==================================================================
  // RENDER — one day
  // ==================================================================
  function dayHtml(day){
    if (!day) return `<p class="loading">搵唔到呢一日。</p>`;
    const lc = dayColorVar(day.id);
    const units = toUnits(day.items);
    const mapOpen = !state.mapsShut.has(day.id);
    const sel = inSelectMode(day) ? state.selectMode : null;
    const firstStop = firstStopUnit(units);
    const stopNums = dayStopNumbers(day);

    return `
      <section class="dayhead" style="--lc:${lc}">
        <div class="kicker">
          <span class="dno">Day ${day.id.replace('day','')}</span>
          <span class="kline"></span>
          <span class="date">${esc(day.date)}</span>
        </div>
        <h2>${esc(day.title)}<button class="secedit" id="dayedit" title="改呢日嘅名／簡介／tag" aria-label="改呢日資料">${icon("pencil")}</button></h2>
        <p class="intro">${esc(day.desc)}</p>
        <div class="chiprow">${(day.badges||[]).map(b=>`<span class="${esc(b.cls)}">${esc(b.text)}</span>`).join("")}</div>
        ${(() => {
          // which hotel this day belongs to, so a multi-hotel trip is obvious
          // on the day you actually need it rather than only on the home page
          const st = stayForDay(state.snapshot, day);
          return st && st.name ? `<div class="daystay">${icon("bed")}呢晚住：<b>${esc(st.name)}</b></div>` : "";
        })()}
        ${hasMappableDay(day) ? `
          <button class="maptoggle" id="maptoggle" aria-expanded="${mapOpen}">
            <span class="mapi">${icon("map")}</span><span>${mapOpen ? "收埋地圖" : "睇呢日地圖"}</span><span class="chev">${icon("chevron")}</span>
          </button>
          ${mapOpen ? `<div class="mapbox" id="map-${day.id}" data-points='${esc(JSON.stringify(buildDayMapPoints(day)))}'></div>
                       ${mapNoteHtml(day)}
                       <p class="mapcap">${esc(day.mapCap||"")}</p>` : ""}
        ` : ""}
        ${sel ? "" : `
          <button class="btn wide dayai" id="dayai" style="margin-top:11px;">${icon("sparkle")}AI 諗行程</button>
          <button class="btn wide" id="swapday" style="margin-top:8px;">${icon("refresh")}同另一日成日對調</button>
        `}
      </section>

      <div class="line" id="line" style="--lc:${lc}">
        ${units.map((u,i) =>
          // a ＋ in every gap, so "between these two places" is a place you can
          // point at rather than something you fake by adding at the end and dragging
          (sel ? "" : insertRowHtml(i)) + unitHtml(day, u, i, units.length, sel, firstStop, stopNums)
        ).join("")}
      </div>
      ${units.length ? "" : `<p class="hint">呢日仲係空白嘅。自己加地點，或者撳下面「AI 諗行程」叫佢由早到晚幫你砌一日（佢會避開其他日子已經去緊嘅地方）。</p>`}

      ${sel ? `
        <div class="selectbar">
          <span>已選 ${sel.selected.size} 個</span>
          <button class="btn" id="selcancel">取消</button>
          <button class="btn primary" id="selmove" ${sel.selected.size ? "" : "disabled"}>搬去邊度</button>
        </div>
      ` : `
        <button class="addstop" id="addstop">＋ 喺最後加地點或者 note</button>
        ${units.length ? `<button class="btn wide" id="selstart" style="margin-top:8px;">揀幾個一齊搬去第度</button>` : ""}
        ${units.length > 1 ? `<button class="recalc" id="recalc" data-stale="${staleCount(units) ? 1 : 0}">${
          staleCount(units)
            ? `${icon("refresh")}重算全日交通（有 ${staleCount(units)} 段待確認）`
            : `${icon("refresh")}重算全日交通`
        }</button>` : ""}
        ${ratableCount(units.map(u => u.stop).filter(Boolean)) ? `<button class="recalc" id="getratings">${icon("star")}攞 Google 評分／營業時間（${ratableCount(units.map(u => u.stop).filter(Boolean))} 個地點未有）</button>` : ""}
        ${photolessCount(units.map(u => u.stop).filter(Boolean)) ? `<button class="recalc" id="getphotos">${icon("camera")}攞返地點相（${photolessCount(units.map(u => u.stop).filter(Boolean))} 個未有）</button>` : ""}

      <footer>
        <div class="fbrand">Day ${day.id.replace('day','')} · ${esc(day.title)}</div>
        撳卡片右上角枝筆就可以改；改完自動儲存，唔使撳掣。<br>
        想喺兩個地方之間插個地點或者 note，撳條線上面嘅 ＋。<br>

  // how many legs are flagged as needing a fresh answer from Google
  function staleCount(units){
    return units.filter((u,i) => i > 0 && u.stop && u.seg && u.seg.stale).length;
  }
  // real places still missing a Google rating (logistics rows never count)
  function ratableCount(stops){
    return stops.filter(s => !Number.isFinite(s.rating) && !s.noRating && (s.placeId || s.mapUrl) && plain(s.title)).length;
  }
  // real places that could have a picture but don't (yet)
  function photolessCount(stops){
    return stops.filter(s => !s.photoUrl && !s.noPhoto && (s.placeId || s.mapUrl) && plain(s.title)).length;
  }

  // a ＋ sitting on the route line, so any gap between two places is somewhere
  // you can tap directly instead of adding at the end and dragging into place
  function insertRowHtml(pos){
    return `<button class="insertrow" data-insert="${pos}" aria-label="喺呢度加地點或者 note"><span class="ins-plus">＋</span></button>`;
  }

  function unitHtml(day, u, i, total, sel, firstStop, stopNums){
    const key = day.id + ":" + i;
    const open = state.open.has(key);
    const s = u.stop;
    const selecting = !!sel;
    const checked = selecting && sel.selected.has(i);

    if (u.note){
      const txt = plain(u.note.text);
      return `
        <div class="unit" data-i="${i}">
          <div class="stop">
            <div class="stop-rail"><span class="stoptime"></span><span class="node note"></span></div>
            <div class="notecard${open ? " open" : ""}">
              <div class="notemain">
                <span class="noteicon">${icon("note")}</span>
                <div class="notetext${txt ? "" : " empty"}">${txt ? esc(txt) : "寫低你想記住嘅嘢…"}</div>
              </div>
              ${selecting ? "" : `
              <div class="cardtools">
                <button class="editbtn" data-open="${key}" title="${open ? "完成編輯" : "編輯"}" aria-label="${open ? "完成編輯" : "編輯"}">${open ? icon("check") : icon("pencil")}</button>
                <div class="draghandle" data-drag="${i}" title="拉上拉落搬位">${icon("grip")}</div>
              </div>`}
              ${!selecting && open ? noteEditorHtml(u.note, i) : ""}
            </div>
          </div>
        </div>`;
    }

    const showSeg = u.seg && i !== firstStop;
    const segBody = !showSeg ? "" :
      u.seg.checking ? `<span class="seg-note">計緊交通時間…</span>` :
      u.seg.stale    ? `<span class="seg-note warn">${icon("warn")}次序改咗，交通時間要再確認${state.transitProblem ? `<br><span class="seg-why">${esc(state.transitProblem)}</span>` : ""}</span>` :
      segHtmlOf(u.seg) + (u.seg.route ? `<span class="seg-route">${esc(u.seg.route)}</span>` : "");
    // one segment, one button — refreshing all of a day's legs to update just
    // one used to burn a Google Directions call per leg every time
    const segRefresh = showSeg && !u.seg.checking
      ? `<button class="segrefresh" data-segrefresh="${i}" title="淨係重新check呢一段交通" aria-label="重新check呢一段交通">${icon("refresh")}</button>` : "";
    const segHtml = showSeg ? `
      <div class="seg${u.seg.stale ? " stale" : ""}" data-mode="${u.seg.stale ? "other" : segMode(u.seg)}">
        <div class="seg-rail"></div>
        <div class="seg-text">${segBody}${segRefresh}</div>
      </div>` : "";

    if (!s) return `<div class="unit" data-i="${i}">${segHtml}</div>`;

    const named = plain(s.title);
    // no picture yet, but it is a real place (we have a map link or a Google id)
    // -> offer a one-tap fetch instead of leaving the row bare
    const fetchable = !s.photoUrl && !s.noPhoto && (s.placeId || s.mapUrl);
    // An empty 62px placeholder box used to sit on every photo-less stop,
    // costing a third of the card's width on a phone to show nothing. Fetching
    // a photo is now a link in the footer row, and the box only exists once
    // there is a picture to put in it.
    const thumb = s.photoUrl
      ? `<div class="thumb"><img src="${esc(s.photoUrl)}" alt="" loading="lazy" data-photoimg="${i}"></div>`
      : "";

    const closedToday = stopClosedOnDay(s, day);
    const chips = []
      .concat((s.niecepick||[]).map(n=>`<span class="niecepick">${esc(n)}</span>`))
      .concat(closedToday ? [`<span class="meta-chip closed">${icon("warn")}呢度星期${esc(weekdayCharOfDate(day.date))}公休，同排定嘅日子撞埋咗</span>`] : [])
      .concat(ratingChip(s) ? [ratingChip(s)] : [])
      // the hand-written "⭐ 4.3" chips predate live ratings; drop them once
      // Google's own number is on the card so the two can't contradict
      .concat((s.eatMeta||[]).filter(c => !(Number.isFinite(s.rating) && /^⭐/.test(c.text||""))).map(c=>`<span class="${esc(c.cls)}">${esc(c.text)}</span>`))
      .concat((s.accessBadges||[]).map(b=>`<span class="${esc(b.cls)}">${esc(b.text)}</span>`))
      .join("");

    // quick outbound links — only for stops that are a real, named place
    // (logistics rows like "酒店出發" have no mapUrl and get none of this)
    const links = [];
    if (s.mapUrl) links.push(`<a class="maplink" href="${esc(s.mapUrl)}" target="_blank" rel="noopener">${icon("pin")}地圖</a>`);
    if (s.mapUrl){
      const gr = googleReviewsUrl(s), gs = googleSearchUrl(s);
      if (gr) links.push(`<a class="maplink" href="${esc(gr)}" target="_blank" rel="noopener">${icon("star")}評論</a>`);
      if (gs) links.push(`<a class="maplink" href="${esc(gs)}" target="_blank" rel="noopener">${icon("search")}搜尋</a>`);
    }
    if (fetchable) links.push(`<button class="maplink" data-getphoto="${i}">${icon("camera")}搵張相</button>`);

    return `
      <div class="unit" data-i="${i}">
        ${segHtml}
        <div class="stop">
          <div class="stop-rail">
            <span class="stoptime">${timeLabelHtml(s.time)}</span>
            <span class="node${stopNums && stopNums.has(i) ? " numbered" : ""}" data-type="${esc(s.type||'normal')}">${stopNums && stopNums.has(i) ? stopNums.get(i) : ""}</span>
          </div>
          <div class="stopcard${open ? " open" : ""}${selecting ? " selecting" : ""}${checked ? " checked" : ""}">
            <div class="stopmain"${selecting ? ` data-select="${i}"` : ""}>
              ${selecting ? `<span class="selbox">${checked ? icon("check") : ""}</span>` : ""}
              ${thumb}
              <div class="stopbody">
                <div class="stopname ${named ? "" : "unnamed"}">${named ? esc(named) : "未改名嘅地點"}${s.kr ? `<span class="kr">${esc(plain(s.kr))}</span>` : ""}</div>
                ${s.desc ? `<div class="stopdesc">${esc(s.desc)}</div>` : ""}
                ${chips ? `<div class="chiprow">${chips}</div>` : ""}
              </div>
            </div>
            ${selecting ? "" : `
            <div class="cardtools">
              <button class="editbtn" data-open="${key}" title="${open ? "完成編輯" : "編輯"}" aria-label="${open ? "完成編輯" : "編輯"}">${open ? icon("check") : icon("pencil")}</button>
              <div class="draghandle" data-drag="${i}" title="拉上拉落搬位">${icon("grip")}</div>
            </div>`}
            ${s.eatboxHtml ? `<div class="eatbox">${s.eatboxHtml}</div>` : ""}
            ${s.tip ? `<div class="tipbox">${esc(s.tip)}</div>` : ""}
            ${bookingBoxHtml(s)}
            ${links.length ? `<div class="stopfoot">${links.join("")}</div>` : ""}
            ${!selecting && open ? editorHtml(day, u, i, total) : ""}
          </div>
        </div>
      </div>`;
  }

  function noteEditorHtml(note, i){
    return `
      <div class="editor" data-noteeditor="${i}">
        <div class="field">

  function editorHtml(day, u, i, total){
