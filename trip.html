<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#F1F3EF" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0E1211" media="(prefers-color-scheme: dark)">
<title>DumboFly</title>
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" href="/icons/icon-v2.svg" type="image/svg+xml">
<link rel="icon" href="/icons/icon-32-v2.png" sizes="32x32">
<link rel="apple-touch-icon" href="/icons/apple-touch-icon-v2.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<!-- "default" rather than "black-translucent": the top bar has no safe-area
     inset of its own, so letting content run under the status bar would put
     the notch through the trip's name. -->
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="DumboFly">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@75..125,400..800&family=Noto+Sans+HK:wght@300..900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<style>
/* ============================================================
   LINE MAP — design tokens

   The family will spend this trip on the Seoul metro, and the
   itinerary already knows every leg between stops. So the honest
   structure is not a page of sections: it is a line diagram.
   A day is a LINE, a stop is a STATION, a connector is the ride
   between them.

   That is why colour is a system here rather than an accent.
   Each day owns one hue, drawn from what they are flying out to
   see — ginkgo, maple, pine, autumn sky, persimmon, plum — and
   that hue is the same in the tab, the rail, the station dot and
   the route list. You should be able to tell which day you are
   looking at with the screen at arm's length.

   Everything that is not the itinerary stays grey. Colour means
   "this is a day"; nothing else is allowed to borrow it.
   ============================================================ */
:root{
  color-scheme: light dark;

  /* A cool, faintly green paper. Deliberately not the warm cream
     that every generated travel page reaches for. */
  --paper:#F1F3EF;
  --surface:#FFFFFF;
  --surface-2:#E8ECE6;
  --ink:#13181A;
  --ink-soft:#5A6560;
  --ink-faint:#8A948F;
  --rule:#D8DED7;
  --rule-soft:#E6EAE4;

  /* hairlines and flat fills do the work; shadows stay almost invisible */
  --shadow-1:0 1px 2px rgba(19,24,26,.04);
  --shadow-2:0 10px 32px -14px rgba(19,24,26,.24), 0 2px 6px rgba(19,24,26,.05);

  /* the six lines. Days past the sixth are generated (see dayColorVar). */
  --d1:#C08A00;   /* 銀杏 ginkgo   */
  --d2:#BE3E28;   /* 楓   maple    */
  --d3:#2A7355;   /* 松   pine     */
  --d4:#2665A0;   /* 天   sky      */
  --d5:#C4651A;   /* 柿   persimmon*/
  --d6:#6F4682;   /* 紫   plum     */
  --day-l:36%;

  --ok:#2A7355;      --ok-bg:#E4EDE8;
  --warn:#8A6100;    --warn-bg:#F3EEDF;
  --danger:#BE3E28;  --danger-bg:#F6E7E4;
  /* legacy aliases: these class names are baked into saved itinerary data,
     so they still resolve — they just stop shouting */
  --niece:#6F4682;   --niece-bg:#EFE9F2;
  --info:#2665A0;    --info-bg:#E4EBF2;
  --bookmark:#5A6560;--bookmark-bg:#E8ECE6;

  /* Archivo carries the numerals, and the numerals are the spine of a
     timetable. Its width axis gives the display face without a second
     family, so there is no separate mono: tabular figures do that job. */
  --f-disp:'Archivo','Noto Sans HK','Noto Sans TC',system-ui,sans-serif;
  --f-body:'Archivo','Noto Sans HK','Noto Sans TC','Hiragino Sans HK',system-ui,sans-serif;
  --f-mono:'Archivo','Noto Sans HK',system-ui,sans-serif;
  --mono:var(--f-mono);

  --r-sm:7px;
  --r-md:12px;
  --r-lg:18px;
  --r-xl:26px;

  /* the timetable gutter: time column + the rail it aligns to */
  --gutter:54px;
  --rail-w:var(--gutter);
  --tap:44px;
}

/* One definition, applied by either the system preference or the toggle,
   so the two can never drift apart. */
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --paper:#0E1211;
    --surface:#161B1A;
    --surface-2:#1E2422;
    --ink:#EAEEEB;
    --ink-soft:#98A39E;
    --ink-faint:#6C7773;
    --rule:#252C2A;
    --rule-soft:#1B2120;
    --shadow-1:0 1px 2px rgba(0,0,0,.4);
    --shadow-2:0 12px 36px -16px rgba(0,0,0,.85), 0 2px 8px rgba(0,0,0,.45);
    --d1:#E0A93C; --d2:#E2705A; --d3:#4FAE80; --d4:#5A9AD4; --d5:#E08F4A; --d6:#A882C0;
    --day-l:64%;
    --ok:#4FAE80;      --ok-bg:#132520;
    --warn:#E0A93C;    --warn-bg:#241E12;
    --danger:#E2705A;  --danger-bg:#261815;
    --niece:#A882C0;   --niece-bg:#1E1826;
    --info:#5A9AD4;    --info-bg:#131E27;
    --bookmark:#98A39E;--bookmark-bg:#1E2422;
  }
}
:root[data-theme="dark"]{
  --paper:#0E1211;
  --surface:#161B1A;
  --surface-2:#1E2422;
  --ink:#EAEEEB;
  --ink-soft:#98A39E;
  --ink-faint:#6C7773;
  --rule:#252C2A;
  --rule-soft:#1B2120;
  --shadow-1:0 1px 2px rgba(0,0,0,.4);
  --shadow-2:0 12px 36px -16px rgba(0,0,0,.85), 0 2px 8px rgba(0,0,0,.45);
  --d1:#E0A93C; --d2:#E2705A; --d3:#4FAE80; --d4:#5A9AD4; --d5:#E08F4A; --d6:#A882C0;
  --day-l:64%;
  --ok:#4FAE80;      --ok-bg:#132520;
  --warn:#E0A93C;    --warn-bg:#241E12;
  --danger:#E2705A;  --danger-bg:#261815;
  --niece:#A882C0;   --niece-bg:#1E1826;
  --info:#5A9AD4;    --info-bg:#131E27;
  --bookmark:#98A39E;--bookmark-bg:#1E2422;
}

/* ---------- navy ----------
   A third choice rather than a second dark: the neutral dark reads as night,
   this one reads as the sky over a city at dusk, which is when most of this
   trip's walking happens. The six line colours are lifted off the blue —
   the sky-blue day especially, which would otherwise sink into the ground
   it is painted on. */
:root[data-theme="navy"]{
  --paper:#0C1420;
  --surface:#141E2E;
  --surface-2:#1B273A;
  --ink:#E8EEF7;
  --ink-soft:#94A6C0;
  --ink-faint:#6B7F9B;
  --rule:#233047;
  --rule-soft:#192334;
  --shadow-1:0 1px 2px rgba(0,0,0,.45);
  --shadow-2:0 12px 36px -16px rgba(0,0,0,.9), 0 2px 8px rgba(0,0,0,.5);
  --d1:#E8B44A; --d2:#E87760; --d3:#4FBE8C; --d4:#6FB4EE; --d5:#EE9A52; --d6:#B48BD4;
  --day-l:66%;
  --ok:#4FBE8C;      --ok-bg:#0F2A22;
  --warn:#E8B44A;    --warn-bg:#2A2112;
  --danger:#E87760;  --danger-bg:#2B1A17;
  --niece:#B48BD4;   --niece-bg:#221B2C;
  --info:#6FB4EE;    --info-bg:#122234;
  --bookmark:#94A6C0;--bookmark-bg:#1B273A;
}

*{box-sizing:border-box;}
/* An author rule like .topbtn{display:inline-flex} outranks the UA's
   [hidden]{display:none}, so anything hidden by attribute stayed on screen.
   The reload button, meant for installed mode only, was showing everywhere. */
[hidden]{display:none !important;}
html{
  -webkit-text-size-adjust:100%;
  /* This has to sit on the root element: the UA propagates overscroll-behavior
     to the viewport from <html>, not from <body>, so the copy on body below
     was doing nothing and the browser kept its own pull-to-refresh. */
  overscroll-behavior-y:contain;
}
body{
  margin:0;
  background:var(--paper);
  color:var(--ink);
  font-family:var(--f-body);
  font-size:15px;
  line-height:1.7;
  -webkit-font-smoothing:antialiased;
  padding-bottom:calc(84px + env(safe-area-inset-bottom));
  overflow-wrap:break-word;
  /* the page does its own pull-to-refresh, so the browser must not also do
     one (Chrome Android) or rubber-band the whole document away under it */
  overscroll-behavior-y:contain;
}
:focus-visible{outline:2px solid var(--lc,var(--ink));outline-offset:2px;border-radius:4px;}

/* ---------- backup picks ----------
   The whole point is that three restaurants take up ONE row until you ask
   for them, so collapsed state is a single hairline strip: how many, and
   their names in small type. Nothing here may compete with the stop name. */
.alts{border-top:1px dashed var(--rule);}
.altstoggle{
  display:flex;align-items:center;gap:7px;width:100%;
  padding:8px 14px;background:none;border:0;cursor:pointer;
  font-size:12.5px;color:var(--ink-faint);text-align:left;
}
.altstoggle .i{width:13px;height:13px;flex:0 0 auto;}
.altstoggle .cnt{font-weight:600;color:var(--ink-soft);white-space:nowrap;}
.altstoggle .altpeek{
  flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
}
.altstoggle .caret{margin-left:auto;transition:transform .18s;}
.alts.open .altstoggle .caret{transform:rotate(90deg);}
.altstoggle:active{background:var(--surface-2);}

.altlist{padding:0 14px 10px;display:flex;flex-direction:column;gap:8px;}
.altrow{
  border:1px solid var(--rule);border-radius:var(--r-md);
  padding:9px 11px;background:var(--surface-2);
}
.altn{font-weight:600;font-size:13.5px;}
.altkr{font-family:var(--f-mono);font-size:11px;color:var(--ink-faint);margin-left:6px;}
.altrate{font-size:11.5px;color:var(--ink-faint);margin-left:6px;white-space:nowrap;}
.altrate .i{width:11px;height:11px;vertical-align:-.1em;margin-right:3px;}
.altlinks{display:flex;flex-wrap:wrap;gap:6px;margin-top:7px;}
.altlinks .maplink{font-size:11.5px;padding:3px 8px;}
.maplink.use{border-color:var(--lc,var(--ink));color:var(--lc,var(--ink));font-weight:600;}

/* the "which row do I fold in" picker — a timetable, so the times line up */
.foldlist{display:flex;flex-direction:column;gap:6px;margin-top:10px;}
.foldopt{
  display:flex;align-items:baseline;gap:12px;width:100%;text-align:left;
  padding:11px 13px;border:1px solid var(--rule);border-radius:var(--r-md);
  background:var(--surface);cursor:pointer;font-size:14px;color:var(--ink);
}
.foldopt:active{background:var(--surface-2);}
.foldopt .foldt{
  font-family:var(--f-mono);font-size:12px;color:var(--ink-faint);
  flex:0 0 58px;font-variant-numeric:tabular-nums;
}
.foldopt .foldn{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}

/* ---------- pull to refresh ----------
   Installed as an app there is no browser chrome to pull on, so the gesture
   has to be ours. The badge is pinned under the top bar and is dragged into
   view by the finger, so the distance pulled is visible rather than guessed. */
.ptr{
  position:fixed;left:50%;top:0;z-index:45;
  display:flex;align-items:center;gap:7px;
  padding:7px 14px;border-radius:999px;
  background:var(--surface);border:1px solid var(--rule);
  box-shadow:0 6px 20px rgba(0,0,0,.16);
  font-size:12.5px;color:var(--ink-soft);white-space:nowrap;
  transform:translate(-50%,-150%);
  pointer-events:none;opacity:0;
}
.ptr.settling{transition:transform .28s cubic-bezier(.2,.8,.3,1), opacity .28s;}
/* the chevron points right by default; 90° makes it the "pull down" arrow
   and -90° the "let go now" one */
.ptr .i{width:15px;height:15px;transform:rotate(90deg);transition:transform .2s;}
.ptr.ready .i{transform:rotate(-90deg);}
.ptr.busy .i{transform:none;animation:ptrspin .8s linear infinite;}
.topbtn.spinning .i{animation:ptrspin .8s linear infinite;}
@keyframes ptrspin{to{transform:rotate(360deg);}}
@media (prefers-reduced-motion: reduce){
  .ptr.busy .i{animation:none;}
  .ptr.settling{transition:none;}
}
button{font-family:inherit;color:inherit;}
img{max-width:100%;}

.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums;}
.disp{font-family:var(--f-disp);}

/* every icon inherits the colour and optical weight of its text */
.i{
  width:1.15em;height:1.15em;flex:0 0 auto;display:inline-block;vertical-align:-.2em;
  fill:none;stroke:currentColor;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round;
}

.wrap{max-width:720px;margin:0 auto;padding:0 18px;}

/* ---------- top bar ---------- */
.topbar{
  position:sticky;top:0;z-index:50;
  background:color-mix(in srgb, var(--paper) 90%, transparent);
  backdrop-filter:saturate(150%) blur(16px);
  -webkit-backdrop-filter:saturate(150%) blur(16px);
  border-bottom:1px solid var(--rule);
}
.topbar-inner{max-width:720px;margin:0 auto;padding:10px 18px 0;}
.brandrow{display:flex;align-items:center;justify-content:space-between;gap:12px;padding-bottom:9px;}
.brandmark{display:flex;align-items:baseline;gap:8px;min-width:0;}
.brandmark .sys{
  font-family:var(--f-body);font-weight:700;font-size:13.5px;letter-spacing:-.01em;
  color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
}
.brandmark .ko{font-family:var(--f-mono);font-size:11px;color:var(--ink-faint);white-space:nowrap;}

/* Labelled, always there. An emoji in a circle told you nothing about what
   the control did, and Export was buried at the bottom of the overview. */
.topbtns{display:flex;gap:6px;flex:0 0 auto;align-items:center;}
.topbtn{
  display:inline-flex;align-items:center;gap:6px;
  height:34px;padding:0 12px;border-radius:999px;
  border:1px solid var(--rule);background:var(--surface);
  font-family:var(--f-body);font-size:12.5px;font-weight:500;line-height:1;
  color:var(--ink-soft);text-decoration:none;cursor:pointer;white-space:nowrap;
  transition:color .15s, border-color .15s;
}
.topbtn .i{width:15px;height:15px;}
.topbtn:hover{color:var(--ink);border-color:var(--ink-faint);}
.topbtn:active{transform:scale(.96);}
.topbtn.icononly{padding:0;width:34px;justify-content:center;}
.iconbtn{
  width:34px;height:34px;flex:0 0 auto;display:grid;place-items:center;
  border:1px solid var(--rule);border-radius:999px;background:var(--surface);
  cursor:pointer;font-size:14px;line-height:1;color:var(--ink-soft);text-decoration:none;
}
.iconbtn .i{width:16px;height:16px;}
.iconbtn:active{transform:scale(.94);}

/* day switcher: an underline, not a filled pill — the active day's hue is
   the only colour in the bar */
.lines{display:flex;gap:2px;overflow-x:auto;padding:0;scrollbar-width:none;scroll-behavior:smooth;}
.lines::-webkit-scrollbar{display:none;}
.linebtn{
  flex:0 0 auto;display:flex;align-items:center;gap:7px;
  padding:9px 12px 11px;cursor:pointer;
  border:0;border-bottom:2px solid transparent;background:transparent;
  font-family:var(--f-body);font-size:13px;font-weight:500;color:var(--ink-faint);
  white-space:nowrap;transition:color .15s, border-color .15s;
}
.linebtn .bullet{
  width:7px;height:7px;border-radius:50%;flex:0 0 auto;
  background:var(--lc,var(--ink-faint));opacity:.5;transition:opacity .15s;
}
.linebtn .lbl{font-family:var(--f-mono);font-weight:500;font-size:11.5px;letter-spacing:.02em;}
.linebtn:hover{color:var(--ink-soft);}
.linebtn[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--lc,var(--ink));}
.linebtn[aria-selected="true"] .bullet{opacity:1;}
.linebtn[aria-selected="true"] .lbl{color:var(--lc,var(--ink));font-weight:600;}

/* ---------- hero / route board ---------- */
.hero{padding:34px 0 6px;}
.eyebrow{
  font-family:var(--f-disp);font-size:11px;font-weight:600;
  letter-spacing:.16em;text-transform:uppercase;color:var(--ink-faint);
  font-stretch:112%;
}
/* No font-stretch here. The title is Chinese, and a CJK face has no width
   axis — asking for one makes the browser synthesise it, which is what was
   smearing the characters. The widened setting is kept for Latin runs
   (the eyebrow, the day numerals) where the axis actually exists. */
.hero h1{
  font-family:var(--f-disp);font-weight:700;
  font-size:clamp(30px,8.4vw,42px);line-height:1.14;letter-spacing:-.018em;
  margin:12px 0 14px;text-wrap:balance;
}
.hero-meta{
  display:flex;flex-wrap:wrap;gap:4px 10px;align-items:center;
  font-size:12.5px;color:var(--ink-faint);font-variant-numeric:tabular-nums;
}
.hero-meta b{font-weight:600;color:var(--ink-soft);}

/* ---------- the line map ----------
   Six days, six lines. The rail is continuous from the first day to the
   last, so the trip reads as one journey rather than six cards, and each
   day's colour is the same one it wears everywhere else in the app. */
/* Flex, not block: the template puts a newline between each button, and as
   a block container those whitespace text nodes became line boxes, opening
   a 22px gap between every pair of rows and cutting the line into stubs.
   A flex container discards whitespace-only children outright. */
.linemap{display:flex;flex-direction:column;margin:26px 0 8px;}
/* The vertical padding lives on the body, never on the button, so the rail
   column runs the full height of each row and touches the next one. With
   the padding on the button, each segment stopped short of its neighbour
   and the "line" arrived as a row of disconnected stubs. */
.dayline{
  position:relative;display:grid;grid-template-columns:38px 1fr;gap:14px;
  width:100%;padding:0 4px;border:0;background:transparent;
  text-align:left;cursor:pointer;color:inherit;
}
.dayline:active{background:var(--surface-2);border-radius:var(--r-md);}
.dayline-rail{position:relative;display:flex;justify-content:center;align-items:flex-start;}
.dayline-rail::before{
  content:"";position:absolute;left:50%;top:0;bottom:0;width:3px;
  transform:translateX(-50%);background:var(--lc);opacity:.32;
}
/* the journey starts and ends at a station, not in mid-air */
.dayline:first-child .dayline-rail::before{top:30px;}
.dayline:last-child .dayline-rail::before{bottom:calc(100% - 30px);}
.dayline-dot{
  position:relative;z-index:1;margin-top:14px;
  width:32px;height:32px;border-radius:50%;
  display:flex;align-items:center;justify-content:center;
  background:var(--lc);color:var(--paper);
  font-family:var(--f-disp);font-weight:700;font-size:15px;
  font-variant-numeric:tabular-nums;
  box-shadow:0 0 0 4px var(--paper);
}
.dayline-body{min-width:0;padding:14px 0 18px;}
.dayline-top{display:flex;align-items:baseline;gap:10px;justify-content:space-between;}
.dayline-title{
  font-family:var(--f-disp);font-weight:650;font-size:17px;
  letter-spacing:-.012em;color:var(--ink);line-height:1.3;min-width:0;
}
.dayline-when{font-size:11.5px;color:var(--ink-faint);white-space:nowrap;}
/* the stations on this line, middot-separated so they read as a route */
.dayline-stops{
  display:flex;flex-wrap:wrap;gap:2px 0;margin-top:6px;
  font-size:12.5px;color:var(--ink-soft);line-height:1.5;
}
.dayline-stops > span{display:inline-flex;align-items:center;}
.dayline-stops > span + span::before{
  content:"";width:3px;height:3px;border-radius:50%;
  background:var(--ink-faint);opacity:.6;margin:0 8px;
}
.dayline-more{color:var(--ink-faint);}
.dayline-count{
  display:inline-block;margin-top:6px;
  font-size:11px;font-weight:600;letter-spacing:.04em;
  color:var(--lc);font-variant-numeric:tabular-nums;
}

/* ---------- folded groups ----------
   Everything that is not the itinerary. Shut by default: the overview
   used to open on nine walls of text with the trip buried among them. */
.fold{border-top:1px solid var(--rule);}
.fold:first-of-type{margin-top:22px;}
.fold-head{
  display:flex;align-items:center;gap:10px;width:100%;
  padding:16px 2px;border:0;background:transparent;
  text-align:left;cursor:pointer;color:inherit;
}
.fold-t{font-family:var(--f-disp);font-weight:650;font-size:15px;letter-spacing:-.01em;}
.fold-h{
  flex:1;min-width:0;font-size:11.5px;color:var(--ink-faint);
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
}
.fold-c{margin-left:auto;display:flex;color:var(--ink-faint);}
.fold-c .i{width:16px;height:16px;transform:rotate(90deg);transition:transform .2s;}
.fold.open .fold-c .i{transform:rotate(-90deg);}
.fold-head:active{background:var(--surface-2);}
.fold-body{padding:2px 0 22px;}

/* ---------- generic section ---------- */
.sec{padding:30px 0 4px;}
.sec-title{
  font-family:var(--f-body);font-weight:700;font-size:18px;
  letter-spacing:-.015em;margin:0 0 4px;
}
.sec-sub{font-size:13px;color:var(--ink-faint);margin:0 0 16px;line-height:1.65;}
.sec h3{font-size:15px;font-weight:700;margin:26px 0 6px;display:flex;align-items:center;gap:2px;}
.rule{border:0;border-top:1px solid var(--rule);margin:28px 0 0;}

.panel{background:var(--surface);border:1px solid var(--rule);border-radius:var(--r-lg);padding:16px;}
.panel + .panel{margin-top:10px;}
.panel .k{
  font-size:11.5px;font-weight:500;letter-spacing:.01em;color:var(--ink-faint);
  display:flex;align-items:center;gap:5px;
}
.panel .k .i{width:13px;height:13px;}
.panel .v{font-size:16px;font-weight:600;margin-top:4px;}
.panel .d{font-size:13px;color:var(--ink-soft);margin-top:6px;line-height:1.65;}

/* Chips used to be filled lozenges in six colours, which is most of what made
   a stop card look like a fruit machine. Now: hairline outline, ink text, and
   only a real warning gets colour. Class names come from stored data. */
.badge,.meta-chip,.niecepick{
  display:inline-flex;align-items:center;gap:4px;
  font-size:11.5px;font-weight:400;line-height:1.5;
  padding:2px 8px;border-radius:var(--r-sm);max-width:100%;
  border:1px solid var(--rule);background:transparent;color:var(--ink-soft);
}
.badge .i,.meta-chip .i,.niecepick .i{width:12px;height:12px;}
.badge.note{color:var(--ink-soft);}
.badge.warn{color:var(--warn);border-color:color-mix(in srgb,var(--warn) 32%,transparent);}
.meta-chip.rating{font-family:var(--f-mono);border-color:transparent;padding-left:0;color:var(--ink-soft);}
.meta-chip.rating b{font-weight:600;color:var(--ink);}
.meta-chip.hours{color:var(--ink-soft);}
.meta-chip.book{color:var(--ink-soft);}
.meta-chip.book.warn{color:var(--warn);}
.meta-chip.closed{color:var(--danger);border-color:color-mix(in srgb,var(--danger) 32%,transparent);}
.niecepick{color:var(--niece);border-color:color-mix(in srgb,var(--niece) 34%,transparent);}
.chiprow{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px;align-items:center;}

.wtable{width:100%;border-collapse:collapse;font-size:13px;margin-top:10px;}
.wtable th{
  font-size:11.5px;font-weight:500;letter-spacing:.01em;color:var(--ink-faint);
  text-align:left;padding:8px 10px 8px 0;border-bottom:1px solid var(--rule);
}
.wtable td{padding:9px 10px 9px 0;border-bottom:1px solid var(--rule-soft);color:var(--ink-soft);}
.wtable td.hi,.wtable td.lo{
  font-family:var(--f-mono);font-weight:500;white-space:nowrap;
  font-variant-numeric:tabular-nums;
}
.wtable td.hi{color:var(--ink);}
.wtable td.lo{color:var(--ink-faint);}

.clist{list-style:none;padding:0;margin:10px 0 0;display:flex;flex-direction:column;gap:10px;}
.clist li{display:flex;gap:10px;font-size:13.5px;line-height:1.7;color:var(--ink-soft);}
.clist li::before{
  content:"";flex:0 0 auto;width:4px;height:4px;border-radius:50%;
  background:var(--ink-faint);margin-top:.7em;
}
.clist .ico{flex:0 0 auto;font-size:15px;line-height:1.5;}
.clist b{color:var(--ink);font-weight:600;}

.legend{display:flex;flex-direction:column;gap:8px;margin-top:10px;}
.legend-item{display:flex;align-items:center;gap:10px;font-size:13px;color:var(--ink-soft);}
.legend-dot{width:8px;height:8px;border-radius:50%;flex:0 0 auto;}

/* ---------- paying for transport ---------- */
.panel.verdict{border-left:2px solid var(--ok);margin-bottom:12px;}
.panel.verdict .k{color:var(--ok);}
.panel.callout{border-left:2px solid var(--warn);margin-top:14px;}
.panel.callout .k{color:var(--warn);}
.fare-grid{display:flex;flex-direction:column;gap:10px;}
.fare-card{background:var(--surface);border:1px solid var(--rule);border-radius:var(--r-md);padding:13px 15px;}
.fare-card.pick{border-color:var(--ok);}
.fare-top{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap;}
.fare-name{font-size:14.5px;font-weight:600;}
.fare-name .kr{font-family:var(--f-mono);font-size:11px;color:var(--ink-faint);font-weight:400;margin-left:6px;}
.fare-price{font-family:var(--f-mono);font-size:12px;color:var(--ink-soft);margin-top:3px;}
.fare-line{font-size:12.5px;line-height:1.6;margin-top:5px;display:flex;gap:6px;align-items:flex-start;}
.fare-line .i{width:14px;height:14px;margin-top:.25em;}
.fare-line.good{color:var(--ok);}
.fare-line.bad{color:var(--danger);}
.opt{margin-top:11px;padding-top:11px;border-top:1px solid var(--rule-soft);}
.opt-name{font-size:13.5px;font-weight:600;display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;}
.opt-cost{font-family:var(--f-mono);font-weight:500;color:var(--warn);font-size:12px;}
.opt-note{font-size:12.5px;color:var(--ink-soft);line-height:1.6;margin-top:3px;}

.colorpick{display:flex;gap:8px;flex-wrap:wrap;margin:10px 2px 0;}
.colorpick .swatch{width:24px;height:24px;border-radius:50%;border:2px solid transparent;padding:0;cursor:pointer;}
.colorpick .swatch.active{border-color:var(--ink);box-shadow:0 0 0 2px var(--paper);}

/* ---------- day header ---------- */
.dayhead{padding:28px 0 4px;}
.dayhead .kicker{display:flex;align-items:center;gap:10px;margin-bottom:10px;}
.dayhead .dno{
  font-family:var(--f-mono);font-weight:600;font-size:11.5px;
  letter-spacing:.14em;text-transform:uppercase;color:var(--lc);
}
.dayhead .kline{flex:1 1 auto;height:1px;background:var(--lc);opacity:.4;}
.dayhead .date{font-family:var(--f-mono);font-size:11.5px;color:var(--ink-faint);}
.dayhead h2{
  font-family:var(--f-body);font-weight:700;
  font-size:clamp(24px,6.6vw,32px);line-height:1.25;letter-spacing:-.025em;margin:0 0 8px;
}
.dayhead .intro{font-size:13.5px;color:var(--ink-soft);line-height:1.7;margin:0;}
.dayhead .chiprow{margin-top:12px;}

.boardname{
  font-family:var(--f-body);font-weight:700;
  font-size:clamp(24px,6.6vw,32px);line-height:1.25;letter-spacing:-.025em;margin:0 0 8px;
  cursor:pointer;display:inline-flex;align-items:baseline;gap:9px;
}
.boardname .editpencil{opacity:.35;}
.boardname .editpencil .i{width:16px;height:16px;}
.boardname-input{
  display:block;width:100%;font-family:var(--f-body);font-weight:700;
  font-size:clamp(22px,6vw,30px);line-height:1.25;letter-spacing:-.025em;margin:0 0 8px;
  padding:4px 2px 6px;border:0;border-bottom:1px solid var(--lc,var(--ink));
  background:transparent;color:var(--ink);
}
.boardname-input:focus{outline:none;}
.picker-label{
  font-size:11.5px;font-weight:500;letter-spacing:.01em;
  color:var(--ink-faint);margin:18px 2px 8px;
}
.picker-label:first-child{margin-top:0;}

.maptoggle{
  display:inline-flex;align-items:center;gap:8px;margin-top:16px;
  padding:9px 14px;border-radius:999px;cursor:pointer;
  border:1px solid var(--rule);background:var(--surface);
  font-size:12.5px;font-weight:500;color:var(--ink-soft);
}
.maptoggle .mapi .i,.maptoggle .chev .i{width:15px;height:15px;}
.maptoggle .chev{display:inline-flex;transition:transform .2s;color:var(--ink-faint);transform:rotate(90deg);}
.maptoggle[aria-expanded="true"] .chev{transform:rotate(-90deg);}
.mapbox{
  /* 240px of map sat between the day's header and its first stop, on a
     screen about 700px tall. Enough to orient, not enough to be the page. */
  height:180px;margin-top:12px;border-radius:var(--r-lg);overflow:hidden;
  border:1px solid var(--rule);background:var(--surface-2);
  /* Leaflet gives its panes z-index up to 1000. Without a stacking context of
     its own the map floats over the sticky nav and the AI sheet. */
  position:relative;z-index:0;isolation:isolate;
}
.mapbox.tall{height:280px;}
.mapcap{font-size:11.5px;color:var(--ink-faint);margin:8px 2px 0;line-height:1.6;}
.mapnote{font-size:12px;margin:9px 2px 0;line-height:1.65;color:var(--ink-soft);}
.mapnote.warn{color:var(--warn);}
.mapnote .linkbtn{
  background:none;border:0;padding:0 0 0 6px;font:inherit;color:var(--ink);
  text-decoration:underline;text-underline-offset:2px;cursor:pointer;
}
.mapnote .geowhy{color:var(--ink-faint);font-size:11px;}
.mapfallback{display:grid;place-items:center;height:100%;padding:20px;text-align:center;font-size:12.5px;color:var(--ink-faint);}
.leaflet-container{background:var(--surface-2);font:inherit;}
.mapnode{
  display:grid;place-items:center;width:20px;height:20px;border-radius:50%;
  color:#fff;font-size:10px;font-weight:600;font-family:var(--f-mono);
  border:2px solid var(--surface);box-shadow:0 1px 3px rgba(0,0,0,.35);
}
.mapnode.plain{width:12px;height:12px;border-width:2px;}
.mapboardpin{
  width:14px;height:14px;border-radius:50% 50% 50% 0;
  transform:rotate(-45deg);border:2px solid var(--surface);box-shadow:0 1px 3px rgba(0,0,0,.35);
}

/* ---------- the timetable: times, rail, stops ---------- */
.line{margin-top:22px;}
.unit{position:relative;scroll-margin-top:120px;}
.unit.lifted{position:relative;z-index:30;}
.unit.lifted .stopcard{box-shadow:var(--shadow-2);border-color:var(--lc);}
.unit.shifting{transition:transform .18s cubic-bezier(.2,.7,.3,1);}

/* a leg between two stops. The stroke says how you get there. */
.seg{display:grid;grid-template-columns:var(--gutter) 1fr;align-items:stretch;min-height:40px;}
.seg-rail{position:relative;}
.seg-rail::before{
  content:"";position:absolute;right:10px;top:0;bottom:0;
  transform:translateX(50%);width:2px;background:var(--lc);opacity:.4;
}
.seg[data-mode="walk"] .seg-rail::before{
  background:repeating-linear-gradient(to bottom, var(--lc) 0 3px, transparent 3px 7px);
}
.seg[data-mode="bus"] .seg-rail::before{
  background:repeating-linear-gradient(to bottom, var(--lc) 0 10px, transparent 10px 16px);
}
.seg[data-mode="taxi"] .seg-rail::before{
  background:repeating-linear-gradient(to bottom, var(--lc) 0 6px, transparent 6px 10px);
}
.seg[data-mode="air"] .seg-rail::before{
  background:repeating-linear-gradient(to bottom, var(--lc) 0 2px, transparent 2px 8px);
}
.seg-text{
  font-size:12.5px;color:var(--ink-faint);padding:9px 0 9px 14px;line-height:1.6;
  display:flex;align-items:center;gap:7px;flex-wrap:wrap;
}
.seg-text b{color:var(--ink-soft);font-weight:500;font-family:var(--f-mono);}
.seg-text .icon{display:inline-flex;color:var(--ink-faint);}
.seg-text .icon .i{width:14px;height:14px;}
.seg-note{font-size:12.5px;color:var(--ink-faint);}
.seg-note.warn{color:var(--warn);display:inline-flex;align-items:center;gap:5px;flex-wrap:wrap;}
.seg-why{display:block;margin-top:3px;font-weight:400;font-size:11.5px;color:var(--ink-faint);line-height:1.55;}
.segrefresh{
  margin-left:auto;flex:0 0 auto;width:26px;height:26px;border-radius:50%;display:grid;place-items:center;
  border:1px solid transparent;background:transparent;color:var(--ink-faint);cursor:pointer;
}
.segrefresh .i{width:14px;height:14px;}
.segrefresh:hover{color:var(--ink-soft);border-color:var(--rule);}
.segrefresh:active{color:var(--lc);border-color:var(--lc);}
/* the two map buttons for a leg sit on their own line under the duration */
.seg-links{display:flex;gap:16px;flex-wrap:wrap;width:100%;margin-top:5px;}
/* whole-day route, above the map toggle */
.dayroutes{display:flex;gap:16px;flex-wrap:wrap;align-items:center;margin-top:14px;}
.dayroutes .maplink{font-size:12.5px;color:var(--ink-soft);}
.dayroutes .maplink:hover{color:var(--ink);}
.dayroutes .hint{margin:0;flex-basis:100%;}
.seg-route{
  display:block;width:100%;margin-top:4px;
  font-size:11px;line-height:1.7;color:var(--ink-faint);
  font-family:var(--f-mono);letter-spacing:-.01em;
}
.seg.stale .seg-rail::before{
  background:repeating-linear-gradient(to bottom, var(--warn) 0 3px, transparent 3px 8px);opacity:1;
}

/* the ＋ living in the gap between two stops */
.insertrow{
  display:grid;grid-template-columns:var(--gutter) 1fr;align-items:center;
  width:100%;height:22px;padding:0;border:0;background:none;
  position:relative;z-index:4;cursor:pointer;-webkit-tap-highlight-color:transparent;
}
.ins-plus{
  grid-column:1;justify-self:end;margin-right:10px;transform:translateX(50%);
  width:17px;height:17px;border-radius:50%;
  display:flex;align-items:center;justify-content:center;
  font-size:12px;line-height:1;color:var(--ink-faint);
  background:var(--paper);border:1px dashed var(--rule);
  transition:color .15s, border-color .15s, transform .15s;
}
.insertrow:hover .ins-plus{color:var(--lc);border-color:var(--lc);}
.insertrow:active .ins-plus{color:var(--lc);border-color:var(--lc);transform:translateX(50%) scale(1.15);}

/* a note pinned between two stops — deliberately not a stop */
.notecard{
  border:0;border-left:1px solid var(--rule);border-radius:0;
  background:transparent;margin:0 0 2px 14px;padding-left:12px;
  overflow:hidden;position:relative;
}
.notecard.open{border-left-color:var(--lc);}
.notemain{display:flex;gap:8px;padding:8px 42px 8px 0;align-items:flex-start;
  -webkit-user-select:text;user-select:text;}
.noteicon{flex:0 0 auto;color:var(--ink-faint);line-height:1.5;}
.noteicon .i{width:14px;height:14px;}
.notetext{font-size:12.5px;line-height:1.7;color:var(--ink-soft);white-space:pre-wrap;min-width:0;}
.notetext.empty{color:var(--ink-faint);}
.node.note{
  width:5px;height:5px;background:var(--paper);border:1.5px solid var(--ink-faint);
}
.notecard.open .notetext{display:none;}

/* a stop */
/* min-width:0 on the stop column: a 1fr grid track keeps min-width:auto,
   so it will not shrink below its content's min-content width. One
   white-space:nowrap run inside — the backup strip, a long Korean name —
   was widening the track to 767px and taking the whole page with it. */
.stop{display:grid;grid-template-columns:var(--gutter) minmax(0,1fr);align-items:start;}
.stop-rail{position:relative;align-self:stretch;}
.stop-rail::before{
  content:"";position:absolute;right:10px;top:0;bottom:0;
  transform:translateX(50%);width:2px;background:var(--lc);opacity:.4;
}
.unit:first-child .stop-rail::before{top:22px;}
.unit:last-child .stop-rail::before{bottom:calc(100% - 22px);}

/* the time column — the axis everything else lines up against */
.stoptime{
  position:absolute;right:24px;top:22px;transform:translateY(-50%);
  font-family:var(--f-mono);font-size:11.5px;font-weight:500;
  font-variant-numeric:tabular-nums;letter-spacing:-.02em;
  color:var(--ink-soft);white-space:nowrap;text-align:right;
}
.stoptime:empty{display:none;}
.stoptime .approx{color:var(--ink-faint);}
.stoptime .raw{font-family:var(--f-body);font-size:10.5px;color:var(--ink-faint);}

.node{
  position:absolute;right:10px;top:22px;transform:translate(50%,-50%);
  width:9px;height:9px;border-radius:50%;background:var(--lc);
  border:2px solid var(--paper);box-sizing:content-box;z-index:2;
}
/* a meal is a major stop — drawn hollow, like an interchange */
.node[data-type="eat"]{width:9px;height:9px;background:var(--paper);border:2.5px solid var(--lc);}
.node[data-type="rest"]{width:6px;height:6px;opacity:.7;}
.node.numbered{
  width:17px;height:17px;border-radius:50%;background:var(--lc);
  border:2px solid var(--paper);box-sizing:border-box;opacity:1;
  display:flex;align-items:center;justify-content:center;
  color:var(--paper);font-size:9.5px;font-weight:600;font-family:var(--f-mono);
}

/* A stop is not a card. Boxing every one of them turned a day into a
   stack of grey slabs, and the rail — the thing that actually says
   "this is one journey" — was left fighting fifteen borders. The stop
   sits on the page, separated by a hairline, and only takes a surface
   when it is opened for editing or picked in select mode. */
.stopcard{
  background:transparent;border:1px solid transparent;border-radius:var(--r-lg);
  margin:0 0 2px 2px;position:relative;min-width:0;
  transition:background-color .15s, border-color .15s;
}
.stopcard::after{
  content:"";position:absolute;left:12px;right:0;bottom:-2px;height:1px;
  background:var(--rule-soft);
}
.unit:last-child .stopcard::after{display:none;}
.stopcard.open,.stopcard.checked,.stopcard.freshai{
  background:var(--surface);border-color:var(--rule);
  margin-bottom:10px;overflow:hidden;
}
.stopcard.open::after,.stopcard.checked::after{display:none;}
.stopmain{display:flex;gap:11px;padding:13px 36px 13px 12px;align-items:flex-start;text-align:left;width:100%;-webkit-user-select:text;user-select:text;}
.thumb{
  flex:0 0 auto;width:62px;height:62px;border-radius:var(--r-md);overflow:hidden;
  background:var(--surface-2);position:relative;
}
.thumb img{width:100%;height:100%;object-fit:cover;display:block;}
.thumb.ghost{
  display:flex;align-items:center;justify-content:center;cursor:pointer;
  border:1px dashed var(--rule);background:transparent;color:var(--ink-faint);
}
.thumb.ghost .i{width:20px;height:20px;}
.thumb.ghost:active{background:var(--surface-2);}
.thumb.ghost small{display:none;}
.stopcard.open .stopdesc,
.stopcard.open .stopmain .chiprow,
.stopcard.open .eatbox,
.stopcard.open .tipbox,
.stopcard.open .stopfoot{display:none;}
.stopcard.open{border-color:var(--lc);}
.stopcard.checked{border-color:var(--lc,var(--ink));}
.stopbody{flex:1 1 auto;min-width:0;}
.stopname{font-size:15px;font-weight:600;line-height:1.45;margin:0;letter-spacing:-.01em;}
.stopname .kr{font-size:11px;color:var(--ink-faint);font-weight:400;margin-left:7px;}
.stopname.unnamed{color:var(--ink-faint);font-weight:400;}
/* These descriptions are AI-written paragraphs — a hundred-odd characters
   each — and with fifteen stops in a day they turned one day into a very
   long scroll. Three lines is enough to know whether you care; the rest is
   one tap away. The "更多" button is only revealed for descriptions that
   are actually being cut (measured after render), so short ones stay clean. */
.stopdesc{
  font-size:12.5px;color:var(--ink-soft);line-height:1.65;margin-top:5px;
  display:-webkit-box;-webkit-box-orient:vertical;-webkit-line-clamp:3;overflow:hidden;
}
.stopdesc.open{display:block;-webkit-line-clamp:unset;}
.descmore{
  display:none;margin-top:3px;padding:2px 0;border:0;background:none;cursor:pointer;
  font-family:inherit;font-size:11.5px;font-weight:500;color:var(--ink-faint);
}
.descmore.show{display:inline-block;}
.descmore:hover{color:var(--ink);}
.stopcard .chiprow{margin-top:8px;}

/* notes attached to a stop: an indent and a rule, not a coloured slab */
.eatbox,.tipbox,.bookbox{
  margin:0 14px 12px;padding:0 0 0 12px;border-left:1px solid var(--rule);
  background:transparent;font-size:12.5px;line-height:1.7;color:var(--ink-soft);
}
.eatbox b,.tipbox b,.bookbox b{
  display:block;font-size:11px;font-weight:500;letter-spacing:.01em;
  color:var(--ink-faint);margin-bottom:3px;
}
.bookbox .warnline{display:flex;align-items:center;gap:5px;color:var(--warn);font-size:11px;margin-top:5px;}
.bookbox .warnline .i{width:12px;height:12px;}

/* outbound links: quiet text, not a row of coloured pills */
/* The utility row under a stop: five links, on every stop, all day. With
   icons they wrapped onto two lines and doubled the visual weight of the
   card. The icons carry no information the word does not — so they go,
   and the row fits on one line. Icons stay where they mean something:
   the rail, the connectors, the top bar. */
.stopfoot{display:flex;gap:4px 14px;flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none;
  padding:2px 12px 13px;-webkit-mask-image:linear-gradient(90deg,#000 88%,transparent);mask-image:linear-gradient(90deg,#000 88%,transparent);}
.stopfoot::-webkit-scrollbar{display:none;}
.stopfoot > *{flex:0 0 auto;white-space:nowrap;}
.stopfoot .maplink{font-size:11.5px;}
.stopfoot .maplink .i{display:none;}
.maplink{
  display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:400;
  color:var(--ink-faint);background:transparent;padding:0;border:0;border-radius:0;
  font-family:inherit;cursor:pointer;
  text-decoration:none;transition:color .15s;
}
.maplink .i{width:13px;height:13px;}
.maplink:hover{color:var(--ink);}

.cardtools{position:absolute;top:6px;right:6px;display:flex;flex-direction:column;gap:2px;}
.editbtn,.draghandle{
  width:32px;height:32px;display:grid;place-items:center;
  border-radius:var(--r-sm);background:transparent;border:1px solid transparent;
  color:var(--ink-faint);line-height:1;
}
.editbtn .i,.draghandle .i{width:16px;height:16px;}
.editbtn{cursor:pointer;}
.editbtn:hover{color:var(--ink);background:var(--surface-2);}
.editbtn:active,.stopcard.open .editbtn{background:var(--lc);color:var(--paper);}
.draghandle{cursor:grab;touch-action:none;user-select:none;-webkit-user-select:none;}
.draghandle:active,.unit.lifted .draghandle{cursor:grabbing;background:var(--lc);color:var(--paper);}

/* expanded editor */
.editor{border-top:1px solid var(--rule);padding:14px;background:var(--surface-2);}
.field{margin-bottom:12px;}
.field:last-child{margin-bottom:0;}
.field label{
  display:block;font-size:11.5px;font-weight:500;letter-spacing:.01em;
  color:var(--ink-faint);margin-bottom:6px;
}
.input,.textarea,.select{
  width:100%;font-family:inherit;font-size:16px;color:var(--ink);
  background:var(--surface);border:1px solid var(--rule);border-radius:var(--r-md);
  padding:11px 12px;line-height:1.5;
}
.textarea{resize:vertical;min-height:74px;}
.select{appearance:none;background-image:linear-gradient(45deg,transparent 50%,var(--ink-faint) 50%),linear-gradient(135deg,var(--ink-faint) 50%,transparent 50%);background-position:calc(100% - 18px) 52%,calc(100% - 13px) 52%;background-size:5px 5px,5px 5px;background-repeat:no-repeat;padding-right:36px;}
.input:focus,.textarea:focus,.select:focus{outline:2px solid var(--lc,var(--ink));outline-offset:-1px;border-color:transparent;}
.row2{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:10px;}
.row2 > *{min-width:0;}

.suggest{margin-top:6px;display:flex;flex-direction:column;gap:5px;}
.suggest-item{
  text-align:left;width:100%;cursor:pointer;
  background:var(--surface);border:1px solid var(--rule);border-radius:var(--r-md);padding:10px 12px;
}
.suggest-item:active{background:var(--surface-2);}
.suggest-item .n{font-size:13.5px;font-weight:600;}
.suggest-item .a{font-size:11.5px;color:var(--ink-faint);margin-top:2px;}
.hint{font-size:11.5px;color:var(--ink-faint);margin:6px 2px 0;line-height:1.6;}

.editor-tools{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px;}
/* A day carries five or six of these tool buttons above and below the
   itinerary. Filled, they read as loudly as the trip itself; on the light
   theme a stack of white slabs was the first thing the eye landed on.
   They sit on the page instead, and only .primary is allowed to shout. */
.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:7px;cursor:pointer;
  font-family:var(--f-body);font-size:13px;font-weight:500;padding:10px 16px;
  border-radius:999px;min-height:40px;
  border:1px solid var(--rule);background:transparent;color:var(--ink-soft);
  transition:border-color .15s, background .15s, color .15s;
}
.btn:hover{color:var(--ink);}
.btn .i{width:15px;height:15px;}
.btn:hover{border-color:var(--ink-faint);}
.btn:active{transform:scale(.98);}
.btn.primary{background:var(--ink);color:var(--paper);border-color:var(--ink);}
.btn.danger{color:var(--danger);border-color:color-mix(in srgb,var(--danger) 30%,transparent);}
.btn.wide{width:100%;}
.btn.wide + .btn.wide{margin-top:7px;}
.addstop{
  width:100%;margin-top:14px;padding:14px;cursor:pointer;
  border:1px dashed var(--rule);border-radius:var(--r-lg);background:transparent;
  color:var(--ink-faint);font-size:13px;font-weight:500;
}
.addstop:hover{color:var(--ink-soft);border-color:var(--ink-faint);}

.recalc{
  width:100%;margin-top:8px;padding:12px;cursor:pointer;
  display:inline-flex;align-items:center;justify-content:center;gap:7px;
  border:1px solid var(--rule);border-radius:var(--r-lg);background:transparent;
  color:var(--ink-soft);font-size:12.5px;font-weight:500;
}
.recalc .i{width:15px;height:15px;}
.recalc:hover{border-color:var(--ink-faint);color:var(--ink);}
.recalc[data-stale="1"]{border-color:color-mix(in srgb,var(--warn) 40%,transparent);color:var(--warn);}
.recalc:disabled{opacity:.5;}



/* ---------- signature: the line badge ----------
   Seoul's subway lines are a coloured disc with a number in it; this trip's
   days already wear one colour each, so each day gets its disc too. The
   numerals and dates go condensed, set like a platform board, which is the
   only place the page raises its voice. */
.dayhead .dno{display:inline-flex;align-items:center;gap:8px;}
.dayhead .dno-n{
  width:30px;height:30px;border-radius:50%;display:inline-grid;place-items:center;
  background:var(--lc);color:var(--paper);
  font-family:'Archivo',var(--f-disp);font-stretch:75%;font-weight:800;font-size:17px;
  letter-spacing:0;font-variant-numeric:tabular-nums;
}
.dayhead .date,.dayline-when,.hero .eyebrow{
  font-family:'Archivo',var(--f-mono);font-stretch:82%;font-weight:600;
  font-variant-numeric:tabular-nums;letter-spacing:.06em;
}
.dayline-dot{font-family:'Archivo',var(--f-disp);font-stretch:75%;font-weight:800;font-size:17px;}
.dayhead h2,.hero h1{font-weight:800;}


/* ============================================================
   BOARDING PASS — shared with the home page.
   The overview opens on the trip's own pass (HKG → destination,
   perforated stub with dates and a countdown); everything below
   takes the same stock, gold and condensed numerals.
   ============================================================ */
:root{ --gold:#A8740C; --stock:#FFFFFF; }
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){ --gold:#E2B24A; --stock:#171D1C; } }
:root[data-theme="dark"]{ --gold:#E2B24A; --stock:#171D1C; }
:root[data-theme="navy"]{ --gold:#E8BC57; --stock:#152036; }

.brandmark .sys{font-weight:800;font-size:14.5px;}
.btn.primary{background:var(--gold);border-color:var(--gold);color:#14110A;font-weight:700;}

.hero.tpass{position:relative;margin-top:22px;padding:20px 20px 0;background:var(--stock);
  border-radius:22px;box-shadow:0 0 0 1px var(--rule),var(--shadow-2,0 10px 30px -14px rgba(0,0,0,.4));}
.hero.tpass h1{font-size:clamp(26px,7.4vw,36px);margin:8px 0 10px;}
.hero.tpass .eyebrow{color:var(--gold);}
.tp-route{display:grid;grid-template-columns:auto 1fr auto;align-items:end;gap:12px;margin-bottom:18px;}
.tp-pt{display:flex;flex-direction:column;min-width:0;}
.tp-pt.to{align-items:flex-end;text-align:right;}
.tp-code{font-family:'Archivo',var(--f-disp);font-stretch:75%;font-weight:800;font-size:52px;line-height:.9;color:var(--ink-faint);}
.tp-pt.to .tp-code{color:var(--ink);}
.tp-city{font-size:12px;color:var(--ink-faint);margin-top:6px;}
.tp-flight{position:relative;height:32px;margin-bottom:24px;color:var(--gold);}
.tp-arc{position:absolute;left:0;right:0;bottom:4px;height:24px;border-top:1.5px dashed color-mix(in srgb,var(--gold) 70%,transparent);
  border-radius:50% 50% 0 0 / 100% 100% 0 0;}
.tp-flight .i{position:absolute;left:50%;top:-5px;width:19px;height:19px;transform:translateX(-50%) rotate(90deg);
  background:var(--stock);padding:0 2px;box-sizing:content-box;}
.tp-stub{position:relative;display:grid;grid-template-columns:repeat(3,auto) 1fr;align-items:end;gap:6px 22px;
  margin:18px -20px 0;padding:16px 20px 18px;border-top:1.5px dashed var(--rule);}
.tp-stub::before,.tp-stub::after{content:"";position:absolute;top:-10px;width:20px;height:20px;border-radius:50%;
  background:var(--paper);box-shadow:inset 0 0 0 1px var(--rule);}
.tp-stub::before{left:-10px;clip-path:inset(0 0 0 50%);}
.tp-stub::after{right:-10px;clip-path:inset(0 50% 0 0);}
.tp-cell{display:flex;flex-direction:column;}
.tp-lbl{font-size:10.5px;font-weight:600;letter-spacing:.1em;color:var(--ink-faint);}
.tp-cell b{font-family:'Archivo',var(--f-body);font-stretch:78%;font-weight:800;font-size:22px;line-height:1.1;font-variant-numeric:tabular-nums;margin-top:2px;}
.tp-cell small{font-size:11px;color:var(--ink-faint);}
.tp-status{justify-self:end;align-self:center;font-size:12px;font-weight:700;padding:5px 11px;border-radius:999px;white-space:nowrap;
  color:var(--gold);background:color-mix(in srgb,var(--gold) 14%,transparent);}
.tp-status.live{color:#14110A;background:var(--gold);}
.tp-status.done{color:var(--ink-faint);background:var(--surface-2);}

/* the itinerary: each stop on pass stock, the line running beside it */
.stopcard{background:var(--stock);border:1px solid var(--rule-soft);border-radius:16px;margin:0 0 10px 2px;
  box-shadow:var(--shadow-1);}
.stopcard::after{display:none;}
.stopname{font-size:15.5px;font-weight:700;}
.time,.stoptime{font-family:'Archivo',var(--f-mono);font-stretch:80%;font-weight:700;}

/* folds read as labelled compartments */
.fold-t{font-weight:800;font-size:16px;}
.fold-h{color:var(--ink-faint);}

/* the day header: a smaller pass of its own */
.dayhead{position:relative;margin-top:18px;padding:20px 18px 18px;background:var(--stock);border-radius:22px;
  box-shadow:0 0 0 1px var(--rule),var(--shadow-2,0 10px 30px -14px rgba(0,0,0,.4));}
.dayhead .kline{background:none;border-top:1.5px dashed var(--lc);height:0;opacity:.55;}
.dayhead .toollist{background:transparent;border-color:var(--rule);}
@media (max-width:360px){ .tp-code{font-size:42px;} .tp-stub{gap:6px 16px;} }


/* 行前準備 and the family's own groups: each block is its own card, so a
   long fold reads as a stack of things to check, not one run-on page */
.fold-body .hsblock,.fold-body .usec{background:var(--stock);border:1px solid var(--rule-soft);border-radius:18px;
  padding:16px 16px 14px;margin:0 0 12px;box-shadow:var(--shadow-1);}
.fold-body .hsblock h3,.fold-body .usec h3,.fold-body .hsblock > :first-child,.fold-body .usec > :first-child{margin-top:0;}
.fold-body .hsblock .wtable{margin-bottom:4px;}
.fold-body .hsblock > .foldtools{float:right;margin:-8px -8px 0 8px;}


/* ---------- stop cards: the photo leads ----------
   A 62px thumbnail beside a paragraph is how a forum post looks. A travel
   app sells the place with the picture, so the photo runs edge to edge
   across the top of the card and the rating sits on it; the text below
   is the caption. Cards without a photo keep the compact layout. */
.stopcard{overflow:hidden;border-radius:20px;}
.stopcard:has(> .stopmain > .thumb) > .stopmain{flex-direction:column;gap:14px;padding:0 16px 4px;}
.stopmain > .thumb{width:auto;height:auto;align-self:stretch;margin:0 -16px;aspect-ratio:16/10;border-radius:0;}
.stopmain > .thumb img{transition:transform .5s ease;}
.stopcard:hover .stopmain > .thumb img{transform:scale(1.03);}
.stopmain > .thumb::after{content:"";position:absolute;inset:0;pointer-events:none;
  background:linear-gradient(to bottom,rgba(0,0,0,.38),transparent 30%,transparent 72%,rgba(0,0,0,.42));}
.thumb-rate{position:absolute;left:12px;bottom:10px;z-index:1;display:inline-flex;align-items:center;gap:4px;
  padding:4px 9px;border-radius:999px;font-family:'Archivo',var(--f-mono);font-stretch:85%;font-weight:800;font-size:13px;
  color:#fff;background:rgba(10,12,16,.45);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);}
.thumb-rate .i{width:13px;height:13px;fill:var(--gold);stroke:var(--gold);}
.stopcard:has(.thumb-rate) .meta-chip.rating{display:none;}
.stopcard:has(> .stopmain > .thumb) > .cardtools{top:10px;right:10px;flex-direction:row;gap:6px;}
.stopcard:has(> .stopmain > .thumb) > .cardtools > *{color:#fff;background:rgba(10,12,16,.4);
  -webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);border-radius:999px;}
.stopcard:has(> .stopmain > .thumb) .stopname{font-size:18px;font-weight:800;letter-spacing:-.015em;line-height:1.35;}
.stopname .kr{display:block;margin:3px 0 0;font-size:12px;}

/* chips: soft fills, no outlines */
.stopcard .meta-chip,.stopcard .niecepick{border:0;background:var(--surface-2);border-radius:999px;padding:4px 10px;font-size:12px;}
.stopcard .meta-chip.rating{background:transparent;padding-left:0;}
.stopcard .meta-chip.closed{background:var(--danger-bg);}
/* the tip: a labelled note, not a quotation */
.stopcard .tipbox{margin:10px 16px 4px;padding:10px 12px 10px 14px;border:0;border-radius:12px;
  background:color-mix(in srgb,var(--gold) 10%,transparent);color:var(--ink);font-size:13.5px;line-height:1.65;}
.stopcard .tipbox::before{content:"提示";display:block;font-size:10.5px;font-weight:700;letter-spacing:.1em;color:var(--gold);margin-bottom:2px;}
/* links: small pills you can actually hit */
.stopfoot{gap:6px;padding:12px 16px 16px;}
.stopfoot .maplink{font-size:12.5px;font-weight:600;color:var(--ink-soft);background:var(--surface-2);
  padding:7px 12px;border-radius:999px;}
.stopfoot .maplink:hover{color:var(--ink);}


/* ---------- transit legs ----------
   The leg between two stops is its own small card: the mode in a disc, the
   time in bold, the route drawn as a line diagram, the map links as pills. */
.seg-text{margin:4px 0 14px 14px;padding:12px 14px 12px;background:color-mix(in srgb,var(--stock) 60%,transparent);
  border:1px dashed var(--rule);border-radius:16px;font-size:13px;color:var(--ink-soft);gap:8px 10px;}
.seg-head{display:inline-flex;align-items:center;gap:10px;font-weight:700;color:var(--ink);font-size:14px;}
.seg-head .icon{width:30px;height:30px;border-radius:50%;display:inline-grid;place-items:center;flex:0 0 auto;
  background:color-mix(in srgb,var(--lc) 18%,transparent);color:var(--lc);}
.seg-head .icon .i{width:16px;height:16px;}
.seg-text .segrefresh{background:var(--surface-2);}
.rchain{list-style:none;margin:2px 0 0;padding:0 0 0 2px;width:100%;}
.rchain li{position:relative;padding-left:22px;}
.rc-st{font-size:13px;font-weight:600;color:var(--ink);line-height:1.5;padding-top:1px;padding-bottom:1px;}
.rc-dot{position:absolute;left:5px;top:50%;width:11px;height:11px;margin-top:-5.5px;border-radius:50%;
  background:var(--stock);box-shadow:inset 0 0 0 2.5px var(--ink-soft);}
.rc-ln{display:flex;align-items:center;gap:8px;flex-wrap:wrap;padding-top:5px;padding-bottom:5px;}
.rc-ln::before{content:"";position:absolute;left:9px;top:-3px;bottom:-3px;width:3px;border-radius:2px;
  background:var(--line,var(--ink-faint));}
.rc-pill{display:inline-block;font-size:11.5px;font-weight:700;color:#fff;background:var(--line,var(--ink-faint));
  padding:2px 9px;border-radius:999px;line-height:1.6;}
.rc-ln small{font-size:11.5px;color:var(--ink-faint);}
.seg-text .seg-links{gap:6px;margin-top:2px;}
.seg-text .seg-links .maplink{font-size:12.5px;font-weight:600;color:var(--ink-soft);background:var(--surface-2);
  padding:7px 12px;border-radius:999px;}
.seg.stale .seg-text{border-color:color-mix(in srgb,var(--warn) 45%,transparent);}
.seg-text > .seg-head{order:0;flex:1 1 auto;}
.seg-text > .segrefresh{order:1;}
.seg-text > .rchain,.seg-text > .seg-route{order:2;}
.seg-text > .seg-links{order:3;}
/* compact: one line — mode disc, time, map link, refresh — with no card
   around it; the route diagram (when there is one) drops underneath */
.seg-text{margin:0 0 0 14px;padding:6px 0;background:none;border:0;border-radius:0;gap:4px 8px;flex-wrap:wrap;}
.seg-head{gap:7px;font-size:13px;font-weight:600;color:var(--ink-soft);}
.seg-head .icon{width:22px;height:22px;}
.seg-head .icon .i{width:12px;height:12px;}
.seg-text > .seg-head{flex:0 1 auto;}
.seg-text > .seg-links{order:1;width:auto;margin:0 0 0 auto;gap:4px;}
.seg-text .seg-links .maplink{font-size:12px;padding:4px 10px;}
.seg-text > .segrefresh{order:2;width:26px;height:26px;margin-left:0;background:none;}
.seg-text > .rchain,.seg-text > .seg-route,.seg-text > .seg-tight{order:3;}
.seg-text .rchain{margin-top:0;}
.seg-text > .rrow{order:3;width:100%;display:flex;flex-wrap:wrap;align-items:center;gap:4px 6px;font-size:12.5px;}
.rr-st{font-weight:700;color:var(--ink);}
.rr-ln{display:inline-flex;align-items:center;gap:4px;}
.rr-ln small{font-size:11px;color:var(--ink-faint);}
.rr-ln i,.stpair i{font-style:normal;color:var(--ink-faint);}
.rc-pill{display:inline-block;font-size:11px;font-weight:700;color:#fff;background:var(--line,var(--ink-faint));padding:1px 8px;border-radius:999px;line-height:1.6;}
.advice{order:5;width:100%;margin-top:4px;padding:9px 12px;border-radius:12px;background:color-mix(in srgb,var(--gold) 9%,transparent);
  border:1px solid color-mix(in srgb,var(--gold) 30%,transparent);display:flex;flex-direction:column;gap:4px;align-items:flex-start;}
.adv-h{display:flex;gap:6px;align-items:flex-start;font-size:13px;color:var(--ink);line-height:1.5;}
.adv-h .i{width:14px;height:14px;color:var(--gold);flex:0 0 auto;margin-top:3px;}
.adv-s{font-size:12px;color:var(--ink-soft);line-height:1.5;padding-left:20px;}
.advice .advmore{margin:4px 0 0 20px;padding:8px 14px;font-size:13px;font-weight:700;background:var(--gold);color:#14110A;border-color:var(--gold);}
.advice .advmore .i{width:14px;height:14px;transform:rotate(-90deg);}
.adv-warn{padding-left:20px;font-size:11px;color:var(--ink-faint);}
.seg-text > .advbtn{order:5;}
.nearlist{display:flex;flex-direction:column;gap:6px;margin:6px 0 10px;}
.nearrow{display:flex;gap:10px;align-items:center;text-align:left;padding:10px 12px;border-radius:12px;
  border:1px solid var(--rule);background:var(--surface);color:var(--ink);width:100%;}
.nr-t{flex:1 1 auto;min-width:0;display:flex;flex-direction:column;gap:2px;}
.nr-n{font-size:14px;font-weight:700;line-height:1.4;color:var(--ink);text-decoration:none;}
.nr-n .i{width:11px;height:11px;color:var(--ink-faint);}
.nr-f{font-size:12px;color:var(--ink-soft);line-height:1.45;}
.nr-a{font-size:11px;color:var(--ink-faint);line-height:1.4;}
.nr-d{display:inline-flex;align-items:center;gap:3px;font-size:12px;font-weight:600;color:var(--ink);line-height:1.4;}
.nr-d svg{width:12px;height:12px;flex:none;color:var(--ink-soft);}
.nr-d.best{color:var(--gold);} .nr-d.best svg{color:var(--gold);}
.ins-sort{display:flex;align-items:center;gap:4px;margin:10px 0 2px;} .ins-sort svg{width:12px;height:12px;}
.nearbtns{display:flex;flex-wrap:wrap;gap:8px;margin:4px 0 8px;}
/* add-place sheet: two ways in */
.instabs{display:grid;grid-template-columns:1fr 1fr;gap:4px;padding:4px;margin:12px 0 14px;border-radius:14px;background:var(--surface-2);}
.instab{display:flex;align-items:center;justify-content:center;gap:6px;padding:10px 8px;border:0;border-radius:11px;background:none;
  color:var(--ink-soft);font:inherit;font-size:14px;font-weight:700;cursor:pointer;}
.instab .i{width:15px;height:15px;}
.instab.on{background:var(--stock);color:var(--ink);box-shadow:var(--shadow-1);}
.instab[data-instab="ai"].on .i{color:var(--gold);}
.instab:focus-visible,.kindtile:focus-visible{outline:2px solid var(--gold);outline-offset:2px;}
.ins-lead{margin:0 0 10px;font-size:13px;color:var(--ink-soft);}
.kindtiles{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:14px;}
.kindtile{display:flex;flex-direction:column;align-items:center;gap:6px;padding:14px 6px 12px;border-radius:16px;cursor:pointer;
  border:1.5px solid var(--rule);background:var(--surface);color:var(--ink-soft);font:inherit;}
.kindtile .i{width:22px;height:22px;}
.kindtile b{font-size:14px;color:var(--ink);}
.kindtile.on{border-color:var(--gold);background:color-mix(in srgb,var(--gold) 12%,var(--surface));color:var(--gold);}
#ins-want{margin:4px 0 10px;}
.prefchips{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:14px;}
.pc-g{display:inline-flex;gap:0;border-radius:999px;overflow:hidden;border:1px solid var(--rule);}
.pc-g .pfchip{border:0;border-radius:0;border-right:1px solid var(--rule);}
.pc-g .pfchip:last-child{border-right:0;}
#ins-go{margin-bottom:8px;}
.sc-fit{display:flex;gap:5px;align-items:flex-start;margin:4px 0 0;font-size:12.5px;font-weight:700;color:var(--gold);line-height:1.5;}
.sc-fit .i{width:13px;height:13px;flex:0 0 auto;margin-top:3px;}
/* the elephant */
.eleload{display:flex;flex-direction:column;align-items:center;gap:6px;padding:14px 8px 10px;text-align:center;}
.eleload > span{font-size:13px;color:var(--ink-soft);line-height:1.5;}
.eleload.small{flex-direction:row;padding:6px 0;gap:10px;text-align:left;}
.eleload.small .ele{width:58px;height:46px;}
.ele{width:132px;height:104px;overflow:visible;}
.ele-body,.ele-skull,.ele-leg,.ele-trunk path:first-child{fill:#9FB0C4;}
.ele-ear{fill:#8DA0B6;}
.ele-ear-in{fill:#F2BFC9;opacity:.85;}
.ele-eye{fill:#1E2430;} .ele-glint{fill:#fff;}
.ele-cheek{fill:#F2A7B6;opacity:.7;}
.ele-tail,.ele-hair{fill:none;stroke:#8DA0B6;stroke-width:2.4;stroke-linecap:round;}
.ele-scarf{fill:var(--gold);}
.ele-shadow{fill:var(--ink);opacity:.12;}
.ele-lens circle{fill:rgba(220,236,255,.7);stroke:#E9C46A;stroke-width:2.4;}
.ele-lens path{stroke:#E9C46A;stroke-width:3;stroke-linecap:round;}
.ele-mapsheet path:first-child{fill:#F4EBD7;stroke:#C9B48A;stroke-width:1.2;}
.ele-route{fill:none;stroke:#D2564C;stroke-width:1.6;stroke-dasharray:3 2;}
.ele-puffs circle{fill:#C9D3DF;opacity:.7;}
.ele-ear,.ele-ear-in{transform-box:fill-box;transform-origin:20% 40%;}
.ele-trunk{transform-box:fill-box;transform-origin:85% 10%;}
.ele-head{transform-box:fill-box;transform-origin:70% 80%;}
.ele-leg{transform-box:fill-box;transform-origin:50% 0;}
/* sniff: trotting, trunk sweeping a magnifying glass */
.ele-sniff .ele-all{animation:ele-trot .9s ease-in-out infinite;}
.ele-sniff .ele-trunk{animation:ele-sweep 1.8s ease-in-out infinite;}
.ele-sniff .l1,.ele-sniff .l4{animation:ele-step .9s ease-in-out infinite;}
.ele-sniff .l2,.ele-sniff .l3{animation:ele-step .9s ease-in-out infinite reverse;}
.ele-sniff .ele-ear.front,.ele-sniff .ele-ear-in{animation:ele-wiggle 1.8s ease-in-out infinite;}
/* fly: big ears flapping, floating up and down */
.ele-fly .ele-all{animation:ele-float 1.6s ease-in-out infinite;}
.ele-fly .ele-ear,.ele-fly .ele-ear-in{animation:ele-flap .32s ease-in-out infinite alternate;}
.ele-fly .ele-shadow{animation:ele-shrink 1.6s ease-in-out infinite;}
.ele-fly .ele-puffs{animation:ele-puff 1.6s ease-out infinite;}
/* map: head tilting over a map, trunk tracing the route */
.ele-map .ele-head{animation:ele-tilt 2.4s ease-in-out infinite;}
.ele-map .ele-trunk{animation:ele-trace 2.4s ease-in-out infinite;}
.ele-map .ele-route{animation:ele-dash 1.2s linear infinite;}
@keyframes ele-trot{0%,100%{transform:translateY(0)}50%{transform:translateY(-2px)}}
@keyframes ele-step{0%,100%{transform:rotate(9deg)}50%{transform:rotate(-9deg)}}
@keyframes ele-sweep{0%,100%{transform:rotate(-10deg)}50%{transform:rotate(14deg)}}
@keyframes ele-wiggle{0%,80%,100%{transform:rotate(0)}88%{transform:rotate(-8deg)}94%{transform:rotate(5deg)}}
@keyframes ele-float{0%,100%{transform:translateY(0)}50%{transform:translateY(-12px)}}
@keyframes ele-flap{from{transform:rotate(-6deg) scaleY(1)}to{transform:rotate(-30deg) scaleY(.8)}}
@keyframes ele-shrink{0%,100%{transform:scaleX(1);opacity:.12}50%{transform:scaleX(.7);opacity:.05}}
@keyframes ele-puff{0%{opacity:0;transform:translate(0,0)}30%{opacity:.7}100%{opacity:0;transform:translate(10px,-6px)}}
@keyframes ele-tilt{0%,100%{transform:rotate(0)}30%{transform:rotate(-9deg)}60%{transform:rotate(4deg)}}
@keyframes ele-trace{0%,100%{transform:rotate(0)}40%{transform:rotate(18deg)}70%{transform:rotate(8deg)}}
@keyframes ele-dash{to{stroke-dashoffset:-10}}
.ele-shadow{transform-box:fill-box;transform-origin:center;}
@media (prefers-reduced-motion:reduce){.ele *{animation:none !important;}}

/* ---------- 住宿: a booking confirmation ----------
   Photo across the top, the hotel name large, then a check-in / check-out
   stub in the same condensed numerals as the trip's pass. */
.fold-body .hsblock[data-hskey="acc"],.stayspage .hsblock[data-hskey="acc"]{padding:0;overflow:hidden;}
.fold-body .hsblock[data-hskey="acc"] > .foldtools,.stayspage .hsblock[data-hskey="acc"] > .foldtools{position:absolute;top:10px;right:10px;z-index:2;float:none;margin:0;}
.fold-body .hsblock[data-hskey="acc"]:has(.stayphoto) > .foldtools .secedit,.stayspage .hsblock[data-hskey="acc"]:has(.stayphoto) > .foldtools .secedit{opacity:1;color:#fff;
  background:rgba(10,12,16,.4);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);border-radius:999px;}
.fold-body .hsblock[data-hskey="acc"] > .hint,.stayspage .hsblock[data-hskey="acc"] > .hint{padding:16px;}
.stayrow{border-top:1px dashed var(--rule);padding:18px 18px 16px;margin:0;}
.stayrow:first-of-type{border-top:0;padding-top:18px;}
.stayrow.hasphoto{padding-top:0;}
.stayphoto{margin:0 -18px 16px;aspect-ratio:16/9;overflow:hidden;position:relative;background:var(--surface-2);}
.stayphoto img{width:100%;height:100%;object-fit:cover;display:block;}
.stayphoto::after{content:"";position:absolute;inset:0;background:linear-gradient(to bottom,rgba(0,0,0,.35),transparent 35%);}
.stayrow .v{font-size:20px;font-weight:800;letter-spacing:-.015em;line-height:1.3;padding-right:56px;}
.stayrow.hasphoto .v{padding-right:0;}
.stayrow .d{font-size:13.5px;color:var(--ink-soft);line-height:1.7;margin-top:6px;}
.stayrow .staystub{display:flex;align-items:flex-end;gap:14px;margin:14px 0 4px;padding:12px 14px;border-radius:14px;
  background:var(--surface-2);font-family:inherit;font-size:inherit;letter-spacing:0;color:inherit;}
.staystub-arrow{color:var(--ink-faint);align-self:center;}
.staystub-arrow .i{width:16px;height:16px;}
.staystub .staynights{margin-left:auto;text-align:right;align-items:flex-end;}
.stayrow .chiprow{margin-top:12px;gap:6px;}
.stayrow .chiprow .maplink,.stayrow .chiprow .copybtn{font-size:12.5px;font-weight:600;color:var(--ink-soft);
  background:var(--surface-2);padding:7px 12px;border-radius:999px;border:0;}

/* ---------- weather: a forecast strip, not a spreadsheet ---------- */
.wtable,.wtable tbody{display:block;}
.wtable tbody{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;padding:2px 0 4px;}
.wtable tbody::-webkit-scrollbar{display:none;}
.wtable tr:first-child:has(th){display:none;}
.wtable tr{display:flex;flex-direction:column;align-items:flex-start;flex:1 0 92px;padding:12px 12px 10px;
  border-radius:14px;background:var(--surface-2);}
.wtable td{display:block;border:0;padding:0;}
.wtable td:first-child{font-family:'Archivo',var(--f-mono);font-stretch:82%;font-weight:700;font-size:12px;
  color:var(--ink-faint);letter-spacing:.04em;margin-bottom:6px;}

  padding:32px 24px calc(32px + env(safe-area-inset-bottom));text-align:center;cursor:pointer;}

  color:var(--ok);background:color-mix(in srgb,var(--ok) 14%,transparent);}

.sgfilter{margin-top:4px;}

.sgask-row .btn{flex:0 0 auto;}


.sgcta{display:flex;flex-wrap:wrap;gap:8px;}
.sgmine{font-size:11px;font-weight:800;color:var(--ink);background:var(--surface);border:1px solid var(--rule);padding:1px 8px;border-radius:999px;}
.sgmore-row{display:flex;flex-wrap:wrap;gap:8px;}


.staysum{display:flex;flex-direction:column;gap:8px;}

  color:var(--ink);font-family:inherit;text-align:left;cursor:pointer;}

.stayspage .hsblock[data-hskey="acc"]{background:var(--stock);border:1px solid var(--rule-soft);border-radius:18px;padding:0;overflow:hidden;position:relative;box-shadow:var(--shadow-1);}
.stayspage .hsblock[data-hskey="acc"] > .foldtools{position:absolute;top:10px;left:12px;z-index:2;margin:0;}

.hsblock[data-hskey="acc"]:has(.stayphoto) > .foldtools .secedit{opacity:1 !important;color:#fff;background:rgba(10,12,16,.45);
  -webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);border-radius:999px;width:32px;height:32px;display:inline-grid;place-items:center;}

.qa{position:relative;}

.sgscore{display:flex;align-items:baseline;flex-wrap:wrap;gap:4px 6px;margin-top:8px;}
