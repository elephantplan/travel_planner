  // toggling which card is expanded — shared by the day view and every
  // bookmark board, so opening one always closes whatever else was open
  function wireOpenToggles(){
    document.querySelectorAll("[data-open]").forEach(btn => btn.addEventListener("click", () => {
      const key = btn.dataset.open;
      if (state.open.has(key)) state.open.delete(key); else { state.open.clear(); state.open.add(key); }
      render();
      if (state.open.has(key)){
        const el = document.querySelector(`[data-editor], [data-boardeditor], [data-noteeditor]`);
        if (el) el.scrollIntoView({ block:"nearest", behavior:"smooth" });
      }
    }));
  }

  // ==================================================================
  // WIRING — one day
  // ==================================================================
  function wireDay(day){
    const line = $("#line");

    const toggle = $("#maptoggle");
    if (toggle) toggle.addEventListener("click", () => {
      if (state.mapsShut.has(day.id)) state.mapsShut.delete(day.id); else state.mapsShut.add(day.id);
      render();
    });
    if (!state.mapsShut.has(day.id)) initDayMap(day);
    autoGeocodeDay(day);          // fire-and-forget; it re-renders as it fills in

    wireOpenToggles();

    const dayEdit = $("#dayedit");
    if (dayEdit) dayEdit.addEventListener("click", e => { e.stopPropagation(); openDayInfoEditSheet(day); });

    // same picker as the in-between ＋, so every position — including the very
    // end — can take either a place or a note
    const addBtn = $("#addstop");
    if (addBtn) addBtn.addEventListener("click", () => openInsertSheet(day, toUnits(day.items).length));

    const dayAi = $("#dayai");
    if (dayAi) dayAi.addEventListener("click", () => openDayAiSheet(day));

    const swapDayBtn = $("#swapday");
    if (swapDayBtn) swapDayBtn.addEventListener("click", () => openDaySwapPicker(day));

    // ---------- 選幾個地點一齊搬 ----------
    const selStart = $("#selstart");
    if (selStart) selStart.addEventListener("click", () => {
      state.selectMode = { dayId: day.id, selected: new Set() };
      render();
    });
    const selCancel = $("#selcancel");
    if (selCancel) selCancel.addEventListener("click", () => { state.selectMode = null; render(); });
    const selMove = $("#selmove");
    if (selMove) selMove.addEventListener("click", () => {
      if (!state.selectMode || !state.selectMode.selected.size) return;
      openMultiMovePicker(day, [...state.selectMode.selected]);
    });
    if (inSelectMode(day)){
      document.querySelectorAll("[data-select]").forEach(el => el.addEventListener("click", () => {
        const idx = +el.dataset.select;
        const sel = state.selectMode.selected;
        if (sel.has(idx)) sel.delete(idx); else sel.add(idx);
        render();
      }));
    }

    // 📷 placeholder on a photo-less stop: fetch one picture, no picker
    // Google's place/photo endpoint answers with a redirect to a temporary
    // lh3.googleusercontent.com URL, and what got stored was that RESOLVED
    // url — which expires after a few weeks. So pictures fetched in July are
    // now dead links, and a dead link renders as the browser's broken-image
    // box. Treat a failed image as "no picture yet": drop the dead url so the
    // card offers to fetch a fresh one instead of showing a torn photo.
    {
      let dead = 0, settle = null;
      document.querySelectorAll("img[data-photoimg]").forEach(img => {
        img.addEventListener("error", () => {
          const u = toUnits(day.items)[+img.dataset.photoimg];
          if (!u || !u.stop || !u.stop.photoUrl) return;
          delete u.stop.photoUrl;
          dead++;
          // one repaint for the lot, however many fail at once
          clearTimeout(settle);
          settle = setTimeout(() => {
            render();
            saveNow(`清走咗 ${dead} 張失效嘅地點相`, true);
          }, 300);
        }, { once:true });
      });
    }

    const getphotos = $("#getphotos");
    if (getphotos) getphotos.addEventListener("click", async () => {
      getphotos.disabled = true;
      const todo = toUnits(day.items).map(u => u.stop)
        .filter(s => s && !s.photoUrl && !s.noPhoto && (s.placeId || s.mapUrl) && plain(s.title));
      let got = 0;
      for (let i = 0; i < todo.length; i++){
        const s = todo[i];
        const btn = $("#getphotos");
        if (btn) btn.innerHTML = `<span class="spin"></span>搵緊…（${i + 1}／${todo.length}）`;
        const name = plain(s.kr) || plain(s.title);
        try {
          const r = await callAi(s.placeId ? { action:"place-photo", placeId:s.placeId }
                                           : { action:"place-photo", query:name });
          if (r && r.ok !== false && r.photos && r.photos.length){ s.photoUrl = r.photos[0]; got++; }
          else s.noPhoto = true;
        } catch (_){ /* one failure must not stop the rest */ }
      }
      render();
      // Not background upkeep: someone pressed a button and waited through
      // dozens of lookups. Persist it promptly instead of letting it ride
      // along with the next edit, which might never come.
      if (got) saveNow(`攞返 ${got} 張地點相`);
      else flash("搵唔到相，可能 Google 嗰邊冇呢啲地點嘅圖。");
    });

    document.querySelectorAll("[data-getphoto]").forEach(el => el.addEventListener("click", async ev => {
      ev.preventDefault();
      ev.stopPropagation();          // sits inside the card button; don't open the editor
      if (el.dataset.busy) return;
      el.dataset.busy = "1";
      el.innerHTML = `<span class="spin"></span>`;
      const s = toUnits(day.items)[+el.dataset.getphoto].stop;
      const name = plain(s.kr) || plain(s.title);
      let got = false;
      try {
        const r = await callAi(s.placeId ? { action:"place-photo", placeId:s.placeId }
                                         : { action:"place-photo", query:name });
        if (r && r.ok !== false && r.photos && r.photos.length){ s.photoUrl = r.photos[0]; got = true; }
      } catch (_){}
      if (!got) s.noPhoto = true;    // don't keep offering a button that finds nothing
      render();
      if (got) saveNow(`搵咗張相俾「${name}」`, true);   // background enrichment, not its own history entry
    }));

    document.querySelectorAll("[data-segrefresh]").forEach(btn => btn.addEventListener("click", async e => {
      e.stopPropagation();
      const i = +btn.dataset.segrefresh;
      state.transitProblem = "";
      await refreshTransit(day, [i]);
    }));

    const recalc = $("#recalc");
    if (recalc) recalc.addEventListener("click", async () => {
      recalc.disabled = true;
      recalc.textContent = "問緊 Google…";
      const units = toUnits(day.items);
      const stale = units.map((u,i) => i).filter(i => i > 0 && units[i].stop && units[i].seg && units[i].seg.stale);
      // if nothing is flagged, redo the whole day rather than doing nothing
      const todo = stale.length ? stale : units.map((u,i) => i).filter(i => i > 0 && units[i].stop);
      state.transitProblem = "";
      await refreshTransit(day, todo);
    });

    const getratings = $("#getratings");
    if (getratings) getratings.addEventListener("click", async () => {
      getratings.disabled = true;
      getratings.textContent = "問緊 Google…";
      const stops = toUnits(day.items).map(u => u.stop).filter(Boolean);
      const { done, why } = await fetchRatings(stops, day.title);
      const btn = $("#getratings");
      if (btn && !done) btn.textContent = why ? "攞唔到：" + why : "呢一日冇再攞到新評分";
    });

    // manual retry — clears the "已試過" marks so a transient failure (quota,
    // network) can be attempted again rather than being remembered as "Google
    // doesn't know this place"
    const getmappoints = $("#getmappoints");
    if (getmappoints) getmappoints.addEventListener("click", () => {
      const stops = toUnits(day.items).map(u => u.stop).filter(Boolean);
      stops.forEach(s => { delete s.noGeo; if (state.geoTried) state.geoTried.delete(s); });
      state.geoProblem = "";
      autoGeocodeDay(day);
    });

    document.querySelectorAll("[data-insert]").forEach(btn =>
      btn.addEventListener("click", () => openInsertSheet(day, +btn.dataset.insert)));

    wireEditor(day);
    wireNoteEditor(day);
    wireDrag(day, line);
  }

  // ---------- insert a place or a note at an exact spot ----------
  async function insertAt(day, pos, what){
    const units = toUnits(day.items);
    const at = Math.max(0, Math.min(pos, units.length));
    if (what === "note"){
      units.splice(at, 0, { seg:null, stop:null, note: blankNote() });
    } else {
      // a place dropped into the middle invalidates the leg into it AND the leg
      // into whatever now follows; flag both rather than showing stale numbers.
      // No lookup yet — it has no name to look up until they type one.
      units.splice(at, 0, { seg:{ kind:"connector", html:"", stale:true }, stop: blankStop() });
      const after = units[at + 1];
      if (after && after.stop && after.seg) after.seg = Object.assign({}, after.seg, { stale:true });
    }
    day.items = fromUnits(units);
    syncMapPoints(day);
    state.open.clear();
    state.open.add(day.id + ":" + at);
    render();
    const inp = document.querySelector('[data-editor] [data-f="title"], [data-noteeditor] [data-nf="text"]');
    if (inp){ inp.focus(); inp.scrollIntoView({ block:"center", behavior:"smooth" }); }
    await saveNow(what === "note" ? "加咗一個 note" : "加咗一個新地點");
  }

  function openInsertSheet(day, pos){
    const units = toUnits(day.items);
    const nameOf = u => u && u.stop ? (plain(u.stop.title) || "未改名嘅地點") : (u && u.note ? "一個 note" : "");
    const before = nameOf(units[pos - 1]), after = nameOf(units[pos]);
    const where = before && after ? `插喺「${before}」同「${after}」之間`
                : before          ? `加喺「${before}」後面`
                : after           ? `加喺「${after}」前面`
                : "加落呢一日";
    openSheet(`
      <h3>加啲咩落呢度？</h3>
      <p class="sec-sub">${esc(where)}。</p>
      <button class="btn wide primary" id="ins-place" style="margin-top:10px;">${icon("pin")}加一個地點</button>
      <p class="sec-sub" style="margin:6px 0 0;">打名嗰陣會自動搵返 Google 地圖真實地點、評分同營業時間。</p>
      <button class="btn wide" id="ins-note" style="margin-top:14px;">${icon("note")}加一段 note</button>
      <p class="sec-sub" style="margin:6px 0 0;">寫低提自己嘅嘢（買定 T-money、記得訂位…），唔會當成一個景點，唔會上地圖。</p>
    `, sheet => {
      sheet.querySelector("#ins-place").addEventListener("click", () => { closeLayer(); insertAt(day, pos, "place"); });
      sheet.querySelector("#ins-note").addEventListener("click", () => { closeLayer(); insertAt(day, pos, "note"); });
    });
  }

  function wireNoteEditor(day){
    const box = document.querySelector("[data-noteeditor]");
    if (!box) return;
    const i = +box.dataset.noteeditor;
    const u = toUnits(day.items)[i];
    if (!u || !u.note) return;

    const ta = box.querySelector('[data-nf="text"]');
    if (ta) ta.addEventListener("input", () => {
      u.note.text = ta.value;
      const shown = box.closest(".notecard").querySelector(".notetext");
      if (shown){
        shown.textContent = ta.value.trim() || "寫低你想記住嘅嘢…";
        shown.classList.toggle("empty", !ta.value.trim());
      }
      saveSoon("改咗一個 note");
    });

    box.querySelectorAll("[data-nact]").forEach(btn => btn.addEventListener("click", async () => {
      if (btn.dataset.nact === "close"){ state.open.clear(); render(); return; }
      if (btn.dataset.nact === "remove"){
        if (!confirm("刪走呢個 note？")) return;
        const units = toUnits(day.items);
        units.splice(i, 1);
        day.items = fromUnits(units);
        state.open.clear();
        render();
        await saveNow("刪走咗一個 note");
      }
    }));
  }

  function wireEditor(day){
    const box = document.querySelector("[data-editor]");
    if (!box) return;
    const i = +box.dataset.editor;
    const units = toUnits(day.items);
    const u = units[i];
    const s = u.stop;

    // plain field edits
    box.querySelectorAll("[data-f]").forEach(el => {
      const evt = el.tagName === "SELECT" ? "change" : "input";
      el.addEventListener(evt, () => {
        s[el.dataset.f] = el.value;
        if (el.dataset.f === "type" || el.dataset.f === "title"){
          const nameEl = box.closest(".stopcard").querySelector(".stopname");
          if (el.dataset.f === "title" && nameEl){
            nameEl.textContent = el.value.trim() || "未改名嘅地點";
            nameEl.classList.toggle("unnamed", !el.value.trim());
          }
          if (el.dataset.f === "type"){
            const node = box.closest(".stop").querySelector(".node");
            if (node) node.dataset.type = el.value;
          }
        }
        saveSoon("改咗「" + (s.title || "一個地點") + "」");
      });
    });

    // google place autocomplete on the name field
    const titleInput = box.querySelector('[data-f="title"]');
    const sugBox = box.querySelector("[data-suggest]");
    let sugTimer = null;
    titleInput.addEventListener("input", () => {
      clearTimeout(sugTimer);
      const q = titleInput.value.trim();
      if (q.length < 2){ sugBox.innerHTML = ""; return; }
      sugTimer = setTimeout(async () => {
        sugBox.innerHTML = `<p class="hint">搵緊…</p>`;
        try {
          const r = await callAi({ action:"place-search", query:q });
          if (r.ok === false){ sugBox.innerHTML = `<p class="hint">${esc(r.message)}</p>`; return; }
          if (!r.places || !r.places.length){ sugBox.innerHTML = `<p class="hint">搵唔到，照用你打嘅名就得。</p>`; return; }
          sugBox.innerHTML = r.places.map((p,ix)=>`
            <button class="suggest-item" data-p="${ix}">
              <div class="n">${esc(p.name)}</div><div class="a">${esc(p.address)}</div>
            </button>`).join("");
          sugBox.querySelectorAll("[data-p]").forEach(b => b.addEventListener("click", async () => {
            const p = r.places[+b.dataset.p];
            s.title = p.name; s.placeId = p.placeId;
            if (Number.isFinite(p.lat)) s.lat = p.lat;
            if (Number.isFinite(p.lng)) s.lng = p.lng;
            // text search already returned these for free — no reason to make
            // the user press the separate "攞評分" button for a place they
            // just picked off Google themselves
            if (Number.isFinite(p.rating)) s.rating = p.rating;
            if (Number.isFinite(p.ratingCount)) s.ratingCount = p.ratingCount;
            s.mapUrl = `https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(p.name)}`;
            titleInput.value = p.name;
            sugBox.innerHTML = `<p class="hint">已揀「${esc(p.name)}」，搵緊相同營業時間…</p>`;
            await Promise.all([enrichHours(s), enrichPhoto(s, p.name)]);
            await saveNow("加咗「" + s.title + "」");
            render();
          }));
        } catch (e){ sugBox.innerHTML = `<p class="hint">搵唔到：${esc(e.message)}</p>`; }
      }, 420);
    });

    // actions
    box.querySelectorAll("[data-act]").forEach(btn => btn.addEventListener("click", async () => {
      const act = btn.dataset.act;

      if (act === "close"){ state.open.clear(); render(); return; }

      if (act === "remove"){
        if (!confirm("刪走「" + (s.title || "呢個地點") + "」？")) return;
        units.splice(i,1);
        day.items = fromUnits(units);
        syncMapPoints(day);
        state.open.clear();
        render();
        await saveNow("刪走咗「" + (s.title || "一個地點") + "」");
        refreshTransit(day, [i]);          // the stop that closed the gap
        return;
      }

      if (act === "up" || act === "down"){
        const j = act === "up" ? i-1 : i+1;
        if (j < 0 || j >= units.length) return;
        const tmp = units[i]; units[i] = units[j]; units[j] = tmp;
        day.items = fromUnits(units);
        state.open.clear(); state.open.add(day.id + ":" + j);
        render();
        await saveNow("調整咗次序");
        refreshTransit(day, [i, j, Math.max(i,j)+1]);
        return;
      }

      if (act === "move"){ openMovePicker({ kind:"day", day, index:i }); return; }

      if (act === "findphoto"){
        // first time: just take the top photo. only offer a choice when replacing one.
        const replacing = !!s.photoUrl;
        const holder = box.querySelector("[data-photos]");
        holder.innerHTML = `<p class="hint">搵緊相…</p>`;
        try {
          const payload = s.placeId ? { action:"place-photo", placeId:s.placeId }
                                    : { action:"place-photo", query:(s.kr || s.title) };
          const r = await callAi(payload);
          if (r.ok === false){ holder.innerHTML = `<p class="hint">${esc(r.message)}</p>`; return; }
          if (!r.photos || !r.photos.length){ holder.innerHTML = `<p class="hint">搵唔到呢度嘅相。</p>`; return; }
          if (!replacing){
            s.photoUrl = r.photos[0];
            await saveNow("加咗「" + (s.title||"一個地點") + "」嘅相");
            render();
            return;
          }
          holder.innerHTML = `<div class="photogrid">${r.photos.map(u2=>`<img src="${esc(u2)}" data-u="${esc(u2)}" class="${u2===s.photoUrl?'on':''}" alt="">`).join("")}</div><p class="hint">撳一張就用嗰張。</p>`;
          holder.querySelectorAll("img").forEach(img => img.addEventListener("click", async () => {
            s.photoUrl = img.dataset.u;
            await saveNow("換咗「" + (s.title||"一個地點") + "」嘅相");
            render();
          }));
        } catch (e){ holder.innerHTML = `<p class="hint">搵唔到：${esc(e.message)}</p>`; }
      }
    }));
  }

  // ---------- move a stop to another day, or to/from a bookmark board ----------
  // source: { kind:"day", day, index } | { kind:"board", board, index }
  // Pulls several stops out of a day at once, keeping their original relative
  // order. Splicing must go highest-index-first so removing one doesn't shift
  // the position of the next one still waiting to be removed.
  function detachStops(day, indices){
    const units = toUnits(day.items);
    const sorted = [...indices].sort((a, b) => a - b);
    const moving = sorted.map(i => units[i].stop);
    [...sorted].sort((a, b) => b - a).forEach(i => units.splice(i, 1));
    day.items = fromUnits(units);
    syncMapPoints(day);
    return moving;
  }

  // Same destinations as the single-item move picker, but for a batch —
  // "同時移動幾個行程去另一日" was a real gap: only one stop could be relocated
  // at a time, so reshuffling a multi-stop chunk meant repeating the picker.
  function openMultiMovePicker(day, indices){
    const count = indices.length;
    const days = state.snapshot.days || [];
    const boards = state.snapshot.boards || [];
    openSheet(`
      <h3>搬去邊度？</h3>
      <p class="sec-sub">揀咗 ${count} 個地點，一齊搬過去，順序唔會變。</p>
      ${days.length ? `
        <p class="picker-label">行程日子</p>
        <div class="daypick">
          ${days.map(d => {
            const here = d.id === day.id;
            return `<button data-today="${d.id}" ${here ? "disabled" : ""} style="--lc:${dayColorVar(d.id)}">
              <span class="bullet"></span>
              <span class="dcode">Day ${d.id.replace('day','')}</span>
              <span>${esc(d.title)}${here?"（而家喺度）":""}</span>
            </button>`;
          }).join("")}
        </div>` : ""}
      <p class="picker-label">心水清單</p>
      <div class="daypick">
        ${boards.map(b => `<button data-toboard="${b.id}" style="--lc:var(--bookmark)">
          <span class="bullet"></span><span class="dcode">${icon("pin")}</span><span>${esc(b.name)}</span>
        </button>`).join("")}
        <button data-newboard style="--lc:var(--bookmark)">
          <span class="bullet"></span><span class="dcode">＋</span><span>開個新清單</span>
        </button>
      </div>
    `, sheet => {
      sheet.querySelectorAll("[data-today]").forEach(b => b.addEventListener("click", async () => {
        const target = dayById(b.dataset.today);
        const moving = detachStops(day, indices);
        const tUnits = toUnits(target.items);
        const landedFrom = tUnits.length;
        moving.forEach(st => { st.kind = "stop"; tUnits.push({ seg:null, stop:st }); });
        target.items = fromUnits(tUnits);
        syncMapPoints(target);
        closeLayer();
        state.selectMode = null;
        state.open.clear();
        state.view = target.id;
        render();
        await saveNow(`搬咗 ${count} 個地點去 ${target.title}`);
        refreshTransit(target, Array.from({ length: moving.length }, (_, k) => landedFrom + k));
        refreshTransit(day, [Math.min(...indices)]);
      }));

      sheet.querySelectorAll("[data-toboard]").forEach(b => b.addEventListener("click", async () => {
        const target = boardById(b.dataset.toboard);
        const moving = detachStops(day, indices);
        moving.forEach(st => target.items.push(st));
        closeLayer();
        state.selectMode = null;
        state.open.clear();
        state.view = target.id;
        render();
        await saveNow(`搬咗 ${count} 個地點去清單「${target.name}」`);
      }));

      const newBoardBtn = sheet.querySelector("[data-newboard]");
      if (newBoardBtn) newBoardBtn.addEventListener("click", async () => {
        state.snapshot.boards = state.snapshot.boards || [];
        const b = newBoard(`清單 ${state.snapshot.boards.length + 1}`);
        state.snapshot.boards.push(b);
        const moving = detachStops(day, indices);
        moving.forEach(st => b.items.push(st));
        closeLayer();
        state.selectMode = null;
        state.open.clear();
        state.view = b.id;
        state.renamingBoard = b.id;
        render();
        await saveNow(`開咗個新清單「${b.name}」，${count} 個地點搬咗入去`);
      });
    });
  }

  function openMovePicker(source){
    const days = state.snapshot.days || [];
    const boards = state.snapshot.boards || [];
    const stop = source.kind === "day" ? toUnits(source.day.items)[source.index].stop : source.board.items[source.index];
    const name = plain(stop.title) || "呢個地點";

    // takes the stop out of wherever it currently lives, fixing up what's left behind
    function detach(){
      if (source.kind === "day"){
        const units = toUnits(source.day.items);
        const moving = units[source.index];
        units.splice(source.index, 1);
        source.day.items = fromUnits(units);
        return moving.stop;
      }
      const [moving] = source.board.items.splice(source.index, 1);
      return moving;
    }
    function afterDetach(){
      if (source.kind === "day"){ syncMapPoints(source.day); refreshTransit(source.day, [source.index]); }
    }

    openSheet(`
      <h3>搬去邊度？</h3>
      <p class="sec-sub">「${esc(name)}」揀個新位置，之後隨時都可以再搬。</p>
      ${days.length ? `
        <p class="picker-label">行程日子</p>
        <div class="daypick">
          ${days.map(d => {
            const here = source.kind === "day" && source.day.id === d.id;
            return `<button data-today="${d.id}" ${here?"disabled":""} style="--lc:${dayColorVar(d.id)}">
              <span class="bullet"></span>
              <span class="dcode">Day ${d.id.replace('day','')}</span>
              <span>${esc(d.title)}${here?"（而家喺度）":""}</span>
            </button>`;
          }).join("")}
        </div>` : ""}
      <p class="picker-label">心水清單</p>
      <div class="daypick">
        ${boards.map(b => {
          const here = source.kind === "board" && source.board.id === b.id;
          return `<button data-toboard="${b.id}" ${here?"disabled":""} style="--lc:var(--bookmark)">
            <span class="bullet"></span><span class="dcode">${icon("pin")}</span>
            <span>${esc(b.name)}${here?"（而家喺度）":""}</span>
          </button>`;
        }).join("")}
        <button data-newboard style="--lc:var(--bookmark)">
          <span class="bullet"></span><span class="dcode">＋</span><span>開個新清單</span>
        </button>
      </div>
    `, sheet => {
      sheet.querySelectorAll("[data-today]").forEach(b => b.addEventListener("click", async () => {
        const target = dayById(b.dataset.today);
        const movingStop = detach();
        movingStop.kind = "stop";
        const tUnits = toUnits(target.items);
        tUnits.push({ seg: null, stop: movingStop });
        target.items = fromUnits(tUnits);
        syncMapPoints(target);
        const landedAt = tUnits.length - 1;
        closeLayer();
        state.open.clear();
        state.view = target.id;
        render();
        await saveNow(`「${name}」搬咗去 ${target.title}`);
        afterDetach();
        refreshTransit(target, [landedAt]);
      }));

      sheet.querySelectorAll("[data-toboard]").forEach(b => b.addEventListener("click", async () => {
        const target = boardById(b.dataset.toboard);
        const movingStop = detach();
        target.items.push(movingStop);
        closeLayer();
        state.open.clear();
        state.view = target.id;
        render();
        await saveNow(`「${name}」搬咗去清單「${target.name}」`);
        afterDetach();
      }));

      const newBoardBtn = sheet.querySelector("[data-newboard]");
      if (newBoardBtn) newBoardBtn.addEventListener("click", async () => {
        state.snapshot.boards = state.snapshot.boards || [];
        const b = newBoard(`清單 ${state.snapshot.boards.length + 1}`);
        state.snapshot.boards.push(b);
        const movingStop = detach();
        b.items.push(movingStop);
        closeLayer();
        state.open.clear();
        state.view = b.id;
        state.renamingBoard = b.id;
        render();
        await saveNow(`開咗個新清單「${b.name}」，「${name}」搬咗入去`);
        afterDetach();
      });
    });
  }

  // A full day-to-day swap — unlike AI 諗行程 (which edits individual stops
  // and can leave the title mismatched, see dayTitleCardsHtml above), this
  // trades EVERYTHING a day's content is made of in one shot, so the result
  // is always internally consistent. `id`/`num`/`date` stay put (the slot on
  // the calendar doesn't move), only the content living in that slot does.
  // Items carry their own connector `seg` data, so segments between stops
  // stay correct automatically — the two days' internal sequencing never
  // touched each other, only which slot they're rendered under changed.
  function swapDayContent(a, b){
    const keys = ["title", "desc", "shortTag", "badges", "items", "mapPoints", "mapCap"];
    for (const k of keys){
      const tmp = a[k];
      a[k] = b[k];
      b[k] = tmp;
    }
    syncMapPoints(a);
    syncMapPoints(b);
  }

  function openDaySwapPicker(day){
    const days = (state.snapshot.days || []).filter(d => d.id !== day.id);
    openSheet(`
      <h3>同邊一日成日對調？</h3>
      <p class="sec-sub">會將 Day ${day.id.replace('day','')}（${esc(day.date)}）同揀嘅嗰日，成日內容（標題、簡介、全部地點）完全對調；日期同 Day 編號本身唔會變，淨係內容搬咗位。</p>
      <div class="daypick">
        ${days.map(d => `<button data-swapto="${d.id}" style="--lc:${dayColorVar(d.id)}">
          <span class="bullet"></span>
          <span class="dcode">Day ${d.id.replace('day','')}</span>
          <span>${esc(d.date)} · ${esc(d.title)}</span>
        </button>`).join("")}
      </div>
    `, sheet => {
      sheet.querySelectorAll("[data-swapto]").forEach(b => b.addEventListener("click", async () => {
        const other = dayById(b.dataset.swapto);
        if (!other) return;
        const aNum = day.id.replace('day',''), bNum = other.id.replace('day','');
        swapDayContent(day, other);
        closeLayer();
        state.open.clear();
        render();
        await saveNow(`Day ${aNum} 同 Day ${bNum} 成日行程完全對調咗`);
      }));
    });
  }

  // Copy (not move) a bookmarked place into a day: the list keeps its copy so
  // the same place can go into several days, or stay parked for later. The
  // AI's suggested day is flagged rather than pre-selected — it's a hint, and
  // the list is still in trip order so nothing jumps around.
  function openCopyPicker(board, index){
    const item = board.items[index];
    if (!item) return;
    const name = plain(item.title) || "呢個地點";
    const days = state.snapshot.days || [];
    const suggested = item.suggestDayId && dayById(item.suggestDayId) ? item.suggestDayId : "";

    openSheet(`
      <h3>複製去邊一日？</h3>
      <p class="sec-sub">「${esc(name)}」會複製一份入去嗰日，清單度呢個仍然留低，之後仲可以再複製去第二日。</p>
      <div class="daypick">
        ${days.map(d => `
          <button data-copyday="${d.id}" style="--lc:${dayColorVar(d.id)}">
            <span class="bullet"></span>
            <span class="dcode">Day ${d.id.replace('day','')}</span>
            <span>${esc(d.title)}${d.id === suggested ? ` <b class="sugg">AI 話呢日順路</b>` : ""}</span>
          </button>`).join("")}
      </div>
    `, sheet => {
      sheet.querySelectorAll("[data-copyday]").forEach(b => b.addEventListener("click", async () => {
        const day = dayById(b.dataset.copyday);
        if (!day) return;
        const copy = Object.assign(blankStop(), JSON.parse(JSON.stringify(item)), { kind:"stop" });
        delete copy.aiRun;            // the badge belongs to the bookmark list, not the itinerary
        delete copy.suggestDayId;
        const units = toUnits(day.items);
        units.push({ seg: null, stop: copy });
        day.items = fromUnits(units);
        syncMapPoints(day);
        const landedAt = units.length - 1;
        closeLayer();
        render();
        await saveNow(`「${name}」複製咗去 ${day.title}（清單度都仲留低）`);
        refreshTransit(day, [landedAt]);
      }));
    });
  }

  // Fallbacks for the hero and the AI brief when a trip hasn't filled them in.
  // Every one is derived from THIS trip's own meta/days — they used to be
  // fixed strings describing one particular trip (a 7-person family going to
  // one city on set dates), which then showed up on every other trip.
  function formatEyebrow(dateStart, dateEnd){
    const a = String(dateStart || "").split("-"), b = String(dateEnd || "").split("-");
    if (a.length < 3 || b.length < 3) return "";
    return `${a[1]}.${a[2]} — ${b[1]}.${b[2]} · ${a[0]}`;
  }
  function defaultEyebrow(snap){
    const m = (snap && snap.meta) || {};
    return formatEyebrow(m.dateStart, m.dateEnd);
  }
  function defaultFacts(snap){
    const n = ((snap && snap.days) || []).length;
    return n ? [`${n} 日行程`] : [];
  }
  function defaultTripBrief(snap){
    const m = (snap && snap.meta) || {};
    const where = (m.destinationLocal || m.title || "").trim();
    const when = (m.dateStart && m.dateEnd) ? `（${m.dateStart} 至 ${m.dateEnd}）` : "";
    return `你係一個廣東話（香港口語）旅遊助理，幫緊一次${where ? "去 " + where + " " : ""}嘅旅行${when}。`;
  }

  // ---------- editing the home page ----------
  // One generic sheet drives every section editor, so adding a field is a line
  // of config rather than another bespoke form. Types:
  //   text / textarea — a single value
  //   lines           — a list, one entry per line (far easier to edit on a
  //                     phone than a repeatable row widget, and it round-trips)
  // A day's own title/intro/tags used to be baked into the seed data with no
  // way to touch them — "更改行程所有嘢都可以 edit 包括嗰一日行程嘅名啊內容 tag"
  // asked for exactly this. Tags keep their colour variant round-trip safe by
  // encoding it as a leading marker the user can type themselves.
  function openDayInfoEditSheet(day){
    const badgeLines = (day.badges || []).map(b => {
      const cls = b.cls || "badge";
      const prefix = cls.includes("warn") ? "!" : cls.includes("note") ? "*" : "";
      return prefix + plain(b.text);
    }).join("\n");
    openEditSheet(`改「${day.title || "呢一日"}」`, "", [
      { key:"shortTag", label:"上面日子切換條嘅短標籤（例如「舊城區」）", type:"text",
        value: day.shortTag || "", placeholder:"例如：舊城區" },
      { key:"title", label:"呢日標題", type:"text", value: day.title || "", placeholder:"例如：舊城區散步全日遊" },
      { key:"desc", label:"簡介", type:"textarea", rows:3, value: day.desc || "" },
      { key:"badges", label:"Tag（一行一個；開頭加 ! 會變黃色提醒，加 * 會變另一種底色）", type:"lines", rows:5,
        value: badgeLines },
    ], async out => {
      day.shortTag = out.shortTag || "";
      day.title = out.title || day.title;
      day.desc = out.desc || "";
      day.badges = (out.badges || []).map(line => {
        let cls = "badge", text = line;
        if (text.startsWith("!")){ cls = "badge warn"; text = text.slice(1).trim(); }
        else if (text.startsWith("*")){ cls = "badge note"; text = text.slice(1).trim(); }
        return { cls, text };
      });
      render();
      await saveNow(`改咗「${day.title}」嘅資料`);
    });
  }

  function openEditSheet(title, sub, fields, onSave){
    openSheet(`
      <h3>${esc(title)}</h3>

            ? `<input class="input" data-ef="${i}" value="${esc(f.value || "")}" placeholder="${esc(f.placeholder || "")}">`
            : `<textarea class="textarea" data-ef="${i}" rows="${f.rows || 4}" placeholder="${esc(f.placeholder || "")}">${esc(f.value || "")}</textarea>`}

    `, sheet => {
      sheet.querySelector("[data-ecancel]").addEventListener("click", closeLayer);

          const raw = sheet.querySelector(`[data-ef="${i}"]`).value;
          out[f.key] = f.type === "lines"
            ? raw.split("\n").map(x => x.trim()).filter(Boolean)
            : raw.trim();

  // The clothing list is stored as HTML (the seed data uses <b> for emphasis).
  // Users edit plain text with **bold** instead, so nothing they type is ever
  // injected as markup — the only tag that can come back out is <b>.
  function htmlToPlainish(html){
    return String(html || "")
      .replace(/<\/?b>/gi, "**")
      .replace(/<br\s*\/?>/gi, " ")
      .replace(/<[^>]+>/g, "")
      .replace(/&amp;/g, "&").replace(/&lt;/g, "<").replace(/&gt;/g, ">").replace(/&quot;/g, '"')
      .trim();
  }
  function plainishToHtml(text){
    return esc(String(text || "").trim()).replace(/\*\*(.+?)\*\*/g, "<b>$1</b>");
  }

  // "icon | text" per line — compact enough to edit on a phone, and the icon
  // stays optional (a line with no pipe is just text).
  function pipeParts(line, n){
    const bits = String(line).split("|").map(x => x.trim());
    while (bits.length < n) bits.push("");
    return bits;
  }

  // Shown after the dates change. A plain confirm() can't list what would be
  // lost, and losing hand-picked places to a mistyped year would be brutal —
  // so this spells out the damage and defaults to parking stops on a board.
  function openDateReconcileSheet(snap, plan, prevStart, prevEnd){
    const droppedWithStops = plan.dropped.filter(x => x.stops.length);
    const stopCount = droppedWithStops.reduce((n, x) => n + x.stops.length, 0);
    const names = droppedWithStops.flatMap(x => x.stopTitles).slice(0, 8);
    const flipsClosed = plan.closureFlips.filter(f => f.nowClosed);
    const flipsOpen = plan.closureFlips.filter(f => !f.nowClosed);

    openSheet(`
      <h3>行程日期改咗</h3>
      <p class="sec-sub">${esc(plan.oldStart || "?")} → <b>${esc(plan.newStart)}</b>，
        ${plan.oldCount} 日 → <b>${plan.newCount} 日</b>。</p>
      ${plan.added.length ? `<div class="ai-msg">會加 ${plan.added.length} 日空白行程（Day ${plan.oldCount + 1}${plan.added.length > 1 ? "-" + plan.newCount : ""}），可以之後叫 AI 幫手諗。</div>` : ""}
      ${plan.dropped.length ? `<div class="ai-msg">Day ${plan.newCount + 1}${plan.dropped.length > 1 ? "-" + plan.oldCount : ""} 會冇咗。${
        stopCount ? `入面有 <b>${stopCount} 個地點</b>：${esc(names.join("、"))}${stopCount > names.length ? " …" : ""}<br>
        撳「確認」會自動搬去一個新清單度收好，唔會消失（但時間、交通、營業時間呢啲會冇咗）。` : "入面冇地點，直接刪走。"}</div>` : ""}
      ${flipsClosed.length ? `<div class="ai-msg">${icon("warn")}改完之後，呢啲地點會撞正公休：${esc(flipsClosed.map(f => f.title).join("、"))}</div>` : ""}
      ${flipsOpen.length ? `<div class="ai-msg">${icon("check")}原本撞公休、改完之後冇事：${esc(flipsOpen.map(f => f.title).join("、"))}</div>` : ""}
      ${plan.seasonShift ? `<div class="ai-msg">日期搬咗好遠／換咗月份，每日嘅標題同季節相關嘅內容可能唔啱用，可以之後叫 AI 重新諗過。</div>` : ""}
      <div class="editor-tools" style="margin-top:14px;flex-wrap:wrap;">
        <button class="btn" data-datecancel>取消（唔改日期）</button>
        <button class="btn primary" data-dateok>確認</button>
      </div>`, layer => {
      layer.querySelector("[data-datecancel]").addEventListener("click", async () => {
        // Only the dates roll back; whatever else they typed in the sheet stays.
        snap.meta.dateStart = prevStart; snap.meta.dateEnd = prevEnd;
        closeLayer(); render();
        await saveNow("改咗首頁標題同目的地資料（日期冇改）");
      });
      layer.querySelector("[data-dateok]").addEventListener("click", async () => {
        const res = applyDayReconcile(snap, plan);
        closeLayer(); render();
        await saveNow(res.summary);
        if (res.notices.length) alert(res.notices.join("\n\n"));
        if (plan.added.length && confirm(`加咗 ${plan.added.length} 日空白行程，而家叫 AI 幫你諗返呢幾日？`)){
          const ids = plan.added.map(a => "day" + a.n);
          genBanner("AI 幫你諗緊新加嗰幾日…");
          try {
            await generateDaysFor(ids, msg => genBanner(msg));
            genBanner("新加嘅日子諗好喇。", { done:true });
          } catch (e){
            genBanner("生成失敗：" + e.message, { done:true });
          }
          setTimeout(() => genBanner(null), 6000);
        }
      });
    });
  }

  // ---------- 住宿：可以唔止一間 ----------
  // A trip can change hotels partway through, so accommodation is a LIST of
  // stays, each covering a range of days. The old single-object shape is
  // migrated on load, and stays[0] is mirrored back onto `accommodation` so the
  // Edge Function (which reads accommodation.name) keeps working unchanged.
  function migrateStays(snap){
    if (!snap) return snap;
    if (!Array.isArray(snap.stays)){
      const a = snap.accommodation;
      const days = snap.days || [];
      snap.stays = (a && (a.name || a.desc))
        ? [Object.assign({}, a, {
            from: days[0] ? days[0].id : "",
            to:   days.length ? days[days.length-1].id : "",
            // the old 「酒店」 map pin IS this hotel, just written down as a bare
            // coordinate — take it over so the pin now belongs to the stay and
            // moves (or disappears) when the stay changes
            lat: legacyHotelPoint(snap)[0],
            lng: legacyHotelPoint(snap)[1],
          })]
        : [];
    }
    return snap;
  }
  // matches the hand-authored unnumbered pin 「酒店」 that every day used to carry
  function isHotelAnchorName(t){ return /^(酒店|住宿|hotel)/i.test(String(t || "").trim()); }
  function legacyHotelPoint(snap){
    for (const d of (snap.days || [])){
      for (const p of (Array.isArray(d.mapPoints) ? d.mapPoints : [])){
        const name = String((Array.isArray(p) ? p[2] : p?.name) || "");
        if (/^\s*\d+\s/.test(name) || !isHotelAnchorName(name)) continue;
        const lat = Number(Array.isArray(p) ? p[0] : p?.lat);
        const lng = Number(Array.isArray(p) ? p[1] : p?.lng);
        if (Number.isFinite(lat) && Number.isFinite(lng)) return [lat, lng];
      }
    }
    return [undefined, undefined];
  }
  function syncAccommodation(snap){
    // keep the legacy field pointing at the first stay: the AI prompt and any
    // older saved snapshot still read it
    const s = (snap.stays || [])[0];
    snap.accommodation = s
      ? { name:s.name||"", desc:s.desc||"", hoursChip:s.hoursChip||"", warning:s.warning||"", mapUrl:s.mapUrl||"" }
      : { name:"", desc:"", hoursChip:"", warning:"", mapUrl:"" };
  }
  function dayIndexById(snap, id){
    return (snap.days || []).findIndex(d => d.id === id);
  }
  // A stay needs its own coordinate, otherwise the 🏨 pin can't move when the
  // hotel changes. Looked up the same way stops are (Google via place-search).
  // A failure leaves the stay with no coordinate — no pin at all beats a pin
  // on the previous hotel.
  async function geocodeStays(snap){
    const todo = (snap.stays || []).filter(s =>
      (s.name || "").trim() && !s.noGeo &&
      !(Number.isFinite(Number(s.lat)) && Number.isFinite(Number(s.lng))));
    if (!todo.length) return;
    let found = 0;
    for (const s of todo){
      try {
        const r = await callAi({ action:"place-search", query: plain(s.name) });
        const p = r && r.places && r.places[0];
        if (p && Number.isFinite(p.lat) && Number.isFinite(p.lng)){
          s.lat = p.lat; s.lng = p.lng; found++;
        } else if (r && r.ok === false){
          break;                 // lookup unavailable — says nothing about this hotel
        } else {
          s.noGeo = true;        // Google has no such place; don't ask again
        }
      } catch (_){ break; }
    }
    if (found){ render(); await saveNow(`搵返住宿喺地圖上面嘅位置`, true); }
    else render();
  }
  // which stay covers this day (first match wins if ranges overlap)
  function stayForDay(snap, day){
    if (!snap || !day) return null;
    const di = dayIndexById(snap, day.id);
    if (di < 0) return null;
    return (snap.stays || []).find(s => {
      const a = dayIndexById(snap, s.from), b = dayIndexById(snap, s.to);
      if (a < 0 || b < 0) return false;
      return di >= Math.min(a,b) && di <= Math.max(a,b);
    }) || null;
  }
  function stayRangeLabel(snap, s){
    const days = snap.days || [];
    const a = days[dayIndexById(snap, s.from)], b = days[dayIndexById(snap, s.to)];
    if (!a && !b) return "未定日子";
    if (a && b && a.id === b.id) return `${a.date}（一晚）`;
    return `${a ? a.date : "?"} → ${b ? b.date : "?"}`;
  }

  // Renaming the hotel on the home page has to reach the itinerary too — Day 1
  // literally says 「抵達 <酒店名>」, so leaving the stops alone is what made an
  // updated 住宿 look like it did nothing. Only whole-name occurrences are
  // swapped, and only for names long enough to be unambiguous.
  function renameStayInItinerary(snap, oldName, newName){
    const from = String(oldName || "").trim(), to = String(newName || "").trim();
    if (!from || !to || from === to || from.length < 3) return 0;
    let hits = 0;
    const swap = t => {
      const s = String(t == null ? "" : t);
      if (!s.includes(from)) return t;
      hits++;
      return s.split(from).join(to);
    };
    (snap.days || []).forEach(d => (d.items || []).forEach(it => {
      if (it.kind !== "stop") return;
      it.title = swap(it.title);
      it.desc  = swap(it.desc);
    }));
    // the hero badge names the hotel too — leaving it behind looks just as
    // stale as the Day 1 stop did
    const m = snap.meta;
    if (m && Array.isArray(m.hotelTags)) m.hotelTags = m.hotelTags.map(swap);
    return hits;
  }

  // A dedicated sheet rather than the generic field editor: each stay has its
  // own block with a from/to day picker, and you can add or remove stays.
  function openStaysSheet(){
    const snap = state.snapshot;
    const days = snap.days || [];
    // work on a copy so 取消 really cancels
    let draft = JSON.parse(JSON.stringify(snap.stays || []));
    if (!draft.length) draft = [{ name:"", desc:"", hoursChip:"", warning:"", mapUrl:"",
                                 from: days[0] ? days[0].id : "", to: days.length ? days[days.length-1].id : "" }];

    const dayOptions = (sel) => days.map(d =>
      `<option value="${esc(d.id)}"${d.id === sel ? " selected" : ""}>Day ${d.id.replace('day','')} · ${esc(d.date)}</option>`).join("");

    const blockHtml = (s, i) => `
      <div class="stayblock" data-stay="${i}">
        <div class="stayblock-head">
          <b>住宿 ${i+1}</b>
          ${draft.length > 1 ? `<button class="btn danger" data-staydel="${i}">刪走</button>` : ""}
        </div>
        <div class="field"><label>住邊度</label>
          <input class="input" data-sf="name" value="${esc(s.name||"")}" placeholder="酒店／Airbnb 名或地址"></div>
        <div class="field"><label>由邊日住到邊日</label>
          <div class="stayrange">
            <select class="input" data-sf="from">${dayOptions(s.from)}</select>
            <span>→</span>
            <select class="input" data-sf="to">${dayOptions(s.to)}</select>
          </div>
        </div>
        <div class="field"><label>描述</label>
          <textarea class="textarea" data-sf="desc" rows="3">${esc(s.desc||"")}</textarea></div>
        <div class="field"><label>入住／退房</label>
          <input class="input" data-sf="hoursChip" value="${esc(s.hoursChip||"")}"></div>
        <div class="field"><label>要注意</label>
          <textarea class="textarea" data-sf="warning" rows="2">${esc(s.warning||"")}</textarea></div>
        <div class="field"><label>地圖連結</label>
          <input class="input" data-sf="mapUrl" value="${esc(s.mapUrl||"")}" placeholder="https://map.naver.com/..."></div>
      </div>`;

    const paint = () => {
      const box = document.querySelector("#staysbox");
      if (box) box.innerHTML = draft.map(blockHtml).join("");
      wireBlocks();
    };
    // read every field back out of the DOM before re-rendering or saving,
    // otherwise switching blocks would throw away what was just typed
    const readBack = () => {
      document.querySelectorAll("#staysbox [data-stay]").forEach(el => {
        const i = +el.dataset.stay;
        el.querySelectorAll("[data-sf]").forEach(f => { draft[i][f.dataset.sf] = f.value.trim(); });
      });
    };
    function wireBlocks(){
      document.querySelectorAll("#staysbox [data-staydel]").forEach(b =>
        b.addEventListener("click", () => { readBack(); draft.splice(+b.dataset.staydel, 1); paint(); }));
    }

    openSheet(`
      <h3>住宿</h3>
      <p class="sec-sub">可以加多過一間 —— 例如頭兩晚住 A，之後轉去 B。改咗酒店名之後，行程入面提到舊名嗰啲景點都會一齊改返。</p>
      <div id="staysbox">${draft.map(blockHtml).join("")}</div>
      <button class="btn wide" id="stayadd" style="margin-top:8px;">＋ 加多一間住宿</button>
      <div class="editor-tools">
        <button class="btn" data-ecancel>取消</button>
        <button class="btn primary" data-esave>儲存</button>
      </div>
    `, sheet => {
      wireBlocks();
      sheet.querySelector("#stayadd").addEventListener("click", () => {
        readBack();
        const last = draft[draft.length - 1];
        const nextFrom = last && dayIndexById(snap, last.to) >= 0 && days[dayIndexById(snap, last.to) + 1]
          ? days[dayIndexById(snap, last.to) + 1].id
          : (days[0] ? days[0].id : "");
        draft.push({ name:"", desc:"", hoursChip:"", warning:"", mapUrl:"",
                     from: nextFrom, to: days.length ? days[days.length-1].id : "" });
        paint();
      });
      sheet.querySelector("[data-ecancel]").addEventListener("click", closeLayer);
      sheet.querySelector("[data-esave]").addEventListener("click", async () => {
        readBack();
        const before = (snap.stays || []).map(s => s.name || "");
        const kept = draft.filter(s => (s.name || s.desc || "").trim());

        // rename propagation, matched up by position
        let renamed = 0;
        kept.forEach((s, i) => {
          if (before[i] && before[i] !== s.name) renamed += renameStayInItinerary(snap, before[i], s.name);
        });
        // a renamed hotel is a DIFFERENT building — its old coordinate would
        // leave the map pin sitting at the previous hotel under the new name
        kept.forEach((s, i) => {
          if (before[i] !== s.name){ delete s.lat; delete s.lng; delete s.noGeo; }
        });

        snap.stays = kept;
        syncAccommodation(snap);
        closeLayer();
        render();
        await saveNow(renamed
          ? `改咗住宿（${kept.length} 間），順手更新咗行程入面 ${renamed} 個提到舊名嘅地方`
          : `改咗住宿（${kept.length} 間）`);
        await geocodeStays(snap);
      });
    });
  }

  // ---------- drag to reorder ----------
  function wireDrag(day, line){
    if (!line) return;
    let drag = null;
    let raf = null;

    // Everything is measured in page coordinates, not viewport ones, so the
    // drag keeps working while the page scrolls underneath it.
    function paint(){
      if (!drag || !drag.active) return;
      const pageY = drag.clientY + window.scrollY;
      drag.el.style.transform = `translateY(${pageY - drag.startPageY}px)`;

      let to = drag.from;
      for (let k = 0; k < drag.rects.length; k++){
        if (k === drag.from) continue;
        const mid = drag.rects[k].top + drag.rects[k].height / 2;
        if (k < drag.from && pageY < mid) to = Math.min(to, k);
        if (k > drag.from && pageY > mid) to = Math.max(to, k);
      }
      if (to !== drag.to){
        drag.to = to;
        const h = drag.rects[drag.from].height;
        drag.units.forEach((u,k) => {
          if (k === drag.from) return;
          u.classList.add("shifting");
          let shift = 0;
          if (drag.to < drag.from && k >= drag.to && k < drag.from) shift = h;
          if (drag.to > drag.from && k > drag.from && k <= drag.to) shift = -h;
          u.style.transform = shift ? `translateY(${shift}px)` : "";
        });
      }
    }

    // hold the card near the top or bottom edge and the page follows
    function tick(){
      if (!drag || !drag.active){ raf = null; return; }
      const edge = 110, vh = window.innerHeight, y = drag.clientY;
      let step = 0;
      if (y < edge) step = -Math.ceil((edge - y) / 5);
      else if (y > vh - edge) step = Math.ceil((y - (vh - edge)) / 5);
      if (step){
        const before = window.scrollY;
        window.scrollBy(0, Math.max(-28, Math.min(28, step)));
        if (window.scrollY !== before) paint();
      }
      raf = requestAnimationFrame(tick);
    }

    line.querySelectorAll("[data-drag]").forEach(handle => {
      handle.addEventListener("pointerdown", e => {
        e.preventDefault();
        const unitEl = handle.closest(".unit");
        const units = Array.from(line.querySelectorAll(".unit"));
        const sy = window.scrollY;
        drag = {
          el: unitEl,
          from: units.indexOf(unitEl),
          to: units.indexOf(unitEl),
          startPageY: e.clientY + sy,
          clientY: e.clientY,
          units,
          rects: units.map(u => { const r = u.getBoundingClientRect(); return { top: r.top + sy, height: r.height }; }),
          active: false,
          timer: setTimeout(() => {
            if (!drag) return;
            drag.active = true;
            unitEl.classList.add("lifted");
            if (navigator.vibrate) navigator.vibrate(12);
            if (!raf) raf = requestAnimationFrame(tick);
          }, 260)
        };
        handle.setPointerCapture(e.pointerId);
      });

      handle.addEventListener("pointermove", e => {
        if (!drag) return;
        if (!drag.active){
          // Moving before the hold timer fires used to CANCEL the drag, on the
          // theory the user meant to scroll. But the handle has
          // touch-action:none and captures the pointer, so it can never scroll
          // the page — pressing and moving straight away (the natural drag
          // gesture) just silently did nothing. Treat that move as the drag
          // starting instead; the timer stays for press-and-hold-still.
          if (Math.abs((e.clientY + window.scrollY) - drag.startPageY) > 6){
            clearTimeout(drag.timer);
            drag.active = true;
            drag.el.classList.add("lifted");
            if (!raf) raf = requestAnimationFrame(tick);
          } else {
            return;
          }
        }
        e.preventDefault();
        drag.clientY = e.clientY;
        paint();
      });

      const finish = () => {
        if (!drag) return;
        clearTimeout(drag.timer);
        if (raf){ cancelAnimationFrame(raf); raf = null; }
        const d = drag; drag = null;
        d.units.forEach(u => { u.style.transform = ""; u.classList.remove("shifting","lifted"); });
        if (!d.active || d.to === d.from) return;
        const units = toUnits(day.items);
        const [moved] = units.splice(d.from, 1);
        units.splice(d.to, 0, moved);
        day.items = fromUnits(units);
        syncMapPoints(day);
        state.open.clear();
        render();
        // follow the card to where it landed, so the drop is never off-screen
        const landed = line.querySelector(`.unit[data-i="${d.to}"]`);
        if (landed) landed.scrollIntoView({ block:"center", behavior:"smooth" });
        saveNow("調整咗次序").then(() =>
          refreshTransit(day, [d.to, d.to + 1, d.from, d.from + 1]));
      };
      handle.addEventListener("pointerup", finish);
      handle.addEventListener("pointercancel", finish);
    });
  }

  // Same long-press-then-drag gesture as wireDrag above, generalised for any
  // vertical list of same-class blocks (home-page sections, custom sections)
  // instead of only itinerary stops. onDrop(from, to) does the actual array
  // move + render + save; this only handles the pointer gesture and the
  // visual shuffle while dragging.
  function wireSimpleDrag(container, itemSelector, handleSelector, onDrop){
    if (!container) return;
    let drag = null;
    let raf = null;

    function paint(){
      if (!drag || !drag.active) return;
      const pageY = drag.clientY + window.scrollY;
      drag.el.style.transform = `translateY(${pageY - drag.startPageY}px)`;
      let to = drag.from;
      for (let k = 0; k < drag.rects.length; k++){
        if (k === drag.from) continue;
        const mid = drag.rects[k].top + drag.rects[k].height / 2;
        if (k < drag.from && pageY < mid) to = Math.min(to, k);
        if (k > drag.from && pageY > mid) to = Math.max(to, k);
      }
      if (to !== drag.to){
        drag.to = to;
        const h = drag.rects[drag.from].height;
        drag.items.forEach((u,k) => {
          if (k === drag.from) return;
          u.classList.add("shifting");
          let shift = 0;
          if (drag.to < drag.from && k >= drag.to && k < drag.from) shift = h;
          if (drag.to > drag.from && k > drag.from && k <= drag.to) shift = -h;
          u.style.transform = shift ? `translateY(${shift}px)` : "";
        });
      }
    }
    function tick(){
      if (!drag || !drag.active){ raf = null; return; }
      const edge = 110, vh = window.innerHeight, y = drag.clientY;
      let step = 0;
      if (y < edge) step = -Math.ceil((edge - y) / 5);
      else if (y > vh - edge) step = Math.ceil((y - (vh - edge)) / 5);
      if (step){
        const before = window.scrollY;
        window.scrollBy(0, Math.max(-28, Math.min(28, step)));
        if (window.scrollY !== before) paint();
      }
      raf = requestAnimationFrame(tick);
    }

    container.querySelectorAll(handleSelector).forEach(handle => {
      handle.addEventListener("pointerdown", e => {
        e.preventDefault();
        const itemEl = handle.closest(itemSelector);
        const items = Array.from(container.querySelectorAll(itemSelector));
        const sy = window.scrollY;
        drag = {
          el: itemEl,
          from: items.indexOf(itemEl),
          to: items.indexOf(itemEl),
          startPageY: e.clientY + sy,
          clientY: e.clientY,
          items,
          rects: items.map(u => { const r = u.getBoundingClientRect(); return { top: r.top + sy, height: r.height }; }),
          active: false,
          timer: setTimeout(() => {
            if (!drag) return;
            drag.active = true;
            itemEl.classList.add("lifted");
            if (navigator.vibrate) navigator.vibrate(12);
            if (!raf) raf = requestAnimationFrame(tick);
          }, 260)
        };
        handle.setPointerCapture(e.pointerId);
      });
      handle.addEventListener("pointermove", e => {
        if (!drag) return;
        if (!drag.active){
          if (Math.abs((e.clientY + window.scrollY) - drag.startPageY) > 6){
            clearTimeout(drag.timer);
            drag.active = true;
            drag.el.classList.add("lifted");
            if (!raf) raf = requestAnimationFrame(tick);
          } else return;
        }
        e.preventDefault();
        drag.clientY = e.clientY;
        paint();
      });
      const finish = () => {
        if (!drag) return;
        clearTimeout(drag.timer);
        if (raf){ cancelAnimationFrame(raf); raf = null; }
        const d = drag; drag = null;
        d.items.forEach(u => { u.style.transform = ""; u.classList.remove("shifting","lifted"); });
        if (!d.active || d.to === d.from) return;
        onDrop(d.from, d.to);
      };
      handle.addEventListener("pointerup", finish);
      handle.addEventListener("pointercancel", finish);
    });
  }

  // ==================================================================
  // MAPS
  // ==================================================================
  // stored points are [lat, lng, name] tuples; the name often carries the
  // stop's own number ("1 Artist Bakery"), so use that rather than inventing one
  // day.mapPoints is a hand-authored [lat,lng,"N 地方名"] list, kept separate
  // from day.items so drag-reorder, cross-day moves, copies and removals never
  // touch it — which is exactly why the mini-map used to keep the OLD
  // order/numbering (or a stale pin for something already deleted) no matter
  // what happened to the actual timeline. This matches each numbered point
  // back to a stop by name and renumbers the points to follow the stops'
  // current order. A point that matches nothing anymore (its stop got
  // deleted) is dropped — a leftover pin for a place no longer on the day is
  // more wrong than losing one hand-authored coordinate.
  function syncMapPoints(day){
    const raw = Array.isArray(day.mapPoints) ? day.mapPoints : [];
    if (!raw.length) return;
    const stopTitles = toUnits(day.items).map(u => u.stop).filter(Boolean).map(s => loose(plain(s.title)));

    const parsed = raw.map(p => {
      const lat = Array.isArray(p) ? p[0] : p?.lat;
      const lng = Array.isArray(p) ? p[1] : p?.lng;
      const name = String((Array.isArray(p) ? p[2] : p?.name) || "");
      const m = name.match(/^\s*(\d+)\s+(.*)$/);
      return { lat, lng, label: m ? m[1] : "", text: m ? m[2] : name };
    });
    const numbered = parsed.filter(p => p.label);
    const anchors  = parsed.filter(p => !p.label);   // e.g. "酒店" — not a stop, keep up front
    if (!numbered.length) return;

    numbered.forEach(p => {
      const l = loose(p.text);
      let idx = stopTitles.findIndex(t => t === l);
      if (idx < 0) idx = stopTitles.findIndex(t => t && l && (t.includes(l) || l.includes(t)));
      p.order = idx;
    });
    const matched = numbered.filter(p => p.order >= 0).sort((a,b) => a.order - b.order);
    matched.forEach((p,i) => { p.label = String(i + 1); });

    day.mapPoints = [...anchors, ...matched].map(p => [p.lat, p.lng, `${p.label} ${p.text}`.trim()]);
  }

  // The single source of truth for what actually shows on a day's map. Older
  // content only ever has coordinates in the hand-authored day.mapPoints list
  // (curated once, a handful of points), while day.items keeps growing —
  // stops added since (via AI suggest, a board copy, or the autocomplete
  // search box) carry their OWN real lat/lng from enrichStop, but nothing
  // ever added them to that old list. Rendering straight from day.mapPoints
  // is why a day with many stops could show only the 3 it originally had.
  // This derives fresh from the CURRENT stops every render: prefer a stop's
  // own coordinate, fall back to a fuzzy name-match against the legacy list,
  // and report what still has neither so the UI can offer to look it up.
  // Every name this stop is known by. The Chinese title alone is often not
  // what the legacy point or Google calls it — "搭乘 ITX-青春 列車" is the point
  // "清涼里站" and the Naver link's search term 청량리역; "北村韓屋村（平緩觀景點）"
  // is 북촌한옥마을. Matching and geocoding both need all of them.
  function stopSearchTerms(s){
    const out = [plain(s.title), plain(s.kr)];
    const m = String(s.mapUrl || "").match(/\/search\/([^/?#]+)/);
    if (m){ try { out.push(decodeURIComponent(m[1]).replace(/\+/g, " ")); } catch (_){} }
    return out.map(t => String(t || "").trim()).filter(Boolean);
  }
  // Rows like 「酒店出發」「自由漫遊／拍照時光」「飛返香港 ✈」 are schedule notes,
  // not places — sending them to Google would pin some unrelated hotel on the
  // map. A row is a real place only if it carries a Korean name or a map link,
  // the same signal the rating and link features already use.
  function isRealPlace(s){
    return !!(s.placeId || plain(s.kr) || String(s.mapUrl || "").trim());
  }
  // what to actually search Google with — Korean first, it matches far better
  function geocodeQuery(s){
    const m = String(s.mapUrl || "").match(/\/search\/([^/?#]+)/);
    let naver = "";
    if (m){ try { naver = decodeURIComponent(m[1]).replace(/\+/g, " ").trim(); } catch (_){} }
    return plain(s.kr) || naver || plain(s.title);
  }

  function resolveDayMapPoints(day){
    const raw = Array.isArray(day.mapPoints) ? day.mapPoints : [];
    const parsed = raw.map(p => {
      const lat = Array.isArray(p) ? p[0] : p?.lat;
      const lng = Array.isArray(p) ? p[1] : p?.lng;
      const name = String((Array.isArray(p) ? p[2] : p?.name) || "");
      const m = name.match(/^\s*(\d+)\s+(.*)$/);
      return { lat: Number(lat), lng: Number(lng), label: m ? m[1] : "", text: m ? m[2] : name };
    }).filter(p => Number.isFinite(p.lat) && Number.isFinite(p.lng));
    // The hand-authored 「酒店」 pin is a frozen coordinate: it kept pointing at
    // the first hotel even after 住宿 was changed, which is exactly the "地圖到
    //仲未update" complaint. Drop it and draw the pin from the stay covering
    // THIS day instead — right name, right place, and it follows a hotel swap
    // partway through the trip.
    const anchors = parsed.filter(p => !p.label && !isHotelAnchorName(p.text));
    const legacy  = parsed.filter(p => p.label);
    const stay = stayForDay(state.snapshot, day);
    if (stay && Number.isFinite(Number(stay.lat)) && Number.isFinite(Number(stay.lng)))
      anchors.unshift({ lat:Number(stay.lat), lng:Number(stay.lng),
                        label:"", text:plain(stay.name) || "住宿" });

    const used = new Set();
    const claimLegacy = s => {
      const terms = stopSearchTerms(s).map(loose).filter(Boolean);
      if (!terms.length) return null;
      let hit = legacy.find(p => !used.has(p) && terms.includes(loose(p.text)));
      if (!hit) hit = legacy.find(p => {
        if (used.has(p)) return false;
        const t = loose(p.text);
        return t && terms.some(l => t.includes(l) || l.includes(t));
      });
      if (hit) used.add(hit);
      return hit || null;
    };

    const points = [];
    const unresolved = [];
    // Keyed by the stop's index in toUnits(day.items) — the same index
    // unitHtml renders with — so the number on a stop card can match the pin
    // it points to on the map without re-deriving the geocoding logic twice.
    const numberByIndex = new Map();
    let n = 0;
    toUnits(day.items).forEach((u, idx) => {
      const s = u.stop;
      if (!s) return;
      const title = plain(s.title);
      if (!title) return;
      let lat = s.lat, lng = s.lng;
      if (!(Number.isFinite(lat) && Number.isFinite(lng))){
        const hit = claimLegacy(s);
        if (hit){ lat = hit.lat; lng = hit.lng; }
      }
      if (Number.isFinite(lat) && Number.isFinite(lng)){
        n++;
        points.push([lat, lng, `${n} ${title}`]);
        numberByIndex.set(idx, n);
      } else if (isRealPlace(s) && !s.noGeo){
        unresolved.push(s);          // a real place Google can probably find
      }
    });

    // A curated point no stop claimed still belongs on the map — dropping it
    // would make the map show LESS than it did before this resolver existed.
    // It rides along as an unnumbered dot, same as the hotel anchor.
    // Exception: 「清涼里站」 and the stop 「搭乘 ITX-青春 列車」 are the same
    // platform written in two scripts, so no name match is possible — but once
    // the stop has been geocoded they land on the same spot. Anything within
    // ~90 m of a numbered pin is already represented; a second dot on top of
    // it is just clutter.
    const near = (a, b) => Math.abs(a[0] - b[0]) < 0.0008 && Math.abs(a[1] - b[1]) < 0.0008;
    const orphans = legacy.filter(p => !used.has(p) && !points.some(q => near(q, [p.lat, p.lng])));

    return {
      tuples: [...anchors.map(p => [p.lat, p.lng, p.text]),
               ...orphans.map(p => [p.lat, p.lng, p.text]),
               ...points],
      unresolved,
      numberByIndex,
    };
  }
  function buildDayMapPoints(day){ return resolveDayMapPoints(day).tuples; }
  function unmappedStops(day){ return resolveDayMapPoints(day).unresolved; }
  // The same numbers shown on the day's map pins, keyed by position in
  // toUnits(day.items) — so a stop card can show "③" and the map pin it
  // points to shows the same "3", instead of the card being unlabeled and
  // the map being the only place the order is visible.
  function dayStopNumbers(day){ return resolveDayMapPoints(day).numberByIndex; }
  // Day 1 has no legacy mapPoints at all, so the map section used to be hidden
  // outright — but its stops are real places that can be looked up, so it
  // should get a map too once they are.
  function hasMappableDay(day){
    const r = resolveDayMapPoints(day);
    return r.tuples.length > 0 || r.unresolved.length > 0;
  }
  // Status sits directly under the map, where the missing pins are visible —
  // not at the bottom of the page past every stop card, where it went unseen.
  function mapNoteHtml(day){
    const busy = state.geoBusy && state.geoBusy.dayId === day.id ? state.geoBusy : null;
    if (busy) return `<p class="mapnote">搵緊未有座標嘅地點…（${busy.done}／${busy.total}）</p>`;
    const missing = unmappedStops(day);
    if (!missing.length) return "";
    return `<p class="mapnote warn">仲有 ${missing.length} 個地點未有座標，未顯示到喺地圖度。` +
           `<button class="linkbtn" id="getmappoints">再試搵一次</button>` +
           `${state.geoProblem ? `<br><span class="geowhy">${esc(state.geoProblem)}</span>` : ""}</p>`;
  }

  // Almost every stop in this trip predates coordinates being stored at all —
  // they only ever had a Naver link. Rather than making someone hunt for a
  // button on all six days, look the missing ones up the first time a day is
  // opened. Dedup is per STOP (not per day): an earlier version remembered
  // "already swept this day" once and never looked again, so a place added
  // later — after the day had already been opened once this session — sat
  // forever with no coordinate and no map number, looking hardcoded even
  // though the resolver itself is fully dynamic. Tracking which individual
  // stops were already tried means a freshly added one is picked up on the
  // very next render, same as any other missing stop.
  async function autoGeocodeDay(day){
    if (state.geoBusy && state.geoBusy.dayId === day.id) return;   // a sweep is already running for this day
    if (!state.geoTried) state.geoTried = new WeakSet();

    const missing = unmappedStops(day).filter(s => !state.geoTried.has(s));
    if (!missing.length) return;
    missing.forEach(s => state.geoTried.add(s));

    state.geoBusy = { dayId: day.id, done: 0, total: missing.length, why: "" };
    render();

    let done = 0, why = "";
    for (const s of missing){
      const query = geocodeQuery(s);
      try {
        const r = await callAi({ action:"place-search", query });
        const p = r && r.places && r.places[0];
        if (p && Number.isFinite(p.lat) && Number.isFinite(p.lng)){
          s.lat = p.lat; s.lng = p.lng;
          if (!s.placeId) s.placeId = p.placeId;
          done++;
        } else if (r && r.ok === false){
          // the whole lookup is unavailable (no API key, quota, outage) — that
          // says nothing about this place, so don't mark it as unfindable and
          // don't burn the remaining calls; surface it and let them retry
          why = r.message || "";
          break;
        } else {
          s.noGeo = true;                  // Google really has no such place
        }
      } catch (e){ why = e.message; break; }
      if (state.geoBusy) state.geoBusy.done = done;
      render();
    }
    state.geoBusy = null;
    state.geoProblem = why;
    if (done) await saveNow(`搵返 ${done} 個地點嘅地圖座標（${day.title}）`, true);
    else render();
  }

  function normPoints(raw){
    if (!Array.isArray(raw)) return [];
    const pts = raw.map(p => {
      const lat = Array.isArray(p) ? p[0] : p?.lat;
      const lng = Array.isArray(p) ? p[1] : p?.lng;
      const name = String((Array.isArray(p) ? p[2] : p?.name) || "");
      const m = name.match(/^\s*(\d+)\s+(.*)$/);
      return {
        lat: Number(lat), lng: Number(lng),
        label: m ? m[1] : "",
        name: m ? m[2] : name
      };
    }).filter(p => Number.isFinite(p.lat) && Number.isFinite(p.lng));
    // The data numbers its own stops ("1 Artist Bakery"); anything without a
    // number is an anchor like the hotel and gets a plain dot, not a number,
    // so it can't collide with a real stop. If nothing is numbered, number them all.
    if (!pts.some(p => p.label)) pts.forEach((p,i) => { p.label = String(i+1); });
    return pts;
  }
  function mapIcon(color, label){
    if (!label) return L.divIcon({
      className:"", iconSize:[13,13], iconAnchor:[6.5,6.5],
      html:`<div class="mapnode plain" style="background:${color}"></div>`
    });
    return L.divIcon({
      className:"", iconSize:[22,22], iconAnchor:[11,11],
      html:`<div class="mapnode" style="background:${color}">${esc(label)}</div>`
    });
  }
  // a bookmarked list item, not a route stop — no polyline connects these, so
  // the pin shape has to read as "saved place" rather than "stop on a route"
  function boardPinIcon(color){
    return L.divIcon({
      className:"", iconSize:[20,20], iconAnchor:[10,20],
      html:`<div class="mapboardpin" style="background:${color}"></div>`
    });
  }
  function initDayMap(day){
    const el = document.getElementById("map-" + day.id);
    if (!el) return;
    try {
      if (typeof L === "undefined"){ el.innerHTML = `<div class="mapfallback">地圖要有網絡先載入到。</div>`; return; }
      const pts = normPoints(buildDayMapPoints(day));
      if (!pts.length){ el.innerHTML = `<div class="mapfallback">呢日仲未有地圖座標。</div>`; return; }
      const map = L.map(el, { scrollWheelZoom:false, dragging:false, tap:false, zoomControl:false, attributionControl:false });
      L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png", { maxZoom:18 }).addTo(map);
      const color = dayHex(day.id);
      const latlngs = pts.map(p => [p.lat, p.lng]);
      L.polyline(latlngs, { color, weight:4, opacity:.85 }).addTo(map);
      pts.forEach(p => L.marker([p.lat,p.lng], { icon: mapIcon(color, p.label) }).addTo(map).bindPopup(p.name || ""));
      const fit = () => { map.invalidateSize(); map.fitBounds(L.latLngBounds(latlngs).pad(0.22)); };
      fit();
      requestAnimationFrame(fit);   // the box was just inserted; re-fit once it has its real size
      el.addEventListener("click", () => { map.dragging.enable(); map.scrollWheelZoom.enable(); }, { once:true });
    } catch (e){
      el.innerHTML = `<div class="mapfallback">地圖載入唔到：${esc(e.message)}</div>`;
    }
  }
  function initOverviewMap(){
    const el = document.getElementById("map-all");
    const legend = document.getElementById("map-legend");
    if (!el) return;
    try {
    if (typeof L === "undefined"){ el.innerHTML = `<div class="mapfallback">地圖要有網絡先載入到。</div>`; return; }
    const map = L.map(el, { scrollWheelZoom:false, dragging:false, tap:false, zoomControl:false, attributionControl:false });
    L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png", { maxZoom:18 }).addTo(map);
    const all = [];
    const layers = {};
    state.snapshot.days.forEach(day => {
      const pts = normPoints(buildDayMapPoints(day));
      if (!pts.length) return;
      const color = dayHex(day.id);
      const latlngs = pts.map(p => [p.lat,p.lng]);
      const g = L.layerGroup();
      L.polyline(latlngs, { color, weight:4, opacity:.8 }).addTo(g);
      pts.forEach(p => L.marker([p.lat,p.lng], { icon: mapIcon(color, p.label) }).bindPopup(p.name||"").addTo(g));
      g.addTo(map);
      layers[day.id] = g;
      all.push(...latlngs);
    });

    // bookmarked places, shown as standalone pins — never joined by a line,
    // since they aren't a route, just a shortlist someone saved for later.
    // Off by default: this map's job is "where does the trip go", and a
    // wishlist with no date yet just clutters that up —撳 legend 先顯示.
    const boardLayerKeys = [];
    (state.snapshot.boards || []).forEach(b => {
      const pts = (b.items || []).filter(it => Number.isFinite(it.lat) && Number.isFinite(it.lng));
      if (!pts.length) return;
      const color = b.color || "#6B6FD1";
      const g = L.layerGroup();
      pts.forEach(it => L.marker([it.lat, it.lng], { icon: boardPinIcon(color) }).bindPopup(esc(plain(it.title) || "")).addTo(g));
      const key = "board:" + b.id;
      layers[key] = g;
      boardLayerKeys.push({ key, board: b });
    });

    if (all.length){
      const fit = () => { map.invalidateSize(); map.fitBounds(L.latLngBounds(all).pad(0.14)); };
      fit();
      requestAnimationFrame(fit);   // the box was just inserted; re-fit once it has its real size
    }
    el.addEventListener("click", () => { map.dragging.enable(); map.scrollWheelZoom.enable(); }, { once:true });

    if (legend){
      const dayLegend = state.snapshot.days.filter(d => layers[d.id]).map(d =>
        `<button class="badge" data-layer="${d.id}" style="cursor:pointer;border-color:${dayHex(d.id)};color:${dayHex(d.id)}">● D${d.id.replace('day','')} ${esc(d.shortTag || "")}</button>`
      ).join("");
      const boardLegend = boardLayerKeys.map(({key, board}) =>
        `<button class="badge" data-layer="${esc(key)}" style="cursor:pointer;opacity:.35;border-color:${esc(board.color)};color:${esc(board.color)}" title="撳顯示「${esc(board.name)}」呢個清單嘅地點">📌 ${esc(board.name)}</button>`
      ).join("");
      legend.innerHTML = dayLegend + boardLegend;
      legend.querySelectorAll("[data-layer]").forEach(b => b.addEventListener("click", () => {
        const g = layers[b.dataset.layer];
        if (map.hasLayer(g)){ map.removeLayer(g); b.style.opacity = ".35"; }
        else { g.addTo(map); b.style.opacity = "1"; }
      }));
    }
    } catch (e){
      el.innerHTML = `<div class="mapfallback">地圖載入唔到：${esc(e.message)}</div>`;
    }
  }

  // ==================================================================
  // RENDER + WIRING — bookmark boards
  // ==================================================================
  function boardHtml(board){

    return `
      <section class="dayhead" style="--lc:var(--bookmark)">

        <p class="intro">呢度淨係放心水地點，未定實邊日去、邊個先去都得。撳景點卡入面嘅「搬去…」就可以擺入某一日，或者搬去另一個清單。</p>

      ${aiLogHtml(board)}

      </div>
      ${!board.items.length ? `<p class="hint">仲未有地點。撳下面「＋」自己加一個，或者去某一日嘅景點卡度撳「搬去邊度」搬過嚟，或者問AI攞主意。</p>` : ""}

      <button class="addstop" id="addboarditem">＋ 加一個地點落「${esc(board.name)}」</button>
      ${ratableCount(board.items) ? `<button class="recalc" id="getboardratings" style="margin-top:8px;">${icon("star")}攞 Google 評分／營業時間（${ratableCount(board.items)} 個地點未有）</button>` : ""}
