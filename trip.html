.sgscore span{font-size:12px;font-weight:700;color:var(--ink-soft);}
.sgscore small{flex-basis:100%;font-size:12.5px;color:var(--ink-soft);line-height:1.5;}
.sgh-room{display:flex;align-items:center;gap:6px;margin-top:8px;font-size:13px;color:var(--ink-soft);}
.sgh-room .i{width:14px;height:14px;color:var(--gold);}
.sgh-conv{margin-top:6px;font-size:13px;color:var(--ink-soft);line-height:1.55;}
.sgh-checking{margin-top:8px;font-size:12px;color:var(--ink-soft);opacity:.8;}

/* ---------- day tools ----------
   Six full-width pills stacked under the map read as six equally urgent
   calls to action. They are one list of occasional chores, so they look
   like one: a single panel, rows divided by hairlines, label left. */
.toollist{margin-top:14px;background:var(--surface);border:1px solid var(--rule-soft);
  border-radius:var(--r-lg);overflow:hidden;}
.toollist:empty{display:none;}
.toollist > .btn,.toollist > .recalc{
  width:100%;margin:0 !important;justify-content:flex-start;gap:11px;
  min-height:48px;padding:12px 16px;border:0;border-radius:0;background:transparent;
  font-size:13.5px;font-weight:500;color:var(--ink);text-align:left;
}
.toollist > * + *{border-top:1px solid var(--rule-soft) !important;}
.toollist > .btn .i,.toollist > .recalc .i{color:var(--ink-faint);width:16px;height:16px;}
.toollist > .dayai .i{color:var(--lc,var(--ink));}
.toollist > .recalc[data-stale="1"]{color:var(--warn);}
.toollist > .recalc[data-stale="1"] .i{color:var(--warn);}
.toollist > *:hover{background:var(--surface-2);}
.toollist > *:active{transform:none;}
.toollist > *:focus-visible{outline:2px solid var(--lc,var(--ink));outline-offset:-2px;}

/* section movers/edit/delete: present, but quiet until you reach for them */
.sectools .secedit{opacity:.38;}
.sectools:hover .secedit,.sectools:focus-within .secedit{opacity:.75;}

/* ---------- 選幾個地點一齊搬 ---------- */
.stopcard.selecting .stopmain{padding-right:14px;cursor:pointer;-webkit-user-select:none;user-select:none;}
.stopcard.selecting{border-color:var(--rule);}
.stopcard.selecting.checked{border-color:var(--lc,var(--ink));}
.selbox{
  flex:0 0 auto;width:20px;height:20px;border-radius:var(--r-sm);margin-top:1px;
  border:1px solid var(--rule);display:grid;place-items:center;color:var(--paper);
}
.stopcard.checked .selbox{background:var(--lc,var(--ink));border-color:transparent;}
.selbox .i{width:13px;height:13px;}
.selectbar{
  position:sticky;bottom:calc(76px + env(safe-area-inset-bottom));z-index:40;
  margin-top:14px;padding:11px 14px;border-radius:var(--r-lg);
  background:var(--surface);border:1px solid var(--rule);box-shadow:var(--shadow-2);
  display:flex;align-items:center;gap:8px;font-size:13px;font-weight:500;
}
.selectbar span{flex:1;}
.selectbar .btn{padding:8px 14px;font-size:12.5px;min-height:36px;}

/* The picker is a full-width sheet, so the candidates get enough room to
   actually be judged — a 70px strip is not something you can choose from. */
.photogrid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-top:12px;}
.photogrid img{
  width:100%;aspect-ratio:4/3;object-fit:cover;border-radius:var(--r-md);
  cursor:pointer;border:2px solid transparent;display:block;background:var(--surface-2);
}
.photogrid img.on{border-color:var(--lc,var(--ink));}
.photogrid img:active{opacity:.75;}

/* ---------- bottom dock ---------- */
/* An installed app that cannot tell you a new version exists is an app that
   never updates — the only remedy left was deleting it off the home screen. */
.updatebar{
  position:fixed;left:50%;transform:translateX(-50%);
  bottom:calc(76px + env(safe-area-inset-bottom));z-index:70;
  display:flex;align-items:center;gap:10px;
  max-width:calc(100% - 32px);
  padding:10px 16px;border:0;cursor:pointer;
  border-radius:999px;background:var(--ink);color:var(--paper);
  box-shadow:var(--shadow-2);font:inherit;font-size:13px;
}
.updatebar-t{font-weight:600;}
.updatebar-a{opacity:.72;}
.addgroup{margin-top:18px;border-style:dashed;}
.addusec{margin:2px 0 14px;border-style:dashed;}
.buildstamp{margin-top:10px;font-family:var(--f-mono);font-size:10.5px;color:var(--ink-faint);}

.dock{
  position:fixed;left:0;right:0;bottom:0;z-index:60;
  display:flex;gap:8px;align-items:center;justify-content:center;
  padding:10px 16px calc(12px + env(safe-area-inset-bottom));
  background:linear-gradient(to top, var(--paper) 58%, transparent);
  pointer-events:none;
}
.dock > *{pointer-events:auto;}
.dockbtn{
  display:inline-flex;align-items:center;gap:7px;cursor:pointer;
  font-family:var(--f-body);font-size:12.5px;font-weight:500;
  padding:10px 16px;border-radius:999px;min-height:40px;
  border:1px solid var(--rule);background:var(--surface);color:var(--ink-soft);
  box-shadow:var(--shadow-1);
}
.dockbtn .dockbtn-i{display:inline-flex;}
.dockbtn .i{width:15px;height:15px;}
.dockbtn:hover{color:var(--ink);}
.dockbtn.accent{background:var(--gold);color:#14110A;border-color:var(--gold);font-weight:700;}
.dockbtn:active{transform:scale(.96);}
.savestate{
  position:fixed;left:50%;top:calc(10px + env(safe-area-inset-top));
  transform:translateX(-50%);z-index:61;
  font-size:11.5px;font-weight:500;padding:6px 13px;border-radius:999px;
  background:var(--ink);color:var(--paper);box-shadow:var(--shadow-1);
  opacity:0;transition:opacity .2s;pointer-events:none;white-space:nowrap;
}
.savestate.on{opacity:1;}

.genbanner{
  position:fixed;left:14px;right:14px;top:calc(10px + env(safe-area-inset-top));z-index:70;
  max-width:520px;margin:0 auto;
  background:var(--surface);border:1px solid var(--rule);border-radius:var(--r-lg);
  box-shadow:var(--shadow-2);padding:14px 16px;font-size:13.5px;display:none;
}
.genbanner.on{display:flex;align-items:center;gap:11px;}
.genbanner .spin,.spin{
  width:15px;height:15px;border-radius:999px;border:2px solid var(--rule);
  border-top-color:var(--ink);flex:none;display:inline-block;animation:genspin .8s linear infinite;
}
.genbanner.done .spin{display:none;}
@keyframes genspin{to{transform:rotate(360deg);}}
.genbanner .txt{flex:1;line-height:1.6;}

/* ---------- sheet + modal ---------- */
.scrim{position:fixed;inset:0;z-index:80;background:color-mix(in srgb,var(--ink) 42%,transparent);backdrop-filter:blur(3px);}
.sheet{
  position:fixed;left:0;right:0;bottom:0;z-index:81;
  max-height:88vh;overflow-y:auto;-webkit-overflow-scrolling:touch;
  background:var(--paper);border-radius:var(--r-xl) var(--r-xl) 0 0;
  box-shadow:var(--shadow-2);border-top:1px solid var(--rule);
  padding:10px 18px calc(24px + env(safe-area-inset-bottom));
  animation:rise .26s cubic-bezier(.2,.8,.3,1);
}
.sheet-wide{max-width:720px;margin:0 auto;}
@keyframes rise{from{transform:translateY(14px);opacity:.4;}to{transform:none;opacity:1;}}
.grabber{width:34px;height:3px;border-radius:2px;background:var(--rule);margin:0 auto 14px;}
.sheet h3{font-size:17px;font-weight:700;margin:0 0 4px;letter-spacing:-.015em;padding-right:52px;}
.sheet .sec-sub{margin-bottom:14px;}
.sheet-close{position:absolute;top:14px;right:18px;}

/* export sheet: grouped by what you're actually trying to do */
.exgroup{margin-top:18px;}
.exgroup:first-of-type{margin-top:6px;}
.exgroup-label{
  font-size:11.5px;font-weight:500;letter-spacing:.01em;
  color:var(--ink-faint);margin-bottom:9px;
}
.exhint{font-size:12px;color:var(--ink-faint);line-height:1.65;margin:8px 2px 0;}

.aibtns{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px;}
.askrow{display:flex;gap:8px;}
.askrow .input{flex:1 1 auto;}
.ai-out{margin-top:14px;display:flex;flex-direction:column;gap:10px;}
.liveres{border:1.5px solid var(--accent);border-left-width:4px;border-radius:var(--r-lg);padding:12px 14px;
  background:color-mix(in srgb, var(--accent) 10%, var(--surface));}
.liveres-head{display:flex;align-items:center;gap:6px;font-size:12px;font-weight:600;color:var(--accent);margin-bottom:8px;}
.liveres-head .i{width:14px;height:14px;}
.liveres-part + .liveres-part{margin-top:10px;padding-top:10px;border-top:1px solid var(--rule-soft);}
.liveres-k{font-size:11px;color:var(--ink-faint);margin-bottom:3px;}
.liveres-v{font-size:13.5px;line-height:1.7;color:var(--ink);white-space:pre-wrap;}
.meta-chip.hours.today{border-color:var(--accent);color:var(--ink);}
.ai-msg{
  background:var(--surface);border:1px solid var(--rule);border-radius:var(--r-md);
  padding:13px 14px;font-size:13.5px;line-height:1.75;white-space:pre-wrap;
}
.ai-msg .i{width:14px;height:14px;margin-right:5px;}
.ai-msg.ok{border-color:color-mix(in srgb,var(--ok) 40%,transparent);}
.dayai{margin-top:10px;}
.askedecho{font-size:12px;color:var(--ink-faint);margin:0 0 3px;}

/* free-form sections the family adds themselves */
/* A section the family wrote used to be a bordered card with four round
   buttons, sitting between a weather table and a packing list that were
   plain headings with small inline icons — two visual languages in one list,
   announcing which parts of the page the app owned. They read the same now. */
.usec{position:relative;}
.usec > h3:first-child{margin-top:26px;}
.usec:first-child > h3:first-child{margin-top:4px;}
.secedit[disabled]{opacity:.22;pointer-events:none;}
.usec-head{display:flex;align-items:flex-start;gap:8px;}
.usec-title{flex:1;font-size:15px;font-weight:600;line-height:1.45;letter-spacing:-.01em;}
.usec-tools{display:flex;gap:2px;flex:none;}
.usec-tools .iconbtn[disabled]{opacity:.25;pointer-events:none;}
.secedit.wordy{display:inline-flex;align-items:center;gap:5px;font-size:12px;padding:5px 9px;opacity:.8;}
.secedit.wordy .i{width:14px;height:14px;}
.foldtools{gap:4px;}
.usec-sub{margin-top:5px;font-size:12px;color:var(--ink-faint);line-height:1.65;}
.usec-list{margin:11px 0 0;padding-left:16px;}
.usec-list li{font-size:13.5px;line-height:1.8;margin-bottom:4px;color:var(--ink-soft);}
.usec-list li::marker{color:var(--ink-faint);}
.usec-by{margin-top:10px;font-size:11px;color:var(--ink-faint);}
.lastupd{margin-top:8px;font-family:var(--f-mono);font-size:10.5px;color:var(--ink-faint);letter-spacing:.01em;}
.lastupd:empty{display:none;}
/* what the live answer would write into the section, shown before the button
   that writes it — the table is numbers, so it needs to be seen as numbers */
.applyprev{
  font-family:var(--f-mono);font-size:12px;line-height:2;
  color:var(--ink-soft);background:var(--surface-2);
  border-radius:var(--r-sm);padding:10px 12px;overflow-x:auto;
}
.applybar{display:flex;flex-wrap:wrap;align-items:center;gap:8px 12px;}
.applybar .hint{margin:0;flex:1 1 180px;min-width:0;}
.usec.lifted{z-index:30;box-shadow:var(--shadow-2);border-color:var(--ink-faint);}
.usec.shifting{transition:transform .18s cubic-bezier(.2,.7,.3,1);}

/* a long AI run needs to look alive: stage, clock, moving bar */
.aibusy{background:var(--surface);border:1px solid var(--rule);border-radius:var(--r-md);padding:13px 14px;margin-top:10px;}
.aibusy-top{display:flex;align-items:center;gap:9px;}
.aibusy-now{font-size:13.5px;font-weight:500;flex:1;}
.aibusy-secs{font-family:var(--f-mono);font-size:11.5px;color:var(--ink-faint);}
.aibusy-spin{width:14px;height:14px;border-radius:50%;flex:none;
  border:2px solid var(--rule);border-top-color:var(--ink);animation:aispin .8s linear infinite;}
@keyframes aispin{to{transform:rotate(360deg)}}
.aibusy-bar{margin-top:10px;height:2px;border-radius:99px;background:var(--surface-2);overflow:hidden;}
.aibusy-bar i{display:block;height:100%;width:38%;border-radius:99px;background:var(--ink-faint);animation:aislide 1.5s ease-in-out infinite;}
@keyframes aislide{0%{margin-left:-38%}100%{margin-left:100%}}
.aibusy-steps{display:flex;flex-wrap:wrap;gap:6px 12px;margin-top:10px;font-size:11.5px;color:var(--ink-faint);}
.aibusy-steps .now{color:var(--ink);font-weight:500;}
.aibusy-steps .done{color:var(--ok);}
.aibusy-steps .i{width:12px;height:12px;}
.aibusy-note{margin-top:9px;font-size:11.5px;line-height:1.65;color:var(--ink-faint);}
@media (prefers-reduced-motion:reduce){.aibusy-spin,.aibusy-bar i,.spin{animation:none}}

.ai-change{background:var(--surface);border:1px solid var(--rule);border-left:2px solid var(--lc,var(--ink));border-radius:var(--r-md);padding:13px 14px;}
.ai-change[data-jumpitem]{cursor:pointer;}
.ai-change[data-jumpitem]:active{background:var(--surface-2);}
.ai-change .op{
  font-size:11px;font-weight:500;letter-spacing:.01em;color:var(--ink-faint);
}
.ai-change .ttl{font-size:14.5px;font-weight:600;margin:4px 0;}
.ai-change .why{font-size:12.5px;color:var(--ink-soft);line-height:1.65;}
.idea-dayhint{font-size:12px;color:var(--ink-faint);margin-top:6px;}

.ideasec-title{
  font-weight:500;font-size:11.5px;letter-spacing:.01em;color:var(--ink-faint);
  margin:18px 2px 9px;
}
.ideasec-title:first-child{margin-top:0;}
.reslink{
  display:block;background:var(--surface);border:1px solid var(--rule);border-radius:var(--r-md);
  padding:12px 14px;margin-bottom:8px;text-decoration:none;color:inherit;
}
.reslink .resname{font-size:13.5px;font-weight:600;color:var(--ink);}
.reslink .resnote{font-size:12px;color:var(--ink-faint);margin-top:3px;line-height:1.55;}

.stayrow{border-top:1px solid var(--rule-soft);padding-top:12px;margin-top:12px;}
.stayrow:first-of-type{border-top:0;padding-top:0;margin-top:0;}
.staywhen{
  font-family:var(--f-mono);font-size:10.5px;color:var(--ink-faint);
  letter-spacing:.01em;margin-bottom:4px;
}
.stayblock{border:1px solid var(--rule);border-radius:var(--r-md);padding:12px 13px;margin-bottom:10px;}
.stayblock-head{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:9px;}
.stayrange{display:flex;align-items:center;gap:8px;}
.stayrange select{flex:1 1 auto;min-width:0;}
.daystay{
  display:inline-flex;align-items:center;gap:7px;
  font-size:12.5px;color:var(--ink-soft);margin-top:12px;
}
.daystay .i{width:14px;height:14px;color:var(--ink-faint);}
.daystay b{color:var(--ink);font-weight:600;}

/* ---------- home page section editing ---------- */
.secedit{
  border:0;background:transparent;cursor:pointer;
  line-height:1;padding:4px;margin-left:4px;

}

.secedit:hover,.secedit:focus-visible{opacity:1;color:var(--ink);background:var(--surface-2);}
.sectools{display:inline-flex;align-items:center;}
/* a block whose fold head already carries its name keeps only the tools */
.foldtools{display:flex;justify-content:flex-end;margin:-6px -4px 2px;}

.fieldhint{font-size:11.5px;line-height:1.65;color:var(--ink-faint);margin:0 0 8px;}

.sechandle{cursor:grab;touch-action:none;user-select:none;-webkit-user-select:none;}
.sechandle:active{cursor:grabbing;color:var(--ink);opacity:1;}
.hsblock{position:relative;}
.hsblock.lifted{z-index:30;outline:1px solid var(--ink-faint);outline-offset:8px;border-radius:10px;}
.hsblock.shifting{transition:transform .18s cubic-bezier(.2,.7,.3,1);}

/* ---------- AI analysis kept above the list ---------- */
.ailog{
  background:transparent;border:0;border-top:1px solid var(--rule);
  border-radius:0;padding:14px 0 0;margin:0 0 16px;
}
.ailog-head{
  font-size:13px;font-weight:600;color:var(--ink);
  display:flex;flex-wrap:wrap;align-items:baseline;gap:8px;margin-bottom:10px;
}
.ailog-sub{font-size:11px;font-weight:400;color:var(--ink-faint);}
.ailog-entry{border-top:1px solid var(--rule-soft);padding-top:10px;margin-top:10px;}
.ailog-entry:first-of-type{border-top:0;padding-top:0;margin-top:0;}
.ailog-entry.latest{border-left:1px solid var(--ink-faint);padding-left:10px;margin-left:-2px;}
.ailog-when{font-family:var(--f-mono);font-size:10.5px;color:var(--ink-faint);margin-bottom:5px;}
.ailog-text{font-size:13px;line-height:1.8;color:var(--ink-soft);white-space:pre-wrap;}
.ailog-note{font-size:11.5px;line-height:1.65;color:var(--ink-faint);margin-top:6px;}
.ailog-links{display:flex;flex-direction:column;gap:6px;margin-top:9px;}
.ailog-links a{
  display:inline-flex;align-items:center;gap:6px;
  font-size:12px;font-weight:400;text-decoration:none;
  color:var(--ink-soft);background:transparent;padding:0;border-radius:0;
}
.ailog-links a .i{width:13px;height:13px;color:var(--ink-faint);}
.ailog-links a:hover{color:var(--ink);}
.ailog-links a small{display:block;font-weight:400;color:var(--ink-faint);margin-top:2px;}
.ailog-entry[data-logtoggle]{cursor:pointer;}
.ailog-entry.collapsed{padding-top:9px;margin-top:9px;}
.ailog-entry.collapsed .ailog-when{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:2px;}
.ailog-entry.collapsed .ailog-note{margin-top:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.ailog-caret{color:var(--ink-faint);flex:0 0 auto;display:inline-flex;transform:rotate(90deg);}
.ailog-caret.open{transform:rotate(-90deg);}
.ailog-caret .i{width:12px;height:12px;}

.ainew{
  font-family:var(--f-mono);font-size:10px;font-weight:500;letter-spacing:.06em;
  text-transform:uppercase;color:var(--ink-faint);
  border:1px solid var(--rule);border-radius:var(--r-sm);padding:2px 7px;
}

.inday{
  display:inline-flex;align-items:center;gap:5px;cursor:pointer;
  font-size:11.5px;font-weight:400;line-height:1.5;
  padding:2px 8px;border-radius:var(--r-sm);max-width:100%;
  border:1px solid var(--lc,var(--rule));background:transparent;color:var(--lc,var(--ink-soft));
}
.inday .i{width:12px;height:12px;}
.inday:active{background:var(--surface-2);}

.copyrow{
  width:100%;margin-top:10px;display:flex;align-items:center;justify-content:center;
  gap:7px;flex-wrap:wrap;
}
.copyrow small{font-weight:400;color:var(--ink-faint);font-size:11px;}
.sugg{color:var(--ink-faint);font-size:11px;font-weight:500;}

/* ---------- asked / answered log ---------- */
.qa{background:var(--surface);border:1px solid var(--rule);border-radius:var(--r-md);margin-bottom:8px;overflow:hidden;}
.qa-head{display:block;width:100%;text-align:left;cursor:pointer;border:0;background:transparent;padding:12px 13px;}
.qa-meta{display:flex;gap:8px;align-items:center;flex-wrap:wrap;}
.qa-meta .when{font-family:var(--f-mono);font-size:10.5px;color:var(--ink-faint);}
.qa-q{display:block;font-size:13.5px;font-weight:500;margin-top:6px;line-height:1.5;}
.qa-head.open .qa-q{color:var(--ink);}
.qa-a{
  padding:0 13px 13px;font-size:13px;line-height:1.8;white-space:pre-wrap;
  color:var(--ink-soft);border-top:1px solid var(--rule-soft);padding-top:11px;
}

.vlist{display:flex;flex-direction:column;gap:8px;}
.vrow{display:flex;gap:11px;align-items:flex-start;background:var(--surface);border:1px solid var(--rule);border-radius:var(--r-md);padding:12px 13px;}
.vrow .who{font-size:13.5px;font-weight:600;}
.vrow .when{font-family:var(--f-mono);font-size:10.5px;color:var(--ink-faint);}
.vrow .sum{font-size:12.5px;color:var(--ink-soft);line-height:1.6;margin-top:4px;}
.vrow .acts{display:flex;gap:7px;flex-wrap:wrap;margin-top:10px;align-items:center;}
.vrow .acts .hint{margin:0;}
.vrow input[type=checkbox]{width:18px;height:18px;flex:0 0 auto;margin-top:3px;accent-color:var(--ink);}
.badge.now{color:var(--ok);border-color:color-mix(in srgb,var(--ok) 40%,transparent);}

.diffwrap{
  background:var(--surface);border:1px solid var(--rule);border-radius:var(--r-md);

}
.diffwrap-title{font-size:13px;font-weight:600;margin:0 0 10px;}
.diffday+.diffday{margin-top:16px;}
.diffday-title{

}
.diffline{font-size:12.5px;line-height:1.75;padding-left:2px;color:var(--ink-soft);}

.diffline-remove{color:var(--danger);}
.diffline-edit{color:var(--ink);}
.diffline-reorder{color:var(--warn);}

.daypick{display:flex;flex-direction:column;gap:6px;}
.daypick button{
  display:grid;grid-template-columns:18px 46px 1fr;align-items:center;gap:12px;
  padding:13px 14px;border-radius:var(--r-md);cursor:pointer;text-align:left;
  border:1px solid var(--rule);background:var(--surface);font-size:14px;font-weight:500;
}

.daypick button:disabled{opacity:.4;cursor:default;}
.daypick .bullet{width:9px;height:9px;border-radius:50%;background:var(--lc);}
.daypick .dcode{font-family:var(--f-mono);font-weight:500;font-size:11.5px;letter-spacing:.02em;color:var(--lc);}
.daypick .dcode .i{width:14px;height:14px;}
.daypick-compact{margin-bottom:12px;}
.daypick-check{
  display:grid;grid-template-columns:18px 18px 46px 1fr;align-items:center;gap:12px;
  padding:12px 14px;border-radius:var(--r-md);cursor:pointer;text-align:left;
  border:1px solid var(--rule);background:var(--surface);font-size:13.5px;font-weight:500;margin-bottom:6px;
}
.daypick-check input{width:16px;height:16px;accent-color:var(--lc);}

footer{padding:40px 0 20px;font-size:11.5px;color:var(--ink-faint);line-height:1.9;border-top:1px solid var(--rule);margin-top:36px;}
footer .fbrand{font-weight:600;font-size:13px;color:var(--ink-soft);margin-bottom:8px;}

.loading{padding:48px 0;text-align:center;color:var(--ink-faint);font-size:13.5px;}
.empty{padding:20px 0;color:var(--ink-faint);font-size:13px;}
.errbox{
  background:var(--danger-bg);border:1px solid color-mix(in srgb,var(--danger) 22%,transparent);
  border-radius:var(--r-md);padding:15px;font-size:13.5px;color:var(--danger);line-height:1.65;
}
.errbox .btn{margin-top:10px;}

@media (min-width:560px){

}

@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.001ms !important;transition-duration:.001ms !important;}
  html{scroll-behavior:auto;}
}

    leaf:      '<path d="M5.2 18.8C3.6 12.4 8 5.2 19.2 4.8c.8 8.8-4.4 14.4-11.6 13.2"/><path d="M8 16c2.4-3.6 5.6-6 9.2-7.6"/>',

    eat:       '<path d="M7 3v7a2 2 0 0 0 2 2v9"/><path d="M5 3v5M9 3v5"/><path d="M17 21V3c-2 1.5-3 4-3 7 0 1.5 1 2.5 3 2.5"/>',

    up:        '<path d="M12 19V5.6"/><path d="m5.8 11.4 6.2-6 6.2 6"/>',
    copy:      '<rect x="8.5" y="8.5" width="11" height="11" rx="2"/><path d="M15.5 8.5V6a1.5 1.5 0 0 0-1.5-1.5H6A1.5 1.5 0 0 0 4.5 6v8A1.5 1.5 0 0 0 6 15.5h2.5"/>',
    down:      '<path d="M12 5v13.4"/><path d="m5.8 12.6 6.2 6 6.2-6"/>',
    image:     '<rect x="3.8" y="5" width="16.4" height="14" rx="2"/><circle cx="8.8" cy="10" r="1.6"/><path d="m4.6 17 4.8-4.6 3.4 3.2 2.8-2.4 3.8 3.4"/>',
  };
  // size follows the text it sits next to unless told otherwise
  function icon(name, cls){
    const d = ICONS[name];
    if (!d) return "";
    return `<svg class="i${cls ? " " + cls : ""}" viewBox="0 0 24 24" aria-hidden="true" focusable="false">${d}</svg>`;
  }

  // When fetch can't reach the server at all it rejects with a TypeError whose
  // message is whatever the browser feels like ("Load failed" on Safari,
  // "Failed to fetch" on Chrome) — which tells the family nothing. The most
  // common real cause is the free-tier database auto-pausing after a week with
  // no traffic, so say that instead. Server-side errors keep their own message,
  // which already names the status code.
  function netMsg(e){
    return (e instanceof TypeError)
      ? "連唔到伺服器。可能係個資料庫暫時瞓着咗（免費方案冇人用夠一個星期就會自動暫停），等一兩分鐘再試下。"
      : e.message;
  }
  // some older records have markup baked into plain-text fields; show the words, not the tags
  // the AI brief is free text the user typed; keep their line breaks (plain()
  // would collapse them, so re-opening the editor would lose the formatting)
  function briefText(snap){ return String((snap && snap.tripBrief) || "").trim(); }
  // The brief is free text the family wrote, so it may not say where or when
  // they're going — the Seoul trip predates the field and has none at all,
  // which is why asking it about the season came back as「話我知你去邊度、
  //幾月出發呀」. Every AI action starts from this string, so state the two
  // facts outright instead of hoping the prose mentions them. Kept on this
  // side rather than in the edge function so the trip stays the single source
  // of truth for its own details.
  function briefForAi(snap){
    const m = (snap && snap.meta) || {};
    const head = briefText(snap) || defaultTripBrief(snap);
    const facts = [];
    const where = String(m.destinationLocal || m.title || "").trim();
    // a brief that already names them (the generated default does) doesn't
    // need the same facts repeated back at the model
    if (where && !head.includes(where)) facts.push("目的地：" + where);
    if (m.dateStart && m.dateEnd && !head.includes(m.dateStart)) facts.push(`日期：${m.dateStart} 至 ${m.dateEnd}`);
    return facts.length ? `${head}\n（今次行程 —— ${facts.join("；")}）` : head;
  }
  function plain(s){
    return String(s == null ? "" : s).replace(/<[^>]*>/g, "").replace(/\s+/g, " ").trim();
  }
  const $ = sel => document.querySelector(sel);

  // ---------- state ----------
  const state = {
    snapshot: null,
    tripId: null,                  // which row in `trips` this page is showing — set once in boot()
    view: "overview",              // "overview" | dayId
    open: new Set(),               // "dayId:unitIndex" currently expanded
    mapsShut: new Set(),           // dayIds whose map the reader collapsed; open by default
    editedBy: (() => { try { return localStorage.getItem("trip_editor_name") || localStorage.getItem("seoul_trip_name") || ""; } catch (_){ return ""; } })(),
    readOnlyLabel: null,           // set when previewing an old version
    renamingBoard: null,           // boardId currently showing its rename input
    boardIdeas: null,              // last AI answer shown inline on a board page
    selectMode: null,               // { dayId, selected:Set<unitIndex> } while multi-selecting stops to move
    openLog: new Set(),            // "boardId:logIndex" of ailog entries expanded beyond the latest
    altsOpen: new Set(),           // "dayId:unitIndex" whose backup picks are unfolded
    // 住宿 starts open: it is the one line on this page somebody reads every
    // evening, so it should not cost a tap. The rest start shut.
    foldOpen: new Set(["stay", "flight", "prep", "extra"]),   // which overview groups are open
    descOpen: new Set()            // stops whose description the reader expanded
  };
  function inSelectMode(day){ return !!(state.selectMode && state.selectMode.dayId === day.id); }

  // never interrupt an edit to ask who is typing; a name can be set in 歷史 if wanted
  function getEditedBy(){ return state.editedBy || "家人"; }
  // Each phone keeps its own name, so 改動紀錄 says who changed what. A phone
  // that never set one shows as 「家人」; it is asked once, on its first edit.
  function setEditorName(n){
    state.editedBy = String(n || "").trim().slice(0, 20);
    try { localStorage.setItem("trip_editor_name", state.editedBy); localStorage.removeItem("seoul_trip_name"); } catch (_){}
  }
  function openNameSheet(after){
    openSheet(`<h3>你係邊個？</h3>
      <p class="sec-sub">呢部機改行程嘅時候，「改動紀錄」會寫呢個名，等大家知邊個改咗咩。只係記喺呢部機。</p>
      <div class="field"><label>你嘅名</label><input class="input" id="nm-in" maxlength="20" value="${esc(state.editedBy || "")}" placeholder="例如：爸爸、阿妹、Tiffany"></div>
      <div class="editor-tools"><button class="btn" data-close>遲啲先</button><button class="btn primary" id="nm-save">儲存</button></div>`,
      layer => {
        const inp = layer.querySelector("#nm-in");
        setTimeout(() => inp.focus(), 50);
        const save = () => { setEditorName(inp.value); closeLayer(); flash(state.editedBy ? `之後嘅改動會寫「${state.editedBy}」` : "冇名，會寫「家人」"); if (after) after(); };
        layer.querySelector("#nm-save").addEventListener("click", save);
        inp.addEventListener("keydown", e => { if (e.key === "Enter") save(); });
      });
  }
  function askNameOnce(){
    if (state.editedBy || state.readonly || navigator.webdriver) return;
    try { if (localStorage.getItem("trip_name_asked")) return; localStorage.setItem("trip_name_asked", "1"); } catch (_){ return; }
    setTimeout(() => { if (!document.querySelector("#layer .sheet")) openNameSheet(); }, 800);
  }

  // ---------- theme ----------
  // The chrome's icons live in markup that ships before the script runs, so
  // fill them in once here rather than duplicating the SVG in the HTML.
  function paintChromeIcons(){
    const put = (sel, name) => { const el = $(sel); if (el) el.innerHTML = icon(name); };
    put("#btn-home .topbtn-i", "home");
    put("#btn-export .topbtn-i", "share");
    put("#btn-reload .topbtn-i", "refresh");
    put("#btn-theme .topbtn-i", "contrast");
    put("#btn-boards .dockbtn-i", "pin");
    put("#btn-history .dockbtn-i", "clock");
    put("#btn-ai .dockbtn-i", "sparkle");
  }
  paintChromeIcons();
  // Safety net for every picture on the page, wherever it is rendered: a
  // photo that won't load gets hidden rather than drawn as a torn-image box.
  // The day view additionally forgets the dead url; this just guarantees the
  // family never sees a broken placeholder while that happens.
  document.addEventListener("error", e => {
    const img = e.target;
    if (img && img.tagName === "IMG"){
      const holder = img.closest(".thumb");
      if (holder) holder.style.display = "none";
    }
  }, true);

  // Export lives in the top bar now, so it is wired once rather than on every
  // render — it is reachable from any day, not just the overview.
  $("#btn-export").addEventListener("click", () => openExportSheet());

  // Four states behind one unlabelled button is one too many to guess at, so
  // switching says which one you landed on.
  const THEMES = ["auto", "light", "dark", "navy"];
  const THEME_NAMES = { auto:"跟系統", light:"淺色", dark:"深色", navy:"深藍" };
  const THEME_BAR = { light:"#F1F3EF", dark:"#0E1211", navy:"#0C1420" };

  // The two <meta theme-color> tags in the markup answer the SYSTEM setting,
  // so they say nothing useful once a theme is picked by hand. An explicit
  // choice gets its own tag ahead of them; "auto" removes it again.
  function setThemeBar(t){
    const head = document.head;
    let m = document.getElementById("theme-bar");
    if (t === "auto" || !THEME_BAR[t]){ if (m) m.remove(); return; }
    if (!m){
      m = document.createElement("meta");
      m.id = "theme-bar"; m.name = "theme-color";
      head.insertBefore(m, head.firstChild);
    }
    m.content = THEME_BAR[t];
  }

  function applyTheme(t){
    if (t === "auto") document.documentElement.removeAttribute("data-theme");
    else document.documentElement.setAttribute("data-theme", t);
    setThemeBar(t);
    localStorage.setItem("seoul_theme", t);
  }
  applyTheme(localStorage.getItem("seoul_theme") || "auto");
  $("#btn-theme").addEventListener("click", () => {
    const cur = localStorage.getItem("seoul_theme") || "auto";
    const next = THEMES[(THEMES.indexOf(cur) + 1 + THEMES.length) % THEMES.length];
    applyTheme(next);
    render();
    flash(THEME_NAMES[next]);
  });

  // ==================================================================
  // DATA
  // ==================================================================
  // Every trip's rows share the same append-only tables, distinguished only
  // by trip_id (see index.html, which creates this row and hands off here
  // via ?trip=<id>) — every read/write below is scoped to state.tripId so
  // one family's other trips never bleed into each other.
  async function fetchLatestVersion(){
    // snapshot=not.is.null skips pruned rows — old versions get their payload
    // nulled out to save space, but stay in the history list (see below).
    const res = await fetch(`${SUPABASE_URL}/rest/v1/itinerary_versions?trip_id=eq.${state.tripId}&snapshot=not.is.null&select=*&order=created_at.desc&limit=1`, { headers: sbHeaders() });
    if (!res.ok) throw new Error("讀取行程失敗 " + res.status);
    return (await res.json())[0] || null;
  }
  async function fetchAllVersions(){
    const res = await fetch(`${SUPABASE_URL}/rest/v1/itinerary_versions?trip_id=eq.${state.tripId}&select=id,created_at,edited_by,source,summary,trivial,has_snapshot&order=created_at.desc`, { headers: sbHeaders() });
    if (!res.ok) throw new Error("讀取歷史失敗 " + res.status);
    return res.json();
  }
  async function fetchVersionSnapshot(id){
    const res = await fetch(`${SUPABASE_URL}/rest/v1/itinerary_versions?id=eq.${id}&select=snapshot`, { headers: sbHeaders() });
    if (!res.ok) throw new Error("讀取版本失敗 " + res.status);
    return (await res.json())[0]?.snapshot || null;
  }
  async function saveVersion(snapshot, source, summary, trivial){
    const res = await fetch(`${SUPABASE_URL}/rest/v1/itinerary_versions`, {
      method: "POST",
      headers: sbHeaders({ "Prefer": "return=representation" }),
      body: JSON.stringify({ trip_id: state.tripId, edited_by: getEditedBy(), source, summary, snapshot, trivial: !!trivial })
    });
    if (!res.ok) throw new Error("儲存失敗 " + res.status + " " + (await res.text()));
    return res.json();
  }
  // The trip background ("who's going, when, 姨姨唔可以行樓梯…") rides along on
  // EVERY ai call, so editing it on the home page changes what all of the AI
  // features assume. Blank means the Edge Function keeps using its built-in
  // default, so clearing the box can't leave the AI with no context at all.
  // Destination coordinates/search-hint/date-range ride along on EVERY call,
  // same as brief — so no caller has to remember to pass them, and the edge
  // function never needs a hardcoded city to fall back on. Read fresh off
  // meta each time (not baked into a const) so re-planning this same app for
  // a different trip is just editing 首頁 fields, no code change anywhere.
  async function callAi(payload){
    const m = (state.snapshot && state.snapshot.meta) || {};
    const body = Object.assign({
      brief: briefForAi(state.snapshot),
      destinationLocal: m.destinationLocal || "",
      lat: Number.isFinite(m.lat) ? m.lat : null,
      lng: Number.isFinite(m.lng) ? m.lng : null,
      dateStart: m.dateStart || "",
      dateEnd: m.dateEnd || "",
    }, payload);
    // Open-Meteo answers today + 15 days. Ask for even one day past that and it
    // rejects the WHOLE request, so a 10/23–10/28 trip checked on 10/12 came
    // back "no forecast yet" though six of its days were covered. Clamp here
    // so it works against the function as deployed, and say which days are
    // still beyond reach.
    if (body.action === "weather" && body.dateEnd){
      const last = new Date(); last.setDate(last.getDate() + 15);
      const lastIso = `${last.getFullYear()}-${String(last.getMonth() + 1).padStart(2, "0")}-${String(last.getDate()).padStart(2, "0")}`;
      if (body.dateEnd > lastIso && body.dateStart <= lastIso){ body.tripEnd = body.dateEnd; body.dateEnd = lastIso; }
    }
    // Everything that can go wrong INSIDE the edge function comes back as
    // {ok:false, message} with CORS headers on it. So if fetch itself rejects,
    // or the reply has no readable JSON, the request died before the function
    // could answer — the worker was killed mid-call (a Gemini call that never
    // returns keeps it running until the platform pulls the plug), or the
    // network dropped. Both surface as a bare TypeError whose message is the
    // browser's own wording ("Load failed" / "Failed to fetch"), so translate.
    const ctl = new AbortController();
    // A Gemini text call that hasn't answered in a minute is not about to.
    // Bail well before the platform's own ~150s kill, which closes the socket
    // with no status and no CORS header — i.e. silently, with nothing to show.
    const timer = setTimeout(() => ctl.abort(), 60000);
    let res;
    try {
      res = await fetch(FUNCTIONS_URL, { method:"POST", headers: sbHeaders(), body: JSON.stringify(body), signal: ctl.signal });
    } catch (e){
      if (e && e.name === "AbortError"){
        throw new Error("AI 諗咗超過 60 秒都未有回音，可能係 Gemini 塞緊車。等一陣再撳多次。");
      }
      if (e instanceof TypeError){
        // NOT the same story as a dead database — the page itself is clearly
        // loading, so blame the call, not the DB.
        throw new Error("連唔到 AI 服務。可能係今次 call 做得太耐俾系統中斷咗，或者網絡斷開咗，再試一次通常就得。");
      }
      throw e;
    } finally {
      clearTimeout(timer);
    }
    try {
      return await res.json();
    } catch (e){
      throw new Error(`AI 服務答咗個空白／壞咗嘅回覆（HTTP ${res.status}）。多數係今次 call 做得太耐俾系統中斷咗，再試一次通常就得。`);
    }
  }

  // One picture for one place, stored on our side so the link never lapses.
  // Google's own photo URLs expire after a few weeks — the whole Seoul trip's
  // pictures died that way — so the bytes are copied into a storage bucket the
  // first time anyone asks, and every later request just gets the same URL.
  async function fetchStoredPhoto(s, count){
    const m = (state.snapshot && state.snapshot.meta) || {};
    const body = s.placeId ? { placeId: s.placeId }
                           : { query: plain(s.kr) || plain(s.title) };
    body.locationHint = m.destinationLocal || "";
    body.count = count || 1;
    const ctl = new AbortController();
    const timer = setTimeout(() => ctl.abort(), 45000);
    try {
      const res = await fetch(PHOTO_URL, {
        method:"POST", headers: sbHeaders(), body: JSON.stringify(body), signal: ctl.signal,
      });
      return await res.json();
    } catch (e){
      return { ok:false, message: e && e.name === "AbortError"
        ? "攞相攞咗太耐，等陣再試。" : "連唔到攞相嘅服務。" };
    } finally {
      clearTimeout(timer);
    }
  }

  // Google usually holds several pictures of a place, and the one it ranks
  // first is quite often a car park, a signboard or somebody's dinner. So every
  // request now asks for a few and whoever tapped picks one, instead of having
  // Google's first guess imposed on the card.
  //
  // Picking is what saves. Closing the sheet leaves the stop exactly as it was,
  // which matters because the pictures are already in our bucket by then — a
  // second look costs nothing and fetches nothing.
  const PHOTO_CHOICES = 4;

  function openPhotoPicker(s){
    const name = plain(s.title) || plain(s.kr) || "呢個地點";
    openSheet(`
      <h3>${esc(name)}</h3>
      <p class="sec-sub">撳一張就用嗰張。</p>
      <div data-picker><p class="exhint">搵緊相…</p></div>
    `, async sheet => {
      const holder = sheet.querySelector("[data-picker]");
      let r;
      try { r = await fetchStoredPhoto(s, PHOTO_CHOICES); }
      catch (e){ r = { ok:false, message:"攞相失敗：" + e.message }; }
      if (!holder.isConnected) return;       // sheet was closed while we waited

      if (r && r.ok === false){
        holder.innerHTML = `<p class="exhint">${esc(r.message || "搵唔到呢度嘅相。")}</p>`;
        // Only "this place genuinely has no pictures" retires the button.
        // Google refusing us, a timeout or a bad key are OUR problems, and
        // hiding the button then would quietly make the failure permanent.
        if (r.reason === "nophoto"){ s.noPhoto = true; render(); }
        return;
      }
      const photos = (r && r.urls) || (r && r.url ? [r.url] : []);
      if (!photos.length){
        holder.innerHTML = `<p class="exhint">搵唔到呢度嘅相。</p>`;
        return;
      }
      holder.innerHTML = `<div class="photogrid">${photos.map(u =>
        `<img src="${esc(u)}" data-u="${esc(u)}" class="${u === s.photoUrl ? "on" : ""}" alt="">`
      ).join("")}</div>`;
      holder.querySelectorAll("img").forEach(img => img.addEventListener("click", async () => {
        const had = !!s.photoUrl;
        s.photoUrl = img.dataset.u;
        delete s.noPhoto;
        closeLayer();
        render();
        await saveNow(`${had ? "換咗" : "加咗"}「${name}」嘅相`);
      }));
    });
  }

  // Every AI answer is kept, so the family can read back what was asked.
  async function saveAiNote(kind, question, answer){
    if (!answer) return;
    try {
      await fetch(`${SUPABASE_URL}/rest/v1/ai_notes`, {
        method: "POST",
        headers: sbHeaders(),
        body: JSON.stringify({ trip_id: state.tripId, asked_by: getEditedBy(), kind, question: question || null, answer })
      });
    } catch (e) { /* an unsaved note must never block the answer on screen */ }
  }
  async function fetchAiNotes(){
    const res = await fetch(`${SUPABASE_URL}/rest/v1/ai_notes?trip_id=eq.${state.tripId}&select=*&order=created_at.desc&limit=100`, { headers: sbHeaders() });
    if (!res.ok) throw new Error("讀取紀錄失敗 " + res.status);
    return res.json();
  }

  function flash(msg, keep){
    const el = $("#savestate");
    el.textContent = msg;
    el.classList.add("on");
    if (!keep) setTimeout(() => el.classList.remove("on"), 1900);
  }

  // ==================================================================
  // SAVING — coalesced
  //
  // Every save POSTs the ENTIRE snapshot as a new append-only row (~100 KB
  // each). One trip had accumulated 792 rows / 83 MB that way, because every
  // background touch wrote its own row: applying one AI suggestion produced
  // 2-3 rows, generating a fresh trip produced 40+.
  //
  // So writes are now queued instead of fired:
  //   • "user" changes debounce ~1s and collapse into ONE row
  //   • "upkeep" (recomputed transit, fetched ratings, geocoding, photos)
  //     NEVER starts a timer of its own — it just marks the snapshot dirty
  //     and rides along with the next real save. That is the whole mechanism
  //     for "background work doesn't get its own history entry".
  //   • a flush whose snapshot is byte-identical to the last persisted one
  //     is skipped entirely
  // Nothing is lost: a periodic flush covers long runs (generation takes
  // minutes), hiding the tab flushes immediately, and a failed write falls
  // back to a localStorage mirror.
  // ==================================================================
  const saver = {
    lastPersistedJson: "",
    pendingUser: [],          // human summaries, in order, deduped
    pendingUpkeep: false,
    timer: null, maxTimer: null, periodic: null,
    inFlight: null, again: false,
    paused: false,            // true while previewing an old version
  };
  function snapJson(){ try { return JSON.stringify(state.snapshot); } catch (e){ return ""; } }
  function saverDirty(){ return saver.pendingUser.length > 0 || saver.pendingUpkeep; }
  function combinedSummary(){
    const seen = [], out = [];
    saver.pendingUser.forEach(s => { const t = String(s || "").trim(); if (t && !seen.includes(t)){ seen.push(t); out.push(t); } });
    if (!out.length) return "自動更新（交通／評分／座標）";
    if (out.length === 1) return out[0];
    if (out.length === 2) return out[0] + "、" + out[1];
    return `${out[0]} 等 ${out.length} 項改動`;
  }
  function mirrorPending(){
    if (!saverDirty() || !state.tripId) return;
    try { localStorage.setItem(`trip:${state.tripId}:pending`, JSON.stringify({ at: Date.now(), snapshot: state.snapshot })); }
    catch (e){ /* quota — nothing better to do than drop the mirror */ }
  }
  function clearMirror(){
    try { localStorage.removeItem(`trip:${state.tripId}:pending`); } catch (e){}
  }
  function cancelPending(){
    clearTimeout(saver.timer); clearTimeout(saver.maxTimer);
    saver.timer = saver.maxTimer = null;
    saver.pendingUser = []; saver.pendingUpkeep = false;
  }
  function scheduleFlush(delay){
    clearTimeout(saver.timer);
    saver.timer = setTimeout(() => flushSaves("debounce"), delay);
    // however fast edits keep arriving, land something within 8s
    if (!saver.maxTimer) saver.maxTimer = setTimeout(() => flushSaves("max"), 8000);
  }
  function queueSave(summary, kind){
    if (state.readonly) return;
    if (kind === "upkeep"){ saver.pendingUpkeep = true; return; }
    saver.pendingUser.push(summary);
    flash("改咗，未存…", true);
    scheduleFlush(1000);
  }
  async function flushSaves(reason){
    clearTimeout(saver.timer); clearTimeout(saver.maxTimer);
    saver.timer = saver.maxTimer = null;
    if (saver.paused || !saverDirty() || !state.snapshot) return;
    if (saver.inFlight){ saver.again = true; return saver.inFlight; }

    const json = snapJson();
    if (json && json === saver.lastPersistedJson){   // nothing actually changed
      saver.pendingUser = []; saver.pendingUpkeep = false;
      flash("已儲存");
      return;
    }
    const summary = combinedSummary();
    const trivial = saver.pendingUser.length === 0;
    saver.pendingUser = []; saver.pendingUpkeep = false;

    flash("儲存緊…", true);
    saver.inFlight = (async () => {
      let lastErr = null;
      for (let attempt = 0; attempt < 3; attempt++){
        try {
          await saveVersion(state.snapshot, "manual", summary, trivial);
          saver.lastPersistedJson = json;
          clearMirror();
          flash("已儲存");
          return true;
        } catch (e){
          lastErr = e;
          await new Promise(r => setTimeout(r, [1000, 4000, 0][attempt]));
        }
      }
      // put the work back so a later flush retries it, and keep a local copy
      saver.pendingUser.unshift(summary);
      mirrorPending();
      flash("儲存唔到，改動暫時只留喺呢部機");
      return false;
    })();
    try { await saver.inFlight; } finally { saver.inFlight = null; }
    if (saver.again){ saver.again = false; return flushSaves("again"); }
  }

  // Resolve on ENQUEUE, not on persistence: ~50 call sites `await saveNow(...)`,
  // and if each of those waited for a real POST the coalescing would never
  // happen. Nothing reads a version row back after saving, so this is safe.
  function saveNow(summary, trivial){
    if (!trivial) askNameOnce();
    queueSave(summary, trivial ? "upkeep" : "user");
    if (!trivial) scheduleFlush(600);
    return Promise.resolve();
  }
  function saveSoon(summary, trivial){
    queueSave(summary, trivial ? "upkeep" : "user");
    if (!trivial) scheduleFlush(1200);
    return Promise.resolve();
  }
  // Long AI runs mutate the snapshot for minutes at a time; without this a
  // crash mid-generation would lose everything, which the old save-on-every-
  // step behaviour did not.
  setInterval(() => { if (saverDirty()) flushSaves("periodic"); }, 60000);
  document.addEventListener("visibilitychange", () => {
    if (document.visibilityState === "hidden" && saverDirty()) flushSaves("hidden");
  });
  // pagehide is too late for a 100 KB POST (fetch keepalive caps at 64 KiB and
  // sendBeacon can't set the auth headers PostgREST needs), so mirror instead.
  window.addEventListener("pagehide", mirrorPending);
  window.addEventListener("online", () => { if (saverDirty()) flushSaves("online"); });

  // ==================================================================
  // MODEL HELPERS
  // ==================================================================
  function dayById(id){ return state.snapshot.days.find(d => d.id === id); }

  // ---------- backup picks ----------
  // Lunch is usually "this place, or one of these two if it's full". Until now
  // the only way to record that was three separate stops, which made one meal
  // occupy three rows of the board and buried the actual plan. A backup now
  // hangs off the stop it belongs to: one row on the timeline, the rest folded
  // underneath it.
  //
  // A backup is stored as a whole place — the same shape as a stop — so
  // swapping one in on the day loses nothing: not the description, the photo,
  // the rating, nor the opening hours. Only these keys belong to the slot
  // rather than to the place, and they stay put when the two are exchanged.
  const SLOT_KEYS = ["kind", "time", "type", "alts"];

  function altsOf(s){ return (s && Array.isArray(s.alts)) ? s.alts : []; }
  function altName(a){ return plain(a && a.title) || plain(a && a.kr) || "未改名嘅地點"; }

  // Promote a backup to the real plan, demoting the current pick into its
  // place. Swapping (rather than overwriting) is what makes this safe to tap
  // by accident — the old choice is still there, one tap away.
  function swapAlt(s, idx){
    const alt = altsOf(s)[idx];
    if (!alt) return "";
    const was = plain(s.title);
    const demoted = {};
    Object.keys(s).forEach(k => {
      if (SLOT_KEYS.includes(k)) return;
      demoted[k] = s[k];
      delete s[k];
    });
    Object.keys(alt).forEach(k => { if (!SLOT_KEYS.includes(k)) s[k] = alt[k]; });
    s.alts[idx] = demoted;
    return was;
  }

  // Shipping "a stop can have backups" without this was half a feature: it
  // only helped places typed in from scratch, while every itinerary already
  // written had its alternatives sitting there as five separate 13:00 stops.
  // Folding takes one of those rows and tucks it under another.
  //
  // The folded stop keeps everything about the PLACE and loses only what
  // belonged to its old row — its own time and type — because a backup for
  // lunch happens whenever lunch happens.
  function foldIntoAlts(day, targetUi, sourceUi){
    if (targetUi === sourceUi) return null;
    const units = toUnits(day.items);
    const target = units[targetUi] && units[targetUi].stop;
    const source = units[sourceUi] && units[sourceUi].stop;
    if (!target || !source) return null;

    const place = {};
    Object.keys(source).forEach(k => { if (!SLOT_KEYS.includes(k)) place[k] = source[k]; });
    if (!Array.isArray(target.alts)) target.alts = [];
    target.alts.push(place);
    units.splice(sourceUi, 1);
    day.items = fromUnits(units);
    syncMapPoints(day);
    // removing a row shifts everything after it
    return { name: plain(source.title) || plain(source.kr) || "一個地點",
             targetIdx: sourceUi < targetUi ? targetUi - 1 : targetUi };
  }

  // The way back out. Folding the wrong stop in must never be a one-way door,
  // so a backup can be put back on the timeline as its own row.
  function unfoldAlt(day, ui, ai){
    const units = toUnits(day.items);
    const s = units[ui] && units[ui].stop;
    const alt = s && altsOf(s)[ai];
    if (!alt) return null;
    s.alts.splice(ai, 1);
    if (!s.alts.length) delete s.alts;
    // It inherits the slot it is coming out of; the leg into it is unknown
    // until transit is rechecked, hence stale.
    const stop = Object.assign({}, alt, { kind:"stop", time: plain(s.time), type: s.type || "normal" });
    units.splice(ui + 1, 0, { seg:{ kind:"connector", html:"", stale:true }, stop });
    day.items = fromUnits(units);
    syncMapPoints(day);
    return { name: altName(alt), at: ui + 1 };
  }

  // A connector describes the trip INTO the stop that follows it, so the two
  // travel together as one unit whenever a stop is moved.
  function toUnits(items){
    const units = [];
    for (let i = 0; i < items.length; i++){
      if (items[i].kind === "connector" && items[i+1] && items[i+1].kind === "stop"){
        units.push({ seg: items[i], stop: items[i+1] });
        i++;
      } else if (items[i].kind === "stop"){
        units.push({ seg: null, stop: items[i] });
      } else if (items[i].kind === "note"){
        // its own kind of unit — deliberately NOT a stop, so it stays out of
        // the map, the ratings sweep and everything the AI is shown
        units.push({ seg: null, stop: null, note: items[i] });
      } else {
        units.push({ seg: items[i], stop: null });
      }
    }
    return units;
  }
  function fromUnits(units){
    const out = [];
    units.forEach(u => {
      if (u.seg) out.push(u.seg);
      if (u.note) out.push(u.note);
      if (u.stop) out.push(u.stop);
    });
    return out;
  }
  // index of the unit holding the first real stop — a note pinned above it
  // must not make that stop start showing a "how you got here" line, because
  // nothing comes before the first stop of a day
  function firstStopUnit(units){ return units.findIndex(u => u.stop); }
  function blankStop(){
    return { kind:"stop", type:"normal", marker:"", time:"", title:"", kr:"",
             niecepick:[], desc:"", eatboxHtml:"", eatMeta:[], mapUrl:"",
             accessBadges:[], tip:"", photoUrl:"", placeId:"", lat:null, lng:null };
  }
  // a free-text reminder that lives between two places ("買定 T-money",
  // "呢度落車行 5 分鐘") — not a place, so it has no time, coords or rating
  function blankNote(){ return { kind:"note", text:"" }; }

  // ==================================================================
  // DATES ⇄ DAYS
  // Changing the trip's dates used to touch nothing but meta, so the day
  // list kept the old count and — worse — kept the old weekday in each
  // day.date label, which stopClosedOnDay() parses to decide whether a
  // place is shut. A stale label therefore produced confidently WRONG
  // closure warnings. These keep the two in step.
  //
  // Invariant: only ever grow or shrink the TAIL. Moving the start date
  // slides the whole trip, so day1..dayN keep their ids and just get
  // relabelled. That's what lets `day.id.replace('day','')` (used at every
  // render site), stays.from/to, state.open keys and in-flight AI dayIds
  // all stay valid without remapping.
  // ==================================================================
  const WEEKDAY_CH = ["日","一","二","三","四","五","六"];
  function isValidIso(s){
    if (!/^\d{4}-\d{2}-\d{2}$/.test(String(s || ""))) return false;
    const t = Date.parse(String(s) + "T00:00:00Z");
    return Number.isFinite(t);
  }
  // All arithmetic in UTC: a local-midnight day count is off by one across a
  // DST boundary, which would silently add or drop a day.
  function isoToUtc(iso){ return new Date(String(iso) + "T00:00:00Z"); }
  function isoAddDays(iso, n){
    const d = isoToUtc(iso);
    d.setUTCDate(d.getUTCDate() + n);
    return d.toISOString().slice(0, 10);
  }
  function isoDayLabel(iso){
    const d = isoToUtc(iso);
    return `${d.getUTCMonth() + 1}月${d.getUTCDate()}日（${WEEKDAY_CH[d.getUTCDay()]}）`;
  }
  function isoSpan(a, b){
    if (!isValidIso(a) || !isValidIso(b)) return 0;
    const days = Math.round((isoToUtc(b) - isoToUtc(a)) / 86400000) + 1;
    return days > 0 ? days : 0;
  }
  function blankDay(n, iso){
    // shortTag MUST be an explicit "" — normalizeSnapshot only backfills when
    // it is null, and a null here would inherit a label meant for another day.
    return { id: "day" + n, num: "DAY " + n, date: isoDayLabel(iso), title: "第 " + n + " 日",
             desc: "", shortTag: "", badges: [], items: [], mapPoints: null, mapCap: "" };
  }

  // Works out what changing the dates would do, without touching anything —
  // so the UI can show the consequences and let the user back out.
  function planDayReconcile(snap, newStart, newEnd){
    const m = snap.meta || {};
    const oldStart = m.dateStart, oldEnd = m.dateEnd;
    if (!isValidIso(newStart) || !isValidIso(newEnd)) return { ok:false, error:"日期格式要係 YYYY-MM-DD。" };
    const newCount = isoSpan(newStart, newEnd);
    if (!newCount) return { ok:false, error:"結束日期唔可以早過開始日期。" };
    if (newCount > 60) return { ok:false, error:"行程超過 60 日，應該分開幾個行程會好用啲。" };

    const days = snap.days || [];
    const oldCount = days.length;
    const relabel = [], added = [], dropped = [], closureFlips = [];

    for (let i = 0; i < Math.min(oldCount, newCount); i++){
      const iso = isoAddDays(newStart, i);
      const to = isoDayLabel(iso);
      if (days[i].date !== to) relabel.push({ id: days[i].id, fromDate: days[i].date, toDate: to });
      // Opening-hours warnings are derived at render time from day.date, so
      // they fix themselves — but the user deserves to know which places
      // change state, since that's the whole point of moving dates.
      (days[i].items || []).forEach(it => {
        if (it.kind !== "stop") return;
        const was = stopClosedOnDay(it, days[i]);
        const now = stopClosedOnDay(it, { date: to });
        if (was !== now) closureFlips.push({ dayId: days[i].id, title: plain(it.title), wasClosed: was, nowClosed: now });
      });
    }
    for (let i = oldCount; i < newCount; i++) added.push({ n: i + 1, iso: isoAddDays(newStart, i) });
    for (let i = newCount; i < oldCount; i++){
      const d = days[i];
      const stops = (d.items || []).filter(x => x.kind === "stop");
      dropped.push({ id: d.id, date: d.date, title: d.title,
                     stops, stopTitles: stops.map(x => plain(x.title)).filter(Boolean),
                     noteCount: (d.items || []).filter(x => x.kind === "note").length });
    }

    // meta.eyebrow / the "N 日行程" fact are only auto-updated when the user
    // hasn't hand-written something — detectable exactly, because the value
    // we'd have generated is a pure function of the OLD dates.
    const derivedOldEyebrow = formatEyebrow(oldStart, oldEnd);
    const eyebrowCustomised = !!(m.eyebrow && m.eyebrow !== derivedOldEyebrow);
    const factIdx = (m.facts || []).findIndex(f => /^\s*\d+\s*日行程\s*$/.test(String(f)));

    const monthChanged = String(oldStart || "").slice(0, 7) !== String(newStart).slice(0, 7);
    const shifted = isValidIso(oldStart) ? Math.abs(Math.round((isoToUtc(newStart) - isoToUtc(oldStart)) / 86400000)) : 0;

    return {
      ok: true, oldStart, oldEnd, newStart, newEnd, oldCount, newCount,
      relabel, added, dropped, closureFlips,
      eyebrowCustomised, derivedNewEyebrow: formatEyebrow(newStart, newEnd), factIdx,
      seasonShift: monthChanged || shifted > 20,
    };
  }

  // Applies a plan. Dropped stops go to a board by default rather than being
  // deleted — boards exist exactly for "somewhere to park a place that isn't
  // scheduled", and losing hand-picked places to a date typo would be brutal.
  function applyDayReconcile(snap, plan){
    const m = snap.meta;
    const notices = [];
    const days = snap.days || [];

    let parked = 0, boardName = "";
    if (plan.dropped.length){
      const withStops = plan.dropped.filter(d => d.stops.length);
      if (withStops.length){
        snap.boards = snap.boards || [];
        const lo = plan.newCount + 1, hi = plan.oldCount;
        boardName = `原本 Day ${lo}${hi > lo ? "-" + hi : ""}（改咗日期）`;
        const b = newBoard(boardName);
        withStops.forEach(d => d.stops.forEach(st => { b.items.push(st); parked++; }));
        snap.boards.push(b);
        notices.push(`${parked} 個地點搬咗去新清單「${boardName}」，時間同交通資料會冇咗，但地點本身留返。`);
      }
      const lostNotes = plan.dropped.reduce((n, d) => n + d.noteCount, 0);
      if (lostNotes) notices.push(`${lostNotes} 個 note 跟住嗰幾日一齊冇咗（清單度冇 note 呢種嘢）。`);
      days.length = plan.newCount;
    }

    for (let i = 0; i < Math.min(days.length, plan.newCount); i++){
      const iso = isoAddDays(plan.newStart, i);
      days[i].id = "day" + (i + 1);
      days[i].num = "DAY " + (i + 1);
      days[i].date = isoDayLabel(iso);
    }
    plan.added.forEach(a => days.push(blankDay(a.n, a.iso)));

    m.dateStart = plan.newStart;
    m.dateEnd = plan.newEnd;
    if (!plan.eyebrowCustomised) m.eyebrow = plan.derivedNewEyebrow;
    else notices.push("「日期細字」你自己改過，所以冇動佢——想更新就入去改返。");
    if (plan.factIdx >= 0) m.facts[plan.factIdx] = `${plan.newCount} 日行程`;

    // A stay whose whole range fell off the end must not silently re-point at
    // the entire trip — that would invent a hotel booking nobody made.
    const validIds = new Set(days.map(d => d.id));
    (snap.stays || []).forEach(s => {
      const fromGone = s.from && !validIds.has(s.from);
      const toGone = s.to && !validIds.has(s.to);
      if (!fromGone && !toGone) return;
      const last = days[days.length - 1] ? days[days.length - 1].id : "";
      if (fromGone && toGone){
        s.from = last; s.to = last;
        notices.push(`「${plain(s.name) || "住宿"}」本來排喺已經冇咗嘅日子，暫時擺咗喺最後一日，記得改返。`);
      } else {
        if (fromGone) s.from = days[0] ? days[0].id : "";
        if (toGone) s.to = last;
      }
      if (dayIndexById(snap, s.from) > dayIndexById(snap, s.to)){ const t = s.from; s.from = s.to; s.to = t; }
    });
    syncAccommodation(snap);

    // a view/selection pointing at a day that no longer exists
    if (!dayById(state.view) && state.view !== "overview" && state.view !== "notes" && !boardById(state.view)) state.view = "overview";
    state.open.clear(); state.mapsShut.clear(); state.selectMode = null;

    const bits = [];
    if (plan.added.length) bits.push(`加咗 ${plan.added.length} 日`);
    if (plan.dropped.length) bits.push(`減咗 ${plan.dropped.length} 日`);
    if (plan.relabel.length) bits.push(`更新咗 ${plan.relabel.length} 日嘅日期`);
    return {
      notices, parked, boardName,
      summary: `改咗行程日期（${plan.oldStart || "?"} → ${plan.newStart}）${bits.length ? "：" + bits.join("、") : ""}`,
    };
  }

  // ==================================================================
  // BOOKMARK BOARDS — a place to park "maybe" spots that aren't slotted
  // into a day yet. Same stop shape as an itinerary stop (so nothing is
  // lost moving a place either direction), just no time/connectors.
  // ==================================================================
  function blankBoardItem(){
    return { title:"", kr:"", desc:"", mapUrl:"", photoUrl:"", placeId:"", lat:null, lng:null, tip:"", niecepick:[] };
  }
  // distinct from DAY_HEX so a list never gets mistaken for a day's own route colour
  const BOARD_PALETTE = ["#6B6FD1","#E38FB0","#3CC177","#E5964A","#4FB6D9","#B98CE0","#D9574A","#7FD1BE"];
  function pickBoardColor(existingBoards){
    const used = new Set((existingBoards || []).map(b => b.color).filter(Boolean));
    const free = BOARD_PALETTE.find(c => !used.has(c));
    return free || BOARD_PALETTE[(existingBoards || []).length % BOARD_PALETTE.length];
  }
  function newBoard(name){
    const id = "board_" + Date.now().toString(36) + Math.random().toString(36).slice(2, 6);
    return { id, name: name || "新清單", items: [], color: pickBoardColor(state.snapshot && state.snapshot.boards) };
  }
  function boardById(id){
    return (state.snapshot.boards || []).find(b => b.id === id);
  }
  // 表妹美食清單 used to be a standalone, hand-maintained array (snap.foodCards)
  // completely detached from day.items — its "day" field was plain text
  // ("Day 2"), never a real dayId, so deleting or moving the actual stop
  // never touched it: it kept claiming a niece's pick was still scheduled
  // long after it wasn't. Turning each entry into a real board item means it
  // gets the SAME live re-check every other board item already has
  // (findInItinerary, re-derived fresh every render — see boardItemHtml)
  // instead of a second, silently-drifting copy of the same information,
  // and it can be copied into a specific day the same way any board item can.
  function migrateFoodCardsToBoard(snap){
    if (!snap || !Array.isArray(snap.foodCards) || !snap.foodCards.length) return;
    const items = snap.foodCards.map(f => {

  const MODES = [

    [/(^|\D)5\s*號線|line\s*5\b/i, "#996CAC"], [/(^|\D)6\s*號線|line\s*6\b/i, "#CD7C2F"],
    [/(^|\D)7\s*號線|line\s*7\b/i, "#747F00"], [/(^|\D)8\s*號線|line\s*8\b/i, "#E6186C"],

  // ---------- opening a place, or a whole leg, in a real map app ----------

  // trip with a button that would be useless in Tokyo or Taipei.
  //
  // Which alphabet the destination got typed in is not a fact about the trip.

  // read 「首爾」 instead of 「서울」, every Naver button on every page vanished
  // at once — the map people there actually navigate with, swapped for the one
  // that can't route them, over spelling. The itinerary is the better witness:
  // Korean stops carry their Korean names, and no Tokyo trip has a dozen.
  const KOREA_WORDS = /韓國|韩国|南韓|首爾|首尔|漢城|釜山|濟州|济州|仁川|大邱|光州|慶州|庆州|江原|束草|全州|安東|安东|korea|seoul|busan|jeju|incheon|daegu|gwangju|gyeongju|pusan/i;

  function hasCoord(s){ return !!s && Number.isFinite(s.lat) && Number.isFinite(s.lng); }

  function mapLinksInOrder(naverHtml, googleHtml){

  // The whole day as one route, handed to a map app in a single tap. Google's
