<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#F7F7F5" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0E1011" media="(prefers-color-scheme: dark)">
<title>行程</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600;700&family=Noto+Sans+TC:wght@400;500;700;900&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<style>
/* ============================================================
   DEPARTURE BOARD — design tokens

   A day is a timetable: times aligned in one column on the left,
   a hairline rail beside them, and what happens at each time to
   the right. Density is fine — a real itinerary IS dense — as
   long as everything hangs off one vertical axis.

   The page carries ONE accent at a time, and it is the day you
   are reading: --lc is set per day, and the rail, the active tab,
   focus rings and primary buttons all take it. On the overview
   the accent is plain ink. That is what keeps a screen full of
   information from turning into confetti.
   ============================================================ */
:root{
  color-scheme: light dark;

  --paper:#F7F7F5;
  --surface:#FFFFFF;
  --surface-2:#F0F0ED;
  --ink:#15181A;
  --ink-soft:#5B6166;
  --ink-faint:#8B9197;
  --rule:#E4E4DF;
  --rule-soft:#EFEFEB;

  /* barely-there elevation: hairlines do the work, not shadows */
  --shadow-1:0 1px 2px rgba(20,23,26,.04);
  --shadow-2:0 8px 30px -12px rgba(20,23,26,.22), 0 2px 6px rgba(20,23,26,.05);

  /* One hue per day, at signage saturation rather than fluorescent.
     Days past the sixth are generated at runtime (see dayColorVar). */
  --d1:#6B7785;
  --d2:#3F7D58;
  --d3:#2F6E9E;
  --d4:#B4682A;
  --d5:#7A5E96;
  --d6:#8A6B34;
  --day-l:38%;

  --ok:#3F7D58;
  --ok-bg:#EDF3EF;
  --warn:#8A5B17;
  --warn-bg:#F7F1E6;
  --danger:#A8382C;
  --danger-bg:#F8EDEB;
  /* legacy aliases: these class names are baked into saved itinerary data,
     so they still resolve — they just stop shouting */
  --niece:#8A4C72;
  --niece-bg:#F7EDF3;
  --info:#2F6E9E;
  --info-bg:#EDF2F6;
  --bookmark:#5B6166;
  --bookmark-bg:#F0F0ED;

  --f-disp:'Instrument Sans','Noto Sans TC',system-ui,sans-serif;
  --f-body:'Noto Sans TC','Hiragino Sans TC','Microsoft JhengHei',system-ui,sans-serif;
  --f-mono:'IBM Plex Mono',ui-monospace,monospace;
  --mono:var(--f-mono);

  --r-sm:6px;
  --r-md:10px;
  --r-lg:14px;
  --r-xl:22px;

  /* the timetable gutter: time column + the rail it aligns to */
  --gutter:66px;
  --rail-w:var(--gutter);
  --tap:44px;
}

@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --paper:#0E1011;
    --surface:#17191B;
    --surface-2:#1F2225;
    --ink:#ECEDEB;
    --ink-soft:#9BA1A6;
    --ink-faint:#6A7076;
    --rule:#262A2D;
    --rule-soft:#1E2124;
    --shadow-1:0 1px 2px rgba(0,0,0,.35);
    --shadow-2:0 10px 34px -14px rgba(0,0,0,.8), 0 2px 8px rgba(0,0,0,.4);
    --d1:#97A3B1; --d2:#63B183; --d3:#6BA8D6; --d4:#DD9457; --d5:#AE92C9; --d6:#C3A05F;
    --day-l:66%;
    --ok:#63B183;      --ok-bg:#16241C;
    --warn:#D6A15C;    --warn-bg:#241E14;
    --danger:#E0796B;  --danger-bg:#261715;
    --niece:#D291B4;   --niece-bg:#241A20;
    --info:#6BA8D6;    --info-bg:#141D24;
    --bookmark:#9BA1A6;--bookmark-bg:#1F2225;
  }
}
:root[data-theme="dark"]{
  --paper:#0E1011;
  --surface:#17191B;
  --surface-2:#1F2225;
  --ink:#ECEDEB;
  --ink-soft:#9BA1A6;
  --ink-faint:#6A7076;
  --rule:#262A2D;
  --rule-soft:#1E2124;
  --shadow-1:0 1px 2px rgba(0,0,0,.35);
  --shadow-2:0 10px 34px -14px rgba(0,0,0,.8), 0 2px 8px rgba(0,0,0,.4);
  --d1:#97A3B1; --d2:#63B183; --d3:#6BA8D6; --d4:#DD9457; --d5:#AE92C9; --d6:#C3A05F;
  --day-l:66%;
  --ok:#63B183;      --ok-bg:#16241C;
  --warn:#D6A15C;    --warn-bg:#241E14;
  --danger:#E0796B;  --danger-bg:#261715;
  --niece:#D291B4;   --niece-bg:#241A20;
  --info:#6BA8D6;    --info-bg:#141D24;
  --bookmark:#9BA1A6;--bookmark-bg:#1F2225;
}

*{box-sizing:border-box;}
html{-webkit-text-size-adjust:100%;}
body{
  margin:0;
  background:var(--paper);
  color:var(--ink);
  font-family:var(--f-body);
  font-size:15px;
  line-height:1.7;
  -webkit-font-smoothing:antialiased;
  padding-bottom:calc(84px + env(safe-area-inset-bottom));
  overflow-wrap:break-word;
}
:focus-visible{outline:2px solid var(--lc,var(--ink));outline-offset:2px;border-radius:4px;}
button{font-family:inherit;color:inherit;}
img{max-width:100%;}

.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums;}
.disp{font-family:var(--f-disp);}

/* every icon inherits the colour and optical weight of its text */
.i{
  width:1.15em;height:1.15em;flex:0 0 auto;display:inline-block;vertical-align:-.2em;
  fill:none;stroke:currentColor;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round;
}

.wrap{max-width:720px;margin:0 auto;padding:0 18px;}

/* ---------- top bar ---------- */
.topbar{
  position:sticky;top:0;z-index:50;
  background:color-mix(in srgb, var(--paper) 90%, transparent);
  backdrop-filter:saturate(150%) blur(16px);
  -webkit-backdrop-filter:saturate(150%) blur(16px);
  border-bottom:1px solid var(--rule);
}
.topbar-inner{max-width:720px;margin:0 auto;padding:10px 18px 0;}
.brandrow{display:flex;align-items:center;justify-content:space-between;gap:12px;padding-bottom:9px;}
.brandmark{display:flex;align-items:baseline;gap:8px;min-width:0;}
.brandmark .sys{
  font-family:var(--f-body);font-weight:700;font-size:13.5px;letter-spacing:-.01em;
  color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
}
.brandmark .ko{font-family:var(--f-mono);font-size:11px;color:var(--ink-faint);white-space:nowrap;}

/* Labelled, always there. An emoji in a circle told you nothing about what
   the control did, and Export was buried at the bottom of the overview. */
.topbtns{display:flex;gap:6px;flex:0 0 auto;align-items:center;}
.topbtn{
  display:inline-flex;align-items:center;gap:6px;
  height:34px;padding:0 12px;border-radius:999px;
  border:1px solid var(--rule);background:var(--surface);
  font-family:var(--f-body);font-size:12.5px;font-weight:500;line-height:1;
  color:var(--ink-soft);text-decoration:none;cursor:pointer;white-space:nowrap;
  transition:color .15s, border-color .15s;
}
.topbtn .i{width:15px;height:15px;}
.topbtn:hover{color:var(--ink);border-color:var(--ink-faint);}
.topbtn:active{transform:scale(.96);}
.topbtn.icononly{padding:0;width:34px;justify-content:center;}
.iconbtn{
  width:34px;height:34px;flex:0 0 auto;display:grid;place-items:center;
  border:1px solid var(--rule);border-radius:999px;background:var(--surface);
  cursor:pointer;font-size:14px;line-height:1;color:var(--ink-soft);text-decoration:none;
}
.iconbtn .i{width:16px;height:16px;}
.iconbtn:active{transform:scale(.94);}

/* day switcher: an underline, not a filled pill — the active day's hue is
   the only colour in the bar */
.lines{display:flex;gap:2px;overflow-x:auto;padding:0;scrollbar-width:none;scroll-behavior:smooth;}
.lines::-webkit-scrollbar{display:none;}
.linebtn{
  flex:0 0 auto;display:flex;align-items:center;gap:7px;
  padding:9px 12px 11px;cursor:pointer;
  border:0;border-bottom:2px solid transparent;background:transparent;
  font-family:var(--f-body);font-size:13px;font-weight:500;color:var(--ink-faint);
  white-space:nowrap;transition:color .15s, border-color .15s;
}
.linebtn .bullet{
  width:7px;height:7px;border-radius:50%;flex:0 0 auto;
  background:var(--lc,var(--ink-faint));opacity:.5;transition:opacity .15s;
}
.linebtn .lbl{font-family:var(--f-mono);font-weight:500;font-size:11.5px;letter-spacing:.02em;}
.linebtn:hover{color:var(--ink-soft);}
.linebtn[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--lc,var(--ink));}
.linebtn[aria-selected="true"] .bullet{opacity:1;}
.linebtn[aria-selected="true"] .lbl{color:var(--lc,var(--ink));font-weight:600;}

/* ---------- hero / route board ---------- */
.hero{padding:30px 0 4px;}
.eyebrow{
  font-family:var(--f-mono);font-size:11px;font-weight:500;
  letter-spacing:.14em;text-transform:uppercase;color:var(--ink-faint);
}
.hero h1{
  font-family:var(--f-body);font-weight:700;
  font-size:clamp(27px,7.4vw,38px);line-height:1.22;letter-spacing:-.025em;
  margin:10px 0 12px;
}
.hero-meta{
  display:flex;flex-wrap:wrap;gap:4px 12px;align-items:center;
  font-size:12.5px;color:var(--ink-faint);
}
.hero-meta b{font-family:var(--f-mono);font-weight:500;color:var(--ink-soft);font-variant-numeric:tabular-nums;}

/* the route board: one row per day, the rail running through it */
.board{margin:24px 0 4px;border-top:1px solid var(--rule);}
.board-head{
  display:flex;align-items:center;justify-content:space-between;
  padding:12px 2px 10px;
}
.board-head .t{
  font-family:var(--f-mono);font-size:10.5px;font-weight:500;
  letter-spacing:.14em;text-transform:uppercase;color:var(--ink-faint);
}
.board-row{
  display:grid;grid-template-columns:42px 18px 1fr auto;align-items:center;gap:12px;
  width:100%;padding:13px 2px;border:0;border-top:1px solid var(--rule-soft);
  background:transparent;text-align:left;cursor:pointer;
}
.board-row:first-of-type{border-top:1px solid var(--rule-soft);}
.board-row:active{background:var(--surface-2);}
.board-row .dcode{
  font-family:var(--f-mono);font-weight:500;font-size:11.5px;
  letter-spacing:.02em;color:var(--lc);text-transform:uppercase;
}
.board-row .dcode .i{width:14px;height:14px;}
.board-row .track{position:relative;height:100%;min-height:32px;}
.board-row .track::before{
  content:"";position:absolute;left:50%;top:-14px;bottom:-14px;width:2px;
  transform:translateX(-50%);background:var(--lc);opacity:.45;
}
.board-row:first-of-type .track::before{top:50%;}
.board-row:last-of-type .track::before{bottom:50%;}
.board-row .track::after{
  content:"";position:absolute;left:50%;top:50%;width:9px;height:9px;
  transform:translate(-50%,-50%);border-radius:50%;
  background:var(--paper);border:2px solid var(--lc);
}
.board-row .stack{min-width:0;}
.board-row .name{display:block;font-size:14.5px;font-weight:500;color:var(--ink);line-height:1.4;}
.board-row .sub{display:block;font-family:var(--f-mono);font-size:11px;color:var(--ink-faint);margin-top:1px;}
.board-row .count{
  font-family:var(--f-mono);font-size:11px;color:var(--ink-faint);
  font-variant-numeric:tabular-nums;white-space:nowrap;
}

/* ---------- generic section ---------- */
.sec{padding:30px 0 4px;}
.sec-title{
  font-family:var(--f-body);font-weight:700;font-size:18px;
  letter-spacing:-.015em;margin:0 0 4px;
}
.sec-sub{font-size:13px;color:var(--ink-faint);margin:0 0 16px;line-height:1.65;}
.sec h3{font-size:15px;font-weight:700;margin:26px 0 6px;display:flex;align-items:center;gap:2px;}
.rule{border:0;border-top:1px solid var(--rule);margin:28px 0 0;}

.panel{background:var(--surface);border:1px solid var(--rule);border-radius:var(--r-lg);padding:16px;}
.panel + .panel{margin-top:10px;}
.panel .k{
  font-size:11.5px;font-weight:500;letter-spacing:.01em;color:var(--ink-faint);
  display:flex;align-items:center;gap:5px;
}
.panel .k .i{width:13px;height:13px;}
.panel .v{font-size:16px;font-weight:600;margin-top:4px;}
.panel .d{font-size:13px;color:var(--ink-soft);margin-top:6px;line-height:1.65;}

/* Chips used to be filled lozenges in six colours, which is most of what made
   a stop card look like a fruit machine. Now: hairline outline, ink text, and
   only a real warning gets colour. Class names come from stored data. */
.badge,.meta-chip,.niecepick{
  display:inline-flex;align-items:center;gap:4px;
  font-size:11.5px;font-weight:400;line-height:1.5;
  padding:2px 8px;border-radius:var(--r-sm);max-width:100%;
  border:1px solid var(--rule);background:transparent;color:var(--ink-soft);
}
.badge .i,.meta-chip .i,.niecepick .i{width:12px;height:12px;}
.badge.note{color:var(--ink-soft);}
.badge.warn{color:var(--warn);border-color:color-mix(in srgb,var(--warn) 32%,transparent);}
.meta-chip.rating{font-family:var(--f-mono);border-color:transparent;padding-left:0;color:var(--ink-soft);}
.meta-chip.rating b{font-weight:600;color:var(--ink);}
.meta-chip.hours{color:var(--ink-soft);}
.meta-chip.book{color:var(--ink-soft);}
.meta-chip.book.warn{color:var(--warn);}
.meta-chip.closed{color:var(--danger);border-color:color-mix(in srgb,var(--danger) 32%,transparent);}
.niecepick{color:var(--niece);border-color:color-mix(in srgb,var(--niece) 34%,transparent);}
.chiprow{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px;align-items:center;}

.wtable{width:100%;border-collapse:collapse;font-size:13px;margin-top:10px;}
.wtable th{
  font-size:11.5px;font-weight:500;letter-spacing:.01em;color:var(--ink-faint);
  text-align:left;padding:8px 10px 8px 0;border-bottom:1px solid var(--rule);
}
.wtable td{padding:9px 10px 9px 0;border-bottom:1px solid var(--rule-soft);color:var(--ink-soft);}
.wtable td.hi,.wtable td.lo{
  font-family:var(--f-mono);font-weight:500;white-space:nowrap;
  font-variant-numeric:tabular-nums;
}
.wtable td.hi{color:var(--ink);}
.wtable td.lo{color:var(--ink-faint);}

.clist{list-style:none;padding:0;margin:10px 0 0;display:flex;flex-direction:column;gap:10px;}
.clist li{display:flex;gap:10px;font-size:13.5px;line-height:1.7;color:var(--ink-soft);}
.clist li::before{
  content:"";flex:0 0 auto;width:4px;height:4px;border-radius:50%;
  background:var(--ink-faint);margin-top:.7em;
}
.clist .ico{flex:0 0 auto;font-size:15px;line-height:1.5;}
.clist b{color:var(--ink);font-weight:600;}

.legend{display:flex;flex-direction:column;gap:8px;margin-top:10px;}
.legend-item{display:flex;align-items:center;gap:10px;font-size:13px;color:var(--ink-soft);}
.legend-dot{width:8px;height:8px;border-radius:50%;flex:0 0 auto;}

/* ---------- paying for transport ---------- */
.panel.verdict{border-left:2px solid var(--ok);margin-bottom:12px;}
.panel.verdict .k{color:var(--ok);}
.panel.callout{border-left:2px solid var(--warn);margin-top:14px;}
.panel.callout .k{color:var(--warn);}
.fare-grid{display:flex;flex-direction:column;gap:10px;}
.fare-card{background:var(--surface);border:1px solid var(--rule);border-radius:var(--r-md);padding:13px 15px;}
.fare-card.pick{border-color:var(--ok);}
.fare-top{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap;}
.fare-name{font-size:14.5px;font-weight:600;}
.fare-name .kr{font-family:var(--f-mono);font-size:11px;color:var(--ink-faint);font-weight:400;margin-left:6px;}
.fare-price{font-family:var(--f-mono);font-size:12px;color:var(--ink-soft);margin-top:3px;}
.fare-line{font-size:12.5px;line-height:1.6;margin-top:5px;display:flex;gap:6px;align-items:flex-start;}
.fare-line .i{width:14px;height:14px;margin-top:.25em;}
.fare-line.good{color:var(--ok);}
.fare-line.bad{color:var(--danger);}
.opt{margin-top:11px;padding-top:11px;border-top:1px solid var(--rule-soft);}
.opt-name{font-size:13.5px;font-weight:600;display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;}
.opt-cost{font-family:var(--f-mono);font-weight:500;color:var(--warn);font-size:12px;}
.opt-note{font-size:12.5px;color:var(--ink-soft);line-height:1.6;margin-top:3px;}

.colorpick{display:flex;gap:8px;flex-wrap:wrap;margin:10px 2px 0;}
.colorpick .swatch{width:24px;height:24px;border-radius:50%;border:2px solid transparent;padding:0;cursor:pointer;}
.colorpick .swatch.active{border-color:var(--ink);box-shadow:0 0 0 2px var(--paper);}

/* ---------- day header ---------- */
.dayhead{padding:28px 0 4px;}
.dayhead .kicker{display:flex;align-items:center;gap:10px;margin-bottom:10px;}
.dayhead .dno{
  font-family:var(--f-mono);font-weight:600;font-size:11.5px;
  letter-spacing:.14em;text-transform:uppercase;color:var(--lc);
}
.dayhead .kline{flex:1 1 auto;height:1px;background:var(--lc);opacity:.4;}
.dayhead .date{font-family:var(--f-mono);font-size:11.5px;color:var(--ink-faint);}
.dayhead h2{
  font-family:var(--f-body);font-weight:700;
  font-size:clamp(24px,6.6vw,32px);line-height:1.25;letter-spacing:-.025em;margin:0 0 8px;
}
.dayhead .intro{font-size:13.5px;color:var(--ink-soft);line-height:1.7;margin:0;}
.dayhead .chiprow{margin-top:12px;}

.boardname{
  font-family:var(--f-body);font-weight:700;
  font-size:clamp(24px,6.6vw,32px);line-height:1.25;letter-spacing:-.025em;margin:0 0 8px;
  cursor:pointer;display:inline-flex;align-items:baseline;gap:9px;
}
.boardname .editpencil{opacity:.35;}
.boardname .editpencil .i{width:16px;height:16px;}
.boardname-input{
  display:block;width:100%;font-family:var(--f-body);font-weight:700;
  font-size:clamp(22px,6vw,30px);line-height:1.25;letter-spacing:-.025em;margin:0 0 8px;
  padding:4px 2px 6px;border:0;border-bottom:1px solid var(--lc,var(--ink));
  background:transparent;color:var(--ink);
}
.boardname-input:focus{outline:none;}
.picker-label{
  font-size:11.5px;font-weight:500;letter-spacing:.01em;
  color:var(--ink-faint);margin:18px 2px 8px;
}
.picker-label:first-child{margin-top:0;}

.maptoggle{
  display:inline-flex;align-items:center;gap:8px;margin-top:16px;
  padding:9px 14px;border-radius:999px;cursor:pointer;
  border:1px solid var(--rule);background:var(--surface);
  font-size:12.5px;font-weight:500;color:var(--ink-soft);
}
.maptoggle .mapi .i,.maptoggle .chev .i{width:15px;height:15px;}
.maptoggle .chev{display:inline-flex;transition:transform .2s;color:var(--ink-faint);transform:rotate(90deg);}
.maptoggle[aria-expanded="true"] .chev{transform:rotate(-90deg);}
.mapbox{
  height:240px;margin-top:12px;border-radius:var(--r-lg);overflow:hidden;
  border:1px solid var(--rule);background:var(--surface-2);
  /* Leaflet gives its panes z-index up to 1000. Without a stacking context of
     its own the map floats over the sticky nav and the AI sheet. */
  position:relative;z-index:0;isolation:isolate;
}
.mapbox.tall{height:310px;}
.mapcap{font-size:11.5px;color:var(--ink-faint);margin:8px 2px 0;line-height:1.6;}
.mapnote{font-size:12px;margin:9px 2px 0;line-height:1.65;color:var(--ink-soft);}
.mapnote.warn{color:var(--warn);}
.mapnote .linkbtn{
  background:none;border:0;padding:0 0 0 6px;font:inherit;color:var(--ink);
  text-decoration:underline;text-underline-offset:2px;cursor:pointer;
}
.mapnote .geowhy{color:var(--ink-faint);font-size:11px;}
.mapfallback{display:grid;place-items:center;height:100%;padding:20px;text-align:center;font-size:12.5px;color:var(--ink-faint);}
.leaflet-container{background:var(--surface-2);font:inherit;}
.mapnode{
  display:grid;place-items:center;width:20px;height:20px;border-radius:50%;
  color:#fff;font-size:10px;font-weight:600;font-family:var(--f-mono);
  border:2px solid var(--surface);box-shadow:0 1px 3px rgba(0,0,0,.35);
}
.mapnode.plain{width:12px;height:12px;border-width:2px;}
.mapboardpin{
  width:14px;height:14px;border-radius:50% 50% 50% 0;
  transform:rotate(-45deg);border:2px solid var(--surface);box-shadow:0 1px 3px rgba(0,0,0,.35);
}

/* ---------- the timetable: times, rail, stops ---------- */
.line{margin-top:22px;}
.unit{position:relative;scroll-margin-top:120px;}
.unit.lifted{position:relative;z-index:30;}
.unit.lifted .stopcard{box-shadow:var(--shadow-2);border-color:var(--lc);}
.unit.shifting{transition:transform .18s cubic-bezier(.2,.7,.3,1);}

/* a leg between two stops. The stroke says how you get there. */
.seg{display:grid;grid-template-columns:var(--gutter) 1fr;align-items:stretch;min-height:40px;}
.seg-rail{position:relative;}
.seg-rail::before{
  content:"";position:absolute;right:10px;top:0;bottom:0;
  transform:translateX(50%);width:2px;background:var(--lc);opacity:.4;
}
.seg[data-mode="walk"] .seg-rail::before{
  background:repeating-linear-gradient(to bottom, var(--lc) 0 3px, transparent 3px 7px);
}
.seg[data-mode="bus"] .seg-rail::before{
  background:repeating-linear-gradient(to bottom, var(--lc) 0 10px, transparent 10px 16px);
}
.seg[data-mode="taxi"] .seg-rail::before{
  background:repeating-linear-gradient(to bottom, var(--lc) 0 6px, transparent 6px 10px);
}
.seg[data-mode="air"] .seg-rail::before{
  background:repeating-linear-gradient(to bottom, var(--lc) 0 2px, transparent 2px 8px);
}
.seg-text{
  font-size:12.5px;color:var(--ink-faint);padding:9px 0 9px 14px;line-height:1.6;
  display:flex;align-items:center;gap:7px;flex-wrap:wrap;
}
.seg-text b{color:var(--ink-soft);font-weight:500;font-family:var(--f-mono);}
.seg-text .icon{display:inline-flex;color:var(--ink-faint);}
.seg-text .icon .i{width:14px;height:14px;}
.seg-note{font-size:12.5px;color:var(--ink-faint);}
.seg-note.warn{color:var(--warn);display:inline-flex;align-items:center;gap:5px;flex-wrap:wrap;}
.seg-why{display:block;margin-top:3px;font-weight:400;font-size:11.5px;color:var(--ink-faint);line-height:1.55;}
.segrefresh{
  margin-left:auto;flex:0 0 auto;width:26px;height:26px;border-radius:50%;display:grid;place-items:center;
  border:1px solid transparent;background:transparent;color:var(--ink-faint);cursor:pointer;
}
.segrefresh .i{width:14px;height:14px;}
.segrefresh:hover{color:var(--ink-soft);border-color:var(--rule);}
.segrefresh:active{color:var(--lc);border-color:var(--lc);}
.seg-route{
  display:block;width:100%;margin-top:4px;
  font-size:11px;line-height:1.7;color:var(--ink-faint);
  font-family:var(--f-mono);letter-spacing:-.01em;
}
.seg.stale .seg-rail::before{
  background:repeating-linear-gradient(to bottom, var(--warn) 0 3px, transparent 3px 8px);opacity:1;
}

/* the ＋ living in the gap between two stops */
.insertrow{
  display:grid;grid-template-columns:var(--gutter) 1fr;align-items:center;
  width:100%;height:22px;padding:0;border:0;background:none;
  position:relative;z-index:4;cursor:pointer;-webkit-tap-highlight-color:transparent;
}
.ins-plus{
  grid-column:1;justify-self:end;margin-right:10px;transform:translateX(50%);
  width:17px;height:17px;border-radius:50%;
  display:flex;align-items:center;justify-content:center;
  font-size:12px;line-height:1;color:var(--ink-faint);
  background:var(--paper);border:1px dashed var(--rule);
  transition:color .15s, border-color .15s, transform .15s;
}
.insertrow:hover .ins-plus{color:var(--lc);border-color:var(--lc);}
.insertrow:active .ins-plus{color:var(--lc);border-color:var(--lc);transform:translateX(50%) scale(1.15);}

/* a note pinned between two stops — deliberately not a stop */
.notecard{
  border:0;border-left:1px solid var(--rule);border-radius:0;
  background:transparent;margin:0 0 2px 14px;padding-left:12px;
  overflow:hidden;position:relative;
}
.notecard.open{border-left-color:var(--lc);}
.notemain{display:flex;gap:8px;padding:8px 42px 8px 0;align-items:flex-start;
  -webkit-user-select:text;user-select:text;}
.noteicon{flex:0 0 auto;color:var(--ink-faint);line-height:1.5;}
.noteicon .i{width:14px;height:14px;}
.notetext{font-size:12.5px;line-height:1.7;color:var(--ink-soft);white-space:pre-wrap;min-width:0;}
.notetext.empty{color:var(--ink-faint);}
.node.note{
  width:5px;height:5px;background:var(--paper);border:1.5px solid var(--ink-faint);
}
.notecard.open .notetext{display:none;}

/* a stop */
.stop{display:grid;grid-template-columns:var(--gutter) 1fr;align-items:start;}
.stop-rail{position:relative;align-self:stretch;}
.stop-rail::before{
  content:"";position:absolute;right:10px;top:0;bottom:0;
  transform:translateX(50%);width:2px;background:var(--lc);opacity:.4;
}
.unit:first-child .stop-rail::before{top:22px;}
.unit:last-child .stop-rail::before{bottom:calc(100% - 22px);}

/* the time column — the axis everything else lines up against */
.stoptime{
  position:absolute;right:24px;top:22px;transform:translateY(-50%);
  font-family:var(--f-mono);font-size:11.5px;font-weight:500;
  font-variant-numeric:tabular-nums;letter-spacing:-.02em;
  color:var(--ink-soft);white-space:nowrap;text-align:right;
}
.stoptime:empty{display:none;}
.stoptime .approx{color:var(--ink-faint);}
.stoptime .raw{font-family:var(--f-body);font-size:10.5px;color:var(--ink-faint);}

.node{
  position:absolute;right:10px;top:22px;transform:translate(50%,-50%);
  width:9px;height:9px;border-radius:50%;background:var(--lc);
  border:2px solid var(--paper);box-sizing:content-box;z-index:2;
}
/* a meal is a major stop — drawn hollow, like an interchange */
.node[data-type="eat"]{width:9px;height:9px;background:var(--paper);border:2.5px solid var(--lc);}
.node[data-type="rest"]{width:6px;height:6px;opacity:.7;}
.node.numbered{
  width:17px;height:17px;border-radius:50%;background:var(--lc);
  border:2px solid var(--paper);box-sizing:border-box;opacity:1;
  display:flex;align-items:center;justify-content:center;
  color:var(--paper);font-size:9.5px;font-weight:600;font-family:var(--f-mono);
}

.stopcard{
  background:var(--surface);border:1px solid var(--rule);border-radius:var(--r-lg);
  margin:0 0 8px 14px;overflow:hidden;position:relative;
  transition:border-color .15s;
}
.stopmain{display:flex;gap:12px;padding:13px 42px 13px 14px;align-items:flex-start;text-align:left;width:100%;-webkit-user-select:text;user-select:text;}
.thumb{
  flex:0 0 auto;width:62px;height:62px;border-radius:var(--r-md);overflow:hidden;
  background:var(--surface-2);position:relative;
}
.thumb img{width:100%;height:100%;object-fit:cover;display:block;}
.thumb.ghost{
  display:flex;align-items:center;justify-content:center;cursor:pointer;
  border:1px dashed var(--rule);background:transparent;color:var(--ink-faint);
}
.thumb.ghost .i{width:20px;height:20px;}
.thumb.ghost:active{background:var(--surface-2);}
.thumb.ghost small{display:none;}
.stopcard.open .stopdesc,
.stopcard.open .stopmain .chiprow,
.stopcard.open .eatbox,
.stopcard.open .tipbox,
.stopcard.open .stopfoot{display:none;}
.stopcard.open{border-color:var(--lc);}
.stopbody{flex:1 1 auto;min-width:0;}
.stopname{font-size:15px;font-weight:600;line-height:1.45;margin:0;letter-spacing:-.01em;}
.stopname .kr{font-family:var(--f-mono);font-size:11px;color:var(--ink-faint);font-weight:400;margin-left:7px;}
.stopname.unnamed{color:var(--ink-faint);font-weight:400;}
.stopdesc{font-size:12.5px;color:var(--ink-soft);line-height:1.65;margin-top:5px;}
.stopcard .chiprow{margin-top:8px;}

/* notes attached to a stop: an indent and a rule, not a coloured slab */
.eatbox,.tipbox,.bookbox{
  margin:0 14px 12px;padding:0 0 0 12px;border-left:1px solid var(--rule);
  background:transparent;font-size:12.5px;line-height:1.7;color:var(--ink-soft);
}
.eatbox b,.tipbox b,.bookbox b{
  display:block;font-size:11px;font-weight:500;letter-spacing:.01em;
  color:var(--ink-faint);margin-bottom:3px;
}
.bookbox .warnline{display:flex;align-items:center;gap:5px;color:var(--warn);font-size:11px;margin-top:5px;}
.bookbox .warnline .i{width:12px;height:12px;}

/* outbound links: quiet text, not a row of coloured pills */
.stopfoot{display:flex;gap:16px;flex-wrap:wrap;padding:0 14px 13px;}
.maplink{
  display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:400;
  color:var(--ink-faint);background:transparent;padding:0;border:0;border-radius:0;
  font-family:inherit;cursor:pointer;
  text-decoration:none;transition:color .15s;
}
.maplink .i{width:13px;height:13px;}
.maplink:hover{color:var(--ink);}

.cardtools{position:absolute;top:6px;right:6px;display:flex;flex-direction:column;gap:2px;}
.editbtn,.draghandle{
  width:32px;height:32px;display:grid;place-items:center;
  border-radius:var(--r-sm);background:transparent;border:1px solid transparent;
  color:var(--ink-faint);line-height:1;
}
.editbtn .i,.draghandle .i{width:16px;height:16px;}
.editbtn{cursor:pointer;}
.editbtn:hover{color:var(--ink);background:var(--surface-2);}
.editbtn:active,.stopcard.open .editbtn{background:var(--lc);color:var(--paper);}
.draghandle{cursor:grab;touch-action:none;user-select:none;-webkit-user-select:none;}
.draghandle:active,.unit.lifted .draghandle{cursor:grabbing;background:var(--lc);color:var(--paper);}

/* expanded editor */
.editor{border-top:1px solid var(--rule);padding:14px;background:var(--surface-2);}
.field{margin-bottom:12px;}
.field:last-child{margin-bottom:0;}
.field label{
  display:block;font-size:11.5px;font-weight:500;letter-spacing:.01em;
  color:var(--ink-faint);margin-bottom:6px;
}
.input,.textarea,.select{
  width:100%;font-family:inherit;font-size:16px;color:var(--ink);
  background:var(--surface);border:1px solid var(--rule);border-radius:var(--r-md);
  padding:11px 12px;line-height:1.5;
}
.textarea{resize:vertical;min-height:74px;}
.select{appearance:none;background-image:linear-gradient(45deg,transparent 50%,var(--ink-faint) 50%),linear-gradient(135deg,var(--ink-faint) 50%,transparent 50%);background-position:calc(100% - 18px) 52%,calc(100% - 13px) 52%;background-size:5px 5px,5px 5px;background-repeat:no-repeat;padding-right:36px;}
.input:focus,.textarea:focus,.select:focus{outline:2px solid var(--lc,var(--ink));outline-offset:-1px;border-color:transparent;}
.row2{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:10px;}
.row2 > *{min-width:0;}

.suggest{margin-top:6px;display:flex;flex-direction:column;gap:5px;}
.suggest-item{
  text-align:left;width:100%;cursor:pointer;
  background:var(--surface);border:1px solid var(--rule);border-radius:var(--r-md);padding:10px 12px;
}
.suggest-item:active{background:var(--surface-2);}
.suggest-item .n{font-size:13.5px;font-weight:600;}
.suggest-item .a{font-size:11.5px;color:var(--ink-faint);margin-top:2px;}
.hint{font-size:11.5px;color:var(--ink-faint);margin:6px 2px 0;line-height:1.6;}

.editor-tools{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px;}
.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:7px;cursor:pointer;
  font-family:var(--f-body);font-size:13px;font-weight:500;padding:10px 16px;
  border-radius:999px;min-height:40px;
  border:1px solid var(--rule);background:var(--surface);color:var(--ink);
  transition:border-color .15s, background .15s;
}
.btn .i{width:15px;height:15px;}
.btn:hover{border-color:var(--ink-faint);}
.btn:active{transform:scale(.98);}
.btn.primary{background:var(--ink);color:var(--paper);border-color:var(--ink);}
.btn.danger{color:var(--danger);border-color:color-mix(in srgb,var(--danger) 30%,transparent);}
.btn.wide{width:100%;}
.btn.wide + .btn.wide{margin-top:8px;}
.addstop{
  width:100%;margin-top:14px;padding:14px;cursor:pointer;
  border:1px dashed var(--rule);border-radius:var(--r-lg);background:transparent;
  color:var(--ink-faint);font-size:13px;font-weight:500;
}
.addstop:hover{color:var(--ink-soft);border-color:var(--ink-faint);}

.recalc{
  width:100%;margin-top:8px;padding:12px;cursor:pointer;
  display:inline-flex;align-items:center;justify-content:center;gap:7px;
  border:1px solid var(--rule);border-radius:var(--r-lg);background:transparent;
  color:var(--ink-soft);font-size:12.5px;font-weight:500;
}
.recalc .i{width:15px;height:15px;}
.recalc:hover{border-color:var(--ink-faint);color:var(--ink);}
.recalc[data-stale="1"]{border-color:color-mix(in srgb,var(--warn) 40%,transparent);color:var(--warn);}
.recalc:disabled{opacity:.5;}

/* ---------- 選幾個地點一齊搬 ---------- */
.stopcard.selecting .stopmain{padding-right:14px;cursor:pointer;-webkit-user-select:none;user-select:none;}
.stopcard.selecting{border-color:var(--rule);}
.stopcard.selecting.checked{border-color:var(--lc,var(--ink));}
.selbox{
  flex:0 0 auto;width:20px;height:20px;border-radius:var(--r-sm);margin-top:1px;
  border:1px solid var(--rule);display:grid;place-items:center;color:var(--paper);
}
.stopcard.checked .selbox{background:var(--lc,var(--ink));border-color:transparent;}
.selbox .i{width:13px;height:13px;}
.selectbar{
  position:sticky;bottom:calc(76px + env(safe-area-inset-bottom));z-index:40;
  margin-top:14px;padding:11px 14px;border-radius:var(--r-lg);
  background:var(--surface);border:1px solid var(--rule);box-shadow:var(--shadow-2);
  display:flex;align-items:center;gap:8px;font-size:13px;font-weight:500;
}
.selectbar span{flex:1;}
.selectbar .btn{padding:8px 14px;font-size:12.5px;min-height:36px;}

.photogrid{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-top:8px;}
.photogrid img{width:100%;height:70px;object-fit:cover;border-radius:var(--r-sm);cursor:pointer;border:2px solid transparent;display:block;}
.photogrid img.on{border-color:var(--lc,var(--ink));}

/* ---------- bottom dock ---------- */
.dock{
  position:fixed;left:0;right:0;bottom:0;z-index:60;
  display:flex;gap:8px;align-items:center;justify-content:center;
  padding:10px 16px calc(12px + env(safe-area-inset-bottom));
  background:linear-gradient(to top, var(--paper) 58%, transparent);
  pointer-events:none;
}
.dock > *{pointer-events:auto;}
.dockbtn{
  display:inline-flex;align-items:center;gap:7px;cursor:pointer;
  font-family:var(--f-body);font-size:12.5px;font-weight:500;
  padding:10px 16px;border-radius:999px;min-height:40px;
  border:1px solid var(--rule);background:var(--surface);color:var(--ink-soft);
  box-shadow:var(--shadow-1);
}
.dockbtn .dockbtn-i{display:inline-flex;}
.dockbtn .i{width:15px;height:15px;}
.dockbtn:hover{color:var(--ink);}
.dockbtn.accent{background:var(--ink);color:var(--paper);border-color:var(--ink);}
.dockbtn:active{transform:scale(.96);}
.savestate{
  position:fixed;left:50%;bottom:calc(78px + env(safe-area-inset-bottom));
  transform:translateX(-50%);z-index:61;
  font-size:11.5px;font-weight:500;padding:6px 13px;border-radius:999px;
  background:var(--ink);color:var(--paper);box-shadow:var(--shadow-1);
  opacity:0;transition:opacity .2s;pointer-events:none;white-space:nowrap;
}
.savestate.on{opacity:1;}

.genbanner{
  position:fixed;left:14px;right:14px;top:calc(10px + env(safe-area-inset-top));z-index:70;
  max-width:520px;margin:0 auto;
  background:var(--surface);border:1px solid var(--rule);border-radius:var(--r-lg);
  box-shadow:var(--shadow-2);padding:14px 16px;font-size:13.5px;display:none;
}
.genbanner.on{display:flex;align-items:center;gap:11px;}
.genbanner .spin,.spin{
  width:15px;height:15px;border-radius:999px;border:2px solid var(--rule);
  border-top-color:var(--ink);flex:none;display:inline-block;animation:genspin .8s linear infinite;
}
.genbanner.done .spin{display:none;}
@keyframes genspin{to{transform:rotate(360deg);}}
.genbanner .txt{flex:1;line-height:1.6;}

/* ---------- sheet + modal ---------- */
.scrim{position:fixed;inset:0;z-index:80;background:color-mix(in srgb,var(--ink) 42%,transparent);backdrop-filter:blur(3px);}
.sheet{
  position:fixed;left:0;right:0;bottom:0;z-index:81;
  max-height:88vh;overflow-y:auto;-webkit-overflow-scrolling:touch;
  background:var(--paper);border-radius:var(--r-xl) var(--r-xl) 0 0;
  box-shadow:var(--shadow-2);border-top:1px solid var(--rule);
  padding:10px 18px calc(24px + env(safe-area-inset-bottom));
  animation:rise .26s cubic-bezier(.2,.8,.3,1);
}
.sheet-wide{max-width:720px;margin:0 auto;}
@keyframes rise{from{transform:translateY(14px);opacity:.4;}to{transform:none;opacity:1;}}
.grabber{width:34px;height:3px;border-radius:2px;background:var(--rule);margin:0 auto 14px;}
.sheet h3{font-size:17px;font-weight:700;margin:0 0 4px;letter-spacing:-.015em;}
.sheet .sec-sub{margin-bottom:14px;}
.sheet-close{position:absolute;top:14px;right:18px;}

/* export sheet: grouped by what you're actually trying to do */
.exgroup{margin-top:18px;}
.exgroup:first-of-type{margin-top:6px;}
.exgroup-label{
  font-size:11.5px;font-weight:500;letter-spacing:.01em;
  color:var(--ink-faint);margin-bottom:9px;
}
.exhint{font-size:12px;color:var(--ink-faint);line-height:1.65;margin:8px 2px 0;}

.aibtns{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px;}
.askrow{display:flex;gap:8px;}
.askrow .input{flex:1 1 auto;}
.ai-out{margin-top:14px;display:flex;flex-direction:column;gap:10px;}
.ai-msg{
  background:var(--surface);border:1px solid var(--rule);border-radius:var(--r-md);
  padding:13px 14px;font-size:13.5px;line-height:1.75;white-space:pre-wrap;
}
.ai-msg .i{width:14px;height:14px;margin-right:5px;}
.ai-msg.ok{border-color:color-mix(in srgb,var(--ok) 40%,transparent);}
.dayai{margin-top:10px;}
.askedecho{font-size:12px;color:var(--ink-faint);margin:0 0 3px;}

/* free-form sections the family adds themselves */
.usec{background:var(--surface);border:1px solid var(--rule);border-radius:var(--r-lg);padding:14px 15px;margin-bottom:10px;position:relative;}
.usec-head{display:flex;align-items:flex-start;gap:8px;}
.usec-title{flex:1;font-size:15px;font-weight:600;line-height:1.45;letter-spacing:-.01em;}
.usec-tools{display:flex;gap:2px;flex:none;}
.usec-sub{margin-top:5px;font-size:12px;color:var(--ink-faint);line-height:1.65;}
.usec-list{margin:11px 0 0;padding-left:16px;}
.usec-list li{font-size:13.5px;line-height:1.8;margin-bottom:4px;color:var(--ink-soft);}
.usec-list li::marker{color:var(--ink-faint);}
.usec-by{margin-top:10px;font-size:11px;color:var(--ink-faint);}
.lastupd{margin-top:8px;font-family:var(--f-mono);font-size:10.5px;color:var(--ink-faint);letter-spacing:.01em;}
.lastupd:empty{display:none;}
.usec.lifted{z-index:30;box-shadow:var(--shadow-2);border-color:var(--ink-faint);}
.usec.shifting{transition:transform .18s cubic-bezier(.2,.7,.3,1);}

/* a long AI run needs to look alive: stage, clock, moving bar */
.aibusy{background:var(--surface);border:1px solid var(--rule);border-radius:var(--r-md);padding:13px 14px;margin-top:10px;}
.aibusy-top{display:flex;align-items:center;gap:9px;}
.aibusy-now{font-size:13.5px;font-weight:500;flex:1;}
.aibusy-secs{font-family:var(--f-mono);font-size:11.5px;color:var(--ink-faint);}
.aibusy-spin{width:14px;height:14px;border-radius:50%;flex:none;
  border:2px solid var(--rule);border-top-color:var(--ink);animation:aispin .8s linear infinite;}
@keyframes aispin{to{transform:rotate(360deg)}}
.aibusy-bar{margin-top:10px;height:2px;border-radius:99px;background:var(--surface-2);overflow:hidden;}
.aibusy-bar i{display:block;height:100%;width:38%;border-radius:99px;background:var(--ink-faint);animation:aislide 1.5s ease-in-out infinite;}
@keyframes aislide{0%{margin-left:-38%}100%{margin-left:100%}}
.aibusy-steps{display:flex;flex-wrap:wrap;gap:6px 12px;margin-top:10px;font-size:11.5px;color:var(--ink-faint);}
.aibusy-steps .now{color:var(--ink);font-weight:500;}
.aibusy-steps .done{color:var(--ok);}
.aibusy-steps .i{width:12px;height:12px;}
.aibusy-note{margin-top:9px;font-size:11.5px;line-height:1.65;color:var(--ink-faint);}
@media (prefers-reduced-motion:reduce){.aibusy-spin,.aibusy-bar i,.spin{animation:none}}

.ai-change{background:var(--surface);border:1px solid var(--rule);border-left:2px solid var(--lc,var(--ink));border-radius:var(--r-md);padding:13px 14px;}
.ai-change[data-jumpitem]{cursor:pointer;}
.ai-change[data-jumpitem]:active{background:var(--surface-2);}
.ai-change .op{
  font-size:11px;font-weight:500;letter-spacing:.01em;color:var(--ink-faint);
}
.ai-change .ttl{font-size:14.5px;font-weight:600;margin:4px 0;}

}

.stayrow{border-top:1px solid var(--rule-soft);padding-top:12px;margin-top:12px;}

}
.stayblock{border:1px solid var(--rule);border-radius:var(--r-md);padding:12px 13px;margin-bottom:10px;}
.stayblock-head{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:9px;}
.stayrange{display:flex;align-items:center;gap:8px;}
.stayrange select{flex:1 1 auto;min-width:0;}
.daystay{
  display:inline-flex;align-items:center;gap:7px;
  font-size:12.5px;color:var(--ink-soft);margin-top:12px;
}
.daystay .i{width:14px;height:14px;color:var(--ink-faint);}
.daystay b{color:var(--ink);font-weight:600;}

/* ---------- home page section editing ---------- */
.secedit{
  border:0;background:transparent;cursor:pointer;
  line-height:1;padding:4px;margin-left:4px;
  color:var(--ink-faint);opacity:.6;vertical-align:middle;border-radius:var(--r-sm);
}
.secedit .i{width:15px;height:15px;}
.secedit:hover,.secedit:focus-visible{opacity:1;color:var(--ink);background:var(--surface-2);}
.sectools{display:inline-flex;align-items:center;}
.secdel:hover,.secdel:focus-visible{color:var(--danger);}
.fieldhint{font-size:11.5px;line-height:1.65;color:var(--ink-faint);margin:0 0 8px;}

.sechandle{cursor:grab;touch-action:none;user-select:none;-webkit-user-select:none;}
.sechandle:active{cursor:grabbing;color:var(--ink);opacity:1;}
.hsblock{position:relative;}
.hsblock.lifted{z-index:30;outline:1px solid var(--ink-faint);outline-offset:8px;border-radius:10px;}
.hsblock.shifting{transition:transform .18s cubic-bezier(.2,.7,.3,1);}

  background:transparent;border:0;border-top:1px solid var(--rule);

}

}
.ailog-sub{font-size:11px;font-weight:400;color:var(--ink-faint);}
.ailog-entry{border-top:1px solid var(--rule-soft);padding-top:10px;margin-top:10px;}

.ailog-when{font-family:var(--f-mono);font-size:10.5px;color:var(--ink-faint);margin-bottom:5px;}
.ailog-text{font-size:13px;line-height:1.8;color:var(--ink-soft);white-space:pre-wrap;}
.ailog-note{font-size:11.5px;line-height:1.65;color:var(--ink-faint);margin-top:6px;}

.ailog-entry.collapsed .ailog-when{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:2px;}
.ailog-entry.collapsed .ailog-note{margin-top:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.ailog-caret{color:var(--ink-faint);flex:0 0 auto;display:inline-flex;transform:rotate(90deg);}

.ainew{

}

.inday:active{background:var(--surface-2);}

.copyrow{
  width:100%;margin-top:10px;display:flex;align-items:center;justify-content:center;
  gap:7px;flex-wrap:wrap;
}
.copyrow small{font-weight:400;color:var(--ink-faint);font-size:11px;}
.sugg{color:var(--ink-faint);font-size:11px;font-weight:500;}

  // When fetch can't reach the server at all it rejects with a TypeError whose
  // message is whatever the browser feels like ("Load failed" on Safari,
  // "Failed to fetch" on Chrome) — which tells the family nothing. The most
  // common real cause is the free-tier database auto-pausing after a week with
  // no traffic, so say that instead. Server-side errors keep their own message,
  // which already names the status code.
  function netMsg(e){
    return (e instanceof TypeError)
      ? "連唔到伺服器。可能係個資料庫暫時瞓着咗（免費方案冇人用夠一個星期就會自動暫停），等一兩分鐘再試下。"
      : e.message;

  // some older records have markup baked into plain-text fields; show the words, not the tags
  // the AI brief is free text the user typed; keep their line breaks (plain()
  // would collapse them, so re-opening the editor would lose the formatting)
  function briefText(snap){ return String((snap && snap.tripBrief) || "").trim(); }
  // The brief is free text the family wrote, so it may not say where or when
  // they're going — the Seoul trip predates the field and has none at all,
  // which is why asking it about the season came back as「話我知你去邊度、
  //幾月出發呀」. Every AI action starts from this string, so state the two
  // facts outright instead of hoping the prose mentions them. Kept on this
  // side rather than in the edge function so the trip stays the single source
  // of truth for its own details.
  function briefForAi(snap){
    const m = (snap && snap.meta) || {};
    const head = briefText(snap) || defaultTripBrief(snap);
    const facts = [];
    const where = String(m.destinationLocal || m.title || "").trim();
    // a brief that already names them (the generated default does) doesn't
    // need the same facts repeated back at the model
    if (where && !head.includes(where)) facts.push("目的地：" + where);
    if (m.dateStart && m.dateEnd && !head.includes(m.dateStart)) facts.push(`日期：${m.dateStart} 至 ${m.dateEnd}`);
    return facts.length ? `${head}\n（今次行程 —— ${facts.join("；")}）` : head;
  }
  function plain(s){
    return String(s == null ? "" : s).replace(/<[^>]*>/g, "").replace(/\s+/g, " ").trim();
  }
  const $ = sel => document.querySelector(sel);

  async function saveVersion(snapshot, source, summary, trivial){
    const res = await fetch(`${SUPABASE_URL}/rest/v1/itinerary_versions`, {
      method: "POST",

      body: JSON.stringify({ trip_id: state.tripId, edited_by: getEditedBy(), source, summary, snapshot, trivial: !!trivial })

  // The trip background ("who's going, when, 姨姨唔可以行樓梯…") rides along on
  // EVERY ai call, so editing it on the home page changes what all of the AI
  // features assume. Blank means the Edge Function keeps using its built-in
  // default, so clearing the box can't leave the AI with no context at all.
  // Destination coordinates/search-hint/date-range ride along on EVERY call,
  // same as brief — so no caller has to remember to pass them, and the edge
  // function never needs a hardcoded city to fall back on. Read fresh off
  // meta each time (not baked into a const) so re-planning this same app for
  // a different trip is just editing 首頁 fields, no code change anywhere.
  async function callAi(payload){
    const m = (state.snapshot && state.snapshot.meta) || {};
    const body = Object.assign({
      brief: briefForAi(state.snapshot),
      destinationLocal: m.destinationLocal || "",
      lat: Number.isFinite(m.lat) ? m.lat : null,
      lng: Number.isFinite(m.lng) ? m.lng : null,
      dateStart: m.dateStart || "",
      dateEnd: m.dateEnd || "",
    }, payload);
    // Everything that can go wrong INSIDE the edge function comes back as
    // {ok:false, message} with CORS headers on it. So if fetch itself rejects,
    // or the reply has no readable JSON, the request died before the function
    // could answer — the worker was killed mid-call (a Gemini call that never
    // returns keeps it running until the platform pulls the plug), or the
    // network dropped. Both surface as a bare TypeError whose message is the
    // browser's own wording ("Load failed" / "Failed to fetch"), so translate.
    const ctl = new AbortController();
    // A Gemini text call that hasn't answered in a minute is not about to.
    // Bail well before the platform's own ~150s kill, which closes the socket
    // with no status and no CORS header — i.e. silently, with nothing to show.
    const timer = setTimeout(() => ctl.abort(), 60000);
    let res;
    try {
      res = await fetch(FUNCTIONS_URL, { method:"POST", headers: sbHeaders(), body: JSON.stringify(body), signal: ctl.signal });
    } catch (e){
      if (e && e.name === "AbortError"){
        throw new Error("AI 諗咗超過 60 秒都未有回音，可能係 Gemini 塞緊車。等一陣再撳多次。");
      }
      if (e instanceof TypeError){
        // NOT the same story as a dead database — the page itself is clearly
        // loading, so blame the call, not the DB.
        throw new Error("連唔到 AI 服務。可能係今次 call 做得太耐俾系統中斷咗，或者網絡斷開咗，再試一次通常就得。");
      }
      throw e;
    } finally {
      clearTimeout(timer);
    }
    try {
      return await res.json();
    } catch (e){
      throw new Error(`AI 服務答咗個空白／壞咗嘅回覆（HTTP ${res.status}）。多數係今次 call 做得太耐俾系統中斷咗，再試一次通常就得。`);
    }
  }

  // Every AI answer is kept, so the family can read back what was asked.

  function flash(msg, keep){
