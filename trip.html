  // ---------- 住宿：可以唔止一間 ----------
  // A trip can change hotels partway through, so accommodation is a LIST of
  // stays, each covering a range of days. The old single-object shape is
  // migrated on load, and stays[0] is mirrored back onto `accommodation` so the
  // Edge Function (which reads accommodation.name) keeps working unchanged.
  function migrateStays(snap){
    if (!snap) return snap;
    if (!Array.isArray(snap.stays)){
      const a = snap.accommodation;
      const days = snap.days || [];
      snap.stays = (a && (a.name || a.desc))
        ? [Object.assign({}, a, {
            from: days[0] ? days[0].id : "",
            to:   days.length ? days[days.length-1].id : "",
            // the old 「酒店」 map pin IS this hotel, just written down as a bare
            // coordinate — take it over so the pin now belongs to the stay and
            // moves (or disappears) when the stay changes
            lat: legacyHotelPoint(snap)[0],
            lng: legacyHotelPoint(snap)[1],
          })]
        : [];
    }
    return snap;
  }
  // matches the hand-authored unnumbered pin 「酒店」 that every day used to carry
  function isHotelAnchorName(t){ return /^(酒店|住宿|hotel)/i.test(String(t || "").trim()); }
  function legacyHotelPoint(snap){
    for (const d of (snap.days || [])){
      for (const p of (Array.isArray(d.mapPoints) ? d.mapPoints : [])){
        const name = String((Array.isArray(p) ? p[2] : p?.name) || "");
        if (/^\s*\d+\s/.test(name) || !isHotelAnchorName(name)) continue;
        const lat = Number(Array.isArray(p) ? p[0] : p?.lat);
        const lng = Number(Array.isArray(p) ? p[1] : p?.lng);
        if (Number.isFinite(lat) && Number.isFinite(lng)) return [lat, lng];
      }
    }
    return [undefined, undefined];
  }
  function syncAccommodation(snap){
    // keep the legacy field pointing at the first stay: the AI prompt and any
    // older saved snapshot still read it
    const s = (snap.stays || [])[0];
    snap.accommodation = s
      ? { name:s.name||"", desc:s.desc||"", hoursChip:s.hoursChip||"", warning:s.warning||"", mapUrl:s.mapUrl||"" }
      : { name:"", desc:"", hoursChip:"", warning:"", mapUrl:"" };
  }
  function dayIndexById(snap, id){
    return (snap.days || []).findIndex(d => d.id === id);
  }
  // A stay needs its own coordinate, otherwise the 🏨 pin can't move when the
  // hotel changes. Looked up the same way stops are (Google via place-search).
  // A failure leaves the stay with no coordinate — no pin at all beats a pin
  // on the previous hotel.
  async function geocodeStays(snap){
    const todo = (snap.stays || []).filter(s =>
      (s.name || "").trim() && !s.noGeo &&
      !(Number.isFinite(Number(s.lat)) && Number.isFinite(Number(s.lng))));
    if (!todo.length) return;
    let found = 0;
    for (const s of todo){
      try {
        const r = await callAi({ action:"place-search", query: plain(s.name) });
        const p = r && r.places && r.places[0];
        if (p && Number.isFinite(p.lat) && Number.isFinite(p.lng)){
          s.lat = p.lat; s.lng = p.lng; found++;
        } else if (r && r.ok === false){
          break;                 // lookup unavailable — says nothing about this hotel
        } else {
          s.noGeo = true;        // Google has no such place; don't ask again
        }
      } catch (_){ break; }
    }
    if (found){ render(); await saveNow(`搵返住宿喺地圖上面嘅位置`, true); }
    else render();
  }
  // which stay covers this day (first match wins if ranges overlap)
  function stayForDay(snap, day){
    if (!snap || !day) return null;
    const di = dayIndexById(snap, day.id);
    if (di < 0) return null;
    return (snap.stays || []).find(s => {
      const a = dayIndexById(snap, s.from), b = dayIndexById(snap, s.to);
      if (a < 0 || b < 0) return false;
      return di >= Math.min(a,b) && di <= Math.max(a,b);
    }) || null;
  }
  // 入住 / 退房 / 幾晚, set like the stub on the trip's boarding pass
  function stayStubHtml(snap, s){

    const todo = (snap.days || []).filter(d => !plain(d.desc) && (d.items || []).some(i => i.kind === "stop"));
    if (!todo.length) return false;

          `每日一行，格式一定要係「dayN｜簡介」，唔好有其他字：\n` + todo.map(d => `${d.id}：${(d.items || []).filter(i => i.kind === "stop").map(i => plain(i.title)).join("、")}`).join("\n") });
    } catch (_){ return false; }
    const text = (r && (r.aiSummary || r.answer)) || "";
    let got = 0;
    text.split(/\n+/).forEach(line => {

      const d = m && todo.find(x => x.id === m[1].toLowerCase());

    });

  // a stay is a place like any other — give it a picture once, in the background
  const stayPhotoTried = new Set();

  let stayCheckBusy = false;
  async function backfillStayPhotos(snap){
    const todo = (snap.stays || []).filter(st => st && st.name && !st.photoUrl && !st.noPhoto && !stayPhotoTried.has(st.name));

        const r = await fetchStoredPhoto({ title: st.name, kr: st.kr, placeId: st.placeId });

    }

      if (state.view === "overview" || state.view === "stays") render();
      await saveNow(`補返 ${got} 張住宿相`, true);

  }
  // ---------- 住宿建議 ----------
  // An import used to drop one AI-picked hotel in and call it done. Now the

  // ---------- where the suggested hotels are ----------
  // Lettered pins for the hotels (the same letter is on each card) over the

  function stayLetter(k){ return k < 26 ? String.fromCharCode(65 + k) : String(k + 1); }
  function initStayMap(){
    const el = document.getElementById("map-stays");
    if (!el) return;
    if (typeof L === "undefined"){ el.innerHTML = `<div class="mapfallback">地圖要有網絡先載入到。</div>`; return; }
    try {
      const map = L.map(el, { scrollWheelZoom: false, zoomControl: true, attributionControl: false, tap: false });
      L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png", { maxZoom: 18 }).addTo(map);
      const all = [];
      (state.snapshot.days || []).forEach(day => {
        const color = dayHex(day.id);
        normPoints(buildDayMapPoints(day)).forEach(p => {
          L.circleMarker([p.lat, p.lng], { radius: 5, color, weight: 2, fillColor: color, fillOpacity: .55 })
            .bindPopup(`Day ${day.id.replace("day", "")} · ${esc(p.name || "")}`).addTo(map);
          all.push([p.lat, p.lng]);
        });
      });
      (state.snapshot.staySuggest.hotels || []).forEach((h, k) => {
        if (!Number.isFinite(h.lat) || !Number.isFinite(h.lng)) return;
        L.marker([h.lat, h.lng], { icon: L.divIcon({ className: "", iconSize: [26, 26], iconAnchor: [13, 13],
          html: `<div class="sgmarker">${stayLetter(k)}</div>` }) })
          .bindPopup(`<b>${esc(h.name)}</b><br>${esc(h.price || "")}${h.station ? `<br>最近 ${esc(h.station)}${h.walk ? " · " + esc(h.walk) : ""}` : ""}`).addTo(map);
        all.push([h.lat, h.lng]);
      });

      // day trip 50 km away would otherwise shrink every hotel to one dot.
      const hs = (state.snapshot.staySuggest.hotels || []).filter(h => Number.isFinite(h.lat)).map(h => [h.lat, h.lng]);
      const km = (a, b) => Math.hypot((a[0] - b[0]) * 111, (a[1] - b[1]) * 111 * Math.cos(a[0] * Math.PI / 180));
      const frame = hs.length ? hs.concat(all.filter(pt => hs.some(h => km(h, pt) < 8))) : all;
      const fit = () => { map.invalidateSize(); if (frame.length) map.fitBounds(L.latLngBounds(frame).pad(0.15), { maxZoom: 16 }); };

  // ---------- adding a hotel by hand ----------

  // A hotel the family added gets the same look the AI's picks get: price for

  function stayContext(){

  // Suggestions made before the score existed (and any hotel whose check
  // failed once) get the same analysis, a few at a time, in the background.
  async function backfillStayChecks(snap){
    if (stayCheckBusy || state.readonly || state.offline) return;
    const sg = snap.staySuggest;
    const todo = ((sg && sg.hotels) || []).filter(h => h && h.name && !Number.isFinite(h.score) && !h.checked && !stayCheckTried.has(h.name));
    if (!todo.length) return;
    stayCheckBusy = true;
    let got = 0;
    try {
      for (let i = 0; i < todo.length; i += 3){
        const batch = todo.slice(i, i + 3);
        batch.forEach(h => stayCheckTried.add(h.name));
        const r = await Promise.all(batch.map(h => checkStayHotel(h)));
        batch.forEach((h, j) => { if (!r[j]) stayCheckFailed.add(h.name); });
        got += r.filter(Boolean).length;
        if (state.snapshot === snap && state.view === "stays") render();
      }
    } finally { stayCheckBusy = false; }
    if (got) await saveNow(`幫 ${got} 間酒店補返推介指數同分析`, true);
  }
  document.addEventListener("click", e => {
    const g = e.target.closest && e.target.closest("[data-go-stays]");
    if (!g) return;

    const t = document.querySelector('#lines [data-go="stays"]'); if (t) t.scrollIntoView({ block: "nearest", inline: "center" });

  function stayRangeLabel(snap, s){
    const days = snap.days || [];
    const a = days[dayIndexById(snap, s.from)], b = days[dayIndexById(snap, s.to)];
    if (!a && !b) return "未定日子";
    if (a && b && a.id === b.id) return `${a.date}（一晚）`;
    return `${a ? a.date : "?"} → ${b ? b.date : "?"}`;
  }

  // Renaming the hotel on the home page has to reach the itinerary too — Day 1
  // literally says 「抵達 <酒店名>」, so leaving the stops alone is what made an
  // updated 住宿 look like it did nothing. Only whole-name occurrences are
  // swapped, and only for names long enough to be unambiguous.
  function renameStayInItinerary(snap, oldName, newName){
    const from = String(oldName || "").trim(), to = String(newName || "").trim();
    if (!from || !to || from === to || from.length < 3) return 0;
    let hits = 0;
    const swap = t => {
      const s = String(t == null ? "" : t);
      if (!s.includes(from)) return t;
      hits++;
      return s.split(from).join(to);
    };
    (snap.days || []).forEach(d => (d.items || []).forEach(it => {
      if (it.kind !== "stop") return;
      it.title = swap(it.title);
      it.desc  = swap(it.desc);
    }));
    // the hero badge names the hotel too — leaving it behind looks just as
    // stale as the Day 1 stop did
    const m = snap.meta;
    if (m && Array.isArray(m.hotelTags)) m.hotelTags = m.hotelTags.map(swap);
    return hits;
  }

  // ---------- drag to reorder ----------
  function wireDrag(day, line){
    if (!line) return;
    let drag = null;
    let raf = null;

    // Everything is measured in page coordinates, not viewport ones, so the
    // drag keeps working while the page scrolls underneath it.
    function paint(){
      if (!drag || !drag.active) return;
      const pageY = drag.clientY + window.scrollY;
      drag.el.style.transform = `translateY(${pageY - drag.startPageY}px)`;

      let to = drag.from;
      for (let k = 0; k < drag.rects.length; k++){
        if (k === drag.from) continue;
        const mid = drag.rects[k].top + drag.rects[k].height / 2;
        if (k < drag.from && pageY < mid) to = Math.min(to, k);
        if (k > drag.from && pageY > mid) to = Math.max(to, k);
      }
      if (to !== drag.to){
        drag.to = to;
        const h = drag.rects[drag.from].height;
        drag.units.forEach((u,k) => {
          if (k === drag.from) return;
          u.classList.add("shifting");
          let shift = 0;
          if (drag.to < drag.from && k >= drag.to && k < drag.from) shift = h;
          if (drag.to > drag.from && k > drag.from && k <= drag.to) shift = -h;
          u.style.transform = shift ? `translateY(${shift}px)` : "";
        });
      }
    }

    // hold the card near the top or bottom edge and the page follows
    function tick(){
      if (!drag || !drag.active){ raf = null; return; }
      const edge = 110, vh = window.innerHeight, y = drag.clientY;
      let step = 0;
      if (y < edge) step = -Math.ceil((edge - y) / 5);
      else if (y > vh - edge) step = Math.ceil((y - (vh - edge)) / 5);
      if (step){
        const before = window.scrollY;
        window.scrollBy(0, Math.max(-28, Math.min(28, step)));
        if (window.scrollY !== before) paint();
      }
      raf = requestAnimationFrame(tick);
    }

    line.querySelectorAll("[data-drag]").forEach(handle => {
      handle.addEventListener("pointerdown", e => {
        e.preventDefault();
        const unitEl = handle.closest(".unit");
        const units = Array.from(line.querySelectorAll(".unit"));
        const sy = window.scrollY;
        drag = {
          el: unitEl,
          from: units.indexOf(unitEl),
          to: units.indexOf(unitEl),
          startPageY: e.clientY + sy,
          clientY: e.clientY,
          units,
          rects: units.map(u => { const r = u.getBoundingClientRect(); return { top: r.top + sy, height: r.height }; }),
          active: false,
          timer: setTimeout(() => {
            if (!drag) return;
            drag.active = true;
            unitEl.classList.add("lifted");
            if (navigator.vibrate) navigator.vibrate(12);
            if (!raf) raf = requestAnimationFrame(tick);
          }, 260)
        };
        handle.setPointerCapture(e.pointerId);
      });

      handle.addEventListener("pointermove", e => {
        if (!drag) return;
        if (!drag.active){
          // Moving before the hold timer fires used to CANCEL the drag, on the
          // theory the user meant to scroll. But the handle has
          // touch-action:none and captures the pointer, so it can never scroll
          // the page — pressing and moving straight away (the natural drag
          // gesture) just silently did nothing. Treat that move as the drag
          // starting instead; the timer stays for press-and-hold-still.
          if (Math.abs((e.clientY + window.scrollY) - drag.startPageY) > 6){
            clearTimeout(drag.timer);
            drag.active = true;
            drag.el.classList.add("lifted");
            if (!raf) raf = requestAnimationFrame(tick);
          } else {
            return;
          }
        }
        e.preventDefault();
        drag.clientY = e.clientY;
        paint();
      });

      const finish = () => {
        if (!drag) return;
        clearTimeout(drag.timer);
        if (raf){ cancelAnimationFrame(raf); raf = null; }
        const d = drag; drag = null;
        d.units.forEach(u => { u.style.transform = ""; u.classList.remove("shifting","lifted"); });
        if (!d.active || d.to === d.from) return;
        const units = toUnits(day.items);
        const [moved] = units.splice(d.from, 1);
        units.splice(d.to, 0, moved);
        day.items = fromUnits(units);
        syncMapPoints(day);
        state.open.clear();
        render();
        // follow the card to where it landed, so the drop is never off-screen
        const landed = line.querySelector(`.unit[data-i="${d.to}"]`);
        if (landed) landed.scrollIntoView({ block:"center", behavior:"smooth" });
        saveNow("調整咗次序").then(() =>
          refreshTransit(day, [d.to, d.to + 1, d.from, d.from + 1]));
      };
      handle.addEventListener("pointerup", finish);
      handle.addEventListener("pointercancel", finish);
    });
  }

  // Same long-press-then-drag gesture as wireDrag above, generalised for any
  // vertical list of same-class blocks (home-page sections, custom sections)
  // instead of only itinerary stops. onDrop(from, to) does the actual array
  // move + render + save; this only handles the pointer gesture and the
  // visual shuffle while dragging.
  function wireSimpleDrag(container, itemSelector, handleSelector, onDrop){
    if (!container) return;
    let drag = null;
    let raf = null;

    function paint(){
      if (!drag || !drag.active) return;
      const pageY = drag.clientY + window.scrollY;
      drag.el.style.transform = `translateY(${pageY - drag.startPageY}px)`;
      let to = drag.from;
      for (let k = 0; k < drag.rects.length; k++){
        if (k === drag.from) continue;
        const mid = drag.rects[k].top + drag.rects[k].height / 2;
        if (k < drag.from && pageY < mid) to = Math.min(to, k);
        if (k > drag.from && pageY > mid) to = Math.max(to, k);
      }
      if (to !== drag.to){
        drag.to = to;
        const h = drag.rects[drag.from].height;
        drag.items.forEach((u,k) => {
          if (k === drag.from) return;
          u.classList.add("shifting");
          let shift = 0;
          if (drag.to < drag.from && k >= drag.to && k < drag.from) shift = h;
          if (drag.to > drag.from && k > drag.from && k <= drag.to) shift = -h;
          u.style.transform = shift ? `translateY(${shift}px)` : "";
        });
      }
    }
    function tick(){
      if (!drag || !drag.active){ raf = null; return; }
      const edge = 110, vh = window.innerHeight, y = drag.clientY;
      let step = 0;
      if (y < edge) step = -Math.ceil((edge - y) / 5);
      else if (y > vh - edge) step = Math.ceil((y - (vh - edge)) / 5);
      if (step){
        const before = window.scrollY;
        window.scrollBy(0, Math.max(-28, Math.min(28, step)));
        if (window.scrollY !== before) paint();
      }
      raf = requestAnimationFrame(tick);
    }

    container.querySelectorAll(handleSelector).forEach(handle => {
      handle.addEventListener("pointerdown", e => {
        e.preventDefault();
        const itemEl = handle.closest(itemSelector);
        const items = Array.from(container.querySelectorAll(itemSelector));
        const sy = window.scrollY;
        drag = {
          el: itemEl,
          from: items.indexOf(itemEl),
          to: items.indexOf(itemEl),
          startPageY: e.clientY + sy,
          clientY: e.clientY,
          items,
          rects: items.map(u => { const r = u.getBoundingClientRect(); return { top: r.top + sy, height: r.height }; }),
          active: false,
          timer: setTimeout(() => {
            if (!drag) return;
            drag.active = true;
            itemEl.classList.add("lifted");
            if (navigator.vibrate) navigator.vibrate(12);
            if (!raf) raf = requestAnimationFrame(tick);
          }, 260)
        };
        handle.setPointerCapture(e.pointerId);
      });
      handle.addEventListener("pointermove", e => {
        if (!drag) return;
        if (!drag.active){
          if (Math.abs((e.clientY + window.scrollY) - drag.startPageY) > 6){
            clearTimeout(drag.timer);
            drag.active = true;
            drag.el.classList.add("lifted");
            if (!raf) raf = requestAnimationFrame(tick);
          } else return;
        }
        e.preventDefault();
        drag.clientY = e.clientY;
        paint();
      });
      const finish = () => {
        if (!drag) return;
        clearTimeout(drag.timer);
        if (raf){ cancelAnimationFrame(raf); raf = null; }
        const d = drag; drag = null;
        d.items.forEach(u => { u.style.transform = ""; u.classList.remove("shifting","lifted"); });
        if (!d.active || d.to === d.from) return;
        onDrop(d.from, d.to);
      };
      handle.addEventListener("pointerup", finish);
      handle.addEventListener("pointercancel", finish);
    });
  }

  // ==================================================================
  // MAPS
  // ==================================================================
  // stored points are [lat, lng, name] tuples; the name often carries the
  // stop's own number ("1 Artist Bakery"), so use that rather than inventing one
  // day.mapPoints is a hand-authored [lat,lng,"N 地方名"] list, kept separate
  // from day.items so drag-reorder, cross-day moves, copies and removals never
  // touch it — which is exactly why the mini-map used to keep the OLD
  // order/numbering (or a stale pin for something already deleted) no matter
  // what happened to the actual timeline. This matches each numbered point
  // back to a stop by name and renumbers the points to follow the stops'
  // current order. A point that matches nothing anymore (its stop got
  // deleted) is dropped — a leftover pin for a place no longer on the day is
  // more wrong than losing one hand-authored coordinate.
  function syncMapPoints(day){
    const raw = Array.isArray(day.mapPoints) ? day.mapPoints : [];
    if (!raw.length) return;
    const stopTitles = toUnits(day.items).map(u => u.stop).filter(Boolean).map(s => loose(plain(s.title)));

    const parsed = raw.map(p => {
      const lat = Array.isArray(p) ? p[0] : p?.lat;
      const lng = Array.isArray(p) ? p[1] : p?.lng;
      const name = String((Array.isArray(p) ? p[2] : p?.name) || "");
      const m = name.match(/^\s*(\d+)\s+(.*)$/);
      return { lat, lng, label: m ? m[1] : "", text: m ? m[2] : name };
    });
    const numbered = parsed.filter(p => p.label);
    const anchors  = parsed.filter(p => !p.label);   // e.g. "酒店" — not a stop, keep up front
    if (!numbered.length) return;

    numbered.forEach(p => {
      const l = loose(p.text);
      let idx = stopTitles.findIndex(t => t === l);
      if (idx < 0) idx = stopTitles.findIndex(t => t && l && (t.includes(l) || l.includes(t)));
      p.order = idx;
    });
    const matched = numbered.filter(p => p.order >= 0).sort((a,b) => a.order - b.order);
    matched.forEach((p,i) => { p.label = String(i + 1); });

    day.mapPoints = [...anchors, ...matched].map(p => [p.lat, p.lng, `${p.label} ${p.text}`.trim()]);
  }

  // The single source of truth for what actually shows on a day's map. Older
  // content only ever has coordinates in the hand-authored day.mapPoints list
  // (curated once, a handful of points), while day.items keeps growing —
  // stops added since (via AI suggest, a board copy, or the autocomplete
  // search box) carry their OWN real lat/lng from enrichStop, but nothing
  // ever added them to that old list. Rendering straight from day.mapPoints
  // is why a day with many stops could show only the 3 it originally had.
  // This derives fresh from the CURRENT stops every render: prefer a stop's
  // own coordinate, fall back to a fuzzy name-match against the legacy list,
  // and report what still has neither so the UI can offer to look it up.
  // Every name this stop is known by. The Chinese title alone is often not
  // what the legacy point or Google calls it — "搭乘 ITX-青春 列車" is the point
  // "清涼里站" and the Naver link's search term 청량리역; "北村韓屋村（平緩觀景點）"
  // is 북촌한옥마을. Matching and geocoding both need all of them.
  function stopSearchTerms(s){
    const out = [plain(s.title), plain(s.kr)];
    const m = String(s.mapUrl || "").match(/\/search\/([^/?#]+)/);
    if (m){ try { out.push(decodeURIComponent(m[1]).replace(/\+/g, " ")); } catch (_){} }
    return out.map(t => String(t || "").trim()).filter(Boolean);
  }
  // Rows like 「酒店出發」「自由漫遊／拍照時光」「飛返香港 ✈」 are schedule notes,
  // not places — sending them to Google would pin some unrelated hotel on the
  // map. A row is a real place only if it carries a Korean name or a map link,
  // the same signal the rating and link features already use.
  function isRealPlace(s){
    return !!(s.placeId || plain(s.kr) || String(s.mapUrl || "").trim());
  }
  // what to actually search Google with — Korean first, it matches far better
  function geocodeQuery(s){
    const m = String(s.mapUrl || "").match(/\/search\/([^/?#]+)/);
    let naver = "";
    if (m){ try { naver = decodeURIComponent(m[1]).replace(/\+/g, " ").trim(); } catch (_){} }
    return plain(s.kr) || naver || cleanPlaceName(s.title);
  }

  function resolveDayMapPoints(day){
    const raw = Array.isArray(day.mapPoints) ? day.mapPoints : [];
    const parsed = raw.map(p => {
      const lat = Array.isArray(p) ? p[0] : p?.lat;
      const lng = Array.isArray(p) ? p[1] : p?.lng;
      const name = String((Array.isArray(p) ? p[2] : p?.name) || "");
      const m = name.match(/^\s*(\d+)\s+(.*)$/);
      return { lat: Number(lat), lng: Number(lng), label: m ? m[1] : "", text: m ? m[2] : name };
    }).filter(p => Number.isFinite(p.lat) && Number.isFinite(p.lng));
    // The hand-authored 「酒店」 pin is a frozen coordinate: it kept pointing at
    // the first hotel even after 住宿 was changed, which is exactly the "地圖到
    //仲未update" complaint. Drop it and draw the pin from the stay covering
    // THIS day instead — right name, right place, and it follows a hotel swap
    // partway through the trip.
    const anchors = parsed.filter(p => !p.label && !isHotelAnchorName(p.text));
    const legacy  = parsed.filter(p => p.label);
    const stay = stayForDay(state.snapshot, day);
    if (stay && Number.isFinite(Number(stay.lat)) && Number.isFinite(Number(stay.lng)))
      anchors.unshift({ lat:Number(stay.lat), lng:Number(stay.lng),
                        label:"", text:plain(stay.name) || "住宿" });

    const used = new Set();
    const claimLegacy = s => {
      const terms = stopSearchTerms(s).map(loose).filter(Boolean);
      if (!terms.length) return null;
      let hit = legacy.find(p => !used.has(p) && terms.includes(loose(p.text)));
      if (!hit) hit = legacy.find(p => {
        if (used.has(p)) return false;
        const t = loose(p.text);
        return t && terms.some(l => t.includes(l) || l.includes(t));
      });
      if (hit) used.add(hit);
      return hit || null;
    };

    const points = [];
    const unresolved = [];
    // Keyed by the stop's index in toUnits(day.items) — the same index
    // unitHtml renders with — so the number on a stop card can match the pin
    // it points to on the map without re-deriving the geocoding logic twice.
    const numberByIndex = new Map();
    let n = 0;
    toUnits(day.items).forEach((u, idx) => {
      const s = u.stop;
      if (!s) return;
      const title = plain(s.title);
      if (!title) return;
      let lat = s.lat, lng = s.lng;
      if (!(Number.isFinite(lat) && Number.isFinite(lng))){
        const hit = claimLegacy(s);
        if (hit){ lat = hit.lat; lng = hit.lng; }
      }
      if (Number.isFinite(lat) && Number.isFinite(lng)){
        n++;
        points.push([lat, lng, `${n} ${title}`]);
        numberByIndex.set(idx, n);
      } else if (isRealPlace(s) && !s.noGeo){
        unresolved.push(s);          // a real place Google can probably find
      }
    });

    // A curated point no stop claimed still belongs on the map — dropping it
    // would make the map show LESS than it did before this resolver existed.
    // It rides along as an unnumbered dot, same as the hotel anchor.
    // Exception: 「清涼里站」 and the stop 「搭乘 ITX-青春 列車」 are the same
    // platform written in two scripts, so no name match is possible — but once
    // the stop has been geocoded they land on the same spot. Anything within
    // ~90 m of a numbered pin is already represented; a second dot on top of
    // it is just clutter.
    const near = (a, b) => Math.abs(a[0] - b[0]) < 0.0008 && Math.abs(a[1] - b[1]) < 0.0008;
    const orphans = legacy.filter(p => !used.has(p) && !points.some(q => near(q, [p.lat, p.lng])));

    return {
      tuples: [...anchors.map(p => [p.lat, p.lng, p.text]),
               ...orphans.map(p => [p.lat, p.lng, p.text]),
               ...points],
      unresolved,
      numberByIndex,
    };
  }
  function buildDayMapPoints(day){ return resolveDayMapPoints(day).tuples; }
  function unmappedStops(day){ return resolveDayMapPoints(day).unresolved; }
  // The same numbers shown on the day's map pins, keyed by position in
  // toUnits(day.items) — so a stop card can show "③" and the map pin it
  // points to shows the same "3", instead of the card being unlabeled and
  // the map being the only place the order is visible.
  function dayStopNumbers(day){ return resolveDayMapPoints(day).numberByIndex; }
  // Day 1 has no legacy mapPoints at all, so the map section used to be hidden
  // outright — but its stops are real places that can be looked up, so it
  // should get a map too once they are.
  function hasMappableDay(day){
    const r = resolveDayMapPoints(day);
    return r.tuples.length > 0 || r.unresolved.length > 0;
  }
  // Status sits directly under the map, where the missing pins are visible —
  // not at the bottom of the page past every stop card, where it went unseen.
  function mapNoteHtml(day){
    const busy = state.geoBusy && state.geoBusy.dayId === day.id ? state.geoBusy : null;
    if (busy) return `<p class="mapnote">搵緊未有座標嘅地點…（${busy.done}／${busy.total}）</p>`;
    const missing = unmappedStops(day);
    if (!missing.length) return "";
    return `<p class="mapnote warn">仲有 ${missing.length} 個地點未有座標，未顯示到喺地圖度。` +
           `<button class="linkbtn" id="getmappoints">再試搵一次</button>` +
           `${state.geoProblem ? `<br><span class="geowhy">${esc(state.geoProblem)}</span>` : ""}</p>`;
  }

  // Almost every stop in this trip predates coordinates being stored at all —
  // they only ever had a Naver link. Rather than making someone hunt for a
  // button on all six days, look the missing ones up the first time a day is
  // opened. Dedup is per STOP (not per day): an earlier version remembered
  // "already swept this day" once and never looked again, so a place added
  // later — after the day had already been opened once this session — sat
  // forever with no coordinate and no map number, looking hardcoded even
  // though the resolver itself is fully dynamic. Tracking which individual
  // stops were already tried means a freshly added one is picked up on the
  // very next render, same as any other missing stop.
  async function autoGeocodeDay(day){
    if (state.geoBusy && state.geoBusy.dayId === day.id) return;   // a sweep is already running for this day
    if (!state.geoTried) state.geoTried = new WeakSet();

    const missing = unmappedStops(day).filter(s => !state.geoTried.has(s));
    if (!missing.length) return;
    missing.forEach(s => state.geoTried.add(s));

    state.geoBusy = { dayId: day.id, done: 0, total: missing.length, why: "" };
    render();

    let done = 0, why = "";
    for (const s of missing){
      const query = geocodeQuery(s);
      try {
        const r = await callAi({ action:"place-search", query });
        const p = r && r.places && r.places[0];
        if (p && Number.isFinite(p.lat) && Number.isFinite(p.lng)){
          s.lat = p.lat; s.lng = p.lng;
          if (!s.placeId) s.placeId = p.placeId;
          done++;
        } else if (r && r.ok === false){
          // the whole lookup is unavailable (no API key, quota, outage) — that
          // says nothing about this place, so don't mark it as unfindable and
          // don't burn the remaining calls; surface it and let them retry
          why = r.message || "";
          break;
        } else {
          s.noGeo = true;                  // Google really has no such place
        }
      } catch (e){ why = e.message; break; }
      if (state.geoBusy) state.geoBusy.done = done;
      render();
    }
    state.geoBusy = null;
    state.geoProblem = why;
    if (done) await saveNow(`搵返 ${done} 個地點嘅地圖座標（${day.title}）`, true);
    else render();
  }

  function normPoints(raw){
    if (!Array.isArray(raw)) return [];
    const pts = raw.map(p => {
      const lat = Array.isArray(p) ? p[0] : p?.lat;
      const lng = Array.isArray(p) ? p[1] : p?.lng;
      const name = String((Array.isArray(p) ? p[2] : p?.name) || "");
      const m = name.match(/^\s*(\d+)\s+(.*)$/);
      return {
        lat: Number(lat), lng: Number(lng),
        label: m ? m[1] : "",
        name: m ? m[2] : name
      };
    }).filter(p => Number.isFinite(p.lat) && Number.isFinite(p.lng));
    // The data numbers its own stops ("1 Artist Bakery"); anything without a
    // number is an anchor like the hotel and gets a plain dot, not a number,
    // so it can't collide with a real stop. If nothing is numbered, number them all.
    if (!pts.some(p => p.label)) pts.forEach((p,i) => { p.label = String(i+1); });
    return pts;
  }
  function mapIcon(color, label){
    if (!label) return L.divIcon({
      className:"", iconSize:[13,13], iconAnchor:[6.5,6.5],
      html:`<div class="mapnode plain" style="background:${color}"></div>`
    });
    return L.divIcon({
      className:"", iconSize:[22,22], iconAnchor:[11,11],
      html:`<div class="mapnode" style="background:${color}">${esc(label)}</div>`
    });
  }
  // a bookmarked list item, not a route stop — no polyline connects these, so
  // the pin shape has to read as "saved place" rather than "stop on a route"
  function boardPinIcon(color){
    return L.divIcon({
      className:"", iconSize:[20,20], iconAnchor:[10,20],
      html:`<div class="mapboardpin" style="background:${color}"></div>`
    });
  }
  function initDayMap(day){
    const el = document.getElementById("map-" + day.id);
    if (!el) return;
    try {
      if (typeof L === "undefined"){ el.innerHTML = `<div class="mapfallback">地圖要有網絡先載入到。</div>`; return; }
      const pts = normPoints(buildDayMapPoints(day));
      if (!pts.length){ el.innerHTML = `<div class="mapfallback">呢日仲未有地圖座標。</div>`; return; }
      const map = L.map(el, { scrollWheelZoom:false, dragging:false, tap:false, zoomControl:false, attributionControl:false });
      L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png", { maxZoom:18 }).addTo(map);
      const color = dayHex(day.id);
      const latlngs = pts.map(p => [p.lat, p.lng]);
      L.polyline(latlngs, { color, weight:4, opacity:.85 }).addTo(map);
      pts.forEach(p => L.marker([p.lat,p.lng], { icon: mapIcon(color, p.label) }).addTo(map).bindPopup(p.name || ""));
      const fit = () => { map.invalidateSize(); map.fitBounds(L.latLngBounds(latlngs).pad(0.22)); };
      fit();
      requestAnimationFrame(fit);   // the box was just inserted; re-fit once it has its real size
      el.addEventListener("click", () => { map.dragging.enable(); map.scrollWheelZoom.enable(); }, { once:true });
    } catch (e){
      el.innerHTML = `<div class="mapfallback">地圖載入唔到：${esc(e.message)}</div>`;
    }
  }
  function initOverviewMap(){
    const el = document.getElementById("map-all");
    const legend = document.getElementById("map-legend");
    if (!el) return;
    try {
    if (typeof L === "undefined"){ el.innerHTML = `<div class="mapfallback">地圖要有網絡先載入到。</div>`; return; }
    const map = L.map(el, { scrollWheelZoom:false, dragging:false, tap:false, zoomControl:false, attributionControl:false });
    L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png", { maxZoom:18 }).addTo(map);
    const all = [];
    const layers = {};
    state.snapshot.days.forEach(day => {
      const pts = normPoints(buildDayMapPoints(day));
      if (!pts.length) return;
      const color = dayHex(day.id);
      const latlngs = pts.map(p => [p.lat,p.lng]);
      const g = L.layerGroup();
      L.polyline(latlngs, { color, weight:4, opacity:.8 }).addTo(g);
      pts.forEach(p => L.marker([p.lat,p.lng], { icon: mapIcon(color, p.label) }).bindPopup(p.name||"").addTo(g));
      g.addTo(map);
      layers[day.id] = g;
      all.push(...latlngs);
    });

    // bookmarked places, shown as standalone pins — never joined by a line,
    // since they aren't a route, just a shortlist someone saved for later.
    // Off by default: this map's job is "where does the trip go", and a
    // wishlist with no date yet just clutters that up —撳 legend 先顯示.
    const boardLayerKeys = [];
    (state.snapshot.boards || []).forEach(b => {
      const pts = (b.items || []).filter(it => Number.isFinite(it.lat) && Number.isFinite(it.lng));
      if (!pts.length) return;
      const color = b.color || "#6B6FD1";
      const g = L.layerGroup();
      pts.forEach(it => L.marker([it.lat, it.lng], { icon: boardPinIcon(color) }).bindPopup(esc(plain(it.title) || "")).addTo(g));
      const key = "board:" + b.id;
      layers[key] = g;
      boardLayerKeys.push({ key, board: b });
    });

    if (all.length){
      const fit = () => { map.invalidateSize(); map.fitBounds(L.latLngBounds(all).pad(0.14)); };
      fit();
      requestAnimationFrame(fit);   // the box was just inserted; re-fit once it has its real size
    }
    el.addEventListener("click", () => { map.dragging.enable(); map.scrollWheelZoom.enable(); }, { once:true });

    if (legend){
      const dayLegend = state.snapshot.days.filter(d => layers[d.id]).map(d =>
        `<button class="badge" data-layer="${d.id}" style="cursor:pointer;border-color:${dayHex(d.id)};color:${dayHex(d.id)}">● D${d.id.replace('day','')} ${esc(d.shortTag || "")}</button>`
      ).join("");
      const boardLegend = boardLayerKeys.map(({key, board}) =>
        `<button class="badge" data-layer="${esc(key)}" style="cursor:pointer;opacity:.35;border-color:${esc(board.color)};color:${esc(board.color)}" title="撳顯示「${esc(board.name)}」呢個清單嘅地點">📌 ${esc(board.name)}</button>`
      ).join("");
      legend.innerHTML = dayLegend + boardLegend;
      legend.querySelectorAll("[data-layer]").forEach(b => b.addEventListener("click", () => {
        const g = layers[b.dataset.layer];
        if (map.hasLayer(g)){ map.removeLayer(g); b.style.opacity = ".35"; }
        else { g.addTo(map); b.style.opacity = "1"; }
      }));
    }
    } catch (e){
      el.innerHTML = `<div class="mapfallback">地圖載入唔到：${esc(e.message)}</div>`;
    }
  }

  // ==================================================================
  // RENDER + WIRING — bookmark boards
  // ==================================================================
  function boardHtml(board){
    const renaming = state.renamingBoard === board.id;
    return `
      <section class="dayhead" style="--lc:var(--bookmark)">
        <div class="kicker">
          <span class="dno">心水清單</span>
          <span class="kline"></span>
        </div>
        ${renaming
          ? `<input class="input boardname-input" id="boardname-input" value="${esc(board.name)}" placeholder="幫個清單改名…" maxlength="120">`
          : `<h2 class="boardname" id="boardname-display" title="撳一下改名">${esc(board.name || "未命名清單")}<span class="editpencil">${icon("pencil")}</span></h2>`}
        <p class="intro">呢度淨係放心水地點，未定實邊日去、邊個先去都得。撳景點卡入面嘅「搬去…」就可以擺入某一日，或者搬去另一個清單。</p>
        <p class="picker-label">呢個清單喺全程地圖上嘅顏色</p>
        <div class="colorpick" data-boardcolor>
          ${BOARD_PALETTE.map(c => `<button type="button" class="swatch${c === board.color ? " active" : ""}" data-setcolor="${c}" style="background:${c}" aria-label="改做${c}"></button>`).join("")}
        </div>
        <button class="btn wide" id="boardai" style="margin-top:11px;">${icon("sparkle")}問 AI 幫我搵「${esc(board.name)}」</button>
        <div id="boardai-out"></div>
      </section>

      ${aiLogHtml(board)}

      <div class="line" id="boardline" style="--lc:var(--bookmark)">
        ${board.items.map((s,i) => boardItemHtml(board, s, i)).join("")}
      </div>
      ${!board.items.length ? `<p class="hint">仲未有地點。撳下面「＋」自己加一個，或者去某一日嘅景點卡度撳「搬去邊度」搬過嚟，或者問AI攞主意。</p>` : ""}

      <button class="addstop" id="addboarditem">＋ 加一個地點落「${esc(board.name)}」</button>
      ${ratableCount(board.items) ? `<button class="recalc" id="getboardratings" style="margin-top:8px;">${icon("star")}攞 Google 評分／營業時間（${ratableCount(board.items)} 個地點未有）</button>` : ""}
      <button class="btn danger wide" id="delboard" style="margin-top:8px;">${icon("trash")}刪除呢個清單</button>

      <footer>
        <div class="fbrand">${esc(board.name)}</div>
        撳一下標題可以改名；撳景點卡右上角嘅筆就可以改內容或者搬去第度。
      </footer>
    `;
  }

  // AI's analysis lives above the list and ACCUMULATES:每次撳都係加多一段，
  // 唔會蓋走之前嗰啲. Stored on the board (so it's real DB data, survives a
  // reload and shows up on another phone) rather than as a throwaway panel.
  function aiLogHtml(board){
    const log = Array.isArray(board.aiLog) ? board.aiLog : [];
    if (!log.length) return "";
    // only the latest run is shown in full by default — older ones pile up
    // fast (every AI tap adds one) and showing them all expanded pushed the
    // actual place list off-screen, so they collapse to a one-line summary
    // that expands on tap, independently from any other open/edit panel
    return `
      <section class="ailog">
        <div class="ailog-head">AI 分析同建議<span class="ailog-sub">會一直記低，撳多次AI都唔會冇咗之前嘅</span></div>
        ${log.map((e, i) => {
          const key = board.id + ":" + i;
          const expanded = i === 0 || state.openLog.has(key);
          if (!expanded){
            return `
          <div class="ailog-entry collapsed" data-logtoggle="${key}">
            <div class="ailog-when">${esc(e.when || "")}<span class="ailog-caret">${icon("chevron")}</span></div>
            <div class="ailog-note">${esc(e.note || "")}</div>
          </div>`;
          }
          return `
          <div class="ailog-entry${i === 0 ? " latest" : ""}"${i === 0 ? "" : ` data-logtoggle="${key}"`}>
            <div class="ailog-when">${esc(e.when || "")}${i === 0 ? " ・ 最新一次" : `<span class="ailog-caret open">${icon("chevron")}</span>`}</div>
            ${e.analysis ? `<div class="ailog-text">${esc(e.analysis)}</div>` : ""}
            ${(e.resources || []).length ? `<div class="ailog-links">${e.resources.map(r =>
              `<a href="${esc(r.url)}" target="_blank" rel="noopener" onclick="event.stopPropagation()">${icon("link")}${esc(r.name)}${r.note ? `<small>${esc(r.note)}</small>` : ""}</a>`).join("")}</div>` : ""}
            ${e.note ? `<div class="ailog-note">${esc(e.note)}</div>` : ""}
          </div>`;
        }).join("")}
      </section>`;
  }

  // the AI already worked out which day this place is on the way for, so the
  // copy button says so up front instead of making you guess in the picker
  function suggestLabel(s){
    const d = s.suggestDayId ? dayById(s.suggestDayId) : null;
    return d ? `<small>AI 建議：${esc(d.title)}</small>` : "";
  }

  // Whether a bookmarked place already IS a stop somewhere in the itinerary,
  // and which day. Computed fresh every render (not stored) so renaming,
  // moving or deleting the stop in the itinerary is reflected here
  // automatically — there is no separate "already scheduled" flag to fall
  // out of sync, because nothing is ever written down; it's re-derived.
  function findInItinerary(snap, item){
    const pid = item.placeId;
    const terms = [loose(item.title), loose(item.kr)].filter(Boolean);
    for (const day of (snap.days || [])){
      for (const it of (day.items || [])){
        if (it.kind !== "stop") continue;
        if (pid && it.placeId && it.placeId === pid) return day;
        const itTerms = [loose(it.title), loose(it.kr)].filter(Boolean);
        if (terms.some(t => itTerms.includes(t))) return day;
      }
    }
    return null;
  }

  function boardItemHtml(board, s, i){
    const key = board.id + ":" + i;
    const open = state.open.has(key);
    const named = plain(s.title);
    const fetchable = !s.photoUrl && !s.noPhoto && (s.placeId || s.mapUrl);
    const thumb = s.photoUrl
      ? `<div class="thumb"><img src="${esc(s.photoUrl)}" alt="" loading="lazy">${Number.isFinite(s.rating) ? `<span class="thumb-rate">${icon("star")}${s.rating.toFixed(1)}</span>` : ""}</div>`
      : "";
    // only the newest AI batch is badged — otherwise every place the AI ever
    // found stays marked and the badge stops meaning "this is what just landed"
    const isFresh = s.aiRun && s.aiRun === board.aiRunLatest;
    // already scheduled beats a mere AI guess at where it might fit — if it's
    // really there, that's more useful than "AI 建議：Day X"
    const inItin = findInItinerary(state.snapshot, s);
    const chips = (isFresh ? `<span class="ainew">今次 AI 搵</span>` : "")
      + (inItin ? `<button type="button" class="inday" data-inday="${inItin.id}" style="--lc:${dayColorVar(inItin.id)}">${icon("pin")}已喺 ${esc(inItin.title)}（Day ${inItin.id.replace('day','')}）行程</button>` : "")
      + (s.niecepick||[]).map(n=>`<span class="niecepick">${esc(n)}</span>`).join("") + ratingChip(s)
      + (s.eatMeta||[]).map(c=>`<span class="${esc(c.cls)}">${esc(c.text)}</span>`).join("");
    // Same rule as the itinerary cards: a Korean trip leads with Naver.
    const bnv = destIsKorea() ? naverPlaceUrl(s) : "";
    const links = mapLinksInOrder(
      bnv ? `<a class="maplink" href="${esc(bnv)}" target="_blank" rel="noopener">${icon("map")}Naver 地圖</a>` : "",
      (() => { const g = googlePlaceUrl(s); return g
        ? `<a class="maplink" href="${esc(g)}" target="_blank" rel="noopener">${icon("pin")}Google 地圖</a>` : ""; })(),
    );
    if (s.mapUrl){
      const gr = googleReviewsUrl(s), gs = googleSearchUrl(s);
      if (gr) links.push(`<a class="maplink" href="${esc(gr)}" target="_blank" rel="noopener">${icon("star")}評論</a>`);
      if (gs) links.push(`<a class="maplink" href="${esc(gs)}" target="_blank" rel="noopener">${icon("search")}搜尋</a>`);
      const cm = customMapUrl(s);
      if (cm) links.push(`<a class="maplink" href="${esc(cm)}" target="_blank" rel="noopener">${icon("link")}自訂地圖</a>`);
    }
    { const c = copyBtnHtml(s); if (c) links.push(c); }
    if (fetchable) links.push(`<button class="maplink" data-getboardphoto="${i}">${icon("camera")}搵張相</button>`);

    return `
      <div class="unit" data-i="${i}">
        <div class="stop">
          <div class="stop-rail"><span class="node"></span></div>
          <div class="stopcard${open ? " open" : ""}${isFresh ? " freshai" : ""}">
            <div class="stopmain">
              ${thumb}
              <div class="stopbody">
                <div class="stopname ${named ? "" : "unnamed"}">${named ? esc(named) : "未改名嘅地點"}${s.kr && !named.includes(plain(s.kr)) ? `<span class="kr">${esc(plain(s.kr))}</span>` : ""}</div>
                ${descHtml(s, board.id + ":" + i)}
                ${chips ? `<div class="chiprow">${chips}</div>` : ""}
              </div>
            </div>
            <div class="cardtools">
              <button class="editbtn" data-open="${key}" title="${open ? "完成編輯" : "編輯"}" aria-label="${open ? "完成編輯" : "編輯"}">${open ? icon("check") : icon("pencil")}</button>
            </div>
            ${s.tip ? `<div class="tipbox">${esc(s.tip)}</div>` : ""}
            ${bookingBoxHtml(s)}
            ${links.length ? `<div class="stopfoot">${links.join("")}</div>` : ""}
            <button class="btn copyrow" data-copyitem="${i}">複製去某一日…${inItin ? "" : suggestLabel(s)}</button>
            ${open ? boardItemEditorHtml(board, s, i) : ""}
          </div>
        </div>
      </div>`;
  }

  function boardItemEditorHtml(board, s, i){
    return `
      <div class="editor" data-boardeditor="${i}">
        <div class="field">
          <label>名 — 打字會搵返 Google 地圖真實地點</label>
          <input class="input" data-bf="title" value="${esc(plain(s.title))}" placeholder="例如：某某市場" autocomplete="off">
          <div class="suggest" data-bsuggest></div>
        </div>
        <div class="field"><label>當地語言名</label><input class="input" data-bf="kr" value="${esc(s.kr)}" placeholder="當地語言寫法，方便搵地點"></div>
        <div class="field"><label>記低啲乜</label><textarea class="textarea" data-bf="desc" placeholder="想記低嘅嘢…">${esc(s.desc)}</textarea></div>

        <div class="field">
          <label>相片</label>
          <div>
            <button class="btn wide" data-bact="findphoto">${s.photoUrl ? "換張相" : "搵返呢度嘅相"}</button>
          </div>
        </div>

        <div class="editor-tools">
          <button class="btn" data-bact="move">搬去…</button>
          <button class="btn danger" data-bact="remove">刪走</button>

  function wireBoard(board){
    wireOpenToggles();

    const nameEl = $("#boardname-display");
    if (nameEl) nameEl.addEventListener("click", () => {
      state.renamingBoard = board.id;
      render();
      const inp = $("#boardname-input");
      if (inp){ inp.focus(); inp.select(); }
    });
    const nameInput = $("#boardname-input");
    if (nameInput){
      nameInput.focus(); nameInput.select();
      let committed = false;
      const commit = async () => {
        if (committed) return;
        committed = true;
        const v = nameInput.value.trim();
        board.name = v || "未命名清單";
        state.renamingBoard = null;
        render();
        await saveNow(`將清單改名做「${board.name}」`);
      };
      nameInput.addEventListener("keydown", e => { if (e.key === "Enter"){ e.preventDefault(); nameInput.blur(); } });
      nameInput.addEventListener("blur", commit);
    }

    const addBtn = $("#addboarditem");
    if (addBtn) addBtn.addEventListener("click", async () => {
      board.items.push(blankBoardItem());
      const idx = board.items.length - 1;
      state.open.clear();
      state.open.add(board.id + ":" + idx);
      render();
      const titleInp = document.querySelector('[data-boardeditor] [data-bf="title"]');
      if (titleInp){ titleInp.focus(); titleInp.scrollIntoView({ block:"center", behavior:"smooth" }); }
      await saveNow(`加咗一個新地點落「${board.name}」`);
    });

    const delBtn = $("#delboard");
    if (delBtn) delBtn.addEventListener("click", async () => {
      if (!confirm(`刪除成個「${board.name}」清單？入面 ${board.items.length} 個地點都會一齊冇。`)) return;
      state.snapshot.boards = (state.snapshot.boards || []).filter(b => b.id !== board.id);
      state.view = "overview";
      render();
      await saveNow(`刪除咗清單「${board.name}」`);
    });

    document.querySelectorAll("[data-boardcolor] [data-setcolor]").forEach(btn => btn.addEventListener("click", async () => {
      const c = btn.dataset.setcolor;
      if (c === board.color) return;
      board.color = c;
      render();
      await saveNow(`「${board.name}」清單改咗地圖顏色`);
    }));

    const aiBtn = $("#boardai");
    if (aiBtn) aiBtn.addEventListener("click", () => runBoardAi(board));

    // live progress for a run in flight; the finished result lives in
    // board.aiLog (rendered above the list) and in the list items themselves
    const aiOut = $("#boardai-out");
    if (aiOut && state.boardAi && state.boardAi.boardId === board.id){
      aiOut.innerHTML = aiBusyHtml(state.boardAi);
      startAiClock();
    }

    document.querySelectorAll("#boardline [data-copyitem]").forEach(btn =>
      btn.addEventListener("click", () => openCopyPicker(board, +btn.dataset.copyitem)));

    document.querySelectorAll(".ailog [data-logtoggle]").forEach(el => el.addEventListener("click", () => {
      const key = el.dataset.logtoggle;
      if (state.openLog.has(key)) state.openLog.delete(key); else state.openLog.add(key);
      render();
    }));

    document.querySelectorAll("#boardline [data-inday]").forEach(btn => btn.addEventListener("click", e => {
      e.stopPropagation();
      state.view = btn.dataset.inday;
      window.scrollTo({ top: 0, behavior: "auto" });
      render();
    }));

    const rateBtn = $("#getboardratings");
    if (rateBtn) rateBtn.addEventListener("click", async () => {
      rateBtn.disabled = true;
      rateBtn.textContent = "問緊 Google…";
      const { done, why } = await fetchRatings(board.items, board.name);
      const b2 = $("#getboardratings");
      if (b2 && !done) b2.textContent = why ? "攞唔到：" + why : "呢個清單冇再攞到新評分";
    });

    document.querySelectorAll("[data-getboardphoto]").forEach(el => el.addEventListener("click", ev => {
      ev.preventDefault();
      ev.stopPropagation();
      openPhotoPicker(board.items[+el.dataset.getboardphoto]);
    }));

    wireBoardItemEditor(board);
  }

  function wireBoardItemEditor(board){
    const box = document.querySelector("[data-boardeditor]");
    if (!box) return;
    const i = +box.dataset.boardeditor;
    const s = board.items[i];

    box.querySelectorAll("[data-bf]").forEach(el => {
      el.addEventListener("input", () => {
        s[el.dataset.bf] = el.value;
        if (el.dataset.bf === "title"){
          const nameEl = box.closest(".stopcard").querySelector(".stopname");
          if (nameEl){
            nameEl.textContent = el.value.trim() || "未改名嘅地點";
            nameEl.classList.toggle("unnamed", !el.value.trim());
          }
        }
        saveSoon("改咗「" + (plain(s.title) || "一個地點") + "」");
      });
    });

    // google place autocomplete on the name field
    const titleInput = box.querySelector('[data-bf="title"]');
    const sugBox = box.querySelector("[data-bsuggest]");
    let sugTimer = null;
    titleInput.addEventListener("input", () => {
      clearTimeout(sugTimer);
      const q = titleInput.value.trim();
      if (q.length < 2){ sugBox.innerHTML = ""; return; }
      sugTimer = setTimeout(async () => {
        sugBox.innerHTML = `<p class="hint">搵緊…</p>`;
        try {
          const r = await callAi({ action:"place-search", query:q });
          if (r.ok === false){ sugBox.innerHTML = `<p class="hint">${esc(r.message)}</p>`; return; }
          if (!r.places || !r.places.length){ sugBox.innerHTML = `<p class="hint">搵唔到，照用你打嘅名就得。</p>`; return; }
          sugBox.innerHTML = r.places.map((p,ix)=>`
            <button class="suggest-item" data-p="${ix}">
              <div class="n">${esc(p.name)}</div><div class="a">${esc(p.address)}</div>
            </button>`).join("");
          sugBox.querySelectorAll("[data-p]").forEach(b => b.addEventListener("click", async () => {
            const p = r.places[+b.dataset.p];
            // a new place: the old local name belonged to whatever was here before
            s.title = p.name; s.placeId = p.placeId; s.kr = "";
            if (Number.isFinite(p.lat)) s.lat = p.lat;
            if (Number.isFinite(p.lng)) s.lng = p.lng;
            // text search already returned these for free — no reason to make
            // the user press the separate "攞評分" button for a place they
            // just picked off Google themselves
            if (Number.isFinite(p.rating)) s.rating = p.rating;
            if (Number.isFinite(p.ratingCount)) s.ratingCount = p.ratingCount;
            s.mapUrl = `https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(p.name)}`;
            titleInput.value = p.name;
            sugBox.innerHTML = `<p class="hint">已揀「${esc(p.name)}」，搵緊相同營業時間…</p>`;
            // the local name is fetched at the moment of choosing — search
            // results only carry Google's English name
            await Promise.all([enrichHours(s), enrichPhoto(s, p.name), enrichLocalName(s)]);
            await saveNow("加咗「" + s.title + "」落「" + board.name + "」");
            render();
          }));
        } catch (e){ sugBox.innerHTML = `<p class="hint">搵唔到：${esc(e.message)}</p>`; }
      }, 420);
    });

    box.querySelectorAll("[data-bact]").forEach(btn => btn.addEventListener("click", async () => {
      const act = btn.dataset.bact;

      if (act === "close"){ state.open.clear(); render(); return; }

      if (act === "remove"){
        if (!confirm("刪走「" + (plain(s.title) || "呢個地點") + "」？")) return;
        board.items.splice(i,1);
        state.open.clear();
        render();
        await saveNow("刪走咗「" + (plain(s.title) || "一個地點") + "」");
        return;
      }

      if (act === "move"){ openMovePicker({ kind:"board", board, index:i }); return; }

      if (act === "findphoto"){ openPhotoPicker(s); return; }
    }));
  }

  // One button, one wait. Live-data topics (weather, foliage) come back as
  // pointers to real official sites instead of a guess; place topics come back
  // as names the server has already checked against Google Places, so every
  // rating shown is Google's own.
  //
  // Where the results go:
  //  · the analysis/advice is APPENDED to board.aiLog above the list, so asking
  //    again never wipes what the AI said last time;
  //  · the places themselves go to the TOP of the list, badged as this run's,
  //    because the list is where you actually work with them (the old duplicate
  //    "recommendation card" panel just repeated the same rating/booking box
  //    and its copy button did nothing the list couldn't already do).
  // ---------- "係咪死咗機" ----------
  // A 30-second wait behind one static line of text reads as a hang. This
  // shows the actual stage, a running clock and a moving bar, so it's obvious
  // work is happening — and it survives the re-renders that happen mid-run.
  const AI_STEPS = ["問緊 AI 諗地點", "去 Google 核實評分", "攞相同營業時間"];
  function aiBusyHtml(p){
    if (!p) return "";
    const steps = p.steps || AI_STEPS;
    const secs = Math.max(0, Math.round((Date.now() - (p.startedAt || Date.now())) / 1000));
    return `
      <div class="aibusy">
        <div class="aibusy-top">
          <span class="aibusy-spin"></span>
          <span class="aibusy-now">${esc(steps[p.i] || "處理緊")}${p.extra ? `　${esc(p.extra)}` : ""}</span>
          <span class="aibusy-secs mono" id="aibusy-secs">${secs}s</span>
        </div>
        <div class="aibusy-bar"><i></i></div>
        ${steps.length > 1 ? `<div class="aibusy-steps">${steps.map((s, i) =>
          `<span class="${i < p.i ? "done" : i === p.i ? "now" : ""}">${i < p.i ? icon("check") : i + 1} ${esc(s)}</span>`).join("")}</div>` : ""}
        <div class="aibusy-note">${esc(p.hint || "AI 要諗一陣，跟住仲要逐個問 Google，成個過程大約 20-40 秒。可以留喺呢版等，唔好熄咗個 app。")}</div>
      </div>`;
  }
  // paints the busy block into an element and keeps its clock running until
  // stop() — used by the sheets, which are simple one-request waits
  function busyIn(el, opts){
    const p = Object.assign({ i:0, startedAt: Date.now() }, opts || {});
    el.innerHTML = aiBusyHtml(p);
    const id = setInterval(() => {
      const s = document.getElementById("aibusy-secs");
      if (!s){ clearInterval(id); return; }
      s.textContent = Math.round((Date.now() - p.startedAt) / 1000) + "s";
    }, 1000);
    return () => clearInterval(id);
  }
  // ticks the clock in place — a full render every second would fight with
  // whatever the user is doing on the page
  function startAiClock(){
    stopAiClock();
    state.aiClock = setInterval(() => {
      const el = document.getElementById("aibusy-secs");
      const p = state.boardAi;
      if (!el || !p){ stopAiClock(); return; }
      el.textContent = Math.max(0, Math.round((Date.now() - p.startedAt) / 1000)) + "s";
    }, 1000);
  }
  function stopAiClock(){ if (state.aiClock){ clearInterval(state.aiClock); state.aiClock = null; } }

  async function runBoardAi(board){
    const out = $("#boardai-out");
    const btn = $("#boardai");
    if (!out) return;
    const label = `${icon("sparkle")}問 AI 幫我搵「${board.name}」`;
    const restore = () => { const b2 = $("#boardai"); if (b2){ b2.disabled = false; b2.textContent = label; } };
    const startedAt = Date.now();
    const setStep = (i, extra, hint) => {
      state.boardAi = i == null ? null : { boardId: board.id, i, extra: extra || "", hint: hint || "", startedAt };
      const o = $("#boardai-out");
      if (o) o.innerHTML = aiBusyHtml(state.boardAi);
      if (state.boardAi) startAiClock(); else stopAiClock();
    };
    const setStatus = (t) => {            // plain message (errors, done)
      state.boardAi = null;
      stopAiClock();
      const o = $("#boardai-out");
      if (o) o.innerHTML = t ? `<div class="ai-msg">${esc(t)}</div>` : "";
    };
    if (btn){ btn.disabled = true; btn.textContent = "問緊 AI…"; }
    setStep(0, `「${board.name}」`);

    let r;
    // Gemini and the Google lookups happen inside the one request, so the
    // second step can't be observed from here — after 15s it is almost
    // certainly past the writing part, and saying so beats a frozen "①".
    const bump = setTimeout(() => setStep(1, "", "AI 諗完之後同一個請求就會攞去 Google 逐個核實真實評分。"), 15000);
    try {
      const existingTitles = board.items.map(i => plain(i.title)).filter(Boolean);
      // stops the AI writing an almost identical "analysis" paragraph every
      // time the button is pressed — it has no memory of what it already
      // said, so hand back its own recent write-ups and it can be told not
      // to repeat them
      const priorAnalyses = (board.aiLog || []).map(e => e.analysis).filter(Boolean).slice(0, 3);
      r = await callAi({ action:"board-ai", theme: board.name, itinerary: state.snapshot, existingTitles, priorAnalyses });
    } catch (e){
      clearTimeout(bump);
      setStatus("出咗問題：" + e.message); restore(); return;
    }
    clearTimeout(bump);
    if (r.ok === false){ setStatus(r.message); restore(); return; }

    const topRated = r.topRated || [];
    const runId = "run" + Date.now();
    board.aiRunLatest = runId;

    // built first, then unshifted in one go — unshifting one at a time inside
    // the loop would reverse the server's ranking
    const newItems = topRated.map(pl => {
      const item = Object.assign(blankBoardItem(), {
        title: pl.title || "", kr: pl.kr || "", desc: pl.desc || "", tip: pl.dayHint || "",
        placeId: pl.placeId || "", rating: pl.rating, ratingCount: pl.ratingCount,
        aiRun: runId, suggestDayId: pl.dayId || "",
      });
      if (Number.isFinite(pl.lat)) item.lat = pl.lat;
      if (Number.isFinite(pl.lng)) item.lng = pl.lng;
      if (!item.mapUrl && (pl.kr || pl.title)) item.mapUrl = `https://map.naver.com/p/search/${encodeURIComponent(pl.kr || pl.title)}`;
      if (pl.isFood) Object.assign(item, { isFood: true, booking: pl.booking || "unknown", bookingHow: pl.bookingHow || "", queueNote: pl.queueNote || "" });
      return item;
    });
    board.items.unshift(...newItems);
    setStep(2, `0／${newItems.length}`);
    render();

    // one at a time meant five round trips end to end; they don't depend on
    // each other, so run them together and just count them in
    let done = 0;
    await Promise.all(newItems.map(item =>
      enrichStop(item).then(() => {           // photo + opening hours (rating already known)
        done++;
        setStep(2, `${done}／${newItems.length}`);
        render();
      }).catch(() => { done++; })));

    if (!Array.isArray(board.aiLog)) board.aiLog = [];
    board.aiLog.unshift({
      when: new Date().toLocaleString("zh-HK", { month:"numeric", day:"numeric", hour:"2-digit", minute:"2-digit" }),
      analysis: r.analysis || "",
      resources: r.resources || [],
      note: newItems.length
        ? `加咗 ${newItems.length} 個新地點喺清單最頂（AI 提咗 ${r.checked || 0} 個，Google 查到 ${r.verifiedCount || 0} 個有評分，揀返評價人數最多嗰幾個）。分數同人數係 Google 嘅數，唔係 AI 講嘅。`
        : "今次冇加到新地點——可能同清單入面已經有嘅重複咗，或者呢個題材本身唔關地點事。",
    });
    // superseded by aiLog: the old scheme stored a blob of panel HTML per board
    delete board.lastPanel;
    delete board.lastPanels;

    setStatus("");
    restore();
    render();
    await saveNow(newItems.length
      ? `AI 幫「${board.name}」搵咗 ${newItems.length} 個新地點，同埋記低咗分析`
      : `問咗 AI 關於「${board.name}」，記低咗分析`);

    const saved = [r.analysis, (r.resources||[]).map(x => `${x.name}：${x.url}`).join("\n"),
      newItems.length ? newItems.map(i => `${plain(i.title)}：評分 ${i.rating}・${i.ratingCount} 則評價`).join("\n") : ""
    ].filter(Boolean).join("\n\n");
    if (saved) saveAiNote("board", `${board.name}：AI 分析＋推介`, saved);
  }

  // ==================================================================
  // LAYERS (sheet / modal)
  // ==================================================================
  function closeLayer(){
    $("#layer").innerHTML = "";
    document.body.style.overflow = "";
    document.removeEventListener("keydown", onLayerKey);
  }
  function onLayerKey(e){ if (e.key === "Escape") closeLayer(); }
  function openSheet(inner, after){
    const layer = $("#layer");
    layer.innerHTML = `<div class="scrim" data-close></div>
      <div class="sheet" role="dialog" aria-modal="true"><div class="sheet-wide">
        <div class="grabber"></div>
        <button class="iconbtn sheet-close" data-close aria-label="收埋" title="收埋">${icon("close")}</button>
        ${inner}
      </div></div>`;
    layer.querySelectorAll("[data-close]").forEach(el => el.addEventListener("click", closeLayer));

    if (after) after(layer);
  }

  // ==================================================================
  // EXPORT — 帶走成個行程
  // ==================================================================
  // Everything lives in one Supabase row behind one link. Export exists so the
  // trip also survives on someone's phone with no signal, in a group chat, or
  // on paper — hence plain text (paste anywhere), a printable page (PDF), and
  // raw JSON (a real backup that can be restored).
  function exportText(snap){
    const L = [];
    const m = snap.meta || {};
    L.push(m.title || "我嘅行程");
    if ((m.facts || []).length) L.push((m.facts || []).join(" · "));
    L.push("");
    const stays = snap.stays || [];
    if (stays.length){
      L.push("【住宿】");
      stays.forEach(s => {
        L.push(`・${s.name || "未填"}（${stayRangeLabel(snap, s)}）`);
        if (s.desc) L.push(`  ${plain(s.desc)}`);
        if (s.hoursChip) L.push(`  ${plain(s.hoursChip)}`);
      });
      L.push("");
    }
    (snap.days || []).forEach(day => {
      L.push(`━━ Day ${String(day.id).replace("day","")} · ${day.date} · ${day.title} ━━`);
      if (day.desc) L.push(plain(day.desc));
      const st = stayForDay(snap, day);
      if (st && st.name) L.push(`呢晚住：${st.name}`);
      toUnits(day.items).forEach((u, i) => {
        if (i > 0 && u.seg){
          const t = segPlain(u.seg.html || "");
          if (t) L.push(`   ↓ ${t}`);
        }
        if (u.note){
          const t = plain(u.note.text);
          if (t) L.push(`　　備註：${t.replace(/\n/g, "\n　　   ")}`);
          return;
        }
        const s = u.stop;
        if (!s) return;
        L.push(`${plain(s.time) || "　"}　${plain(s.title)}${s.kr ? `（${plain(s.kr)}）` : ""}`);
        if (s.desc) L.push(`    ${plain(s.desc)}`);
        if (Number.isFinite(s.rating)) L.push(`    評分 ${s.rating}${s.ratingCount ? `（${s.ratingCount} 則評價）` : ""}`);
        if (s.hoursChip) L.push(`    ${plain(s.hoursChip)}`);
        (s.accessBadges || []).forEach(b => b && b.text && L.push(`    ${plain(b.text)}`));
        if (s.mapUrl) L.push(`    ${s.mapUrl}`);
        // Worth carrying on paper: standing outside a full restaurant is
        // exactly when someone is reading the printout rather than the app.
        altsOf(s).forEach(a => L.push(`    後備：${altName(a)}${a.kr ? `（${plain(a.kr)}）` : ""}${
          Number.isFinite(a.rating) ? ` 評分 ${a.rating}` : ""}`));
      });
      L.push("");
    });
    (snap.sections || []).forEach(s => {
      L.push(`【${s.title || ""}】`);
      (s.lines || []).forEach(l => L.push(`・${plain(l)}`));
      (s.links || []).forEach(l => L.push(`  ${l.name}：${l.url}`));
      L.push("");
    });
    (snap.boards || []).forEach(b => {
      if (!(b.items || []).length) return;
      L.push(`【${b.name}（心水清單，未排入行程）】`);
      b.items.forEach(it => L.push(`・${plain(it.title)}${Number.isFinite(it.rating) ? ` 評分 ${it.rating}` : ""}${it.tip ? `　${plain(it.tip)}` : ""}`));
      L.push("");
    });
    L.push(`（匯出時間：${new Date().toLocaleString("zh-HK")}）`);
    return L.join("\n");
  }

  // A brief for an AI model, not for a person: the itinerary stripped down to
  // the few facts a diagram needs (which day, what time, where, how you get
  // there), plus instructions for drawing it. Ratings, links, photos and notes
  // are left out on purpose — they are what make the chart unreadable.
  function exportAiPrompt(snap){
    const m = snap.meta || {};
    const title = plain(m.title) || "行程";
    const days = snap.days || [];
    const L = [];

    L.push("你係一個資訊圖表設計師。下面係一個已經排好嘅旅行行程，請幫我畫一張清晰易睇嘅「行程圖」。");
    L.push("");
    L.push("【要求】");
    L.push("1. 一日一欄（或者一行），由 Day 1 順住排到最後一日，唔好打亂次序。");
    L.push("2. 每一日要睇得出：日期、星期、當日主題，同埋當日由早到晚順序嘅地點。");
    L.push("3. 每個地點格淨係寫三樣嘢：時間、地點名、當地語言名（細字）。唔好加介紹、描述、評分、營業時間、地址——呢啲我特登冇俾你，因為加落去張圖就會好花。");
    L.push("4. 兩個地點之間要標返點樣過去（例如步行 10 分鐘、地鐵 20 分鐘）。");
    L.push("5. 張圖要一眼睇得曬。用色克制：一日一隻色就夠，唔好每格都唔同色，唔好加陰影同漸變。寧願疏啲、留白多啲，都好過逼到密密麻麻。字要夠大，手機睇得清楚。");
    L.push("6. 只可以用下面俾你嘅資料，唔好自己加地點、加時間、或者作任何我冇提供嘅嘢。地名要一字不改咁抄返。");
    L.push("7. 每個時段我只會俾你一個地點。如果我心目中有後備選擇，我已經抽起咗，所以唔好自己加「或者」、「二選一」呢類嘢。");
    L.push("8. 如果你識得直接生成圖片，就出一張圖；如果唔識，就出一個完整嘅單檔 HTML（inline CSS，唔使外部檔案），我自己開嚟睇同印。");
    L.push("");
    L.push("【行程資料】");
    L.push(`行程名：${title}`);
    if (m.dateStart && m.dateEnd) L.push(`日期：${m.dateStart} 至 ${m.dateEnd}（共 ${days.length} 日）`);
    if (plain(m.destinationLocal)) L.push(`目的地：${plain(m.destinationLocal)}`);
    L.push("");

    days.forEach(day => {
      const n = String(day.id).replace("day", "");
      L.push(`## Day ${n}｜${plain(day.date)}｜${plain(day.title) || "未定主題"}`);
      const st = stayForDay(snap, day);
      if (st && st.name) L.push(`住宿：${plain(st.name)}`);
      const units = toUnits(day.items);
      const stops = units.filter(u => u.stop);
      if (!stops.length){
        L.push("（呢日未排嘢）");
        L.push("");
        return;
      }
      units.forEach((u, i) => {
        if (u.note) return;          // personal reminders don't belong on a chart
        if (!u.stop) return;
        if (i > 0 && u.seg){
          const t = u.seg.text != null ? u.seg.text : segPlain(u.seg.html || "");
          if (t) L.push(`   ↓ ${t}`);
        }
        const s = u.stop;
        const time = plain(s.time) || "時間未定";
        const kr = plain(s.kr);
        // Time, name, local name — and nothing else. The descriptions are
        // paragraphs, and feeding them to a diagram is what made the last one
        // unreadable: the model dutifully printed every word. Backups are left
        // out for the same reason; the chart is the plan, not the shortlist.
        L.push(`${time}｜${plain(s.title)}${kr ? `（${kr}）` : ""}`);
      });
      L.push("");
    });
    return L.join("\n");
  }

  // The second diagram: everything on the overview that is NOT the route —
  // weather, what to wear, where you sleep, how you pay for transport, what
  // the access marks mean. It is the half of the trip nobody remembers until
  // they are standing at the airport, and it wants a reference card rather
  // than a timeline, so it gets its own brief.
  //
  // Same discipline as the itinerary prompt: hand over the facts, forbid
  // invention, and say plainly what would make the picture cluttered.
  function exportPrepPrompt(snap){
    const m = snap.meta || {};
    const L = [];
    const line = (x) => { const t = plain(x); if (t) L.push(t); };

    L.push("你係一個資訊圖表設計師。下面係我一個旅行行程嘅「出發前必讀」資料，請幫我整一張清楚易睇嘅資料卡。");
    L.push("");
    L.push("【要求】");
    L.push("1. 唔係行程表，唔好畫逐日去邊度。呢張係出發前要記住嘅嘢。");
    L.push("2. 分開幾個清楚區塊，每區一個標題：天氣、點著衫、住宿、交通、無障礙，同埋我下面有俾你嘅其他項目。冇資料嘅區塊就唔好畫。");
    L.push("3. 天氣要做一行一日：日期、日間最高、早晚最低、概況。溫差係重點，要一眼睇得出。");
    L.push("4. 點著衫同其他列點，一點一行，唔好寫成一大段。");
    L.push("5. 無障礙標記要用返綠、黃、紅三隻色，順序同我下面寫嘅一樣。");
    L.push("6. 只可以用下面俾你嘅資料。唔好自己加建議、加數字、加地點，亦都唔好自己作天氣。");
    L.push("7. 用色克制，留白要夠，字要大，手機睇得清楚。寧願疏啲都唔好逼到密密麻麻。");
    L.push("8. 如果你識得直接生成圖片，就出一張圖；如果唔識，就出一個完整嘅單檔 HTML（inline CSS，唔使外部檔案）。");
    L.push("");
    L.push("【資料】");
    L.push(`行程名：${plain(m.title) || "我嘅行程"}`);
    if (m.dateStart && m.dateEnd) L.push(`日期：${m.dateStart} 至 ${m.dateEnd}`);
    if (plain(m.destinationLocal)) L.push(`目的地：${plain(m.destinationLocal)}`);
    L.push("");

    const rows = snap.weatherRows || [];
    if (rows.length && !isSectionHidden(snap, "weather")){
      L.push(`## ${plain(weatherHeadingLabel(m)) || "天氣"}`);
      L.push("（歷年同期平均）");
      rows.forEach(r => L.push(`${plain(r.date)}｜日高 ${plain(r.hi)}｜晨低 ${plain(r.lo)}｜${plain(r.note)}`));
      L.push("");
    }

    const wear = snap.clothing || [];
    if (wear.length && !isSectionHidden(snap, "clothing")){
      L.push("## 點著衫");
      wear.forEach(c => line("・" + plain(c.html)));
      L.push("");
    }

    const stays = snap.stays || [];
    if (stays.length && !isSectionHidden(snap, "acc")){
      L.push("## 住宿");
      stays.forEach(st => {
        L.push(`${plain(stayRangeLabel(snap, st))}｜${plain(st.name) || "未填"}`);
        line("  " + plain(st.desc));
        line("  " + plain(st.hoursChip));
        line("  " + plain(st.warning));
      });
      L.push("");
    }

    const t = snap.transitInfo;
    if (t){
      L.push("## 交通");
      (t.cards || []).forEach(c => L.push(
        `${plain(c.name)}${c.kr ? `（${plain(c.kr)}）` : ""}｜${plain(c.price)}${c.pick ? "｜建議" : ""}` +
        (plain(c.good) ? `｜好處：${plain(c.good)}` : "") +
        (plain(c.bad) ? `｜要注意：${plain(c.bad)}` : "")));
      (t.fares || []).forEach(f => L.push(`${plain(f.what)}｜${plain(f.cost)}${plain(f.note) ? `｜${plain(f.note)}` : ""}`));
      if (t.arrival){
        line(`抵埗：${plain(t.arrival.title)}`);
        line(`  ${plain(t.arrival.body)}`);
      }
      L.push("");
    }

    const legend = snap.accessLegend || [];
    if (legend.length && !isSectionHidden(snap, "access")){
      L.push("## 無障礙標記");
      L.push(`綠：${plain(legend[0])}`);
      L.push(`黃：${plain(legend[1])}`);
      L.push(`紅：${plain(legend[2])}`);
      line(plain(snap.elevatorTip));
      L.push("");
    }

    if (plain(snap.foliageNote) && !isSectionHidden(snap, "foliage")){
      L.push("## 季節提示");
      L.push(plain(snap.foliageNote));
      L.push("");
    }
    if (plain(snap.scheduleSwapNote)){
      L.push("## 日程調動");
      L.push(plain(snap.scheduleSwapNote));
      L.push("");
    }

    (snap.sections || []).forEach(sec => {
      const title = plain(sec.title);
      if (!title) return;
      L.push(`## ${title}`);
      (sec.lines || []).forEach(x => line("・" + plain(x)));
      (sec.links || []).forEach(x => line(`・${plain(x.name)}：${x.url}`));
      L.push("");
    });

    return L.join("\n");
  }

  // a standalone page that prints properly — the app itself only ever shows
  // one day at a time, so printing the app would print one day
  function exportHtmlDoc(snap){
    const m = snap.meta || {};
    const dayBlocks = (snap.days || []).map(day => {
      const st = stayForDay(snap, day);
      const rows = toUnits(day.items).map((u, i) => {
        if (u.note){
          const t = plain(u.note.text);
          return t ? `<div class="note">${esc(t)}</div>` : "";
        }
        const s = u.stop;
        if (!s) return "";
        const seg = i > 0 && u.seg ? segPlain(u.seg.html || "") : "";
        return `${seg ? `<div class="seg">↓ ${esc(seg)}</div>` : ""}
          <div class="stop">
            <div class="t">${esc(plain(s.time))}</div>
            <div class="b">
              <div class="n">${esc(plain(s.title))}${s.kr ? ` <span class="kr">${esc(plain(s.kr))}</span>` : ""}</div>
              ${s.desc ? `<div class="d">${esc(plain(s.desc))}</div>` : ""}
              <div class="c">${[
                Number.isFinite(s.rating) ? `評分 ${s.rating}${s.ratingCount ? `（${s.ratingCount}）` : ""}` : "",
                plain(s.hoursChip || ""),
                ...(s.accessBadges || []).map(b => plain((b && b.text) || "")),
              ].filter(Boolean).map(x => `<span>${esc(x)}</span>`).join("")}</div>
              ${altsOf(s).length ? `<div class="alt">後備：${
                altsOf(s).map(a => esc(altName(a) + (a.kr ? `（${plain(a.kr)}）` : ""))).join("、")
              }</div>` : ""}
            </div>
          </div>`;
      }).join("");
      return `<section class="day">
          <h2>Day ${String(day.id).replace("day","")} · ${esc(day.date)} · ${esc(day.title)}</h2>
          ${day.desc ? `<p class="intro">${esc(plain(day.desc))}</p>` : ""}
          ${st && st.name ? `<p class="stay">呢晚住：${esc(st.name)}</p>` : ""}
          ${rows}
        </section>`;
    }).join("");
    const secBlocks = (snap.sections || []).map(s => `
      <section class="day"><h2>${esc(s.title || "")}</h2>
        ${s.sub ? `<p class="intro">${esc(s.sub)}</p>` : ""}
        <ul>${(s.lines || []).map(l => `<li>${esc(plain(l))}</li>`).join("")}</ul>
        ${(s.links || []).map(l => `<div class="link">${esc(l.name)}：${esc(l.url)}</div>`).join("")}
      </section>`).join("");
    const stayBlock = (snap.stays || []).length ? `
      <section class="day"><h2>住宿</h2>
        ${(snap.stays || []).map(s => `<div class="stop"><div class="t">${esc(stayRangeLabel(snap, s))}</div>
          <div class="b"><div class="n">${esc(s.name || "未填")}</div>${s.desc ? `<div class="d">${esc(plain(s.desc))}</div>` : ""}</div></div>`).join("")}
      </section>` : "";
    return `<!doctype html><html lang="zh-HK"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>${esc(m.title || "我嘅行程")}</title>
<style>
  *{box-sizing:border-box}
  body{margin:0;padding:24px 18px 60px;font:14px/1.7 -apple-system,BlinkMacSystemFont,"Noto Sans TC","PingFang HK",sans-serif;color:#16181D;background:#fff;max-width:760px;margin:0 auto;}
  h1{font-size:24px;margin:0 0 4px}
  .facts{color:#6B7280;font-size:12.5px;margin-bottom:20px}
  .day{margin-bottom:26px;page-break-inside:avoid}
  .day h2{font-size:16px;margin:0 0 6px;padding-bottom:6px;border-bottom:2px solid #16181D}
  .intro{color:#4B5563;font-size:13px;margin:0 0 8px}
  .stay{font-size:12.5px;color:#4B5563;margin:0 0 8px}
  .stop{display:flex;gap:10px;padding:7px 0;border-bottom:1px solid #ECECEC;page-break-inside:avoid}
  .stop .t{flex:none;width:66px;font-family:ui-monospace,Menlo,monospace;font-size:12px;color:#6B7280;padding-top:2px}
  .stop .n{font-weight:700}
  .stop .kr{font-weight:400;color:#6B7280;font-size:12px}
  .stop .d{color:#4B5563;font-size:12.5px;margin-top:2px}
  .stop .c{margin-top:4px;display:flex;flex-wrap:wrap;gap:4px 8px;font-size:11.5px;color:#6B7280}
  .stop .alt{margin-top:4px;font-size:11.5px;color:#6B7280}
  .seg{margin-left:76px;font-size:11.5px;color:#8A8F98;padding:2px 0}
  .note{margin-left:76px;font-size:12px;color:#4B5563;padding:5px 9px;white-space:pre-wrap;
        border-left:2px dashed #C9CDD4;background:#FAFAFA;page-break-inside:avoid}
  ul{margin:6px 0;padding-left:20px}
  li{margin-bottom:3px;font-size:13px}
