  .foot{margin-top:30px;color:#8A8F98;font-size:11.5px}
  @media print{body{padding:0}}
</style></head><body>
<h1>${esc(m.title || "我嘅行程")}</h1>
<div class="facts">${esc((m.facts || []).join(" · "))}</div>
${stayBlock}${dayBlocks}${secBlocks}
<div class="foot">匯出時間：${esc(new Date().toLocaleString("zh-HK"))}　·　營業時間同評分僅供參考，出發前請再確認。</div>
</body></html>`;
  }

  function downloadFile(name, text, type){
    const blob = new Blob([text], { type: type || "text/plain;charset=utf-8" });
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url; a.download = name;
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 4000);
  }
  function exportStamp(){
    const d = new Date();
    return `${d.getFullYear()}${String(d.getMonth()+1).padStart(2,"0")}${String(d.getDate()).padStart(2,"0")}`;
  }
  // Download filenames used to be a fixed trip name, so every trip's export
  // landed on disk under the wrong title. Strip characters that browsers or
  // filesystems mangle rather than letting a title break the download.
  function exportBase(){
    const t = plain(((state.snapshot && state.snapshot.meta) || {}).title || "").trim();
    return (t || "行程").replace(/[\\/:*?"<>|]/g, "").slice(0, 60);
  }

  function openExportSheet(){
    const snap = state.snapshot;
    openSheet(`
      <h3>匯出行程</h3>
      <p class="sec-sub">匯出係即時影一份，之後喺網頁度改嘢唔會改到已經匯出咗嘅嘢。</p>

      <div class="exgroup">
        <div class="exgroup-label">分享</div>
        <button class="btn wide" id="ex-share">${icon("link")}分享／複製呢個行程嘅連結</button>
        <p class="exhint">同一條連結，全家人都改得。裝咗落主畫面就冇咗網址列，呢度攞返。</p>
        <button class="btn wide" id="ex-share-ro">${icon("link")}分享唯讀連結（畀長輩睇，改唔到）</button>
        <p class="exhint">撳入去只睇到，冇改嘢嘅掣，唔怕佢撳亂。（唔係密碼保護：識改網址嘅人一樣改得。）</p>
      </div>

      <div class="exgroup">
        <div class="exgroup-label">畀 AI 畫圖</div>
        <button class="btn wide primary" id="ex-prompt">${icon("sparkle")}行程圖（逐日去邊度）</button>
        <p class="exhint">複製咗之後，開 ChatGPT／Claude／Gemini 貼上去，佢就會照住你個行程畫一張逐日睇嘅行程圖。指令入面已經寫明要分日、要有時間同交通、唔准自己作地點。</p>
        <button class="btn wide" id="ex-prep">${icon("sparkle")}出發前必讀（天氣・衫・住宿・交通）</button>
        <p class="exhint">主頁「行前準備」嗰啲資料嘅另一張圖：天氣溫差、點著衫、住宿、交通卡、無障礙標記。同樣唔准 AI 自己作。</p>
      </div>

      <div class="exgroup">
        <div class="exgroup-label">畀人睇</div>
        <button class="btn wide" id="ex-copy">複製成文字（貼落 WhatsApp）</button>
        <button class="btn wide" id="ex-print">開列印版（可以存做 PDF）</button>
        <button class="btn wide" id="ex-html">下載網頁檔（冇網絡都睇到）</button>
      </div>

      <div class="exgroup">
        <div class="exgroup-label">備份</div>
        <button class="btn wide" id="ex-txt">下載文字檔 .txt</button>
        <button class="btn wide" id="ex-json">下載 JSON 備份</button>
        <p class="exhint">JSON 睇落好亂，但係完整資料，可以原封不動還原成個行程。</p>
      </div>
    `, sheet => {
      // one copy helper: clipboard is blocked outside a secure context and on
      // older iOS, so always leave a selectable box behind rather than failing
      // silently on the one device someone happens to be holding
      async function copyInto(btnId, text, doneLabel){
        const btn = sheet.querySelector(btnId);
        const label = btn.innerHTML;
        try {
          await navigator.clipboard.writeText(text);
          btn.textContent = doneLabel;
          setTimeout(() => { btn.innerHTML = label; }, 2500);
        } catch (_){
          btn.insertAdjacentHTML("afterend",
            `<textarea class="textarea" rows="8" style="margin-top:8px;">${esc(text)}</textarea>`);
          btn.textContent = "揀晒下面啲字再自己複製";
        }
      }
      // Use the system share sheet where there is one — that is how a link
      // gets into WhatsApp — and fall back to the clipboard, which itself
      // falls back to a selectable box when the clipboard is blocked.
      sheet.querySelector("#ex-share").addEventListener("click", async () => {
        const url = location.href;
        const title = plain((snap.meta || {}).title) || "我嘅行程";
        if (navigator.share){
          try { await navigator.share({ title, url }); return; }
          catch (e){ if (e && e.name === "AbortError") return; }
        }
        copyInto("#ex-share", url, "複製咗連結");
      });
      sheet.querySelector("#ex-share-ro").addEventListener("click", async () => {
        const u = new URL(location.href); u.searchParams.set("view", "1");
        const url = u.toString(), title = (plain((snap.meta || {}).title) || "我嘅行程") + "（唯讀）";
        if (navigator.share){
          try { await navigator.share({ title, url }); return; }
          catch (e){ if (e && e.name === "AbortError") return; }
        }
        copyInto("#ex-share-ro", url, "複製咗唯讀連結");
      });
      sheet.querySelector("#ex-prompt").addEventListener("click", () =>
        copyInto("#ex-prompt", exportAiPrompt(snap), "複製咗，貼落 AI 度"));
      sheet.querySelector("#ex-prep").addEventListener("click", () =>
        copyInto("#ex-prep", exportPrepPrompt(snap), "複製咗，貼落 AI 度"));
      sheet.querySelector("#ex-copy").addEventListener("click", () =>
        copyInto("#ex-copy", exportText(snap), "複製咗"));
      sheet.querySelector("#ex-txt").addEventListener("click", () =>
        downloadFile(`${exportBase()}-${exportStamp()}.txt`, exportText(snap)));
      sheet.querySelector("#ex-html").addEventListener("click", () =>
        downloadFile(`${exportBase()}-${exportStamp()}.html`, exportHtmlDoc(snap), "text/html;charset=utf-8"));
      sheet.querySelector("#ex-json").addEventListener("click", () =>
        downloadFile(`${exportBase()}備份-${exportStamp()}.json`, JSON.stringify(snap, null, 2), "application/json"));
      sheet.querySelector("#ex-print").addEventListener("click", () => {
        const doc = exportHtmlDoc(snap);
        const w = window.open("", "_blank");
        if (!w){
          // pop-up blocked (common on iOS): give them the file instead of nothing
          downloadFile(`${exportBase()}-${exportStamp()}.html`, doc, "text/html;charset=utf-8");
          flash("個瀏覽器擋咗新視窗，改為下載咗，開個檔案再印");
          return;
        }
        w.document.write(doc);
        w.document.close();
        setTimeout(() => { try { w.print(); } catch (_){} }, 400);
      });
    });
  }

  // ---------- AI 建議卡（成個行程同單日都用同一套） ----------
  function changeCardsHtml(changes, notes){
    return (notes ? `<div class="ai-msg">${esc(notes)}</div>` : "") +
      changes.map((c, i) => {
        const label = c.op === "add" ? "加" : c.op === "remove" ? "刪" : "改";
        const name = (c.stop && c.stop.title) || c.matchTitle || "";
        return `<div class="ai-change" style="--lc:${dayColorVar(c.dayId)}">
          <div class="op">Day ${String(c.dayId||"").replace("day","")} · ${label}${c.stop && c.stop.time ? " · " + esc(c.stop.time) : ""}</div>
          <div class="ttl">${esc(name)}</div>
          ${c.stop && c.stop.transitBefore ? `<div class="why">${esc(c.stop.transitBefore)}</div>` : ""}
          <div class="why">${esc(c.reason||"")}</div>
          <div class="editor-tools"><button class="btn primary" data-apply="${i}">套用</button></div>
        </div>`;
      }).join("");
  }
  function wireApplyButtons(out, changes, onAll){
    // one change → one awaited apply, so "apply all" can reuse it
    async function applyOne(ab){
      const c = changes[+ab.dataset.apply];
      ab.textContent = "套用緊…"; ab.disabled = true;
      // inserts by time, then fills in photo and transit; "" means it worked
      const why = await applyAiChange(c);
      if (why){ ab.textContent = why; ab.disabled = false; return false; }
      ab.textContent = "已套用";
      return true;
    }
    out.querySelectorAll("[data-apply]").forEach(ab => ab.addEventListener("click", () => applyOne(ab)));
    const all = out.querySelector("[data-applyall]");
    if (all) all.addEventListener("click", async () => {
      all.disabled = true; all.textContent = "套用緊…";
      let n = 0;
      // Awaited one at a time. This used to fire each button 60ms apart
      // WITHOUT awaiting, so several applies mutated (and saved) the same
      // snapshot concurrently and could lose each other's edits.
      for (const btn of out.querySelectorAll("[data-apply]")){
        if (btn.disabled) continue;
        if (await applyOne(btn)) n++;
      }
      all.textContent = `已經全部套用（${n} 個）`;
      if (onAll) onAll();
    });
  }

  // A "對調" swaps every stop between two days via ordinary add/edit changes,
  // but nothing in that changes array ever touches day.title — so the header
  // kept saying the old theme after the stops underneath it were already the
  // new one. dayTitles is AI's proposed fix for that, offered as its own
  // small apply-card set separate from the stop changes.
  function dayTitleCardsHtml(dayTitles){
    const entries = Object.entries(dayTitles || {}).filter(([id, title]) => {
      const d = dayById(id);
      return d && plain(title) && plain(title) !== plain(d.title);
    });
    if (!entries.length) return "";
    return `<div class="ai-msg" style="margin-top:8px;">呢次改動令以下日子嘅主題都變埋，標題要唔要跟住改？</div>` +
      entries.map(([id, title]) => {
        const d = dayById(id);
        return `<div class="ai-change" style="--lc:${dayColorVar(id)}">
          <div class="op">Day ${id.replace("day","")} · 改標題</div>
          <div class="ttl">${esc(title)}</div>
          <div class="why">而家：「${esc(d.title || "")}」</div>
          <div class="editor-tools"><button class="btn primary" data-applytitle="${esc(id)}">套用</button></div>
        </div>`;
      }).join("");
  }
  function wireDayTitleButtons(out, dayTitles){
    out.querySelectorAll("[data-applytitle]").forEach(btn => btn.addEventListener("click", async () => {
      const id = btn.dataset.applytitle;
      const d = dayById(id);
      const title = plain(dayTitles[id] || "");
      if (!d || !title) return;
      btn.textContent = "套用緊…"; btn.disabled = true;
      d.title = title;
      render();

  // ---------- 單日 AI：淨係執呢一日 ----------
  // The all-days 「執一執行程」 is the wrong tool when you're standing on one
  // day — especially an empty one — so each day gets its own button that only
  // touches that day and is told what the other days already cover.
  // Plans several days in one AI call, not one day at a time. A one-day-at-a-

  // extra day and can't coordinate between the days it's touching (e.g. not

          sheet.querySelector(`[data-dayai-pick="${d.id}"]`)?.checked)];

        const asked = q.value.trim();

        // it stays echoed above the answer so the two read together

        } catch (e){
          stop(); out.innerHTML = askedHtml + `<div class="ai-msg">出咗問題：${esc(e.message)}</div>`;
          go.disabled = false; go.textContent = "問"; return;
        }
        stop();
        go.disabled = false; go.textContent = "再問一次";
        if (!r || r.ok === false){ out.innerHTML = askedHtml + `<div class="ai-msg">${esc((r && r.message) || "冇回覆")}</div>`; return; }
        const changes = (r.changes || []).filter(c => c && (c.stop || c.matchTitle));
        const dayTitles = r.dayTitles && typeof r.dayTitles === "object" ? r.dayTitles : {};
        const titleCards = dayTitleCardsHtml(dayTitles);
        if (!changes.length && !titleCards){
          out.innerHTML = askedHtml + `<div class="ai-msg">${esc(r.notes || "AI 覺得呢幾日唔使改。")}</div>`;
          saveAiNote("day-plan", `${label}：AI 建議`, r.notes || "冇建議");
          return;
        }
        out.innerHTML = askedHtml + changeCardsHtml(changes, r.notes) +
          (changes.length > 1 ? `<button class="btn wide primary" data-applyall style="margin-top:10px;">全部套用（${changes.length} 個）</button>` : "") +
          titleCards;
        wireApplyButtons(out, changes);
        wireDayTitleButtons(out, dayTitles);
        saveAiNote("day-plan", `${label}：AI 建議${asked ? "（" + asked + "）" : ""}`,
          [r.notes, ...changes.map(c => `【Day ${String(c.dayId||"").replace("day","")}・${c.op === "add" ? "加" : "改"}】${(c.stop && c.stop.title) || c.matchTitle || ""}（${(c.stop && c.stop.time) || ""}）\n${c.reason || ""}`)]
            .filter(Boolean).join("\n\n"));
      };
      go.addEventListener("click", run);
      q.addEventListener("keydown", e => { if (e.key === "Enter") run(); });
    });
  }

  // ==================================================================
  // ASKED / ANSWERED — its own page, so a long history stays readable
  // ==================================================================
  const AI_KIND = { weather:"天氣", foliage:"季節", ask:"問嘢", suggest:"執行程", board:"清單主題" };

  // A past day-plan answer lists its changes as 「【Day 3・加】名（約 15:30）」
  // followed by a reason. Each one becomes a button to put that place into
  // the trip (on that day, at that time), or says where it already is.
  const QA_LINE = /^【\s*Day\s*(\d+)\s*[・·]\s*(加|改)\s*】\s*(.+?)\s*(?:[（(]\s*約?\s*(\d{1,2}[:：]\d{2})\s*[)）])?\s*$/;
  function qaSuggestions(answer){
    const lines = String(answer || "").split(/\n/), out = [];
    lines.forEach((l, i) => {
      const m = l.trim().match(QA_LINE);
      if (!m) return;
      const head = m[3].replace(/<[^>]*>/g, "").replace(/\s*[（(][^）)]*[）)]\s*$/, "").trim();
      const days = state.snapshot.days || [];
      out.push({ line: i, kind: m[2], name: placeFromHead(head).name || head, region: "",
        time: m[4] ? "約 " + m[4].replace("：", ":") : "", body: (lines[i + 1] || "").trim(),
        day: (days[+m[1] - 1] || {}).id || "" });
    });
    return out;
  }
  function qaAnswerHtml(r, ri){
    const sgs = qaSuggestions(r.answer);
    if (!sgs.length) return esc(r.answer);
    const byLine = new Map(sgs.map((x, k) => [x.line, [x, k]]));
    return String(r.answer).split(/\n/).map((l, i) => {
      if (!byLine.has(i)) return esc(l);
      const [x, k] = byLine.get(i);
      const inDay = findInItinerary(state.snapshot, { title: x.name });
      const tool = inDay
        ? `<button type="button" class="usec-inday" data-inday-go="${esc(inDay.id)}" style="--lc:${dayColorVar(inDay.id)}">已喺 D${esc(inDay.id.replace("day", ""))}</button>`
        : `<button type="button" class="usec-add" data-noteadd="${ri}|${k}">${icon("plus")}加去${x.day ? " D" + esc(x.day.replace("day", "")) : "行程"}</button>`;
      return `<span class="qa-sg">${esc(l)}${tool}</span>`;
    }).join("\n");
  }
  function notesPageHtml(){
    return `
      <section class="sec" style="padding-top:24px;">
        <h2 class="sec-title">問過啲咩</h2>
        <p class="sec-sub">全家人問過 AI 嘅嘢都喺呢度，最新喺上面。撳一下睇返完整答案。</p>
        <div class="chiprow" id="note-filter"></div>
        <div id="note-list"><p class="hint">載入緊…</p></div>
      </section>`;
  }

  async function wireNotes(){
    const list = document.getElementById("note-list");
    const filter = document.getElementById("note-filter");

    try {

            </span>

          <button class="qa-del" data-notedel="${i}" title="刪走呢條紀錄" aria-label="刪走呢條紀錄">${icon("trash")}</button>

        btn.disabled = true;
        try {

          if (!res.ok) throw new Error("刪唔到 " + res.status);
          rows = rows.filter(x => x !== r);

          flash("刪咗");
        } catch (err){ btn.disabled = false; flash(err.message); }

      list.querySelectorAll("[data-noteadd]").forEach(btn => btn.addEventListener("click", e => {
        e.stopPropagation();

  // "約 20:00" / "10:30 起（睡到自然醒）" / "14:00–16:00" -> minutes since midnight
  function timeToMinutes(t){
    const m = String(t || "").match(/(\d{1,2})\s*[:：]\s*(\d{2})/);
    if (!m) return null;
    const h = +m[1], mi = +m[2];
    return (h > 23 || mi > 59) ? null : h * 60 + mi;
  }
  // where a stop belongs in the day, by its own time
  function slotForTime(units, time){
    const t = timeToMinutes(time);
    if (t == null) return units.length;
    for (let i = 0; i < units.length; i++){
      const ot = timeToMinutes(units[i].stop && units[i].stop.time);
      if (ot != null && ot > t) return i;
    }
    return units.length;
  }

  // A stop the AI invented has only a name. Find the real place behind it so it
  // gets a photo, a map link, and coordinates good enough to route from.
  async function enrichStop(s){
    const name = plain(s.title);
    if (!name) return;
    // Already resolved to a specific Google place (e.g. the server verified
    // this pick by its Korean name) — searching again by the Chinese title can
    // land on a different place and overwrite good coordinates and a real
    // rating with another shop's. Keep what we have; just get the photo.
    if (s.placeId){ await enrichHours(s); return enrichPhoto(s, name); }
    try {
      const r = await callAi({ action:"place-search", query:name });
      const p = r && r.places && r.places[0];
      if (p){
        s.placeId = p.placeId;
        if (Number.isFinite(p.lat)) s.lat = p.lat;
        if (Number.isFinite(p.lng)) s.lng = p.lng;
        if (!s.mapUrl) s.mapUrl = `https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(p.name)}`;
        // text search carries the rating already — no extra request for it
        if (Number.isFinite(p.rating)) s.rating = p.rating;
        if (Number.isFinite(p.ratingCount)) s.ratingCount = p.ratingCount;
      }
    } catch (_){}
    await enrichHours(s);
    return enrichPhoto(s, name);
  }

  // Opening hours for a newly-found place — unlike the booking/queue
  // impression on a picks card, Google Places actually has this as real
  // structured data, so it's fetched the same way the rating is.
  //
  // Gated on "does it already have an hours chip" rather than a separate
  // done-flag: a done-flag set before the request (to avoid asking twice)
  // used to get stuck permanently true on a transient failure — network
  // hiccup, edge function timeout under concurrent load — leaving that one
  // place with no hours forever, with no way to retry, while its siblings
  // fetched fine. Re-deriving from the chip means a later retry (the
  // ratings button, or another AI run touching the place) just tries again.
  // Places found through the app's own search came back with Google's English
  // name only, so they had no local name — no Naver search in it, no copy
  // button. Fill it from Google in the destination's language. Only a name
  // actually written in that script is kept, so a failed lookup or an English
  // echo never lands in the field.
  async function enrichLocalName(s){
    if (!s.placeId || plain(s.kr)) return false;
    const lang = destIsKorea() ? "ko" : destIsJapan() ? "ja" : "";
    if (!lang) return false;
    try {
      const res = await fetch(SUPABASE_URL + "/functions/v1/place-local-name", {
        method:"POST", headers: Object.assign({ "Content-Type":"application/json" }, sbHeaders()),
        body: JSON.stringify({ placeId: s.placeId, lang }),
      });
      const r = await res.json();
      const n = r && r.ok !== false && plain(r.name || "");
      if (n && /[\uAC00-\uD7A3\u3040-\u30FF\u4E00-\u9FFF]/.test(n)){ s.kr = n; return true; }
    } catch (_){}
    return false;
  }
  async function enrichHours(s){
    if (!s.placeId) return;
    if ((s.eatMeta || []).some(c => c.cls === "meta-chip hours")) return;
    try {
      const r = await callAi({ action:"place-hours", placeId:s.placeId });
      if (r && r.ok !== false && r.summary){
        s.eatMeta = (s.eatMeta || []).filter(c => c.cls !== "meta-chip hours");
        s.eatMeta.push({ text:r.summary, cls:"meta-chip hours" });
      }
      // raw per-weekday lines, kept separately from the summarized chip text
      // so stopClosedOnDay() can check a specific weekday later without
      // re-parsing the (possibly grouped/summarized) display string
      if (r && r.ok !== false && Array.isArray(r.weekdayText)) s.weekdayText = r.weekdayText;
    } catch (_){}
  }

  // day.date is a hand-authored "10月24日（六）" string — the weekday
  // character in the brackets is the only source of truth we have for which
  // day of the week a day slot falls on, so pull it from there.
  function weekdayCharOfDate(dateStr){
    const m = String(dateStr || "").match(/[（(]([一二三四五六日天])[)）]/);
    if (!m) return null;
    return m[1] === "天" ? "日" : m[1];
  }
  // Cross-references a stop's Google-verified weekly hours against the
  // weekday its day slot actually falls on — this is exactly the kind of
  // mismatch that caused the Deoksugung Monday-closure conflict earlier in
  // this trip's planning, so it's worth flagging automatically on every stop
  // rather than relying on someone remembering to check by hand.
  // The weekly summary answers "which days", but standing there you want
  // "what about today" — so the card also shows the line for this day's
  // weekday. A closed day is already flagged by stopClosedOnDay.
  // A week of 「星期二、星期三…星期日：16:00 – 00:00；星期一：休息」 is
  // seven lines to say one thing, so it is boiled down to the usual hours
  // and the exceptions: 「16:00–00:00（星期一休息）」.
  function hoursWeek(s){
    if (!Array.isArray(s.weekdayText) || !s.weekdayText.length) return null;
    const by = {};
    s.weekdayText.forEach(l => {
      const m = String(l).match(/^星期([一二三四五六日天])\s*[:：]\s*(.*)$/);
      if (!m) return;
      const h = m[2].replace(/\s*[–-]\s*/g, "–").trim();
      by[m[1] === "天" ? "日" : m[1]] = !h || /休息|公休|closed/i.test(h) ? "" : h;
    });
    const days = Object.keys(by);
    if (!days.length) return null;
    const count = {};
    days.forEach(d => { if (by[d]) count[by[d]] = (count[by[d]] || 0) + 1; });
    const main = Object.keys(count).sort((a, b) => count[b] - count[a])[0] || "";
    const groups = {};
    "一二三四五六日".split("").filter(d => d in by && by[d] !== main).forEach(d => { (groups[by[d]] = groups[by[d]] || []).push(d); });
    const ex = Object.keys(groups).map(h => `星期${groups[h].join("、")}${h ? " " + h : "休息"}`);
    return { by, main, ex, every: !ex.length && days.length === 7 };
  }
  function dayHoursChip(s, day){
    if (!day || stopClosedOnDay(s, day)) return [];
    const w = hoursWeek(s);
    if (!w || !w.main) return [];
    const wd = weekdayCharOfDate(day.date);
    const today = wd && (wd in w.by) ? w.by[wd] : null;
    let txt;
    if (w.every) txt = `每日 ${w.main}`;
    else if (today && today !== w.main) txt = `呢日 ${today}（平時 ${w.main}）`;
    else txt = `${today ? "呢日 " : ""}${w.main}（${w.ex.join("；")}）`;
    return [`<span class="meta-chip hours today">${icon("clock")}${esc(txt)}</span>`];
  }
  // "You arrive at 19:00 and it shuts at 18:00" — read from Google's own
  // hours for that weekday against the stop's planned time.
  function hoursClashChip(s, day){
    const t = clockMin(s.time);
    if (t == null || !Array.isArray(s.weekdayText) || !day) return [];
    const wd = weekdayCharOfDate(day.date);
    const line = wd && s.weekdayText.find(l => l.startsWith(`星期${wd}`));
    if (!line) return [];
    const txt = line.slice(line.indexOf(":") + 1);
    if (/24\s*小時|24 hours/i.test(txt)) return [];
    const ranges = [...txt.matchAll(/(\d{1,2})[:：](\d{2})\s*[–\-~至到]\s*(\d{1,2})[:：](\d{2})/g)]
      .map(m => { const o = +m[1] * 60 + +m[2]; let c = +m[3] * 60 + +m[4]; if (c <= o) c += 1440; return [o, c]; });
    if (!ranges.length) return [];
    if (ranges.some(([o, c]) => t >= o && t <= c - 30)) return [];
    const near = ranges.find(([o, c]) => t > c - 30 && t <= c);
    if (near) return [`<span class="meta-chip closed">${icon("warn")}你約 ${esc(fmtMin(t))} 到，${esc(fmtMin(near[1]))} 就關門，得返 ${near[1] - t} 分鐘</span>`];
    const later = ranges.filter(([o]) => o > t).sort((a, b) => a[0] - b[0])[0];
    if (later) return [`<span class="meta-chip closed">${icon("warn")}你約 ${esc(fmtMin(t))} 到，佢 ${esc(fmtMin(later[0]))} 先開</span>`];
    const lastClose = Math.max(...ranges.map(r => r[1]));
    return [`<span class="meta-chip closed">${icon("warn")}你約 ${esc(fmtMin(t))} 到，佢 ${esc(fmtMin(lastClose))} 已經關門</span>`];
  }
  function stopClosedOnDay(s, day){
    if (!Array.isArray(s.weekdayText) || !s.weekdayText.length) return false;
    const wd = weekdayCharOfDate(day.date);
    if (!wd) return false;
    const line = s.weekdayText.find(l => l.startsWith(`星期${wd}`));
    if (!line) return false;
    const idx = line.indexOf(":");
    const hoursText = idx < 0 ? "" : line.slice(idx + 1).trim();
    return !hoursText || /休息|公休|closed/i.test(hoursText);
  }

  async function enrichPhoto(s, name){
    if (s.photoUrl) return;
    try {
      const pr = await fetchStoredPhoto(s);
      if (pr && pr.ok !== false && pr.url) s.photoUrl = pr.url;
    } catch (_){}
  }

  // Google has no API for reservation/queue info, so this is always the
  // model's own impression — never treat it with the same confidence as the
  // Google-verified rating chip.
  const BOOKING_LABEL = { online:"可網上／App 預約", phone:"只可電話訂位", walkin:"冇預約，現場排隊" };
  function bookingBoxHtml(s){
    if (!s.isFood) return "";
    const parts = [];
    if (BOOKING_LABEL[s.booking]) parts.push(esc(BOOKING_LABEL[s.booking]));
    if (plain(s.bookingHow)) parts.push(esc(plain(s.bookingHow)));
    if (plain(s.queueNote)) parts.push(esc(plain(s.queueNote)));
    if (!parts.length) return "";
    return `<div class="bookbox"><b>訂位／排隊</b>${parts.join("<br>")}<span class="warnline">${icon("warn")}AI 印象・未經核實，出發前建議自己再確認</span></div>`;
  }

  // Google's own numbers, not something we wrote
  function ratingChip(s){
    if (!Number.isFinite(s.rating)) return "";
    const count = Number.isFinite(s.ratingCount) ? `（${s.ratingCount.toLocaleString("en-US")}）` : "";
    return `<span class="meta-chip rating">${icon("star")}<b>${s.rating.toFixed(1)}</b>${count}</span>`;
  }
  // fills in ratings for everything on screen that Google can identify
  async function fetchRatings(items, label){
    const todo = items.filter(s => !Number.isFinite(s.rating) && !s.noRating && (s.placeId || s.mapUrl) && plain(s.title));
    if (!todo.length) return { done:0, why:"" };
    let done = 0, why = "";
    for (const s of todo){
      try {
        const r = await callAi(s.placeId ? { action:"place-rating", placeId:s.placeId }
                                         : { action:"place-rating", query:(plain(s.kr) || plain(s.title)) });
        if (r && r.ok !== false && Number.isFinite(r.rating)){
          s.rating = r.rating;
          if (Number.isFinite(r.ratingCount)) s.ratingCount = r.ratingCount;
          if (!s.placeId && r.placeId) s.placeId = r.placeId;
          done++;
        } else {
          s.noRating = true;                       // Google has no rating for it; stop asking
          if (r && r.message) why = r.message;
        }
      } catch (e){ why = e.message; }
      // same button, same trip — while we're already asking Google about this
      // place, grab its opening hours too instead of making the user find a
      // separate way to trigger that
      if (s.placeId){
        try { await enrichHours(s); } catch (_){}
      }
      render();
    }
    if (done) await saveNow(`攞咗 ${done} 個地點嘅 Google 評分（${label}）`, true);
    return { done, why };
  }

  // The AI names a stop in its own words — "北村韓屋村" for a card actually
  // titled "北村韓屋村（平緩觀景點）". Exact matching silently dropped those,
  // so fall back to a looser comparison before giving up.
  function loose(s){
    return plain(s)
      .replace(/[（(][^）)]*[）)]/g, "")   // drop parentheticals
      .replace(/[\s・·、，,.。~〜\-–—]/g, "")
      .toLowerCase();
  }
  function findStopIndex(units, title){
    const want = plain(title), wantLoose = loose(title);
    if (!want) return -1;
    let ix = units.findIndex(u => u.stop && plain(u.stop.title) === want);
    if (ix >= 0) return ix;
    if (!wantLoose) return -1;
    ix = units.findIndex(u => u.stop && loose(u.stop.title) === wantLoose);
    if (ix >= 0) return ix;
    // one name contains the other, e.g. "Mil Toast House" vs "Mil Toast House 益善洞"
    const hits = units.map((u,i) => [u,i]).filter(([u]) => {
      if (!u.stop) return false;
      const got = loose(u.stop.title);
      return got && (got.includes(wantLoose) || wantLoose.includes(got));
    });
    return hits.length === 1 ? hits[0][1] : -1;   // ambiguous is as bad as missing
  }

  // returns "" when applied, otherwise a reason to show on the button
  async function applyAiChange(c){
    const day = dayById(c.dayId);
    if (!day) return `搵唔到 ${c.dayId || "嗰一日"}`;
    const units = toUnits(day.items);

    if (c.op === "add" && c.stop){
      const stop = Object.assign(blankStop(), c.stop, { kind:"stop" });
      delete stop.transitBefore;          // describes a leg we are about to recompute
      // drop it in by time rather than at the end, so the day still reads in order
      const at = slotForTime(units, stop.time);
      units.splice(at, 0, { seg: null, stop });
      day.items = fromUnits(units);
      render();
      await enrichStop(stop);
      day.items = fromUnits(units);
      render();
      await saveNow(c.reason || `加咗「${plain(stop.title) || "一個地點"}」`);
      // the AI's own travel note assumed a different neighbour; ask Google instead
      await refreshTransit(day, [at, at + 1]);
      return "";
    }

    if (c.op === "remove" && c.matchTitle){
      const ix = findStopIndex(units, c.matchTitle);
      if (ix < 0) return `搵唔到「${plain(c.matchTitle)}」`;
      units.splice(ix,1);
      day.items = fromUnits(units);
      render();
      await saveNow(c.reason || `刪走咗「${plain(c.matchTitle)}」`);
      await refreshTransit(day, [ix]);
      return "";
    }

    if (c.op === "edit" && c.matchTitle && c.stop){
      const ix = findStopIndex(units, c.matchTitle);
      if (ix < 0) return `搵唔到「${plain(c.matchTitle)}」`;
      const before = units[ix].stop.time;
      const wasNamed = plain(units[ix].stop.title);
      Object.assign(units[ix].stop, c.stop, { kind:"stop" });
      delete units[ix].stop.transitBefore;
      let at = ix;
      if (timeToMinutes(units[ix].stop.time) !== timeToMinutes(before)){
        const [moved] = units.splice(ix, 1);          // time changed, so its slot may have too
        at = slotForTime(units, moved.stop.time);
        units.splice(at, 0, moved);
      }
      day.items = fromUnits(units);
      render();
      // renamed to a different place, so its photo and coordinates are stale too
      if (plain(units[at].stop.title) !== wasNamed){
        units[at].stop.photoUrl = ""; units[at].stop.placeId = "";
        await enrichStop(units[at].stop);
        day.items = fromUnits(units);
        render();
      }
      await saveNow(c.reason || `改咗「${plain(c.matchTitle)}」`);
      // a moved stop leaves two broken legs behind it and one in front
      if (at !== ix) await refreshTransit(day, [Math.min(ix, at), Math.max(ix, at), Math.max(ix, at) + 1]);
      return "";
    }

    day.items = fromUnits(units);
    render();
    return "呢個建議睇唔明，冇改到行程";
  }

  // ==================================================================
  // NEW-TRIP GENERATION — turns a blank day skeleton (from index.html)
  // into a real itinerary by calling day-plan repeatedly.
  //
  // This does NOT reuse the interactive "套用晒" loop (wireApplyButtons
  // above): that loop fires each applyAiChange() 60ms apart without
  // awaiting it, which is fine for the few changes a manual AI suggestion
  // produces, but for a from-scratch multi-day trip (dozens of stops) it
  // means dozens of overlapping, un-awaited saveNow() calls — a real
  // lost-update race, not just noisy history. batchApplyChunk() instead
  // merges a whole day-plan response into memory first, enriches the new
  // stops with bounded concurrency, then saves once for the whole chunk.
  // ==================================================================

  // Splices every "add" change into its day's items (in memory, no
  // render/save yet) and returns the list of newly-inserted stop objects
  // so the caller can enrich/save them as one batch.
  function mergeChangesIntoDays(changes){
    const touched = new Map();   // dayId -> { day, units, newStops[] }
    (changes || []).forEach(c => {
      if (c.op !== "add" || !c.stop) return;   // a blank day only ever gets "add"s
      const day = dayById(c.dayId);
      if (!day) return;
      if (!touched.has(day.id)) touched.set(day.id, { day, units: toUnits(day.items), newStops: [] });
      const rec = touched.get(day.id);
      const stop = Object.assign(blankStop(), c.stop, { kind:"stop" });
      delete stop.transitBefore;   // describes a leg we're about to compute for real
      const at = slotForTime(rec.units, stop.time);
      rec.units.splice(at, 0, { seg:null, stop });
      rec.newStops.push(stop);
    });
    touched.forEach(rec => { rec.day.items = fromUnits(rec.units); });
    return touched;
  }
  function applyDayTitles(dayTitles){
    Object.entries(dayTitles || {}).forEach(([id, title]) => {
      const d = dayById(id);
      if (d && title) d.title = title;
    });
  }
  // Runs `fn` over `items` with at most `n` in flight at once — enrichStop
  // makes 2-3 edge-function calls each, so a fresh day's worth done fully
  // in parallel would fan out into dozens of concurrent requests at once.
  async function runBounded(items, n, fn){
    for (let i = 0; i < items.length; i += n){
      await Promise.all(items.slice(i, i + n).map(x => fn(x).catch(() => {})));
    }
  }
  async function batchApplyChunk(changes, summary){
    const touched = mergeChangesIntoDays(changes);
    if (!touched.size) return;
    render();
    const allNew = [...touched.values()].flatMap(r => r.newStops);
    await runBounded(allNew, 4, enrichStop);
    render();
    for (const { day, units } of touched.values()){
      const idxs = units.map((u, i) => i).filter(i => units[i].stop);
      await refreshTransit(day, idxs);   // recomputes every leg + renders + saves
    }
    await saveNow(summary);
  }

  // One chunk of blank days -> one day-plan call -> merged in. Retries a
  // TRUNCATED response (the model's JSON got cut off) by splitting the
  // chunk in half rather than giving up outright — this is genuinely new
  // territory for day-plan's prompt (every requested day blank at once,
  // not the usual "fill a gap or two"), so an oversized response is the
  // expected failure mode to guard against, not an edge case.
  // `edges` flags whether this chunk contains the trip's very first/last
  // day — day-plan's own baked-in prompt has no notion of "this is day
  // one" or "this is the last day", so a from-scratch generation happily
  // filled the last day right up to bedtime with no time left to actually
  // reach the airport. Spelling it out here (client-side, via `question`)
  // fixes that without touching the shared day-plan prompt every other
  // caller also uses (which usually isn't planning a trip's bookend days).
  async function generateDaysChunk(dayIds, onProgress, edges){
    if (!dayIds.length) return;
    const label = dayIds.map(id => (dayById(id) || {}).title || id).join("、");
    onProgress && onProgress(`AI 諗緊「${label}」…`);
    const notes = [];
    if (edges && edges.first) notes.push("呢批入面有成個行程嘅第一日：一定要留返啱啱抵達目的地嘅安排（例如「抵達機場／車站」、「前往酒店」），唔好一開波就當人已經喺市中心。");
    if (edges && edges.last) notes.push("呢批入面有成個行程嘅最尾一日：一定要預留返足夠時間去機場——最後一個站要係「前往機場」或者類似安排，之前嗰個站要預至少2-3個鐘畀退房／去機場／辦理登機，唔可以行程排到好夜先冇處理返程。");
    let r;
    try {
      r = await callAi({ action:"day-plan", dayIds, question: notes.join("\n"), itinerary: state.snapshot });
    } catch (e){
      r = { ok:false, message: e.message };
    }
    if (r && r.ok !== false && Array.isArray(r.changes)){
      await batchApplyChunk(r.changes, `AI 生成咗「${label}」`);
      if (r.dayTitles) applyDayTitles(r.dayTitles);
      render();
      return;
    }
    const msg = (r && r.message) || "";
    if (dayIds.length > 1 && /太長|截斷/.test(msg)){
      const mid = Math.ceil(dayIds.length / 2);
      const firstHalf = dayIds.slice(0, mid), secondHalf = dayIds.slice(mid);
      await generateDaysChunk(firstHalf, onProgress, { first: edges && edges.first, last: edges && edges.last && !secondHalf.length });
      await generateDaysChunk(secondHalf, onProgress, { first: false, last: edges && edges.last });
      return;
    }
    onProgress && onProgress(`「${label}」生成失敗：${msg || "未知錯誤"}（可以之後入返嗰日撳「AI 諗行程」補返）`);
  }
  // Sequential, not parallel: each chunk's itinerary payload must include
  // the previous chunk's already-generated stops, so day-plan's own
  // cross-day dedup ("呢個地方已經去緊 elsewhere") actually sees them.
  // Generates a specific set of days, chunked. Shared by the brand-new-trip
  // flow and by "the dates grew, fill in the days that appeared".
  async function generateDaysFor(dayIds, onProgress){
    const days = state.snapshot.days;
    const ids = dayIds.filter(id => dayById(id));
    if (!ids.length) return;
    const firstId = days[0] && days[0].id;
    const lastId = days[days.length - 1] && days[days.length - 1].id;
    const CHUNK = 3;
    for (let i = 0; i < ids.length; i += CHUNK){
      const chunk = ids.slice(i, i + CHUNK);
      await generateDaysChunk(chunk, onProgress, { first: chunk.includes(firstId), last: chunk.includes(lastId) });
    }
  }
  async function generateTripFromScratch(onProgress){
    const blankDayIds = state.snapshot.days.filter(d => !(d.items || []).length).map(d => d.id);
    return generateDaysFor(blankDayIds, onProgress);
  }

  // ---------- human-readable version comparison ----------
  // A raw JSON diff is unreadable (photo URLs, HTML blobs, coordinates all
  // shift line numbers around). Compare what a reader actually cares about:
  // which stop was added/removed/changed, day by day.
  function stopKey(s){ return plain(s && s.title) || ""; }

  function summarizeItemsDiff(oldItems, newItems){
    const oldStops = (oldItems||[]).filter(i => i.kind === "stop");
    const newStops = (newItems||[]).filter(i => i.kind === "stop");
    const oldByKey = new Map();
    oldStops.forEach(s => { const k = stopKey(s); if (k && !oldByKey.has(k)) oldByKey.set(k, s); });
    const newByKey = new Map();
    newStops.forEach(s => { const k = stopKey(s); if (k && !newByKey.has(k)) newByKey.set(k, s); });

    const lines = [];
    newStops.forEach(s => {
      const k = stopKey(s);
      if (k && !oldByKey.has(k)) lines.push({ type:"add", text:`＋ 加咗「${k}」${plain(s.time) ? `（${plain(s.time)}）` : ""}` });
    });
    oldStops.forEach(s => {
      const k = stopKey(s);
      if (k && !newByKey.has(k)) lines.push({ type:"remove", text:`－ 刪咗「${k}」` });
    });
    newByKey.forEach((s, k) => {
      const o = oldByKey.get(k);
      if (!o) return;
      const changes = [];
      if (plain(o.time) !== plain(s.time)) changes.push(`時間 ${plain(o.time) || "未定"} → ${plain(s.time) || "未定"}`);
      if (plain(o.desc) !== plain(s.desc)) changes.push("改咗描述");
      if ((o.photoUrl||"") !== (s.photoUrl||"")) changes.push(o.photoUrl ? "換咗相" : "加咗相");
      if ((o.mapUrl||"") !== (s.mapUrl||"") && o.mapUrl && s.mapUrl) changes.push("地圖連結有更新");
      if (changes.length) lines.push({ type:"edit", text:`「${k}」：${changes.join("、")}` });
    });
    // did the common stops change relative order?
    const commonOld = oldStops.map(stopKey).filter(k => k && newByKey.has(k));
    const commonNew = newStops.map(stopKey).filter(k => k && oldByKey.has(k));
    if (commonOld.length > 1 && commonOld.join("|") !== commonNew.join("|")){
      lines.push({ type:"reorder", text:"次序調整咗" });
    }
    return lines;
  }

  function summarizeSnapshotDiff(oldSnap, newSnap){
    const sections = [];
    const oldDaysById = new Map((oldSnap.days||[]).map(d => [d.id, d]));
    (newSnap.days||[]).forEach(nd => {
      const od = oldDaysById.get(nd.id);
      const lines = summarizeItemsDiff(od ? od.items : [], nd.items);
      if (lines.length) sections.push({ label: `Day ${nd.id.replace('day','')} · ${nd.title}`, lines });
    });
    (oldSnap.days||[]).forEach(od => {
      if (!(newSnap.days||[]).some(nd => nd.id === od.id)){
        sections.push({ label: `Day ${od.id.replace('day','')} · ${od.title}`, lines:[{ type:"remove", text:"－ 成日行程被刪走咗" }] });
      }
    });

    const oldBoards = oldSnap.boards || [], newBoards = newSnap.boards || [];
    const oldBoardsById = new Map(oldBoards.map(b => [b.id, b]));
    newBoards.forEach(nb => {
      const ob = oldBoardsById.get(nb.id);
      const asStops = items => items.map(i => ({ ...i, kind:"stop" }));
      if (!ob){
        sections.push({ label:nb.name, lines:[{ type:"add", text:`＋ 開咗個新清單，入面 ${nb.items.length} 個地點` }] });
        return;
      }
      const lines = [];
      if (ob.name !== nb.name) lines.push({ type:"edit", text:`改咗名：「${ob.name}」→「${nb.name}」` });
      lines.push(...summarizeItemsDiff(asStops(ob.items), asStops(nb.items)));
      if (lines.length) sections.push({ label:nb.name, lines });
    });
    oldBoards.forEach(ob => {
      if (!newBoards.some(nb => nb.id === ob.id)) sections.push({ label:ob.name, lines:[{ type:"remove", text:"－ 成個清單被刪走咗" }] });
    });

    // The home page is editable too, so a version whose ONLY change is up there
    // would otherwise diff as "冇分別" and look like a save that did nothing.
    const homeLines = [];
    const changed = (label, a, b) => {
      const sa = JSON.stringify(a ?? ""), sb = JSON.stringify(b ?? "");
      if (sa !== sb) homeLines.push({ type:"edit", text:`改咗${label}` });
    };
    changed("標題", (oldSnap.meta||{}).title, (newSnap.meta||{}).title);
    changed("標題下面嘅資料", [(oldSnap.meta||{}).eyebrow, (oldSnap.meta||{}).facts, (oldSnap.meta||{}).hotelTags],
                              [(newSnap.meta||{}).eyebrow, (newSnap.meta||{}).facts, (newSnap.meta||{}).hotelTags]);
    changed("住宿", oldSnap.stays || oldSnap.accommodation, newSnap.stays || newSnap.accommodation);
    changed("天氣", oldSnap.weatherRows, newSnap.weatherRows);
    changed("穿搭建議", oldSnap.clothing, newSnap.clothing);
    changed("無障礙標記", [oldSnap.accessLegend, oldSnap.elevatorTip], [newSnap.accessLegend, newSnap.elevatorTip]);
    changed("季節提示", oldSnap.foliageNote, newSnap.foliageNote);
    changed("日程調動", oldSnap.scheduleSwapNote, newSnap.scheduleSwapNote);
    changed("AI 設定", oldSnap.tripBrief, newSnap.tripBrief);
    changed("首頁隱藏咗嘅段落", oldSnap.hiddenSections, newSnap.hiddenSections);
    // custom sections are named, so say WHICH one instead of "改咗自己加嘅資料"
    {
      const byTitle = list => new Map((list || []).map(s => [String(s.title || "未命名"), JSON.stringify(s)]));
      const a = byTitle(oldSnap.sections), b = byTitle(newSnap.sections);
      b.forEach((v, k) => {
        if (!a.has(k)) homeLines.push({ type:"add", text:`加咗 section「${k}」` });
        else if (a.get(k) !== v) homeLines.push({ type:"edit", text:`改咗 section「${k}」` });
      });
      a.forEach((_, k) => { if (!b.has(k)) homeLines.push({ type:"remove", text:`刪咗 section「${k}」` }); });
    }
    if (homeLines.length) sections.push({ label:"首頁內容", lines: homeLines });

    return sections;
  }

  // Reuses board-ai (same "propose places, verify via Google, rank by

  async function recommendAccommodation(onProgress){
    if ((state.snapshot.stays || []).length) return;

    // the 住宿 section offers 「叫 AI 建議」, which opens the questions.

  // The fixed "10 月下旬天氣" block wants real historical-average numbers,
  // which nobody has for an arbitrary new destination — rather than fabricate
  // figures (this app's rule everywhere else: don't invent numbers), the
  // destination-relevant weather/clothing guidance instead becomes a proper
  // AI-authored section (same make-section action the "手信買咩好" style
  // custom sections already use), which persists and already has its own
  // topic-based refresh built in.
  // Fills the 天氣 table with the REAL forecast rather than leaving it blank
  // (or, worse, asking the model to invent temperatures — the whole app's rule
  // is that numbers come from a real source). Open-Meteo only forecasts ~16
  // days out, so anything past that is left for the user to check later.
  // Open-Meteo's daily block, as the 天氣 table wants it. Shared by the first
  // fill and by the live re-check, so the two can never drift apart.
  function weatherRowsFromDaily(daily){
    if (!daily || !Array.isArray(daily.time) || !daily.time.length) return [];
    return daily.time.map((iso, i) => {
      const hi = daily.temperature_2m_max?.[i], lo = daily.temperature_2m_min?.[i];
      const rain = daily.precipitation_probability_max?.[i];
      const d = isoToUtc(iso);
      return {
        date: `${d.getUTCMonth() + 1}/${d.getUTCDate()}`,
        hi: hi == null ? "" : `${Math.round(hi)}°`,
        lo: lo == null ? "" : `${Math.round(lo)}°`,
        note: rain == null ? "" : `降雨機率 ${rain}%`,
      };
    });
  }
  async function fillWeatherRows(onProgress){
    const snap = state.snapshot;
    if ((snap.weatherRows || []).length) return;
    onProgress && onProgress("攞緊真實天氣預報…");
    let r = null;
    try { r = await callAi({ action:"weather" }); } catch (_){}
    let rows = weatherRowsFromDaily(r && r.raw && r.raw.daily);
    if (rows.length) snap.weatherFrom = "forecast";
    else { rows = await lastYearWeatherRows(snap); if (rows.length) snap.weatherFrom = "lastyear"; }
    if (!rows.length) return;
    snap.weatherRows = rows;
    render();
  }
  // A trip more than about two weeks away has no forecast yet. Rather than
  // an empty table (or invented "averages"), show what the same dates were
  // actually like last year — Open-Meteo's archive, no key needed.
  async function lastYearWeatherRows(snap){
    const m = snap.meta || {};
    if (!Number.isFinite(+m.lat) || !Number.isFinite(+m.lng) || !m.dateStart) return [];
    const back = iso => { const [y, mo, d] = String(iso).split("-"); return `${+y - 1}-${mo}-${d}`; };
    const a = back(m.dateStart), b = back(m.dateEnd || m.dateStart);
    try {
      const res = await fetch(`https://archive-api.open-meteo.com/v1/archive?latitude=${+m.lat}&longitude=${+m.lng}` +
        `&start_date=${a}&end_date=${b}&daily=temperature_2m_max,temperature_2m_min,precipitation_sum&timezone=auto`);
      const j = await res.json();
      const dd = j && j.daily;
      if (!dd || !Array.isArray(dd.time)) return [];
      return dd.time.map((iso, i) => {
        const d = isoToUtc(iso), rain = dd.precipitation_sum && dd.precipitation_sum[i];
        const hi = dd.temperature_2m_max[i], lo = dd.temperature_2m_min[i];
        return { date: `${d.getUTCMonth() + 1}/${d.getUTCDate()}`,
          hi: hi == null ? "" : `${Math.round(hi)}°`, lo: lo == null ? "" : `${Math.round(lo)}°`,
          note: rain == null ? "" : rain >= 1 ? `去年有雨 ${Math.round(rain)}mm` : "去年冇落雨" };
      });
    } catch (_){ return []; }
  }
  // The standard notes every trip wants, whatever the destination. Each is an
  // AI section with a stored topic, so it gets the same 🔄 refresh button as
  // any other section instead of going stale.
  function standardSectionTopics(){
    const m = state.snapshot.meta || {};
    const where = m.destinationLocal || m.title || "呢次旅程";
    const mo = +(String(m.dateStart || "").split("-")[1] || 0);
    return [
      { topic: `${where} 天氣同點著衫`, label: "天氣同著衫建議" },
      ...(mo ? [{ topic: `${where} ${mo} 月有咩季節限定（紅葉／櫻花／燈飾／祭典／當造美食），幾時去最好`, label: `${mo} 月限定` }] : []),
      { topic: `${where} 交通、上網卡同貨幣`, label: "交通／上網／貨幣" },
      { topic: `${where} 行李同出發前準備清單`, label: "行李清單" },
    ];
  }
  function isStandardTopic(t){ return standardSectionTopics().some(x => x.topic === t); }
  async function recommendStandardSections(onProgress){
    const snap = state.snapshot;
    if (!Array.isArray(snap.sections)) snap.sections = [];
    for (const { topic, label } of standardSectionTopics()){
      if (snap.sections.some(s => s.topic === topic)) continue;
      onProgress && onProgress(`AI 幫你寫緊${label}…`);
      let r;

      snap.sections.push(Object.assign(blankSection("prep"), r.section, { source:"ai", topic, aiRefresh:true, where:"prep" }));
      render();

  }
  // A brand-new trip (index.html just created it and handed off here with
  // ?new=1) starts with every day blank — walk through generateTripFromScratch
  // once, showing progress in the fixed banner (not #app: render() wipes
  // that on every navigation, and this can take a couple of minutes for a
  // multi-day trip), then drop ?new=1 from the URL so a refresh mid-way or

  async function runInitialGeneration(){

    }

    setTimeout(() => genBanner(null), 6000);

  // An imported trip arrives as names and times only. Find each place on

  async function runImportFinish(){

    try {

    } catch (e){
      genBanner("配地點中途出咗問題：" + e.message + "（已經做好嘅已經存低，入返個別日子撳「重算全日交通」補返）", { done:true });
    }
    history.replaceState(null, "", location.pathname + "?" + new URLSearchParams({ trip: state.tripId }).toString());

  // Installed to the home screen there is no address bar: no reload button,
  // nothing to pull on, and no way to copy the link. Several things below
  // only make sense there, and one of them — our own pull-to-refresh — is
  // actively wrong in a browser tab, where it fired alongside Safari's and
  // the family saw two spinners at once.
  function isStandalone(){
    return (window.matchMedia && window.matchMedia("(display-mode: standalone)").matches)
        || window.navigator.standalone === true;
  }

  // ==================================================================
  // PULL TO REFRESH
  //
  // Installed to the home screen there is no browser chrome: no reload
  // button and nothing to pull on. So the gesture has to be the app's own.
  // It re-reads the itinerary from the server rather than reloading the
  // page, which is far cheaper on roaming data and keeps you on the day you
  // were reading.
  // ==================================================================
  const PTR_TRIGGER = 72;    // drag this far before letting go does anything
  const PTR_MAX = 112;       // the badge stops following the finger past here

  // Anything typed but not yet saved has to land before refetching, or the
  // refresh would quietly throw somebody's edit away.
  // The refresh button and the pull gesture only ever re-read the ITINERARY.
  // They left the page — the actual app code — exactly as it was, so an
  // installed app kept running whatever version it was installed with and the
  // only way to pick up a change was to delete it off the home screen and add
  // it back. Nobody should have to do that to get a bug fix.
  //
  // `cache: "reload"` is the part that matters: it goes past the browser's
  // HTTP cache to the server, and it refills that cache on the way back — so
  // the location.reload() that follows is guaranteed to get the new file
  // rather than the one already sitting on the phone.
  let updateReady = false;
  function showUpdateBar(){
    const bar = $("#updatebar");
    if (bar) bar.hidden = false;
  }
  async function checkAppUpdate(){
    // Already knew — but still re-show the bar, because something may have
    // dismissed or re-rendered over it since.
    if (updateReady){ showUpdateBar(); return true; }
    try {
      const res = await fetch(location.pathname, { cache: "reload" });
      if (!res || !res.ok) return false;
      const m = (await res.text()).match(/const BUILD = "([^"]+)"/);
      if (!m || m[1] === BUILD) return false;
      updateReady = true;
      showUpdateBar();
      return true;
    } catch (_){ return false; }
  }
  function wireUpdateBar(){
    const bar = $("#updatebar");
    if (!bar) return;
    bar.addEventListener("click", async () => {
      bar.querySelector(".updatebar-a").textContent = "更新緊…";
      try { if (saverDirty()) await flushSaves("update"); } catch (_){}
      try {
        const reg = navigator.serviceWorker && await navigator.serviceWorker.getRegistration();
        if (reg) await reg.update();
      } catch (_){}
      location.reload();
    });
  }

  async function reloadFromServer(){
    if (saverDirty()) await flushSaves("pull-to-refresh");
    if (saverDirty()) return "有改動仲未存到，等陣再拉";

    const row = await fetchLatestVersion();
    if (!row) throw new Error("讀唔到最新版本");
    const before = snapJson();
    state.snapshot = normalizeSnapshot(row.snapshot);
    const after = snapJson();
    saver.lastPersistedJson = after;
    // Card indices are positions, not identities, so a card left open could
    // reopen over a different stop once the list has moved underneath it.
    state.open.clear();
    render();
    // every refresh is also a chance to notice the app itself moved on
    const newer = await checkAppUpdate();
    if (newer) return "有新版本，撳下面更新";
    return after === before ? "已經係最新" : "更新咗";
  }

  function wirePullToRefresh(){
    const el = $("#ptr");
    if (!el || !("ontouchstart" in window)) return;
    // in a tab the browser already has this gesture; two is worse than one
    if (!isStandalone()) return;
    const mark = el.querySelector(".ptr-i"), label = el.querySelector(".ptr-t");
    let startY = 0, pulling = false, dist = 0, busy = false;

    const setIcon = (name) => { mark.innerHTML = icon(name); };
    const place = (y) => {
      el.style.transform = `translate(-50%, ${y}px)`;
      el.style.opacity = y > 0 ? String(Math.min(1, y / 40)) : "0";
    };
    const reset = () => {
      el.classList.add("settling");
      el.classList.remove("ready", "busy");
      el.style.transform = "translate(-50%,-150%)";
      el.style.opacity = "0";
      pulling = false; dist = 0;
    };

    document.addEventListener("touchstart", (e) => {
      if (busy || e.touches.length !== 1) return;
      if (window.scrollY > 0) return;
      if ($("#layer").innerHTML !== "") return;          // a sheet is open
      if (e.target.closest("[data-drag]")) return;       // reordering a stop
      if (e.target.closest("input, textarea, select")) return;
      startY = e.touches[0].clientY;
      pulling = true; dist = 0;
      el.classList.remove("settling");
      setIcon("chevron");
    }, { passive: true });

    document.addEventListener("touchmove", (e) => {
      if (!pulling || busy) return;
      const raw = e.touches[0].clientY - startY;
      // Scrolling up, or the page scrolled away under us — hand the gesture back.
      if (raw <= 0 || window.scrollY > 0){ if (dist) reset(); else pulling = false; return; }
      // Resistance: the first pixels follow the finger, the rest get heavier.
      dist = Math.min(PTR_MAX, raw * 0.5);
      if (e.cancelable) e.preventDefault();
      const ready = dist >= PTR_TRIGGER;
      el.classList.toggle("ready", ready);
      label.textContent = ready ? "放手更新" : "拉低更新";
      place(dist + 10);
    }, { passive: false });

    document.addEventListener("touchend", async () => {
      if (!pulling || busy) return;
      const fire = dist >= PTR_TRIGGER;
      if (!fire) return reset();

      busy = true;
      el.classList.add("settling", "busy");
      el.classList.remove("ready");
      setIcon("refresh");
      label.textContent = "更新緊…";
      place(14);
      try {
        label.textContent = await reloadFromServer();
      } catch (err){
        label.textContent = netMsg(err);
      }
      el.classList.remove("busy");
      setIcon("check");
      setTimeout(reset, 900);
      busy = false;
    }, { passive: true });
  }

  // A gesture is a nice extra, not a guarantee. Installed to the home screen
  // there is no browser reload, so there is also a button that cannot be
  // missed or fumbled — it does exactly what the pull does.
  function wireReloadButton(){
    const b = $("#btn-reload");
    if (!b || !isStandalone()) return;
    b.hidden = false;
    let busy = false;
    b.addEventListener("click", async () => {
      if (busy) return;
      busy = true;
      b.classList.add("spinning");
      try { flash(await reloadFromServer()); }
      catch (e){ flash(netMsg(e)); }
      b.classList.remove("spinning");
      busy = false;
    });
  }

  // The service worker is what makes this installable, and what lets the
  // trip open on a phone with no signal. A failure here must never stop the
  // page working, so it is fire-and-forget.
  function registerServiceWorker(){
    if (!("serviceWorker" in navigator)) return;
    if (location.protocol !== "https:" && location.hostname !== "localhost") return;
    window.addEventListener("load", () => {
      navigator.serviceWorker.register("/sw.js").catch(() => {});
    });
  }

  async function boot(){
    const params = new URLSearchParams(location.search);
    const tripId = params.get("trip");
    if (!tripId){
      location.replace("index.html");
      return;
    }
    state.tripId = tripId;
    if (params.get("view") === "1"){ state.readonly = true; document.body.classList.add("readonly"); }

    let row, bootErr = null;
    const CACHE_KEY = "dumbofly_snap_" + tripId;
    try {
      row = await fetchLatestVersion();
      if (!row) throw new Error("呢個行程重未有版本紀錄。");
      // a copy on the phone, for the subway with no signal
      try { localStorage.setItem(CACHE_KEY, JSON.stringify({ at: Date.now(), snapshot: row.snapshot })); } catch (_){}
    } catch (e){
      bootErr = e;
      let cached = null;
      try { cached = JSON.parse(localStorage.getItem(CACHE_KEY) || "null"); } catch (_){}
      if (cached && cached.snapshot){
        // Offline: show the last copy, read-only, so a stale snapshot can
        // never be saved back over somebody's newer edit.
        row = { snapshot: cached.snapshot };
        state.readonly = true; state.offline = cached.at;
        document.body.classList.add("readonly");
        window.addEventListener("online", () => location.reload(), { once: true });
      }
    }
    if (!row){
      $("#app").innerHTML = `<div class="sec"><div class="errbox">載入唔到行程：${esc(netMsg(bootErr))}<br>
        <div style="margin-top:10px;"><button class="btn" id="retryboot">再試一次</button>
        <a class="btn" href="index.html">返去主頁</a></div></div></div>`;
      $("#retryboot").addEventListener("click", () => {
        $("#app").innerHTML = `<div class="sec"><p class="hint">載入緊…</p></div>`;
        boot();
      });
      return;
    }
    state.snapshot = normalizeSnapshot(row.snapshot);
    if (state.offline || state.readonly){
      const bar = document.createElement("div");
      bar.className = "robar";
      bar.textContent = state.offline
        ? `冇網絡：顯示 ${new Date(state.offline).toLocaleString("zh-HK", { month: "numeric", day: "numeric", hour: "2-digit", minute: "2-digit" })} 存低嘅版本，有網就會自動更新（暫時改唔到）`
        : "唯讀：只可以睇，唔可以改";
      document.body.appendChild(bar);
    }
    saver.lastPersistedJson = snapJson();
    const back = readPlace();
    const resumeY = (back && back.trip === tripId) ? back.y : 0;
    if (back && back.trip === tripId && (back.view === "overview" || back.view === "notes" || back.view === "stays"
        || dayById(back.view) || boardById(back.view))) state.view = back.view;
    else if (todayDay()) state.view = todayDay().id;
    try {
      render();
      if (resumeY) requestAnimationFrame(() => window.scrollTo(0, resumeY));
      // snapshots saved before stays carried their own coordinate still have
      // no 🏨 pin; fill it in once, in the background
      geocodeStays(state.snapshot);
    } catch (e){
      $("#app").innerHTML = `<div class="sec"><div class="errbox">行程讀到咗，但畫唔出嚟：${esc(e.message)}<br>可以撳上面日子掣試下第二日。</div></div>`;
      return;
    }
    wirePullToRefresh();
    wireReloadButton();
    wireUpdateBar();
    // Checked on every launch, not only when somebody pulls: the whole point
    // is that an update finds you rather than the other way round.
    checkAppUpdate();
    if (params.get("new") === "1") runInitialGeneration();
    else if (params.get("import") === "1") runImportFinish();
  }
  // The little plane on every boarding pass flies its dashed arc, HKG to the
  // destination, then lands and goes again. One animation loop drives every
  // plane on the page; the arc is the top half of an ellipse (the border of
  // .tp-arc / .pass-arc), so the plane is placed on that curve and turned to
  // its tangent. Off when the system asks for reduced motion.
  (function flyPlanes(){
    if (window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches) return;
    const DUR = 5200, REST = 1400;
    const ease = t => t < .5 ? 2 * t * t : 1 - Math.pow(-2 * t + 2, 2) / 2;
    function frame(now){
      document.querySelectorAll(".tp-flight, .pass-flight").forEach((box, k) => {
        const arc = box.querySelector(".tp-arc, .pass-arc"), pl = box.querySelector(".i");
        if (!arc || !pl) return;
        const W = arc.offsetWidth, H = arc.offsetHeight;
        if (!W || !H) return;
        // each pass starts at its own moment so a list doesn't move in lockstep
        const cyc = (now + k * 900) % (DUR + REST);
        const p = ease(Math.min(1, cyc / DUR));
        const phi = Math.PI * p;                       // 0 = origin, π = destination
        const cx = arc.offsetLeft + W / 2, cy = arc.offsetTop + H;
        const x = cx - (W / 2) * Math.cos(phi), y = cy - H * Math.sin(phi);
        const ang = Math.atan2(-H * Math.cos(phi), (W / 2) * Math.sin(phi)) * 180 / Math.PI;
        pl.style.left = x + "px"; pl.style.top = y + "px";
        pl.style.transform = `translate(-50%, -50%) rotate(${90 + ang}deg)`;
      });
      requestAnimationFrame(frame);
    }
    requestAnimationFrame(frame);
  })();
  registerServiceWorker();
  boot();
})();
</script>
</body>
