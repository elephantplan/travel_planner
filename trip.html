    const s = idx == null ? blankSection(where) : d.sections[idx];
    if (!s) return;
    // You typed a topic, then chose to write it yourself — and the editor
    // opened blank, throwing the title away. Carry it in.
    if (idx == null && title){ s.title = title; s.topic = title; }
    openEditSheet(idx == null ? "加一個 section" : "改「" + (s.title || "未命名") + "」",
      "一行一個重點。連結一行一個，寫做「名 | https://…」。", [
        { key:"icon",  label:"標題前面嘅符號（唔填就冇）", type:"text", value:s.icon || "", placeholder:"留空就得" },
        { key:"title", label:"標題",  type:"text", value:s.title || "", placeholder:"例如：手信買咩好" },
        { key:"sub",   label:"副標題（可以留空）", type:"text", value:s.sub || "" },
        { key:"lines", label:"內容（一行一個重點）", type:"lines", value:(s.lines||[]).join("\n"), rows:9 },
        { key:"links", label:"連結（一行一個，名 | 網址）", type:"lines",
          value:(s.links||[]).map(l => `${l.name || ""} | ${l.url || ""}`).join("\n"), rows:3 },
        { key:"topic", label:"AI 更新用嘅題目",
          hint:"撳嗰粒「問 AI 攞最新資料」嗰陣，會攞呢個題目再問一次 AI。留空就用返標題。",
          type:"text", value:s.topic || "", placeholder:"例如：手信買咩好" },
        { key:"where", label:"擺喺邊", type:"select", options: whereOptions(d), value: sectionWhere(d, s) },
      ], async out => {
        const links = (out.links || []).map(row => {
          const parts = String(row).split("|");
          const url = (parts.length > 1 ? parts.slice(1).join("|") : parts[0]).trim();

      // thinking" from "hung" — busyIn paints a spinner, a bar and a running
      // seconds counter, which is what makes a slow answer legible as slow.
      const out = document.getElementById("secout-" + i);
      const stop = out ? busyIn(out, { steps:[`AI 更新緊「${topic}」`], hint:"大約 10-30 秒。行得太耐會自動停，唔會一路吊住。" }) : () => {};

        s.updatedAt = new Date().toISOString();
        render();

        // FRESH element — otherwise it lands on a node already thrown away
        const after = document.getElementById("secout-" + i);
        if (after) after.innerHTML = `<div class="ai-msg ok">${icon("check")}更新咗，內容係上面嗰啲。</div>`;

        flash(`已經更新「${s.title}」`);
      } catch (e){
        stop();
        if (out) out.innerHTML = `<div class="ai-msg">出咗問題：${esc(e.message)}</div>`;
        else flash("出咗問題：" + e.message);
        btn.disabled = false; btn.textContent = origText;
      }
    }));
  }

  // ---------- 航班 ----------
  // Most families book the flights first and plan around them. The flight is

  // and ends where the plane does. No fare search: prices move by the hour
  // and a stale one is worse than none, so there is a link out instead.
  const FLIGHT_DIRS = [["out", "去程"], ["back", "回程"]];
  function flightsOf(d){ return Array.isArray(d.flights) ? d.flights.filter(f => f && (f.no || f.from || f.to)) : []; }
  function apCode(x){ const t = plain(x).trim(); return /^[A-Za-z]{3}$/.test(t) ? t.toUpperCase() : t; }
  function flightDateLabel(iso){
    const [y, m, dd] = String(iso || "").split("-").map(Number);
    if (!y) return "";
    return `${m}月${dd}日（${["日","一","二","三","四","五","六"][new Date(y, m - 1, dd).getDay()]}）`;
  }
  function flightStatusUrl(f){ return f.no ? `https://www.google.com/search?q=${encodeURIComponent(f.no.replace(/\s+/g, "") + " flight status")}` : ""; }
  function flightCardHtml(f){
    const dir = (FLIGHT_DIRS.find(x => x[0] === f.dir) || [, "航班"])[1];

    openSheet(`

      outTo.addEventListener("input", () => { if (!backFrom.dataset.touched) backFrom.value = outTo.value.toUpperCase(); });

      // look the flight up by number and date
      sheet.querySelectorAll("[data-fllook]").forEach(btn => btn.addEventListener("click", async () => {
        const dir = btn.dataset.fllook, box = sheet.querySelector(`[data-fdir="${dir}"]`);
        const msg2 = sheet.querySelector(`[data-fllookmsg="${dir}"]`);

        if (!no){ msg2.className = "fl-lookmsg warn"; msg2.textContent = "先打航班號。"; return; }
        btn.disabled = true; msg2.className = "fl-lookmsg"; msg2.innerHTML = `<span class="spin"></span>查緊 ${esc(no.toUpperCase())}…`;
        try {
          const res = await fetch(SUPABASE_URL + "/functions/v1/trip-import", { method:"POST", headers: sbHeaders(),
            body: JSON.stringify({ mode:"flight-lookup", text: `${no} ${date}`, today: new Date().toISOString().slice(0, 10) }) });
          const r = await res.json();
          const f = r && r.trip && r.trip.flights && r.trip.flights[0];
          if (!f) throw new Error((r && r.message) || "查唔到呢班機。");
          ["from","to","dep","arr","terminal"].forEach(k => { if (f[k]) box.querySelector(`[data-ff="${k}"]`).value = f[k]; });

          const r = await res.json();
          const got = (r && r.trip && r.trip.flights) || [];
          if (!got.length) throw new Error((r && r.message) || "喺張圖度搵唔到航班資料。");
          got.forEach(f => {

          });
          msg.innerHTML = `<p class="hint">讀到 ${got.length} 程，睇吓啱唔啱先儲存。</p>`;
        } catch (e){ msg.innerHTML = `<p class="hint warn">${esc(e.message || "讀唔到")}</p>`; }
        scan.value = "";
      });
      sheet.querySelector("[data-esave]").addEventListener("click", async () => {
        d.flights = FLIGHT_DIRS.map(([dir]) => {
          const box = sheet.querySelector(`[data-fdir="${dir}"]`), f = { dir };
          box.querySelectorAll("[data-ff]").forEach(i => { f[i.dataset.ff] = i.value.trim(); });
          return f;
        }).filter(f => f.no || f.dep || f.arr || (f.from && f.to && f.from !== "HKG" && f.to !== "HKG") || f.ref);
        closeLayer();
        render();
        await saveNow("改咗航班");
      });
    });
  }
  async function imageFileToPart(file){
    const url = URL.createObjectURL(file);
    try {
      const img = await new Promise((ok, bad) => { const i = new Image(); i.onload = () => ok(i); i.onerror = () => bad(new Error("開唔到張圖")); i.src = url; });
      const k = Math.min(1, 1800 / Math.max(img.naturalWidth, img.naturalHeight));
      const c = document.createElement("canvas");
      c.width = Math.round(img.naturalWidth * k); c.height = Math.round(img.naturalHeight * k);
      c.getContext("2d").drawImage(img, 0, 0, c.width, c.height);
      return { mime: "image/jpeg", data: c.toDataURL("image/jpeg", 0.85).split(",")[1] };
    } finally { URL.revokeObjectURL(url); }
  }

        ${(() => {

          ${mapOpen ? `<div class="mapbox" id="map-${day.id}" data-points='${esc(JSON.stringify(buildDayMapPoints(day)))}'></div>

      <div class="line" id="line" style="--lc:${lc}">

  // how many legs are flagged as needing a fresh answer from Google
  function staleCount(units){
    return units.filter((u,i) => i > 0 && u.stop && u.seg && u.seg.stale).length;
  }
  // real places still missing a Google rating (logistics rows never count)
  function ratableCount(stops){
    return stops.filter(s => !Number.isFinite(s.rating) && !s.noRating && (s.placeId || s.mapUrl) && plain(s.title)).length;
  }
  // real places that could have a picture but don't (yet)
  function photolessCount(stops){
    return stops.filter(s => !s.photoUrl && !s.noPhoto && (s.placeId || s.mapUrl) && plain(s.title)).length;
  }

  // a ＋ sitting on the route line, so any gap between two places is somewhere
  // you can tap directly instead of adding at the end and dragging into place
  function insertRowHtml(pos){

  function unitHtml(day, u, i, total, sel, firstStop, stopNums){
    const key = day.id + ":" + i;
    const open = state.open.has(key);
    const s = u.stop;
    const selecting = !!sel;
    const checked = selecting && sel.selected.has(i);

    if (u.note){
      const txt = plain(u.note.text);
      return `
        <div class="unit" data-i="${i}">
          <div class="stop">
            <div class="stop-rail"><span class="stoptime"></span><span class="node note"></span></div>
            <div class="notecard${open ? " open" : ""}">
              <div class="notemain">
                <span class="noteicon">${icon("note")}</span>
                <div class="notetext${txt ? "" : " empty"}">${txt ? esc(txt) : "寫低你想記住嘅嘢…"}</div>
              </div>
              ${selecting ? "" : `
              <div class="cardtools">
                <button class="editbtn" data-open="${key}" title="${open ? "完成編輯" : "編輯"}" aria-label="${open ? "完成編輯" : "編輯"}">${open ? icon("check") : icon("pencil")}</button>
                <div class="draghandle" data-drag="${i}" title="拉上拉落搬位">${icon("grip")}</div>
              </div>`}
              ${!selecting && open ? noteEditorHtml(u.note, i) : ""}
            </div>
          </div>
        </div>`;
    }

    const showSeg = u.seg && i !== firstStop;
    const segBody = !showSeg ? "" :
      u.seg.checking && transitRunning ? `<span class="seg-note">計緊交通時間…</span>` :
      u.seg.stale || u.seg.checking ? `<span class="seg-note warn">${icon("warn")}次序改咗，交通時間要再確認${state.transitProblem ? `<br><span class="seg-why">${esc(state.transitProblem)}</span>` : ""}</span>` :
      `<span class="seg-head">${state.readonly ? segHtmlOf(u.seg) : segModeBtn(u.seg, `data-segmode="${i}"`)}</span>` + (u.seg.route ? routeChainHtml(u.seg.route) : "");
    // one segment, one button — refreshing all of a day's legs to update just
    // one used to burn a Google Directions call per leg every time
    const segRefresh = showSeg && !u.seg.checking
      ? `<button class="segrefresh" data-segrefresh="${i}" title="淨係重新check呢一段交通" aria-label="重新check呢一段交通">${icon("refresh")}</button>` : "";
    // "18 分鐘" tells you how long; it doesn't tell you which exit, which
    // platform, or where to stand. These hand the same two points straight to
    // a map app so the family can just follow it.
    let segLinks = "";
    if (showSeg && s){
      const us = toUnits(day.items);
      let prev = null, prevIdx = -1;
      for (let j = i - 1; j >= 0; j--) if (us[j] && us[j].stop){ prev = us[j].stop; prevIdx = j; break; }
      // the leg's origin is usually the day's 「酒店出發」 row, so it needs the
      // same substitution as the stop card or the route starts from a search
      const from = mapSubject(day, prev, prevIdx === firstStop);
      const to = mapSubject(day, s, i === firstStop);
      const mode = segMode(u.seg);
      const g = (from && to) ? gmapsDirUrl(from, to, mode) : "";
      const n = (from && to && destIsKorea()) ? naverDirUrl(from, to, mode) : "";
      const parts = mapLinksInOrder(
        n ? `<a class="maplink" href="${esc(n)}" target="_blank" rel="noopener" aria-label="Naver 路線">${icon("map")}Naver</a>` : "",
        g ? `<a class="maplink" href="${esc(g)}" target="_blank" rel="noopener" aria-label="Google 路線">${icon("map")}Google</a>` : "",
      );
      if (parts.length) segLinks = `<span class="seg-links">${parts.join("")}</span>`;
    }
    // a leg that takes longer than the gap between the two planned times
    let tight = "";
    if (showSeg && s && !u.seg.stale && !u.seg.checking && !u.seg.noTime){
      const us = toUnits(day.items);
      let prev = null;
      for (let j = i - 1; j >= 0; j--) if (us[j] && us[j].stop){ prev = us[j].stop; break; }
      const t1 = prev && clockMin(prev.time), t2 = clockMin(s.time);
      const txt = String(u.seg.text != null ? u.seg.text : segPlain(u.seg.html || ""));
      const h = txt.match(/(\d+)\s*小時/), mm = txt.match(/(\d+)\s*分鐘/);
      const need = (h ? +h[1] * 60 : 0) + (mm ? +mm[1] : 0);
      if (t1 != null && t2 != null && need && t2 > t1 && t2 - t1 < need)
        tight = `<span class="seg-tight">${icon("warn")}時間好趕：交通要 ${need} 分鐘，但兩個站只隔 ${t2 - t1} 分鐘</span>`;
    }
    const segHtml = showSeg ? `
      <div class="seg${u.seg.stale ? " stale" : ""}${tight ? " tight" : ""}" data-mode="${u.seg.stale ? "other" : segMode(u.seg)}">
        <div class="seg-rail"></div>
        <div class="seg-text">${segBody}${segRefresh}${tight}${segLinks}${u.seg.stale || u.seg.checking ? "" : adviceHtml(u.seg, String(i))}</div>
      </div>` : "";

    if (!s) return `<div class="unit" data-i="${i}">${segHtml}</div>`;

    const named = plain(s.title);
    // no picture yet, but it is a real place (we have a map link or a Google id)
    // -> offer a one-tap fetch instead of leaving the row bare
    const fetchable = !s.photoUrl && !s.noPhoto && (s.placeId || s.mapUrl);
    // An empty 62px placeholder box used to sit on every photo-less stop,
    // costing a third of the card's width on a phone to show nothing. Fetching
    // a photo is now a link in the footer row, and the box only exists once
    // there is a picture to put in it.
    const thumb = s.photoUrl
      ? `<div class="thumb"><img src="${esc(s.photoUrl)}" alt="" loading="lazy" data-photoimg="${i}">${Number.isFinite(s.rating) ? `<span class="thumb-rate">${icon("star")}${s.rating.toFixed(1)}</span>` : ""}</div>`
      : "";

    const closedToday = stopClosedOnDay(s, day);
    const chips = []
      .concat((s.niecepick||[]).map(n=>`<span class="niecepick">${esc(n)}</span>`))
      .concat(closedToday ? [`<span class="meta-chip closed">${icon("warn")}呢度星期${esc(weekdayCharOfDate(day.date))}公休，同排定嘅日子撞埋咗</span>`] : [])
      .concat(closedToday ? [] : hoursClashChip(s, day))
      .concat(ratingChip(s) ? [ratingChip(s)] : [])
      // the hand-written "⭐ 4.3" chips predate live ratings; drop them once
      // Google's own number is on the card so the two can't contradict
      .concat(dayHoursChip(s, day))
      .concat((s.eatMeta||[]).filter(c => !(Number.isFinite(s.rating) && /^⭐/.test(c.text||"")))
        // Google's per-weekday hours are summed up in one chip above; the old
        // summary chip would only repeat it
        .filter(c => !(/hours/.test(c.cls || "") && hoursWeek(s) && hoursWeek(s).main)).map(c=>`<span class="${esc(c.cls)}">${esc(c.text)}</span>`))
      .concat((s.accessBadges||[]).map(b=>`<span class="${esc(b.cls)}">${esc(b.text)}</span>`))
      .join("");

    // quick outbound links — for the place this row actually stands for, which
    // for a logistics line like 「酒店出發」 is the day's hotel, not its label.
    // In Korea, Google Maps can find a place but can't route you to it — so a
    // Korean trip leads with the map people there actually use.
    const subj = mapSubject(day, s, i === firstStop);
    const nv = (subj && destIsKorea()) ? naverPlaceUrl(subj) : "";
    const links = mapLinksInOrder(
      nv ? `<a class="maplink" href="${esc(nv)}" target="_blank" rel="noopener">${icon("map")}Naver 地圖</a>` : "",
      (() => { const g = subj ? googlePlaceUrl(subj) : ""; return g
        ? `<a class="maplink" href="${esc(g)}" target="_blank" rel="noopener">${icon("pin")}Google 地圖</a>` : ""; })(),
    );
    if (s.mapUrl){
      const gr = googleReviewsUrl(s), gs = googleSearchUrl(s);
      if (gr) links.push(`<a class="maplink" href="${esc(gr)}" target="_blank" rel="noopener">${icon("star")}評論</a>`);
      if (gs) links.push(`<a class="maplink" href="${esc(gs)}" target="_blank" rel="noopener">${icon("search")}搜尋</a>`);
      const cm = customMapUrl(s);
      if (cm) links.push(`<a class="maplink" href="${esc(cm)}" target="_blank" rel="noopener">${icon("link")}自訂地圖</a>`);
    }
    { const c = copyBtnHtml(subj || s); if (c) links.push(c); }
    { const tx = taxiBtnHtml((subj || s).kr, (subj || s).title); if (tx) links.push(tx); }
    if (fetchable) links.push(`<button class="maplink" data-getphoto="${i}">${icon("camera")}搵張相</button>`);

    return `
      <div class="unit" data-i="${i}">
        ${i === firstStop ? hotelLegHtml(day, "hotelLeg") : ""}
        ${segHtml}
        <div class="stop">
          <div class="stop-rail">
            <span class="stoptime">${timeLabelHtml(s.time)}</span>
            <span class="node${stopNums && stopNums.has(i) ? " numbered" : ""}" data-type="${esc(s.type||'normal')}">${stopNums && stopNums.has(i) ? stopNums.get(i) : ""}</span>
          </div>
          <div class="stopcard${open ? " open" : ""}${selecting ? " selecting" : ""}${checked ? " checked" : ""}">
            <div class="stopmain"${selecting ? ` data-select="${i}"` : ""}>
              ${selecting ? `<span class="selbox">${checked ? icon("check") : ""}</span>` : ""}
              ${thumb}
              <div class="stopbody">
                <div class="stopname ${named ? "" : "unnamed"}">${named ? esc(named) : "未改名嘅地點"}${s.kr && !named.includes(plain(s.kr)) ? `<span class="kr">${esc(plain(s.kr))}</span>` : ""}</div>
                ${descHtml(s, day.id + ":" + i)}
                ${briefLoading.has(s) ? elephantHtml("搵緊呢度嘅介紹同大家推介咩…", true) : ""}
                ${chips ? `<div class="chiprow">${chips}</div>` : ""}
              </div>
            </div>
            ${selecting ? "" : `
            <div class="cardtools">
              <button class="editbtn" data-open="${key}" title="${open ? "完成編輯" : "編輯"}" aria-label="${open ? "完成編輯" : "編輯"}">${open ? icon("check") : icon("pencil")}</button>
              <div class="draghandle" data-drag="${i}" title="拉上拉落搬位">${icon("grip")}</div>
            </div>`}
            ${s.eatboxHtml ? `<div class="eatbox">${s.eatboxHtml}</div>` : ""}
            ${s.tip ? `<div class="tipbox">${esc(s.tip)}</div>` : ""}
            ${bookingBoxHtml(s)}
            ${links.length ? `<div class="stopfoot">${links.join("")}</div>` : ""}
            ${selecting ? "" : altsHtmlFor(day, s, i)}
            ${!selecting && open ? editorHtml(day, u, i, total) : ""}
          </div>
        </div>
        ${!selecting && i === lastStopIndex(day) ? hotelLegHtml(day, "backLeg") : ""}
      </div>`;
  }
  function lastStopIndex(day){
    const us = toUnits(day.items);
    for (let j = us.length - 1; j >= 0; j--) if (us[j].stop) return j;
    return -1;
  }

  function noteEditorHtml(note, i){
    return `
      <div class="editor" data-noteeditor="${i}">
        <div class="field">
          <label>Note</label>
          <textarea class="textarea" data-nf="text" placeholder="例如：買定 T-money／呢度落車行 5 分鐘／記得訂位">${esc(note.text || "")}</textarea>
        </div>
        <div class="editor-tools">
          <button class="btn danger" data-nact="remove">刪走</button>
          <button class="btn primary" data-nact="close">完成</button>
        </div>
      </div>`;
  }

  function editorHtml(day, u, i, total){
    const s = u.stop;
    return `
      <div class="editor" data-editor="${i}">
        <div class="field">
          <label>名 — 打字會搵返 Google 地圖真實地點</label>
          <input class="input" data-f="title" value="${esc(plain(s.title))}" placeholder="例如：某某市場" autocomplete="off">
          <div class="suggest" data-suggest></div>
        </div>
        <div class="row2">
          <div class="field"><label>時間（唔一定要填）</label><input class="input" data-f="time" value="${esc(s.time)}" placeholder="約 14:00"></div>
          <div class="field"><label>類型</label>
            <select class="select" data-f="type">
              <option value="normal" ${s.type==="normal"?"selected":""}>景點</option>
              <option value="eat" ${s.type==="eat"?"selected":""}>餐飲</option>
              <option value="rest" ${s.type==="rest"?"selected":""}>休息</option>
            </select>
          </div>
        </div>
        <div class="field"><label>當地語言名</label><input class="input" data-f="kr" value="${esc(s.kr)}" placeholder="當地語言寫法，方便搵地點"></div>
        <div class="field"><label>描述</label><textarea class="textarea" data-f="desc" placeholder="想記低嘅嘢…">${esc(s.desc)}</textarea></div>
        <div class="field"><label>提醒 — 喺卡上面黃色格仔顯示，清空就冇</label><input class="input" data-f="tip" value="${esc(plain(s.tip || ""))}" placeholder="例如：已訂位／要早啲排隊／帶現金"></div>

        <div class="field">
          <label>相片</label>
          <div>
            <button class="btn wide" data-act="findphoto">${s.photoUrl ? "換張相" : "搵返呢度嘅相"}</button>
          </div>
        </div>

        <div class="field">
          <label>後備選擇 — 同一個時段，第二三揀</label>
          ${altsOf(s).length ? `<div class="altedit">${altsOf(s).map((a, ai) => `
            <div class="altrow">
              <div><span class="altn">${esc(altName(a))}</span>${
                a.kr ? `<span class="altkr">${esc(plain(a.kr))}</span>` : ""}</div>
              <div class="altlinks">
                <button class="maplink use" data-act="altup" data-ai="${ai}">${icon("check")}升做首選</button>
                <button class="maplink" data-act="altout" data-ai="${ai}">${icon("plus")}抽返出嚟做獨立站</button>
                <button class="maplink" data-act="altdel" data-ai="${ai}" aria-label="刪走">${icon("trash")}</button>
              </div>
            </div>`).join("")}</div>` : ""}
          <input class="input" data-altq placeholder="打間鋪頭名，跟住喺下面揀返" autocomplete="off">
          <div data-altsug></div>
          <button class="btn wide" data-act="foldpick">${icon("list")}摺埋行程入面另一個站</button>
          <p class="hint">首選會排喺行程度；後備摺埋喺佢下面，撳「改用呢間」就即刻對調。同一餐有幾間想食，用上面嗰個掣摺埋一齊，就唔會佔住幾行。</p>
        </div>

        <div class="editor-tools">
          <button class="btn" data-act="move">搬去邊度</button>
          <button class="btn" data-act="up" ${i===0?"disabled":""}>上移</button>
          <button class="btn" data-act="down" ${i===total-1?"disabled":""}>下移</button>
          <button class="btn danger" data-act="remove">刪走</button>
          <button class="btn primary" data-act="close">完成</button>
        </div>
      </div>`;
  }

  // toggling which card is expanded — shared by the day view and every
  // bookmark board, so opening one always closes whatever else was open
  function wireOpenToggles(){
    document.querySelectorAll("[data-open]").forEach(btn => btn.addEventListener("click", () => {
      const key = btn.dataset.open;
      if (state.open.has(key)) state.open.delete(key); else { state.open.clear(); state.open.add(key); }
      render();
      if (state.open.has(key)){
        const el = document.querySelector(`[data-editor], [data-boardeditor], [data-noteeditor]`);
        if (el) el.scrollIntoView({ block:"nearest", behavior:"smooth" });
      }
    }));
  }

  // ==================================================================
  // WIRING — one day
  // ==================================================================
  function wireDay(day){
    const line = $("#line");

    const toggle = $("#maptoggle");
    if (toggle) toggle.addEventListener("click", () => {
      if (state.mapsShut.has(day.id)) state.mapsShut.delete(day.id); else state.mapsShut.add(day.id);
      render();
    });
    if (!state.mapsShut.has(day.id)) initDayMap(day);
    autoGeocodeDay(day);          // fire-and-forget; it re-renders as it fills in

    wireOpenToggles();

    const dayEdit = $("#dayedit");
    if (dayEdit) dayEdit.addEventListener("click", e => { e.stopPropagation(); openDayInfoEditSheet(day); });

    // same picker as the in-between ＋, so every position — including the very
    // end — can take either a place or a note
    const addBtn = $("#addstop");
    if (addBtn) addBtn.addEventListener("click", () => openInsertSheet(day, toUnits(day.items).length));

    const dayAi = $("#dayai");
    if (dayAi) dayAi.addEventListener("click", () => openDayAiSheet(day));

    const swapDayBtn = $("#swapday");
    if (swapDayBtn) swapDayBtn.addEventListener("click", () => openDaySwapPicker(day));

    // ---------- 選幾個地點一齊搬 ----------
    const selStart = $("#selstart");
    if (selStart) selStart.addEventListener("click", () => {
      state.selectMode = { dayId: day.id, selected: new Set() };
      render();
    });
    const selCancel = $("#selcancel");
    if (selCancel) selCancel.addEventListener("click", () => { state.selectMode = null; render(); });
    const selMove = $("#selmove");
    if (selMove) selMove.addEventListener("click", () => {
      if (!state.selectMode || !state.selectMode.selected.size) return;
      openMultiMovePicker(day, [...state.selectMode.selected]);
    });
    if (inSelectMode(day)){
      document.querySelectorAll("[data-select]").forEach(el => el.addEventListener("click", () => {
        const idx = +el.dataset.select;
        const sel = state.selectMode.selected;
        if (sel.has(idx)) sel.delete(idx); else sel.add(idx);
        render();
      }));
    }

    // 📷 placeholder on a photo-less stop: fetch one picture, no picker
    // Google's place/photo endpoint answers with a redirect to a temporary
    // lh3.googleusercontent.com URL, and what got stored was that RESOLVED
    // url — which expires after a few weeks. So pictures fetched in July are
    // now dead links, and a dead link renders as the browser's broken-image
    // box. Treat a failed image as "no picture yet": drop the dead url so the
    // card offers to fetch a fresh one instead of showing a torn photo.
    {
      let dead = 0, settle = null;
      document.querySelectorAll("img[data-photoimg]").forEach(img => {
        img.addEventListener("error", () => {
          const u = toUnits(day.items)[+img.dataset.photoimg];
          if (!u || !u.stop || !u.stop.photoUrl) return;
          delete u.stop.photoUrl;
          dead++;
          // one repaint for the lot, however many fail at once
          clearTimeout(settle);
          settle = setTimeout(() => {
            render();
            saveNow(`清走咗 ${dead} 張失效嘅地點相`, true);
          }, 300);
        }, { once:true });
      });
    }

    const getphotos = $("#getphotos");
    if (getphotos) getphotos.addEventListener("click", async () => {
      getphotos.disabled = true;
      const todo = toUnits(day.items).map(u => u.stop)
        .filter(s => s && !s.photoUrl && !s.noPhoto && (s.placeId || s.mapUrl) && plain(s.title));
      let got = 0, problem = "";
      for (let i = 0; i < todo.length; i++){
        const s = todo[i];
        const btn = $("#getphotos");
        if (btn) btn.innerHTML = `<span class="spin"></span>搵緊…（${i + 1}／${todo.length}）`;
        const name = plain(s.kr) || plain(s.title);
        try {
          const r = await fetchStoredPhoto(s);
          if (r && r.ok !== false && r.url){ s.photoUrl = r.url; got++; }
          else if (r && r.reason === "nophoto") s.noPhoto = true;
          else if (r && r.message && !problem) problem = r.message;
        } catch (e){ if (!problem) problem = e.message; }   // one failure must not stop the rest
      }
      render();
      // Not background upkeep: someone pressed a button and waited through
      // dozens of lookups. Persist it promptly instead of letting it ride
      // along with the next edit, which might never come.
      if (got) saveNow(`攞返 ${got} 張地點相`);
      // say what actually went wrong rather than blaming the places
      if (problem) flash(problem);
      else if (!got) flash("Google 嗰邊冇呢啲地點嘅相。");
    });

    document.querySelectorAll("[data-getphoto]").forEach(el => el.addEventListener("click", ev => {
      ev.preventDefault();
      ev.stopPropagation();          // sits inside the card button; don't open the editor
      openPhotoPicker(toUnits(day.items)[+el.dataset.getphoto].stop);
    }));

    // ---------- backup picks ----------
    document.querySelectorAll("[data-alts]").forEach(el => el.addEventListener("click", ev => {
      ev.preventDefault(); ev.stopPropagation();
      const key = day.id + ":" + el.dataset.alts;
      if (state.altsOpen.has(key)) state.altsOpen.delete(key); else state.altsOpen.add(key);
      render();
    }));

    document.querySelectorAll("[data-altup]").forEach(el => el.addEventListener("click", async ev => {
      ev.preventDefault(); ev.stopPropagation();
      const [ui, ai] = el.dataset.altup.split(":").map(Number);
      const units = toUnits(day.items);
      const s = units[ui] && units[ui].stop;
      if (!s) return;
      const was = swapAlt(s, ai);
      day.items = fromUnits(units);
      syncMapPoints(day);
      render();
      await saveNow(`${plain(s.time) || "呢一站"}改用「${plain(s.title)}」${was ? `（本來係「${was}」）` : ""}`);
      // the stop moved, so the legs either side of it are no longer right
      refreshTransit(day, [ui, ui + 1]);
    }));

    document.querySelectorAll("[data-altout]").forEach(el => el.addEventListener("click", async ev => {
      ev.preventDefault(); ev.stopPropagation();
      const [ui, ai] = el.dataset.altout.split(":").map(Number);
      const r = unfoldAlt(day, ui, ai);
      if (!r) return;
      render();
      await saveNow(`將後備「${r.name}」抽返出嚟做獨立站`);
      refreshTransit(day, [r.at, r.at + 1]);
    }));

    document.querySelectorAll("[data-altdel]").forEach(el => el.addEventListener("click", async ev => {
      ev.preventDefault(); ev.stopPropagation();
      const [ui, ai] = el.dataset.altdel.split(":").map(Number);
      const units = toUnits(day.items);
      const s = units[ui] && units[ui].stop;
      const a = s && altsOf(s)[ai];
      if (!a) return;
      if (!confirm(`刪走後備「${altName(a)}」？`)) return;
      s.alts.splice(ai, 1);
      if (!s.alts.length) delete s.alts;
      day.items = fromUnits(units);
      render();
      await saveNow(`刪走後備「${altName(a)}」`);
    }));

    document.querySelectorAll("[data-segrefresh]").forEach(btn => btn.addEventListener("click", async e => {
      e.stopPropagation();
      const i = +btn.dataset.segrefresh;
      state.transitProblem = "";
      flash("重新計緊…", true);
      await refreshTransit(day, [i]);
      flash("已重新計");
    }));

    const recalc = $("#recalc");
    if (recalc) recalc.addEventListener("click", async () => {
      recalc.disabled = true;
      recalc.textContent = "問緊 Google…";
      const units = toUnits(day.items);
      const stale = units.map((u,i) => i).filter(i => i > 0 && units[i].stop && units[i].seg && units[i].seg.stale);
      // if nothing is flagged, redo the whole day rather than doing nothing
      const todo = stale.length ? stale : units.map((u,i) => i).filter(i => i > 0 && units[i].stop);
      state.transitProblem = "";
      await refreshTransit(day, todo);
    });

    const getratings = $("#getratings");
    if (getratings) getratings.addEventListener("click", async () => {
      getratings.disabled = true;
      getratings.textContent = "問緊 Google…";
      const stops = toUnits(day.items).map(u => u.stop).filter(Boolean);
      const { done, why } = await fetchRatings(stops, day.title);
      const btn = $("#getratings");
      if (btn && !done) btn.textContent = why ? "攞唔到：" + why : "呢一日冇再攞到新評分";
    });

    // manual retry — clears the "已試過" marks so a transient failure (quota,
    // network) can be attempted again rather than being remembered as "Google
    // doesn't know this place"
    const getmappoints = $("#getmappoints");
    if (getmappoints) getmappoints.addEventListener("click", () => {
      const stops = toUnits(day.items).map(u => u.stop).filter(Boolean);
      stops.forEach(s => { delete s.noGeo; if (state.geoTried) state.geoTried.delete(s); });
      state.geoProblem = "";
      autoGeocodeDay(day);
    });

    document.querySelectorAll("[data-insert]").forEach(btn =>
      btn.addEventListener("click", () => openInsertSheet(day, +btn.dataset.insert)));

    wireEditor(day);
    wireNoteEditor(day);
    wireDrag(day, line);
    document.querySelectorAll("[data-legrefresh]").forEach(b => b.addEventListener("click", async e => {
      e.stopPropagation();
      const which = b.dataset.legrefresh;
      const before = day[which] && day[which].text;
      flash("重新計緊…", true);
      if (await computeHotelLeg(day, which)){
        flash(day[which].text === before ? "計咗，結果一樣" : "已更新");
        saveNow("重新計咗酒店出入嘅交通", true);
      } else flash("計唔到，等陣再試");
    }));
    document.querySelectorAll("[data-advice]").forEach(b => b.addEventListener("click", async e => {
      e.stopPropagation();
      const key = b.dataset.advice;
      const cur = legOf(day, key).seg;
      if (cur && cur.advice){ openAdviceSheet(day, key, cur.advice); return; }
      if (state.readonly) return;
      b.disabled = true; b.outerHTML = elephantHtml("查緊點去、使唔使買定飛…", true);
      const a = await askAdvice(day, key);
      render();
      if (a) openAdviceSheet(day, key, a);
    }));
    document.querySelectorAll("[data-legmode]").forEach(b => b.addEventListener("click", e => {
      e.stopPropagation();
      const which = b.dataset.legmode;
      openModeSheet(day[which] && day[which].prefer, async m => {
        day[which] = Object.assign({}, day[which] || {}, { prefer: m, key: "" });
        if (await computeHotelLeg(day, which)) await saveNow("改咗酒店出入嘅交通方式");
      });
    }));
    document.querySelectorAll("[data-segmode]").forEach(b => b.addEventListener("click", e => {
      e.stopPropagation();
      const i = +b.dataset.segmode;
      const units = toUnits(day.items);
      const seg = units[i] && units[i].seg;
      if (!seg) return;
      openModeSheet(seg.prefer, async m => {
        units[i].seg = Object.assign({}, seg, { prefer: m === "auto" ? undefined : m });
        day.items = fromUnits(units);
        state.transitProblem = "";
        await refreshTransit(day, [i]);
        await saveNow("改咗交通方式");
      });
    }));
    setTimeout(() => { if (state.view === day.id) autoTransit(day); }, 0);
    setTimeout(() => { if (state.view === day.id) backfillBriefs(day); }, 1500);
  }

  // ---------- insert a place or a note at an exact spot ----------
  async function insertAt(day, pos, what){
    const units = toUnits(day.items);
    const at = Math.max(0, Math.min(pos, units.length));
    if (what === "note"){
      units.splice(at, 0, { seg:null, stop:null, note: blankNote() });
    } else {
      // a place dropped into the middle invalidates the leg into it AND the leg
      // into whatever now follows; flag both rather than showing stale numbers.
      // No lookup yet — it has no name to look up until they type one.
      units.splice(at, 0, { seg:{ kind:"connector", html:"", stale:true }, stop: blankStop() });
      const after = units[at + 1];
      if (after && after.stop && after.seg) after.seg = Object.assign({}, after.seg, { stale:true });
    }
    day.items = fromUnits(units);
    syncMapPoints(day);
    state.open.clear();
    state.open.add(day.id + ":" + at);
    render();
    const inp = document.querySelector('[data-editor] [data-f="title"], [data-noteeditor] [data-nf="text"]');
    if (inp){ inp.focus(); inp.scrollIntoView({ block:"center", behavior:"smooth" }); }
    await saveNow(what === "note" ? "加咗一個 note" : "加咗一個新地點");
  }

  // Adding a place used to drop a blank card with an empty name field. Now
  // the sheet itself searches Google, and shows well-rated places to eat or
  // see within a short walk of the stops either side — real places with
  // real ratings, one tap to add.
  const nearbyCache = new Map();
  async function nearbyFor(pt, kind, skip){
    const k = `${kind}:${pt.lat.toFixed(4)},${pt.lng.toFixed(4)}`;
    if (nearbyCache.has(k)) return nearbyCache.get(k);
    try {
      const res = await fetch(SUPABASE_URL + "/functions/v1/trip-import", { method: "POST", headers: sbHeaders(),
        body: JSON.stringify({ mode: "nearby", lat: pt.lat, lng: pt.lng, kind, skip, lang: "zh-TW" }) });
      const r = await res.json();
      const list = r && r.ok !== false && Array.isArray(r.places) ? r.places : [];
      nearbyCache.set(k, list);
      return list;
    } catch (_){ return []; }
  }
  const PLACE_KIND = { cafe:"咖啡店", bakery:"麵包甜品", bar:"酒吧", meal_takeaway:"外賣小食", restaurant:"餐廳",
    museum:"博物館", park:"公園", art_gallery:"美術館", shopping_mall:"商場", department_store:"百貨公司", zoo:"動物園",
    aquarium:"水族館", amusement_park:"遊樂園", place_of_worship:"寺廟神社", church:"教堂", hindu_temple:"寺廟", tourist_attraction:"景點" };
  // straight-line distance in metres, and how to say it on a card
  function metersBetween(a, b){
    if (!a || !b || !Number.isFinite(Number(a.lat)) || !Number.isFinite(Number(b.lat)) || b.lat === "" || b.lat == null) return NaN;
    const R = 6371000, r = x => x * Math.PI / 180, la = Number(a.lat), lb = Number(b.lat);
    const h = Math.sin(r(lb - la) / 2) ** 2 + Math.cos(r(la)) * Math.cos(r(lb)) * Math.sin(r(Number(b.lng) - Number(a.lng)) / 2) ** 2;
    return Math.round(2 * R * Math.asin(Math.sqrt(h)));
  }
  function distLabel(m, from){
    const d = m < 1000 ? `${Math.max(10, Math.round(m / 10) * 10)} 米` : `${(m / 1000).toFixed(m < 10000 ? 1 : 0)} 公里`;
    const walk = Math.max(1, Math.round(m * 1.3 / 80));   // streets aren't straight
    return `離「${from}」約 ${d}${walk <= 25 ? `・行 ${walk} 分鐘` : ""}`;

    const facts = [kind, price, p.walk && !p.distText ? `行 ${p.walk} 分鐘` : ""].filter(Boolean).map(esc);

  function elephantHtml(text, small){
    return `<div class="eleload${small ? " small" : ""}" role="status">${elephantSvg()}<span>${esc(text)}</span></div>`;
  }
  const SUG_KIND = { see: "景點", shop: "購物地方", eat: "餐廳" };
  const MUST_LABEL = { see: "必睇", shop: "必買", eat: "必食" };
  const sugCache = new Map();
  async function suggestFor(anchors, kind, skip, want = "", prefs = {}){
    const k = kind + ":" + want + ":" + JSON.stringify(prefs) + ":" + anchors.map(a => `${a.lat.toFixed(4)},${a.lng.toFixed(4)}`).join("|");

    try {

        body: JSON.stringify({ mode: "suggest-add", kind, skip, want, prefs, points: anchors.map(a => ({ lat: a.lat, lng: a.lng, name: a.name })) }) }), 60000, null);
      const r = res ? await res.json() : null;
      const list = r && r.ok !== false && Array.isArray(r.places) ? r.places : [];
      if (list.length) sugCache.set(k, list);

    } catch (_){ return []; }
  }
  function suggestRowHtml(p, k, kind){
    const label = (p.types || []).map(t => PLACE_KIND[t]).find(Boolean) || SUG_KIND[kind] || "";

      <div class="sc-facts">${[label ? esc(label) : "",
        Number.isFinite(p.rating) ? `${icon("star")}<b>${p.rating.toFixed(1)}</b>（${(p.ratingCount || 0).toLocaleString()} 人評）` : "",
        Number.isFinite(p.price) && p.price > 0 ? "$".repeat(p.price) : ""].filter(Boolean).join("・")}</div>

  // a line on what a place is (and, for food, what to order), from its own

  async function fetchBrief(st, kind){
    if (!st.placeId) return null;
    try {
      const res = await withTimeout(fetch(SUPABASE_URL + "/functions/v1/trip-import", { method: "POST", headers: sbHeaders(),

      const r = res ? await res.json() : null;
      return r && r.ok !== false && r.brief ? r.brief : null;
    } catch (_){ return null; }
  }
  function applyBrief(st, b, kind){
    if (!b) return false;
    const label = MUST_LABEL[b.food ? "eat" : kind] || "推介";

    if (b.food && st.type !== "eat") st.type = "eat";

  const briefTried = new Set();

    if (!todo.length) return;
    briefBusy = true;
    let got = 0;
    try {
      todo.forEach(st => briefLoading.add(st));

      await Promise.all(todo.map(async st => {
        briefTried.add(st.placeId);
        const b = await fetchBrief(st);
        st.briefTried = true;
        briefLoading.delete(st);
        if (applyBrief(st, b)) got++;
      }));
      todo.forEach(st => briefLoading.delete(st));
    } finally { briefBusy = false; }
    if (state.view === day.id) render();
    if (got) await saveNow(`幫 ${got} 個地點寫咗簡介`, true);
  }
  function openInsertSheet(day, pos){

      };
      if (go) go.addEventListener("click", run);
      if (want) want.addEventListener("keydown", e => { if (e.key === "Enter"){ e.preventDefault(); run(); } });
    });
  }
  // A place picked from search or 「附近」 arrives with its Google id, so it
  // needs no editing: photo, hours and local name fill in behind, and the
  // legs either side are timed as soon as it lands.
  async function insertPlaceAt(day, pos, p, kind){
    const units = toUnits(day.items);
    const at = Math.max(0, Math.min(pos, units.length));
    const st = Object.assign(blankStop(), { title: p.name, placeId: p.placeId || "", type: kind === "eat" ? "eat" : "normal",
      lat: Number.isFinite(p.lat) ? p.lat : null, lng: Number.isFinite(p.lng) ? p.lng : null });
    if (Number.isFinite(p.rating)){ st.rating = p.rating; st.ratingCount = p.ratingCount; }
    if (p.name_zh && p.name_zh !== p.name){ st.title = p.name_zh; st.kr = p.name; }
    if (p.what || p.mustTry) st.desc = [p.what, p.mustTry ? `${MUST_LABEL[kind] || "推介"}：${p.mustTry}` : ""].filter(Boolean).join("\n");
    units.splice(at, 0, { seg: { kind:"connector", html:"", stale:true }, stop: st });
    for (let j = at + 1; j < units.length; j++) if (units[j].stop){ if (units[j].seg) units[j].seg = Object.assign({}, units[j].seg, { stale:true }); break; }
    day.items = fromUnits(units);
    syncMapPoints(day);
    render();
    await saveNow(`加咗「${p.name}」`);
    flash(`加咗「${p.name}」，計緊交通同攞相…`);
    {
      const us = toUnits(day.items), k = us.findIndex(u => u.stop === st);
      let nx = -1; for (let j = k + 1; j < us.length; j++) if (us[j].stop){ nx = j; break; }
      state.transitProblem = "";
      refreshTransit(day, [k, nx].filter(x => x > 0));
    }
    if (!plain(st.desc)) briefLoading.add(st);
    if (state.view === day.id) render();
    try { await Promise.all([enrichHours(st), enrichPhoto(st, p.name), enrichLocalName(st),
      plain(st.desc) ? null : fetchBrief(st, kind).then(b => applyBrief(st, b, kind))]); } catch (_){}
    briefLoading.delete(st);
    if (state.view === day.id) render();
    await saveNow(`補返「${p.name}」嘅相同介紹`);
  }

  function wireNoteEditor(day){
    const box = document.querySelector("[data-noteeditor]");
    if (!box) return;
    const i = +box.dataset.noteeditor;
    const u = toUnits(day.items)[i];
    if (!u || !u.note) return;

    const ta = box.querySelector('[data-nf="text"]');
    if (ta) ta.addEventListener("input", () => {
      u.note.text = ta.value;
      const shown = box.closest(".notecard").querySelector(".notetext");
      if (shown){
        shown.textContent = ta.value.trim() || "寫低你想記住嘅嘢…";
        shown.classList.toggle("empty", !ta.value.trim());
      }
      saveSoon("改咗一個 note");
    });

    box.querySelectorAll("[data-nact]").forEach(btn => btn.addEventListener("click", async () => {
      if (btn.dataset.nact === "close"){ state.open.clear(); render(); return; }
      if (btn.dataset.nact === "remove"){
        if (!confirm("刪走呢個 note？")) return;
        const units = toUnits(day.items);
        units.splice(i, 1);
        day.items = fromUnits(units);
        state.open.clear();
        render();
        await saveNow("刪走咗一個 note");
      }
    }));
  }

  function wireEditor(day){
    const box = document.querySelector("[data-editor]");
    if (!box) return;
    const i = +box.dataset.editor;
    const units = toUnits(day.items);
    const u = units[i];
    const s = u.stop;

    // plain field edits
    box.querySelectorAll("[data-f]").forEach(el => {
      const evt = el.tagName === "SELECT" ? "change" : "input";
      el.addEventListener(evt, () => {
        s[el.dataset.f] = el.value;
        if (el.dataset.f === "type" || el.dataset.f === "title"){
          const nameEl = box.closest(".stopcard").querySelector(".stopname");
          if (el.dataset.f === "title" && nameEl){
            nameEl.textContent = el.value.trim() || "未改名嘅地點";
            nameEl.classList.toggle("unnamed", !el.value.trim());
          }
          if (el.dataset.f === "type"){
            const node = box.closest(".stop").querySelector(".node");
            if (node) node.dataset.type = el.value;
          }
        }
        saveSoon("改咗「" + (s.title || "一個地點") + "」");
      });
    });

    // google place autocomplete on the name field
    const titleInput = box.querySelector('[data-f="title"]');
    const sugBox = box.querySelector("[data-suggest]");
    let sugTimer = null;
    titleInput.addEventListener("input", () => {
      clearTimeout(sugTimer);
      const q = titleInput.value.trim();
      if (q.length < 2){ sugBox.innerHTML = ""; return; }
      sugTimer = setTimeout(async () => {
        sugBox.innerHTML = `<p class="hint">搵緊…</p>`;
        try {
          const r = await callAi({ action:"place-search", query:q });
          if (r.ok === false){ sugBox.innerHTML = `<p class="hint">${esc(r.message)}</p>`; return; }
          if (!r.places || !r.places.length){ sugBox.innerHTML = `<p class="hint">搵唔到，照用你打嘅名就得。</p>`; return; }
          sugBox.innerHTML = r.places.map((p,ix)=>`
            <button class="suggest-item" data-p="${ix}">
              <div class="n">${esc(p.name)}</div><div class="a">${esc(p.address)}</div>
            </button>`).join("");
          sugBox.querySelectorAll("[data-p]").forEach(b => b.addEventListener("click", async () => {
            const p = r.places[+b.dataset.p];
            // a new place: the old local name belonged to whatever was here before
            s.title = p.name; s.placeId = p.placeId; s.kr = "";
            if (Number.isFinite(p.lat)) s.lat = p.lat;
            if (Number.isFinite(p.lng)) s.lng = p.lng;
            // text search already returned these for free — no reason to make
            // the user press the separate "攞評分" button for a place they
            // just picked off Google themselves
            if (Number.isFinite(p.rating)) s.rating = p.rating;
            if (Number.isFinite(p.ratingCount)) s.ratingCount = p.ratingCount;
            s.mapUrl = `https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(p.name)}`;
            titleInput.value = p.name;
            sugBox.innerHTML = `<p class="hint">已揀「${esc(p.name)}」，搵緊相同營業時間…</p>`;
            // the local name is fetched at the moment of choosing — search
            // results only carry Google's English name
            await Promise.all([enrichHours(s), enrichPhoto(s, p.name), enrichLocalName(s)]);
            await saveNow("加咗「" + s.title + "」");
            render();
          }));
        } catch (e){ sugBox.innerHTML = `<p class="hint">搵唔到：${esc(e.message)}</p>`; }
      }, 420);
    });

    // ---------- adding a backup ----------
    // Same Google lookup as the name field, so a backup arrives with its own
    // place id, coordinates and rating — which is what lets it be swapped in
    // later without losing its map links.
    const altQ = box.querySelector("[data-altq]");
    const altSug = box.querySelector("[data-altsug]");
    if (altQ && altSug){
      let altTimer = null;
      altQ.addEventListener("input", () => {
        clearTimeout(altTimer);
        const q = altQ.value.trim();
        if (q.length < 2){ altSug.innerHTML = ""; return; }
        altTimer = setTimeout(async () => {
          altSug.innerHTML = `<p class="hint">搵緊…</p>`;
          try {
            const r = await callAi({ action:"place-search", query:q });
            if (r.ok === false){ altSug.innerHTML = `<p class="hint">${esc(r.message)}</p>`; return; }
            if (!r.places || !r.places.length){ altSug.innerHTML = `<p class="hint">搵唔到呢個地方。</p>`; return; }
            altSug.innerHTML = r.places.map((p, ix) => `
              <button class="suggest-item" data-ap="${ix}">
                <div class="n">${esc(p.name)}</div><div class="a">${esc(p.address)}</div>
              </button>`).join("");
            altSug.querySelectorAll("[data-ap]").forEach(b => b.addEventListener("click", async () => {
              const p = r.places[+b.dataset.ap];
              const alt = { kind:"stop", title: p.name, kr:"", desc:"",
                mapUrl: `https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(p.name)}`,
                placeId: p.placeId, photoUrl:"" };
              if (Number.isFinite(p.lat)) alt.lat = p.lat;
              if (Number.isFinite(p.lng)) alt.lng = p.lng;
              if (Number.isFinite(p.rating)) alt.rating = p.rating;
              if (Number.isFinite(p.ratingCount)) alt.ratingCount = p.ratingCount;
              delete alt.kind;                       // it is a place, not a row
              await enrichLocalName(alt);
              if (!Array.isArray(s.alts)) s.alts = [];
              s.alts.push(alt);
              altQ.value = ""; altSug.innerHTML = "";
              render();
              await saveNow(`加咗後備「${p.name}」`);
            }));
          } catch (e){ altSug.innerHTML = `<p class="hint">搵唔到：${esc(e.message)}</p>`; }
        }, 420);
      });
    }

    // actions
    box.querySelectorAll("[data-act]").forEach(btn => btn.addEventListener("click", async () => {
      const act = btn.dataset.act;

      if (act === "close"){ state.open.clear(); render(); return; }

      if (act === "altup"){
        const was = swapAlt(s, +btn.dataset.ai);
        day.items = fromUnits(units);
        syncMapPoints(day);
        render();
        await saveNow(`${plain(s.time) || "呢一站"}改用「${plain(s.title)}」${was ? `（本來係「${was}」）` : ""}`);
        refreshTransit(day, [i, i + 1]);
        return;
      }

      if (act === "altdel"){
        const ai = +btn.dataset.ai;
        const a = altsOf(s)[ai];
        if (!a) return;
        if (!confirm(`刪走後備「${altName(a)}」？`)) return;
        s.alts.splice(ai, 1);
        if (!s.alts.length) delete s.alts;
        render();
        await saveNow(`刪走後備「${altName(a)}」`);
        return;
      }

      if (act === "altout"){
        const r = unfoldAlt(day, i, +btn.dataset.ai);
        if (!r) return;
        state.open.clear();
        render();
        await saveNow(`將後備「${r.name}」抽返出嚟做獨立站`);
        refreshTransit(day, [r.at, r.at + 1]);
        return;
      }

      if (act === "foldpick"){ openFoldPicker(day, i); return; }

      if (act === "remove"){
        if (!confirm("刪走「" + (s.title || "呢個地點") + "」？")) return;
        units.splice(i,1);
        day.items = fromUnits(units);
        syncMapPoints(day);
        state.open.clear();
        render();
        await saveNow("刪走咗「" + (s.title || "一個地點") + "」");
        refreshTransit(day, [i]);          // the stop that closed the gap
        return;
      }

      if (act === "up" || act === "down"){
        const j = act === "up" ? i-1 : i+1;
        if (j < 0 || j >= units.length) return;
        const tmp = units[i]; units[i] = units[j]; units[j] = tmp;
        day.items = fromUnits(units);
        state.open.clear(); state.open.add(day.id + ":" + j);
        render();
        await saveNow("調整咗次序");
        refreshTransit(day, [i, j, Math.max(i,j)+1]);
        return;
      }

      if (act === "move"){ openMovePicker({ kind:"day", day, index:i }); return; }

      if (act === "findphoto"){ openPhotoPicker(s); return; }
    }));
  }

  // ---------- move a stop to another day, or to/from a bookmark board ----------
  // source: { kind:"day", day, index } | { kind:"board", board, index }
  // Pulls several stops out of a day at once, keeping their original relative
  // order. Splicing must go highest-index-first so removing one doesn't shift
  // the position of the next one still waiting to be removed.
  function detachStops(day, indices){
    const units = toUnits(day.items);
    const sorted = [...indices].sort((a, b) => a - b);
    const moving = sorted.map(i => units[i].stop);
    [...sorted].sort((a, b) => b - a).forEach(i => units.splice(i, 1));
    day.items = fromUnits(units);
    syncMapPoints(day);
    return moving;
  }

  // Same destinations as the single-item move picker, but for a batch —
  // "同時移動幾個行程去另一日" was a real gap: only one stop could be relocated
  // at a time, so reshuffling a multi-stop chunk meant repeating the picker.
  function openMultiMovePicker(day, indices){
    const count = indices.length;
    const days = state.snapshot.days || [];
    const boards = state.snapshot.boards || [];
    openSheet(`
      <h3>搬去邊度？</h3>
      <p class="sec-sub">揀咗 ${count} 個地點，一齊搬過去，順序唔會變。</p>
      ${days.length ? `
        <p class="picker-label">行程日子</p>
        <div class="daypick">
          ${days.map(d => {
            const here = d.id === day.id;
            return `<button data-today="${d.id}" ${here ? "disabled" : ""} style="--lc:${dayColorVar(d.id)}">
              <span class="bullet"></span>
              <span class="dcode">Day ${d.id.replace('day','')}</span>
              <span>${esc(d.title)}${here?"（而家喺度）":""}</span>
            </button>`;
          }).join("")}
        </div>` : ""}
      <p class="picker-label">心水清單</p>
      <div class="daypick">
        ${boards.map(b => `<button data-toboard="${b.id}" style="--lc:var(--bookmark)">
          <span class="bullet"></span><span class="dcode">${icon("pin")}</span><span>${esc(b.name)}</span>
        </button>`).join("")}
        <button data-newboard style="--lc:var(--bookmark)">
          <span class="bullet"></span><span class="dcode">＋</span><span>開個新清單</span>
        </button>
      </div>
    `, sheet => {
      sheet.querySelectorAll("[data-today]").forEach(b => b.addEventListener("click", async () => {
        const target = dayById(b.dataset.today);
        const moving = detachStops(day, indices);
        const tUnits = toUnits(target.items);
        const landedFrom = tUnits.length;
        moving.forEach(st => { st.kind = "stop"; tUnits.push({ seg:null, stop:st }); });
        target.items = fromUnits(tUnits);
        syncMapPoints(target);
        closeLayer();
        state.selectMode = null;
        state.open.clear();
        state.view = target.id;
        render();
        await saveNow(`搬咗 ${count} 個地點去 ${target.title}`);
        refreshTransit(target, Array.from({ length: moving.length }, (_, k) => landedFrom + k));
        refreshTransit(day, [Math.min(...indices)]);
      }));

      sheet.querySelectorAll("[data-toboard]").forEach(b => b.addEventListener("click", async () => {
        const target = boardById(b.dataset.toboard);
        const moving = detachStops(day, indices);
        moving.forEach(st => target.items.push(st));
        closeLayer();
        state.selectMode = null;
        state.open.clear();
        state.view = target.id;
        render();
        await saveNow(`搬咗 ${count} 個地點去清單「${target.name}」`);
      }));

      const newBoardBtn = sheet.querySelector("[data-newboard]");
      if (newBoardBtn) newBoardBtn.addEventListener("click", async () => {
        state.snapshot.boards = state.snapshot.boards || [];
        const b = newBoard(`清單 ${state.snapshot.boards.length + 1}`);
        state.snapshot.boards.push(b);
        const moving = detachStops(day, indices);
        moving.forEach(st => b.items.push(st));
        closeLayer();
        state.selectMode = null;
        state.open.clear();
        state.view = b.id;
        state.renamingBoard = b.id;
        render();
        await saveNow(`開咗個新清單「${b.name}」，${count} 個地點搬咗入去`);
      });
    });
  }

  function openMovePicker(source){
    const days = state.snapshot.days || [];
    const boards = state.snapshot.boards || [];
    const stop = source.kind === "day" ? toUnits(source.day.items)[source.index].stop : source.board.items[source.index];
    const name = plain(stop.title) || "呢個地點";

    // takes the stop out of wherever it currently lives, fixing up what's left behind
    function detach(){
      if (source.kind === "day"){
        const units = toUnits(source.day.items);
        const moving = units[source.index];
        units.splice(source.index, 1);
        source.day.items = fromUnits(units);
        return moving.stop;
      }
      const [moving] = source.board.items.splice(source.index, 1);
      return moving;
    }
    function afterDetach(){
      if (source.kind === "day"){ syncMapPoints(source.day); refreshTransit(source.day, [source.index]); }
    }

    openSheet(`
      <h3>搬去邊度？</h3>
      <p class="sec-sub">「${esc(name)}」揀個新位置，之後隨時都可以再搬。</p>
      ${days.length ? `
        <p class="picker-label">行程日子</p>
        <div class="daypick">
          ${days.map(d => {
            const here = source.kind === "day" && source.day.id === d.id;
            return `<button data-today="${d.id}" ${here?"disabled":""} style="--lc:${dayColorVar(d.id)}">
              <span class="bullet"></span>
              <span class="dcode">Day ${d.id.replace('day','')}</span>
              <span>${esc(d.title)}${here?"（而家喺度）":""}</span>
            </button>`;
          }).join("")}
        </div>` : ""}
      <p class="picker-label">心水清單</p>
      <div class="daypick">
        ${boards.map(b => {
          const here = source.kind === "board" && source.board.id === b.id;
          return `<button data-toboard="${b.id}" ${here?"disabled":""} style="--lc:var(--bookmark)">
            <span class="bullet"></span><span class="dcode">${icon("pin")}</span>
            <span>${esc(b.name)}${here?"（而家喺度）":""}</span>
          </button>`;
        }).join("")}
        <button data-newboard style="--lc:var(--bookmark)">
          <span class="bullet"></span><span class="dcode">＋</span><span>開個新清單</span>
        </button>
      </div>
    `, sheet => {
      sheet.querySelectorAll("[data-today]").forEach(b => b.addEventListener("click", async () => {
        const target = dayById(b.dataset.today);
        const movingStop = detach();
        movingStop.kind = "stop";
        const tUnits = toUnits(target.items);
        tUnits.push({ seg: null, stop: movingStop });
        target.items = fromUnits(tUnits);
        syncMapPoints(target);
        const landedAt = tUnits.length - 1;
        closeLayer();
        state.open.clear();
        state.view = target.id;
        render();
        await saveNow(`「${name}」搬咗去 ${target.title}`);
        afterDetach();
        refreshTransit(target, [landedAt]);
      }));

      sheet.querySelectorAll("[data-toboard]").forEach(b => b.addEventListener("click", async () => {
        const target = boardById(b.dataset.toboard);
        const movingStop = detach();
        target.items.push(movingStop);
        closeLayer();
        state.open.clear();
        state.view = target.id;
        render();
        await saveNow(`「${name}」搬咗去清單「${target.name}」`);
        afterDetach();
      }));

      const newBoardBtn = sheet.querySelector("[data-newboard]");
      if (newBoardBtn) newBoardBtn.addEventListener("click", async () => {
        state.snapshot.boards = state.snapshot.boards || [];
        const b = newBoard(`清單 ${state.snapshot.boards.length + 1}`);
        state.snapshot.boards.push(b);
        const movingStop = detach();
        b.items.push(movingStop);
        closeLayer();
        state.open.clear();
        state.view = b.id;
        state.renamingBoard = b.id;
        render();
        await saveNow(`開咗個新清單「${b.name}」，「${name}」搬咗入去`);
        afterDetach();
      });
    });
  }

  // A full day-to-day swap — unlike AI 諗行程 (which edits individual stops
  // and can leave the title mismatched, see dayTitleCardsHtml above), this
  // trades EVERYTHING a day's content is made of in one shot, so the result
  // is always internally consistent. `id`/`num`/`date` stay put (the slot on
  // the calendar doesn't move), only the content living in that slot does.
  // Items carry their own connector `seg` data, so segments between stops
  // stay correct automatically — the two days' internal sequencing never
  // touched each other, only which slot they're rendered under changed.
  function swapDayContent(a, b){
    const keys = ["title", "desc", "shortTag", "badges", "items", "mapPoints", "mapCap"];
    for (const k of keys){
      const tmp = a[k];
      a[k] = b[k];
      b[k] = tmp;
    }
    syncMapPoints(a);
    syncMapPoints(b);
  }

  function openDaySwapPicker(day){
    const days = (state.snapshot.days || []).filter(d => d.id !== day.id);
    openSheet(`
      <h3>同邊一日成日對調？</h3>
      <p class="sec-sub">會將 Day ${day.id.replace('day','')}（${esc(day.date)}）同揀嘅嗰日，成日內容（標題、簡介、全部地點）完全對調；日期同 Day 編號本身唔會變，淨係內容搬咗位。</p>
      <div class="daypick">
        ${days.map(d => `<button data-swapto="${d.id}" style="--lc:${dayColorVar(d.id)}">
          <span class="bullet"></span>
          <span class="dcode">Day ${d.id.replace('day','')}</span>
          <span>${esc(d.date)} · ${esc(d.title)}</span>
        </button>`).join("")}
      </div>
    `, sheet => {
      sheet.querySelectorAll("[data-swapto]").forEach(b => b.addEventListener("click", async () => {
        const other = dayById(b.dataset.swapto);
        if (!other) return;
        const aNum = day.id.replace('day',''), bNum = other.id.replace('day','');
        swapDayContent(day, other);
        closeLayer();
        state.open.clear();
        render();
        await saveNow(`Day ${aNum} 同 Day ${bNum} 成日行程完全對調咗`);
      }));
    });
  }

  // Copy (not move) a bookmarked place into a day: the list keeps its copy so
  // the same place can go into several days, or stay parked for later. The
  // AI's suggested day is flagged rather than pre-selected — it's a hint, and
  // the list is still in trip order so nothing jumps around.
  function openCopyPicker(board, index){
    const item = board.items[index];
    if (!item) return;
    const name = plain(item.title) || "呢個地點";
    const days = state.snapshot.days || [];
    const suggested = item.suggestDayId && dayById(item.suggestDayId) ? item.suggestDayId : "";

    openSheet(`
      <h3>複製去邊一日？</h3>
      <p class="sec-sub">「${esc(name)}」會複製一份入去嗰日，清單度呢個仍然留低，之後仲可以再複製去第二日。</p>
      <div class="daypick">
        ${days.map(d => `
          <button data-copyday="${d.id}" style="--lc:${dayColorVar(d.id)}">
            <span class="bullet"></span>
            <span class="dcode">Day ${d.id.replace('day','')}</span>
            <span>${esc(d.title)}${d.id === suggested ? ` <b class="sugg">AI 話呢日順路</b>` : ""}</span>
          </button>`).join("")}
      </div>
    `, sheet => {
      sheet.querySelectorAll("[data-copyday]").forEach(b => b.addEventListener("click", async () => {
        const day = dayById(b.dataset.copyday);
        if (!day) return;
        const copy = Object.assign(blankStop(), JSON.parse(JSON.stringify(item)), { kind:"stop" });
        delete copy.aiRun;            // the badge belongs to the bookmark list, not the itinerary
        delete copy.suggestDayId;
        const units = toUnits(day.items);
        units.push({ seg: null, stop: copy });
        day.items = fromUnits(units);
        syncMapPoints(day);
        const landedAt = units.length - 1;
        closeLayer();
        render();
        await saveNow(`「${name}」複製咗去 ${day.title}（清單度都仲留低）`);
        refreshTransit(day, [landedAt]);
      }));
    });
  }

  // Fallbacks for the hero and the AI brief when a trip hasn't filled them in.
  // Every one is derived from THIS trip's own meta/days — they used to be
  // fixed strings describing one particular trip (a 7-person family going to
  // one city on set dates), which then showed up on every other trip.
  function formatEyebrow(dateStart, dateEnd){
    const a = String(dateStart || "").split("-"), b = String(dateEnd || "").split("-");
    if (a.length < 3 || b.length < 3) return "";
    return `${a[1]}.${a[2]} — ${b[1]}.${b[2]} · ${a[0]}`;
  }
  // ---------- the trip as a boarding pass (same language as the home page) ----------
  const CITY_CODES = [
    [/首爾|首尔|서울|seoul/i, "SEL", "首爾"], [/東京|东京|tokyo/i, "TYO", "東京"],
    [/台北|臺北|taipei/i, "TPE", "台北"],   [/大阪|osaka/i, "OSA", "大阪"],
    [/京都|kyoto/i, "UKY", "京都"],          [/釜山|부산|busan/i, "PUS", "釜山"],
    [/福岡|fukuoka/i, "FUK", "福岡"],        [/札幌|sapporo|北海道|hokkaido/i, "SPK", "札幌"],
    [/沖繩|沖縄|okinawa/i, "OKA", "沖繩"],    [/名古屋|nagoya/i, "NGO", "名古屋"],
    [/濟州|济州|제주|jeju/i, "CJU", "濟州"],  [/曼谷|bangkok/i, "BKK", "曼谷"],
    [/新加坡|singapore/i, "SIN", "新加坡"],  [/台中|taichung/i, "RMQ", "台中"],
    [/高雄|kaohsiung/i, "KHH", "高雄"],      [/倫敦|london/i, "LON", "倫敦"],
    [/巴黎|paris/i, "PAR", "巴黎"],
  ];
  function tripCity(snap){
    const m = (snap && snap.meta) || {};
    const hay = [m.destinationLocal, m.title].filter(Boolean).join(" ");
    for (const [re, code, zh] of CITY_CODES) if (re.test(hay)) return { code, zh };
    const latin = String(m.destinationLocal || "").replace(/[^A-Za-z]/g, "").toUpperCase();
    return { code: latin.length >= 3 ? latin.slice(0, 3) : "", zh: m.destinationLocal || "" };
  }
  function passRouteHtml(snap){
    const c = tripCity(snap);
    if (!c.code) return "";
    return `<div class="tp-route" aria-label="由香港去${esc(c.zh)}">
      <div class="tp-pt"><span class="tp-code">HKG</span><span class="tp-city">香港</span></div>
      <div class="tp-flight" aria-hidden="true"><span class="tp-arc"></span>${icon("plane")}</div>
      <div class="tp-pt to"><span class="tp-code">${esc(c.code)}</span><span class="tp-city">${esc(c.zh)}</span></div>
    </div>`;
  }
  function passStubHtml(snap){
    const m = (snap && snap.meta) || {};
    const WDS = ["日","一","二","三","四","五","六"];
    const cell = (lbl, iso) => {
      const [y, mo, da] = String(iso || "").split("-").map(Number);
      if (!y) return "";
      return `<div class="tp-cell"><span class="tp-lbl">${lbl}</span><b>${String(mo).padStart(2,"0")}.${String(da).padStart(2,"0")}</b><small>星期${WDS[new Date(y, mo - 1, da).getDay()]}</small></div>`;
    };
    const n = ((snap && snap.days) || []).length;
    let status = "", cls = "";
    if (m.dateStart){
      const today = new Date(); const t = `${today.getFullYear()}-${String(today.getMonth()+1).padStart(2,"0")}-${String(today.getDate()).padStart(2,"0")}`;
      const diff = (a, b) => Math.round((Date.parse(b + "T00:00:00Z") - Date.parse(a + "T00:00:00Z")) / 86400000);
      const end = m.dateEnd || m.dateStart;
      if (t < m.dateStart){ const k = diff(t, m.dateStart); status = k === 1 ? "聽日出發" : `${k} 日後出發`; cls = "soon"; }
      else if (t <= end){ status = `旅程中 · 第 ${diff(m.dateStart, t) + 1} 日`; cls = "live"; }
      else { status = "已完成"; cls = "done"; }
    }
    const cells = cell("出發", m.dateStart) + cell("回程", m.dateEnd) + (n ? `<div class="tp-cell"><span class="tp-lbl">行程</span><b>${n}</b><small>日</small></div>` : "");
    if (!cells) return "";
    return `<div class="tp-stub">${cells}${status ? `<span class="tp-status ${cls}">${esc(status)}</span>` : ""}</div>`;
  }
  function defaultEyebrow(snap){
    const m = (snap && snap.meta) || {};
    return formatEyebrow(m.dateStart, m.dateEnd);
  }
  function defaultFacts(snap){
    const n = ((snap && snap.days) || []).length;
    return n ? [`${n} 日行程`] : [];
  }
  function defaultTripBrief(snap){
    const m = (snap && snap.meta) || {};
    const where = (m.destinationLocal || m.title || "").trim();
    const when = (m.dateStart && m.dateEnd) ? `（${m.dateStart} 至 ${m.dateEnd}）` : "";
    return `你係一個廣東話（香港口語）旅遊助理，幫緊一次${where ? "去 " + where + " " : ""}嘅旅行${when}。`;
  }

  // ---------- editing the home page ----------
  // One generic sheet drives every section editor, so adding a field is a line
  // of config rather than another bespoke form. Types:
  //   text / textarea — a single value
  //   lines           — a list, one entry per line (far easier to edit on a
  //                     phone than a repeatable row widget, and it round-trips)
  // A day's own title/intro/tags used to be baked into the seed data with no
  // way to touch them — "更改行程所有嘢都可以 edit 包括嗰一日行程嘅名啊內容 tag"
  // asked for exactly this. Tags keep their colour variant round-trip safe by
  // encoding it as a leading marker the user can type themselves.
  function openDayInfoEditSheet(day){
    const badgeLines = (day.badges || []).map(b => {
      const cls = b.cls || "badge";
      const prefix = cls.includes("warn") ? "!" : cls.includes("note") ? "*" : "";
      return prefix + plain(b.text);
    }).join("\n");
    openEditSheet(`改「${day.title || "呢一日"}」`, "", [
      { key:"shortTag", label:"上面日子切換條嘅短標籤（例如「舊城區」）", type:"text",
        value: day.shortTag || "", placeholder:"例如：舊城區" },
      { key:"title", label:"呢日標題", type:"text", value: day.title || "", placeholder:"例如：舊城區散步全日遊" },
      { key:"desc", label:"簡介", type:"textarea", rows:3, value: day.desc || "" },
      { key:"badges", label:"Tag（一行一個；開頭加 ! 會變黃色提醒，加 * 會變另一種底色）", type:"lines", rows:5,
        value: badgeLines },
    ], async out => {
      day.shortTag = out.shortTag || "";
      day.title = out.title || day.title;
      day.desc = out.desc || "";
      day.badges = (out.badges || []).map(line => {
        let cls = "badge", text = line;
        if (text.startsWith("!")){ cls = "badge warn"; text = text.slice(1).trim(); }
        else if (text.startsWith("*")){ cls = "badge note"; text = text.slice(1).trim(); }
        return { cls, text };
      });
      render();
      await saveNow(`改咗「${day.title}」嘅資料`);
    });
  }

  function openEditSheet(title, sub, fields, onSave){
    openSheet(`
      <h3>${esc(title)}</h3>
      ${sub ? `<p class="sec-sub">${esc(sub)}</p>` : ""}
      ${fields.map((f, i) => `
        <div class="field">
          <label>${esc(f.label)}</label>
          ${f.hint ? `<p class="fieldhint">${esc(f.hint)}</p>` : ""}
          ${f.type === "text"
            ? `<input class="input" data-ef="${i}" value="${esc(f.value || "")}" placeholder="${esc(f.placeholder || "")}">`
            : f.type === "select"
            ? `<select class="input" data-ef="${i}">${(f.options || []).map(o =>
                `<option value="${esc(o.value)}"${o.value === f.value ? " selected" : ""}>${esc(o.label)}</option>`).join("")}</select>`
            : `<textarea class="textarea" data-ef="${i}" rows="${f.rows || 4}" placeholder="${esc(f.placeholder || "")}">${esc(f.value || "")}</textarea>`}
        </div>`).join("")}
      <div class="editor-tools">
        <button class="btn" data-ecancel>取消</button>
        <button class="btn primary" data-esave>儲存</button>
      </div>
    `, sheet => {
      sheet.querySelector("[data-ecancel]").addEventListener("click", closeLayer);
      sheet.querySelector("[data-esave]").addEventListener("click", async () => {
        const out = {};
        fields.forEach((f, i) => {
          const raw = sheet.querySelector(`[data-ef="${i}"]`).value;
          out[f.key] = f.type === "lines"
            ? raw.split("\n").map(x => x.trim()).filter(Boolean)
            : raw.trim();
        });
        closeLayer();
        await onSave(out);
      });
    });
  }

  // The clothing list is stored as HTML (the seed data uses <b> for emphasis).
  // Users edit plain text with **bold** instead, so nothing they type is ever
  // injected as markup — the only tag that can come back out is <b>.
  function htmlToPlainish(html){
    return String(html || "")
      .replace(/<\/?b>/gi, "**")
      .replace(/<br\s*\/?>/gi, " ")
      .replace(/<[^>]+>/g, "")
      .replace(/&amp;/g, "&").replace(/&lt;/g, "<").replace(/&gt;/g, ">").replace(/&quot;/g, '"')
      .trim();
  }
  function plainishToHtml(text){
    return esc(String(text || "").trim()).replace(/\*\*(.+?)\*\*/g, "<b>$1</b>");
  }

  // "icon | text" per line — compact enough to edit on a phone, and the icon
  // stays optional (a line with no pipe is just text).
  function pipeParts(line, n){
    const bits = String(line).split("|").map(x => x.trim());
    while (bits.length < n) bits.push("");
    return bits;
  }

  // Shown after the dates change. A plain confirm() can't list what would be
  // lost, and losing hand-picked places to a mistyped year would be brutal —
  // so this spells out the damage and defaults to parking stops on a board.
  function openDateReconcileSheet(snap, plan, prevStart, prevEnd){
    const droppedWithStops = plan.dropped.filter(x => x.stops.length);
    const stopCount = droppedWithStops.reduce((n, x) => n + x.stops.length, 0);
    const names = droppedWithStops.flatMap(x => x.stopTitles).slice(0, 8);
    const flipsClosed = plan.closureFlips.filter(f => f.nowClosed);
    const flipsOpen = plan.closureFlips.filter(f => !f.nowClosed);

    openSheet(`
      <h3>行程日期改咗</h3>
      <p class="sec-sub">${esc(plan.oldStart || "?")} → <b>${esc(plan.newStart)}</b>，
        ${plan.oldCount} 日 → <b>${plan.newCount} 日</b>。</p>
      ${plan.added.length ? `<div class="ai-msg">會加 ${plan.added.length} 日空白行程（Day ${plan.oldCount + 1}${plan.added.length > 1 ? "-" + plan.newCount : ""}），可以之後叫 AI 幫手諗。</div>` : ""}
      ${plan.dropped.length ? `<div class="ai-msg">Day ${plan.newCount + 1}${plan.dropped.length > 1 ? "-" + plan.oldCount : ""} 會冇咗。${
        stopCount ? `入面有 <b>${stopCount} 個地點</b>：${esc(names.join("、"))}${stopCount > names.length ? " …" : ""}<br>
        撳「確認」會自動搬去一個新清單度收好，唔會消失（但時間、交通、營業時間呢啲會冇咗）。` : "入面冇地點，直接刪走。"}</div>` : ""}
      ${flipsClosed.length ? `<div class="ai-msg">${icon("warn")}改完之後，呢啲地點會撞正公休：${esc(flipsClosed.map(f => f.title).join("、"))}</div>` : ""}
      ${flipsOpen.length ? `<div class="ai-msg">${icon("check")}原本撞公休、改完之後冇事：${esc(flipsOpen.map(f => f.title).join("、"))}</div>` : ""}
      ${plan.seasonShift ? `<div class="ai-msg">日期搬咗好遠／換咗月份，每日嘅標題同季節相關嘅內容可能唔啱用，可以之後叫 AI 重新諗過。</div>` : ""}
      <div class="editor-tools" style="margin-top:14px;flex-wrap:wrap;">
        <button class="btn" data-datecancel>取消（唔改日期）</button>
        <button class="btn primary" data-dateok>確認</button>
      </div>`, layer => {
      layer.querySelector("[data-datecancel]").addEventListener("click", async () => {
        // Only the dates roll back; whatever else they typed in the sheet stays.
        snap.meta.dateStart = prevStart; snap.meta.dateEnd = prevEnd;
        closeLayer(); render();
        await saveNow("改咗首頁標題同目的地資料（日期冇改）");
      });
      layer.querySelector("[data-dateok]").addEventListener("click", async () => {
        const res = applyDayReconcile(snap, plan);
        closeLayer(); render();
        await saveNow(res.summary);
        if (res.notices.length) alert(res.notices.join("\n\n"));
        if (plan.added.length && confirm(`加咗 ${plan.added.length} 日空白行程，而家叫 AI 幫你諗返呢幾日？`)){
          const ids = plan.added.map(a => "day" + a.n);
          genBanner("AI 幫你諗緊新加嗰幾日…");
          try {
            await generateDaysFor(ids, msg => genBanner(msg));
            genBanner("新加嘅日子諗好喇。", { done:true });
          } catch (e){
            genBanner("生成失敗：" + e.message, { done:true });
          }
          setTimeout(() => genBanner(null), 6000);
        }
      });
    });
  }

  // Each home-page section maps to one entry here, so the pencil buttons are
  // wired generically and every save goes through the same version-history path
  // as any other edit.
  const HOME_EDITORS = {
    checklist: () => {
      const d = state.snapshot, list = checklistOf(d);
      openEditSheet("出發前 checklist", "一行一項。已經剔咗嘅會保留。", [
        { key: "items", type: "lines", rows: 10, label: "項目", value: list.map(x => x.t).join("\n") },
      ], async out => {
        const was = new Map(list.map(x => [x.t, x.done]));
        d.checklist = out.items.map(t => ({ t, done: !!was.get(t) }));
        render(); await saveNow("改咗出發前 checklist");
      });
    },
    ai: () => {

        { key:"tripBrief", type:"textarea", rows:6,
          label:"背景設定",
          hint:"留空就會用返一句通用嘅背景（目的地同日期）。寫低有咩人去、有咩限制、想點玩，所有 AI 功能都會跟住呢段。",
          value: briefText(d) || defaultTripBrief(d),
          placeholder: defaultTripBrief(d) },
      ], async out => {
        d.tripBrief = out.tripBrief === defaultTripBrief(d) ? "" : out.tripBrief;
        render();
        await saveNow("改咗 AI 設定（AI 背景資料）");

    hero: () => {
      const d = state.snapshot;
      const m = d.meta = d.meta || {};
      openEditSheet("首頁大標題", "最頂嗰段，同AI用嚟搵地點／check天氣嘅目的地資料——呢頁重用去第二個trip嘅時候，淨係要改呢度，唔使改code。", [
        { key:"eyebrow", type:"text", label:"日期細字", value: m.eyebrow || defaultEyebrow(d) },
        { key:"title", type:"text", label:"標題", value: m.title || "" },
        { key:"facts", type:"lines", rows:3, label:"標題下面嘅小字", hint:"一行一項，會用「·」分隔顯示。",
          value: (m.facts && m.facts.length ? m.facts : defaultFacts(d)).join("\n") },
        { key:"hotelTags", type:"lines", rows:3, label:"標籤", hint:"一行一個。",
          value: (m.hotelTags || []).join("\n") },
        { key:"destinationLocal", type:"text", label:"目的地本地語言名（搜尋地點/計交通用）",
          hint:"用當地語言／文字寫，Google 搵地點同計交通會準好多。留空即係搵地點唔加地區提示。",
          value: m.destinationLocal || "" },
        { key:"lat", type:"text", label:"目的地緯度（check實時天氣用）", value: m.lat != null ? String(m.lat) : "" },
        { key:"lng", type:"text", label:"目的地經度（check實時天氣用）", value: m.lng != null ? String(m.lng) : "" },
        { key:"dateStart", type:"text", label:"行程開始日期", hint:"格式 YYYY-MM-DD，例如 2026-10-23。",
          value: m.dateStart || "" },
        { key:"dateEnd", type:"text", label:"行程結束日期", hint:"格式 YYYY-MM-DD。",
          value: m.dateEnd || "" },
      ], async out => {
        const prevStart = m.dateStart, prevEnd = m.dateEnd;
        m.eyebrow = out.eyebrow; m.title = out.title;
        m.facts = out.facts; m.hotelTags = out.hotelTags;
        m.destinationLocal = out.destinationLocal || "";
        const lat = parseFloat(out.lat), lng = parseFloat(out.lng);
        m.lat = Number.isFinite(lat) ? lat : null;
        m.lng = Number.isFinite(lng) ? lng : null;

        const nextStart = (out.dateStart || "").trim(), nextEnd = (out.dateEnd || "").trim();
        const datesChanged = nextStart !== prevStart || nextEnd !== prevEnd;
        if (!datesChanged){
          render();
          await saveNow("改咗首頁標題同目的地資料");
          return;
        }
        // Dates moved: the day list has to move with them, and that can cost
        // the user content, so it gets its own confirm step. Everything else
        // they just typed is already applied and kept either way.
        const plan = planDayReconcile(d, nextStart, nextEnd);
        if (!plan.ok){
          m.dateStart = prevStart; m.dateEnd = prevEnd;
          render();
          await saveNow("改咗首頁標題同目的地資料");
          flash("日期改唔到：" + plan.error);
          return;
        }
        openDateReconcileSheet(d, plan, prevStart, prevEnd);
      });
    },

    acc: () => openStaysSheet(),

    weather: () => {
      const d = state.snapshot;
      openEditSheet(weatherHeadingLabel(d.meta), "一行一日。", [
        { key:"rows", type:"lines", rows:8, label:"日期 | 日高 | 晨低 | 概況",
          hint:"用「|」分開四格，例如：10/23 | 18° | 8° | 早晚涼，日間舒服",
          value: (d.weatherRows || []).map(r => [r.date, r.hi, r.lo, r.note].join(" | ")).join("\n") },

        { key:"title",   label:"標題", type:"text", value: t.title || "交通點畀錢" },
        { key:"intro",   label:"開場白", type:"text", value: t.intro || "" },
        { key:"verdict", label:"結論", type:"textarea", rows:3, value: t.verdict || "" },
        { key:"cards",   label:"幾種卡（名 | 韓文 | 價錢 | 好處 | 唔好 | 建議）", type:"lines", rows:6,
          hint:"最後一格寫「建議」就會標做建議嗰張，唔想標就留空。",
          value: (t.cards || []).map(c => [c.name, c.kr, c.price, c.good, c.bad, c.pick ? "建議" : ""].join(" | ")).join("\n") },
        { key:"fares",   label:"大約幾多錢（項目 | 車費 | 備註）", type:"lines", rows:5,
          value: (t.fares || []).map(f => [f.what, f.cost, f.note].join(" | ")).join("\n") },
        { key:"tips",    label:"實用貼士（一行一個）", type:"lines", rows:7,
          value: (t.tips || []).join("\n") },
        { key:"asOf",    label:"資料日期備註", type:"text", value: t.asOf || "" },
      ], async out => {
        t.title = out.title || "交通點畀錢";
