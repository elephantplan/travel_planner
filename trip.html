    );
    return `<div class="dayroutes">${parts.join("")}${
      trimmed ? `<span class="hint">Google 一條連結最多帶 ${MAX_WAYPOINTS + 2} 個點，所以只去到第 ${MAX_WAYPOINTS + 2} 個站。</span>` : ""
    }</div>`;
  }

  // Quick outbound links for a stop. Local-language name searches better than
  // the Cantonese title, so prefer it; appending the trip's destination hint
  // narrows a bare name like "황생가칼국수" to the right city — read fresh off
  // meta (not hardcoded) so this works for whichever trip is loaded.
  function searchTerm(s){
    const kr = plain(s.kr), title = plain(s.title);
    return kr || title;
  }
  function destHint(){
    const m = (state.snapshot && state.snapshot.meta) || {};
    return m.destinationLocal ? " " + m.destinationLocal : "";
  }
  // "Google 地圖" used to just open whatever was stored in s.mapUrl — but
  // mapUrl is a generic map link, not a Google one. Places the AI suggests
  // onto a board get a NAVER url written into it, and the editor's own field
  // invites you to paste one. So the button said Google and opened Naver.
  //
  // The label now decides the link instead of the other way round: a Google
  // url that is already stored wins, otherwise one is built from the place id
  // (exact) or the name.
  function isHost(url, re){ return re.test(String(url || "")); }
  const GOOGLE_HOST = /^https?:\/\/((www|maps)\.)?google\.[a-z.]+\//i;
  const GOOGLE_SHORT = /^https?:\/\/(maps\.app\.goo\.gl|goo\.gl\/maps)\//i;
  const NAVER_HOST = /^https?:\/\/([a-z]+\.)?naver\.(com|me)\//i;

  function googlePlaceUrl(s){
    const m = String((s && s.mapUrl) || "");
    if (isHost(m, GOOGLE_HOST) || isHost(m, GOOGLE_SHORT)) return m;
    const q = searchTerm(s);
    if (!q) return "";
    const base = `https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(q + destHint())}`;
    return s.placeId ? `${base}&query_place_id=${encodeURIComponent(s.placeId)}` : base;
  }

  // A stored link that is neither Google nor Naver is something the family
  // pasted themselves. It used to render under the Google label; now it keeps
  // its own, so nothing they saved quietly disappears.
  function customMapUrl(s){
    const m = String((s && s.mapUrl) || "");
    if (!m) return "";
    if (isHost(m, GOOGLE_HOST) || isHost(m, GOOGLE_SHORT) || isHost(m, NAVER_HOST)) return "";
    return m;
  }

  function googleSearchUrl(s){
    const q = searchTerm(s);
    return q ? `https://www.google.com/search?q=${encodeURIComponent(q + destHint())}` : null;
  }
  // The Maps "search action" URL (Google's documented format) lands on the
  // place card with its star rating and review count visible immediately.
  function googleReviewsUrl(s){
    const q = searchTerm(s);
    if (!q) return null;
    const base = `https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(q + destHint())}`;
    return s.placeId ? `${base}&query_place_id=${encodeURIComponent(s.placeId)}` : base;
  }

  // how to name a stop to Google: its place id if we have one, else coordinates,
  // else just its name
  function stopRef(s){
    if (!s) return null;
    if (s.placeId) return { placeId: s.placeId };
    if (Number.isFinite(s.lat) && Number.isFinite(s.lng)) return { lat: s.lat, lng: s.lng };
    if (cleanPlaceName(s.title)) return { text: cleanPlaceName(s.title) };
    return null;
  }

  // The day's first stop is usually a "leaving the hotel" logistics line
  // ("酒店寄存行李後出發") with no coordinates or Google id of its own —
  // stopRef() falls back to sending that whole description SENTENCE to
  // Google as free-text origin, which can silently resolve to an arbitrary
  // wrong place (this is what broke a leg's recomputed route after a
  // mid-day stop between it and the hotel got deleted: the "fixed" result
  // still looked plausible, just from the wrong starting point). Use the
  // day's real accommodation coordinates for that leg instead.
  function stayRef(day){
    const stay = stayForDay(state.snapshot, day);
    if (stay && Number.isFinite(Number(stay.lat)) && Number.isFinite(Number(stay.lng)))
      return { lat: Number(stay.lat), lng: Number(stay.lng) };
    return null;
  }

  // ---------- the hotel at both ends of the day ----------
  // Every day but the first starts at last night's hotel, and every day but
  // the last ends at tonight's. Both are shown as a stop of their own on the
  // line, with the leg to the first place and from the last one timed like
  // any other.
  function nightStay(di){
    const snap = state.snapshot, days = snap.days || [];
    if (di < 0 || di >= days.length - 1) return null;   // the last night is spent travelling home
    const c = (snap.stays || []).filter(s => {
      const a = dayIndexById(snap, s.from), b = dayIndexById(snap, s.to);
      return a >= 0 && b >= 0 && di >= Math.min(a, b) && di <= Math.max(a, b);
    }).sort((x, y) => dayIndexById(snap, y.from) - dayIndexById(snap, x.from));   // check-in day: the new one
    return c[0] && plain(c[0].name) ? c[0] : null;
  }
  function stayPointRef(st){
    if (st.placeId) return { placeId: st.placeId };
    const lat = Number(st.lat), lng = Number(st.lng);
    if (st.lat !== "" && st.lat != null && Number.isFinite(lat) && Number.isFinite(lng)) return { lat, lng };
    const t = plain(st.kr) || plain(st.name);
    return t ? { text: t } : null;
  }
  function stayIsStop(st, s){
    return !isRealPlace(s) && HOTEL_ROW.test(plain(s.title) || "")
      || plain(s.title) === plain(st.name) || !!(st.placeId && s.placeId === st.placeId);
  }
  // which: "hotelLeg" (morning, hotel → first place) or "backLeg" (evening)
  function hotelLegInfo(day, which = "hotelLeg"){
    const di = dayIndexById(state.snapshot, day.id);
    const st = which === "hotelLeg" ? (di > 0 ? nightStay(di - 1) : null) : nightStay(di);
    if (!st) return null;
    const units = toUnits(day.items);
    let k = -1;
    if (which === "hotelLeg") k = firstStopUnit(units);
    else for (let j = units.length - 1; j >= 0; j--) if (units[j].stop){ k = j; break; }
    if (k < 0) return null;
    const s = units[k].stop;
    if (stayIsStop(st, s)) return null;
    // a 「酒店出發」 logistics row without a place of its own is the hotel already
    if (which === "hotelLeg" && !isRealPlace(s)) return null;
    const hotel = stayPointRef(st), place = stopRef(s);
    if (!hotel || !place) return null;
    const from = which === "hotelLeg" ? hotel : place, to = which === "hotelLeg" ? place : hotel;
    const prefer = (day[which] && day[which].prefer) || "auto";
    return { st, s, k, from, to, prefer, key: JSON.stringify([from, to, prefer]),
             names: which === "hotelLeg" ? [st.name, plainTitle(s)] : [plainTitle(s), st.name] };
  }
  function plainTitle(s){ return plain(s.kr) ? `${plain(s.title)}（${plain(s.kr)}）` : plain(s.title); }
  const legBusy = new Set();
  function hotelStopHtml(st, which){
    const g = googlePlaceUrl({ title: st.name, kr: st.kr || "", placeId: st.placeId || "", mapUrl: st.mapUrl || "" });
    const tx = taxiBtnHtml(st.kr, st.name);
    return `<div class="stop hotelrow">
      <div class="stop-rail"><span class="stoptime"></span><span class="node hotelnode">${icon("home")}</span></div>
      <div class="hotelcard">
        <span class="hc-k">${which === "hotelLeg" ? "由酒店出發" : "返酒店"}</span>
        <b class="hc-n">${esc(plain(st.name))}</b>
        <span class="hc-links">${g ? `<a class="maplink" href="${esc(g)}" target="_blank" rel="noopener">${icon("pin")}Google 地圖</a>` : ""}${tx}</span>
      </div>
    </div>`;
  }
  function hotelLegHtml(day, which = "hotelLeg"){
    const info = hotelLegInfo(day, which);
    if (!info) return "";
    const leg = day[which] && day[which].key === info.key ? day[which] : null;
    const st = info.st;
    const subj = { title: st.name, kr: st.kr || "", placeId: st.placeId || "", mapUrl: st.mapUrl || "",
                   lat: st.lat === "" ? NaN : Number(st.lat), lng: st.lng === "" ? NaN : Number(st.lng) };
    const hotelG = subj.placeId ? subj : { title: subj.title, kr: subj.kr };
    const a = which === "hotelLeg" ? subj : info.s, b = which === "hotelLeg" ? info.s : subj;
    const mode = leg ? segMode(leg) : "metro";
    const links = legLinks(which === "hotelLeg" ? hotelG : info.s, which === "hotelLeg" ? info.s : hotelG, a, b, mode, leg);
    const body = leg ? `<span class="seg-head">${segModeBtn(leg, `data-legmode="${which}"`)}</span>` + (leg.route ? routeChainHtml(leg.route) : "")
      : `<span class="seg-note">${legBusy.has(day.id + which) ? "計緊交通…" : "交通未計到"}</span>`;
    const refresh = !state.readonly ? `<button class="segrefresh" data-legrefresh="${which}" title="重新計" aria-label="重新計呢段交通">${icon("refresh")}</button>` : "";
    const seg = `<div class="seg hotelleg" data-mode="${leg ? mode : "other"}"><div class="seg-rail"></div>
      <div class="seg-text">${body}${refresh}${links}${leg ? adviceHtml(leg, which) : ""}</div></div>`;
    return which === "hotelLeg" ? hotelStopHtml(st, which) + seg : seg + hotelStopHtml(st, which);
  }
  // the mode disc doubles as the switch between 行路 / 大眾運輸 / 揸車
  function segModeBtn(seg, attr){
    const mode = segMode(seg);
    const text = seg && seg.text != null ? seg.text : segPlain(seg && seg.html);
    return `<button type="button" class="modebtn" ${attr} title="轉交通方式" aria-label="轉交通方式：${esc(text)}"><span class="icon">${icon(MODE_ICON[mode] || "walk")}</span></button>${esc(text)}`;
  }
  // Google everywhere; Naver in Korea
  function legLinks(gFrom, gTo, nFrom, nTo, mode, seg){
    const g = gmapsDirUrl(gFrom, gTo, mode);
    const n = destIsKorea() ? naverDirUrl(nFrom, nTo, mode) : "";
    const parts = mapLinksInOrder(
      n ? `<a class="maplink" href="${esc(n)}" target="_blank" rel="noopener" aria-label="Naver 路線">${icon("map")}Naver</a>` : "",
      g ? `<a class="maplink" href="${esc(g)}" target="_blank" rel="noopener" aria-label="Google 路線">${icon("map")}Google</a>` : "");
    return parts.length ? `<span class="seg-links">${parts.join("")}</span>` : "";
  }

  // One leg, the way the family asked for it. Google's Directions API has no
  // train data in Japan, so the old lookup fell back to 「步行約 60 分鐘」;
  // the leg lookup there (and whenever a mode is picked by hand) goes to
  // trip-import, which can also ask Gemini for the usual train route.
  // A phone that leaves the app mid-request can leave that request hanging for
  // good — and while it hung, nothing else on the day was ever timed again.
  function withTimeout(promise, ms, fallback){
    let t; return Promise.race([promise, new Promise(res => { t = setTimeout(() => res(fallback), ms); })]).finally(() => clearTimeout(t));
  }
  async function legLookup(from, to, opt = {}){
    return withTimeout(legLookupRaw(from, to, opt), 25000, { ok:false, message:"等咗太耐，撳重新計再試" });
  }
  async function legLookupRaw(from, to, opt = {}){
    const prefer = opt.prefer || "auto";
    if (prefer === "auto" && !destIsJapan()){
      const r = await callAi({ action:"transit", from, to });
      const m = r && String(r.text || "").match(/(\d+)\s*分鐘/);
      const longWalk = r && r.ok !== false && r.mode === "walk" && m && +m[1] > 20;
      if (!longWalk) return r;
    }
    try {
      const res = await fetch(SUPABASE_URL + "/functions/v1/trip-import", { method:"POST", headers: sbHeaders(),
        body: JSON.stringify({ mode:"leg", from, to, prefer, fromName: opt.fromName || "", toName: opt.toName || "",
          city: ((state.snapshot || {}).meta || {}).destinationLocal || "",
          lang: destIsJapan() ? "ja" : destIsKorea() ? "ko" : "zh-TW" }) });
      return await res.json();
    } catch (e){ return { ok:false, message: e.message }; }
  }
  function segFromLookup(r, prefer){
    const seg = buildSeg(r.mode || "walk", r.text, r.route);
    if (prefer && prefer !== "auto") seg.prefer = prefer;
    if (r.noTime){ seg.noTime = true; seg.stv = 3; }
    if (r.long) seg.long = true;
    return seg;
  }
  async function computeHotelLeg(day, which){
    const info = hotelLegInfo(day, which);
    if (!info) return false;
    legBusy.add(day.id + which);
    if (state.view === day.id) render();
    let got = false;
    try {
      const r = await legLookup(info.from, info.to, { prefer: info.prefer, fromName: info.names[0], toName: info.names[1] });
      if (r && r.ok !== false && r.text){ day[which] = Object.assign(segFromLookup(r, info.prefer), { key: info.key }); got = true; }
    } catch (_){}
    legBusy.delete(day.id + which);
    if (state.view === day.id) render();
    return got;
  }
  function openModeSheet(cur, onPick){
    const opts = [["auto", "自動（由 Google 揀）"], ["transit", "大眾運輸（地鐵／電車／巴士）"], ["walk", "行路"], ["drive", "揸車／的士"]];
    openSheet(`<h3>呢段點去？</h3>
      <div class="modepick">${opts.map(([k, l]) => `<button type="button" class="btn${(cur || "auto") === k ? " primary" : ""}" data-pickmode="${k}">${l}</button>`).join("")}</div>`,
      layer => layer.querySelectorAll("[data-pickmode]").forEach(b => b.addEventListener("click", () => { closeLayer(); onPick(b.dataset.pickmode); })));
  }

  // Adding or moving a place used to leave 「次序改咗，交通時間要再確認」 until
  // someone pressed 重算. Legs between two real places are now asked for as
  // soon as nobody is mid-edit on that day — once each, so a failure doesn't
  // loop; the button is still there to retry.
  // ---------- long legs: how to actually do it ----------
  // Going to another city (Osaka → Kyoto) is where a family needs more than
  // a time: which train, whether to buy ahead and how, how often it runs,
  // when to leave, and whether the plan is too tight. Asked once, kept on
  // the leg, always with a reminder to check it themselves.
  const ADVICE_CHECK = "以上係 AI 根據網上資料整理，班次、車費同要唔要訂位隨時會變，出發前一定要自己再 check（例如鐵路公司官網、Google 地圖）。";
  function adviceHtml(seg, key){
    if (!seg) return "";
    const a = seg.advice;
    if (a && (a.options || []).length){
      const b = a.options.find(o => o.best) || a.options[0];
      return `<div class="advice">
        <div class="adv-h">${icon("sparkle")}<span>AI 建議：<b>${esc(b.name)}</b>${b.minutes ? ` 約 ${b.minutes} 分鐘` : ""}${b.price ? `・${esc(b.price)}` : ""}</span></div>
        ${b.book ? `<div class="adv-s">${esc(b.book)}</div>` : ""}
        <button type="button" class="btn advmore" data-advice="${esc(key)}">睇晒建議同時間表 ${icon("chevron")}</button>
        <small class="adv-warn">AI 整理，出發前要自己再 check</small>
      </div>`;
    }
    if (!seg.long || state.readonly || state.offline) return "";
    return `<button type="button" class="maplink advbtn" data-advice="${esc(key)}">${icon("sparkle")}長途：AI 建議點去、使唔使買定飛</button>`;
  }
  function adviceContext(day, key){
    const snap = state.snapshot, units = toUnits(day.items), pf = snap.stayPrefs;
    let from = "", to = "", arrive = "", leave = "";
    if (key === "hotelLeg" || key === "backLeg"){
      const info = hotelLegInfo(day, key);
      if (!info) return null;
      [from, to] = info.names;
      if (key === "hotelLeg") arrive = plain(info.s.time || ""); else leave = plain(info.s.time || "");
    } else {
      const i = +key, s2 = units[i] && units[i].stop;
      let prev = null; for (let j = i - 1; j >= 0; j--) if (units[j].stop){ prev = units[j].stop; break; }
      if (!s2 || !prev) return null;
      from = plainTitle(prev); to = plainTitle(s2); arrive = plain(s2.time || ""); leave = plain(prev.time || "");
    }
    return { 由: from, 去: to, 日子: dayIso(day) || day.date, 星期: tabWeekday(day), 城市: (snap.meta || {}).destinationLocal || "",
      人數: pf ? `${pf.adults} 個大人${pf.kids ? `、${pf.kids} 個小朋友` : ""}` : "", 要幾點到: arrive, 上一站大約幾點走: leave };
  }
  function legOf(day, key){
    if (key === "hotelLeg" || key === "backLeg") return { seg: day[key], put: seg => { day[key] = seg; } };
    const units = toUnits(day.items), i = +key;
    return { seg: units[i] && units[i].seg, put: seg => { units[i].seg = seg; day.items = fromUnits(units); } };
  }
  async function askAdvice(day, key){
    const ctx = adviceContext(day, key);
    if (!ctx) return null;
    flash("AI 查緊點去，大約半分鐘…", true);
    try {
      const res = await fetch(SUPABASE_URL + "/functions/v1/trip-import", { method: "POST", headers: sbHeaders(),
        body: JSON.stringify({ mode: "trip-advice", today: localIso(new Date()), text: JSON.stringify(ctx) }) });
      const r = await withTimeout(res.json(), 60000, null);
      if (!r || r.ok === false || !r.advice){ flash((r && r.message) || "查唔到，等陣再試"); return null; }
      const { seg, put } = legOf(day, key);
      if (!seg) return null;
      const short = t => cleanPlaceName(String(t).replace(/（[^）]*）$/, ""));
      put(Object.assign({}, seg, { advice: Object.assign({}, r.advice, { at: new Date().toISOString(), for: `${short(ctx.由)} → ${short(ctx.去)}` }) }));
      flash("查到喇");
      await saveNow(`AI 建議咗「${ctx.由} → ${ctx.去}」點去`);
      return legOf(day, key).seg.advice;
    } catch (e){ flash("查唔到：" + e.message); return null; }
  }
  function openAdviceSheet(day, key, a){
    const opts = (a.options || []).map(o => `
      <div class="advopt${o.best ? " best" : ""}">
        <div class="ao-top"><b>${esc(o.name)}</b>${o.best ? `<span class="sgbest">建議</span>` : ""}</div>
        ${o.route ? `<div class="ao-route">${esc(o.route)}</div>` : ""}
        <div class="ao-facts">${[o.minutes ? `約 ${o.minutes} 分鐘` : "", o.price, o.freq].filter(Boolean).map(x => `<span>${esc(x)}</span>`).join("")}</div>
        ${o.book ? `<div class="ao-row"><i>使唔使買定</i>${esc(o.book)}</div>` : ""}
        ${o.howToBuy ? `<div class="ao-row"><i>點買</i>${esc(o.howToBuy)}</div>` : ""}
      </div>`).join("");
    openSheet(`<h3>${esc(cleanPlaceName(a.for || "") || "點去")}</h3>
      <p class="sec-sub">AI 上網查完整理嘅建議${a.at ? `（${esc(String(a.at).slice(0, 10))} 查）` : ""}</p>
      <div class="advopts">${opts}</div>
      ${a.depart ? `<div class="ao-row big"><i>建議幾點上車</i>${esc(a.depart)}</div>` : ""}
      ${a.feasible ? `<div class="ao-row big"><i>時間夠唔夠</i>${esc(a.feasible)}</div>` : ""}
      ${(a.tips || []).length ? `<ul class="ao-tips">${a.tips.map(t => `<li>${esc(t)}</li>`).join("")}</ul>` : ""}
      <p class="ao-warn">${icon("warn")}${ADVICE_CHECK}</p>
      <div class="editor-tools"><button class="btn" data-readvice>${icon("refresh")}重新問 AI</button><button class="btn primary" data-close>知道</button></div>`,
      layer => {
        const b = layer.querySelector("[data-readvice]");
        if (b) b.addEventListener("click", async () => {
          b.disabled = true; b.textContent = "問緊…";
          const n = await askAdvice(day, key);
          closeLayer(); render();
          if (n) openAdviceSheet(day, key, n);
        });
      });
  }

  // Titles carry notes for people — 「永觀堂 (9am - 4pm)」, 「<午餐> 鰻魚飯」,
  // 「購物：思夢樂」 — which make Google search for the wrong thing or nothing.
  function cleanPlaceName(t){
    const raw = plain(t || "").trim();
    const c = raw.replace(/[<＜][^>＞]*[>＞]/g, " ").replace(/[（(][^）)]*[）)]/g, " ")
      .replace(/^[^：:]{1,6}[：:]\s*/, "").replace(/\s+/g, " ").trim();
    return c || raw;
  }
  // A stop typed by hand or imported with notes in its name never got a
  // Google place, so it had no map pin, no hotel leg and legs timed from a
  // wrong guess. Look each one up once by its cleaned name in this city.
  const NOT_A_STOP = /自由活動|休息|出發|返酒店|集合|check.?in|check.?out|機場|落機|起飛|降落|寄存/i;
  async function matchLoosePlaces(day){
    // no city added: a day trip (永觀堂 on an Osaka trip is in Kyoto) would be
    // pulled to the wrong place, while a famous name alone is found correctly
    const units = toUnits(day.items);
    const todo = units.map((u, i) => i).filter(i => {
      const st = units[i].stop;
      return st && !isRealPlace(st) && !st.placeTried && cleanPlaceName(st.title).length >= 2
        && !HOTEL_ROW.test(plain(st.title) || "") && !NOT_A_STOP.test(plain(st.title) || "");
    });
    let got = 0;
    for (const i of todo){
      const st = units[i].stop;
      st.placeTried = true;
      const q = cleanPlaceName(st.title);
      try {
        const r = await withTimeout(callAi({ action:"place-search", query: q }), 20000, null);
        const p = r && r.places && r.places[0];
        if (p && p.placeId){
          st.placeId = p.placeId;
          if (Number.isFinite(p.lat)){ st.lat = p.lat; st.lng = p.lng; }
          // the legs into and out of it were timed from a guess
          if (units[i].seg) units[i].seg = Object.assign({}, units[i].seg, { stale:true });
          for (let j = i + 1; j < units.length; j++) if (units[j].stop){ if (units[j].seg) units[j].seg = Object.assign({}, units[j].seg, { stale:true }); break; }
          got++;
        }
      } catch (_){}
    }
    if (got){ day.items = fromUnits(units); syncMapPoints(day); }
    return got;
  }
  // Legs saved by older builds that are known to be wrong: an AI-guessed train
  // route, or — in Japan, where Google's API has no trains — a long walk that
  // was only the fallback. Each is looked up again once.
  function segSuspect(seg){
    if (!seg || seg.prefer) return false;
    if (seg.est) return true;
    if (!destIsJapan()) return false;
    // from the builds that guessed station names
    if (seg.noTime) return seg.stv !== 3;
    // Google's API has no trains in Japan: any timed train leg is from an old build
    if (/^(metro|bus|other)$/.test(segMode(seg))) return true;
    const m = String(seg.text || "").match(/(\d+)\s*分鐘/);
    return segMode(seg) === "walk" && !!m && +m[1] > 20;
  }
  const autoTransitTried = new Set();
  let autoTransitBusy = false;
  async function autoTransit(day){
    if (autoTransitBusy || state.readonly || state.offline) return;
    if ([...state.open].some(k => String(k).startsWith(day.id + ":"))) return;
    autoTransitBusy = true;
    try {
      if (await matchLoosePlaces(day)){ if (state.view === day.id) render(); await saveNow("幫地點配返 Google", true); }
      const units = toUnits(day.items), first = firstStopUnit(units);
      const prevOf = i => { for (let j = i - 1; j >= 0; j--) if (units[j].stop) return units[j].stop; return null; };
      const todo = units.map((u, i) => i).filter(i => {
        const u = units[i];
        if (i <= first || !u.stop || !u.seg || !(u.seg.stale || u.seg.checking || segSuspect(u.seg)) || !isRealPlace(u.stop)) return false;
        const k = day.id + JSON.stringify([stopRef(prevOf(i)), stopRef(u.stop)]);
        if (autoTransitTried.has(k)) return false;
        autoTransitTried.add(k);
        return true;
      });
      if (todo.length) await refreshTransit(day, todo);
      let got = 0;
      for (const which of ["hotelLeg", "backLeg"]){
        const info = hotelLegInfo(day, which);
        const hk = which + day.id + (info ? info.key : "");
        if (!info || (day[which] && day[which].key === info.key && !segSuspect(day[which])) || autoTransitTried.has(hk)) continue;
        autoTransitTried.add(hk);
        if (await computeHotelLeg(day, which)) got++;
      }
      if (got) await saveNow("計咗酒店出入嘅交通", true);
    } finally { autoTransitBusy = false; }
  }

  // After the order changes, the transit note before a stop describes a journey
  // that no longer happens. Flag those, then ask Google for the real numbers.
  let transitRunning = 0;      // a 「計緊」 saved by a run that never finished is just stale
  async function refreshTransit(day, indices){
    transitRunning++;
    try { return await refreshTransitInner(day, indices); } finally { transitRunning--; }
  }
  async function refreshTransitInner(day, indices){
    let units = toUnits(day.items);
    // nothing comes before the first stop of a day, so it carries no transit note
    const first = firstStopUnit(units);
    const firstStopObj = first >= 0 ? units[first].stop : null;
    if (first >= 0 && units[first].seg){ units[first].seg = null; day.items = fromUnits(units); }
    // notes sit between stops without being one, so "the leg into this stop"
    // starts at the previous STOP, not simply at the previous unit
    const prevStop = i => { for (let j = i - 1; j >= 0; j--) if (units[j].stop) return units[j].stop; return null; };
    const todo = [...new Set(indices)]
      .filter(i => i > 0 && i < units.length && units[i] && units[i].stop && i !== first);
    if (!todo.length){ render(); return; }

    todo.forEach(i => {
      units[i].seg = Object.assign({ kind:"connector", html:"" }, units[i].seg, { stale:true, checking:true });
    });
    day.items = fromUnits(units);
    render();

    let why = "";
    await Promise.all(todo.map(async i => {
      const prev = prevStop(i);
      const from = (prev && prev === firstStopObj && !isRealPlace(prev) && stayRef(day)) || stopRef(prev);
      const to = stopRef(units[i].stop);
      const prefer = units[i].seg && units[i].seg.prefer || "auto";
      let done = false;
      if (from && to){
        try {
          const r = await legLookup(from, to, { prefer, fromName: prev ? plainTitle(prev) : "", toName: plainTitle(units[i].stop) });
          if (r && r.ok !== false && r.text){ units[i].seg = segFromLookup(r, prefer); done = true; }
          else if (r && r.message) why = r.message;
        } catch (e){ why = e.message; }   // leave it flagged rather than show a wrong number
      }
      if (!done) units[i].seg.checking = false;
      day.items = fromUnits(units);
      render();
    }));
    if (why) state.transitProblem = why;
    render();
    await saveNow("更新咗交通時間", true);
  }

  // ==================================================================

  // ==================================================================
  // Bookmark boards used to live at the tail end of this strip, past all 6
  // day tabs — invisible unless you scrolled all the way right, and easy to
  // not know existed at all. They now have their own always-visible entry
  // point (the 📌 button in the bottom dock) instead of competing for space
  // here; this strip stays just overview + days + notes, however many boards
  // you make.
  // Most shortTags were written as "D3 聖水洞" back when the tab didn't print
  // the day number itself, so the tab read "D3  D3 聖水洞". The number is the
  // tab's own label now, so drop a leading copy of it from the tag.
  function shortTagText(d){
    const n = String(d.id).replace("day", "");
    return String(d.shortTag || "").replace(new RegExp("^\\s*D" + n + "\\s*[.·・:：-]?\\s*", "i"), "").trim();
  }

  // The tabs said only D1…D5, so finding "the Kyoto day" meant opening each.
  // Under the number: the weekday, and roughly where that day goes.
  function tabWeekday(d){ const m = String(d.date || "").match(/[（(]([日一二三四五六])[）)]/); return m ? "星期" + m[1] : ""; }
  function tabArea(d){
    const t = shortTagText(d) || plain(d.title).replace(/^第\s*\d+\s*日$/, "");
    return t.length > 7 ? t.slice(0, 7) + "…" : t;
  }
  // ---------- time helpers ----------
  function clockMin(t){ const m = String(t || "").match(/(\d{1,2})\s*[:：]\s*(\d{2})/); return m ? (+m[1]) * 60 + (+m[2]) : null; }
  function fmtMin(n){ n = ((n % 1440) + 1440) % 1440; return `${String(Math.floor(n / 60)).padStart(2, "0")}:${String(n % 60).padStart(2, "0")}`; }
  function localIso(d){ return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, "0")}-${String(d.getDate()).padStart(2, "0")}`; }
  function dayIso(day){
    const snap = state.snapshot, m = (snap && snap.meta) || {};
    const i = (snap.days || []).indexOf(day);
    if (i < 0 || !m.dateStart) return "";
    const d = new Date(m.dateStart + "T00:00:00"); d.setDate(d.getDate() + i);
    return localIso(d);
  }
  function todayDay(){ const t = localIso(new Date()); return ((state.snapshot && state.snapshot.days) || []).find(d => dayIso(d) === t) || null; }
  // the stop the family is heading for now: the first one whose time has not
  // passed by more than half an hour; with no times, the first stop of the day
  function nextStopOf(day){
    const now = new Date(), nowMin = now.getHours() * 60 + now.getMinutes();
    const stops = (day.items || []).filter(i => i.kind === "stop" && plain(i.title));
    if (!stops.length) return null;
    const timed = stops.filter(x => clockMin(x.time) != null);
    if (!timed.length) return stops[0];
    return timed.find(x => clockMin(x.time) + 30 >= nowMin) || null;
  }
  function navUrlTo(s){
    const name = plain(s.title) || plain(s.kr);
    return s.placeId
      ? `https://www.google.com/maps/dir/?api=1&destination=${encodeURIComponent(name)}&destination_place_id=${encodeURIComponent(s.placeId)}&travelmode=transit`
      : `https://www.google.com/maps/dir/?api=1&destination=${encodeURIComponent(hasCoord(s) ? `${s.lat},${s.lng}` : (plain(s.kr) || name))}&travelmode=transit`;
  }
  function todayCardHtml(d){
    const day = todayDay();
    if (!day) return "";
    const n = day.id.replace("day", ""), nx = nextStopOf(day);
    return `<section class="todaycard" style="--lc:${dayColorVar(day.id)}">
      <div class="tc-top"><span class="tc-live">今日</span><span class="tc-day">Day ${esc(n)} · ${esc(day.title)}</span></div>
      ${nx ? `<div class="tc-next"><span class="tp-lbl">下一站</span><b>${esc(plain(nx.title))}</b>${clockMin(nx.time) != null ? `<span class="tc-time">${esc(fmtMin(clockMin(nx.time)))}</span>` : ""}</div>`
           : `<div class="tc-next"><b>今日嘅站行完喇</b></div>`}
      <div class="tc-acts">
        <button class="btn" data-go-today="${day.id}">睇今日行程</button>
        ${nx ? `<a class="btn primary" href="${esc(navUrlTo(nx))}" target="_blank" rel="noopener">${icon("map")}導航去下一站</a>` : ""}
      </div>
    </section>`;
  }

  // ---------- 夾錢 ----------
  // Who paid what, split among whom, and at the end who owes whom. Kept per
  // currency rather than converted, because nobody agrees on the rate.
  function moneyOf(d){
    if (!d.money) d.money = { people: [], items: [] };
    if (!Array.isArray(d.money.people)) d.money.people = [];
    if (!Array.isArray(d.money.items)) d.money.items = [];
    return d.money;
  }
  function localCurrency(){ return destIsJapan() ? "JPY" : destIsKorea() ? "KRW" : /台|taipei|taiwan/i.test(JSON.stringify((state.snapshot.meta || {}).destinationLocal || "")) ? "TWD" : "HKD"; }
  function fmtMoney(n, cur){ return `${cur} ${Math.round(n * 100) / 100 === Math.round(n) ? Math.round(n).toLocaleString("en-US") : (Math.round(n * 100) / 100).toLocaleString("en-US")}`; }
  function settle(money){
    const byCur = {};
    money.items.forEach(it => {
      const amt = +it.amount; if (!Number.isFinite(amt) || !amt || !it.paidBy) return;
      const among = (it.split && it.split.length ? it.split : money.people);
      if (!among.length) return;
      const b = byCur[it.cur] = byCur[it.cur] || {};
      b[it.paidBy] = (b[it.paidBy] || 0) + amt;
      among.forEach(p => { b[p] = (b[p] || 0) - amt / among.length; });
    });
    const out = [];
    Object.entries(byCur).forEach(([cur, bal]) => {
      const pos = Object.entries(bal).filter(x => x[1] > .005).sort((a, b) => b[1] - a[1]);
      const neg = Object.entries(bal).filter(x => x[1] < -.005).sort((a, b) => a[1] - b[1]);
      let i = 0, j = 0;
      while (i < pos.length && j < neg.length){
        const m = Math.min(pos[i][1], -neg[j][1]);
        out.push({ from: neg[j][0], to: pos[i][0], amt: m, cur });
        pos[i][1] -= m; neg[j][1] += m;
        if (pos[i][1] < .005) i++; if (neg[j][1] > -.005) j++;
      }
    });
    return out;
  }
  function moneyFoldHtml(d){
    const money = d.money || { people: [], items: [] };
    const items = money.items || [];
    const totals = {};
    items.forEach(it => { const a = +it.amount; if (Number.isFinite(a)) totals[it.cur] = (totals[it.cur] || 0) + a; });
    const st = settle({ people: money.people || [], items });
    const body = `<div class="hsblock moneyblock" data-hskey="money">
      <p class="tp-lbl">一齊去嘅人</p>
      <div class="mn-people">${(money.people || []).map((p, i) => `<span class="mn-p">${esc(p)}<button type="button" data-mp-del="${i}" aria-label="拎走${esc(p)}">×</button></span>`).join("")
        || `<span class="hint">打名加人，之後記數就揀邊個比、分俾邊個。</span>`}</div>
      <div class="mn-addrow"><input class="input" id="mp-inline" placeholder="加人，例如 阿爸" autocomplete="off" enterkeyhint="done">
        <button type="button" class="btn" data-mp-inline>加</button></div>
      <button class="btn primary wide" data-moneyadd>${icon("plus")}記一筆</button>
      ${items.length ? `<ul class="mn-list">${items.slice().reverse().map(it => `<li data-moneyitem="${esc(it.id)}">
          <span class="mn-what">${esc(it.what || "未寫")}</span><span class="mn-amt">${esc(fmtMoney(+it.amount || 0, it.cur))}</span>
          <span class="mn-sub">${esc(it.paidBy)} 比 · ${it.split && it.split.length && it.split.length !== (money.people || []).length ? esc(it.split.join("、")) + " 分" : "全部人分"}</span></li>`).join("")}</ul>` : ""}
      ${Object.keys(totals).length ? `<div class="mn-total">總共 ${Object.entries(totals).map(([c, n]) => esc(fmtMoney(n, c))).join(" · ")}</div>` : ""}
      ${st.length ? `<div class="mn-settle"><span class="tp-lbl">要比返</span>${st.map(x => `<div class="mn-row"><b>${esc(x.from)}</b> → <b>${esc(x.to)}</b><span>${esc(fmtMoney(x.amt, x.cur))}</span></div>`).join("")}</div>`
                  : items.length ? `<div class="mn-settle"><span class="tp-lbl">要比返</span><div class="mn-row">冇人欠人</div></div>` : ""}
    </div>`;
    const hint = items.length ? `${items.length} 筆` : "記低邊個比咗錢";
    return foldHtml("money", "夾錢", hint, body);
  }
  function openMoneyItemSheet(id){
    const d = state.snapshot, money = moneyOf(d);
    const it = id ? money.items.find(x => x.id === id) : null;
    const cur0 = it ? it.cur : (money.lastCur || localCurrency());
    const curs = [...new Set([cur0, localCurrency(), "HKD"])];
    openSheet(`

      <div class="field"><label>邊個比</label><select class="input" data-mf="paidBy">${money.people.map(p => `<option${it && it.paidBy === p ? " selected" : ""}>${esc(p)}</option>`).join("")}</select></div>
      <div class="field"><label>分俾邊個</label><div class="mn-split">${money.people.map(p => `<label class="mn-chk"><input type="checkbox" value="${esc(p)}"${!it || !it.split || !it.split.length || it.split.includes(p) ? " checked" : ""}>${esc(p)}</label>`).join("")}</div></div>
      <div class="editor-tools">

          split: split.length === money.people.length ? [] : split, at: it ? it.at : new Date().toISOString() };
        if (it) Object.assign(it, rec); else money.items.push(rec);
        money.lastCur = rec.cur;
        closeLayer(); render();
        await saveNow(`記低：${rec.paidBy} 比咗 ${fmtMoney(amount, rec.cur)}${rec.what ? "（" + rec.what + "）" : ""}`);
      });
    });
  }

  // The topbar brandmark sits outside #app (it's part of the fixed header,
  // not the per-view render), so it needs its own explicit update — it used
  // to be static markup hardcoded to "Seoul"/"서울 · 가을", which silently
  // kept saying Seoul on every other trip.
  function renderBrandmark(){
    const m = (state.snapshot && state.snapshot.meta) || {};
    const sys = $(".brandmark .sys"), ko = $(".brandmark .ko");
    if (sys) sys.textContent = m.title || m.destinationLocal || "行程";
    if (ko) ko.textContent = (m.destinationLocal && m.destinationLocal !== m.title) ? m.destinationLocal : (m.eyebrow || "");
    // The tab title is markup, so it can't come from the snapshot at parse
    // time — set it here or every trip shares whatever was typed in the file.
    const t = plain(m.title || "").trim();
    document.title = t ? `${t} · DumboFly` : "DumboFly";
  }
  // A description, cut to three lines until asked otherwise.
  function descHtml(s, key){
    if (!s.desc) return "";
    const open = state.descOpen.has(key);
    return `<div class="stopdesc${open ? " open" : ""}" data-desckey="${esc(key)}">${esc(s.desc)}</div>
      <button class="descmore${open ? " show" : ""}" data-descmore="${esc(key)}">${open ? "收埋" : "更多"}</button>`;
  }

  // Whether a paragraph is actually being cut depends on the column width and
  // the reader's text size, so it is measured rather than guessed from a
  // character count.
  function markClampedDescs(){
    document.querySelectorAll(".stopdesc").forEach(el => {
      const btn = el.nextElementSibling;
      if (!btn || !btn.classList.contains("descmore")) return;
      if (el.classList.contains("open")) return;          // already showing all
      btn.classList.toggle("show", el.scrollHeight > el.clientHeight + 2);
    });
    document.querySelectorAll("[data-descmore]").forEach(b => {
      if (b.dataset.wired) return;
      b.dataset.wired = "1";
      b.addEventListener("click", e => {
        e.preventDefault(); e.stopPropagation();
        const k = b.dataset.descmore;
        if (state.descOpen.has(k)) state.descOpen.delete(k); else state.descOpen.add(k);
        render();
      });
    });
  }

  // iOS kills an installed app in the background to save battery, and the
  // relaunch opens at its start URL — the trip list. So switching to Naver
  // for a minute and coming back dropped you on the home page instead of the
  // day you were reading. Where you are is remembered and put back.
  const RESUME_KEY = "dumbofly_resume";
  const RESUME_FOR_MS = 12 * 3600 * 1000;
  let goingHome = false;     // set by 主頁; leaving must not re-write the note
  function rememberPlace(){
    try {
      if (!state.tripId || goingHome) return;
      localStorage.setItem(RESUME_KEY, JSON.stringify({
        trip: state.tripId, view: state.view, y: Math.round(window.scrollY), t: Date.now() }));
    } catch (_){}
  }
  function readPlace(){
    try {
      const r = JSON.parse(localStorage.getItem(RESUME_KEY) || "null");
      return r && Date.now() - r.t < RESUME_FOR_MS ? r : null;
    } catch (_){ return null; }
  }
  let placeTimer = null;
  window.addEventListener("scroll", () => {
    clearTimeout(placeTimer); placeTimer = setTimeout(rememberPlace, 400);
  }, { passive: true });
  document.addEventListener("visibilitychange", () => { if (document.visibilityState === "hidden") rememberPlace(); });
  window.addEventListener("pagehide", rememberPlace);

  document.addEventListener("click", e => {
    if (e.target.closest && e.target.closest("#btn-home")) { goingHome = true; try { localStorage.removeItem(RESUME_KEY); } catch (_){} }
  }, true);

  function render(){
    renderBrandmark();
    renderLines();
    const app = $("#app");
    if (!state.snapshot){ app.innerHTML = `<p class="loading">載入緊行程…</p>`; return; }
    if (state.view === "notes"){ app.innerHTML = notesPageHtml(); wireNotes(); return; }
    if (state.view === "stays"){ app.innerHTML = staysPageHtml(state.snapshot); wireStaysPage(); rememberPlace(); return; }
    const board = boardById(state.view);
    if (board){ app.innerHTML = boardHtml(board); wireBoard(board); markClampedDescs(); return; }
    app.innerHTML = state.view === "overview" ? overviewHtml() : dayHtml(dayById(state.view));
    if (state.view === "overview") wireOverview(); else wireDay(dayById(state.view));
    markClampedDescs();
    if (state.view !== "overview") backfillHoursFor(dayById(state.view));
    else { backfillStayPhotos(state.snapshot); overviewUpkeep(state.snapshot); }
    rememberPlace();
  }

  // Hours used to be fetched only when the AI added a place, so every stop the
  // family put in by hand — and every stop from before the feature — never
  // had any. Opening a day now looks up whichever of its real places are
  // missing hours, one at a time, and saves once at the end. Places that
  // already have them are skipped, so this costs nothing after the first visit.
  const hoursTried = new Set();
  let hoursRunning = false;
  async function backfillHoursFor(day){
    if (hoursRunning || !day) return;
    // photos too: places added by the AI, or typed without picking from the
    // search list, arrived with none, and fetching them was a button per day
    const needsPhoto = s => !s.photoUrl && !s.noPhoto && (s.placeId || s.mapUrl) && plain(s.title);
    const todo = (day.items || []).filter(s => s && s.kind === "stop"
      && !hoursTried.has(s.placeId || s.mapUrl || s.title)
      && (needsPhoto(s) || (s.placeId && (!(s.eatMeta || []).some(c => c.cls === "meta-chip hours") || !plain(s.kr)))));
    if (!todo.length) return;
    hoursRunning = true;
    let got = 0;
    try {
      for (const s of todo){
        hoursTried.add(s.placeId || s.mapUrl || s.title);   // one attempt per place per session
        if (needsPhoto(s)){
          try {
            const r = await fetchStoredPhoto(s);
            if (r && r.ok !== false && r.url){ s.photoUrl = r.url; got++; }
            else if (r && r.reason === "nophoto") s.noPhoto = true;
          } catch (_){}
        }
        if (!s.placeId) continue;
        const before = (s.eatMeta || []).length;
        await enrichHours(s);
        if ((s.eatMeta || []).length > before) got++;
        if (await enrichLocalName(s)) got++;
      }
    } finally { hoursRunning = false; }
    if (got){
      if (state.view === day.id) render();
      await saveNow(`補返 ${got} 項地點資料（相／營業時間）`, true);
    }
  }

  // ==================================================================
  // RENDER — overview
  // ==================================================================
  // A pencil next to a heading, wired generically to HOME_EDITORS[key]
  function secEditBtn(key){
    return `<button class="secedit" data-editsec="${key}" title="改呢一段" aria-label="改呢一段">${icon("pencil")}</button>`;
  }
  // edit + hide, for the fixed home-page panels ("session" 用戶叫法) that
  // aren't custom sections but should still be removable. Hiding is soft —
  // it only stops overviewHtml from rendering the block; the underlying data
  // (stays, tripBrief, etc.) is untouched, so nothing else that reads it
  // (day pages, the AI calls) is affected, and it can always be brought back.
  const HIDDEN_SECTION_LABELS = { checklist:"出發前 checklist", money:"夾錢", acc:"住宿", weather:"天氣", clothing:"點著衫", access:"無障礙標記", ai:"AI 設定", foliage:"季節提示", transit:"交通點畀錢", schedule:"日程調動", prep:"行前準備", extra:"自己加嘅資料" };
  // editKey lets a block whose editor lives under a different name (季節提示 is
  // edited by the shared "notes" sheet) still get exactly ONE pencil — passing
  // the editor key here instead of adding a second secEditBtn beside it.
  function secTools(key, editKey){
    const label = HIDDEN_SECTION_LABELS[key] || key;
    return `<span class="sectools">${secEditBtn(editKey || key)}<button class="secedit secdel" data-delsec="${key}" data-seclabel="${esc(label)}" title="隱藏呢一段" aria-label="隱藏呢一段">${icon("trash")}</button></span>`;
  }
  function isSectionHidden(snap, key){ return Array.isArray(snap.hiddenSections) && snap.hiddenSections.includes(key); }

  // 行前準備 is ONE list. It used to be three: weather/clothing/access moved by
  // dragging a grip, the sections the family wrote moved by ↑↓ among
  // themselves only, and 季節提示 and 交通 did not move at all. So a section
  // you wrote could never rise above 交通, and 交通 could go nowhere — the
  // same app-versus-yours split again, this time in the ordering. Every block
  // is now a token in one saved order (snap.homeOrder), and every block has
  // the same ↑↓. A saved order from before simply lacks the newer tokens,
  // which land at the end in the old default order, so nothing jumps around.
  const PREP_BUILTINS = ["checklist", "weather", "clothing", "access", "foliage", "schedule", "transit"];
  // Sections are addressed by array index elsewhere, which an order cannot
  // survive; an order needs a name that does not change when the array does.
  function ensureSectionIds(d){
    (d.sections || []).forEach(s => { if (s && !s.id) s.id = newSectionId(); });
  }
  function newSectionId(){ return "s" + Date.now().toString(36) + Math.random().toString(36).slice(2, 6); }
  function prepOrder(d){
    ensureSectionIds(d);
    const own = (d.sections || []).filter(s => sectionWhere(d, s) === "prep").map(s => "s:" + s.id);
    const valid = [...PREP_BUILTINS, ...own];
    const saved = (Array.isArray(d.homeOrder) ? d.homeOrder : [])
      .filter((k, i, a) => valid.includes(k) && a.indexOf(k) === i);
    return [...saved, ...valid.filter(k => !saved.includes(k))];
  }
  function prepBlockHtml(d, k){
    if (k.startsWith("s:")){
      const i = (d.sections || []).findIndex(s => s && "s:" + s.id === k);
      return i < 0 ? "" : sectionBlockHtml(d, d.sections[i], i, "");
    }
    if (k === "foliage") return isSectionHidden(d, "foliage") ? "" : `
      <div class="hsblock" data-hskey="foliage">
        <h3>季節提示${secTools("foliage", "notes")}</h3>
        <p class="sec-sub">${d.foliageNote || ""}</p>
        ${liveCheckButtonHtml("foliage", "Check 依家嘅季節情況")}
      </div>`;
    if (k === "schedule") return (isSectionHidden(d, "schedule") || !plain(d.scheduleSwapNote || "")) ? "" : `
      <div class="hsblock" data-hskey="schedule">
        <h3>日程調動${secTools("schedule", "notes")}</h3>
        <p class="sec-sub">${d.scheduleSwapNote}</p>
      </div>`;
    if (k === "transit") return transitInfoHtml(d.transitInfo, d);
    if (k === "checklist") return checklistHtml(d);
    return homeBlockHtml(d, k);
  }
  // Movers only count blocks that are actually on screen, so ↑ on the first
  // visible block is disabled even if a hidden one sits above it in the order.
  function prepShown(d){ return prepOrder(d).filter(k => prepBlockHtml(d, k)); }
  // The line beside 行前準備 was a fixed 「天氣・衣著・交通・無障礙」: it could
  // not be edited, it still said 交通 after 交通 was hidden, and it never
  // mentioned anything the family added. Unless somebody writes their own,
  // it now lists what is really in the group, in the order it is in.
  const PREP_SHORT = { checklist:"清單", weather:"天氣", clothing:"衣著", access:"無障礙", foliage:"季節", schedule:"日程", transit:"交通" };
  function prepAutoHint(d){
    const names = prepShown(d).map(k => k.startsWith("s:")
      ? plain(((d.sections || []).find(s => s && "s:" + s.id === k) || {}).title || "")
      : PREP_SHORT[k]).filter(Boolean);
    return names.length > 5 ? names.slice(0, 5).join("・") + "…" : names.join("・");
  }
  function groupHint(d, id){
    const own = plain(((d && d.groupHints) || {})[id] || "");
    if (own) return own;
    return id === "prep" ? prepAutoHint(d) : "";
  }
  function prepBlocksHtml(d){
    const shown = prepShown(d);
    return shown.map((k, n) => withMove(prepBlockHtml(d, k),
      `<button class="secedit" data-prepmove="${esc(k)}|-1"${n === 0 ? " disabled" : ""} aria-label="移上" title="移上">${icon("up")}</button>` +
      `<button class="secedit" data-prepmove="${esc(k)}|1"${n === shown.length - 1 ? " disabled" : ""} aria-label="移落" title="移落">${icon("down")}</button>`
    )).join("");
  }
  // Every block keeps its tools in its heading's .sectools; the movers go first.
  function withMove(html, move){ return html.replace('<span class="sectools">', '<span class="sectools">' + move); }
  async function movePrepBlock(d, k, step){
    const order = prepOrder(d);
    const shown = order.filter(t => prepBlockHtml(d, t));
    const n = shown.indexOf(k), m = n + step;
    if (n < 0 || m < 0 || m >= shown.length) return;
    const a = order.indexOf(k), b = order.indexOf(shown[m]);
    [order[a], order[b]] = [order[b], order[a]];
    d.homeOrder = order;
    render();
    await saveNow("調整咗行前準備次序");
  }
  // Used to say "10 月下旬天氣" no matter what trip was loaded — a leftover
  // Seoul-trip literal that silently mislabelled every other destination's
  // weather block. Derived from the trip's own dates instead.
  function weatherHeadingLabel(meta){
    const ds = String((meta && meta.dateStart) || "").split("-");
    const de = String((meta && meta.dateEnd) || "").split("-");
    if (ds.length < 2) return "天氣參考";
    const sm = +ds[1], sd = +ds[2];
    if (de.length < 2 || +de[1] === sm){
      const third = sd <= 10 ? "上旬" : sd <= 20 ? "中旬" : "下旬";
      return `${sm} 月${third}天氣`;
    }
    return `${sm} 月 — ${+de[1]} 月天氣`;
  }
  // 住宿 used to sit inside 行前準備, between the weather table and the packing
  // list — the one wrong place for it. A hotel is not something you read once
  // before leaving; it is the address you want at the end of every day and the
  // one you hand to a taxi driver. So it is its own section now, open by
  // default, with the name in the summary line so it reads without a tap.
  //
  // The map links go through the same builders the stops use, which means a
  // Korean trip gets its Naver button here too — the place you most need to
  // navigate back to was the one place still offering only a stored link.
  // 住宿 grew into a page of its own (cards, recommendations, map, sorting),
  // so the overview keeps only what you need at a glance: which hotel on
  // which nights, and how far it is from the station.
  function stayFoldHtml(d){
    if (isSectionHidden(d, "acc")) return "";
    const stays = d.stays || [], days = d.days || [];
    const nights = st => {
      const a = dayIndexById(d, st.from), b = dayIndexById(d, st.to);
      return a < 0 ? "" : `Day ${a + 1}${b > a ? "–" + (b + 1) : ""}`;
    };
    const nSug = ((d.staySuggest || {}).hotels || []).length;
    const body = `<div class="hsblock staysum">
      ${stays.length ? stays.map(st => `<button type="button" class="staysum-row" data-go-stays>
          ${st.photoUrl ? `<img src="${esc(st.photoUrl)}" alt="" loading="lazy">` : `<span class="staysum-ph">${icon("pin")}</span>`}
          <span class="staysum-t"><span class="sgd">${esc(nights(st))}</span><b>${esc(st.name || "未填")}</b>
            ${st.station ? `<small>最近 ${esc(st.station)}${st.walk ? " · " + esc(st.walk) : ""}</small>` : ""}</span>
          <span class="staysum-go">${icon("chevron")}</span>
        </button>`).join("")
        : `<p class="hint">仲未揀酒店${days.length ? `（${days.length} 日行程）` : ""}。</p>`}
      <button class="btn${stays.length ? "" : " primary"} wide" data-go-stays>${stays.length ? "去住宿頁：改、比較、推薦" : "去揀酒店"}${nSug ? `（${nSug} 間推薦）` : ""}</button>
    </div>`;
    const names = stays.map(st => plain(st.name)).filter(Boolean);
    return foldHtml("stay", "住宿", names.length > 1 ? `${names[0]} 等 ${names.length} 間` : names[0] || "仲未揀", body);
  }
  function staysPageHtml(d){
    return `<section class="pagehead">
        <p class="eyebrow">住宿</p>
        <h1>住邊度</h1>
        <p class="sec-sub">揀咗嘅酒店喺最頂；下面可以叫 AI 推薦、自己加嚟比較，揀好會自動顯示喺主頁同每一日。</p>
      </section>
      <div class="stayspage">${stayBodyHtml(d)}</div>`;
  }
  function stayBodyHtml(d){
    const stays = d.stays || [];
    const body = `<div class="hsblock" data-hskey="acc">
        ${stays.length ? `<div class="foldtools"><span class="sectools">${secEditBtn("acc")}</span></div>` : ""}
        ${stays.length ? stays.map((st, si) => {
          const subj = { title: st.name || "", kr: st.kr || "", mapUrl: st.mapUrl || "" };
          const links = mapLinksInOrder(
            (() => { const n = destIsKorea() ? naverPlaceUrl(subj) : ""; return n
              ? `<a class="maplink" href="${esc(n)}" target="_blank" rel="noopener">${icon("map")}Naver 地圖</a>` : ""; })(),
            (() => { const g = googlePlaceUrl(subj); return g
              ? `<a class="maplink" href="${esc(g)}" target="_blank" rel="noopener">${icon("pin")}Google 地圖</a>` : ""; })(),
          );
          // A suppressed Naver button needs to say why, or it just looks like
          // the feature is broken — which is how the romanised address read.
          const wantNaver = destIsKorea() && !naverSearchable(plain(st.kr) || plain(st.name));
          return `
          <div class="stayrow${st.photoUrl ? " hasphoto" : ""}">
            <button class="secedit staydel" data-staydelete="${si}" title="刪走呢間酒店" aria-label="刪走「${esc(st.name || "呢間酒店")}」">${icon("trash")}</button>
            ${st.photoUrl ? `<div class="stayphoto"><img src="${esc(st.photoUrl)}" alt="" loading="lazy"></div>` : ""}
            <div class="v">${esc(st.name || "未填")}</div>
            ${stayStubHtml(d, st)}
            ${st.station ? `<div class="staystation">${icon("pin")}最近 <b>${esc(st.station)}</b>${st.walk ? ` · ${esc(st.walk)}` : ""}</div>` : ""}
            ${st.desc ? `<div class="d">${esc(st.desc)}</div>` : ""}
            ${st.hoursChip ? `<div class="chiprow"><span class="meta-chip hours">${esc(st.hoursChip)}</span></div>` : ""}
            ${st.warning ? `<div class="d">${esc(st.warning)}</div>` : ""}
            ${(links.length || st.kr) ? `<div class="chiprow">${links.join("")}${copyBtnHtml({ kr: st.kr })}${taxiBtnHtml(st.kr, st.name)}</div>` : ""}
            ${wantNaver ? `<p class="hint">Naver 搵唔到英文拼音地址。撳上面枝筆填返韓文地址，就會多一粒 Naver 掣。</p>` : ""}
            <div class="stayacts">
              <button class="btn" data-editsec="acc">${icon("pencil")}改日子／資料</button>
              <button class="btn" data-stayunpick="${si}">${icon("close")}唔揀呢間</button>
            </div>
          </div>`; }).join("")
          : `<div class="stayempty"><p class="hint">仲未填住宿。自己加，或者叫 AI 建議邊幾晚住邊區。</p>
              <button class="btn" data-editsec="acc">${icon("plus")}自己加酒店</button></div>`}
      </div>
      ${staySuggestHtml(d)}
      <div class="sechide"><button class="secedit wordy secdel" data-delsec="acc" data-seclabel="住宿">${icon("trash")}喺主頁收埋「住宿」</button></div>`;
    return body;
  }

  function homeBlockHtml(d, key){
    if (isSectionHidden(d, key)) return "";
    if (key === "weather"){
      // a new trip has no numbers yet; an empty table is worse than no block
      if (!(d.weatherRows || []).length) return "";
      return `<div class="hsblock" data-hskey="weather">
        <h3>${esc(weatherHeadingLabel(d.meta))}${secTools("weather")}</h3>
        <p class="sec-sub">${d.weatherFrom === "lastyear" ? "去年同一段日子嘅實際天氣，做參考" : "歷年同期平均"}，出發前一週撳下面粒掣 check 返實時預報。</p>
        <table class="wtable">
          <tr><th>日期</th><th>日高</th><th>晨低</th><th>概況</th></tr>
          ${(d.weatherRows||[]).map(r=>`<tr><td class="mono">${esc(r.date)}</td><td class="hi">${esc(r.hi)}</td><td class="lo">${esc(r.lo)}</td><td>${esc(r.note)}</td></tr>`).join("")}
        </table>
        ${liveCheckButtonHtml("weather", "Check 依家嘅實時預報")}
      </div>`;
    }
    if (key === "clothing"){
      if (!(d.clothing || []).length) return "";
      return `<div class="hsblock" data-hskey="clothing">
        <h3>點著衫${secTools("clothing")}</h3>
        <ul class="clist">${(d.clothing||[]).map(c=>`<li>${c.icon ? `<span class="ico">${esc(c.icon)}</span>` : ""}<div>${c.html}</div></li>`).join("")}</ul>
      </div>`;
    }
    // access
    return `<div class="hsblock" data-hskey="access">
      <h3>無障礙標記${secTools("access")}</h3>
      <p class="sec-sub">每個地點都會標返路況。</p>
      <div class="legend">
        <div class="legend-item"><span class="legend-dot" style="background:var(--ok)"></span>${esc((d.accessLegend||[])[0]||"")}</div>
        <div class="legend-item"><span class="legend-dot" style="background:var(--warn)"></span>${esc((d.accessLegend||[])[1]||"")}</div>
        <div class="legend-item"><span class="legend-dot" style="background:var(--danger)"></span>${esc((d.accessLegend||[])[2]||"")}</div>
      </div>
      <p class="sec-sub" style="margin-top:11px;">${d.elevatorTip||""}</p>
    </div>`;
  }
  async function hideSection(key, label){
    if (!confirm(`隱藏「${label}」呢段？資料唔會刪，隨時可以喺主頁最底「顯示返」。`)) return;
    const snap = state.snapshot;
    if (!Array.isArray(snap.hiddenSections)) snap.hiddenSections = [];
    if (!snap.hiddenSections.includes(key)) snap.hiddenSections.push(key);
    render();
    await saveNow(`隱藏咗首頁「${label}」`);
  }
  async function unhideSection(key, label){
    const snap = state.snapshot;
    snap.hiddenSections = (snap.hiddenSections || []).filter(k => k !== key);
    render();
    await saveNow(`顯示返首頁「${label}」`);
  }
  // A quick "check the real thing now" button sitting right under the static
  // historical-average content, instead of only living inside the separate
  // AI 助手 sheet — the copy said "check 返實時預報" but gave no way to
  // actually do that without leaving the page to hunt for the right button.
  // Gated on a per-session opt-in toggle (aiRefreshToggleHtml) — a user who
  // doesn't want THIS particular block bothering Gemini can turn it off, and
  // the button just disappears rather than sitting there disabled.
  function liveCheckButtonHtml(kind, label){
    const last = (state.snapshot.lastLiveCheck || {})[kind];
    return `<button class="btn" data-livecheck="${kind}" style="margin-top:9px;">${esc(label)}</button>
            <div class="lastupd" id="lastupd-${kind}">${last ? "上次 check：" + esc(whenLabel(last)) : ""}</div>
            <div class="ai-out" id="livecheck-${kind}"></div>`;
  }
  // "16:20" today, "8月15日 16:20" before that — a bare ISO string tells the
  // reader nothing about whether what they're looking at is fresh.
  function whenLabel(iso){
    const t = new Date(iso);
    if (!Number.isFinite(t.getTime())) return "";
    const now = new Date();
    const mins = Math.round((now - t) / 60000);
    if (mins < 1) return "啱啱";
    if (mins < 60) return mins + " 分鐘前";
    const sameDay = t.toDateString() === now.toDateString();
    const hm = t.toLocaleTimeString("zh-HK", { hour:"2-digit", minute:"2-digit", hour12:false });
    return sameDay ? "今日 " + hm : `${t.getMonth() + 1}月${t.getDate()}日 ${hm}`;
  }
  // These buttons used to be read-only: they fetched the real answer, printed
  // it, and left you to retype it into the section yourself. Nobody does that,
  // so the section stayed stale while the button underneath it said 「啱啱
  // check 咗」 — the worst of both, wrong data wearing a fresh timestamp.
  //
  // The answer now comes with a button that writes it in. Never on its own,
  // and never above the answer: what it replaces is something a person wrote
  // by hand, so you read the new version first and then decide. Every save is
  // a version, so a change of mind is one tap in 改動紀錄.
  function offerApply(out, kind, payload){
    const has = kind === "weather" ? (payload && payload.length) : !!String(payload || "").trim();
    if (!has) return;
    const preview = kind === "weather"
      ? `<div class="applyprev">${payload.map(x =>
          `${esc(x.date)}　${esc(x.hi)} / ${esc(x.lo)}　${esc(x.note)}`).join("<br>")}</div>`
      : "";
    const label = kind === "weather" ? `套用呢 ${payload.length} 日落張天氣表` : "套用做季節提示";
    out.insertAdjacentHTML("beforeend", preview + `
      <div class="applybar">
        <button class="btn primary" data-apply>${esc(label)}</button>
        <span class="hint">會換走而家嗰份，改動紀錄度還原得返。</span>
      </div>`);
    const btn = out.querySelector("[data-apply]");
    if (!btn) return;
    btn.addEventListener("click", async () => {
      btn.disabled = true;
      const d = state.snapshot;
      if (kind === "weather"){ d.weatherRows = payload; }
      else { d.foliageNote = String(payload); }
      render();
      await saveNow(kind === "weather" ? "用實時預報更新咗天氣表" : "用實時資料更新咗季節提示");
      flash(kind === "weather" ? "天氣表更新咗" : "季節提示更新咗");
    });
  }

  // The answer used to arrive as two bare boxes that looked just like the
  // section's own text, so nobody could tell which part was the AI's fresh
  // result. It is now one labelled panel with the time it was fetched, and
  // each part says what it is.
  function liveResultHtml(what, parts){
    const t = new Date();
    const now = `${t.getMonth() + 1}月${t.getDate()}日 ${String(t.getHours()).padStart(2, "0")}:${String(t.getMinutes()).padStart(2, "0")}`;
    return `<div class="liveres">
      <div class="liveres-head">${icon("sparkle")}AI 最新${esc(what)}結果 · ${esc(now)}</div>
      ${parts.filter(x => plain(x[1] || "")).map(([k, v]) =>
        `<div class="liveres-part"><div class="liveres-k">${esc(k)}</div><div class="liveres-v">${esc(v)}</div></div>`).join("")}
    </div>`;
  }

  function markLiveChecked(kind){
    const d = state.snapshot;
    d.lastLiveCheck = d.lastLiveCheck || {};
    d.lastLiveCheck[kind] = new Date().toISOString();
    // patch the label in place — a full render would wipe the answer the user
    // is reading right now
    const el = document.getElementById("lastupd-" + kind);
    if (el) el.textContent = "上次 check：啱啱";
    saveNow("check 咗最新資料", true);
  }
  // There used to be a 「🔄 AI 自動更新（開）」 checkbox in front of every one of
  // these buttons, gating whether the button showed at all. It never actually
  // auto-updated anything — nothing here runs without someone tapping it — so
  // the checkbox was one extra line of UI per block explaining a setting that
  // did nothing but hide a button. The stored aiRefresh / aiRefreshToggles
  // fields are left alone in old snapshots; they're simply not read any more.
  function wireLiveChecks(){
    document.querySelectorAll("[data-livecheck]").forEach(btn => btn.addEventListener("click", async () => {
      if (btn.disabled) return;
      const kind = btn.dataset.livecheck;   // "weather" | "foliage"
      const out = document.getElementById(`livecheck-${kind}`);
      if (!out) return;
      btn.disabled = true;
      const stop = busyIn(out, { steps:[kind === "weather" ? "問緊實時天氣" : "問緊當地季節情況"], hint:"大約 10-30 秒。" });
      try {
        const r = await callAi({ action: kind });
        stop();
        if (kind === "weather"){
          const hasForecast = !!(r.raw && r.raw.daily && (r.raw.daily.time || []).length);
          const m0 = state.snapshot.meta || {};
          const lastDay = r.raw && r.raw.daily && (r.raw.daily.time || []).slice(-1)[0];
          const tail = hasForecast && lastDay && m0.dateEnd && lastDay < m0.dateEnd
            ? `\n（${lastDay} 之後嘅日子預報仲未出，過幾日再 check。）` : "";
          out.innerHTML = liveResultHtml("天氣", [
            [hasForecast ? "實時預報" : "預報狀態", (r.summary || "") + tail],
            ["AI 建議", r.aiSummary || r.aiNotice],
          ]);
          saveAiNote("weather", "實時天氣", [r.summary, r.aiSummary || r.aiNotice].filter(Boolean).join("\n\n"));
          if (r.summary || r.aiSummary) markLiveChecked(kind);
          offerApply(out, kind, weatherRowsFromDaily(r.raw && r.raw.daily));
        } else {
          const a = r.aiSummary || r.message || "冇回覆";
          out.innerHTML = liveResultHtml("季節情況", [["AI 搜尋結果", a]]);
          if (r.aiSummary){ saveAiNote("foliage", "季節情況", a); markLiveChecked(kind); }
          offerApply(out, kind, r.aiSummary ? a : "");
        }
      } catch (e){
        stop(); out.innerHTML = `<div class="ai-msg">出咗問題：${esc(e.message)}</div>`;
      }
      btn.disabled = false;
    }));
  }
  function hiddenSectionsHtml(d){
    const hidden = (Array.isArray(d.hiddenSections) ? d.hiddenSections : []).filter(k => HIDDEN_SECTION_LABELS[k]);
    if (!hidden.length) return "";
    // Folded like everything else that is not the itinerary — this is a
    // recovery drawer, not something anyone reads on the way in.
    return `
      <section class="sec">
        <p class="sec-sub">資料冇刪，撳「顯示返」就再出返喺主頁。</p>
        <div class="chiprow">${hidden.map(k =>
          `<button class="btn" data-unhidesec="${k}">顯示返「${esc(HIDDEN_SECTION_LABELS[k])}」</button>`).join("")}</div>
      </section>`;
  }

  // Up to four real places per day, as the stations on that day's line.
  // Logistics rows ("酒店出發", "飛返香港") carry no place id, and listing
  // them would fill the overview with words that tell you nothing.
  function lineStations(day){
    const stops = (day.items || []).filter(i => i && i.kind === "stop");
    const real = stops.filter(s => (s.placeId || s.mapUrl) && plain(s.title));
    const pick = (real.length ? real : stops).filter(s => plain(s.title));
    const names = pick.slice(0, 4).map(s => plain(s.title));
    return { names, more: Math.max(0, pick.length - names.length) };
  }

  // A collapsible group. Everything that is not the itinerary lives inside
  // one of these, shut by default: the overview used to open on nine
  // equally-weighted walls of text, so the trip itself — the only thing
  // anybody opens this page for — was just one more block among them.
  function foldHtml(key, title, hint, inner){
    if (!inner || !String(inner).trim()) return "";
    const open = state.foldOpen.has(key);
    return `<section class="fold${open ? " open" : ""}">
      <button class="fold-head" data-fold="${key}" aria-expanded="${open}">
        <span class="fold-t">${esc(title)}</span>
        ${hint ? `<span class="fold-h">${esc(hint)}</span>` : ""}
        <span class="fold-c">${icon("chevron")}</span>
      </button>
      ${open ? `<div class="fold-body">${inner}</div>` : ""}
    </section>`;
  }

  function overviewHtml(){
    const d = state.snapshot;
    const m = d.meta || {};

    // The line map. Each day is a line: its own colour, its number in a
    // badge, and the stations you will actually stand in.
    const lines = d.days.map(day => {
      const n = String(day.id).replace("day", "");
      const st = lineStations(day);
      const count = (day.items || []).filter(i => i.kind === "stop").length;
      return `
        <button class="dayline" data-go="${day.id}" style="--lc:${dayColorVar(day.id)}">
          <span class="dayline-rail"><span class="dayline-dot">${esc(n)}</span></span>
          <span class="dayline-body">
            <span class="dayline-top">
              <span class="dayline-title">${esc(day.title)}</span>
              <span class="dayline-when">${esc(day.date)}</span>
            </span>
            ${plain(day.desc) ? `<span class="dayline-desc">${esc(plain(day.desc))}</span>` : ""}
            ${st.names.length ? `<span class="dayline-stops">${
              st.names.map(x => `<span>${esc(x)}</span>`).join("")
            }${st.more ? `<span class="dayline-more">＋${st.more}</span>` : ""}</span>` : ""}
            <span class="dayline-count">${count} 站</span>
          </span>
        </button>`;
    }).join("");

    const prep = [
      groupToolsHtml(d, "prep"),
      addSectionBtn(d, "prep"),
      `<div class="prepblocks" data-prepblocks>${prepBlocksHtml(d)}</div>`,
    ].join("");

    const aiPanel = isSectionHidden(d, "ai") ? "" : `
      <p class="sec-sub">AI 每次答嘢之前都會先睇呢段背景，改咗佢，全部 AI 功能都會跟住轉。${secTools("ai")}</p>
      <div class="panel">
        <div class="d" style="white-space:pre-wrap;">${esc(briefText(d) || defaultTripBrief(d))}</div>
        ${briefText(d) ? "" : `<div class="d" style="opacity:.7;margin-top:6px;">（而家用緊預設）</div>`}
      </div>`;

    const mapPanel = `
      <p class="sec-sub">${d.days.length} 日路線一次過睇晒，撳圖例可以單獨開關某一日。</p>
      <div class="mapbox tall" id="map-all"></div>
      <div class="chiprow" id="map-legend"></div>
      <p class="mapcap">示意路線，非精確導航；離市中心好遠嘅地點，比例上會壓縮顯示。清單度揸低嘅心水地點，未排入行程，所以冇連線。</p>`;

    return `
      <section class="hero tpass">
        ${passRouteHtml(d)}
        <div class="eyebrow">${esc(m.eyebrow || defaultEyebrow(d))}${secEditBtn("hero")}</div>
        <h1>${esc(m.title || "我嘅行程")}</h1>
        <div class="hero-meta">
          ${(m.facts && m.facts.length ? m.facts : defaultFacts(d))
            .map(f => `<span>${esc(f)}</span>`).join("<span>·</span>")}
        </div>
        <div class="chiprow">${(m.hotelTags||[]).map(t=>`<span class="badge">${esc(t)}</span>`).join("")}</div>
        ${passStubHtml(d)}
      </section>

      ${todayCardHtml(d)}
      <nav class="linemap" aria-label="每一日">
        ${lines}
      </nav>

      ${flightFoldHtml(d)}
      ${stayFoldHtml(d)}
      ${foldHtml("map", "全程地圖", `${d.days.length} 日路線`, mapPanel)}
      ${isSectionHidden(d, "prep") ? "" : foldHtml("prep", groupTitle(d, "prep"), groupHint(d, "prep"), prep)}
      ${userGroups(d).map(g => groupFoldHtml(d, g)).join("")}
      ${isSectionHidden(d, "extra") ? "" : foldHtml("extra", groupTitle(d, "extra"), groupHint(d, "extra"), customSectionsHtml(d))}
      ${moneyFoldHtml(d)}
      ${foldHtml("ai", "AI 設定", "AI 答嘢用嘅背景", aiPanel)}
      ${foldHtml("hidden", "隱藏咗嘅段落", "", hiddenSectionsHtml(d))}

      <button class="btn wide addgroup" id="addgroup">＋ 加一個大段落</button>

      <footer>
        <div class="fbrand">${esc(m.title || "我嘅行程")}</div>
        營業時間、評分同地圖連結僅供參考，出發前請再確認一次。<br>
        地圖為示意路線，實際導航請以地圖 app 為準。<br>
        地點相片由 Google Places 提供。行程可以一齊編輯，每次改動都會自動存低版本。<br>
        祝旅途愉快
        <div class="buildstamp">版本 ${esc(BUILD)}</div>
      </footer>
    `;
  }

  // ---------- how to pay for transport ----------
  function transitInfoHtml(t, d){
    if (!t || isSectionHidden(d, "transit")) return "";
    const cards = (t.cards || []).map(c => `
      <div class="fare-card${c.pick ? " pick" : ""}">
        <div class="fare-top">
          <span class="fare-name">${esc(c.name)}${c.kr ? `<span class="kr">${esc(c.kr)}</span>` : ""}</span>
          ${c.pick ? `<span class="badge note">建議</span>` : ""}
        </div>
        <div class="fare-price mono">${esc(c.price)}</div>
        ${c.good ? `<div class="fare-line good">${icon("check")}${esc(c.good)}</div>` : ""}
        ${c.bad ? `<div class="fare-line bad">${icon("close")}${esc(c.bad)}</div>` : ""}
      </div>`).join("");

    const fares = (t.fares || []).map(f =>
      `<tr><td>${esc(f.what)}</td><td class="hi mono">${esc(f.cost)}</td><td>${esc(f.note || "")}</td></tr>`).join("");

    const arrival = t.arrival ? `
      <div class="panel callout">
        <div class="k">${icon("warn")}${esc(t.arrival.title)}</div>
        <div class="d">${esc(t.arrival.body)}</div>
        ${(t.arrival.options || []).map(o => `
          <div class="opt">
            <div class="opt-name">${esc(o.name)} <span class="mono opt-cost">${esc(o.cost)}</span></div>
            <div class="opt-note">${esc(o.note)}</div>
          </div>`).join("")}
      </div>` : "";

    return `
      <div class="hsblock" data-hskey="transit">
        <h3>${esc(t.title || "交通點畀錢")}${secTools("transit")}</h3>
        <p class="sec-sub">${esc(t.intro || "")}</p>
        ${t.verdict ? `<div class="panel verdict"><div class="k">結論</div><div class="d">${esc(t.verdict)}</div></div>` : ""}
        ${cards ? `<div class="fare-grid">${cards}</div>` : ""}
        ${fares ? `<h3>大約幾多錢</h3>
          <table class="wtable"><tr><th>項目</th><th>車費</th><th>備註</th></tr>${fares}</table>` : ""}
        ${arrival}
        ${(t.tips || []).length ? `<h3>實用貼士</h3><ul class="clist">${
          t.tips.map(x => `<li><span class="ico">·</span><div>${esc(x)}</div></li>`).join("")}</ul>` : ""}
        ${t.asOf ? `<p class="mapcap">${esc(t.asOf)}</p>` : ""}
      </div>`;
  }

  // ---------- 自訂 section（天氣、手信、換錢…） ----------
  // The home page used to be a fixed set of panels baked into the markup, so
  // anything else the family wanted to keep together had nowhere to live.
  // These are ordinary snapshot data: everyone sees them, they're versioned,
  // and they can be written by hand or generated by AI from a topic.
  // A section used to have exactly one home: the 自己加嘅資料 fold at the bottom.
  // But most of what people write down — 換錢、上網卡、行李 — is the same KIND of
  // thing as the weather and the packing advice already sitting in 行前準備, and
  // belongs beside them rather than a fold further down. So a section now says
  // where it lives. Anything written before this defaults to where it already
  // was, so nothing moves on its own.
  // 行前準備 and 自己加嘅資料 were the only two places a section could go, and
  // that was an arbitrary limit: 「交通點畀錢」 is itself a block of this kind,
  // it just happened to be one the app shipped with. A trip can now carry its
  // own top-level sections — named, foldable, and holding as many sections as
  // the family wants to put in them.
  function userGroups(d){ return Array.isArray(d && d.groups) ? d.groups : []; }
  function groupById(d, id){ return userGroups(d).find(g => g.id === id) || null; }
  // A section remembers a group by id. If that group is later deleted the id
  // means nothing, and the section must fall back somewhere visible rather
  // than disappear into a fold that no longer exists.
  function sectionWhere(d, s){
    const w = String((s && s.where) || "extra");
    if (w === "prep" || w === "extra") return w;
    return groupById(d, w) ? w : "extra";
  }
  function whereOptions(d){
    return [
      { value:"prep", label:"行前準備（同天氣、著衫擺埋一齊）" },
      ...userGroups(d).map(g => ({ value:g.id, label:(g.title || "未命名") + "（自己開嘅）" })),
      { value:"extra", label:"自己加嘅資料（主頁下面）" },
    ];
  }
  // `data-usec` is the index into d.sections, NOT the position in this list —
  // the edit and delete buttons address the real array, and a filtered list
  // would otherwise point them at the wrong section.
  function addSectionBtn(d, where){
    return `<button class="btn wide addusec" data-addusec="${where}">＋ 喺「${esc(whereLabel(d, where))}」加一個 section</button>`;
  }
  function moveBtns(where, k, total){
    return `<button class="secedit" data-usecmove="${where}:${k}:-1"${k === 0 ? " disabled" : ""} aria-label="移上" title="移上">${icon("up")}</button>` +
           `<button class="secedit" data-usecmove="${where}:${k}:1"${k === total - 1 ? " disabled" : ""} aria-label="移落" title="移落">${icon("down")}</button>`;
  }
  function sectionBlockHtml(d, s, i, move){
    return `
        <div class="usec" data-usec="${i}">
          <h3>${s.icon ? esc(s.icon) + " " : ""}${esc(s.title || "未命名")}<span class="sectools">
            ${move}
            <button class="secedit" data-usecedit="${i}" aria-label="改" title="改">${icon("pencil")}</button>
            <button class="secedit secdel" data-usecdel="${i}" aria-label="刪走" title="刪走">${icon("trash")}</button>
          </span></h3>
          ${s.sub ? `<p class="sec-sub">${esc(s.sub)}</p>` : ""}
          ${sectionLinesHtml(s.lines || [], s, i)}
          ${sectionLinksHtml(s)}
          <button class="btn" data-secrefresh="${i}" style="margin-top:9px;">${icon("refresh")}問 AI 攞「${esc(s.topic || s.title || "呢個題目")}」最新資料</button>
          <div class="lastupd">${s.updatedAt ? "上次更新：" + esc(whenLabel(s.updatedAt)) : "重未更新過"}</div>
          <div class="ai-out" id="secout-${i}"></div>
        </div>`;
  }
  // A wall of ten full sentences is hard to scan on a phone. Each line leads
  // with its point in bold (the words before the first ：or ，), and past the
  // first five the rest fold away.
  function splitLine(l){
    const t = plain(l).trim();
    const m = t.match(/^(.{2,16}?)[：:]\s*(.+)$/) || t.match(/^(.{3,14}?)，(.+)$/);
    return m ? { head: m[1].trim(), body: m[2].trim(), text: t } : { head: "", body: t, text: t };
  }
  // An AI note that names a place ("永觀堂（京都）— 紅葉之王…") is a
  // suggestion you act on, so it gets a button to drop it into a day. Lines
  // that are advice rather than places — transport, clothing, money — don't.
  const NOT_A_PLACE = /交通|安排|貼士|注意|天氣|氣溫|穿搭|著衫|衣著|預算|貨幣|找換|上網|行李|提示|建議|記得|時間|時段|門票|預約|排隊|保暖|洋蔥|外套|落雨|雨具|鞋|錢|卡$|簽證|入境|保險|退稅|攻略|總結|重點|心得|當造|當季|季節|時令|水果|士多啤梨|特產|手信|食材|限定|必食|必買|美食$/;
  function lineIsPlace(sec, head){
    if (!sec || sec.source !== "ai" || !head) return false;
    if (/天氣同點著衫|交通、上網卡同貨幣|行李同出發前準備清單/.test(sec.topic || "")) return false;
    return !NOT_A_PLACE.test(head);
  }
  function placeFromHead(head){
    const region = (head.match(/[（(]([^）)]+)[）)]/) || [])[1] || "";
    return { name: head.replace(/[（(][^）)]*[）)]/g, "").trim(), region };
  }
  function sectionLineHtml(l, sec, si, li){
    const { head, body, text } = splitLine(l);
    let tool = "";
    if (lineIsPlace(sec, head)){
      const { name } = placeFromHead(head);
      const inDay = findInItinerary(state.snapshot, { title: name });
      tool = inDay
        ? `<button type="button" class="usec-inday" data-inday-go="${esc(inDay.id)}" style="--lc:${dayColorVar(inDay.id)}">已喺 D${esc(inDay.id.replace("day", ""))}</button>`
        : `<button type="button" class="usec-add" data-addplace="${si}|${li}">${icon("plus")}加去行程</button>`;
    }
    return head ? `<li><b>${esc(head)}</b><span>${esc(body)}</span>${tool}</li>` : `<li><span>${esc(text)}</span></li>`;
  }
  function sectionLinesHtml(lines, sec, si){
    if (!lines.length) return "";
    const head = lines.slice(0, 5), rest = lines.slice(5);
    const row = (l, k) => sectionLineHtml(l, sec, si, k);
    return `<ul class="usec-list">${head.map((l, k) => row(l, k)).join("")}</ul>` +
      (rest.length ? `<details class="usec-more"><summary>睇多 ${rest.length} 項</summary><ul class="usec-list">${rest.map((l, k) => row(l, k + 5)).join("")}</ul></details>` : "");
  }
  // Pick a day (or a 心水清單) for a place the AI suggested. It lands at the
  // end of that day and goes through the same steps as a typed-in stop:
  // matched on Google, photo, hours, then the leg into it is worked out.
  function openAddPlaceSheet(si, li){
    const snap = state.snapshot;
    const sec = (snap.sections || [])[si];
    const line = sec && (sec.lines || [])[li];
    if (!line) return;
    const { head, body } = splitLine(line);
    openAddPlaceSheetFor(Object.assign(placeFromHead(head), { body }));
  }
  function openAddPlaceSheetFor({ name, region, body, time, day: preDay }){
    const snap = state.snapshot;
    const boards = snap.boards || [];
    openSheet(`
      <h3>將「${esc(name)}」加去邊度？</h3>
      <p class="sec-sub">${esc(body)}</p>

  // Official sites worth having one tap away, by country and by what the
  // section is about. Only real, long-lived addresses; the AI's own links are

  function usefulLinksFor(topic){
    const t = String(topic || "");
    const mo = +(String((state.snapshot.meta || {}).dateStart || "").split("-")[1] || 0);
    const jp = destIsJapan(), kr = destIsKorea(), tw = /台灣|台北|臺北|台中|高雄|taipei|taiwan/i.test(JSON.stringify((state.snapshot.meta || {}).destinationLocal || ""));
    const L = [];
    if (/天氣|著衫/.test(t)){
      if (jp) L.push({ name:"tenki.jp 天氣", url:"https://tenki.jp/" }, { name:"日本氣象廳", url:"https://www.jma.go.jp/" });
      if (kr) L.push({ name:"韓國氣象廳", url:"https://www.weather.go.kr/" });
      if (tw) L.push({ name:"中央氣象署", url:"https://www.cwa.gov.tw/" });
    }
    if (/季節|紅葉|櫻花/.test(t)){
      if (jp && mo >= 9 && mo <= 12) L.push({ name:"紅葉見頃情報（tenki.jp）", url:"https://tenki.jp/kouyou/" });
      if (jp && mo >= 2 && mo <= 5) L.push({ name:"櫻花開花情報（tenki.jp）", url:"https://tenki.jp/sakura/" });
      if (jp) L.push({ name:"JNTO 日本旅遊", url:"https://www.japan.travel/hk/" });
      if (kr) L.push({ name:"VisitKorea", url:"https://english.visitkorea.or.kr/" });
      if (tw) L.push({ name:"台灣觀光署", url:"https://www.taiwan.net.tw/" });
    }
    if (/交通|上網|貨幣|行李|出發前/.test(t)){
      if (jp) L.push({ name:"Visit Japan Web 入境登記", url:"https://www.vjw.digital.go.jp/" });
      if (kr) L.push({ name:"K-ETA 電子旅行許可", url:"https://www.k-eta.go.kr/" });
      if (tw) L.push({ name:"台北捷運", url:"https://www.metro.taipei/" });
    }
    return L;
  }
  function sectionLinksHtml(s){

  function openBuiltinGroupRename(d, id){

  // Deleting the box must not delete what was in it. Its sections go back to

  async function deleteGroup(id){
    const d = state.snapshot;

    const kept = (d.sections || []).filter(s => String(s.where || "") === id);
    const msg = kept.length

  function blankSection(where){ return { id: newSectionId(), icon:"", title:"", sub:"", lines:[], links:[], source:"manual", topic:"", aiRefresh:false, where: where || "extra" }; }
  // `from`/`to` are positions within ONE group, so they are mapped back onto
  // that group's own slots in d.sections — the other group never moves.
  async function reorderCustomSections(snap, where, from, to){
    const all = Array.isArray(snap.sections) ? snap.sections : [];
    const slots = all.map((s, i) => i).filter(i => sectionWhere(snap, all[i]) === where);
    if (from < 0 || from >= slots.length || to < 0 || to >= slots.length) return;
    const order = slots.slice();
    const [moved] = order.splice(from, 1);
    order.splice(to, 0, moved);
    const picked = order.map(i => all[i]);
    slots.forEach((slot, k) => { all[slot] = picked[k]; });
    render();
    await saveNow("調整咗自己加嘅 section 次序");
  }

  function openSectionEditor(idx, where, title){
