<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#F4F5F7" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0D1014" media="(prefers-color-scheme: dark)">
<title>首爾秋楓銀杏行 ｜ 10.23–10.28</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wdth,wght@12..96,75..100,400..800&family=Noto+Sans+TC:wght@400;500;700;900&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<style>
/* ============================================================
   SEOUL TRANSIT DIAGRAM — design tokens
   The trip is a transit system: each day is a line, each stop a
   station, each connector a segment whose stroke encodes the mode.
   ============================================================ */
:root{
  color-scheme: light dark;

  --paper:#F4F5F7;
  --surface:#FFFFFF;
  --surface-2:#EAEDF2;
  --ink:#14171C;
  --ink-soft:#5C6472;
  --ink-faint:#949CAA;
  --rule:#DDE2E9;
  --rule-soft:#EBEEF2;
  --shadow-1:0 1px 2px rgba(20,23,28,.05), 0 6px 16px -10px rgba(20,23,28,.16);
  --shadow-2:0 2px 6px rgba(20,23,28,.08), 0 18px 40px -18px rgba(20,23,28,.28);

  /* Seoul Metro line colours, one per day */
  --d1:#8A94A6;  /* 抵達 — night flight, off-network */
  --d2:#0FA958;  /* 古宮 — line 2 green */
  --d3:#00A5DE;  /* 南怡島 — line 4 blue */
  --d4:#EF7C1C;  /* 聖水洞 — line 3 orange */
  --d5:#9B6FB0;  /* 德壽宮 — line 5 purple */
  --d6:#BB8336;  /* 銀杏尾聲 — line 9 gold */

  --ok:#0E9E52;
  --ok-bg:#E7F6ED;
  --warn:#C96A10;
  --warn-bg:#FDF0E1;
  --danger:#CE4034;
  --danger-bg:#FBEBE9;
  --niece:#C93B92;
  --niece-bg:#FCEBF5;
  --info:#1D7FC4;
  --info-bg:#E7F2FB;
  --bookmark:#6B6FD1;
  --bookmark-bg:#EDECFB;

  --r-sm:8px;
  --r-md:12px;
  --r-lg:18px;
  --r-xl:26px;

  --rail-w:30px;
  --tap:44px;
}

@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --paper:#0D1014;
    --surface:#161A20;
    --surface-2:#1E232B;
    --ink:#E9ECF1;
    --ink-soft:#98A1B0;
    --ink-faint:#6C7686;
    --rule:#272D37;
    --rule-soft:#1E232B;
    --shadow-1:0 1px 2px rgba(0,0,0,.5), 0 6px 16px -10px rgba(0,0,0,.7);
    --shadow-2:0 2px 6px rgba(0,0,0,.55), 0 18px 40px -18px rgba(0,0,0,.85);
    --d1:#98A2B4;
    --d2:#2ABE72;
    --d3:#38B8E8;
    --d4:#F79240;
    --d5:#B287C5;
    --d6:#D2A055;
    --ok:#3CC177; --ok-bg:#12291C;
    --warn:#E5964A; --warn-bg:#2C2013;
    --danger:#E8695C; --danger-bg:#2E1917;
    --niece:#EC81C0; --niece-bg:#2C1727;
    --info:#54AEEA; --info-bg:#122534;
    --bookmark:#9B9EFA; --bookmark-bg:#211F3C;
  }
}
:root[data-theme="dark"]{
  --paper:#0D1014;
  --surface:#161A20;
  --surface-2:#1E232B;
  --ink:#E9ECF1;
  --ink-soft:#98A1B0;
  --ink-faint:#6C7686;
  --rule:#272D37;
  --rule-soft:#1E232B;
  --shadow-1:0 1px 2px rgba(0,0,0,.5), 0 6px 16px -10px rgba(0,0,0,.7);
  --shadow-2:0 2px 6px rgba(0,0,0,.55), 0 18px 40px -18px rgba(0,0,0,.85);
  --d1:#98A2B4;
  --d2:#2ABE72;
  --d3:#38B8E8;
  --d4:#F79240;
  --d5:#B287C5;
  --d6:#D2A055;
  --ok:#3CC177; --ok-bg:#12291C;
  --warn:#E5964A; --warn-bg:#2C2013;
  --danger:#E8695C; --danger-bg:#2E1917;
  --niece:#EC81C0; --niece-bg:#2C1727;
  --info:#54AEEA; --info-bg:#122534;
  --bookmark:#9B9EFA; --bookmark-bg:#211F3C;
}

*{box-sizing:border-box;}
html{-webkit-text-size-adjust:100%;}
body{
  margin:0;
  background:var(--paper);
  color:var(--ink);
  font-family:'Noto Sans TC','Hiragino Sans TC','Microsoft JhengHei',system-ui,sans-serif;
  font-size:15px;
  line-height:1.65;
  -webkit-font-smoothing:antialiased;
  padding-bottom:calc(76px + env(safe-area-inset-bottom));
  overflow-wrap:break-word;
}
:focus-visible{outline:2.5px solid var(--d3);outline-offset:2px;border-radius:4px;}
button{font-family:inherit;color:inherit;}
img{max-width:100%;}

.mono{font-family:'JetBrains Mono',ui-monospace,monospace;font-variant-numeric:tabular-nums;}
.disp{font-family:'Bricolage Grotesque','Noto Sans TC',system-ui,sans-serif;font-optical-sizing:auto;}

.wrap{max-width:720px;margin:0 auto;padding:0 16px;}

/* ---------- top bar ---------- */
.topbar{
  position:sticky;top:0;z-index:50;
  background:color-mix(in srgb, var(--paper) 88%, transparent);
  backdrop-filter:saturate(180%) blur(14px);
  -webkit-backdrop-filter:saturate(180%) blur(14px);
  border-bottom:1px solid var(--rule);
}
.topbar-inner{max-width:720px;margin:0 auto;padding:8px 16px 0;}
.brandrow{display:flex;align-items:center;justify-content:space-between;gap:10px;padding-bottom:6px;}
.brandmark{display:flex;align-items:baseline;gap:8px;min-width:0;}
.brandmark .sys{
  font-family:'Bricolage Grotesque',sans-serif;font-weight:700;font-size:12px;
  letter-spacing:.16em;text-transform:uppercase;color:var(--ink-faint);
}
.brandmark .ko{font-size:12px;color:var(--ink-faint);}
.topbtns{display:flex;gap:8px;flex:0 0 auto;}
.iconbtn{
  width:36px;height:36px;flex:0 0 auto;display:grid;place-items:center;
  border:1px solid var(--rule);border-radius:11px;background:var(--surface);
  cursor:pointer;font-size:15px;line-height:1;color:inherit;text-decoration:none;
}
.iconbtn:active{transform:scale(.94);}

/* segmented day switcher — the line selector */
.lines{display:flex;gap:6px;overflow-x:auto;padding:2px 0 9px;scrollbar-width:none;scroll-behavior:smooth;}
.lines::-webkit-scrollbar{display:none;}
.linebtn{
  flex:0 0 auto;display:flex;align-items:center;gap:7px;
  padding:7px 13px 7px 10px;border-radius:999px;cursor:pointer;
  border:1px solid var(--rule);background:var(--surface);
  font-size:13px;font-weight:500;color:var(--ink-soft);
  white-space:nowrap;transition:border-color .15s, color .15s, background .15s;
}
.linebtn .bullet{
  width:9px;height:9px;border-radius:50%;flex:0 0 auto;
  background:var(--lc,var(--ink-faint));
}
.linebtn .lbl{font-family:'Bricolage Grotesque',sans-serif;font-weight:700;letter-spacing:.04em;}
.linebtn[aria-selected="true"]{
  color:var(--ink);border-color:var(--lc,var(--ink));
  background:color-mix(in srgb, var(--lc,var(--ink)) 11%, var(--surface));
}
.linebtn[aria-selected="true"] .bullet{box-shadow:0 0 0 3px color-mix(in srgb, var(--lc) 26%, transparent);}

/* ---------- hero / route board ---------- */
.hero{padding:26px 0 6px;}
.eyebrow{
  font-family:'Bricolage Grotesque',sans-serif;font-size:11.5px;font-weight:700;
  letter-spacing:.22em;text-transform:uppercase;color:var(--ink-faint);
}
.hero h1{
  font-family:'Noto Sans TC',sans-serif;font-weight:900;
  font-size:clamp(30px,8.6vw,42px);line-height:1.14;letter-spacing:-.02em;
  margin:8px 0 10px;
}
.hero-meta{
  display:flex;flex-wrap:wrap;gap:6px 14px;align-items:center;
  font-size:13px;color:var(--ink-soft);
}
.hero-meta b{font-family:'JetBrains Mono',monospace;font-weight:500;color:var(--ink);font-variant-numeric:tabular-nums;}

/* The signature: a route board. Each row is a day = a line. */
.board{margin:22px 0 6px;border:1px solid var(--rule);border-radius:var(--r-lg);background:var(--surface);overflow:hidden;}
.board-head{
  display:flex;align-items:center;justify-content:space-between;
  padding:11px 15px;border-bottom:1px solid var(--rule);
}
.board-head .t{font-family:'Bricolage Grotesque',sans-serif;font-size:11.5px;font-weight:700;letter-spacing:.18em;text-transform:uppercase;color:var(--ink-faint);}
.board-row{
  display:grid;grid-template-columns:52px 20px 1fr auto;align-items:center;gap:11px;
  width:100%;padding:12px 15px;border:0;border-top:1px solid var(--rule-soft);
  background:transparent;text-align:left;cursor:pointer;
}
.board-row:first-of-type{border-top:0;}
.board-row:active{background:var(--surface-2);}
.board-row .dcode{
  font-family:'Bricolage Grotesque',sans-serif;font-weight:700;font-size:12px;
  letter-spacing:.08em;color:var(--lc);text-transform:uppercase;
}
.board-row .track{position:relative;height:100%;min-height:30px;}
.board-row .track::before{
  content:"";position:absolute;left:50%;top:-13px;bottom:-13px;width:4px;
  transform:translateX(-50%);background:var(--lc);border-radius:2px;
}
.board-row:first-of-type .track::before{top:50%;border-radius:2px 2px 0 0;}
.board-row:last-of-type .track::before{bottom:50%;border-radius:0 0 2px 2px;}
.board-row .track::after{
  content:"";position:absolute;left:50%;top:50%;width:11px;height:11px;
  transform:translate(-50%,-50%);border-radius:50%;
  background:var(--surface);border:3px solid var(--lc);
}
.board-row .stack{min-width:0;}
.board-row .name{display:block;font-size:14.5px;font-weight:700;color:var(--ink);line-height:1.35;}
.board-row .sub{display:block;font-family:'JetBrains Mono',monospace;font-size:11px;color:var(--ink-faint);margin-top:2px;}
.board-row .count{
  font-family:'JetBrains Mono',monospace;font-size:11.5px;color:var(--ink-faint);
  font-variant-numeric:tabular-nums;white-space:nowrap;
}

/* ---------- generic section ---------- */
.sec{padding:26px 0 4px;}
.sec-title{
  font-family:'Noto Sans TC',sans-serif;font-weight:900;font-size:19px;
  letter-spacing:-.01em;margin:0 0 3px;
}
.sec-sub{font-size:13px;color:var(--ink-soft);margin:0 0 14px;line-height:1.6;}
.sec h3{font-size:15px;font-weight:700;margin:22px 0 4px;}
.rule{border:0;border-top:1px solid var(--rule);margin:24px 0 0;}

.panel{background:var(--surface);border:1px solid var(--rule);border-radius:var(--r-lg);padding:15px;}
.panel + .panel{margin-top:10px;}
.panel .k{
  font-family:'Bricolage Grotesque',sans-serif;font-size:10.5px;font-weight:700;
  letter-spacing:.18em;text-transform:uppercase;color:var(--ink-faint);
}
.panel .v{font-size:16px;font-weight:700;margin-top:3px;}
.panel .d{font-size:13px;color:var(--ink-soft);margin-top:5px;line-height:1.6;}

/* chips — class names must match values stored in the itinerary data */
.badge,.meta-chip,.niecepick{
  display:inline-flex;align-items:center;gap:4px;
  font-size:11.5px;font-weight:600;line-height:1.45;
  padding:4px 10px;border-radius:14px;max-width:100%;
  border:1px solid var(--rule);background:var(--surface-2);color:var(--ink-soft);
}
.badge.note{background:var(--info-bg);border-color:transparent;color:var(--info);}
.badge.warn{background:var(--warn-bg);border-color:transparent;color:var(--warn);}
.meta-chip.rating{background:var(--warn-bg);border-color:transparent;color:var(--warn);}
.meta-chip.hours{background:var(--ok-bg);border-color:transparent;color:var(--ok);}
.meta-chip.book{background:var(--info-bg);border-color:transparent;color:var(--info);}
.meta-chip.book.warn{background:var(--danger-bg);color:var(--danger);}
.meta-chip.closed{background:var(--danger-bg);border-color:transparent;color:var(--danger);font-weight:600;}
.niecepick{background:var(--niece-bg);border-color:transparent;color:var(--niece);}
.chiprow{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px;}

.wtable{width:100%;border-collapse:collapse;font-size:13px;margin-top:8px;}
.wtable th{
  font-family:'Bricolage Grotesque',sans-serif;font-size:10.5px;font-weight:700;
  letter-spacing:.13em;text-transform:uppercase;color:var(--ink-faint);
  text-align:left;padding:7px 9px;border-bottom:1px solid var(--rule);
}
.wtable td{padding:8px 9px;border-bottom:1px solid var(--rule-soft);}
.wtable td.hi{color:var(--warn);font-weight:700;font-family:'JetBrains Mono',monospace;white-space:nowrap;}
.wtable td.lo{color:var(--info);font-weight:700;font-family:'JetBrains Mono',monospace;}

.clist{list-style:none;padding:0;margin:8px 0 0;display:flex;flex-direction:column;gap:9px;}
.clist li{display:flex;gap:10px;font-size:13.5px;line-height:1.6;color:var(--ink-soft);}
.clist .ico{flex:0 0 auto;font-size:16px;line-height:1.4;}
.clist b{color:var(--ink);}

.legend{display:flex;flex-direction:column;gap:7px;margin-top:8px;}
.legend-item{display:flex;align-items:center;gap:9px;font-size:13px;color:var(--ink-soft);}
.legend-dot{width:10px;height:10px;border-radius:50%;flex:0 0 auto;}

/* ---------- paying for transport ---------- */
.panel.verdict{border-left:4px solid var(--ok);margin-bottom:12px;}
.panel.verdict .k{color:var(--ok);}
.panel.callout{border-left:4px solid var(--warn);margin-top:14px;}
.panel.callout .k{color:var(--warn);}
.fare-grid{display:flex;flex-direction:column;gap:9px;}
.fare-card{background:var(--surface);border:1px solid var(--rule);border-radius:var(--r-md);padding:12px 14px;}
.fare-card.pick{border-color:var(--ok);background:color-mix(in srgb, var(--ok) 6%, var(--surface));}
.fare-top{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap;}
.fare-name{font-size:14.5px;font-weight:700;}
.fare-name .kr{font-size:11.5px;color:var(--ink-faint);font-weight:400;margin-left:5px;}
.fare-price{font-size:12.5px;color:var(--ink-soft);margin-top:3px;}
.fare-line{font-size:12.5px;line-height:1.55;margin-top:5px;}
.fare-line.good{color:var(--ok);}
.fare-line.bad{color:var(--danger);}
.opt{margin-top:10px;padding-top:10px;border-top:1px dashed var(--rule);}
.opt-name{font-size:13.5px;font-weight:700;display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;}
.opt-cost{font-weight:500;color:var(--warn);font-size:12.5px;}
.opt-note{font-size:12.5px;color:var(--ink-soft);line-height:1.55;margin-top:2px;}

.colorpick{display:flex;gap:8px;flex-wrap:wrap;margin:9px 2px 0;}
.colorpick .swatch{width:26px;height:26px;border-radius:50%;border:2px solid transparent;padding:0;cursor:pointer;}
.colorpick .swatch.active{border-color:var(--text);box-shadow:0 0 0 2px var(--surface);}

/* ---------- day header ---------- */
.dayhead{padding:24px 0 4px;}
.dayhead .kicker{display:flex;align-items:center;gap:9px;margin-bottom:7px;}
.dayhead .dno{
  font-family:'Bricolage Grotesque',sans-serif;font-weight:800;font-size:12px;
  letter-spacing:.16em;text-transform:uppercase;color:var(--lc);
}
.dayhead .kline{flex:1 1 auto;height:4px;border-radius:2px;background:var(--lc);opacity:.9;}
.dayhead .date{font-family:'JetBrains Mono',monospace;font-size:11.5px;color:var(--ink-faint);}
.dayhead h2{
  font-family:'Noto Sans TC',sans-serif;font-weight:900;
  font-size:clamp(24px,6.6vw,32px);line-height:1.2;letter-spacing:-.02em;margin:0 0 7px;
}
.dayhead .intro{font-size:13.5px;color:var(--ink-soft);line-height:1.65;margin:0;}
.dayhead .chiprow{margin-top:11px;}

/* bookmark board title — tap to rename, no separate "mode" */
.boardname{
  font-family:'Noto Sans TC',sans-serif;font-weight:900;
  font-size:clamp(24px,6.6vw,32px);line-height:1.2;letter-spacing:-.02em;margin:0 0 7px;
  cursor:pointer;display:inline-flex;align-items:baseline;gap:8px;
}
.boardname .editpencil{font-size:14px;opacity:.45;}
.boardname-input{
  display:block;width:100%;font-family:'Noto Sans TC',sans-serif;font-weight:900;
  font-size:clamp(22px,6vw,30px);line-height:1.2;letter-spacing:-.02em;margin:0 0 7px;
  padding:4px 2px 6px;border:0;border-bottom:2px solid var(--lc,var(--bookmark));
  background:transparent;color:var(--ink);
}
.boardname-input:focus{outline:none;}
.picker-label{
  font-size:11px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;
  color:var(--ink-faint);margin:16px 2px 7px;
}
.picker-label:first-child{margin-top:0;}

.maptoggle{
  display:flex;align-items:center;gap:7px;margin-top:14px;
  padding:9px 14px;border-radius:999px;cursor:pointer;
  border:1px solid var(--rule);background:var(--surface);
  font-size:13px;font-weight:600;color:var(--ink-soft);
}
.maptoggle .chev{transition:transform .2s;font-size:11px;}
.maptoggle[aria-expanded="true"] .chev{transform:rotate(180deg);}
.mapbox{
  height:230px;margin-top:11px;border-radius:var(--r-lg);overflow:hidden;
  border:1px solid var(--rule);background:var(--surface-2);
  /* Leaflet gives its panes z-index up to 1000. Without a stacking context of
     its own the map floats over the sticky nav and the AI sheet. */
  position:relative;z-index:0;isolation:isolate;
}
.mapbox.tall{height:300px;}
.mapcap{font-size:11.5px;color:var(--ink-faint);margin:7px 2px 0;line-height:1.55;}
.mapnote{font-size:12px;margin:8px 2px 0;line-height:1.6;color:var(--ink-soft);}
.mapnote.warn{color:var(--warn);}
.mapnote .linkbtn{
  background:none;border:0;padding:0 0 0 6px;font:inherit;color:var(--info);
  text-decoration:underline;cursor:pointer;
}
.mapnote .geowhy{color:var(--ink-faint);font-size:11px;}
.mapfallback{display:grid;place-items:center;height:100%;padding:20px;text-align:center;font-size:12.5px;color:var(--ink-faint);}
.leaflet-container{background:var(--surface-2);font:inherit;}
.mapnode{
  display:grid;place-items:center;width:22px;height:22px;border-radius:50%;
  color:#fff;font-size:11px;font-weight:700;font-family:'JetBrains Mono',monospace;
  border:2px solid #fff;box-shadow:0 1px 4px rgba(0,0,0,.4);
}
/* an anchor such as the hotel: a plain dot, never a stop number */
.mapnode.plain{width:13px;height:13px;border-width:2px;}
/* a bookmarked list item on the overview map: a pin, not a route stop —
   these are never connected by a line, so they must not look like one */
.mapboardpin{
  display:grid;place-items:center;width:20px;height:20px;border-radius:50% 50% 50% 0;
  transform:rotate(-45deg);color:#fff;font-size:10px;
  border:2px solid #fff;box-shadow:0 1px 4px rgba(0,0,0,.4);
}
.mapboardpin span{transform:rotate(45deg);}

/* ---------- the line: stops + segments ---------- */
.line{margin-top:18px;}
.unit{position:relative;}
.unit.lifted{position:relative;z-index:30;}
.unit.lifted .stopcard{box-shadow:var(--shadow-2);border-color:var(--lc);}
.unit.shifting{transition:transform .18s cubic-bezier(.2,.7,.3,1);}

/* segment between two stations; stroke encodes the transit mode */
.seg{display:grid;grid-template-columns:var(--rail-w) 1fr;align-items:stretch;min-height:42px;}
.seg-rail{position:relative;}
/* the stroke of a segment says how you get there: on foot, by train, bus or car */
.seg-rail::before{
  content:"";position:absolute;left:calc(var(--rail-w)/2);top:0;bottom:0;
  transform:translateX(-50%);width:4px;background:var(--lc);
}
.seg[data-mode="walk"] .seg-rail::before{
  background:repeating-linear-gradient(to bottom, var(--lc) 0 4px, transparent 4px 9px);
}
.seg[data-mode="bus"] .seg-rail::before{
  background:repeating-linear-gradient(to bottom, var(--lc) 0 12px, transparent 12px 20px);
}
.seg[data-mode="taxi"] .seg-rail::before{
  width:9px;
  background:linear-gradient(90deg, var(--lc) 0 3px, transparent 3px 6px, var(--lc) 6px 9px);
}
.seg[data-mode="air"] .seg-rail::before{
  background:repeating-linear-gradient(to bottom, var(--lc) 0 2px, transparent 2px 8px);opacity:.7;
}
.seg-text{
  font-size:12.5px;color:var(--ink-soft);padding:9px 0 9px 4px;line-height:1.5;
  display:flex;align-items:center;gap:7px;flex-wrap:wrap;
}
.seg-text b{color:var(--ink);font-weight:700;font-family:'JetBrains Mono',monospace;}
.seg-text .icon{font-size:14px;}
.seg-note{font-size:12.5px;color:var(--ink-faint);}
.seg-note.warn{color:var(--warn);font-weight:600;}
.seg-why{display:block;margin-top:3px;font-weight:400;font-size:11.5px;color:var(--ink-faint);line-height:1.5;}
/* refreshes ONE leg — the old "重算全日交通" button re-asked Google about
   every leg in the day just to fix the one that actually changed */
.segrefresh{
  margin-left:auto;flex:0 0 auto;width:22px;height:22px;border-radius:50%;
  border:1px solid var(--rule);background:var(--surface);color:var(--ink-faint);
  font-size:12px;line-height:1;cursor:pointer;
}
.segrefresh:active{background:var(--surface-2);color:var(--lc);border-color:var(--lc);}
/* which station to which station, on its own line under the duration */
.seg-route{
  display:block;width:100%;margin-top:4px;padding-left:1px;
  font-size:11.5px;line-height:1.6;color:var(--ink-faint);
  font-family:'JetBrains Mono',monospace;letter-spacing:-.01em;
}
.seg.stale .seg-rail::before{
  background:repeating-linear-gradient(to bottom, var(--warn) 0 3px, transparent 3px 8px);
}

/* the ＋ that lives in the gap between two stations */
.insertrow{
  display:grid;grid-template-columns:var(--rail-w) 1fr;align-items:center;
  width:100%;height:24px;padding:0;border:0;background:none;
  position:relative;z-index:4;cursor:pointer;-webkit-tap-highlight-color:transparent;
}
.ins-plus{
  grid-column:1;justify-self:center;
  width:19px;height:19px;border-radius:50%;
  display:flex;align-items:center;justify-content:center;
  font-size:13px;line-height:1;color:var(--ink-faint);
  background:var(--paper);border:1.5px dashed var(--rule);
  transition:color .15s, border-color .15s, background .15s, transform .15s;
}
.insertrow:hover .ins-plus{color:var(--lc);border-color:var(--lc);}
.insertrow:active .ins-plus{color:var(--lc);border-color:var(--lc);background:var(--surface-2);transform:scale(1.15);}

/* a note pinned between two stations — deliberately not a station: no number,
   no photo, hollow marker, so it never reads as somewhere you're going */
.notecard{
  background:var(--surface-2);border:1px dashed var(--rule);border-radius:var(--r-lg);
  margin:0 0 4px 4px;overflow:hidden;position:relative;
}
.notecard.open{border-style:solid;border-color:var(--lc);}
.notemain{display:flex;gap:9px;padding:10px 96px 10px 12px;align-items:flex-start;
  -webkit-user-select:text;user-select:text;}
.noteicon{flex:0 0 auto;font-size:14px;line-height:1.5;}
.notetext{font-size:12.5px;line-height:1.6;color:var(--ink-soft);white-space:pre-wrap;min-width:0;}
.notetext.empty{color:var(--ink-faint);font-style:italic;}
/* hollow, smaller and grey — reads as "a marker on the line", not a station.
   A dashed border is not an option at this size: 9px of circumference only
   fits two dashes, which renders as a broken sliver rather than a ring. */
.node.note{
  width:7px;height:7px;background:var(--paper);border:2px solid var(--ink-faint);opacity:.9;
}
.notecard.open .notetext{display:none;}

/* a station */
.stop{display:grid;grid-template-columns:var(--rail-w) 1fr;align-items:start;}
.stop-rail{position:relative;align-self:stretch;}
.stop-rail::before{
  content:"";position:absolute;left:calc(var(--rail-w)/2);top:0;bottom:0;
  transform:translateX(-50%);width:4px;background:var(--lc);
}
.unit:first-child .stop-rail::before{top:26px;}
.unit:last-child .stop-rail::before{bottom:calc(100% - 26px);}
.node{
  position:absolute;left:calc(var(--rail-w)/2);top:26px;transform:translate(-50%,-50%);
  width:13px;height:13px;border-radius:50%;background:var(--lc);
  border:2.5px solid var(--paper);box-sizing:content-box;z-index:2;
}
/* a meal is a major stop — drawn like an interchange station */
.node[data-type="eat"]{width:15px;height:15px;background:var(--paper);border:4px solid var(--lc);}
.node[data-type="rest"]{width:8px;height:8px;opacity:.75;}
/* same number as the pin this stop points to on the day's map, so the two
   are obviously the same place instead of the map being the only place a
   stop's position in the route is legible */
.node.numbered{
  width:18px;height:18px;border-radius:50%;background:var(--lc);
  border:2px solid var(--paper);box-sizing:border-box;opacity:1;
  display:flex;align-items:center;justify-content:center;
  color:#fff;font-size:10px;font-weight:700;font-family:'JetBrains Mono',monospace;
}

.stopcard{
  background:var(--surface);border:1px solid var(--rule);border-radius:var(--r-lg);
  margin:0 0 4px 4px;overflow:hidden;box-shadow:var(--shadow-1);
  transition:border-color .15s, box-shadow .15s;
}
/* not a button — the name/desc text needs to stay long-press-selectable so it
   can be copied; editing now happens through the explicit ✏️ button instead */
.stopmain{display:flex;gap:12px;padding:12px 96px 12px 12px;align-items:flex-start;text-align:left;width:100%;-webkit-user-select:text;user-select:text;}
.thumb{
  flex:0 0 auto;width:76px;height:76px;border-radius:var(--r-md);overflow:hidden;
  background:var(--surface-2);position:relative;
}
.thumb img{width:100%;height:100%;object-fit:cover;display:block;}
/* a real place with no picture yet: one tap fetches one */
.thumb.ghost{
  display:flex;align-items:center;justify-content:center;cursor:pointer;
  border:1.5px dashed var(--rule);background:transparent;
  font-size:19px;color:var(--ink-faint);line-height:1.15;text-align:center;
}
.thumb.ghost small{display:block;font-size:9.5px;margin-top:2px;}
.thumb.ghost:active{background:var(--surface-2);}
/* when a stop has no photo we show no box at all — the row just gets shorter.
   while editing, the summary collapses to photo + time + name so the form stays reachable */
.stopcard.open .stopdesc,
.stopcard.open .stopmain .chiprow,
.stopcard.open .eatbox,
.stopcard.open .tipbox,
.stopcard.open .stopfoot{display:none;}
.stopcard.open{border-color:var(--lc);}
.unit{scroll-margin-top:112px;}
.stopbody{flex:1 1 auto;min-width:0;}
.stopname{font-size:15.5px;font-weight:700;line-height:1.35;margin:1px 0 0;}
.stopname .kr{font-size:11.5px;color:var(--ink-faint);font-weight:400;margin-left:5px;}
.stopname.unnamed{color:var(--ink-faint);font-weight:500;font-style:italic;}
.stopdesc{font-size:12.5px;color:var(--ink-soft);line-height:1.55;margin-top:4px;}
.stopcard .chiprow{margin-top:7px;}
.eatbox{
  margin:9px 12px 0;padding:10px 12px;border-radius:var(--r-md);
  background:var(--warn-bg);font-size:12.5px;line-height:1.55;color:var(--ink);
}
.eatbox b{
  display:block;font-family:'Bricolage Grotesque',sans-serif;
  font-size:10px;letter-spacing:.14em;text-transform:uppercase;
  color:var(--warn);margin-bottom:2px;
}
.tipbox{
  margin:9px 12px 0;padding:10px 12px;border-radius:var(--r-md);
  background:var(--ok-bg);font-size:12.5px;line-height:1.55;color:var(--ink);
}
.tipbox b{
  display:block;font-family:'Bricolage Grotesque',sans-serif;
  font-size:10px;letter-spacing:.14em;text-transform:uppercase;
  color:var(--ok);margin-bottom:2px;
}
/* booking/queue info on an AI-recommended restaurant — Google has no API for
   this, so it's always the model's impression, never verified like the
   rating chip is; the warning line makes that impossible to miss */
.bookbox{
  margin:9px 12px 0;padding:10px 12px;border-radius:var(--r-md);
  background:var(--warn-bg);font-size:12.5px;line-height:1.6;color:var(--ink);
}
.bookbox b{
  display:block;font-family:'Bricolage Grotesque',sans-serif;
  font-size:10px;letter-spacing:.14em;text-transform:uppercase;
  color:var(--warn);margin-bottom:2px;
}
.bookbox .warnline{display:block;color:var(--warn);font-size:11px;margin-top:4px;}
.stopfoot{display:flex;gap:8px;flex-wrap:wrap;padding:10px 12px 12px;}
.maplink{
  display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:600;
  color:var(--info);background:var(--info-bg);padding:6px 11px;border-radius:999px;
  text-decoration:none;
}
.cardtools{position:absolute;top:6px;right:6px;display:flex;gap:6px;}
.editbtn,.draghandle{
  width:38px;height:38px;display:grid;place-items:center;
  border-radius:11px;background:var(--surface-2);border:1px solid var(--rule);
  color:var(--ink-soft);font-size:15px;line-height:1;
}
.editbtn{cursor:pointer;}
.editbtn:active{background:var(--lc);color:#fff;border-color:transparent;}
.stopcard.open .editbtn{background:var(--lc);color:#fff;border-color:transparent;}
.draghandle{cursor:grab;touch-action:none;user-select:none;-webkit-user-select:none;}
.draghandle:active{cursor:grabbing;background:var(--lc);color:#fff;border-color:transparent;}
.unit.lifted .draghandle{background:var(--lc);color:#fff;border-color:transparent;}
.stopcard{position:relative;}

/* expanded editor */
.editor{border-top:1px solid var(--rule);padding:13px 12px 14px;background:var(--surface-2);}
.field{margin-bottom:11px;}
.field:last-child{margin-bottom:0;}
.field label{
  display:block;font-family:'Bricolage Grotesque',sans-serif;font-size:10px;font-weight:700;
  letter-spacing:.14em;text-transform:uppercase;color:var(--ink-faint);margin-bottom:5px;
}
.input,.textarea,.select{
  width:100%;font-family:inherit;font-size:16px;color:var(--ink);
  background:var(--surface);border:1px solid var(--rule);border-radius:var(--r-md);
  padding:11px 12px;line-height:1.5;
}
.textarea{resize:vertical;min-height:74px;}
.select{appearance:none;background-image:linear-gradient(45deg,transparent 50%,var(--ink-faint) 50%),linear-gradient(135deg,var(--ink-faint) 50%,transparent 50%);background-position:calc(100% - 18px) 52%,calc(100% - 13px) 52%;background-size:5px 5px,5px 5px;background-repeat:no-repeat;padding-right:36px;}
.input:focus,.textarea:focus,.select:focus{outline:2px solid var(--lc,var(--d3));outline-offset:-1px;border-color:transparent;}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:9px;}

.suggest{margin-top:5px;display:flex;flex-direction:column;gap:5px;}
.suggest-item{
  text-align:left;width:100%;cursor:pointer;
  background:var(--surface);border:1px solid var(--rule);border-radius:var(--r-md);padding:9px 11px;
}
.suggest-item:active{background:var(--surface-2);}
.suggest-item .n{font-size:13.5px;font-weight:700;}
.suggest-item .a{font-size:11.5px;color:var(--ink-faint);margin-top:1px;}
.hint{font-size:11.5px;color:var(--ink-faint);margin:5px 2px 0;line-height:1.5;}

.editor-tools{display:flex;gap:7px;flex-wrap:wrap;margin-top:13px;}
.btn{
  display:inline-flex;align-items:center;gap:6px;cursor:pointer;
  font-size:12.5px;font-weight:600;padding:9px 14px;border-radius:999px;
  border:1px solid var(--rule);background:var(--surface);color:var(--ink-soft);
}
.btn:active{transform:scale(.97);}
.btn.primary{background:var(--ink);color:var(--paper);border-color:var(--ink);}
.btn.danger{color:var(--danger);border-color:color-mix(in srgb,var(--danger) 32%,transparent);}
.btn.wide{width:100%;justify-content:center;}
.addstop{
  width:100%;margin-top:12px;padding:14px;cursor:pointer;
  border:1.5px dashed var(--rule);border-radius:var(--r-lg);background:transparent;
  color:var(--ink-soft);font-size:13.5px;font-weight:700;
}
.addstop:active{background:var(--surface);}

.recalc{
  width:100%;margin-top:8px;padding:12px;cursor:pointer;
  border:1.5px solid var(--rule);border-radius:var(--r-lg);background:transparent;
  color:var(--ink-soft);font-size:13px;font-weight:700;
}
.recalc:active{background:var(--surface);}
.recalc[data-stale="1"]{border-color:var(--warn);color:var(--warn);background:var(--warn-bg);}

/* ---------- 選幾個地點一齊搬 ---------- */
.stopcard.selecting .stopmain{padding-right:12px;cursor:pointer;-webkit-user-select:none;user-select:none;}
.stopcard.selecting{border-color:var(--rule);}
.stopcard.selecting.checked{border-color:var(--lc,var(--d3));box-shadow:0 0 0 1.5px var(--lc,var(--d3)) inset;}
.selbox{flex:0 0 auto;font-size:19px;line-height:1;padding-top:2px;}
.selectbar{
  position:sticky;bottom:calc(70px + env(safe-area-inset-bottom));z-index:40;
  margin-top:12px;padding:10px 12px;border-radius:var(--r-lg);
  background:var(--surface);border:1px solid var(--rule);box-shadow:var(--shadow-2);
  display:flex;align-items:center;gap:8px;font-size:13px;font-weight:700;
}
.selectbar span{flex:1;}
.selectbar .btn{padding:8px 14px;font-size:12.5px;}
.recalc:disabled{opacity:.55;}

.photogrid{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-top:6px;}
.photogrid img{width:100%;height:70px;object-fit:cover;border-radius:var(--r-sm);cursor:pointer;border:2px solid transparent;display:block;}
.photogrid img.on{border-color:var(--lc,var(--d3));}

/* ---------- floating dock ---------- */
.dock{
  position:fixed;left:0;right:0;bottom:0;z-index:60;
  display:flex;gap:8px;align-items:center;justify-content:center;
  padding:10px 16px calc(10px + env(safe-area-inset-bottom));
  background:linear-gradient(to top, var(--paper) 62%, transparent);
  pointer-events:none;
}
.dock > *{pointer-events:auto;}
.dockbtn{
  display:inline-flex;align-items:center;gap:7px;cursor:pointer;
  font-size:13px;font-weight:700;padding:11px 17px;border-radius:999px;
  border:1px solid var(--rule);background:var(--surface);color:var(--ink);
  box-shadow:var(--shadow-1);
}
.dockbtn.accent{background:var(--ink);color:var(--paper);border-color:var(--ink);}
.dockbtn:active{transform:scale(.96);}
.savestate{
  position:fixed;left:50%;bottom:calc(74px + env(safe-area-inset-bottom));
  transform:translateX(-50%);z-index:61;
  font-size:12px;font-weight:600;padding:6px 13px;border-radius:999px;
  background:var(--ink);color:var(--paper);box-shadow:var(--shadow-1);
  opacity:0;transition:opacity .2s;pointer-events:none;white-space:nowrap;
}
.savestate.on{opacity:1;}

/* fixed banner shown while a brand-new trip's blank days are being
   generated — lives outside #app (render() wipes that on every view
   change) so the progress survives normal navigation while it runs */
.genbanner{
  position:fixed;left:14px;right:14px;top:calc(10px + env(safe-area-inset-top));z-index:70;
  max-width:520px;margin:0 auto;
  background:var(--surface);border:1px solid var(--rule);border-radius:var(--r-lg);
  box-shadow:var(--shadow-2);padding:13px 16px;font-size:13.5px;display:none;
}
.genbanner.on{display:flex;align-items:center;gap:10px;}
.genbanner .spin{
  width:16px;height:16px;border-radius:999px;border:2.5px solid var(--rule);
  border-top-color:var(--ink);flex:none;animation:genspin .8s linear infinite;
}
.genbanner.done .spin{display:none;}
@keyframes genspin{to{transform:rotate(360deg);}}
.genbanner .txt{flex:1;line-height:1.5;}

/* ---------- sheet + modal ---------- */
.scrim{position:fixed;inset:0;z-index:80;background:rgba(10,12,16,.5);backdrop-filter:blur(3px);}
.sheet{
  position:fixed;left:0;right:0;bottom:0;z-index:81;
  max-height:88vh;overflow-y:auto;-webkit-overflow-scrolling:touch;
  background:var(--paper);border-radius:var(--r-xl) var(--r-xl) 0 0;
  box-shadow:var(--shadow-2);
  padding:8px 16px calc(22px + env(safe-area-inset-bottom));
  animation:rise .26s cubic-bezier(.2,.8,.3,1);
}
.sheet-wide{max-width:720px;margin:0 auto;}
@keyframes rise{from{transform:translateY(14px);opacity:.4;}to{transform:none;opacity:1;}}
.grabber{width:38px;height:4px;border-radius:2px;background:var(--rule);margin:0 auto 12px;}
.sheet h3{font-size:17px;font-weight:900;margin:0 0 3px;}
.sheet .sec-sub{margin-bottom:12px;}
.sheet-close{position:absolute;top:14px;right:16px;}

.aibtns{display:flex;gap:7px;flex-wrap:wrap;margin-bottom:10px;}
.askrow{display:flex;gap:7px;}
.askrow .input{flex:1 1 auto;}
.ai-out{margin-top:12px;display:flex;flex-direction:column;gap:9px;}
.ai-msg{
  background:var(--surface);border:1px solid var(--rule);border-radius:var(--r-md);
  padding:12px 13px;font-size:13.5px;line-height:1.7;white-space:pre-wrap;
}
.dayai{margin-top:8px;border-color:var(--bookmark);color:var(--bookmark);font-weight:700;}
/* the textfield clears itself once asked (so a follow-up question can be
   typed straight away) — this is what keeps the just-asked question visible,
   sitting right above its own answer instead of vanishing with the input */
.askedecho{font-size:12px;color:var(--ink-faint);margin:0 0 2px;font-style:italic;}
/* free-form sections the family adds themselves */
.usec{background:var(--surface);border:1px solid var(--rule);border-radius:var(--r-md);padding:12px 13px;margin-bottom:10px;}
.usec-head{display:flex;align-items:flex-start;gap:8px;}
.usec-title{flex:1;font-size:15px;font-weight:700;line-height:1.4;}
.usec-tools{display:flex;gap:4px;flex:none;}
.usec-sub{margin-top:4px;font-size:12px;color:var(--text-soft);line-height:1.6;}
.usec-list{margin:9px 0 0;padding-left:18px;}
.usec-list li{font-size:13.5px;line-height:1.75;margin-bottom:3px;}
.usec-by{margin-top:9px;font-size:11px;color:var(--text-soft);}
.airefresh-toggle{display:flex;align-items:center;gap:6px;margin-top:9px;font-size:12px;color:var(--text-soft);cursor:pointer;width:fit-content;}
.airefresh-toggle input{margin:0;}
/* a long AI run needs to look alive: stage, clock, moving bar */
.aibusy{background:var(--surface);border:1px solid var(--rule);border-radius:var(--r-md);padding:12px 13px;margin-top:10px;}
.aibusy-top{display:flex;align-items:center;gap:8px;}
.aibusy-now{font-size:13.5px;font-weight:650;flex:1;}
.aibusy-secs{font-size:12px;color:var(--text-soft);}
.aibusy-spin{width:14px;height:14px;border-radius:50%;flex:none;
  border:2px solid var(--rule);border-top-color:var(--bookmark);animation:aispin .8s linear infinite;}
@keyframes aispin{to{transform:rotate(360deg)}}
.aibusy-bar{margin-top:9px;height:4px;border-radius:99px;background:var(--surface-2);overflow:hidden;}
.aibusy-bar i{display:block;height:100%;width:38%;border-radius:99px;background:var(--bookmark);animation:aislide 1.5s ease-in-out infinite;}
@keyframes aislide{0%{margin-left:-38%}100%{margin-left:100%}}
.aibusy-steps{display:flex;flex-wrap:wrap;gap:6px 10px;margin-top:9px;font-size:11.5px;color:var(--text-soft);}
.aibusy-steps .now{color:var(--text);font-weight:650;}
.aibusy-steps .done{color:var(--ok);}
.aibusy-note{margin-top:8px;font-size:11.5px;line-height:1.6;color:var(--text-soft);}
@media (prefers-reduced-motion:reduce){.aibusy-spin,.aibusy-bar i{animation:none}}
.ai-change{background:var(--surface);border:1px solid var(--rule);border-left:4px solid var(--lc,var(--d3));border-radius:var(--r-md);padding:12px 13px;}
.ai-change[data-jumpitem]{cursor:pointer;}
.ai-change[data-jumpitem]:active{background:var(--surface-2);}
.ai-change .op{
  font-family:'Bricolage Grotesque',sans-serif;font-size:10px;font-weight:700;
  letter-spacing:.14em;text-transform:uppercase;color:var(--ink-faint);
}
.ai-change .ttl{font-size:14.5px;font-weight:700;margin:3px 0;}
.ai-change .why{font-size:12.5px;color:var(--ink-soft);line-height:1.6;}
.idea-dayhint{font-size:12px;color:var(--bookmark);margin-top:6px;font-weight:600;}

.ideasec-title{
  font-family:'Bricolage Grotesque',sans-serif;font-weight:800;font-size:11px;
  letter-spacing:.1em;text-transform:uppercase;color:var(--ink-faint);
  margin:16px 2px 8px;
}
.ideasec-title:first-child{margin-top:0;}
.reslink{
  display:block;background:var(--surface);border:1px solid var(--rule);border-radius:var(--r-md);
  padding:11px 13px;margin-bottom:7px;text-decoration:none;color:inherit;
}
.reslink .resname{font-size:13.5px;font-weight:700;color:var(--info);}
.reslink .resnote{font-size:12px;color:var(--ink-soft);margin-top:3px;line-height:1.5;}

.stayrow{border-top:1px solid var(--rule);padding-top:10px;margin-top:10px;}
.stayrow:first-of-type{border-top:0;padding-top:0;margin-top:0;}
.staywhen{
  font-family:var(--mono);font-size:11px;color:var(--ink-soft);
  letter-spacing:.02em;margin-bottom:3px;
}
.stayblock{border:1px solid var(--rule);border-radius:var(--r-md);padding:11px 12px;margin-bottom:10px;}
.stayblock-head{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:8px;}
.stayrange{display:flex;align-items:center;gap:8px;}
.stayrange select{flex:1 1 auto;min-width:0;}
.daystay{
  font-size:12.5px;color:var(--ink-soft);margin-top:9px;
  background:var(--surface-2);border-radius:var(--r-sm);padding:7px 10px;
}
.daystay b{color:var(--ink);font-weight:700;}

/* ---------- home page section editing ---------- */
.secedit{
  border:0;background:transparent;cursor:pointer;
  font-size:13px;line-height:1;padding:2px 4px;margin-left:7px;
  opacity:.45;vertical-align:middle;border-radius:6px;
}
.secedit:hover,.secedit:focus-visible{opacity:1;background:var(--surface-2);}
.sectools{display:inline-flex;align-items:center;}
.secdel{margin-left:2px;}
.secdel:hover,.secdel:focus-visible{color:var(--danger);}
.fieldhint{font-size:11.5px;line-height:1.6;color:var(--ink-soft);margin:0 0 6px;}

/* drag handle reusing the same long-press gesture as itinerary stops, but
   for reordering whole home-page blocks instead of one day's stops */
.sechandle{cursor:grab;touch-action:none;user-select:none;-webkit-user-select:none;}
.sechandle:active{cursor:grabbing;background:var(--lc,var(--bookmark));color:#fff;opacity:1;}
.hsblock{position:relative;}
.hsblock.lifted{z-index:30;outline:2px solid var(--bookmark);outline-offset:6px;border-radius:10px;}
.hsblock.shifting{transition:transform .18s cubic-bezier(.2,.7,.3,1);}
.usec{position:relative;}
.usec.lifted{z-index:30;box-shadow:var(--shadow-2);border-color:var(--bookmark);}
.usec.shifting{transition:transform .18s cubic-bezier(.2,.7,.3,1);}

/* ---------- AI analysis kept above the list ---------- */
/* Deliberately a running log, not a panel: a new run appends, so nothing the
   AI said last time disappears just because you asked again. */
.ailog{
  background:var(--surface);border:1px solid var(--rule);
  border-radius:var(--r-md);padding:12px 13px;margin:0 0 14px;
}
.ailog-head{
  font-size:13px;font-weight:800;color:var(--ink);
  display:flex;flex-wrap:wrap;align-items:baseline;gap:7px;margin-bottom:9px;
}
.ailog-sub{font-size:11px;font-weight:500;color:var(--ink-soft);}
.ailog-entry{border-top:1px solid var(--rule);padding-top:9px;margin-top:9px;}
.ailog-entry:first-of-type{border-top:0;padding-top:0;margin-top:0;}
.ailog-entry.latest{
  border-left:3px solid var(--bookmark);padding-left:9px;margin-left:-2px;
}
.ailog-when{font-family:var(--mono);font-size:10.5px;color:var(--ink-soft);margin-bottom:4px;}
.ailog-text{font-size:13px;line-height:1.72;color:var(--ink);white-space:pre-wrap;}
.ailog-note{font-size:11.5px;line-height:1.6;color:var(--ink-soft);margin-top:6px;}
.ailog-links{display:flex;flex-direction:column;gap:5px;margin-top:8px;}
.ailog-links a{
  font-size:12px;font-weight:600;text-decoration:none;
  color:var(--info);background:var(--info-bg);padding:7px 10px;border-radius:var(--r-sm);
}
.ailog-links a small{display:block;font-weight:500;color:var(--ink-soft);margin-top:2px;}
.ailog-entry[data-logtoggle]{cursor:pointer;}
.ailog-entry.collapsed{padding-top:8px;margin-top:8px;}
.ailog-entry.collapsed .ailog-when{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:2px;}
.ailog-entry.collapsed .ailog-note{margin-top:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.ailog-caret{font-size:10px;color:var(--ink-soft);flex:0 0 auto;}

/* what THIS run just found, so it is obvious which entries are new */
.ainew{
  font-size:10.5px;font-weight:800;letter-spacing:.02em;
  color:var(--bookmark);background:var(--bookmark-bg,rgba(124,140,161,.16));
  border:1px solid var(--bookmark);border-radius:999px;padding:3px 8px;
}
.stopcard.freshai{box-shadow:0 0 0 1.5px var(--bookmark) inset;}
/* a bookmark that's really already a stop somewhere — computed live, not stored */
.inday{
  display:inline-flex;align-items:center;gap:4px;cursor:pointer;
  font-size:11.5px;font-weight:700;line-height:1.45;
  padding:4px 10px;border-radius:14px;max-width:100%;
  border:1px solid var(--lc,var(--d3));background:transparent;color:var(--lc,var(--d3));
}
.inday:active{background:var(--surface-2);}

.copyrow{
  width:100%;margin-top:9px;display:flex;align-items:center;justify-content:center;
  gap:7px;flex-wrap:wrap;
}
.copyrow small{font-weight:500;color:var(--ink-soft);font-size:11px;}
.sugg{color:var(--bookmark);font-size:11px;font-weight:700;}

/* ---------- asked / answered log ---------- */
.qa{background:var(--surface);border:1px solid var(--rule);border-radius:var(--r-md);margin-bottom:7px;overflow:hidden;}
.qa-head{
  display:block;width:100%;text-align:left;cursor:pointer;
  border:0;background:transparent;padding:11px 12px;
}
.qa-meta{display:flex;gap:7px;align-items:center;flex-wrap:wrap;}
.qa-meta .when{font-family:'JetBrains Mono',monospace;font-size:11px;color:var(--ink-faint);}
.qa-q{display:block;font-size:13.5px;font-weight:700;margin-top:5px;line-height:1.45;}
.qa-head.open .qa-q{color:var(--info);}
.qa-a{
  padding:0 12px 12px;font-size:13px;line-height:1.75;white-space:pre-wrap;
  color:var(--ink-soft);border-top:1px dashed var(--rule);padding-top:10px;
}

.vlist{display:flex;flex-direction:column;gap:7px;}
.vrow{display:flex;gap:10px;align-items:flex-start;background:var(--surface);border:1px solid var(--rule);border-radius:var(--r-md);padding:11px 12px;}
.vrow .who{font-size:13.5px;font-weight:700;}
.vrow .when{font-family:'JetBrains Mono',monospace;font-size:11px;color:var(--ink-faint);}
.vrow .sum{font-size:12.5px;color:var(--ink-soft);line-height:1.55;margin-top:3px;}
.vrow .acts{display:flex;gap:6px;flex-wrap:wrap;margin-top:9px;}
.vrow input[type=checkbox]{width:19px;height:19px;flex:0 0 auto;margin-top:3px;accent-color:var(--d3);}
.badge.now{background:var(--ok-bg);color:var(--ok);border-color:transparent;font-weight:800;}

/* human-readable version comparison — one section per day/board, plain lines
   instead of a raw JSON diff */
.diffwrap{
  background:var(--surface);border:1px solid var(--rule);border-radius:var(--r-md);
  padding:12px;max-height:56vh;overflow:auto;margin-bottom:11px;
}
.diffwrap-title{font-size:13px;font-weight:800;margin:0 0 9px;}
.diffday+.diffday{margin-top:14px;}
.diffday-title{
  font-family:'Bricolage Grotesque',sans-serif;font-weight:800;font-size:12px;
  letter-spacing:.04em;color:var(--ink);margin-bottom:5px;
}
.diffline{font-size:12.5px;line-height:1.7;padding-left:2px;}
.diffline-add{color:var(--ok);}
.diffline-remove{color:var(--danger);}
.diffline-edit{color:var(--info);}
.diffline-reorder{color:var(--warn);}

.daypick{display:flex;flex-direction:column;gap:6px;}
.daypick button{
  display:grid;grid-template-columns:20px 52px 1fr;align-items:center;gap:11px;
  padding:13px 14px;border-radius:var(--r-md);cursor:pointer;text-align:left;
  border:1px solid var(--rule);background:var(--surface);font-size:14px;font-weight:600;
}
.daypick button:disabled{opacity:.42;cursor:default;}
.daypick .bullet{width:11px;height:11px;border-radius:50%;background:var(--lc);}
.daypick .dcode{font-family:'Bricolage Grotesque',sans-serif;font-weight:700;font-size:12px;letter-spacing:.08em;color:var(--lc);}
.daypick-compact{margin-bottom:10px;}
.daypick-check{
  display:grid;grid-template-columns:18px 20px 52px 1fr;align-items:center;gap:11px;
  padding:11px 14px;border-radius:var(--r-md);cursor:pointer;text-align:left;
  border:1px solid var(--rule);background:var(--surface);font-size:13.5px;font-weight:600;margin-bottom:6px;
}
.daypick-check input{width:16px;height:16px;accent-color:var(--lc);}

footer{padding:34px 0 18px;font-size:11.5px;color:var(--ink-faint);line-height:1.85;}
footer .fbrand{font-weight:900;font-size:13.5px;color:var(--ink-soft);margin-bottom:7px;}

.loading{padding:40px 0;text-align:center;color:var(--ink-faint);font-size:13.5px;}
.errbox{
  background:var(--danger-bg);border:1px solid color-mix(in srgb,var(--danger) 25%,transparent);
  border-radius:var(--r-md);padding:14px;font-size:13.5px;color:var(--danger);line-height:1.6;
}

@media (min-width:560px){
  :root{--rail-w:34px;}
  .thumb{width:96px;height:96px;}
  .mapbox{height:280px;}
  .mapbox.tall{height:380px;}
}

@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.001ms !important;transition-duration:.001ms !important;}
  html{scroll-behavior:auto;}
}

<body>

<header class="topbar">
  <div class="topbar-inner">
    <div class="brandrow">
      <div class="brandmark">
        <span class="sys"></span>
        <span class="ko"></span>
      </div>
      <div class="topbtns">
        <a class="iconbtn" href="index.html" aria-label="返主頁" title="返主頁">🏠</a>
        <button class="iconbtn" id="btn-theme" aria-label="切換深淺色">◐</button>
      </div>
    </div>
    <div class="lines" id="lines" role="tablist" aria-label="揀日子"></div>
  </div>
</header>

<main class="wrap" id="app">
  <p class="loading">載入緊行程…</p>
</main>

<div class="dock">
  <button class="dockbtn" id="btn-boards">📌 清單</button>
  <button class="dockbtn" id="btn-history">🕓 歷史</button>
  <button class="dockbtn accent" id="btn-ai">✨ AI 助手</button>
</div>
<div class="savestate" id="savestate"></div>
<div class="genbanner" id="genbanner"></div>
<div id="layer"></div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
(function(){
  "use strict";

  // ---------- config ----------
  const SUPABASE_URL = "https://aczykqleoamxdekfsgqh.supabase.co";
  const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImFjenlrcWxlb2FteGRla2ZzZ3FoIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODQ4ODU0MjUsImV4cCI6MjEwMDQ2MTQyNX0.Iv8diOTpiKO0LzAUMcDXaP_3HBAP4PyYGNgosGtgjCA";
  const FUNCTIONS_URL = SUPABASE_URL + "/functions/v1/ai-assistant";
  const DAY_COLORS = { day1:"var(--d1)", day2:"var(--d2)", day3:"var(--d3)", day4:"var(--d4)", day5:"var(--d5)", day6:"var(--d6)" };
  const DAY_HEX    = { day1:"#8A94A6", day2:"#0FA958", day3:"#00A5DE", day4:"#EF7C1C", day5:"#9B6FB0", day6:"#BB8336" };
  const DAY_SHORT  = { day1:"抵達", day2:"古宮", day3:"南怡島", day4:"聖水洞", day5:"德壽宮", day6:"銀杏" };

  function sbHeaders(extra){
    return Object.assign({
      "apikey": SUPABASE_ANON_KEY,
      "Authorization": "Bearer " + SUPABASE_ANON_KEY,
      "Content-Type": "application/json"
    }, extra || {});
  }
  function esc(s){
    return String(s == null ? "" : s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
  }
  // some older records have markup baked into plain-text fields; show the words, not the tags
  // the AI brief is free text the user typed; keep their line breaks (plain()
  // would collapse them, so re-opening the editor would lose the formatting)
  function briefText(snap){ return String((snap && snap.tripBrief) || "").trim(); }
  function plain(s){
    return String(s == null ? "" : s).replace(/<[^>]*>/g, "").replace(/\s+/g, " ").trim();
  }
  const $ = sel => document.querySelector(sel);

  // ---------- state ----------
  const state = {
    snapshot: null,
    tripId: null,                  // which row in `trips` this page is showing — set once in boot()
    view: "overview",              // "overview" | dayId
    open: new Set(),               // "dayId:unitIndex" currently expanded
    mapsShut: new Set(),           // dayIds whose map the reader collapsed; open by default
    editedBy: localStorage.getItem("seoul_trip_name") || "",
    readOnlyLabel: null,           // set when previewing an old version
    renamingBoard: null,           // boardId currently showing its rename input
    boardIdeas: null,              // last AI answer shown inline on a board page
    selectMode: null,               // { dayId, selected:Set<unitIndex> } while multi-selecting stops to move
    openLog: new Set()             // "boardId:logIndex" of ailog entries expanded beyond the latest
  };
  function inSelectMode(day){ return !!(state.selectMode && state.selectMode.dayId === day.id); }

  // never interrupt an edit to ask who is typing; a name can be set in 歷史 if wanted
  function getEditedBy(){ return state.editedBy || "家人"; }

  // ---------- theme ----------
  function applyTheme(t){
    if (t === "auto") document.documentElement.removeAttribute("data-theme");
    else document.documentElement.setAttribute("data-theme", t);
    localStorage.setItem("seoul_theme", t);
  }
  applyTheme(localStorage.getItem("seoul_theme") || "auto");
  $("#btn-theme").addEventListener("click", () => {
    const cur = localStorage.getItem("seoul_theme") || "auto";
    applyTheme(cur === "auto" ? "light" : cur === "light" ? "dark" : "auto");
    render();
  });

  // ==================================================================
  // DATA
  // ==================================================================
  // Every trip's rows share the same append-only tables, distinguished only
  // by trip_id (see index.html, which creates this row and hands off here
  // via ?trip=<id>) — every read/write below is scoped to state.tripId so
  // one family's other trips never bleed into each other.
  async function fetchLatestVersion(){
    const res = await fetch(`${SUPABASE_URL}/rest/v1/itinerary_versions?trip_id=eq.${state.tripId}&select=*&order=created_at.desc&limit=1`, { headers: sbHeaders() });
    if (!res.ok) throw new Error("讀取行程失敗 " + res.status);
    return (await res.json())[0] || null;
  }
  async function fetchAllVersions(){
    const res = await fetch(`${SUPABASE_URL}/rest/v1/itinerary_versions?trip_id=eq.${state.tripId}&select=id,created_at,edited_by,source,summary,trivial&order=created_at.desc`, { headers: sbHeaders() });
    if (!res.ok) throw new Error("讀取歷史失敗 " + res.status);
    return res.json();
  }
  async function fetchVersionSnapshot(id){
    const res = await fetch(`${SUPABASE_URL}/rest/v1/itinerary_versions?id=eq.${id}&select=snapshot`, { headers: sbHeaders() });
    if (!res.ok) throw new Error("讀取版本失敗 " + res.status);
    return (await res.json())[0]?.snapshot || null;
  }
  async function saveVersion(snapshot, source, summary, trivial){
    const res = await fetch(`${SUPABASE_URL}/rest/v1/itinerary_versions`, {
      method: "POST",
      headers: sbHeaders({ "Prefer": "return=representation" }),
      body: JSON.stringify({ trip_id: state.tripId, edited_by: getEditedBy(), source, summary, snapshot, trivial: !!trivial })
    });
    if (!res.ok) throw new Error("儲存失敗 " + res.status + " " + (await res.text()));
    return res.json();
  }
  // The trip background ("who's going, when, 姨姨唔可以行樓梯…") rides along on
  // EVERY ai call, so editing it on the home page changes what all of the AI
  // features assume. Blank means the Edge Function keeps using its built-in
  // default, so clearing the box can't leave the AI with no context at all.
  // Destination coordinates/search-hint/date-range ride along on EVERY call,
  // same as brief — so no caller has to remember to pass them, and the edge
  // function never needs a hardcoded city to fall back on. Read fresh off
  // meta each time (not baked into a const) so re-planning this same app for
  // a different trip is just editing 首頁 fields, no code change anywhere.
  async function callAi(payload){
    const m = (state.snapshot && state.snapshot.meta) || {};
    const body = Object.assign({
      brief: briefText(state.snapshot),
      destinationLocal: m.destinationLocal || "",
      lat: Number.isFinite(m.lat) ? m.lat : null,
      lng: Number.isFinite(m.lng) ? m.lng : null,
      dateStart: m.dateStart || "",
      dateEnd: m.dateEnd || "",
    }, payload);
    const res = await fetch(FUNCTIONS_URL, { method:"POST", headers: sbHeaders(), body: JSON.stringify(body) });
    return res.json();
  }

  // Every AI answer is kept, so the family can read back what was asked.
  async function saveAiNote(kind, question, answer){
    if (!answer) return;
    try {
      await fetch(`${SUPABASE_URL}/rest/v1/ai_notes`, {
        method: "POST",
        headers: sbHeaders(),
        body: JSON.stringify({ trip_id: state.tripId, asked_by: getEditedBy(), kind, question: question || null, answer })
      });
    } catch (e) { /* an unsaved note must never block the answer on screen */ }
  }
  async function fetchAiNotes(){
    const res = await fetch(`${SUPABASE_URL}/rest/v1/ai_notes?trip_id=eq.${state.tripId}&select=*&order=created_at.desc&limit=100`, { headers: sbHeaders() });
    if (!res.ok) throw new Error("讀取紀錄失敗 " + res.status);
    return res.json();
  }

  let saveTimer = null;
  function flash(msg, keep){
    const el = $("#savestate");
    el.textContent = msg;
    el.classList.add("on");
    if (!keep) setTimeout(() => el.classList.remove("on"), 1900);
  }
  // "trivial" marks background/technical upkeep saves (a recomputed transit
  // time, a fetched Google rating, a geocoded hotel pin) that carry no
  // content a person actually asked for — they still get saved (nothing is
  // ever lost), but the 歷史 list hides them by default so "加咗個地點"
  // doesn't get buried under a dozen "更新咗交通時間" rows from the same
  // single edit.
  async function saveNow(summary, trivial){
    clearTimeout(saveTimer);
    flash("儲存緊…", true);
    try { await saveVersion(state.snapshot, "manual", summary, trivial); flash("已儲存"); }
    catch (e) { flash("儲存唔到，改動只留喺呢部機"); }
  }
  function saveSoon(summary, trivial){
    clearTimeout(saveTimer);
    saveTimer = setTimeout(() => saveNow(summary, trivial), 900);
  }

  // ==================================================================
  // MODEL HELPERS
  // ==================================================================
  function dayById(id){ return state.snapshot.days.find(d => d.id === id); }

  // A connector describes the trip INTO the stop that follows it, so the two
  // travel together as one unit whenever a stop is moved.
  function toUnits(items){
    const units = [];
    for (let i = 0; i < items.length; i++){
      if (items[i].kind === "connector" && items[i+1] && items[i+1].kind === "stop"){
        units.push({ seg: items[i], stop: items[i+1] });
        i++;
      } else if (items[i].kind === "stop"){
        units.push({ seg: null, stop: items[i] });
      } else if (items[i].kind === "note"){
        // its own kind of unit — deliberately NOT a stop, so it stays out of
        // the map, the ratings sweep and everything the AI is shown
        units.push({ seg: null, stop: null, note: items[i] });
      } else {
        units.push({ seg: items[i], stop: null });
      }
    }
    return units;
  }
  function fromUnits(units){
    const out = [];
    units.forEach(u => {
      if (u.seg) out.push(u.seg);
      if (u.note) out.push(u.note);
      if (u.stop) out.push(u.stop);
    });
    return out;
  }
  // index of the unit holding the first real stop — a note pinned above it
  // must not make that stop start showing a "how you got here" line, because
  // nothing comes before the first stop of a day
  function firstStopUnit(units){ return units.findIndex(u => u.stop); }
  function blankStop(){
    return { kind:"stop", type:"normal", marker:"", time:"", title:"", kr:"",
             niecepick:[], desc:"", eatboxHtml:"", eatMeta:[], mapUrl:"",
             accessBadges:[], tip:"", photoUrl:"", placeId:"", lat:null, lng:null };
  }
  // a free-text reminder that lives between two places ("買定 T-money",
  // "呢度落車行 5 分鐘") — not a place, so it has no time, coords or rating
  function blankNote(){ return { kind:"note", text:"" }; }

  // ==================================================================
  // BOOKMARK BOARDS — a place to park "maybe" spots that aren't slotted
  // into a day yet. Same stop shape as an itinerary stop (so nothing is
  // lost moving a place either direction), just no time/connectors.
  // ==================================================================
  function blankBoardItem(){
    return { title:"", kr:"", desc:"", mapUrl:"", photoUrl:"", placeId:"", lat:null, lng:null, tip:"", niecepick:[] };
  }
  // distinct from DAY_HEX so a list never gets mistaken for a day's own route colour
  const BOARD_PALETTE = ["#6B6FD1","#E38FB0","#3CC177","#E5964A","#4FB6D9","#B98CE0","#D9574A","#7FD1BE"];
  function pickBoardColor(existingBoards){
    const used = new Set((existingBoards || []).map(b => b.color).filter(Boolean));
    const free = BOARD_PALETTE.find(c => !used.has(c));
    return free || BOARD_PALETTE[(existingBoards || []).length % BOARD_PALETTE.length];
  }
  function newBoard(name){
    const id = "board_" + Date.now().toString(36) + Math.random().toString(36).slice(2, 6);
    return { id, name: name || "新清單", items: [], color: pickBoardColor(state.snapshot && state.snapshot.boards) };
  }
  function boardById(id){
    return (state.snapshot.boards || []).find(b => b.id === id);
  }
  // 表妹美食清單 used to be a standalone, hand-maintained array (snap.foodCards)
  // completely detached from day.items — its "day" field was plain text
  // ("Day 2"), never a real dayId, so deleting or moving the actual stop
  // never touched it: it kept claiming a niece's pick was still scheduled
  // long after it wasn't. Turning each entry into a real board item means it
  // gets the SAME live re-check every other board item already has
  // (findInItinerary, re-derived fresh every render — see boardItemHtml)
  // instead of a second, silently-drifting copy of the same information,
  // and it can be copied into a specific day the same way any board item can.
  function migrateFoodCardsToBoard(snap){
    if (!snap || !Array.isArray(snap.foodCards) || !snap.foodCards.length) return;
    const items = snap.foodCards.map(f => {
      const nameHtml = String(f.name || "");
      const krMatch = nameHtml.match(/<span class="kr">([^<]*)<\/span>/);
      return {
        title: plain(nameHtml.split(/<span/)[0]) || plain(nameHtml),
        kr: krMatch ? plain(krMatch[1]) : "",
        desc: f.must || "", mapUrl: "", photoUrl: "", placeId: "", lat: null, lng: null, tip: "",
        niecepick: f.niecepicks || [],
        eatMeta: f.chips || [],
      };
    });
    snap.boards = snap.boards || [];
    snap.boards.push({
      id: "board_niecepicks_" + Date.now().toString(36),
      name: "表妹美食清單",
      color: pickBoardColor(snap.boards),
      items,
    });
    snap.foodCards = [];
  }

  // older snapshots (saved before this feature existed) simply have no boards array,
  // and boards saved before per-list colour existed have no colour — assign one so
  // the overview map has something consistent to draw with
  function normalizeSnapshot(snap){
    if (snap && !Array.isArray(snap.boards)) snap.boards = [];
    if (snap && !Array.isArray(snap.sections)) snap.sections = [];
    if (snap && !Array.isArray(snap.hiddenSections)) snap.hiddenSections = [];
    migrateStays(snap);
    migrateFoodCardsToBoard(snap);
    if (snap) snap.boards.forEach(b => { if (!b.color) b.color = pickBoardColor(snap.boards); });
    // the sticky day-nav's short label used to be a hardcoded DAY_SHORT
    // lookup, completely detached from day.title — swapping/renaming a
    // day's content never touched it, so the nav pill kept showing the
    // OLD theme's name forever. Backfilling it into the day itself (once)
    // makes it real, editable, swappable data instead of a fixed table.
    if (snap && Array.isArray(snap.days)) snap.days.forEach(d => {
      if (d.shortTag == null) d.shortTag = DAY_SHORT[d.id] || "";
    });
    // destination coordinates / search hint / date range used to be hardcoded
    // constants in the edge function (Seoul, Oct 23-28) — moved here as real,
    // editable trip data so this whole app can be reused for a different
    // trip later without touching code. Backfilled once with the values that
    // were previously hardcoded, purely so THIS trip keeps working exactly
    // as before until someone edits 首頁大標題 with the new fields.
    if (snap){
      const m = snap.meta = snap.meta || {};
      if (m.destinationLocal == null) m.destinationLocal = "서울";
      if (m.lat == null) m.lat = 37.5665;
      if (m.lng == null) m.lng = 126.9780;
      if (!m.dateStart) m.dateStart = "2026-10-23";
      if (!m.dateEnd) m.dateEnd = "2026-10-28";
    }
    // per-session opt-in for "let AI refresh this with the latest info" —
    // defaults true for the two built-in sessions (matches the behaviour
    // they already had, since they've always had a live-check button).
    if (snap && !snap.aiRefreshToggles) snap.aiRefreshToggles = { weather: true, foliage: true };
    // custom sections gained the same opt-in refresh mechanism; AI-authored
    // ones default ON (they already came from a topic, so refreshing makes
    // sense), hand-written ones default OFF (no topic to refresh against
    // unless the user sets one via ✏️).
    if (snap && Array.isArray(snap.sections)) snap.sections.forEach(s => {
      if (s.aiRefresh == null) s.aiRefresh = s.source === "ai";
      if (s.topic == null) s.topic = s.title || "";
    });
    return snap;
  }
  const MODES = [
    { key:"walk",  icon:"🚶", label:"步行" },
    { key:"metro", icon:"🚇", label:"地鐵" },
    { key:"bus",   icon:"🚌", label:"巴士" },
    { key:"taxi",  icon:"🚕", label:"的士" },
    { key:"air",   icon:"✈",  label:"航班" }
  ];
  function segMode(html){
    const s = String(html || "");
    if (s.includes("🚶")) return "walk";
    if (s.includes("🚇") || s.includes("🚉") || s.includes("🚊") || s.includes("🚆")) return "metro";
    if (s.includes("🚌")) return "bus";
    if (s.includes("🚕") || s.includes("🚗")) return "taxi";
    if (s.includes("✈")) return "air";
    return "other";
  }
  function segPlain(html){
    const tmp = document.createElement("div");
    tmp.innerHTML = String(html || "");
    return tmp.textContent.replace(/^[\s\u{1F300}-\u{1FAFF}\u{2600}-\u{27BF}️]+/u, "").trim();
  }
  function buildSeg(mode, text, route){
    const m = MODES.find(x => x.key === mode) || MODES[0];
    const seg = { kind:"connector", html:`<span class="icon">${m.icon}</span>${esc(text)}` };
    if (route) seg.route = route;   // e.g. 安國 ─3號線・4站─ 忠武路 ─4號線・2站─ 明洞
    return seg;
  }

  // Quick outbound links for a stop. Local-language name searches better than
  // the Cantonese title, so prefer it; appending the trip's destination hint
  // narrows a bare name like "황생가칼국수" to the right city — read fresh off
  // meta (not hardcoded) so this works for whichever trip is loaded.
  function searchTerm(s){
    const kr = plain(s.kr), title = plain(s.title);
    return kr || title;
  }
  function destHint(){
    const m = (state.snapshot && state.snapshot.meta) || {};
    return m.destinationLocal ? " " + m.destinationLocal : "";
  }
  function googleSearchUrl(s){
    const q = searchTerm(s);
    return q ? `https://www.google.com/search?q=${encodeURIComponent(q + destHint())}` : null;
  }
  // The Maps "search action" URL (Google's documented format) lands on the
  // place card with its star rating and review count visible immediately.
  function googleReviewsUrl(s){
    const q = searchTerm(s);
    if (!q) return null;
    const base = `https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(q + destHint())}`;
    return s.placeId ? `${base}&query_place_id=${encodeURIComponent(s.placeId)}` : base;
  }

  // how to name a stop to Google: its place id if we have one, else coordinates,
  // else just its name
  function stopRef(s){
    if (!s) return null;
    if (s.placeId) return { placeId: s.placeId };
    if (Number.isFinite(s.lat) && Number.isFinite(s.lng)) return { lat: s.lat, lng: s.lng };
    if ((s.title || "").trim()) return { text: s.title.trim() };
    return null;
  }

  // The day's first stop is usually a "leaving the hotel" logistics line
  // ("酒店寄存行李後出發") with no coordinates or Google id of its own —
  // stopRef() falls back to sending that whole description SENTENCE to
  // Google as free-text origin, which can silently resolve to an arbitrary
  // wrong place (this is what broke a leg's recomputed route after a
  // mid-day stop between it and the hotel got deleted: the "fixed" result
  // still looked plausible, just from the wrong starting point). Use the
  // day's real accommodation coordinates for that leg instead.
  function stayRef(day){
    const stay = stayForDay(state.snapshot, day);
    if (stay && Number.isFinite(Number(stay.lat)) && Number.isFinite(Number(stay.lng)))
      return { lat: Number(stay.lat), lng: Number(stay.lng) };
    return null;
  }

  // After the order changes, the transit note before a stop describes a journey
  // that no longer happens. Flag those, then ask Google for the real numbers.
  async function refreshTransit(day, indices){
    let units = toUnits(day.items);
    // nothing comes before the first stop of a day, so it carries no transit note
    const first = firstStopUnit(units);
    const firstStopObj = first >= 0 ? units[first].stop : null;
    if (first >= 0 && units[first].seg){ units[first].seg = null; day.items = fromUnits(units); }
    // notes sit between stops without being one, so "the leg into this stop"
    // starts at the previous STOP, not simply at the previous unit
    const prevStop = i => { for (let j = i - 1; j >= 0; j--) if (units[j].stop) return units[j].stop; return null; };
    const todo = [...new Set(indices)]
      .filter(i => i > 0 && i < units.length && units[i] && units[i].stop && i !== first);
    if (!todo.length){ render(); return; }

    todo.forEach(i => {
      units[i].seg = Object.assign({ kind:"connector", html:"" }, units[i].seg, { stale:true, checking:true });
    });
    day.items = fromUnits(units);
    render();

    let why = "";
    for (const i of todo){
      const prev = prevStop(i);
      const from = (prev && prev === firstStopObj && !isRealPlace(prev) && stayRef(day)) || stopRef(prev);
      const to = stopRef(units[i].stop);
      let done = false;
      if (from && to){
        try {
          const r = await callAi({ action:"transit", from, to });
          if (r && r.ok !== false && r.text){ units[i].seg = buildSeg(r.mode || "walk", r.text, r.route); done = true; }
          else if (r && r.message) why = r.message;
        } catch (e){ why = e.message; }   // leave it flagged rather than show a wrong number
      }
      if (!done) units[i].seg.checking = false;
      day.items = fromUnits(units);
      render();
    }
    if (why) state.transitProblem = why;
    render();
    await saveNow("更新咗交通時間", true);
  }

  // ==================================================================
  // RENDER — shell
  // ==================================================================
  // Bookmark boards used to live at the tail end of this strip, past all 6
  // day tabs — invisible unless you scrolled all the way right, and easy to
  // not know existed at all. They now have their own always-visible entry
  // point (the 📌 button in the bottom dock) instead of competing for space
  // here; this strip stays just overview + days + notes, however many boards

  function renderLines(){
    const el = $("#lines");
    const days = state.snapshot ? state.snapshot.days : [];
    el.innerHTML = `

        <span class="bullet"></span><span class="lbl">全程</span>
      </button>
      ${days.map(d => `
        <button class="linebtn" role="tab" data-go="${d.id}" aria-selected="${state.view===d.id}" style="--lc:${DAY_COLORS[d.id]||'var(--d1)'}">
          <span class="bullet"></span>
          <span class="lbl">D${d.id.replace('day','')}</span>
          <span>${esc(d.shortTag != null ? d.shortTag : (DAY_SHORT[d.id]||''))}</span>

        <span class="bullet"></span><span>問過啲咩</span>

    `;
    el.querySelectorAll("[data-go]").forEach(b => b.addEventListener("click", () => {
      state.view = b.dataset.go;
      state.open.clear();

      window.scrollTo({ top: 0, behavior: "auto" });
      render();
      const active = $("#lines [aria-selected='true']");
      if (active) active.scrollIntoView({ block:"nearest", inline:"center" });

  }

  // The topbar brandmark sits outside #app (it's part of the fixed header,
  // not the per-view render), so it needs its own explicit update — it used
  // to be static markup hardcoded to "Seoul"/"서울 · 가을", which silently
  // kept saying Seoul on every other trip.
  function renderBrandmark(){
    const m = (state.snapshot && state.snapshot.meta) || {};
    const sys = $(".brandmark .sys"), ko = $(".brandmark .ko");
    if (sys) sys.textContent = m.title || m.destinationLocal || "行程";
    if (ko) ko.textContent = (m.destinationLocal && m.destinationLocal !== m.title) ? m.destinationLocal : (m.eyebrow || "");
  }
  function render(){
    renderBrandmark();
    renderLines();
    const app = $("#app");
    if (!state.snapshot){ app.innerHTML = `<p class="loading">載入緊行程…</p>`; return; }
    if (state.view === "notes"){ app.innerHTML = notesPageHtml(); wireNotes(); return; }
    const board = boardById(state.view);
    if (board){ app.innerHTML = boardHtml(board); wireBoard(board); return; }
    app.innerHTML = state.view === "overview" ? overviewHtml() : dayHtml(dayById(state.view));

  const HIDDEN_SECTION_LABELS = { acc:"住宿", weather:"天氣", clothing:"點著衫", access:"無障礙標記", ai:"AI 設定" };
  function secTools(key){

  // 「出發前必讀」入面嗰4嚿——住宿/天氣/點著衫/無障礙——用戶可以拉住 ⠿ 自己

  const HOME_ORDER_KEYS = ["acc", "weather", "clothing", "access"];
  function homeOrder(snap){

    const rest = HOME_ORDER_KEYS.filter(k => !saved.includes(k));

  async function reorderHomeBlocks(snap, from, to){

    render();
    await saveNow("調整咗主頁段落次序");
  }
  const HOME_DRAG_HANDLE = `<button class="secedit sechandle" data-hsdrag title="拉上拉落改次序" aria-label="拉上拉落改次序">⠿</button>`;
  // Used to say "10 月下旬天氣" no matter what trip was loaded — a leftover
  // Seoul-trip literal that silently mislabelled every other destination's
  // weather block. Derived from the trip's own dates instead.
  function weatherHeadingLabel(meta){
    const ds = String((meta && meta.dateStart) || "").split("-");
    const de = String((meta && meta.dateEnd) || "").split("-");
    if (ds.length < 2) return "天氣參考";
    const sm = +ds[1], sd = +ds[2];
    if (de.length < 2 || +de[1] === sm){
      const third = sd <= 10 ? "上旬" : sd <= 20 ? "中旬" : "下旬";
      return `${sm} 月${third}天氣`;
    }
    return `${sm} 月 — ${+de[1]} 月天氣`;
  }
  function homeBlockHtml(d, key){
    if (isSectionHidden(d, key)) return "";
    if (key === "acc"){
      return `<div class="hsblock" data-hskey="acc">
        <div class="k">住宿${secTools("acc")}${HOME_DRAG_HANDLE}</div>
        ${(d.stays || []).length ? (d.stays || []).map(st => `
          <div class="stayrow">

            <div class="v">${esc(st.name || "未填")}</div>
            ${st.desc ? `<div class="d">${esc(st.desc)}</div>` : ""}
            ${st.hoursChip ? `<div class="chiprow"><span class="meta-chip hours">${esc(st.hoursChip)}</span></div>` : ""}
            ${st.warning ? `<div class="d">${esc(st.warning)}</div>` : ""}
            ${st.mapUrl ? `<div class="chiprow"><a class="maplink" href="${esc(st.mapUrl)}" target="_blank" rel="noopener">📍 Naver Map 開啟</a></div>` : ""}
          </div>`).join("")
          : `<p class="hint">仲未填住宿。撳上面枝筆加返，可以加多過一間。</p>`}
      </div>`;
    }
    if (key === "weather"){
      return `<div class="hsblock" data-hskey="weather">
        <h3>${esc(weatherHeadingLabel(d.meta))}${secTools("weather")}${HOME_DRAG_HANDLE}</h3>
        <p class="sec-sub">歷年同期平均，出發前一週撳下面粒掣 check 返實時預報。</p>
        <table class="wtable">
          <tr><th>日期</th><th>日高</th><th>晨低</th><th>概況</th></tr>
          ${(d.weatherRows||[]).map(r=>`<tr><td class="mono">${esc(r.date)}</td><td class="hi">${esc(r.hi)}</td><td class="lo">${esc(r.lo)}</td><td>${esc(r.note)}</td></tr>`).join("")}

      </div>`;

        <div class="legend-item"><span class="legend-dot" style="background:var(--warn)"></span>${esc((d.accessLegend||[])[1]||"")}</div>
        <div class="legend-item"><span class="legend-dot" style="background:var(--danger)"></span>${esc((d.accessLegend||[])[2]||"")}</div>

  async function hideSection(key, label){

  // A quick "check the real thing now" button sitting right under the static
  // historical-average content, instead of only living inside the separate
  // AI 助手 sheet — the copy said "check 返實時預報" but gave no way to
  // actually do that without leaving the page to hunt for the right button.
  // Gated on a per-session opt-in toggle (aiRefreshToggleHtml) — a user who
  // doesn't want THIS particular block bothering Gemini can turn it off, and
  // the button just disappears rather than sitting there disabled.
  function liveCheckButtonHtml(kind, label){
    const on = !!(state.snapshot.aiRefreshToggles || {})[kind];
    return aiRefreshToggleHtml(kind, on) +
      (on ? `<button class="btn" data-livecheck="${kind}" style="margin-top:9px;">${esc(label)}</button>
             <div class="ai-out" id="livecheck-${kind}"></div>` : "");
  }

  function aiRefreshToggleHtml(key, on){

  function wireLiveChecks(){

  function hiddenSectionsHtml(d){

  // ---------- how to pay for transport ----------

          ${c.pick ? `<span class="badge note">建議</span>` : ""}
        </div>
        <div class="fare-price mono">${esc(c.price)}</div>
        ${c.good ? `<div class="fare-line good">✓ ${esc(c.good)}</div>` : ""}
        ${c.bad ? `<div class="fare-line bad">✕ ${esc(c.bad)}</div>` : ""}
      </div>`).join("");

    const fares = (t.fares || []).map(f =>
      `<tr><td>${esc(f.what)}</td><td class="hi mono">${esc(f.cost)}</td><td>${esc(f.note || "")}</td></tr>`).join("");

    const arrival = t.arrival ? `
      <div class="panel callout">
        <div class="k">⚠️ ${esc(t.arrival.title)}</div>

        ${(t.arrival.options || []).map(o => `
          <div class="opt">

        ${cards ? `<div class="fare-grid">${cards}</div>` : ""}
        ${fares ? `<h3>大約幾多錢</h3>

          <div class="usec" data-usec="${i}">
            <div class="usec-head">
              <button class="iconbtn sechandle" data-usecdrag aria-label="拉上拉落改次序" title="拉上拉落改次序">⠿</button>

            ${(s.links || []).length ? `<div class="ailog-links">${(s.links||[]).map(l =>
              `<a href="${esc(l.url)}" target="_blank" rel="noopener">🔗 ${esc(l.name || l.url)}</a>`).join("")}</div>` : ""}
            ${s.source === "ai" ? `<div class="usec-by">✨ AI 幫手整，改得㗎</div>` : ""}
            ${aiRefreshToggleHtml("sec:" + i, !!s.aiRefresh)}
