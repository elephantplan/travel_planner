  function wireBoard(board){
    wireOpenToggles();

    const nameEl = $("#boardname-display");
    if (nameEl) nameEl.addEventListener("click", () => {
      state.renamingBoard = board.id;
      render();
      const inp = $("#boardname-input");
      if (inp){ inp.focus(); inp.select(); }
    });
    const nameInput = $("#boardname-input");
    if (nameInput){
      nameInput.focus(); nameInput.select();
      let committed = false;
      const commit = async () => {
        if (committed) return;
        committed = true;
        const v = nameInput.value.trim();
        board.name = v || "未命名清單";
        state.renamingBoard = null;
        render();
        await saveNow(`將清單改名做「${board.name}」`);
      };
      nameInput.addEventListener("keydown", e => { if (e.key === "Enter"){ e.preventDefault(); nameInput.blur(); } });
      nameInput.addEventListener("blur", commit);
    }

    const addBtn = $("#addboarditem");
    if (addBtn) addBtn.addEventListener("click", async () => {
      board.items.push(blankBoardItem());
      const idx = board.items.length - 1;
      state.open.clear();
      state.open.add(board.id + ":" + idx);
      render();
      const titleInp = document.querySelector('[data-boardeditor] [data-bf="title"]');
      if (titleInp){ titleInp.focus(); titleInp.scrollIntoView({ block:"center", behavior:"smooth" }); }
      await saveNow(`加咗一個新地點落「${board.name}」`);
    });

    const delBtn = $("#delboard");
    if (delBtn) delBtn.addEventListener("click", async () => {
      if (!confirm(`刪除成個「${board.name}」清單？入面 ${board.items.length} 個地點都會一齊冇。`)) return;
      state.snapshot.boards = (state.snapshot.boards || []).filter(b => b.id !== board.id);
      state.view = "overview";
      render();
      await saveNow(`刪除咗清單「${board.name}」`);
    });

    // 📷 placeholder on a photo-less item: fetch one picture, no picker
    document.querySelectorAll("[data-getboardphoto]").forEach(el => el.addEventListener("click", async ev => {
      ev.preventDefault();
      ev.stopPropagation();
      if (el.dataset.busy) return;
      el.dataset.busy = "1";
      el.innerHTML = "⏳";
      const s = board.items[+el.dataset.getboardphoto];
      const name = plain(s.kr) || plain(s.title);
      let got = false;
      try {
        const r = await callAi(s.placeId ? { action:"place-photo", placeId:s.placeId }
                                         : { action:"place-photo", query:name });
        if (r && r.ok !== false && r.photos && r.photos.length){ s.photoUrl = r.photos[0]; got = true; }
      } catch (_){}
      if (!got) s.noPhoto = true;
      render();
      if (got) saveNow(`搵咗張相俾「${name}」`);
    }));

    wireBoardItemEditor(board);
  }

  function wireBoardItemEditor(board){
    const box = document.querySelector("[data-boardeditor]");
    if (!box) return;
    const i = +box.dataset.boardeditor;
    const s = board.items[i];

    box.querySelectorAll("[data-bf]").forEach(el => {
      el.addEventListener("input", () => {
        s[el.dataset.bf] = el.value;
        if (el.dataset.bf === "title"){
          const nameEl = box.closest(".stopcard").querySelector(".stopname");
          if (nameEl){
            nameEl.textContent = el.value.trim() || "未改名嘅地點";
            nameEl.classList.toggle("unnamed", !el.value.trim());
          }
        }
        saveSoon("改咗「" + (plain(s.title) || "一個地點") + "」");
      });
    });

    // google place autocomplete on the name field
    const titleInput = box.querySelector('[data-bf="title"]');
    const sugBox = box.querySelector("[data-bsuggest]");
    let sugTimer = null;
    titleInput.addEventListener("input", () => {
      clearTimeout(sugTimer);
      const q = titleInput.value.trim();
      if (q.length < 2){ sugBox.innerHTML = ""; return; }
      sugTimer = setTimeout(async () => {
        sugBox.innerHTML = `<p class="hint">搵緊…</p>`;
        try {
          const r = await callAi({ action:"place-search", query:q });
          if (r.ok === false){ sugBox.innerHTML = `<p class="hint">${esc(r.message)}</p>`; return; }
          if (!r.places || !r.places.length){ sugBox.innerHTML = `<p class="hint">搵唔到，照用你打嘅名就得。</p>`; return; }
          sugBox.innerHTML = r.places.map((p,ix)=>`
            <button class="suggest-item" data-p="${ix}">
              <div class="n">${esc(p.name)}</div><div class="a">${esc(p.address)}</div>
            </button>`).join("");
          sugBox.querySelectorAll("[data-p]").forEach(b => b.addEventListener("click", async () => {
            const p = r.places[+b.dataset.p];
            s.title = p.name; s.placeId = p.placeId;
            if (Number.isFinite(p.lat)) s.lat = p.lat;
            if (Number.isFinite(p.lng)) s.lng = p.lng;
            s.mapUrl = `https://map.naver.com/p/search/${encodeURIComponent(p.name)}`;
            titleInput.value = p.name;
            sugBox.innerHTML = `<p class="hint">已揀「${esc(p.name)}」，搵緊張相…</p>`;
            try {
              const pr = await callAi({ action:"place-photo", placeId:p.placeId });
              if (pr.ok !== false && pr.photos && pr.photos.length) s.photoUrl = pr.photos[0];
            } catch(_){}
            await saveNow("加咗「" + s.title + "」落「" + board.name + "」");
            render();
          }));
        } catch (e){ sugBox.innerHTML = `<p class="hint">搵唔到：${esc(e.message)}</p>`; }
      }, 420);
    });

    box.querySelectorAll("[data-bact]").forEach(btn => btn.addEventListener("click", async () => {
      const act = btn.dataset.bact;

      if (act === "close"){ state.open.clear(); render(); return; }

      if (act === "remove"){
        if (!confirm("刪走「" + (plain(s.title) || "呢個地點") + "」？")) return;
        board.items.splice(i,1);
        state.open.clear();
        render();
        await saveNow("刪走咗「" + (plain(s.title) || "一個地點") + "」");
        return;
      }

      if (act === "move"){ openMovePicker({ kind:"board", board, index:i }); return; }

      if (act === "findphoto"){
        const replacing = !!s.photoUrl;
        const holder = box.querySelector("[data-bphotos]");
        holder.innerHTML = `<p class="hint">搵緊相…</p>`;
        try {
          const payload = s.placeId ? { action:"place-photo", placeId:s.placeId }
                                    : { action:"place-photo", query:(s.kr || s.title) };
          const r = await callAi(payload);
          if (r.ok === false){ holder.innerHTML = `<p class="hint">${esc(r.message)}</p>`; return; }
          if (!r.photos || !r.photos.length){ holder.innerHTML = `<p class="hint">搵唔到呢度嘅相。</p>`; return; }
          if (!replacing){
            s.photoUrl = r.photos[0];
            await saveNow("加咗「" + (plain(s.title)||"一個地點") + "」嘅相");
            render();
            return;
          }
          holder.innerHTML = `<div class="photogrid">${r.photos.map(u2=>`<img src="${esc(u2)}" data-u="${esc(u2)}" class="${u2===s.photoUrl?'on':''}" alt="">`).join("")}</div><p class="hint">撳一張就用嗰張。</p>`;
          holder.querySelectorAll("img").forEach(img => img.addEventListener("click", async () => {
            s.photoUrl = img.dataset.u;
            await saveNow("換咗「" + (plain(s.title)||"一個地點") + "」嘅相");
            render();
          }));
        } catch (e){ holder.innerHTML = `<p class="hint">搵唔到：${esc(e.message)}</p>`; }
      }
    }));
  }

  function closeLayer(){
    $("#layer").innerHTML = "";
    document.body.style.overflow = "";
    document.removeEventListener("keydown", onLayerKey);
  }
  function onLayerKey(e){ if (e.key === "Escape") closeLayer(); }
  function openSheet(inner, after){
    const layer = $("#layer");
    layer.innerHTML = `<div class="scrim" data-close></div>
      <div class="sheet" role="dialog" aria-modal="true"><div class="sheet-wide">
        <div class="grabber"></div>
        <button class="iconbtn sheet-close" data-close aria-label="收埋">✕</button>
        ${inner}
      </div></div>`;
    layer.querySelectorAll("[data-close]").forEach(el => el.addEventListener("click", closeLayer));
    document.body.style.overflow = "hidden";
    document.addEventListener("keydown", onLayerKey);
    if (after) after(layer);
  }

  // ---------- AI ----------
  $("#btn-ai").addEventListener("click", () => {
    openSheet(`
      <h3>AI 助手</h3>
      <p class="sec-sub">問實時天氣同紅葉情況，或者叫佢執一執行程。問過嘅嘢會自動存底，去頂部「問過啲咩」睇返。</p>
      <div class="aibtns">
        <button class="btn" data-ai="weather">☁️ 實時天氣</button>
        <button class="btn" data-ai="foliage">🍁 紅葉情況</button>
        <button class="btn" data-ai="suggest">💡 執一執行程</button>
      </div>
      <div class="askrow">
        <input class="input" id="ai-q" placeholder="想問啲咩？例如：Day 3 加多個景點">
        <button class="btn primary" data-ai="ask">問</button>
      </div>
      <div class="ai-out" id="ai-out"></div>
      <button class="btn wide" id="go-notes" style="margin-top:12px;">🗒 睇返問過啲咩</button>
    `, layer => {
      const out = layer.querySelector("#ai-out");
      const q = layer.querySelector("#ai-q");
      const busy = () => { out.innerHTML = `<div class="ai-msg">諗緊…</div>`; };

      layer.querySelector("#go-notes").addEventListener("click", () => {
        closeLayer();
        state.view = "notes";
        window.scrollTo({ top: 0, behavior: "auto" });
        render();
      });

      layer.querySelectorAll("[data-ai]").forEach(b => b.addEventListener("click", async () => {
        const act = b.dataset.ai;
        busy();
        try {
          if (act === "weather"){
            const r = await callAi({ action:"weather" });
            out.innerHTML = `<div class="ai-msg">${esc(r.summary||"")}</div>` +
                            (r.aiSummary ? `<div class="ai-msg">${esc(r.aiSummary)}</div>` : "") +
                            (!r.aiSummary && r.aiNotice ? `<div class="ai-msg">${esc(r.aiNotice)}</div>` : "");
            saveAiNote("weather", "實時天氣", [r.summary, r.aiSummary || r.aiNotice].filter(Boolean).join("\n\n"));
          } else if (act === "foliage"){
            const r = await callAi({ action:"foliage" });
            const a = r.aiSummary || r.message || "冇回覆";
            out.innerHTML = `<div class="ai-msg">${esc(a)}</div>`;
            if (r.aiSummary) saveAiNote("foliage", "紅葉情況", a);
          } else if (act === "ask"){
            const question = q.value.trim();
            if (!question){ out.innerHTML = ""; q.focus(); return; }
            const r = await callAi({ action:"ask", question, itinerary: state.snapshot });
            const a = r.aiSummary || r.message || "冇回覆";
            out.innerHTML = `<div class="ai-msg">${esc(a)}</div>`;
            if (r.aiSummary) saveAiNote("ask", question, a);
          } else if (act === "suggest"){
            const r = await callAi({ action:"suggest", question:q.value.trim(), itinerary: state.snapshot });
            if (r.ok === false){ out.innerHTML = `<div class="ai-msg">${esc(r.message)}</div>`; return; }
            const changes = r.changes || [];
            if (!changes.length){
              const a = r.notes || r.aiSummary || "冇特別建議。";
              out.innerHTML = `<div class="ai-msg">${esc(a)}</div>`;
              saveAiNote("suggest", q.value.trim() || "執一執行程", a);
              return;
            }
            saveAiNote("suggest", q.value.trim() || "執一執行程",
              [r.notes, ...changes.map(c => {
                const label = c.op === "add" ? "加" : c.op === "remove" ? "刪" : "改";
                return `【Day ${String(c.dayId||"").replace("day","")}・${label}】${c.stop?.title || c.matchTitle || ""}\n${c.reason || ""}`;
              })].filter(Boolean).join("\n\n"));
            out.innerHTML = (r.notes ? `<div class="ai-msg">${esc(r.notes)}</div>` : "") +
              changes.map((c,i) => {
                const label = c.op === "add" ? "加" : c.op === "remove" ? "刪" : "改";
                const name = c.stop?.title || c.matchTitle || "";
                return `<div class="ai-change" style="--lc:${DAY_COLORS[c.dayId]||'var(--d3)'}">
                  <div class="op">Day ${String(c.dayId||"").replace("day","")} · ${label}</div>
                  <div class="ttl">${esc(name)}</div>
                  ${c.stop?.transitBefore ? `<div class="why">${esc(c.stop.transitBefore)}</div>` : ""}
                  <div class="why">${esc(c.reason||"")}</div>
                  <div class="editor-tools"><button class="btn primary" data-apply="${i}">套用</button></div>
                </div>`;
              }).join("");
            out.querySelectorAll("[data-apply]").forEach(ab => ab.addEventListener("click", async () => {
              const c = changes[+ab.dataset.apply];
              ab.textContent = "套用緊…"; ab.disabled = true;
              // inserts by time, then fills in photo and transit; "" means it worked
              const why = await applyAiChange(c);
              if (why){ ab.textContent = "⚠️ " + why; ab.disabled = false; }
              else ab.textContent = "已套用";
            }));
          }
        } catch (e){ out.innerHTML = `<div class="ai-msg">出咗問題：${esc(e.message)}</div>`; }
      }));
    });
  });

  // ==================================================================
  const AI_KIND = { weather:"☁️ 天氣", foliage:"🍁 紅葉", ask:"💬 問嘢", suggest:"💡 執行程" };

  function notesPageHtml(){
    return `
      <section class="sec" style="padding-top:24px;">
        <h2 class="sec-title">問過啲咩</h2>
        <p class="sec-sub">全家人問過 AI 嘅嘢都喺呢度，最新喺上面。撳一下睇返完整答案。</p>
        <div class="chiprow" id="note-filter"></div>
        <div id="note-list"><p class="hint">載入緊…</p></div>
      </section>`;
  }

  async function wireNotes(){
    const list = document.getElementById("note-list");
    const filter = document.getElementById("note-filter");
    let rows = [];
    try {
      rows = await fetchAiNotes();
    } catch (e){
      list.innerHTML = `<div class="errbox">載入唔到紀錄：${esc(e.message)}</div>`;
      return;
    }
    if (!rows.length){
      filter.innerHTML = "";
      list.innerHTML = `<p class="hint">仲未問過嘢。撳右下角「✨ AI 助手」問一次，之後就會喺呢度見到。</p>`;
      return;
    }

    const kinds = ["all", ...Object.keys(AI_KIND).filter(k => rows.some(r => r.kind === k))];
    let active = "all";

    function paint(){
      filter.innerHTML = kinds.map(k => {
        const n = k === "all" ? rows.length : rows.filter(r => r.kind === k).length;
        return `<button class="badge${k === active ? " note" : ""}" data-kind="${k}" style="cursor:pointer">${
          k === "all" ? "全部" : esc(AI_KIND[k])} ${n}</button>`;
      }).join("");
      filter.querySelectorAll("[data-kind]").forEach(b => b.addEventListener("click", () => {
        active = b.dataset.kind; paint();
      }));

      const shown = active === "all" ? rows : rows.filter(r => r.kind === active);
      list.innerHTML = shown.map((r,i) => `
        <div class="qa">
          <button class="qa-head" data-note="${i}">
            <span class="qa-meta">
              <span class="badge note">${esc(AI_KIND[r.kind] || r.kind)}</span>
              <span class="when">${esc(new Date(r.created_at).toLocaleString("zh-HK",{month:"numeric",day:"numeric",hour:"2-digit",minute:"2-digit"}))}</span>
              <span class="when">· ${esc(r.asked_by || "家人")}</span>
            </span>
            <span class="qa-q">${esc(r.question || "")}</span>
          </button>
          <div class="qa-a" hidden>${esc(r.answer)}</div>
        </div>`).join("");
      list.querySelectorAll("[data-note]").forEach(btn => btn.addEventListener("click", () => {
        const a = btn.nextElementSibling;
        a.hidden = !a.hidden;
        btn.classList.toggle("open", !a.hidden);
      }));
    }
    paint();
  }

  // "約 20:00" / "10:30 起（睡到自然醒）" / "14:00–16:00" -> minutes since midnight
  function timeToMinutes(t){
    const m = String(t || "").match(/(\d{1,2})\s*[:：]\s*(\d{2})/);
    if (!m) return null;
    const h = +m[1], mi = +m[2];
    return (h > 23 || mi > 59) ? null : h * 60 + mi;
  }
  // where a stop belongs in the day, by its own time
  function slotForTime(units, time){
    const t = timeToMinutes(time);
    if (t == null) return units.length;
    for (let i = 0; i < units.length; i++){
      const ot = timeToMinutes(units[i].stop && units[i].stop.time);
      if (ot != null && ot > t) return i;
    }
    return units.length;
  }

  // A stop the AI invented has only a name. Find the real place behind it so it
  // gets a photo, a map link, and coordinates good enough to route from.
  async function enrichStop(s){
    const name = plain(s.title);
    if (!name) return;
    try {
      const r = await callAi({ action:"place-search", query:name });
      const p = r && r.places && r.places[0];
      if (p){
        s.placeId = p.placeId;
        if (Number.isFinite(p.lat)) s.lat = p.lat;
        if (Number.isFinite(p.lng)) s.lng = p.lng;
        if (!s.mapUrl) s.mapUrl = `https://map.naver.com/p/search/${encodeURIComponent(p.name)}`;
      }
    } catch (_){}
    if (s.photoUrl) return;
    try {
      const pr = await callAi(s.placeId ? { action:"place-photo", placeId:s.placeId }
                                        : { action:"place-photo", query:name });
      if (pr && pr.ok !== false && pr.photos && pr.photos.length) s.photoUrl = pr.photos[0];
    } catch (_){}
  }

  // The AI names a stop in its own words — "北村韓屋村" for a card actually
  // titled "北村韓屋村（平緩觀景點）". Exact matching silently dropped those,
  // so fall back to a looser comparison before giving up.
  function loose(s){
    return plain(s)
      .replace(/[（(][^）)]*[）)]/g, "")   // drop parentheticals
      .replace(/[\s・·、，,.。~〜\-–—]/g, "")
      .toLowerCase();
  }
  function findStopIndex(units, title){
    const want = plain(title), wantLoose = loose(title);
    if (!want) return -1;
    let ix = units.findIndex(u => u.stop && plain(u.stop.title) === want);
    if (ix >= 0) return ix;
    if (!wantLoose) return -1;
    ix = units.findIndex(u => u.stop && loose(u.stop.title) === wantLoose);
    if (ix >= 0) return ix;
    // one name contains the other, e.g. "Mil Toast House" vs "Mil Toast House 益善洞"
    const hits = units.map((u,i) => [u,i]).filter(([u]) => {
      if (!u.stop) return false;
      const got = loose(u.stop.title);
      return got && (got.includes(wantLoose) || wantLoose.includes(got));
    });
    return hits.length === 1 ? hits[0][1] : -1;   // ambiguous is as bad as missing
  }

  // returns "" when applied, otherwise a reason to show on the button
  async function applyAiChange(c){
    const day = dayById(c.dayId);
    if (!day) return `搵唔到 ${c.dayId || "嗰一日"}`;
    const units = toUnits(day.items);

    if (c.op === "add" && c.stop){
      const stop = Object.assign(blankStop(), c.stop, { kind:"stop" });
      delete stop.transitBefore;          // describes a leg we are about to recompute
      // drop it in by time rather than at the end, so the day still reads in order
      const at = slotForTime(units, stop.time);
      units.splice(at, 0, { seg: null, stop });
      day.items = fromUnits(units);
      render();
      await enrichStop(stop);
      day.items = fromUnits(units);
      render();
      await saveNow(c.reason || `加咗「${plain(stop.title) || "一個地點"}」`);
      // the AI's own travel note assumed a different neighbour; ask Google instead
      await refreshTransit(day, [at, at + 1]);
      return "";
    }

    if (c.op === "remove" && c.matchTitle){
      const ix = findStopIndex(units, c.matchTitle);
      if (ix < 0) return `搵唔到「${plain(c.matchTitle)}」`;
      units.splice(ix,1);
      day.items = fromUnits(units);
      render();
      await saveNow(c.reason || `刪走咗「${plain(c.matchTitle)}」`);
      await refreshTransit(day, [ix]);
      return "";
    }

    if (c.op === "edit" && c.matchTitle && c.stop){
      const ix = findStopIndex(units, c.matchTitle);
      if (ix < 0) return `搵唔到「${plain(c.matchTitle)}」`;
      const before = units[ix].stop.time;
      const wasNamed = plain(units[ix].stop.title);
      Object.assign(units[ix].stop, c.stop, { kind:"stop" });
      delete units[ix].stop.transitBefore;
      let at = ix;
      if (timeToMinutes(units[ix].stop.time) !== timeToMinutes(before)){
        const [moved] = units.splice(ix, 1);          // time changed, so its slot may have too
        at = slotForTime(units, moved.stop.time);
        units.splice(at, 0, moved);
      }
      day.items = fromUnits(units);
      render();
      // renamed to a different place, so its photo and coordinates are stale too
      if (plain(units[at].stop.title) !== wasNamed){
        units[at].stop.photoUrl = ""; units[at].stop.placeId = "";
        await enrichStop(units[at].stop);
        day.items = fromUnits(units);
        render();
      }
      await saveNow(c.reason || `改咗「${plain(c.matchTitle)}」`);
      // a moved stop leaves two broken legs behind it and one in front
      if (at !== ix) await refreshTransit(day, [Math.min(ix, at), Math.max(ix, at), Math.max(ix, at) + 1]);
      return "";
    }

    day.items = fromUnits(units);
    render();
    return "呢個建議睇唔明，冇改到行程";
  }

  // ---------- human-readable version comparison ----------
  // A raw JSON diff is unreadable (photo URLs, HTML blobs, coordinates all
  // shift line numbers around). Compare what a reader actually cares about:
  // which stop was added/removed/changed, day by day.
  function stopKey(s){ return plain(s && s.title) || ""; }

  function summarizeItemsDiff(oldItems, newItems){
    const oldStops = (oldItems||[]).filter(i => i.kind === "stop");
    const newStops = (newItems||[]).filter(i => i.kind === "stop");
    const oldByKey = new Map();
    oldStops.forEach(s => { const k = stopKey(s); if (k && !oldByKey.has(k)) oldByKey.set(k, s); });
    const newByKey = new Map();
    newStops.forEach(s => { const k = stopKey(s); if (k && !newByKey.has(k)) newByKey.set(k, s); });

    const lines = [];
    newStops.forEach(s => {
      const k = stopKey(s);
      if (k && !oldByKey.has(k)) lines.push({ type:"add", text:`＋ 加咗「${k}」${plain(s.time) ? `（${plain(s.time)}）` : ""}` });
    });
    oldStops.forEach(s => {
      const k = stopKey(s);
      if (k && !newByKey.has(k)) lines.push({ type:"remove", text:`－ 刪咗「${k}」` });
    });
    newByKey.forEach((s, k) => {
      const o = oldByKey.get(k);
      if (!o) return;
      const changes = [];
      if (plain(o.time) !== plain(s.time)) changes.push(`時間 ${plain(o.time) || "未定"} → ${plain(s.time) || "未定"}`);
      if (plain(o.desc) !== plain(s.desc)) changes.push("改咗描述");
      if ((o.photoUrl||"") !== (s.photoUrl||"")) changes.push(o.photoUrl ? "換咗相" : "加咗相");
      if ((o.mapUrl||"") !== (s.mapUrl||"") && o.mapUrl && s.mapUrl) changes.push("地圖連結有更新");
      if (changes.length) lines.push({ type:"edit", text:`✎ 「${k}」：${changes.join("、")}` });
    });
    // did the common stops change relative order?
    const commonOld = oldStops.map(stopKey).filter(k => k && newByKey.has(k));
    const commonNew = newStops.map(stopKey).filter(k => k && oldByKey.has(k));
    if (commonOld.length > 1 && commonOld.join("|") !== commonNew.join("|")){
      lines.push({ type:"reorder", text:"⇅ 次序調整咗" });
    }
    return lines;
  }

  function summarizeSnapshotDiff(oldSnap, newSnap){
    const sections = [];
    const oldDaysById = new Map((oldSnap.days||[]).map(d => [d.id, d]));
    (newSnap.days||[]).forEach(nd => {
      const od = oldDaysById.get(nd.id);
      const lines = summarizeItemsDiff(od ? od.items : [], nd.items);
      if (lines.length) sections.push({ label: `Day ${nd.id.replace('day','')} · ${nd.title}`, lines });
    });
    (oldSnap.days||[]).forEach(od => {
      if (!(newSnap.days||[]).some(nd => nd.id === od.id)){
        sections.push({ label: `Day ${od.id.replace('day','')} · ${od.title}`, lines:[{ type:"remove", text:"－ 成日行程被刪走咗" }] });
      }
    });

    const oldBoards = oldSnap.boards || [], newBoards = newSnap.boards || [];
    const oldBoardsById = new Map(oldBoards.map(b => [b.id, b]));
    newBoards.forEach(nb => {
      const ob = oldBoardsById.get(nb.id);
      const asStops = items => items.map(i => ({ ...i, kind:"stop" }));
      if (!ob){
        sections.push({ label:`📌 ${nb.name}`, lines:[{ type:"add", text:`＋ 開咗個新清單，入面 ${nb.items.length} 個地點` }] });
        return;
      }
      const lines = [];
      if (ob.name !== nb.name) lines.push({ type:"edit", text:`改咗名：「${ob.name}」→「${nb.name}」` });
      lines.push(...summarizeItemsDiff(asStops(ob.items), asStops(nb.items)));
      if (lines.length) sections.push({ label:`📌 ${nb.name}`, lines });
    });
    oldBoards.forEach(ob => {
      if (!newBoards.some(nb => nb.id === ob.id)) sections.push({ label:`📌 ${ob.name}`, lines:[{ type:"remove", text:"－ 成個清單被刪走咗" }] });
    });

    return sections;
  }

  function diffSummaryHtml(sections){
    if (!sections.length) return `<p class="hint">呢兩個版本冇分別。</p>`;
    return sections.map(sec => `
      <div class="diffday">
        <div class="diffday-title">${esc(sec.label)}</div>
        ${sec.lines.map(l => `<div class="diffline diffline-${l.type}">${esc(l.text)}</div>`).join("")}
      </div>`).join("");
  }

  // ---------- history ----------
  $("#btn-history").addEventListener("click", async () => {
    openSheet(`<h3>改動紀錄</h3><p class="sec-sub">最頂（標「而家」）係最新版本。撳「同而家比較」睇邊日有咩改咗；或者剔兩個版本再撳「比較揀咗嘅兩個」。</p><div class="vlist" id="vlist"><p class="hint">載入緊…</p></div>`, async layer => {
      const list = layer.querySelector("#vlist");
      try {
        const rows = await fetchAllVersions();
        if (!rows.length){ list.innerHTML = `<p class="hint">仲未有任何紀錄。</p>`; return; }
        list.innerHTML = `
          <div class="editor-tools" style="margin:0 0 4px;">
            <button class="btn" id="cmp">比較揀咗嘅兩個</button>
          </div>
          ${rows.map((r,idx) => `
            <label class="vrow">
              <input type="checkbox" value="${r.id}">
              <span style="flex:1 1 auto;min-width:0;">
                <span class="who">${esc(r.edited_by||"匿名")}</span>
                <span class="when"> · ${esc(new Date(r.created_at).toLocaleString("zh-HK",{month:"numeric",day:"numeric",hour:"2-digit",minute:"2-digit"}))}</span>
                ${idx===0 ? `<span class="badge now">而家</span>` : ""}
                <span class="sum">${esc(r.summary||"")}</span>
                <span class="acts">
                  <button class="btn" data-view="${r.id}">睇呢版</button>
                  ${idx!==0 ? `<button class="btn" data-cmpnow="${r.id}">同而家比較</button>` : ""}
                  <button class="btn" data-restore="${r.id}">還原</button>
                </span>
              </span>
            </label>`).join("")}`;

        list.querySelectorAll("[data-view]").forEach(b => b.addEventListener("click", async e => {
          e.preventDefault();
          try {
            const snap = await fetchVersionSnapshot(b.dataset.view);
            if (!snap) return;
            state.snapshot = normalizeSnapshot(snap); state.open.clear();
            closeLayer(); render();
            flash("而家睇緊舊版本（未還原）");
          } catch (err){ alert("睇唔到呢版：" + err.message); }
        }));

        list.querySelectorAll("[data-restore]").forEach(b => b.addEventListener("click", async e => {
          e.preventDefault();
          if (!confirm("還原到呢個版本？（唔會刪走中間嘅紀錄）")) return;
          try {
            const snap = await fetchVersionSnapshot(b.dataset.restore);
            if (!snap) return;
            state.snapshot = normalizeSnapshot(snap);
            await saveVersion(snap, "restore", "還原到版本 #" + b.dataset.restore);
            closeLayer(); render(); flash("已還原");
          } catch (err){ alert("還原唔到：" + err.message); }
        }));

        list.querySelectorAll("[data-cmpnow]").forEach(b => b.addEventListener("click", async e => {
          e.preventDefault();
          const holder = document.createElement("div");
          holder.className = "diffwrap";
          holder.innerHTML = `<p class="hint">比較緊…</p>`;
          list.prepend(holder);
          try {
            const old = await fetchVersionSnapshot(b.dataset.cmpnow);
            if (!old) return;
            const sections = summarizeSnapshotDiff(old, state.snapshot);
            holder.innerHTML = `<div class="diffwrap-title">呢個版本 → 而家嘅分別</div>${diffSummaryHtml(sections)}`;
          } catch (err){ holder.innerHTML = `<p class="hint">比較唔到：${esc(err.message)}</p>`; }
        }));

        list.querySelector("#cmp").addEventListener("click", async e => {
          e.preventDefault();
          // checkboxes appear in the same order as rows (newest first), so the
          // one checked first in document order is whichever pick is newer
          const picked = Array.from(list.querySelectorAll("input:checked")).map(i => i.value);
          if (picked.length !== 2){ alert("揀啱兩個版本先可以比較。"); return; }
          const holder = document.createElement("div");
          holder.className = "diffwrap";
          holder.innerHTML = `<p class="hint">比較緊…</p>`;
          list.prepend(holder);
          try {
            const [older, newer] = await Promise.all([fetchVersionSnapshot(picked[1]), fetchVersionSnapshot(picked[0])]);
            const sections = summarizeSnapshotDiff(older, newer);
            holder.innerHTML = `<div class="diffwrap-title">兩個版本嘅分別</div>${diffSummaryHtml(sections)}`;
          } catch (err){ holder.innerHTML = `<p class="hint">比較唔到：${esc(err.message)}</p>`; }
        });
      } catch (e){ list.innerHTML = `<div class="errbox">載入唔到紀錄：${esc(e.message)}</div>`; }
    });
  });

  // ==================================================================
  // BOOT
  // ==================================================================
  async function boot(){
    let row;
    try {
      row = await fetchLatestVersion();
      if (!row) throw new Error("資料庫入面仲未有行程版本。");
    } catch (e){
      $("#app").innerHTML = `<div class="sec"><div class="errbox">載入唔到行程：${esc(e.message)}<br>檢查下網絡再重新整理。</div></div>`;
      return;
    }
    state.snapshot = normalizeSnapshot(row.snapshot);
    try {
      render();
    } catch (e){
      $("#app").innerHTML = `<div class="sec"><div class="errbox">行程讀到咗，但畫唔出嚟：${esc(e.message)}<br>可以撳上面日子掣試下第二日。</div></div>`;
    }
  }
  boot();
})();
</script>
