  function blankSection(){ return { icon:"📌", title:"", sub:"", lines:[], links:[], source:"manual", topic:"", aiRefresh:false }; }
  async function reorderCustomSections(snap, from, to){
    if (!Array.isArray(snap.sections)) return;
    const [moved] = snap.sections.splice(from, 1);
    snap.sections.splice(to, 0, moved);
    render();
    await saveNow("調整咗自己加嘅 section 次序");
  }

  function openSectionEditor(idx){
    const d = state.snapshot;
    if (!Array.isArray(d.sections)) d.sections = [];
    const s = idx == null ? blankSection() : d.sections[idx];
    if (!s) return;
    openEditSheet(idx == null ? "加一個 section" : "改「" + (s.title || "未命名") + "」",
      "一行一個重點。連結一行一個，寫做「名 | https://…」。", [
        { key:"icon",  label:"Emoji", type:"text", value:s.icon || "📌", placeholder:"🎁" },
        { key:"title", label:"標題",  type:"text", value:s.title || "", placeholder:"例如：手信買咩好" },
        { key:"sub",   label:"副標題（可以留空）", type:"text", value:s.sub || "" },
        { key:"lines", label:"內容（一行一個重點）", type:"lines", value:(s.lines||[]).join("\n"), rows:9 },
        { key:"links", label:"連結（一行一個，名 | 網址）", type:"lines",
          value:(s.links||[]).map(l => `${l.name || ""} | ${l.url || ""}`).join("\n"), rows:3 },
        { key:"topic", label:"AI 更新用嘅題目（撳「🔄 AI 自動更新」先用得着）",
          hint:"開咗自動更新之後，撳「重新check」會攞呢個題目再問一次 AI。留空就用返標題。",
          type:"text", value:s.topic || "", placeholder:"例如：手信買咩好" },
      ], async out => {
        const links = (out.links || []).map(row => {
          const parts = String(row).split("|");
          const url = (parts.length > 1 ? parts.slice(1).join("|") : parts[0]).trim();
          const name = (parts.length > 1 ? parts[0] : "").trim() || url;
          return /^https?:\/\//.test(url) ? { name, url } : null;   // a broken link is worse than none
        }).filter(Boolean);
        const next = Object.assign({}, s, {
          icon: out.icon || "📌", title: out.title || "未命名", sub: out.sub || "",
          lines: out.lines || [], links, topic: out.topic || "",
        });
        if (idx == null) d.sections.push(next); else d.sections[idx] = next;
        render();
        await saveNow(idx == null ? `加咗一個 section：${next.title}` : `改咗 section：${next.title}`);
      });
  }

  // AI writes the first draft from a topic; it lands in the same editable
  // shape as a hand-written one, so nothing is locked to the AI's version
  function openNewSectionSheet(){
    openSheet(`
      <h3>加一個 section</h3>
      <p class="sec-sub">例如：手信買咩好、換錢攻略、上網卡、行李清單、雨天備案。</p>
      <div class="askrow">
        <input class="input" id="usec-topic" placeholder="講個題目，例如：手信買咩好">
        <button class="btn primary" id="usec-ai">✨ AI 整</button>
      </div>
      <div id="usec-out"></div>
      <button class="btn wide" id="usec-manual" style="margin-top:10px;">✍️ 我自己寫</button>
    `, sheet => {
      const out = sheet.querySelector("#usec-out");
      const topic = sheet.querySelector("#usec-topic");
      sheet.querySelector("#usec-manual").addEventListener("click", () => { closeLayer(); openSectionEditor(null); });
      sheet.querySelector("#usec-ai").addEventListener("click", async () => {
        const t = topic.value.trim();
        if (!t){ topic.focus(); return; }
        const stop = busyIn(out, { steps:["AI 寫緊內容"], extra:`「${t}」`,
          hint:"AI 要睇埋你哋個行程先寫，大約 10-20 秒。" });
        let r;
        try { r = await callAi({ action:"make-section", topic:t, itinerary: state.snapshot }); }
        catch (e){ stop(); out.innerHTML = `<div class="ai-msg">出咗問題：${esc(e.message)}</div>`; return; }
        stop();
        if (!r || r.ok === false || !r.section){
          out.innerHTML = `<div class="ai-msg">${esc((r && r.message) || "AI 冇回覆到。")}</div>`;
          return;
        }
        const d = state.snapshot;
        if (!Array.isArray(d.sections)) d.sections = [];
        d.sections.push(Object.assign(blankSection(), r.section, { source:"ai", topic:t, aiRefresh:true }));
        closeLayer();
        render();
        await saveNow(`AI 加咗一個 section：${r.section.title || t}`);
        flash("加咗喺主頁下面，撳 ✏️ 就改得");
      });
    });
  }

  function wireCustomSections(){
    const add = $("#addusec");
    if (add) add.addEventListener("click", openNewSectionSheet);
    document.querySelectorAll("[data-usecedit]").forEach(b =>
      b.addEventListener("click", () => openSectionEditor(+b.dataset.usecedit)));
    document.querySelectorAll("[data-usecdel]").forEach(b => b.addEventListener("click", async () => {
      const i = +b.dataset.usecdel;
      const s = (state.snapshot.sections || [])[i];
      if (!s) return;
      if (!confirm(`刪走「${s.title || "呢個 section"}」？舊版本仲會記住，隨時喺歷史紀錄還原返。`)) return;
      state.snapshot.sections.splice(i, 1);
      render();
      await saveNow(`刪咗 section：${s.title || "未命名"}`);
    }));
    wireSimpleDrag($("#usecorder"), ".usec", "[data-usecdrag]",
      (from, to) => reorderCustomSections(state.snapshot, from, to));
    document.querySelectorAll("[data-secrefresh]").forEach(btn => btn.addEventListener("click", async () => {
      if (btn.disabled) return;
      const i = +btn.dataset.secrefresh;
      const s = (state.snapshot.sections || [])[i];
      if (!s) return;
      const topic = s.topic || s.title;
      if (!topic) return;
      const origText = btn.textContent;
      btn.disabled = true; btn.textContent = "AI 更新緊…";
      try {
        const r = await callAi({ action:"make-section", topic, itinerary: state.snapshot });
        if (!r || r.ok === false || !r.section){
          flash((r && r.message) || "AI 冇回覆到，試多次？");
          btn.disabled = false; btn.textContent = origText;
          return;
        }
        // keep icon/title/topic as the user has them — refresh is about the
        // CONTENT going stale, not about undoing a rename
        s.sub = r.section.sub || ""; s.lines = r.section.lines || []; s.links = r.section.links || [];
        render();
        await saveNow(`AI 更新咗「${s.title}」嘅資料`);
        flash(`已經更新「${s.title}」`);
      } catch (e){
        flash("出咗問題：" + e.message);
        btn.disabled = false; btn.textContent = origText;
      }
    }));
  }

  function wireOverview(){
    document.querySelectorAll(".board-row[data-go]").forEach(b => b.addEventListener("click", () => {
      state.view = b.dataset.go;
      window.scrollTo({ top: 0, behavior: "auto" });
      render();
    }));
    document.querySelectorAll("[data-editsec]").forEach(b => b.addEventListener("click", e => {
      e.stopPropagation();
      const open = HOME_EDITORS[b.dataset.editsec];
      if (open) open();
    }));
    document.querySelectorAll("[data-delsec]").forEach(b => b.addEventListener("click", e => {
      e.stopPropagation();
      hideSection(b.dataset.delsec, b.dataset.seclabel);
    }));
    document.querySelectorAll("[data-unhidesec]").forEach(b => b.addEventListener("click", () => {
      const key = b.dataset.unhidesec;
      unhideSection(key, HIDDEN_SECTION_LABELS[key] || key);
    }));
    wireCustomSections();
    wireLiveChecks();
    wireAiRefreshToggles();
    wireSimpleDrag($("#hsorder"), ".hsblock", "[data-hsdrag]",
      (from, to) => reorderHomeBlocks(state.snapshot, from, to));
    const ex = $("#btn-export");
    if (ex) ex.addEventListener("click", openExportSheet);
    initOverviewMap();
  }

  // ==================================================================
  // RENDER — one day
  // ==================================================================
  function dayHtml(day){
    if (!day) return `<p class="loading">搵唔到呢一日。</p>`;
    const lc = DAY_COLORS[day.id] || "var(--d1)";
    const units = toUnits(day.items);
    const mapOpen = !state.mapsShut.has(day.id);
    const sel = inSelectMode(day) ? state.selectMode : null;
    const firstStop = firstStopUnit(units);
    const stopNums = dayStopNumbers(day);

    return `
      <section class="dayhead" style="--lc:${lc}">
        <div class="kicker">
          <span class="dno">Day ${day.id.replace('day','')}</span>
          <span class="kline"></span>
          <span class="date">${esc(day.date)}</span>
        </div>
        <h2>${esc(day.title)}<button class="secedit" id="dayedit" title="改呢日嘅名／簡介／tag" aria-label="改呢日資料">✏️</button></h2>
        <p class="intro">${esc(day.desc)}</p>
        <div class="chiprow">${(day.badges||[]).map(b=>`<span class="${esc(b.cls)}">${esc(b.text)}</span>`).join("")}</div>
        ${(() => {
          // which hotel this day belongs to, so a multi-hotel trip is obvious
          // on the day you actually need it rather than only on the home page
          const st = stayForDay(state.snapshot, day);
          return st && st.name ? `<div class="daystay">🏨 呢晚住：<b>${esc(st.name)}</b></div>` : "";
        })()}
        ${hasMappableDay(day) ? `
          <button class="maptoggle" id="maptoggle" aria-expanded="${mapOpen}">
            <span>🗺</span><span>${mapOpen ? "收埋地圖" : "睇呢日地圖"}</span><span class="chev">▾</span>
          </button>
          ${mapOpen ? `<div class="mapbox" id="map-${day.id}" data-points='${esc(JSON.stringify(buildDayMapPoints(day)))}'></div>
                       ${mapNoteHtml(day)}
                       <p class="mapcap">${esc(day.mapCap||"")}</p>` : ""}
        ` : ""}
        ${sel ? "" : `
          <button class="btn wide dayai" id="dayai" style="margin-top:11px;">✨ AI 諗行程</button>
          <button class="btn wide" id="swapday" style="margin-top:8px;">🔄 同另一日成日對調</button>
        `}
      </section>

      <div class="line" id="line" style="--lc:${lc}">
        ${units.map((u,i) =>
          // a ＋ in every gap, so "between these two places" is a place you can
          // point at rather than something you fake by adding at the end and dragging
          (sel ? "" : insertRowHtml(i)) + unitHtml(day, u, i, units.length, sel, firstStop, stopNums)
        ).join("")}
      </div>
      ${units.length ? "" : `<p class="hint">呢日仲係空白嘅。自己加地點，或者撳下面嘅 ✨ 叫 AI 由早到晚幫你砌一日（佢會避開其他日子已經去緊嘅地方）。</p>`}

      ${sel ? `
        <div class="selectbar">
          <span>已選 ${sel.selected.size} 個</span>
          <button class="btn" id="selcancel">取消</button>
          <button class="btn primary" id="selmove" ${sel.selected.size ? "" : "disabled"}>搬去邊度</button>
        </div>
      ` : `
        <button class="addstop" id="addstop">＋ 喺最後加地點或者 note</button>
        ${units.length ? `<button class="btn wide" id="selstart" style="margin-top:8px;">☑️ 揀幾個一齊搬去第度</button>` : ""}
        ${units.length > 1 ? `<button class="recalc" id="recalc" data-stale="${staleCount(units) ? 1 : 0}">${
          staleCount(units)
            ? `↻ 重算全日交通（有 ${staleCount(units)} 段待確認）`
            : `↻ 重算全日交通`
        }</button>` : ""}
        ${ratableCount(units.map(u => u.stop).filter(Boolean)) ? `<button class="recalc" id="getratings">★ 攞 Google 評分／營業時間（${ratableCount(units.map(u => u.stop).filter(Boolean))} 個地點未有）</button>` : ""}
      `}

      <footer>
        <div class="fbrand">Day ${day.id.replace('day','')} · ${esc(day.title)}</div>
        撳一下卡片就可以改；改完會自動儲存，唔使撳掣。<br>
        想喺兩個地方之間插個地點或者 note，撳條線上面嘅 ＋。<br>
        想搬位就用卡片右上角嘅 ⠿ 拉上拉落，或者用「搬去第幾日」。
      </footer>
    `;
  }

  // how many legs are flagged as needing a fresh answer from Google
  function staleCount(units){
    return units.filter((u,i) => i > 0 && u.stop && u.seg && u.seg.stale).length;
  }
  // real places still missing a Google rating (logistics rows never count)
  function ratableCount(stops){
    return stops.filter(s => !Number.isFinite(s.rating) && !s.noRating && (s.placeId || s.mapUrl) && plain(s.title)).length;
  }

  // a ＋ sitting on the route line, so any gap between two places is somewhere
  // you can tap directly instead of adding at the end and dragging into place
  function insertRowHtml(pos){
    return `<button class="insertrow" data-insert="${pos}" aria-label="喺呢度加地點或者 note"><span class="ins-plus">＋</span></button>`;
  }

  function unitHtml(day, u, i, total, sel, firstStop, stopNums){
    const key = day.id + ":" + i;
    const open = state.open.has(key);
    const s = u.stop;
    const selecting = !!sel;
    const checked = selecting && sel.selected.has(i);

    if (u.note){
      const txt = plain(u.note.text);
      return `
        <div class="unit" data-i="${i}">
          <div class="stop">
            <div class="stop-rail"><span class="node note"></span></div>
            <div class="notecard${open ? " open" : ""}">
              <div class="notemain">
                <span class="noteicon">📝</span>
                <div class="notetext${txt ? "" : " empty"}">${txt ? esc(txt) : "撳 ✏️ 寫低你想記住嘅嘢…"}</div>
              </div>
              ${selecting ? "" : `
              <div class="cardtools">
                <button class="editbtn" data-open="${key}" title="${open ? "完成編輯" : "編輯"}">${open ? "✓" : "✏️"}</button>
                <div class="draghandle" data-drag="${i}" title="拉上拉落搬位">⠿</div>
              </div>`}
              ${!selecting && open ? noteEditorHtml(u.note, i) : ""}
            </div>
          </div>
        </div>`;
    }

    const showSeg = u.seg && i !== firstStop;
    const segBody = !showSeg ? "" :
      u.seg.checking ? `<span class="seg-note">計緊交通時間…</span>` :
      u.seg.stale    ? `<span class="seg-note warn">⚠️ 次序改咗，交通時間要再確認${state.transitProblem ? `<br><span class="seg-why">${esc(state.transitProblem)}</span>` : ""}</span>` :
      u.seg.html + (u.seg.route ? `<span class="seg-route">${esc(u.seg.route)}</span>` : "");
    // one segment, one button — refreshing all of a day's legs to update just
    // one used to burn a Google Directions call per leg every time
    const segRefresh = showSeg && !u.seg.checking
      ? `<button class="segrefresh" data-segrefresh="${i}" title="淨係重新check呢一段交通" aria-label="重新check呢一段交通">↻</button>` : "";
    const segHtml = showSeg ? `
      <div class="seg${u.seg.stale ? " stale" : ""}" data-mode="${u.seg.stale ? "other" : segMode(u.seg.html)}">
        <div class="seg-rail"></div>
        <div class="seg-text">${segBody}${segRefresh}</div>
      </div>` : "";

    if (!s) return `<div class="unit" data-i="${i}">${segHtml}</div>`;

    const named = plain(s.title);
    // no picture yet, but it is a real place (we have a map link or a Google id)
    // -> offer a one-tap fetch instead of leaving the row bare
    const fetchable = !s.photoUrl && !s.noPhoto && (s.placeId || s.mapUrl);
    const thumb = s.photoUrl
      ? `<div class="thumb"><img src="${esc(s.photoUrl)}" alt="" loading="lazy"></div>`
      : fetchable
        ? `<div class="thumb ghost" data-getphoto="${i}" title="搵張相">📷<small>搵張相</small></div>`
        : "";

    const closedToday = stopClosedOnDay(s, day);
    const chips = []
      .concat((s.niecepick||[]).map(n=>`<span class="niecepick">${esc(n)}</span>`))
      .concat(closedToday ? [`<span class="meta-chip closed">⚠️ 呢度星期${esc(weekdayCharOfDate(day.date))}公休，同排定嘅日子撞埋咗</span>`] : [])
      .concat(ratingChip(s) ? [ratingChip(s)] : [])
      // the hand-written "⭐ 4.3" chips predate live ratings; drop them once
      // Google's own number is on the card so the two can't contradict
      .concat((s.eatMeta||[]).filter(c => !(Number.isFinite(s.rating) && /^⭐/.test(c.text||""))).map(c=>`<span class="${esc(c.cls)}">${esc(c.text)}</span>`))
      .concat((s.accessBadges||[]).map(b=>`<span class="${esc(b.cls)}">${esc(b.text)}</span>`))
      .join("");

    // quick outbound links — only for stops that are a real, named place
    // (logistics rows like "酒店出發" have no mapUrl and get none of this)
    const links = [];
    if (s.mapUrl) links.push(`<a class="maplink" href="${esc(s.mapUrl)}" target="_blank" rel="noopener">📍 Naver Map</a>`);
    if (s.mapUrl){
      const gr = googleReviewsUrl(s), gs = googleSearchUrl(s);
      if (gr) links.push(`<a class="maplink" href="${esc(gr)}" target="_blank" rel="noopener">⭐ Google 評論</a>`);
      if (gs) links.push(`<a class="maplink" href="${esc(gs)}" target="_blank" rel="noopener">🔍 Google 搜尋</a>`);
    }

    return `
      <div class="unit" data-i="${i}">
        ${segHtml}
        <div class="stop">
          <div class="stop-rail"><span class="node${stopNums && stopNums.has(i) ? " numbered" : ""}" data-type="${esc(s.type||'normal')}">${stopNums && stopNums.has(i) ? stopNums.get(i) : ""}</span></div>
          <div class="stopcard${open ? " open" : ""}${selecting ? " selecting" : ""}${checked ? " checked" : ""}">
            <div class="stopmain"${selecting ? ` data-select="${i}"` : ""}>
              ${selecting ? `<span class="selbox">${checked ? "☑️" : "⬜"}</span>` : ""}
              ${thumb}
              <div class="stopbody">
                <div class="stopname ${named ? "" : "unnamed"}">${named ? esc(named) : "未改名嘅地點"}${s.kr ? `<span class="kr">${esc(plain(s.kr))}</span>` : ""}</div>
                ${s.desc ? `<div class="stopdesc">${esc(s.desc)}</div>` : ""}
                ${chips ? `<div class="chiprow">${chips}</div>` : ""}
              </div>
            </div>
            ${selecting ? "" : `
            <div class="cardtools">
              <button class="editbtn" data-open="${key}" title="${open ? "完成編輯" : "編輯"}">${open ? "✓" : "✏️"}</button>
              <div class="draghandle" data-drag="${i}" title="拉上拉落搬位">⠿</div>
            </div>`}
            ${s.eatboxHtml ? `<div class="eatbox">${s.eatboxHtml}</div>` : ""}
            ${s.tip ? `<div class="tipbox">${esc(s.tip)}</div>` : ""}
            ${bookingBoxHtml(s)}
            ${links.length ? `<div class="stopfoot">${links.join("")}</div>` : ""}
            ${!selecting && open ? editorHtml(day, u, i, total) : ""}
          </div>
        </div>
      </div>`;
  }

  function noteEditorHtml(note, i){
    return `
      <div class="editor" data-noteeditor="${i}">
        <div class="field">
          <label>Note</label>
          <textarea class="textarea" data-nf="text" placeholder="例如：買定 T-money／呢度落車行 5 分鐘／記得訂位">${esc(note.text || "")}</textarea>
        </div>
        <div class="editor-tools">
          <button class="btn danger" data-nact="remove">刪走</button>
          <button class="btn primary" data-nact="close">完成</button>
        </div>
      </div>`;
  }

  function editorHtml(day, u, i, total){
    const s = u.stop;
    return `
      <div class="editor" data-editor="${i}">
        <div class="field">
          <label>名 — 打字會搵返 Google 地圖真實地點</label>
          <input class="input" data-f="title" value="${esc(plain(s.title))}" placeholder="例如：南山谷韓屋村" autocomplete="off">
          <div class="suggest" data-suggest></div>
        </div>
        <div class="row2">
          <div class="field"><label>時間（唔一定要填）</label><input class="input" data-f="time" value="${esc(s.time)}" placeholder="約 14:00"></div>
          <div class="field"><label>類型</label>
            <select class="select" data-f="type">
              <option value="normal" ${s.type==="normal"?"selected":""}>景點</option>
              <option value="eat" ${s.type==="eat"?"selected":""}>餐飲</option>
              <option value="rest" ${s.type==="rest"?"selected":""}>休息</option>
            </select>
          </div>
        </div>
        <div class="field"><label>韓文名</label><input class="input" data-f="kr" value="${esc(s.kr)}" placeholder="남산골한옥마을"></div>
        <div class="field"><label>描述</label><textarea class="textarea" data-f="desc" placeholder="想記低嘅嘢…">${esc(s.desc)}</textarea></div>

        <div class="field">
          <label>相片</label>
          <div data-photos>
            <button class="btn wide" data-act="findphoto">${s.photoUrl ? "換張相" : "搵返呢度嘅相"}</button>
          </div>
        </div>

        <div class="editor-tools">
          <button class="btn" data-act="move">搬去邊度</button>
          <button class="btn" data-act="up" ${i===0?"disabled":""}>⬆ 上</button>
          <button class="btn" data-act="down" ${i===total-1?"disabled":""}>⬇ 落</button>
          <button class="btn danger" data-act="remove">刪走</button>
          <button class="btn primary" data-act="close">完成</button>
        </div>
      </div>`;

  // toggling which card is expanded — shared by the day view and every
  // bookmark board, so opening one always closes whatever else was open
  function wireOpenToggles(){
    document.querySelectorAll("[data-open]").forEach(btn => btn.addEventListener("click", () => {
      const key = btn.dataset.open;
      if (state.open.has(key)) state.open.delete(key); else { state.open.clear(); state.open.add(key); }
      render();
      if (state.open.has(key)){
        const el = document.querySelector(`[data-editor], [data-boardeditor], [data-noteeditor]`);
        if (el) el.scrollIntoView({ block:"nearest", behavior:"smooth" });
      }
    }));
  }

  // ==================================================================
  // WIRING — one day
  // ==================================================================
  function wireDay(day){
    const line = $("#line");

    const toggle = $("#maptoggle");
    if (toggle) toggle.addEventListener("click", () => {
      if (state.mapsShut.has(day.id)) state.mapsShut.delete(day.id); else state.mapsShut.add(day.id);
      render();
    });
    if (!state.mapsShut.has(day.id)) initDayMap(day);
    autoGeocodeDay(day);          // fire-and-forget; it re-renders as it fills in

    wireOpenToggles();

    const dayEdit = $("#dayedit");
    if (dayEdit) dayEdit.addEventListener("click", e => { e.stopPropagation(); openDayInfoEditSheet(day); });

    // same picker as the in-between ＋, so every position — including the very
    // end — can take either a place or a note
    const addBtn = $("#addstop");
    if (addBtn) addBtn.addEventListener("click", () => openInsertSheet(day, toUnits(day.items).length));

    const dayAi = $("#dayai");
    if (dayAi) dayAi.addEventListener("click", () => openDayAiSheet(day));

    const swapDayBtn = $("#swapday");
    if (swapDayBtn) swapDayBtn.addEventListener("click", () => openDaySwapPicker(day));

    // ---------- 選幾個地點一齊搬 ----------
    const selStart = $("#selstart");
    if (selStart) selStart.addEventListener("click", () => {
      state.selectMode = { dayId: day.id, selected: new Set() };
      render();
    });
    const selCancel = $("#selcancel");
    if (selCancel) selCancel.addEventListener("click", () => { state.selectMode = null; render(); });
    const selMove = $("#selmove");
    if (selMove) selMove.addEventListener("click", () => {
      if (!state.selectMode || !state.selectMode.selected.size) return;
      openMultiMovePicker(day, [...state.selectMode.selected]);
    });
    if (inSelectMode(day)){
      document.querySelectorAll("[data-select]").forEach(el => el.addEventListener("click", () => {
        const idx = +el.dataset.select;
        const sel = state.selectMode.selected;
        if (sel.has(idx)) sel.delete(idx); else sel.add(idx);
        render();
      }));
    }

    // 📷 placeholder on a photo-less stop: fetch one picture, no picker
    document.querySelectorAll("[data-getphoto]").forEach(el => el.addEventListener("click", async ev => {
      ev.preventDefault();
      ev.stopPropagation();          // sits inside the card button; don't open the editor
      if (el.dataset.busy) return;
      el.dataset.busy = "1";
      el.innerHTML = "⏳";
      const s = toUnits(day.items)[+el.dataset.getphoto].stop;
      const name = plain(s.kr) || plain(s.title);
      let got = false;
      try {
        const r = await callAi(s.placeId ? { action:"place-photo", placeId:s.placeId }
                                         : { action:"place-photo", query:name });
        if (r && r.ok !== false && r.photos && r.photos.length){ s.photoUrl = r.photos[0]; got = true; }
      } catch (_){}
      if (!got) s.noPhoto = true;    // don't keep offering a button that finds nothing
      render();
      if (got) saveNow(`搵咗張相俾「${name}」`);
    }));

    document.querySelectorAll("[data-segrefresh]").forEach(btn => btn.addEventListener("click", async e => {
      e.stopPropagation();
      const i = +btn.dataset.segrefresh;
      state.transitProblem = "";
      await refreshTransit(day, [i]);
    }));

    const recalc = $("#recalc");
    if (recalc) recalc.addEventListener("click", async () => {
      recalc.disabled = true;
      recalc.textContent = "問緊 Google…";
      const units = toUnits(day.items);
      const stale = units.map((u,i) => i).filter(i => i > 0 && units[i].stop && units[i].seg && units[i].seg.stale);
      // if nothing is flagged, redo the whole day rather than doing nothing
      const todo = stale.length ? stale : units.map((u,i) => i).filter(i => i > 0 && units[i].stop);
      state.transitProblem = "";
      await refreshTransit(day, todo);
    });

    const getratings = $("#getratings");
    if (getratings) getratings.addEventListener("click", async () => {
      getratings.disabled = true;
      getratings.textContent = "問緊 Google…";
      const stops = toUnits(day.items).map(u => u.stop).filter(Boolean);
      const { done, why } = await fetchRatings(stops, day.title);
      const btn = $("#getratings");
      if (btn && !done) btn.textContent = why ? "攞唔到：" + why : "呢一日冇再攞到新評分";
    });

    // manual retry — clears the "已試過" marks so a transient failure (quota,
    // network) can be attempted again rather than being remembered as "Google
    // doesn't know this place"
    const getmappoints = $("#getmappoints");
    if (getmappoints) getmappoints.addEventListener("click", () => {
      const stops = toUnits(day.items).map(u => u.stop).filter(Boolean);
      stops.forEach(s => { delete s.noGeo; if (state.geoTried) state.geoTried.delete(s); });
      state.geoProblem = "";
      autoGeocodeDay(day);
    });

    document.querySelectorAll("[data-insert]").forEach(btn =>
      btn.addEventListener("click", () => openInsertSheet(day, +btn.dataset.insert)));

    wireEditor(day);
    wireNoteEditor(day);
    wireDrag(day, line);
  }

  // ---------- insert a place or a note at an exact spot ----------
  async function insertAt(day, pos, what){
    const units = toUnits(day.items);
    const at = Math.max(0, Math.min(pos, units.length));
    if (what === "note"){
      units.splice(at, 0, { seg:null, stop:null, note: blankNote() });
    } else {
      // a place dropped into the middle invalidates the leg into it AND the leg
      // into whatever now follows; flag both rather than showing stale numbers.
      // No lookup yet — it has no name to look up until they type one.
      units.splice(at, 0, { seg:{ kind:"connector", html:"", stale:true }, stop: blankStop() });
      const after = units[at + 1];
      if (after && after.stop && after.seg) after.seg = Object.assign({}, after.seg, { stale:true });
    }
    day.items = fromUnits(units);
    syncMapPoints(day);
    state.open.clear();
    state.open.add(day.id + ":" + at);
    render();
    const inp = document.querySelector('[data-editor] [data-f="title"], [data-noteeditor] [data-nf="text"]');
    if (inp){ inp.focus(); inp.scrollIntoView({ block:"center", behavior:"smooth" }); }
    await saveNow(what === "note" ? "加咗一個 note" : "加咗一個新地點");
  }

  function openInsertSheet(day, pos){
    const units = toUnits(day.items);
    const nameOf = u => u && u.stop ? (plain(u.stop.title) || "未改名嘅地點") : (u && u.note ? "一個 note" : "");
    const before = nameOf(units[pos - 1]), after = nameOf(units[pos]);
    const where = before && after ? `插喺「${before}」同「${after}」之間`
                : before          ? `加喺「${before}」後面`
                : after           ? `加喺「${after}」前面`
                : "加落呢一日";
    openSheet(`
      <h3>加啲咩落呢度？</h3>
      <p class="sec-sub">${esc(where)}。</p>
      <button class="btn wide primary" id="ins-place" style="margin-top:10px;">📍 加一個地點</button>
      <p class="sec-sub" style="margin:6px 0 0;">打名嗰陣會自動搵返 Google 地圖真實地點、評分同營業時間。</p>
      <button class="btn wide" id="ins-note" style="margin-top:14px;">📝 加一段 note</button>
      <p class="sec-sub" style="margin:6px 0 0;">寫低提自己嘅嘢（買定 T-money、記得訂位…），唔會當成一個景點，唔會上地圖。</p>
    `, sheet => {
      sheet.querySelector("#ins-place").addEventListener("click", () => { closeLayer(); insertAt(day, pos, "place"); });
      sheet.querySelector("#ins-note").addEventListener("click", () => { closeLayer(); insertAt(day, pos, "note"); });
    });
  }

  function wireNoteEditor(day){
    const box = document.querySelector("[data-noteeditor]");
    if (!box) return;
    const i = +box.dataset.noteeditor;
    const u = toUnits(day.items)[i];
    if (!u || !u.note) return;

    const ta = box.querySelector('[data-nf="text"]');
    if (ta) ta.addEventListener("input", () => {
      u.note.text = ta.value;
      const shown = box.closest(".notecard").querySelector(".notetext");
      if (shown){
        shown.textContent = ta.value.trim() || "撳 ✏️ 寫低你想記住嘅嘢…";
        shown.classList.toggle("empty", !ta.value.trim());
      }
      saveSoon("改咗一個 note");
    });

    box.querySelectorAll("[data-nact]").forEach(btn => btn.addEventListener("click", async () => {
      if (btn.dataset.nact === "close"){ state.open.clear(); render(); return; }
      if (btn.dataset.nact === "remove"){
        if (!confirm("刪走呢個 note？")) return;
        const units = toUnits(day.items);
        units.splice(i, 1);
        day.items = fromUnits(units);
        state.open.clear();
        render();
        await saveNow("刪走咗一個 note");
      }
    }));
  }

  function wireEditor(day){
    const box = document.querySelector("[data-editor]");
    if (!box) return;
    const i = +box.dataset.editor;
    const units = toUnits(day.items);
    const u = units[i];
    const s = u.stop;

    // plain field edits
    box.querySelectorAll("[data-f]").forEach(el => {
      const evt = el.tagName === "SELECT" ? "change" : "input";
      el.addEventListener(evt, () => {
        s[el.dataset.f] = el.value;
        if (el.dataset.f === "type" || el.dataset.f === "title"){
          const nameEl = box.closest(".stopcard").querySelector(".stopname");
          if (el.dataset.f === "title" && nameEl){
            nameEl.textContent = el.value.trim() || "未改名嘅地點";
            nameEl.classList.toggle("unnamed", !el.value.trim());
          }
          if (el.dataset.f === "type"){
            const node = box.closest(".stop").querySelector(".node");
            if (node) node.dataset.type = el.value;
          }
        }
        saveSoon("改咗「" + (s.title || "一個地點") + "」");
      });
    });

    // google place autocomplete on the name field
    const titleInput = box.querySelector('[data-f="title"]');
    const sugBox = box.querySelector("[data-suggest]");
    let sugTimer = null;
    titleInput.addEventListener("input", () => {
      clearTimeout(sugTimer);
      const q = titleInput.value.trim();
      if (q.length < 2){ sugBox.innerHTML = ""; return; }
      sugTimer = setTimeout(async () => {
        sugBox.innerHTML = `<p class="hint">搵緊…</p>`;
        try {
          const r = await callAi({ action:"place-search", query:q });
          if (r.ok === false){ sugBox.innerHTML = `<p class="hint">${esc(r.message)}</p>`; return; }
          if (!r.places || !r.places.length){ sugBox.innerHTML = `<p class="hint">搵唔到，照用你打嘅名就得。</p>`; return; }
          sugBox.innerHTML = r.places.map((p,ix)=>`
            <button class="suggest-item" data-p="${ix}">
              <div class="n">${esc(p.name)}</div><div class="a">${esc(p.address)}</div>
            </button>`).join("");
          sugBox.querySelectorAll("[data-p]").forEach(b => b.addEventListener("click", async () => {
            const p = r.places[+b.dataset.p];
            s.title = p.name; s.placeId = p.placeId;
            if (Number.isFinite(p.lat)) s.lat = p.lat;
            if (Number.isFinite(p.lng)) s.lng = p.lng;
            // text search already returned these for free — no reason to make
            // the user press the separate "攞評分" button for a place they
            // just picked off Google themselves
            if (Number.isFinite(p.rating)) s.rating = p.rating;
            if (Number.isFinite(p.ratingCount)) s.ratingCount = p.ratingCount;
            s.mapUrl = `https://map.naver.com/p/search/${encodeURIComponent(p.name)}`;
            titleInput.value = p.name;
            sugBox.innerHTML = `<p class="hint">已揀「${esc(p.name)}」，搵緊相同營業時間…</p>`;
            await Promise.all([enrichHours(s), enrichPhoto(s, p.name)]);
            await saveNow("加咗「" + s.title + "」");
            render();
          }));
        } catch (e){ sugBox.innerHTML = `<p class="hint">搵唔到：${esc(e.message)}</p>`; }
      }, 420);
    });

    // actions
    box.querySelectorAll("[data-act]").forEach(btn => btn.addEventListener("click", async () => {
      const act = btn.dataset.act;

      if (act === "close"){ state.open.clear(); render(); return; }

      if (act === "remove"){
        if (!confirm("刪走「" + (s.title || "呢個地點") + "」？")) return;
        units.splice(i,1);
        day.items = fromUnits(units);
        syncMapPoints(day);
        state.open.clear();
        render();
        await saveNow("刪走咗「" + (s.title || "一個地點") + "」");
        refreshTransit(day, [i]);          // the stop that closed the gap
        return;
      }

      if (act === "up" || act === "down"){
        const j = act === "up" ? i-1 : i+1;
        if (j < 0 || j >= units.length) return;
        const tmp = units[i]; units[i] = units[j]; units[j] = tmp;
        day.items = fromUnits(units);
        state.open.clear(); state.open.add(day.id + ":" + j);
        render();
        await saveNow("調整咗次序");
        refreshTransit(day, [i, j, Math.max(i,j)+1]);
        return;
      }

      if (act === "move"){ openMovePicker({ kind:"day", day, index:i }); return; }

      if (act === "findphoto"){
        // first time: just take the top photo. only offer a choice when replacing one.
        const replacing = !!s.photoUrl;
        const holder = box.querySelector("[data-photos]");
        holder.innerHTML = `<p class="hint">搵緊相…</p>`;
        try {
          const payload = s.placeId ? { action:"place-photo", placeId:s.placeId }
                                    : { action:"place-photo", query:(s.kr || s.title) };
          const r = await callAi(payload);
          if (r.ok === false){ holder.innerHTML = `<p class="hint">${esc(r.message)}</p>`; return; }
          if (!r.photos || !r.photos.length){ holder.innerHTML = `<p class="hint">搵唔到呢度嘅相。</p>`; return; }
          if (!replacing){
            s.photoUrl = r.photos[0];
            await saveNow("加咗「" + (s.title||"一個地點") + "」嘅相");
            render();
            return;
          }
          holder.innerHTML = `<div class="photogrid">${r.photos.map(u2=>`<img src="${esc(u2)}" data-u="${esc(u2)}" class="${u2===s.photoUrl?'on':''}" alt="">`).join("")}</div><p class="hint">撳一張就用嗰張。</p>`;
          holder.querySelectorAll("img").forEach(img => img.addEventListener("click", async () => {
            s.photoUrl = img.dataset.u;
            await saveNow("換咗「" + (s.title||"一個地點") + "」嘅相");
            render();
          }));
        } catch (e){ holder.innerHTML = `<p class="hint">搵唔到：${esc(e.message)}</p>`; }
      }
    }));
  }

  // ---------- move a stop to another day, or to/from a bookmark board ----------
  // source: { kind:"day", day, index } | { kind:"board", board, index }
  // Pulls several stops out of a day at once, keeping their original relative
  // order. Splicing must go highest-index-first so removing one doesn't shift
  // the position of the next one still waiting to be removed.
  function detachStops(day, indices){
    const units = toUnits(day.items);
    const sorted = [...indices].sort((a, b) => a - b);
    const moving = sorted.map(i => units[i].stop);
    [...sorted].sort((a, b) => b - a).forEach(i => units.splice(i, 1));
    day.items = fromUnits(units);
    syncMapPoints(day);
    return moving;
  }

  // Same destinations as the single-item move picker, but for a batch —
  // "同時移動幾個行程去另一日" was a real gap: only one stop could be relocated
  // at a time, so reshuffling a multi-stop chunk meant repeating the picker.
  function openMultiMovePicker(day, indices){
    const count = indices.length;
    const days = state.snapshot.days || [];
    const boards = state.snapshot.boards || [];
    openSheet(`
      <h3>搬去邊度？</h3>
      <p class="sec-sub">揀咗 ${count} 個地點，一齊搬過去，順序唔會變。</p>
      ${days.length ? `
        <p class="picker-label">行程日子</p>
        <div class="daypick">
          ${days.map(d => {
            const here = d.id === day.id;
            return `<button data-today="${d.id}" ${here ? "disabled" : ""} style="--lc:${DAY_COLORS[d.id]||'var(--d1)'}">
              <span class="bullet"></span>
              <span class="dcode">Day ${d.id.replace('day','')}</span>
              <span>${esc(d.title)}${here?"（而家喺度）":""}</span>
            </button>`;
          }).join("")}
        </div>` : ""}
      <p class="picker-label">心水清單</p>
      <div class="daypick">
        ${boards.map(b => `<button data-toboard="${b.id}" style="--lc:var(--bookmark)">
          <span class="bullet"></span><span class="dcode">📌</span><span>${esc(b.name)}</span>
        </button>`).join("")}
        <button data-newboard style="--lc:var(--bookmark)">
          <span class="bullet"></span><span class="dcode">＋</span><span>開個新清單</span>
        </button>
      </div>
    `, sheet => {
      sheet.querySelectorAll("[data-today]").forEach(b => b.addEventListener("click", async () => {
        const target = dayById(b.dataset.today);
        const moving = detachStops(day, indices);
        const tUnits = toUnits(target.items);
        const landedFrom = tUnits.length;
        moving.forEach(st => { st.kind = "stop"; tUnits.push({ seg:null, stop:st }); });
        target.items = fromUnits(tUnits);
        syncMapPoints(target);
        closeLayer();
        state.selectMode = null;
        state.open.clear();
        state.view = target.id;
        render();
        await saveNow(`搬咗 ${count} 個地點去 ${target.title}`);
        refreshTransit(target, Array.from({ length: moving.length }, (_, k) => landedFrom + k));
        refreshTransit(day, [Math.min(...indices)]);
      }));

      sheet.querySelectorAll("[data-toboard]").forEach(b => b.addEventListener("click", async () => {
        const target = boardById(b.dataset.toboard);
        const moving = detachStops(day, indices);
        moving.forEach(st => target.items.push(st));
        closeLayer();
        state.selectMode = null;
        state.open.clear();
        state.view = target.id;
        render();
        await saveNow(`搬咗 ${count} 個地點去清單「${target.name}」`);
      }));

      const newBoardBtn = sheet.querySelector("[data-newboard]");
      if (newBoardBtn) newBoardBtn.addEventListener("click", async () => {
        state.snapshot.boards = state.snapshot.boards || [];
        const b = newBoard(`清單 ${state.snapshot.boards.length + 1}`);
        state.snapshot.boards.push(b);
        const moving = detachStops(day, indices);
        moving.forEach(st => b.items.push(st));
        closeLayer();
        state.selectMode = null;
        state.open.clear();
        state.view = b.id;
        state.renamingBoard = b.id;
        render();
        await saveNow(`開咗個新清單「${b.name}」，${count} 個地點搬咗入去`);
      });
    });
  }

  function openMovePicker(source){
    const days = state.snapshot.days || [];
    const boards = state.snapshot.boards || [];
    const stop = source.kind === "day" ? toUnits(source.day.items)[source.index].stop : source.board.items[source.index];
    const name = plain(stop.title) || "呢個地點";

    // takes the stop out of wherever it currently lives, fixing up what's left behind
    function detach(){
      if (source.kind === "day"){
        const units = toUnits(source.day.items);
        const moving = units[source.index];
        units.splice(source.index, 1);
        source.day.items = fromUnits(units);
        return moving.stop;
      }
      const [moving] = source.board.items.splice(source.index, 1);
      return moving;
    }
    function afterDetach(){
      if (source.kind === "day"){ syncMapPoints(source.day); refreshTransit(source.day, [source.index]); }
    }

    openSheet(`
      <h3>搬去邊度？</h3>
      <p class="sec-sub">「${esc(name)}」揀個新位置，之後隨時都可以再搬。</p>
      ${days.length ? `
        <p class="picker-label">行程日子</p>
        <div class="daypick">
          ${days.map(d => {
            const here = source.kind === "day" && source.day.id === d.id;
            return `<button data-today="${d.id}" ${here?"disabled":""} style="--lc:${DAY_COLORS[d.id]||'var(--d1)'}">
              <span class="bullet"></span>
              <span class="dcode">Day ${d.id.replace('day','')}</span>
              <span>${esc(d.title)}${here?"（而家喺度）":""}</span>
            </button>`;
          }).join("")}
        </div>` : ""}
      <p class="picker-label">心水清單</p>
      <div class="daypick">
        ${boards.map(b => {
          const here = source.kind === "board" && source.board.id === b.id;
          return `<button data-toboard="${b.id}" ${here?"disabled":""} style="--lc:var(--bookmark)">
            <span class="bullet"></span><span class="dcode">📌</span>
            <span>${esc(b.name)}${here?"（而家喺度）":""}</span>
          </button>`;
        }).join("")}
        <button data-newboard style="--lc:var(--bookmark)">
          <span class="bullet"></span><span class="dcode">＋</span><span>開個新清單</span>
        </button>
      </div>
    `, sheet => {
      sheet.querySelectorAll("[data-today]").forEach(b => b.addEventListener("click", async () => {
        const target = dayById(b.dataset.today);
        const movingStop = detach();
        movingStop.kind = "stop";
        const tUnits = toUnits(target.items);
        tUnits.push({ seg: null, stop: movingStop });
        target.items = fromUnits(tUnits);
        syncMapPoints(target);
        const landedAt = tUnits.length - 1;
        closeLayer();
        state.open.clear();
        state.view = target.id;
        render();
        await saveNow(`「${name}」搬咗去 ${target.title}`);
        afterDetach();
        refreshTransit(target, [landedAt]);
      }));

      sheet.querySelectorAll("[data-toboard]").forEach(b => b.addEventListener("click", async () => {
        const target = boardById(b.dataset.toboard);
        const movingStop = detach();
        target.items.push(movingStop);
        closeLayer();
        state.open.clear();
        state.view = target.id;
        render();
        await saveNow(`「${name}」搬咗去清單「${target.name}」`);
        afterDetach();
      }));

      const newBoardBtn = sheet.querySelector("[data-newboard]");
      if (newBoardBtn) newBoardBtn.addEventListener("click", async () => {
        state.snapshot.boards = state.snapshot.boards || [];
        const b = newBoard(`清單 ${state.snapshot.boards.length + 1}`);
        state.snapshot.boards.push(b);
        const movingStop = detach();
        b.items.push(movingStop);
        closeLayer();
        state.open.clear();
        state.view = b.id;
        state.renamingBoard = b.id;
        render();
        await saveNow(`開咗個新清單「${b.name}」，「${name}」搬咗入去`);
        afterDetach();
      });
    });
  }

  // A full day-to-day swap — unlike AI 諗行程 (which edits individual stops
  // and can leave the title mismatched, see dayTitleCardsHtml above), this
  // trades EVERYTHING a day's content is made of in one shot, so the result
  // is always internally consistent. `id`/`num`/`date` stay put (the slot on
  // the calendar doesn't move), only the content living in that slot does.
  // Items carry their own connector `seg` data, so segments between stops
  // stay correct automatically — the two days' internal sequencing never
  // touched each other, only which slot they're rendered under changed.
  function swapDayContent(a, b){
    const keys = ["title", "desc", "shortTag", "badges", "items", "mapPoints", "mapCap"];
    for (const k of keys){
      const tmp = a[k];
      a[k] = b[k];
      b[k] = tmp;
    }
    syncMapPoints(a);
    syncMapPoints(b);
  }

  function openDaySwapPicker(day){
    const days = (state.snapshot.days || []).filter(d => d.id !== day.id);
    openSheet(`
      <h3>同邊一日成日對調？</h3>
      <p class="sec-sub">會將 Day ${day.id.replace('day','')}（${esc(day.date)}）同揀嘅嗰日，成日內容（標題、簡介、全部地點）完全對調；日期同 Day 編號本身唔會變，淨係內容搬咗位。</p>
      <div class="daypick">
        ${days.map(d => `<button data-swapto="${d.id}" style="--lc:${DAY_COLORS[d.id]||'var(--d1)'}">
          <span class="bullet"></span>
          <span class="dcode">Day ${d.id.replace('day','')}</span>
          <span>${esc(d.date)} · ${esc(d.title)}</span>
        </button>`).join("")}
      </div>
    `, sheet => {
      sheet.querySelectorAll("[data-swapto]").forEach(b => b.addEventListener("click", async () => {
        const other = dayById(b.dataset.swapto);
        if (!other) return;
        const aNum = day.id.replace('day',''), bNum = other.id.replace('day','');
        swapDayContent(day, other);
        closeLayer();
        state.open.clear();
        render();
        await saveNow(`Day ${aNum} 同 Day ${bNum} 成日行程完全對調咗`);
      }));
    });
  }

  // Copy (not move) a bookmarked place into a day: the list keeps its copy so
  // the same place can go into several days, or stay parked for later. The
  // AI's suggested day is flagged rather than pre-selected — it's a hint, and
  // the list is still in trip order so nothing jumps around.
  function openCopyPicker(board, index){
    const item = board.items[index];
    if (!item) return;
    const name = plain(item.title) || "呢個地點";
    const days = state.snapshot.days || [];
    const suggested = item.suggestDayId && dayById(item.suggestDayId) ? item.suggestDayId : "";

    openSheet(`
      <h3>複製去邊一日？</h3>
      <p class="sec-sub">「${esc(name)}」會複製一份入去嗰日，清單度呢個仍然留低，之後仲可以再複製去第二日。</p>
      <div class="daypick">
        ${days.map(d => `
          <button data-copyday="${d.id}" style="--lc:${DAY_COLORS[d.id]||'var(--d1)'}">
            <span class="bullet"></span>
            <span class="dcode">Day ${d.id.replace('day','')}</span>
            <span>${esc(d.title)}${d.id === suggested ? ` <b class="sugg">⭐ AI 話呢日順路</b>` : ""}</span>
          </button>`).join("")}
      </div>
    `, sheet => {
      sheet.querySelectorAll("[data-copyday]").forEach(b => b.addEventListener("click", async () => {
        const day = dayById(b.dataset.copyday);
        if (!day) return;
        const copy = Object.assign(blankStop(), JSON.parse(JSON.stringify(item)), { kind:"stop" });
        delete copy.aiRun;            // the badge belongs to the bookmark list, not the itinerary
        delete copy.suggestDayId;
        const units = toUnits(day.items);
        units.push({ seg: null, stop: copy });
        day.items = fromUnits(units);
        syncMapPoints(day);
        const landedAt = units.length - 1;
        closeLayer();
        render();
        await saveNow(`「${name}」複製咗去 ${day.title}（清單度都仲留低）`);
        refreshTransit(day, [landedAt]);
      }));
    });
  }

  // Shown when the snapshot predates these fields, and used as the placeholder
  // in the editor so it's obvious what "leave it blank" gives you.
  const DEFAULT_TRIP_BRIEF =
    "你係一個廣東話（香港口語）旅遊助理，幫緊一個7人家庭（爸爸/媽媽/呀哥/姨姨/表妹/男友/我）10月23-28日去首爾。姨姨唔可以行樓梯，主題係賞紅葉銀杏。";
  const DEFAULT_EYEBROW = "10.23 — 10.28 · 2026";
  const DEFAULT_FACTS = ["7 位家庭成員", "6 日 5 夜", "賞楓銀杏"];

  // ---------- editing the home page ----------
  // One generic sheet drives every section editor, so adding a field is a line
  // of config rather than another bespoke form. Types:
  //   text / textarea — a single value
  //   lines           — a list, one entry per line (far easier to edit on a
  //                     phone than a repeatable row widget, and it round-trips)
  // A day's own title/intro/tags used to be baked into the seed data with no
  // way to touch them — "更改行程所有嘢都可以 edit 包括嗰一日行程嘅名啊內容 tag"
  // asked for exactly this. Tags keep their colour variant round-trip safe by
  // encoding it as a leading marker the user can type themselves.
  function openDayInfoEditSheet(day){
    const badgeLines = (day.badges || []).map(b => {
      const cls = b.cls || "badge";
      const prefix = cls.includes("warn") ? "!" : cls.includes("note") ? "*" : "";
      return prefix + plain(b.text);
    }).join("\n");
    openEditSheet(`改「${day.title || "呢一日"}」`, "", [
      { key:"shortTag", label:"上面日子切換條嘅短標籤（例如「南怡島」）", type:"text",
        value: day.shortTag != null ? day.shortTag : (DAY_SHORT[day.id]||""), placeholder:"例如：南怡島" },
      { key:"title", label:"呢日標題", type:"text", value: day.title || "", placeholder:"例如：南怡島紅葉銀杏全日遊" },
      { key:"desc", label:"簡介", type:"textarea", rows:3, value: day.desc || "" },
      { key:"badges", label:"Tag（一行一個；開頭加 ! 會變黃色提醒，加 * 會變另一種底色）", type:"lines", rows:5,
        value: badgeLines },
    ], async out => {
      day.shortTag = out.shortTag || "";
      day.title = out.title || day.title;
      day.desc = out.desc || "";
      day.badges = (out.badges || []).map(line => {
        let cls = "badge", text = line;
        if (text.startsWith("!")){ cls = "badge warn"; text = text.slice(1).trim(); }
        else if (text.startsWith("*")){ cls = "badge note"; text = text.slice(1).trim(); }
        return { cls, text };
      });
      render();
      await saveNow(`改咗「${day.title}」嘅資料`);
    });
  }

  function openEditSheet(title, sub, fields, onSave){
    openSheet(`
      <h3>${esc(title)}</h3>
      ${sub ? `<p class="sec-sub">${esc(sub)}</p>` : ""}
      ${fields.map((f, i) => `
        <div class="field">
          <label>${esc(f.label)}</label>
          ${f.hint ? `<p class="fieldhint">${esc(f.hint)}</p>` : ""}
          ${f.type === "text"
            ? `<input class="input" data-ef="${i}" value="${esc(f.value || "")}" placeholder="${esc(f.placeholder || "")}">`
            : `<textarea class="textarea" data-ef="${i}" rows="${f.rows || 4}" placeholder="${esc(f.placeholder || "")}">${esc(f.value || "")}</textarea>`}
        </div>`).join("")}
      <div class="editor-tools">
        <button class="btn" data-ecancel>取消</button>
        <button class="btn primary" data-esave>儲存</button>
      </div>
    `, sheet => {
      sheet.querySelector("[data-ecancel]").addEventListener("click", closeLayer);
      sheet.querySelector("[data-esave]").addEventListener("click", async () => {
        const out = {};
        fields.forEach((f, i) => {
          const raw = sheet.querySelector(`[data-ef="${i}"]`).value;
          out[f.key] = f.type === "lines"
            ? raw.split("\n").map(x => x.trim()).filter(Boolean)
            : raw.trim();
        });
        closeLayer();
        await onSave(out);
      });
    });
  }

  // The clothing list is stored as HTML (the seed data uses <b> for emphasis).
  // Users edit plain text with **bold** instead, so nothing they type is ever
  // injected as markup — the only tag that can come back out is <b>.
  function htmlToPlainish(html){
    return String(html || "")
      .replace(/<\/?b>/gi, "**")
      .replace(/<br\s*\/?>/gi, " ")
      .replace(/<[^>]+>/g, "")
      .replace(/&amp;/g, "&").replace(/&lt;/g, "<").replace(/&gt;/g, ">").replace(/&quot;/g, '"')
      .trim();
  }
  function plainishToHtml(text){
    return esc(String(text || "").trim()).replace(/\*\*(.+?)\*\*/g, "<b>$1</b>");
  }

  // "icon | text" per line — compact enough to edit on a phone, and the icon
  // stays optional (a line with no pipe is just text).
  function pipeParts(line, n){
    const bits = String(line).split("|").map(x => x.trim());
    while (bits.length < n) bits.push("");
    return bits;
  }

  // Each home-page section maps to one entry here, so the pencil buttons are
  // wired generically and every save goes through the same version-history path
  // as any other edit.
  const HOME_EDITORS = {

        { key:"tripBrief", type:"textarea", rows:6,
          label:"背景設定",
          hint:"留空就會用返預設嗰段（7人家庭・10月23-28日首爾・姨姨唔行得樓梯・賞紅葉銀杏）。",
          value: briefText(d) || DEFAULT_TRIP_BRIEF,
          placeholder: DEFAULT_TRIP_BRIEF },

    hero: () => {

      openEditSheet("首頁大標題", "最頂嗰段，同AI用嚟搵地點／check天氣嘅目的地資料——呢頁重用去第二個trip嘅時候，淨係要改呢度，唔使改code。", [
        { key:"eyebrow", type:"text", label:"日期細字", value: m.eyebrow || DEFAULT_EYEBROW },

        { key:"facts", type:"lines", rows:3, label:"標題下面嘅小字", hint:"一行一項，會用「·」分隔顯示。",
          value: (m.facts && m.facts.length ? m.facts : DEFAULT_FACTS).join("\n") },
        { key:"hotelTags", type:"lines", rows:3, label:"標籤", hint:"一行一個。",
          value: (m.hotelTags || []).join("\n") },
        { key:"destinationLocal", type:"text", label:"目的地本地語言名（搜尋地點/計交通用）",

        { key:"lng", type:"text", label:"目的地經度（check實時天氣用）", value: m.lng != null ? String(m.lng) : "" },
        { key:"dateStart", type:"text", label:"行程開始日期", hint:"格式 YYYY-MM-DD，例如 2026-10-23。",
          value: m.dateStart || "" },
        { key:"dateEnd", type:"text", label:"行程結束日期", hint:"格式 YYYY-MM-DD。",
          value: m.dateEnd || "" },
      ], async out => {
        m.eyebrow = out.eyebrow; m.title = out.title;
        m.facts = out.facts; m.hotelTags = out.hotelTags;

    acc: () => openStaysSheet(),

    weather: () => {
      const d = state.snapshot;

        { key:"rows", type:"lines", rows:8, label:"日期 | 日高 | 晨低 | 概況",
          hint:"用「|」分開四格，例如：10/23 | 18° | 8° | 早晚涼，日間舒服",
          value: (d.weatherRows || []).map(r => [r.date, r.hi, r.lo, r.note].join(" | ")).join("\n") },
