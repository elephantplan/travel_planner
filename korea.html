        state.renamingBoard = b.id;
        render();
        await saveNow(`開咗個新清單「${b.name}」，「${name}」搬咗入去`);
        afterDetach();
      });
    });
  }

  // ---------- drag to reorder ----------
  function wireDrag(day, line){
    if (!line) return;
    let drag = null;
    let raf = null;

    // Everything is measured in page coordinates, not viewport ones, so the
    // drag keeps working while the page scrolls underneath it.
    function paint(){
      if (!drag || !drag.active) return;
      const pageY = drag.clientY + window.scrollY;
      drag.el.style.transform = `translateY(${pageY - drag.startPageY}px)`;

      let to = drag.from;
      for (let k = 0; k < drag.rects.length; k++){
        if (k === drag.from) continue;
        const mid = drag.rects[k].top + drag.rects[k].height / 2;
        if (k < drag.from && pageY < mid) to = Math.min(to, k);
        if (k > drag.from && pageY > mid) to = Math.max(to, k);
      }
      if (to !== drag.to){
        drag.to = to;
        const h = drag.rects[drag.from].height;
        drag.units.forEach((u,k) => {
          if (k === drag.from) return;
          u.classList.add("shifting");
          let shift = 0;
          if (drag.to < drag.from && k >= drag.to && k < drag.from) shift = h;
          if (drag.to > drag.from && k > drag.from && k <= drag.to) shift = -h;
          u.style.transform = shift ? `translateY(${shift}px)` : "";
        });
      }
    }

    // hold the card near the top or bottom edge and the page follows
    function tick(){
      if (!drag || !drag.active){ raf = null; return; }
      const edge = 110, vh = window.innerHeight, y = drag.clientY;
      let step = 0;
      if (y < edge) step = -Math.ceil((edge - y) / 5);
      else if (y > vh - edge) step = Math.ceil((y - (vh - edge)) / 5);
      if (step){
        const before = window.scrollY;
        window.scrollBy(0, Math.max(-28, Math.min(28, step)));
        if (window.scrollY !== before) paint();
      }
      raf = requestAnimationFrame(tick);
    }

    line.querySelectorAll("[data-drag]").forEach(handle => {
      handle.addEventListener("pointerdown", e => {
        e.preventDefault();
        const unitEl = handle.closest(".unit");
        const units = Array.from(line.querySelectorAll(".unit"));
        const sy = window.scrollY;
        drag = {
          el: unitEl,
          from: units.indexOf(unitEl),
          to: units.indexOf(unitEl),
          startPageY: e.clientY + sy,
          clientY: e.clientY,
          units,
          rects: units.map(u => { const r = u.getBoundingClientRect(); return { top: r.top + sy, height: r.height }; }),
          active: false,
          timer: setTimeout(() => {
            if (!drag) return;
            drag.active = true;
            unitEl.classList.add("lifted");
            if (navigator.vibrate) navigator.vibrate(12);
            if (!raf) raf = requestAnimationFrame(tick);
          }, 260)
        };
        handle.setPointerCapture(e.pointerId);
      });

      handle.addEventListener("pointermove", e => {
        if (!drag) return;
        if (!drag.active){
          // Moving before the hold timer fires used to CANCEL the drag, on the
          // theory the user meant to scroll. But the handle has
          // touch-action:none and captures the pointer, so it can never scroll
          // the page — pressing and moving straight away (the natural drag
          // gesture) just silently did nothing. Treat that move as the drag
          // starting instead; the timer stays for press-and-hold-still.
          if (Math.abs((e.clientY + window.scrollY) - drag.startPageY) > 6){
            clearTimeout(drag.timer);
            drag.active = true;
            drag.el.classList.add("lifted");
            if (!raf) raf = requestAnimationFrame(tick);
          } else {
            return;
          }
        }
        e.preventDefault();
        drag.clientY = e.clientY;
        paint();
      });

      const finish = () => {
        if (!drag) return;
        clearTimeout(drag.timer);
        if (raf){ cancelAnimationFrame(raf); raf = null; }
        const d = drag; drag = null;
        d.units.forEach(u => { u.style.transform = ""; u.classList.remove("shifting","lifted"); });
        if (!d.active || d.to === d.from) return;
        const units = toUnits(day.items);
        const [moved] = units.splice(d.from, 1);
        units.splice(d.to, 0, moved);
        day.items = fromUnits(units);
        syncMapPoints(day);
        state.open.clear();
        render();
        // follow the card to where it landed, so the drop is never off-screen
        const landed = line.querySelector(`.unit[data-i="${d.to}"]`);
        if (landed) landed.scrollIntoView({ block:"center", behavior:"smooth" });
        saveNow("調整咗次序").then(() =>
          refreshTransit(day, [d.to, d.to + 1, d.from, d.from + 1]));
      };
      handle.addEventListener("pointerup", finish);
      handle.addEventListener("pointercancel", finish);
    });
  }

  // ==================================================================
  // MAPS
  // ==================================================================
  // stored points are [lat, lng, name] tuples; the name often carries the
  // stop's own number ("1 Artist Bakery"), so use that rather than inventing one
  // day.mapPoints is a hand-authored [lat,lng,"N 地方名"] list, kept separate
  // from day.items so drag-reorder, cross-day moves, copies and removals never
  // touch it — which is exactly why the mini-map used to keep the OLD
  // order/numbering (or a stale pin for something already deleted) no matter
  // what happened to the actual timeline. This matches each numbered point
  // back to a stop by name and renumbers the points to follow the stops'
  // current order. A point that matches nothing anymore (its stop got
  // deleted) is dropped — a leftover pin for a place no longer on the day is
  // more wrong than losing one hand-authored coordinate.
  function syncMapPoints(day){
    const raw = Array.isArray(day.mapPoints) ? day.mapPoints : [];
    if (!raw.length) return;
    const stopTitles = toUnits(day.items).map(u => u.stop).filter(Boolean).map(s => loose(plain(s.title)));

    const parsed = raw.map(p => {
      const lat = Array.isArray(p) ? p[0] : p?.lat;
      const lng = Array.isArray(p) ? p[1] : p?.lng;
      const name = String((Array.isArray(p) ? p[2] : p?.name) || "");
      const m = name.match(/^\s*(\d+)\s+(.*)$/);
      return { lat, lng, label: m ? m[1] : "", text: m ? m[2] : name };
    });
    const numbered = parsed.filter(p => p.label);
    const anchors  = parsed.filter(p => !p.label);   // e.g. "酒店" — not a stop, keep up front
    if (!numbered.length) return;

    numbered.forEach(p => {
      const l = loose(p.text);
      let idx = stopTitles.findIndex(t => t === l);
      if (idx < 0) idx = stopTitles.findIndex(t => t && l && (t.includes(l) || l.includes(t)));
      p.order = idx;
    });
    const matched = numbered.filter(p => p.order >= 0).sort((a,b) => a.order - b.order);
    matched.forEach((p,i) => { p.label = String(i + 1); });

    day.mapPoints = [...anchors, ...matched].map(p => [p.lat, p.lng, `${p.label} ${p.text}`.trim()]);
  }

  // The single source of truth for what actually shows on a day's map. Older
  // content only ever has coordinates in the hand-authored day.mapPoints list
  // (curated once, a handful of points), while day.items keeps growing —
  // stops added since (via AI suggest, a board copy, or the autocomplete
  // search box) carry their OWN real lat/lng from enrichStop, but nothing
  // ever added them to that old list. Rendering straight from day.mapPoints
  // is why a day with many stops could show only the 3 it originally had.
  // This derives fresh from the CURRENT stops every render: prefer a stop's
  // own coordinate, fall back to a fuzzy name-match against the legacy list,
  // and report what still has neither so the UI can offer to look it up.
  function resolveDayMapPoints(day){
    const raw = Array.isArray(day.mapPoints) ? day.mapPoints : [];
    const parsed = raw.map(p => {
      const lat = Array.isArray(p) ? p[0] : p?.lat;
      const lng = Array.isArray(p) ? p[1] : p?.lng;
      const name = String((Array.isArray(p) ? p[2] : p?.name) || "");
      const m = name.match(/^\s*(\d+)\s+(.*)$/);
      return { lat: Number(lat), lng: Number(lng), label: m ? m[1] : "", text: m ? m[2] : name };
    }).filter(p => Number.isFinite(p.lat) && Number.isFinite(p.lng));
    const anchors = parsed.filter(p => !p.label);
    const legacy = parsed.filter(p => p.label);

    const findLegacy = title => {
      const l = loose(title);
      if (!l) return null;
      let hit = legacy.find(p => loose(p.text) === l);
      if (!hit) hit = legacy.find(p => { const t = loose(p.text); return t && (t.includes(l) || l.includes(t)); });
      return hit || null;
    };

    const points = [];
    const unresolved = [];
    let n = 0;
    toUnits(day.items).map(u => u.stop).filter(Boolean).forEach(s => {
      const title = plain(s.title);
      if (!title) return;
      let lat = s.lat, lng = s.lng;
      if (!(Number.isFinite(lat) && Number.isFinite(lng))){
        const hit = findLegacy(title);
        if (hit){ lat = hit.lat; lng = hit.lng; }
      }
      if (Number.isFinite(lat) && Number.isFinite(lng)){
        n++;
        points.push([lat, lng, `${n} ${title}`]);
      } else {
        unresolved.push(s);
      }
    });

    return { tuples: [...anchors.map(p => [p.lat, p.lng, p.text]), ...points], unresolved };
  }
  function buildDayMapPoints(day){ return resolveDayMapPoints(day).tuples; }
  function unmappedStops(day){ return resolveDayMapPoints(day).unresolved; }

  function normPoints(raw){
    if (!Array.isArray(raw)) return [];
    const pts = raw.map(p => {
      const lat = Array.isArray(p) ? p[0] : p?.lat;
      const lng = Array.isArray(p) ? p[1] : p?.lng;
      const name = String((Array.isArray(p) ? p[2] : p?.name) || "");
      const m = name.match(/^\s*(\d+)\s+(.*)$/);
      return {
        lat: Number(lat), lng: Number(lng),
        label: m ? m[1] : "",
        name: m ? m[2] : name
      };
    }).filter(p => Number.isFinite(p.lat) && Number.isFinite(p.lng));
    // The data numbers its own stops ("1 Artist Bakery"); anything without a
    // number is an anchor like the hotel and gets a plain dot, not a number,
    // so it can't collide with a real stop. If nothing is numbered, number them all.
    if (!pts.some(p => p.label)) pts.forEach((p,i) => { p.label = String(i+1); });
    return pts;
  }
  function mapIcon(color, label){
    if (!label) return L.divIcon({
      className:"", iconSize:[13,13], iconAnchor:[6.5,6.5],
      html:`<div class="mapnode plain" style="background:${color}"></div>`
    });
    return L.divIcon({
      className:"", iconSize:[22,22], iconAnchor:[11,11],
      html:`<div class="mapnode" style="background:${color}">${esc(label)}</div>`
    });
  }
  // a bookmarked list item, not a route stop — no polyline connects these, so
  // the pin shape has to read as "saved place" rather than "stop on a route"
  function boardPinIcon(color){
    return L.divIcon({
      className:"", iconSize:[20,20], iconAnchor:[10,20],
      html:`<div class="mapboardpin" style="background:${color}"><span>📌</span></div>`
    });
  }
  function initDayMap(day){
    const el = document.getElementById("map-" + day.id);
    if (!el) return;
    try {
      if (typeof L === "undefined"){ el.innerHTML = `<div class="mapfallback">地圖要有網絡先載入到。</div>`; return; }
      const pts = normPoints(buildDayMapPoints(day));
      if (!pts.length){ el.innerHTML = `<div class="mapfallback">呢日仲未有地圖座標。</div>`; return; }
      const map = L.map(el, { scrollWheelZoom:false, dragging:false, tap:false, zoomControl:false, attributionControl:false });
      L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png", { maxZoom:18 }).addTo(map);
      const color = DAY_HEX[day.id] || "#8A94A6";
      const latlngs = pts.map(p => [p.lat, p.lng]);
      L.polyline(latlngs, { color, weight:4, opacity:.85 }).addTo(map);
      pts.forEach(p => L.marker([p.lat,p.lng], { icon: mapIcon(color, p.label) }).addTo(map).bindPopup(p.name || ""));
      const fit = () => { map.invalidateSize(); map.fitBounds(L.latLngBounds(latlngs).pad(0.22)); };
      fit();
      requestAnimationFrame(fit);   // the box was just inserted; re-fit once it has its real size
      el.addEventListener("click", () => { map.dragging.enable(); map.scrollWheelZoom.enable(); }, { once:true });
    } catch (e){
      el.innerHTML = `<div class="mapfallback">地圖載入唔到：${esc(e.message)}</div>`;
    }
  }
  function initOverviewMap(){
    const el = document.getElementById("map-all");
    const legend = document.getElementById("map-legend");
    if (!el) return;
    try {
    if (typeof L === "undefined"){ el.innerHTML = `<div class="mapfallback">地圖要有網絡先載入到。</div>`; return; }
    const map = L.map(el, { scrollWheelZoom:false, dragging:false, tap:false, zoomControl:false, attributionControl:false });
    L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png", { maxZoom:18 }).addTo(map);
    const all = [];
    const layers = {};
    state.snapshot.days.forEach(day => {
      const pts = normPoints(buildDayMapPoints(day));
      if (!pts.length) return;
      const color = DAY_HEX[day.id] || "#8A94A6";
      const latlngs = pts.map(p => [p.lat,p.lng]);
      const g = L.layerGroup();
      L.polyline(latlngs, { color, weight:4, opacity:.8 }).addTo(g);
      pts.forEach(p => L.marker([p.lat,p.lng], { icon: mapIcon(color, p.label) }).bindPopup(p.name||"").addTo(g));
      g.addTo(map);
      layers[day.id] = g;
      all.push(...latlngs);
    });

    // bookmarked places, shown as standalone pins — never joined by a line,
    // since they aren't a route, just a shortlist someone saved for later
    const boardLayerKeys = [];
    (state.snapshot.boards || []).forEach(b => {
      const pts = (b.items || []).filter(it => Number.isFinite(it.lat) && Number.isFinite(it.lng));
      if (!pts.length) return;
      const color = b.color || "#6B6FD1";
      const g = L.layerGroup();
      pts.forEach(it => L.marker([it.lat, it.lng], { icon: boardPinIcon(color) }).bindPopup(esc(plain(it.title) || "")).addTo(g));
      g.addTo(map);
      const key = "board:" + b.id;
      layers[key] = g;
      boardLayerKeys.push({ key, board: b });
      all.push(...pts.map(it => [it.lat, it.lng]));
    });

    if (all.length){
      const fit = () => { map.invalidateSize(); map.fitBounds(L.latLngBounds(all).pad(0.14)); };
      fit();
      requestAnimationFrame(fit);   // the box was just inserted; re-fit once it has its real size
    }
    el.addEventListener("click", () => { map.dragging.enable(); map.scrollWheelZoom.enable(); }, { once:true });

    if (legend){
      const dayLegend = state.snapshot.days.filter(d => layers[d.id]).map(d =>
        `<button class="badge" data-layer="${d.id}" style="cursor:pointer;border-color:${DAY_HEX[d.id]};color:${DAY_HEX[d.id]}">● D${d.id.replace('day','')} ${esc(DAY_SHORT[d.id]||"")}</button>`
      ).join("");
      const boardLegend = boardLayerKeys.map(({key, board}) =>
        `<button class="badge" data-layer="${esc(key)}" style="cursor:pointer;border-color:${esc(board.color)};color:${esc(board.color)}">📌 ${esc(board.name)}</button>`
      ).join("");
      legend.innerHTML = dayLegend + boardLegend;
      legend.querySelectorAll("[data-layer]").forEach(b => b.addEventListener("click", () => {
        const g = layers[b.dataset.layer];
        if (map.hasLayer(g)){ map.removeLayer(g); b.style.opacity = ".35"; }
        else { g.addTo(map); b.style.opacity = "1"; }
      }));
    }
    } catch (e){
      el.innerHTML = `<div class="mapfallback">地圖載入唔到：${esc(e.message)}</div>`;
    }
  }

  // ==================================================================
  function boardHtml(board){

    return `

        </div>

        <button class="btn wide" id="boardpicks" style="margin-top:7px;">🏆 5 個 Google 高分 ＋ 🔥 5 個社交平台熱門</button>
        <div id="boardideas-out"></div>
      </section>

      <div class="line" id="boardline" style="--lc:var(--bookmark)">

      ${!board.items.length ? `<p class="hint">仲未有地點。撳下面「＋」自己加一個，或者去某一日嘅景點卡度撳「搬去邊度」搬過嚟，或者問AI攞主意。</p>` : ""}

      <button class="addstop" id="addboarditem">＋ 加一個地點落「${esc(board.name)}」</button>

        撳一下標題可以改名；撳景點卡右上角 ✏️ 就可以改內容或者搬去第度。

  }

  function boardItemHtml(board, s, i){
    const key = board.id + ":" + i;
    const open = state.open.has(key);
    const named = plain(s.title);
    const fetchable = !s.photoUrl && !s.noPhoto && (s.placeId || s.mapUrl);
    const thumb = s.photoUrl
      ? `<div class="thumb"><img src="${esc(s.photoUrl)}" alt="" loading="lazy"></div>`
      : fetchable
        ? `<div class="thumb ghost" data-getboardphoto="${i}" title="搵張相">📷<small>搵張相</small></div>`
        : "";
    const chips = (s.niecepick||[]).map(n=>`<span class="niecepick">${esc(n)}</span>`).join("") + ratingChip(s);
    const links = [];
    if (s.mapUrl) links.push(`<a class="maplink" href="${esc(s.mapUrl)}" target="_blank" rel="noopener">📍 Naver Map</a>`);
    if (s.mapUrl){
      const gr = googleReviewsUrl(s), gs = googleSearchUrl(s);
      if (gr) links.push(`<a class="maplink" href="${esc(gr)}" target="_blank" rel="noopener">⭐ Google 評論</a>`);
      if (gs) links.push(`<a class="maplink" href="${esc(gs)}" target="_blank" rel="noopener">🔍 Google 搜尋</a>`);
    }

    return `
      <div class="unit" data-i="${i}">
        <div class="stop">
          <div class="stop-rail"><span class="node"></span></div>
          <div class="stopcard${open ? " open" : ""}">
            <div class="stopmain">
              ${thumb}
              <div class="stopbody">
                <div class="stopname ${named ? "" : "unnamed"}">${named ? esc(named) : "未改名嘅地點"}${s.kr ? `<span class="kr">${esc(plain(s.kr))}</span>` : ""}</div>
                ${s.desc ? `<div class="stopdesc">${esc(s.desc)}</div>` : ""}
                ${chips ? `<div class="chiprow">${chips}</div>` : ""}
              </div>
            </div>
            <div class="cardtools">
              <button class="editbtn" data-open="${key}" title="${open ? "完成編輯" : "編輯"}">${open ? "✓" : "✏️"}</button>
            </div>
            ${s.tip ? `<div class="tipbox">${esc(s.tip)}</div>` : ""}
            ${bookingBoxHtml(s)}
            ${links.length ? `<div class="stopfoot">${links.join("")}</div>` : ""}
            ${open ? boardItemEditorHtml(board, s, i) : ""}
          </div>
        </div>
      </div>`;
  }

  function boardItemEditorHtml(board, s, i){
    return `
      <div class="editor" data-boardeditor="${i}">
        <div class="field">
          <label>名 — 打字會搵返 Google 地圖真實地點</label>
          <input class="input" data-bf="title" value="${esc(plain(s.title))}" placeholder="例如：南山谷韓屋村" autocomplete="off">
          <div class="suggest" data-bsuggest></div>
        </div>
        <div class="field"><label>韓文名</label><input class="input" data-bf="kr" value="${esc(s.kr)}" placeholder="남산골한옥마을"></div>
        <div class="field"><label>記低啲乜</label><textarea class="textarea" data-bf="desc" placeholder="想記低嘅嘢…">${esc(s.desc)}</textarea></div>

        <div class="field">
          <label>相片</label>
          <div data-bphotos>
            <button class="btn wide" data-bact="findphoto">${s.photoUrl ? "換張相" : "搵返呢度嘅相"}</button>
          </div>
        </div>

        <div class="editor-tools">
          <button class="btn" data-bact="move">搬去…</button>
          <button class="btn danger" data-bact="remove">刪走</button>
          <button class="btn primary" data-bact="close">完成</button>
        </div>
      </div>`;
  }

  function wireBoard(board){
    wireOpenToggles();

    const nameEl = $("#boardname-display");
    if (nameEl) nameEl.addEventListener("click", () => {
      state.renamingBoard = board.id;
      render();
      const inp = $("#boardname-input");
      if (inp){ inp.focus(); inp.select(); }
    });
    const nameInput = $("#boardname-input");
    if (nameInput){
      nameInput.focus(); nameInput.select();
      let committed = false;
      const commit = async () => {
        if (committed) return;
        committed = true;
        const v = nameInput.value.trim();
        board.name = v || "未命名清單";
        state.renamingBoard = null;
        render();
        await saveNow(`將清單改名做「${board.name}」`);
      };
      nameInput.addEventListener("keydown", e => { if (e.key === "Enter"){ e.preventDefault(); nameInput.blur(); } });
      nameInput.addEventListener("blur", commit);
    }

    const addBtn = $("#addboarditem");
    if (addBtn) addBtn.addEventListener("click", async () => {
      board.items.push(blankBoardItem());
      const idx = board.items.length - 1;
      state.open.clear();
      state.open.add(board.id + ":" + idx);
      render();
      const titleInp = document.querySelector('[data-boardeditor] [data-bf="title"]');
      if (titleInp){ titleInp.focus(); titleInp.scrollIntoView({ block:"center", behavior:"smooth" }); }
      await saveNow(`加咗一個新地點落「${board.name}」`);
    });

    const delBtn = $("#delboard");
    if (delBtn) delBtn.addEventListener("click", async () => {
      if (!confirm(`刪除成個「${board.name}」清單？入面 ${board.items.length} 個地點都會一齊冇。`)) return;
      state.snapshot.boards = (state.snapshot.boards || []).filter(b => b.id !== board.id);
      state.view = "overview";
      render();
      await saveNow(`刪除咗清單「${board.name}」`);
    });

    document.querySelectorAll("[data-boardcolor] [data-setcolor]").forEach(btn => btn.addEventListener("click", async () => {
      const c = btn.dataset.setcolor;
      if (c === board.color) return;
      board.color = c;
      render();
      await saveNow(`「${board.name}」清單改咗地圖顏色`);
    }));

    const ideasBtn = $("#boardideas");
    if (ideasBtn) ideasBtn.addEventListener("click", () => runBoardIdeas(board));
    const picksBtn = $("#boardpicks");
    if (picksBtn) picksBtn.addEventListener("click", () => runBoardPicks(board));

    // a page reload clears state.boardIdeas (in-memory only) — fall back to
    // the saved copy of the last finished panel so it doesn't just vanish
    if ((!state.boardIdeas || state.boardIdeas.boardId !== board.id) && board.lastPanel){
      state.boardIdeas = { boardId: board.id, html: board.lastPanel.html, status: "" };
    }

    // re-show the last answer for THIS board after any re-render
    const ideasOut = $("#boardideas-out");
    if (ideasOut && state.boardIdeas && state.boardIdeas.boardId === board.id){
      ideasOut.innerHTML = state.boardIdeas.html +
        (state.boardIdeas.status ? `<div class="ai-msg">${esc(state.boardIdeas.status)}</div>` : "");
      // "copy", not "move": the place stays in the list (so it's still there for
      // other days/trips to reuse) and a copy lands in the itinerary day.
      // Indices don't shift, so the panel doesn't need to be torn down after.
      // refreshTransit() re-renders the page several times while it works, which
      // would wipe a plain DOM-text confirmation — so "already copied" lives in
      // state and gets re-applied every time this wiring runs, not just once.
      if (!state.copiedPicks) state.copiedPicks = loadCopiedPicks();
      ideasOut.querySelectorAll("[data-quickcopy]").forEach(btn => {
        const idx = +btn.dataset.quickcopy;
        const dayId = btn.dataset.quickcopyday;
        const day = dayById(dayId);
        if (!day) return;
        const copyKey = `${board.id}:${idx}:${dayId}`;
        if (state.copiedPicks.has(copyKey)){
          btn.disabled = true;
          btn.textContent = `✓ 已複製去 ${day.title}`;
          return;
        }
        btn.addEventListener("click", async () => {
          const item = board.items[idx];
          if (!item) return;
          btn.textContent = "複製緊…"; btn.disabled = true;
          const copy = Object.assign(blankStop(), JSON.parse(JSON.stringify(item)), { kind:"stop" });
          const units = toUnits(day.items);
          units.push({ seg: null, stop: copy });
          day.items = fromUnits(units);
          syncMapPoints(day);
          const landedAt = units.length - 1;
          state.copiedPicks.add(copyKey);
          saveCopiedPicks(state.copiedPicks);
          btn.textContent = `✓ 已複製去 ${day.title}`;
          await saveNow(`「${plain(copy.title) || "一個地點"}」複製咗去 ${day.title}（清單度都仲留低）`);
          refreshTransit(day, [landedAt]);
        });
      });

      // tapping a recommendation card jumps down to the actual saved item in
      // the list below — same fuzzy "look 落去" jump as the food-card feature
      // on the overview page, so you can see the photo/rating that already
      // landed instead of scrolling to hunt for it
      ideasOut.querySelectorAll("[data-jumpitem]").forEach(card => card.addEventListener("click", e => {
        if (e.target.closest("button, a")) return;   // let copy/check-links buttons behave normally
        const el = document.querySelector(`#boardline .unit[data-i="${card.dataset.jumpitem}"]`);
        if (!el) return;
        el.scrollIntoView({ behavior:"smooth", block:"center" });
        el.classList.add("flash");
        setTimeout(() => el.classList.remove("flash"), 1600);
      }));
    }

    const rateBtn = $("#getboardratings");
    if (rateBtn) rateBtn.addEventListener("click", async () => {
      rateBtn.disabled = true;
      rateBtn.textContent = "問緊 Google…";
      const { done, why } = await fetchRatings(board.items, board.name);
      const b2 = $("#getboardratings");
      if (b2 && !done) b2.textContent = why ? "攞唔到：" + why : "呢個清單冇再攞到新評分";
    });

    // 📷 placeholder on a photo-less item: fetch one picture, no picker
    document.querySelectorAll("[data-getboardphoto]").forEach(el => el.addEventListener("click", async ev => {
      ev.preventDefault();
      ev.stopPropagation();
      if (el.dataset.busy) return;
      el.dataset.busy = "1";
      el.innerHTML = "⏳";
      const s = board.items[+el.dataset.getboardphoto];
      const name = plain(s.kr) || plain(s.title);
      let got = false;
      try {
        const r = await callAi(s.placeId ? { action:"place-photo", placeId:s.placeId }
                                         : { action:"place-photo", query:name });
        if (r && r.ok !== false && r.photos && r.photos.length){ s.photoUrl = r.photos[0]; got = true; }
      } catch (_){}
      if (!got) s.noPhoto = true;
      render();
      if (got) saveNow(`搵咗張相俾「${name}」`);
    }));

    wireBoardItemEditor(board);
  }

  function wireBoardItemEditor(board){
    const box = document.querySelector("[data-boardeditor]");
    if (!box) return;
    const i = +box.dataset.boardeditor;
    const s = board.items[i];

    box.querySelectorAll("[data-bf]").forEach(el => {
      el.addEventListener("input", () => {
        s[el.dataset.bf] = el.value;
        if (el.dataset.bf === "title"){
          const nameEl = box.closest(".stopcard").querySelector(".stopname");
          if (nameEl){
            nameEl.textContent = el.value.trim() || "未改名嘅地點";
            nameEl.classList.toggle("unnamed", !el.value.trim());
          }
        }
        saveSoon("改咗「" + (plain(s.title) || "一個地點") + "」");
      });
    });

    // google place autocomplete on the name field
    const titleInput = box.querySelector('[data-bf="title"]');
    const sugBox = box.querySelector("[data-bsuggest]");
    let sugTimer = null;
    titleInput.addEventListener("input", () => {
      clearTimeout(sugTimer);
      const q = titleInput.value.trim();
      if (q.length < 2){ sugBox.innerHTML = ""; return; }
      sugTimer = setTimeout(async () => {
        sugBox.innerHTML = `<p class="hint">搵緊…</p>`;
        try {
          const r = await callAi({ action:"place-search", query:q });
          if (r.ok === false){ sugBox.innerHTML = `<p class="hint">${esc(r.message)}</p>`; return; }
          if (!r.places || !r.places.length){ sugBox.innerHTML = `<p class="hint">搵唔到，照用你打嘅名就得。</p>`; return; }
          sugBox.innerHTML = r.places.map((p,ix)=>`
            <button class="suggest-item" data-p="${ix}">
              <div class="n">${esc(p.name)}</div><div class="a">${esc(p.address)}</div>
            </button>`).join("");
          sugBox.querySelectorAll("[data-p]").forEach(b => b.addEventListener("click", async () => {
            const p = r.places[+b.dataset.p];
            s.title = p.name; s.placeId = p.placeId;
            if (Number.isFinite(p.lat)) s.lat = p.lat;
            if (Number.isFinite(p.lng)) s.lng = p.lng;
            s.mapUrl = `https://map.naver.com/p/search/${encodeURIComponent(p.name)}`;
            titleInput.value = p.name;
            sugBox.innerHTML = `<p class="hint">已揀「${esc(p.name)}」，搵緊張相…</p>`;
            try {
              const pr = await callAi({ action:"place-photo", placeId:p.placeId });
              if (pr.ok !== false && pr.photos && pr.photos.length) s.photoUrl = pr.photos[0];
            } catch(_){}
            await saveNow("加咗「" + s.title + "」落「" + board.name + "」");
            render();
          }));
        } catch (e){ sugBox.innerHTML = `<p class="hint">搵唔到：${esc(e.message)}</p>`; }
      }, 420);
    });

    box.querySelectorAll("[data-bact]").forEach(btn => btn.addEventListener("click", async () => {
      const act = btn.dataset.bact;

      if (act === "close"){ state.open.clear(); render(); return; }

      if (act === "remove"){
        if (!confirm("刪走「" + (plain(s.title) || "呢個地點") + "」？")) return;
        board.items.splice(i,1);
        state.open.clear();
        render();
        await saveNow("刪走咗「" + (plain(s.title) || "一個地點") + "」");
        return;
      }

      if (act === "move"){ openMovePicker({ kind:"board", board, index:i }); return; }

      if (act === "findphoto"){
        const replacing = !!s.photoUrl;
        const holder = box.querySelector("[data-bphotos]");
        holder.innerHTML = `<p class="hint">搵緊相…</p>`;
        try {
          const payload = s.placeId ? { action:"place-photo", placeId:s.placeId }
                                    : { action:"place-photo", query:(s.kr || s.title) };
          const r = await callAi(payload);
          if (r.ok === false){ holder.innerHTML = `<p class="hint">${esc(r.message)}</p>`; return; }
          if (!r.photos || !r.photos.length){ holder.innerHTML = `<p class="hint">搵唔到呢度嘅相。</p>`; return; }
          if (!replacing){
            s.photoUrl = r.photos[0];
            await saveNow("加咗「" + (plain(s.title)||"一個地點") + "」嘅相");
            render();
            return;
          }
          holder.innerHTML = `<div class="photogrid">${r.photos.map(u2=>`<img src="${esc(u2)}" data-u="${esc(u2)}" class="${u2===s.photoUrl?'on':''}" alt="">`).join("")}</div><p class="hint">撳一張就用嗰張。</p>`;
          holder.querySelectorAll("img").forEach(img => img.addEventListener("click", async () => {
            s.photoUrl = img.dataset.u;
            await saveNow("換咗「" + (plain(s.title)||"一個地點") + "」嘅相");
            render();
          }));
        } catch (e){ holder.innerHTML = `<p class="hint">搵唔到：${esc(e.message)}</p>`; }
      }
    }));
  }

  // Ask the AI what's useful for whatever theme this board is named after.
  // Live-data topics (weather, foliage) get pointers to real sites instead of
  // a guess; place-type topics (snacks, souvenirs) get concrete suggestions
  // tagged with which day of the actual route they're convenient near.
  // Asked from inside a board, so it answers inside that board — no overlay.
  // An overlay for this was pure ceremony: the results belong to the page you
  // are already looking at, and covering that page hid the very list the
  // suggestions were being added to. Progress and results render in place,
  // and place suggestions save themselves into the board as they resolve.
  // Non-places (official sites for a live-data theme) stay as plain links.
  async function runBoardIdeas(board){
    const out = $("#boardideas-out");
    const btn = $("#boardideas");
    if (!out) return;
    if (btn){ btn.disabled = true; btn.textContent = "✨ 問緊 AI…"; }
    out.innerHTML = `<div class="ai-msg">諗緊「${esc(board.name)}」有咩資訊…</div>`;

    let r;
    try {
      const existingTitles = board.items.map(i => plain(i.title)).filter(Boolean);
      r = await callAi({ action:"board-ideas", theme: board.name, itinerary: state.snapshot, existingTitles });
    } catch (e){
      out.innerHTML = `<div class="ai-msg">出咗問題：${esc(e.message)}</div>`;
      if (btn){ btn.disabled = false; btn.textContent = `✨ 問 AI「${board.name}」有咩資訊`; }
      return;
    }
    if (r.ok === false){
      out.innerHTML = `<div class="ai-msg">${esc(r.message)}</div>`;
      if (btn){ btn.disabled = false; btn.textContent = `✨ 問 AI「${board.name}」有咩資訊`; }
      return;
    }

    const resources = r.resources || [], places = r.places || [];
    const introHtml = r.intro ? `<div class="ai-msg">${esc(r.intro)}</div>` : "";
    const resourcesHtml = resources.length ? `<div class="ideasec-title">🔗 官方／實用網站</div>` +
      resources.map(res => `
        <a class="reslink" href="${esc(res.url)}" target="_blank" rel="noopener">
          <div class="resname">${esc(res.name)}</div>
          ${res.note ? `<div class="resnote">${esc(res.note)}</div>` : ""}
        </a>`).join("") : "";

    // render() below rebuilds the page, so remember what to re-show afterwards
    state.boardIdeas = { boardId: board.id, html: introHtml + resourcesHtml, status: places.length ? `搵緊相、加緊落「${board.name}」…` : "" };
    out.innerHTML = state.boardIdeas.html + (state.boardIdeas.status ? `<div class="ai-msg">${esc(state.boardIdeas.status)}</div>` : "");

    // add each suggestion as it resolves, so the list visibly fills up
    const added = [];
    for (const pl of places){
      const item = Object.assign(blankBoardItem(), {
        title: pl.title || "", kr: pl.kr || "", desc: pl.desc || "", tip: pl.dayHint || "",
      });
      if (pl.isFood) Object.assign(item, { isFood: true, booking: pl.booking || "unknown", bookingHow: pl.bookingHow || "", queueNote: pl.queueNote || "" });
      board.items.push(item);
      await enrichStop(item);
      added.push({ item, dayId: pl.dayId });
      state.boardIdeas.status = `已經加咗 ${added.length}／${places.length} 個…`;
      render();
    }
    const addedHtml = added.length
      ? `<div class="ideasec-title">📍 已經加落「${esc(board.name)}」（${added.length}）—— 見下面</div>` +
        added.filter(({dayId}) => dayId && dayById(dayId)).map(({item, dayId}) => {
          const targetDay = dayById(dayId);
          const idx = board.items.indexOf(item);
          return `<button class="btn" data-quickcopy="${idx}" data-quickcopyday="${dayId}" style="margin:0 6px 6px 0;">📋 「${esc(plain(item.title))}」複製去 ${esc(targetDay.title)}</button>`;
        }).join("")
      : "";

    state.boardIdeas = { boardId: board.id, html: introHtml + resourcesHtml + addedHtml, status: "" };
    saveLastPanel(board, state.boardIdeas.html);
    render();
    await saveNow(added.length ? `AI 建議加咗 ${added.length} 個地點落「${board.name}」` : `問咗AI「${board.name}」有咩資訊`);

    const savedAnswer = [
      r.intro,
      resources.length ? resources.map(x => `${x.name}：${x.url}`).join("\n") : "",
      added.length ? added.map(({item}) => `${plain(item.title)}${item.tip ? `（${item.tip}）` : ""}：${item.desc||""}`).join("\n") : "",
    ].filter(Boolean).join("\n\n");
    if (savedAnswer) saveAiNote("board", `${board.name} 主題資訊`, savedAnswer);
  }

  // where to go and see for yourself whether something is actually trending
  function buzzLinks(name){
    const q = encodeURIComponent(name);
    const tag = encodeURIComponent(name.replace(/[\s·・]/g, ""));
    return [
      { label: "Instagram", url: `https://www.instagram.com/explore/tags/${tag}/` },
      { label: "Naver 部落格", url: `https://search.naver.com/search.naver?where=blog&query=${q}` },
    ];
  }

  // Two lists that deserve very different levels of trust, so they are shown
  // as two clearly-labelled sections rather than one blended ranking:
  //  · 高分：the AI only proposes names, then the server looks every one up on
  //    Google and keeps the ones that really are well rated. The numbers on
  //    screen are Google's.
  //  · 熱門：the AI has no live access to Instagram/Naver, so this is its
  //    impression from training data. Labelled as unverified, with links to
  //    go check each one yourself.
  async function runBoardPicks(board){
    const out = $("#boardideas-out");
    const btn = $("#boardpicks");
    if (!out) return;
    const restore = () => { const b2 = $("#boardpicks"); if (b2){ b2.disabled = false; b2.textContent = "🏆 5 個 Google 高分 ＋ 🔥 5 個社交平台熱門"; } };
    if (btn){ btn.disabled = true; btn.textContent = "問緊 AI，再逐個去 Google 查…"; }
    out.innerHTML = `<div class="ai-msg">諗緊「${esc(board.name)}」嘅推介，然後會逐個攞去 Google 查真實評分…</div>`;

    let r;
    try {
      const existingTitles = board.items.map(i => plain(i.title)).filter(Boolean);
      r = await callAi({ action:"board-picks", theme: board.name, itinerary: state.snapshot, existingTitles });
    } catch (e){
      out.innerHTML = `<div class="ai-msg">出咗問題：${esc(e.message)}</div>`; restore(); return;
    }
    if (r.ok === false){ out.innerHTML = `<div class="ai-msg">${esc(r.message)}</div>`; restore(); return; }

    const topRated = r.topRated || [], trending = r.trending || [];
    const introHtml = r.intro ? `<div class="ai-msg">${esc(r.intro)}</div>` : "";

    state.boardIdeas = { boardId: board.id, html: introHtml, status: `加緊落「${board.name}」…` };
    render();

    // top-rated first: these already carry Google's own rating from the check
    const added = [];
    for (const pl of topRated){
      const item = Object.assign(blankBoardItem(), {
        title: pl.title || "", kr: pl.kr || "", desc: pl.desc || "", tip: pl.dayHint || "",
        placeId: pl.placeId || "", rating: pl.rating, ratingCount: pl.ratingCount,
      });
      if (Number.isFinite(pl.lat)) item.lat = pl.lat;
      if (Number.isFinite(pl.lng)) item.lng = pl.lng;
      if (!item.mapUrl && (pl.kr || pl.title)) item.mapUrl = `https://map.naver.com/p/search/${encodeURIComponent(pl.kr || pl.title)}`;
      if (pl.isFood) Object.assign(item, { isFood: true, booking: pl.booking || "unknown", bookingHow: pl.bookingHow || "", queueNote: pl.queueNote || "" });
      board.items.push(item);
      await enrichStop(item);                    // photo (rating already known)
      added.push({ item, dayId: pl.dayId, kind:"top" });
      state.boardIdeas.status = `加緊… ${added.length}／${topRated.length + trending.length}`;
      render();
    }
    for (const pl of trending){
      const item = Object.assign(blankBoardItem(), {
        title: pl.title || "", kr: pl.kr || "", desc: pl.desc || "",
        tip: `🔥 社交平台熱門（AI 印象・未經核實）${pl.dayHint ? "・" + pl.dayHint : ""}`,
      });
      if (pl.isFood) Object.assign(item, { isFood: true, booking: pl.booking || "unknown", bookingHow: pl.bookingHow || "", queueNote: pl.queueNote || "" });
      board.items.push(item);
      await enrichStop(item);                    // resolves photo + real rating
      added.push({ item, dayId: pl.dayId, kind:"buzz", buzz: pl.buzz || "" });
      state.boardIdeas.status = `加緊… ${added.length}／${topRated.length + trending.length}`;
      render();
    }

    const copyBtn = ({item, dayId}) => {
      const d = dayId ? dayById(dayId) : null;
      if (!d) return "";
      return `<button class="btn" data-quickcopy="${board.items.indexOf(item)}" data-quickcopyday="${d.id}" style="margin:6px 6px 0 0;">📋 複製去 ${esc(d.title)}</button>`;
    };

    const topHtml = topRated.length ? `
      <div class="pickhead verified"><span class="pt">🏆 Google 高分・多人評價</span></div>
      <p class="picknote">下面每個都真係去咗 Google 查過（AI 提咗 ${r.checked || 0} 個，查到 ${r.verifiedCount || 0} 個有評分，揀返評價人數最多嘅 ${topRated.length} 個）。分數同人數係 Google 嘅數，唔係 AI 講嘅。</p>
      ${added.filter(a => a.kind === "top").map(a => `
        <div class="ai-change" style="--lc:var(--ok)" data-jumpitem="${board.items.indexOf(a.item)}" title="撳一下睇低面清單嗰個">
          <div class="ttl">${esc(plain(a.item.title))}${a.item.kr ? ` <span class="kr">${esc(a.item.kr)}</span>` : ""}</div>
          <div class="chiprow" style="margin-top:5px;">${ratingChip(a.item)}</div>
          ${a.item.desc ? `<div class="why">${esc(a.item.desc)}</div>` : ""}
          ${bookingBoxHtml(a.item)}
          ${copyBtn(a)}

  // "約 20:00" / "10:30 起（睡到自然醒）" / "14:00–16:00" -> minutes since midnight
  function timeToMinutes(t){
    const m = String(t || "").match(/(\d{1,2})\s*[:：]\s*(\d{2})/);
    if (!m) return null;
    const h = +m[1], mi = +m[2];
    return (h > 23 || mi > 59) ? null : h * 60 + mi;
  }
  // where a stop belongs in the day, by its own time
  function slotForTime(units, time){
    const t = timeToMinutes(time);
    if (t == null) return units.length;
    for (let i = 0; i < units.length; i++){
      const ot = timeToMinutes(units[i].stop && units[i].stop.time);
      if (ot != null && ot > t) return i;
    }
    return units.length;
  }

  // A stop the AI invented has only a name. Find the real place behind it so it
  // gets a photo, a map link, and coordinates good enough to route from.
  async function enrichStop(s){
    const name = plain(s.title);
    if (!name) return;
    // Already resolved to a specific Google place (e.g. the server verified
    // this pick by its Korean name) — searching again by the Chinese title can
    // land on a different place and overwrite good coordinates and a real
    // rating with another shop's. Keep what we have; just get the photo.
    if (s.placeId) return enrichPhoto(s, name);
    try {
      const r = await callAi({ action:"place-search", query:name });
      const p = r && r.places && r.places[0];
      if (p){
        s.placeId = p.placeId;
        if (Number.isFinite(p.lat)) s.lat = p.lat;
        if (Number.isFinite(p.lng)) s.lng = p.lng;
        if (!s.mapUrl) s.mapUrl = `https://map.naver.com/p/search/${encodeURIComponent(p.name)}`;
        // text search carries the rating already — no extra request for it
        if (Number.isFinite(p.rating)) s.rating = p.rating;
        if (Number.isFinite(p.ratingCount)) s.ratingCount = p.ratingCount;
      }
    } catch (_){}
    return enrichPhoto(s, name);
  }

  async function enrichPhoto(s, name){
    if (s.photoUrl) return;
    try {
      const pr = await callAi(s.placeId ? { action:"place-photo", placeId:s.placeId }
                                        : { action:"place-photo", query:name });
      if (pr && pr.ok !== false && pr.photos && pr.photos.length) s.photoUrl = pr.photos[0];
    } catch (_){}
  }

  // Google has no API for reservation/queue info, so this is always the
  // model's own impression — never treat it with the same confidence as the
  // Google-verified rating chip.
  const BOOKING_LABEL = { online:"🌐 可網上／App預約", phone:"📞 只可電話訂位", walkin:"🚶 冇預約，現場排隊" };
  function bookingBoxHtml(s){
    if (!s.isFood) return "";
    const parts = [];
    if (BOOKING_LABEL[s.booking]) parts.push(BOOKING_LABEL[s.booking]);
    if (plain(s.bookingHow)) parts.push(esc(plain(s.bookingHow)));
    if (plain(s.queueNote)) parts.push(`⏱ ${esc(plain(s.queueNote))}`);
    if (!parts.length) return "";
    return `<div class="bookbox"><b>訂位／排隊</b>${parts.join("<br>")}<span class="warnline">⚠️ AI 印象・未經核實，出發前建議自己再確認</span></div>`;
  }

  // "⭐ 4.3・1,234 則評價" — Google's own numbers, not something we wrote
  function ratingChip(s){
    if (!Number.isFinite(s.rating)) return "";
    const count = Number.isFinite(s.ratingCount) ? `・${s.ratingCount.toLocaleString("en-US")} 則評價` : "";
    return `<span class="meta-chip rating">⭐ ${s.rating.toFixed(1)}${count}</span>`;
  }
  // fills in ratings for everything on screen that Google can identify
  async function fetchRatings(items, label){
    const todo = items.filter(s => !Number.isFinite(s.rating) && !s.noRating && (s.placeId || s.mapUrl) && plain(s.title));
    if (!todo.length) return { done:0, why:"" };
    let done = 0, why = "";
    for (const s of todo){
      try {
        const r = await callAi(s.placeId ? { action:"place-rating", placeId:s.placeId }
                                         : { action:"place-rating", query:(plain(s.kr) || plain(s.title)) });
        if (r && r.ok !== false && Number.isFinite(r.rating)){
          s.rating = r.rating;
          if (Number.isFinite(r.ratingCount)) s.ratingCount = r.ratingCount;
          if (!s.placeId && r.placeId) s.placeId = r.placeId;
          done++;
        } else {
          s.noRating = true;                       // Google has no rating for it; stop asking
          if (r && r.message) why = r.message;
        }
      } catch (e){ why = e.message; }
      render();
    }
    if (done) await saveNow(`攞咗 ${done} 個地點嘅 Google 評分（${label}）`);
    return { done, why };
  }

  // The AI names a stop in its own words — "北村韓屋村" for a card actually
  // titled "北村韓屋村（平緩觀景點）". Exact matching silently dropped those,
  // so fall back to a looser comparison before giving up.
  function loose(s){
    return plain(s)
      .replace(/[（(][^）)]*[）)]/g, "")   // drop parentheticals
      .replace(/[\s・·、，,.。~〜\-–—]/g, "")
      .toLowerCase();
  }
  function findStopIndex(units, title){
    const want = plain(title), wantLoose = loose(title);
    if (!want) return -1;
    let ix = units.findIndex(u => u.stop && plain(u.stop.title) === want);
    if (ix >= 0) return ix;
    if (!wantLoose) return -1;
    ix = units.findIndex(u => u.stop && loose(u.stop.title) === wantLoose);
    if (ix >= 0) return ix;
    // one name contains the other, e.g. "Mil Toast House" vs "Mil Toast House 益善洞"
    const hits = units.map((u,i) => [u,i]).filter(([u]) => {
      if (!u.stop) return false;
      const got = loose(u.stop.title);
      return got && (got.includes(wantLoose) || wantLoose.includes(got));
    });
    return hits.length === 1 ? hits[0][1] : -1;   // ambiguous is as bad as missing
  }

  // returns "" when applied, otherwise a reason to show on the button
  async function applyAiChange(c){
    const day = dayById(c.dayId);
    if (!day) return `搵唔到 ${c.dayId || "嗰一日"}`;
    const units = toUnits(day.items);

    if (c.op === "add" && c.stop){
      const stop = Object.assign(blankStop(), c.stop, { kind:"stop" });
      delete stop.transitBefore;          // describes a leg we are about to recompute
      // drop it in by time rather than at the end, so the day still reads in order
      const at = slotForTime(units, stop.time);
      units.splice(at, 0, { seg: null, stop });
      day.items = fromUnits(units);
      render();
      await enrichStop(stop);
      day.items = fromUnits(units);
      render();
      await saveNow(c.reason || `加咗「${plain(stop.title) || "一個地點"}」`);
      // the AI's own travel note assumed a different neighbour; ask Google instead
      await refreshTransit(day, [at, at + 1]);
      return "";
    }

    if (c.op === "remove" && c.matchTitle){
      const ix = findStopIndex(units, c.matchTitle);
      if (ix < 0) return `搵唔到「${plain(c.matchTitle)}」`;
      units.splice(ix,1);
      day.items = fromUnits(units);
      render();
      await saveNow(c.reason || `刪走咗「${plain(c.matchTitle)}」`);
      await refreshTransit(day, [ix]);
      return "";
    }

    if (c.op === "edit" && c.matchTitle && c.stop){
      const ix = findStopIndex(units, c.matchTitle);
      if (ix < 0) return `搵唔到「${plain(c.matchTitle)}」`;
      const before = units[ix].stop.time;
      const wasNamed = plain(units[ix].stop.title);
      Object.assign(units[ix].stop, c.stop, { kind:"stop" });
      delete units[ix].stop.transitBefore;
      let at = ix;
      if (timeToMinutes(units[ix].stop.time) !== timeToMinutes(before)){
        const [moved] = units.splice(ix, 1);          // time changed, so its slot may have too
        at = slotForTime(units, moved.stop.time);
        units.splice(at, 0, moved);
      }
      day.items = fromUnits(units);
      render();
      // renamed to a different place, so its photo and coordinates are stale too
      if (plain(units[at].stop.title) !== wasNamed){
        units[at].stop.photoUrl = ""; units[at].stop.placeId = "";
        await enrichStop(units[at].stop);
        day.items = fromUnits(units);
        render();
      }
      await saveNow(c.reason || `改咗「${plain(c.matchTitle)}」`);
      // a moved stop leaves two broken legs behind it and one in front
      if (at !== ix) await refreshTransit(day, [Math.min(ix, at), Math.max(ix, at), Math.max(ix, at) + 1]);
      return "";
    }

    day.items = fromUnits(units);
    render();
    return "呢個建議睇唔明，冇改到行程";
  }

  // ---------- human-readable version comparison ----------
  // A raw JSON diff is unreadable (photo URLs, HTML blobs, coordinates all
  // shift line numbers around). Compare what a reader actually cares about:
  // which stop was added/removed/changed, day by day.
  function stopKey(s){ return plain(s && s.title) || ""; }

  function summarizeItemsDiff(oldItems, newItems){
    const oldStops = (oldItems||[]).filter(i => i.kind === "stop");
    const newStops = (newItems||[]).filter(i => i.kind === "stop");
    const oldByKey = new Map();
    oldStops.forEach(s => { const k = stopKey(s); if (k && !oldByKey.has(k)) oldByKey.set(k, s); });
    const newByKey = new Map();
    newStops.forEach(s => { const k = stopKey(s); if (k && !newByKey.has(k)) newByKey.set(k, s); });

    const lines = [];
    newStops.forEach(s => {
      const k = stopKey(s);
      if (k && !oldByKey.has(k)) lines.push({ type:"add", text:`＋ 加咗「${k}」${plain(s.time) ? `（${plain(s.time)}）` : ""}` });
    });
    oldStops.forEach(s => {
      const k = stopKey(s);
      if (k && !newByKey.has(k)) lines.push({ type:"remove", text:`－ 刪咗「${k}」` });
    });
    newByKey.forEach((s, k) => {
      const o = oldByKey.get(k);
      if (!o) return;
      const changes = [];
      if (plain(o.time) !== plain(s.time)) changes.push(`時間 ${plain(o.time) || "未定"} → ${plain(s.time) || "未定"}`);
      if (plain(o.desc) !== plain(s.desc)) changes.push("改咗描述");
      if ((o.photoUrl||"") !== (s.photoUrl||"")) changes.push(o.photoUrl ? "換咗相" : "加咗相");
      if ((o.mapUrl||"") !== (s.mapUrl||"") && o.mapUrl && s.mapUrl) changes.push("地圖連結有更新");
      if (changes.length) lines.push({ type:"edit", text:`✎ 「${k}」：${changes.join("、")}` });
    });
    // did the common stops change relative order?
    const commonOld = oldStops.map(stopKey).filter(k => k && newByKey.has(k));
    const commonNew = newStops.map(stopKey).filter(k => k && oldByKey.has(k));
    if (commonOld.length > 1 && commonOld.join("|") !== commonNew.join("|")){
      lines.push({ type:"reorder", text:"⇅ 次序調整咗" });
    }
    return lines;
  }

  function summarizeSnapshotDiff(oldSnap, newSnap){
    const sections = [];
    const oldDaysById = new Map((oldSnap.days||[]).map(d => [d.id, d]));
    (newSnap.days||[]).forEach(nd => {
      const od = oldDaysById.get(nd.id);
      const lines = summarizeItemsDiff(od ? od.items : [], nd.items);
      if (lines.length) sections.push({ label: `Day ${nd.id.replace('day','')} · ${nd.title}`, lines });
    });
    (oldSnap.days||[]).forEach(od => {
      if (!(newSnap.days||[]).some(nd => nd.id === od.id)){
        sections.push({ label: `Day ${od.id.replace('day','')} · ${od.title}`, lines:[{ type:"remove", text:"－ 成日行程被刪走咗" }] });
      }
    });

    const oldBoards = oldSnap.boards || [], newBoards = newSnap.boards || [];
    const oldBoardsById = new Map(oldBoards.map(b => [b.id, b]));
    newBoards.forEach(nb => {
      const ob = oldBoardsById.get(nb.id);
      const asStops = items => items.map(i => ({ ...i, kind:"stop" }));
      if (!ob){
        sections.push({ label:`📌 ${nb.name}`, lines:[{ type:"add", text:`＋ 開咗個新清單，入面 ${nb.items.length} 個地點` }] });
        return;
      }
      const lines = [];
      if (ob.name !== nb.name) lines.push({ type:"edit", text:`改咗名：「${ob.name}」→「${nb.name}」` });
      lines.push(...summarizeItemsDiff(asStops(ob.items), asStops(nb.items)));
      if (lines.length) sections.push({ label:`📌 ${nb.name}`, lines });
    });
    oldBoards.forEach(ob => {
      if (!newBoards.some(nb => nb.id === ob.id)) sections.push({ label:`📌 ${ob.name}`, lines:[{ type:"remove", text:"－ 成個清單被刪走咗" }] });
    });

    return sections;
  }

  function diffSummaryHtml(sections){
    if (!sections.length) return `<p class="hint">呢兩個版本冇分別。</p>`;
    return sections.map(sec => `
      <div class="diffday">
        <div class="diffday-title">${esc(sec.label)}</div>
        ${sec.lines.map(l => `<div class="diffline diffline-${l.type}">${esc(l.text)}</div>`).join("")}
      </div>`).join("");
  }

  // ---------- 📌 bookmark boards: one always-visible entry point ----------
  // Living as tabs after all 6 days meant they were invisible off the right
  // edge of a horizontally-scrolling strip unless you already knew to look.
  // A dock button — same tier as 歷史/AI助手 — is reachable from any page.
  $("#btn-boards").addEventListener("click", () => openBoardsSheet());
  function openBoardsSheet(){
    const boards = state.snapshot.boards || [];
    openSheet(`
      <h3>📌 心水清單</h3>
      <p class="sec-sub">未定實邊日去嘅地點放呢度。撳一個入去，或者開個新嘅。</p>
      <div class="daypick">
        ${boards.map(b => `
          <button data-gotoboard="${b.id}" style="--lc:var(--bookmark)">
            <span class="bullet"></span><span class="dcode">📌</span>
            <span>${esc(b.name)}（${b.items.length} 個地點）</span>
          </button>`).join("")}
        <button data-newboard-sheet style="--lc:var(--bookmark)">
          <span class="bullet"></span><span class="dcode">＋</span><span>開個新清單</span>
        </button>
      </div>
      ${!boards.length ? `<p class="hint">仲未有清單，撳「開個新清單」整第一個。</p>` : ""}
    `, sheet => {
      sheet.querySelectorAll("[data-gotoboard]").forEach(b => b.addEventListener("click", () => {
        state.view = b.dataset.gotoboard;
        state.open.clear();
        closeLayer();
        window.scrollTo({ top: 0, behavior: "auto" });
        render();
      }));
      const nb = sheet.querySelector("[data-newboard-sheet]");
      if (nb) nb.addEventListener("click", async () => {
        state.snapshot.boards = state.snapshot.boards || [];
        const b = newBoard(`清單 ${state.snapshot.boards.length + 1}`);
        state.snapshot.boards.push(b);
        state.view = b.id;
        state.open.clear();
        state.renamingBoard = b.id;
        closeLayer();
        window.scrollTo({ top: 0, behavior: "auto" });
        render();
        await saveNow(`加咗個新清單「${b.name}」`);
      });
    });
  }

  // ---------- history ----------
  $("#btn-history").addEventListener("click", async () => {
    openSheet(`<h3>改動紀錄</h3><p class="sec-sub">最頂（標「而家」）係最新版本。撳「同而家比較」睇邊日有咩改咗；或者剔兩個版本再撳「比較揀咗嘅兩個」。</p><div class="vlist" id="vlist"><p class="hint">載入緊…</p></div>`, async layer => {
      const list = layer.querySelector("#vlist");
      try {
        const rows = await fetchAllVersions();
        if (!rows.length){ list.innerHTML = `<p class="hint">仲未有任何紀錄。</p>`; return; }
        list.innerHTML = `
          <div class="editor-tools" style="margin:0 0 4px;">
            <button class="btn" id="cmp">比較揀咗嘅兩個</button>
          </div>
          ${rows.map((r,idx) => `
            <label class="vrow">
              <input type="checkbox" value="${r.id}">
              <span style="flex:1 1 auto;min-width:0;">
                <span class="who">${esc(r.edited_by||"匿名")}</span>
                <span class="when"> · ${esc(new Date(r.created_at).toLocaleString("zh-HK",{month:"numeric",day:"numeric",hour:"2-digit",minute:"2-digit"}))}</span>
                ${idx===0 ? `<span class="badge now">而家</span>` : ""}
                <span class="sum">${esc(r.summary||"")}</span>
                <span class="acts">
                  <button class="btn" data-view="${r.id}">睇呢版</button>
                  ${idx!==0 ? `<button class="btn" data-cmpnow="${r.id}">同而家比較</button>` : ""}
                  <button class="btn" data-restore="${r.id}">還原</button>
                </span>
              </span>
            </label>`).join("")}`;

        list.querySelectorAll("[data-view]").forEach(b => b.addEventListener("click", async e => {
          e.preventDefault();
          try {
            const snap = await fetchVersionSnapshot(b.dataset.view);
            if (!snap) return;
            state.snapshot = normalizeSnapshot(snap); state.open.clear();
            closeLayer(); render();
            flash("而家睇緊舊版本（未還原）");
          } catch (err){ alert("睇唔到呢版：" + err.message); }
        }));

        list.querySelectorAll("[data-restore]").forEach(b => b.addEventListener("click", async e => {
          e.preventDefault();
          if (!confirm("還原到呢個版本？（唔會刪走中間嘅紀錄）")) return;
          try {
            const snap = await fetchVersionSnapshot(b.dataset.restore);
            if (!snap) return;
            state.snapshot = normalizeSnapshot(snap);
            await saveVersion(snap, "restore", "還原到版本 #" + b.dataset.restore);
            closeLayer(); render(); flash("已還原");
          } catch (err){ alert("還原唔到：" + err.message); }
        }));

        list.querySelectorAll("[data-cmpnow]").forEach(b => b.addEventListener("click", async e => {
          e.preventDefault();
          const holder = document.createElement("div");
          holder.className = "diffwrap";
          holder.innerHTML = `<p class="hint">比較緊…</p>`;
          list.prepend(holder);
          try {
            const old = await fetchVersionSnapshot(b.dataset.cmpnow);
            if (!old) return;
            const sections = summarizeSnapshotDiff(old, state.snapshot);
            holder.innerHTML = `<div class="diffwrap-title">呢個版本 → 而家嘅分別</div>${diffSummaryHtml(sections)}`;
          } catch (err){ holder.innerHTML = `<p class="hint">比較唔到：${esc(err.message)}</p>`; }
        }));

        list.querySelector("#cmp").addEventListener("click", async e => {
          e.preventDefault();
          // checkboxes appear in the same order as rows (newest first), so the
          // one checked first in document order is whichever pick is newer
          const picked = Array.from(list.querySelectorAll("input:checked")).map(i => i.value);
          if (picked.length !== 2){ alert("揀啱兩個版本先可以比較。"); return; }
          const holder = document.createElement("div");
          holder.className = "diffwrap";
          holder.innerHTML = `<p class="hint">比較緊…</p>`;
          list.prepend(holder);
          try {
            const [older, newer] = await Promise.all([fetchVersionSnapshot(picked[1]), fetchVersionSnapshot(picked[0])]);
            const sections = summarizeSnapshotDiff(older, newer);
            holder.innerHTML = `<div class="diffwrap-title">兩個版本嘅分別</div>${diffSummaryHtml(sections)}`;
          } catch (err){ holder.innerHTML = `<p class="hint">比較唔到：${esc(err.message)}</p>`; }
        });
      } catch (e){ list.innerHTML = `<div class="errbox">載入唔到紀錄：${esc(e.message)}</div>`; }
    });
  });

  // ==================================================================
  // BOOT
  // ==================================================================
  async function boot(){
    let row;
    try {
      row = await fetchLatestVersion();
      if (!row) throw new Error("資料庫入面仲未有行程版本。");
    } catch (e){
      $("#app").innerHTML = `<div class="sec"><div class="errbox">載入唔到行程：${esc(e.message)}<br>檢查下網絡再重新整理。</div></div>`;
      return;
    }
    state.snapshot = normalizeSnapshot(row.snapshot);
    try {
      render();
    } catch (e){
      $("#app").innerHTML = `<div class="sec"><div class="errbox">行程讀到咗，但畫唔出嚟：${esc(e.message)}<br>可以撳上面日子掣試下第二日。</div></div>`;
    }
  }
  boot();
})();
</script>
</body>
</html>
