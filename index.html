<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#F1F3EF" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0E1211" media="(prefers-color-scheme: dark)">
<title>DumboFly</title>
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" href="/icons/icon-v2.svg" type="image/svg+xml">
<link rel="icon" href="/icons/icon-32-v2.png" sizes="32x32">
<link rel="apple-touch-icon" href="/icons/apple-touch-icon-v2.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="DumboFly">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@75..125,400..800&family=Noto+Sans+HK:wght@300..900&display=swap" rel="stylesheet">
<style>
/* ============================================================
   DEPARTURE BOARD — shared with trip.html.
   The home page is the same system with a shorter component list:
   a quiet neutral base, one accent, Instrument Sans + IBM Plex Mono
   + Noto Sans TC, hairlines instead of shadows.
   ============================================================ */
:root{
  color-scheme: light dark;
  --paper:#F1F3EF;
  --surface:#FFFFFF;
  --surface-2:#E8ECE6;
  --ink:#13181A;
  --ink-soft:#5A6560;
  --ink-faint:#8A948F;
  --rule:#D8DED7;
  --rule-soft:#E6EAE4;
  --shadow-1:0 1px 2px rgba(20,23,26,.04);
  --shadow-2:0 8px 30px -12px rgba(20,23,26,.22), 0 2px 6px rgba(20,23,26,.05);
  --ok:#2A7355;
  --warn:#8A6100;
  --danger:#BE3E28; --danger-bg:#F6E7E4;
  --accent:#2665A0;
  --f-disp:'Archivo','Noto Sans HK','Noto Sans TC',system-ui,sans-serif;
  --f-body:'Archivo','Noto Sans HK','Noto Sans TC','Hiragino Sans HK',system-ui,sans-serif;
  --f-mono:'Archivo','Noto Sans HK',system-ui,sans-serif;
  --r-sm:7px; --r-md:12px; --r-lg:18px; --r-xl:26px;
  --tap:44px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --paper:#0E1211; --surface:#161B1A; --surface-2:#1E2422;
    --ink:#EAEEEB; --ink-soft:#98A39E; --ink-faint:#6C7773;
    --rule:#252C2A; --rule-soft:#1B2120;
    --shadow-1:0 1px 2px rgba(0,0,0,.35);
    --shadow-2:0 10px 34px -14px rgba(0,0,0,.8), 0 2px 8px rgba(0,0,0,.4);
    --ok:#4FAE80; --warn:#E0A93C;
    --danger:#E2705A; --danger-bg:#261815;
    --accent:#5A9AD4;
  }
}
:root[data-theme="dark"]{
  --paper:#0E1211; --surface:#161B1A; --surface-2:#1E2422;
  --ink:#EAEEEB; --ink-soft:#98A39E; --ink-faint:#6C7773;
  --rule:#252C2A; --rule-soft:#1B2120;
  --shadow-1:0 1px 2px rgba(0,0,0,.35);
  --shadow-2:0 10px 34px -14px rgba(0,0,0,.8), 0 2px 8px rgba(0,0,0,.4);
  --ok:#4FAE80; --warn:#E0A93C;
  --danger:#E2705A; --danger-bg:#261815;
  --accent:#5A9AD4;
}
:root[data-theme="navy"]{
  --paper:#0C1420; --surface:#141E2E; --surface-2:#1B273A;
  --ink:#E8EEF7; --ink-soft:#94A6C0; --ink-faint:#6B7F9B;
  --rule:#233047; --rule-soft:#192334;
  --shadow-1:0 1px 2px rgba(0,0,0,.45);
  --shadow-2:0 12px 36px -16px rgba(0,0,0,.9), 0 2px 8px rgba(0,0,0,.5);
  --ok:#4FBE8C; --warn:#E8B44A;
  --danger:#E87760; --danger-bg:#2B1A17;
  --accent:#6FB4EE;
}
*{box-sizing:border-box;}
/* An author rule like .topbtn{display:inline-flex} outranks the UA's
   [hidden]{display:none}, so anything hidden by attribute stayed on screen.
   The reload button, meant for installed mode only, was showing everywhere. */
[hidden]{display:none !important;}
html{
  -webkit-text-size-adjust:100%;
  /* the UA takes overscroll-behavior from <html>, not <body> */
  overscroll-behavior-y:contain;
}
body{
  margin:0;
  background:var(--paper);
  color:var(--ink);
  font-family:var(--f-body);
  font-size:15px;
  line-height:1.7;
  -webkit-font-smoothing:antialiased;
  padding-bottom:calc(48px + env(safe-area-inset-bottom));
  overflow-wrap:break-word;
  /* the page does its own pull-to-refresh, so the browser must not also do one */
  overscroll-behavior-y:contain;
  overflow-x:hidden;
}
img{max-width:100%;}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:4px;}
button{font-family:inherit;color:inherit;}
a{color:inherit;}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums;}
.disp{font-family:var(--f-disp);}
.i{
  width:1.15em;height:1.15em;flex:0 0 auto;display:inline-block;vertical-align:-.2em;
  fill:none;stroke:currentColor;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round;
}

.topbar{
  position:sticky; top:0; z-index:20;
  background:color-mix(in srgb, var(--paper) 90%, transparent);
  backdrop-filter:saturate(150%) blur(16px);
  -webkit-backdrop-filter:saturate(150%) blur(16px);
  border-bottom:1px solid var(--rule);
}
.topbar-inner{
  max-width:720px; margin:0 auto; padding:14px 18px;
  display:flex; align-items:center; justify-content:space-between; gap:12px;
}
.brandmark{
  display:flex;align-items:center;gap:8px;
  font-family:var(--f-body); font-weight:700; font-size:15px; letter-spacing:-.015em;
}
.brandmark .i{width:17px;height:17px;color:var(--ink-faint);}
.iconbtn{
  width:34px; height:34px; flex:0 0 auto; display:grid; place-items:center;
  border:1px solid var(--rule); background:var(--surface);
  border-radius:999px; cursor:pointer; color:var(--ink-soft);
}
.iconbtn .i{width:16px;height:16px;}
.iconbtn:active{transform:scale(.94);}

.wrap{max-width:720px; margin:0 auto; padding:32px 18px 64px;}

.hero{padding:6px 2px 30px;}
.hero h1{
  font-family:var(--f-body);
  font-weight:700; font-size:clamp(27px,7.4vw,38px); line-height:1.22; margin:0 0 12px;
  letter-spacing:-.025em;
}
.hero p{color:var(--ink-soft); margin:0; font-size:15px;}

.card{
  background:var(--surface); border:1px solid var(--rule); border-radius:var(--r-xl);
  padding:22px;
}
.formcard{margin-bottom:40px;}
.field{margin-bottom:18px; position:relative;}
.field label{display:block; font-size:11.5px; font-weight:500; color:var(--ink-faint); margin-bottom:7px; letter-spacing:.01em;}
.field .hint{font-size:12px; color:var(--ink-faint); margin-top:7px;}
.input, textarea.input{
  width:100%; min-width:0; border:1px solid var(--rule); background:var(--paper); color:var(--ink);
  border-radius:var(--r-md); padding:12px 14px; font-size:16px; font-family:inherit;
  min-height:var(--tap);
}
/* iOS gives date inputs an intrinsic min-content width based on the native
   picker text, which is wider than half this card at phone widths — without
   these it blows the grid out and the whole page scrolls sideways. */
input[type="date"].input{
  appearance:none; -webkit-appearance:none;
  display:block; width:100%; min-width:0;
  font-family:var(--f-mono); font-size:14px;
}
textarea.input{min-height:88px; resize:vertical; line-height:1.6;}
.input:focus, textarea.input:focus{outline:2px solid var(--accent);outline-offset:-1px;border-color:transparent;}
.daterow{display:grid; grid-template-columns:minmax(0,1fr) minmax(0,1fr); gap:10px;}
.daterow > *{min-width:0;}

.suggest{
  position:absolute; left:0; right:0; top:calc(100% + 6px); z-index:5;
  background:var(--surface); border:1px solid var(--rule); border-radius:var(--r-md);
  box-shadow:var(--shadow-2); overflow:hidden;
}
.suggest button{
  display:block; width:100%; text-align:left; padding:12px 14px; border:0; background:transparent;
  border-bottom:1px solid var(--rule-soft); cursor:pointer; font-size:14.5px; font-family:inherit;
}
.suggest button:last-child{border-bottom:0;}
.suggest button:hover, .suggest button:focus-visible{background:var(--surface-2);}
.suggest .sub{display:block; font-size:12px; color:var(--ink-faint); margin-top:2px;}

.picked{
  display:flex; align-items:center; gap:7px; margin-top:9px;
  color:var(--ink-soft); font-size:13px;
}
.picked .i{width:14px;height:14px;color:var(--ink-faint);}

.btn{
  display:inline-flex; align-items:center; justify-content:center; gap:7px;
  min-height:var(--tap); padding:0 20px; border-radius:999px; border:1px solid var(--rule);
  background:var(--surface); color:var(--ink); font-size:14px; font-weight:500;
  font-family:inherit; cursor:pointer;
}
.btn .i{width:15px;height:15px;}
.btn:hover{border-color:var(--ink-faint);}
.btn.primary{background:var(--ink); border-color:var(--ink); color:var(--paper);}
.btn.danger{color:var(--danger); border-color:color-mix(in srgb,var(--danger) 30%,transparent); background:transparent;}
.btn.wide{width:100%;}
.btn:disabled{opacity:.45; cursor:not-allowed;}
.btn.primary:disabled{background:var(--ink-faint); border-color:var(--ink-faint);}

.errbox{background:var(--danger-bg); color:var(--danger); border-radius:var(--r-md); padding:13px 15px; font-size:13.5px; line-height:1.65;}

.triplist-head{display:flex; align-items:baseline; justify-content:space-between; margin:0 2px 14px;}
.triplist-head h2{font-family:var(--f-body); font-weight:700; font-size:18px; margin:0; letter-spacing:-.015em;}
.triplist-head .count{font-family:var(--f-mono); color:var(--ink-faint); font-size:11.5px;}
section.triplist{margin-bottom:36px;}
.tripgrid{display:grid; gap:10px;}

/* one row per trip, the accent as a single tick on the left edge */
.tripcard{
  background:var(--surface); border:1px solid var(--rule); border-radius:var(--r-lg);
  padding:16px 18px; position:relative;
  transition:border-color .15s;
}
.tripcard::before{
  content:""; position:absolute; left:0; top:16px; bottom:16px; width:2px;
  border-radius:0 2px 2px 0; background:var(--tc, var(--accent));
}
.tripcard:hover{border-color:var(--ink-faint);}
/* stretched link: covers the card so the whole thing is tappable, but sits
   BELOW the delete button so that button still gets its own clicks */
.tripcard-link{position:absolute; inset:0; z-index:1; border-radius:inherit;}
.tripdel{
  position:absolute; top:10px; right:10px; z-index:2;
  width:32px; height:32px; display:grid; place-items:center;
  border:0; background:transparent; border-radius:var(--r-sm);
  color:var(--ink-faint); cursor:pointer;
}
.tripdel .i{width:16px;height:16px;}
.tripdel:hover{color:var(--danger); background:var(--surface-2);}
.row1{display:flex; align-items:baseline; gap:8px; padding-right:34px;}
.row1 .emoji{font-size:15px; line-height:1;}
.row1 .emoji:empty{display:none;}
.row1 .dest{font-size:16px; font-weight:600; letter-spacing:-.015em;}
.dates{font-family:var(--f-mono); font-size:11.5px; color:var(--ink-faint); margin-top:3px; font-variant-numeric:tabular-nums;}
.name{font-size:13px; color:var(--ink-soft); margin-top:5px;}

.loading, .empty{color:var(--ink-faint); font-size:13.5px; padding:16px 2px;}

.scrim{position:fixed; inset:0; z-index:80; background:color-mix(in srgb,var(--ink) 42%,transparent); backdrop-filter:blur(3px);}
.sheet{
  position:fixed; left:0; right:0; bottom:0; z-index:81; max-width:720px; margin:0 auto;
  background:var(--paper); border-radius:var(--r-xl) var(--r-xl) 0 0; border-top:1px solid var(--rule);
  box-shadow:var(--shadow-2);
  padding:24px 18px calc(24px + env(safe-area-inset-bottom));
  animation:rise .26s cubic-bezier(.2,.8,.3,1);
}
@keyframes rise{from{transform:translateY(14px);opacity:.4;}to{transform:none;opacity:1;}}
.sheet h3{font-size:17px; font-weight:700; margin:0 0 6px; letter-spacing:-.015em;}
.sheet-sub{font-size:13px; color:var(--ink-soft); margin:0 0 16px; line-height:1.65;}
.sheet-btns{display:flex; gap:9px; margin-top:16px;}
.sheet-btns .btn{flex:1;}

@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.001ms !important;transition-duration:.001ms !important;}
}

/* ---------- pull to refresh ----------
   Same badge as trip.html: installed as an app there is no browser chrome
   to pull on, so the gesture has to be ours. */
.ptr{
  position:fixed;left:50%;top:0;z-index:45;
  display:flex;align-items:center;gap:7px;
  padding:7px 14px;border-radius:999px;
  background:var(--surface);border:1px solid var(--rule);
  box-shadow:0 6px 20px rgba(0,0,0,.16);
  font-size:12.5px;color:var(--ink-soft);white-space:nowrap;
  transform:translate(-50%,-150%);
  pointer-events:none;opacity:0;
}
.ptr.settling{transition:transform .28s cubic-bezier(.2,.8,.3,1), opacity .28s;}
.ptr .i{width:15px;height:15px;transform:rotate(90deg);transition:transform .2s;}
.ptr.ready .i{transform:rotate(-90deg);}
.ptr.busy .i{transform:none;animation:ptrspin .8s linear infinite;}
@keyframes ptrspin{to{transform:rotate(360deg);}}
@media (prefers-reduced-motion: reduce){
  .ptr.busy .i{animation:none;}
  .ptr.settling{transition:none;}
}

/* ============================================================
   BOARDING PASS — the home page's identity.
   DumboFly is named like an airline and every trip leaves from
   Hong Kong, so a trip is a pass: airport codes set large in
   condensed Archivo, a tear-off stub for the dates, a countdown.
   Everything else stays quiet: one surface, hairlines, no emoji.
   ============================================================ */
:root{ --gold:#A8740C; --stock:#FFFFFF; }
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){ --gold:#E2B24A; --stock:#171D1C; } }
:root[data-theme="dark"]{ --gold:#E2B24A; --stock:#171D1C; }
:root[data-theme="navy"]{ --gold:#E8BC57; --stock:#152036; }

.brandmark{font-family:'Archivo',sans-serif;font-stretch:75%;font-weight:800;font-size:17px;
  letter-spacing:.08em;text-transform:uppercase;}
.brandmark .i{color:var(--gold);}

.hero{padding:10px 2px 26px;}
.hero-from{font-family:'Archivo',var(--f-body);font-stretch:80%;font-weight:700;font-size:12px !important;
  letter-spacing:.14em;color:var(--gold) !important;margin:0 0 10px !important;}
.hero h1{font-weight:800;font-size:clamp(30px,8.6vw,44px);letter-spacing:-.03em;line-height:1.15;}
.hero p{font-size:14.5px;line-height:1.7;}

/* the form as a booking panel: cells divided by hairlines, borderless inputs */
.formcard{padding:0;overflow:hidden;background:var(--stock);border:1px solid var(--rule);
  border-radius:22px;box-shadow:var(--shadow-2);}
.formcard .field{margin:0;padding:14px 18px 12px;border-bottom:1px solid var(--rule);}
.formcard .field label{font-size:11px;font-weight:600;letter-spacing:.08em;color:var(--ink-faint);margin-bottom:2px;}
.formcard .input{border:0;background:transparent;padding:4px 0;min-height:36px;border-radius:0;font-size:17px;font-weight:600;}
.formcard textarea.input{font-size:15px;font-weight:400;min-height:64px;}
.formcard .input:focus{outline:none;}
.formcard .field:focus-within{background:color-mix(in srgb,var(--gold) 7%,transparent);}
.formcard .field:focus-within label{color:var(--gold);}
.formcard .daterow{gap:0;margin:-14px -18px -12px;}
.formcard .daterow > div{padding:14px 18px 12px;}
.formcard .daterow > div + div{border-left:1px solid var(--rule);}
.formcard input[type="date"].input{font-family:'Archivo',var(--f-body);font-stretch:85%;font-size:17px;font-weight:700;}
.formcard .hint{margin-top:2px;}
.formcard #form-err:not(:empty){padding:12px 18px 0;}
.formcard #f-go{margin:16px 18px 18px;width:calc(100% - 36px);}
.formcard .suggest{left:12px;right:12px;}
.btn.primary{background:var(--gold);border-color:var(--gold);color:#14110A;font-weight:700;letter-spacing:.02em;}
.btn.primary:disabled{background:var(--surface-2);border-color:var(--surface-2);color:var(--ink-faint);}

.triplist-head h2{font-size:13px;font-weight:700;letter-spacing:.1em;color:var(--ink-soft);}
.triplist-head .count{font-family:'Archivo',var(--f-body);font-stretch:80%;font-weight:700;}
.tripgrid{gap:14px;}

.pass{position:relative;background:var(--stock);border-radius:20px;
  box-shadow:0 0 0 1px var(--rule),var(--shadow-1);transition:transform .18s ease,box-shadow .18s ease;}
.pass:hover{transform:translateY(-2px);box-shadow:0 0 0 1px var(--ink-faint),var(--shadow-2);}
.pass:active{transform:scale(.99);}
.pass-link{position:absolute;inset:0;z-index:1;border-radius:inherit;}
.pass-link:focus-visible{outline:2px solid var(--gold);outline-offset:3px;}
.pass .tripdel{top:12px;right:12px;opacity:.55;}
.pass .tripdel:hover{opacity:1;}

.pass-main{padding:18px 20px 18px;}
.pass-route{display:grid;grid-template-columns:auto 1fr auto;align-items:end;gap:12px;padding-right:28px;}
.pass-pt{display:flex;flex-direction:column;min-width:0;}
.pass-pt.to{text-align:right;align-items:flex-end;}
.pass-code{font-family:'Archivo',var(--f-disp);font-stretch:75%;font-weight:800;
  font-size:44px;line-height:.92;letter-spacing:.01em;color:var(--ink-soft);}
.pass-pt.to .pass-code{color:var(--ink);}
.pass-city{font-size:12px;color:var(--ink-faint);margin-top:6px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:9em;}
.pass-flight{position:relative;height:30px;margin-bottom:22px;color:var(--tc);}
.pass-arc{position:absolute;left:0;right:0;bottom:4px;height:22px;
  border-top:1.5px dashed color-mix(in srgb,var(--tc) 70%,transparent);border-radius:50% 50% 0 0 / 100% 100% 0 0;}
.pass-flight .i{position:absolute;left:50%;top:-4px;width:18px;height:18px;transform:translateX(-50%) rotate(90deg);
  background:var(--stock);padding:0 2px;box-sizing:content-box;}
.pass-name{margin:16px 0 0;font-size:15px;font-weight:700;letter-spacing:-.01em;line-height:1.4;}

/* the perforation: a dashed rule with a notch bitten out of each edge */
.pass-stub{position:relative;display:grid;grid-template-columns:repeat(3,auto) 1fr;align-items:end;gap:6px 22px;
  padding:16px 20px 16px;border-top:1.5px dashed var(--rule);}
.pass-stub::before,.pass-stub::after{content:"";position:absolute;top:-10px;width:20px;height:20px;border-radius:50%;
  background:var(--paper);box-shadow:inset 0 0 0 1px var(--rule);}
.pass-stub::before{left:-10px;clip-path:inset(0 0 0 50%);}
.pass-stub::after{right:-10px;clip-path:inset(0 50% 0 0);}
.pass-cell{display:flex;flex-direction:column;}
.pass-lbl{font-size:10.5px;font-weight:600;letter-spacing:.1em;color:var(--ink-faint);}
.pass-cell b{font-family:'Archivo',var(--f-body);font-stretch:78%;font-weight:800;font-size:22px;line-height:1.1;
  font-variant-numeric:tabular-nums;margin-top:2px;}
.pass-cell small{font-size:11px;color:var(--ink-faint);}
.pass-status{justify-self:end;align-self:center;font-size:12px;font-weight:700;padding:5px 11px;border-radius:999px;
  color:var(--tc);background:color-mix(in srgb,var(--tc) 13%,transparent);white-space:nowrap;}
.pass.live .pass-status{color:#14110A;background:var(--gold);}
.pass.done .pass-status{color:var(--ink-faint);background:var(--surface-2);}
.pass.done .pass-code,.pass.done .pass-pt.to .pass-code{color:var(--ink-faint);}
.pass.done .pass-flight{color:var(--ink-faint);}
.pass.done .pass-arc{border-top-color:var(--rule);}

@media (max-width:360px){
  .pass-code{font-size:36px;}
  .pass-stub{gap:6px 16px;}
}
@media (prefers-reduced-motion:reduce){ .pass,.pass:hover{transform:none;transition:none;} }

.formcard .datecell{position:relative;}
.formcard .dateph{display:none;position:absolute;left:18px;right:18px;bottom:14px;pointer-events:none;
  align-items:center;justify-content:space-between;font-size:17px;font-weight:600;color:var(--ink-faint);}
.formcard .dateph::after{content:"";width:18px;height:18px;border:1.5px solid currentColor;border-radius:4px;
  box-shadow:inset 0 4px 0 -1.5px currentColor;opacity:.7;}
.formcard .datecell.empty .dateph{display:flex;}
.formcard .datecell.empty input[type="date"].input{color:transparent;}
.formcard .datecell.empty input[type="date"].input::-webkit-calendar-picker-indicator{opacity:0;}

/* ---------- import ---------- */
.importcta{display:flex;align-items:center;gap:14px;width:100%;margin:-24px 0 40px;padding:16px 18px;cursor:pointer;
  text-align:left;color:var(--ink);background:transparent;border:1.5px dashed var(--rule);border-radius:20px;font-family:inherit;}
.importcta:hover{border-color:var(--gold);}
.importcta-i{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;flex:0 0 auto;
  background:color-mix(in srgb,var(--gold) 14%,transparent);color:var(--gold);}
.importcta-i .i{width:20px;height:20px;}
.importcta-t{display:flex;flex-direction:column;min-width:0;flex:1;}
.importcta-t b{font-size:15px;font-weight:700;}
.importcta-t small{font-size:12.5px;color:var(--ink-soft);line-height:1.5;margin-top:2px;}
.importcta-go{color:var(--ink-faint);}
.importcta-go .i{width:16px;height:16px;}
.importsheet{max-height:88vh;overflow-y:auto;}
.sheet-x{position:absolute;top:14px;right:14px;width:34px;height:34px;border-radius:50%;border:0;background:var(--surface-2);
  display:grid;place-items:center;cursor:pointer;color:var(--ink-soft);}
.sheet-x .i{width:16px;height:16px;}
.dropzone{display:flex;flex-direction:column;align-items:center;gap:4px;padding:26px 16px;border:1.5px dashed var(--rule);
  border-radius:18px;cursor:pointer;text-align:center;background:var(--stock);}
.dropzone:hover,.dropzone:focus-within{border-color:var(--gold);}
.dropzone input{position:absolute;width:1px;height:1px;opacity:0;}
.dz-i{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;margin-bottom:4px;
  background:color-mix(in srgb,var(--gold) 14%,transparent);color:var(--gold);}
.dz-i .i{width:22px;height:22px;}
.dropzone b{font-size:15px;}
.dropzone small{font-size:12px;color:var(--ink-faint);}
.impfiles{display:flex;flex-wrap:wrap;gap:6px;margin:10px 0 0;}
.impfile{display:inline-flex;align-items:center;gap:6px;max-width:100%;padding:5px 6px 5px 10px;border-radius:999px;
  background:var(--surface-2);font-size:12.5px;}
.impfile > span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:200px;}
.impfile .i{width:14px;height:14px;color:var(--ink-faint);}
.impfile button{border:0;background:transparent;cursor:pointer;color:var(--ink-faint);display:grid;place-items:center;padding:2px;}
.imppaste{margin-top:12px;font-size:13px;color:var(--ink-soft);}
.imppaste summary{cursor:pointer;padding:6px 0;}
.imppaste textarea{margin-top:6px;}
#imp-err:not(:empty),#imp-err2:not(:empty){margin-top:12px;}
.impform{margin:4px 0 14px;box-shadow:none;}
.impend{font-family:'Archivo',var(--f-body);font-stretch:85%;font-size:17px;font-weight:700;padding:4px 0;min-height:36px;color:var(--ink-soft);}
.impnote{font-size:12.5px;line-height:1.6;color:var(--warn);background:color-mix(in srgb,var(--warn) 10%,transparent);
  border-radius:12px;padding:10px 12px;margin-bottom:12px;}
.impdays{list-style:none;margin:0 0 12px;padding:0;display:flex;flex-direction:column;gap:8px;}
.impdays li{background:var(--stock);border:1px solid var(--rule-soft);border-radius:14px;padding:12px 14px;}
.impday-h{display:flex;align-items:center;gap:10px;}
.impday-n{width:24px;height:24px;border-radius:50%;display:grid;place-items:center;flex:0 0 auto;background:var(--gold);color:#14110A;
  font-family:'Archivo',sans-serif;font-stretch:75%;font-weight:800;font-size:13px;}
.impday-h b{font-size:14.5px;flex:1;min-width:0;}
.impday-h small{font-size:11.5px;color:var(--ink-faint);white-space:nowrap;}
.impday-s{display:flex;flex-wrap:wrap;gap:4px 12px;margin-top:6px;padding-left:34px;font-size:12.5px;color:var(--ink-soft);}
.impday-s em{font-style:normal;font-family:'Archivo',sans-serif;font-stretch:82%;font-weight:700;color:var(--ink-faint);margin-right:5px;}
.impday-s .isnote{color:var(--ink-faint);}
.spin{width:14px;height:14px;border-radius:50%;border:2px solid currentColor;border-right-color:transparent;display:inline-block;
  animation:ptrspin .7s linear infinite;margin-right:6px;vertical-align:-2px;}
/* the elephant — a flat grey calf with a thin ink line, like a picture book */
.eleload{display:flex;flex-direction:column;align-items:center;gap:6px;padding:14px 8px 10px;text-align:center;}
.eleload > span{font-size:13px;color:var(--ink-soft);line-height:1.5;}
.eleload.small{flex-direction:row;padding:6px 0;gap:10px;text-align:left;}
.eleload.small .ele{width:58px;height:46px;flex:none;}
.ele{width:120px;height:96px;overflow:visible;--ele-line:#3E454E;}
.ele-body,.ele-skull,.ele-leg{fill:#B9C0C8;stroke:var(--ele-line);stroke-width:1.6;}
.ele-leg.back{fill:#A3ABB4;}
.ele-ear{fill:#A3ABB4;stroke:var(--ele-line);stroke-width:1.6;stroke-linejoin:round;}
.ele-trunk-line{fill:none;stroke:var(--ele-line);stroke-width:11.2;stroke-linecap:round;}
.ele-trunk-fill{fill:none;stroke:#B9C0C8;stroke-width:8;stroke-linecap:round;}
.ele-eye{fill:var(--ele-line);}
.ele-brow,.ele-tail{fill:none;stroke:var(--ele-line);stroke-width:1.6;stroke-linecap:round;}
.ele-ground{fill:none;stroke:var(--ink-faint);stroke-width:1.4;stroke-linecap:round;}
.ele-lens circle{fill:#FFFFFF;fill-opacity:.55;stroke:var(--ele-line);stroke-width:1.8;}
.ele-lens path{stroke:var(--ele-line);stroke-width:3;stroke-linecap:round;}
.ele-mapsheet path:first-child{fill:#F4EBD7;stroke:var(--ele-line);stroke-width:1.4;stroke-linejoin:round;}
.ele-route{fill:none;stroke:#D2564C;stroke-width:1.6;stroke-dasharray:3 2;}
.ele-ear{transform-box:fill-box;transform-origin:15% 30%;}
.ele-trunk{transform-box:fill-box;transform-origin:70% 0;}
.ele-head{transform-box:fill-box;transform-origin:70% 85%;}
.ele-leg{transform-box:fill-box;transform-origin:50% 0;}
/* sniff: trotting, trunk sweeping a magnifying glass */
.ele-sniff .ele-all{animation:ele-trot .9s ease-in-out infinite;}
.ele-sniff .ele-trunk{animation:ele-sweep 1.8s ease-in-out infinite;}
.ele-sniff .l1,.ele-sniff .l2{animation:ele-step .9s ease-in-out infinite;}
.ele-sniff .l3,.ele-sniff .l4{animation:ele-step .9s ease-in-out infinite reverse;}
/* fly: ears flapping, floating up and down */
.ele-fly .ele-all{animation:ele-float 1.6s ease-in-out infinite;}
.ele-fly .ele-ear{animation:ele-flap .32s ease-in-out infinite alternate;}
/* map: head tilting over a map, the route drawing itself */
.ele-map .ele-head{animation:ele-tilt 2.4s ease-in-out infinite;}
.ele-map .ele-route{animation:ele-dash 1.2s linear infinite;}
@keyframes ele-trot{0%,100%{transform:translateY(0)}50%{transform:translateY(-2px)}}
@keyframes ele-step{0%,100%{transform:rotate(8deg)}50%{transform:rotate(-8deg)}}
@keyframes ele-sweep{0%,100%{transform:rotate(-8deg)}50%{transform:rotate(12deg)}}
@keyframes ele-float{0%,100%{transform:translateY(0)}50%{transform:translateY(-10px)}}
@keyframes ele-flap{from{transform:rotate(0deg)}to{transform:rotate(-22deg)}}
@keyframes ele-tilt{0%,100%{transform:rotate(0)}30%{transform:rotate(-8deg)}60%{transform:rotate(4deg)}}
@keyframes ele-dash{to{stroke-dashoffset:-10}}
@media (prefers-reduced-motion:reduce){.ele *{animation:none !important;}}
.loading .eleload,.empty .eleload{margin:20px auto;}
</style>
</head>
<body>

<header class="topbar">
  <div class="topbar-inner">
    <div class="brandmark"><span class="brand-i"></span>DumboFly</div>
    <button class="iconbtn" id="btn-theme" aria-label="切換深淺色" title="切換深淺色"><span class="theme-i"></span></button>
  </div>
</header>

<div class="ptr" id="ptr" aria-hidden="true"><span class="ptr-i"></span><span class="ptr-t"></span></div>
<div id="layer"></div>

<main class="wrap">
  <div class="hero">
    <p class="hero-from">由香港出發</p>
    <h1>今次想去邊度？</h1>
    <p>揀目的地同日期，AI 由零砌一個完整行程：天氣、住宿、地圖都齊。</p>
  </div>

  <div class="card formcard">
    <div class="field">
      <label for="f-dest">目的地</label>
      <input class="input" id="f-dest" autocomplete="off" placeholder="例如：東京、大阪、台北…">
      <div id="dest-suggest"></div>
      <div id="dest-picked"></div>
    </div>
    <div class="field">
      <div class="daterow">
        <div class="datecell empty"><label for="f-start">出發</label><input class="input mono" type="date" id="f-start"><span class="dateph" aria-hidden="true">揀日子</span></div>
        <div class="datecell empty"><label for="f-end">回程</label><input class="input mono" type="date" id="f-end"><span class="dateph" aria-hidden="true">揀日子</span></div>
      </div>
    </div>
    <div class="field">
      <label for="f-req">有咩要求？</label>
      <textarea class="input" id="f-req" placeholder="例如：3個大人1個小朋友、想輕鬆啲唔好行太多路、預算中等、鍾意食海鮮…"></textarea>
      <div class="hint">留空都得，AI 會自己睇住辦。</div>
    </div>
    <div id="form-err"></div>
    <button class="btn primary wide" id="f-go">開始規劃</button>
  </div>

  <button class="importcta" id="btn-import" type="button">
    <span class="importcta-i"></span>
    <span class="importcta-t"><b>已經有行程？</b><small>導入 Excel、CSV 或者截圖，AI 幫你排返入每一日</small></span>
    <span class="importcta-go"></span>
  </button>

  <section class="triplist">
    <div class="triplist-head"><h2>未去嘅行程</h2><span class="count" id="upcount"></span></div>
    <div class="tripgrid" id="upcoming"><div class="loading" id="bootload">載入緊…</div></div>
  </section>

  <section class="triplist">
    <div class="triplist-head"><h2>去過嘅行程</h2><span class="count" id="pastcount"></span></div>
    <div class="tripgrid" id="past"></div>
  </section>
</main>

<script>
(function(){
  "use strict";

  // An installed app relaunched by iOS lands here, at its start URL, even if
  // the family was halfway through a day a minute ago. Send it back there —
  // but only in the installed app, only if it was recent, and never after the
  // 主頁 button was pressed (that clears the note), so this page is still
  // reachable on purpose.
  try {
    const standalone = (window.matchMedia && matchMedia("(display-mode: standalone)").matches) || navigator.standalone === true;
    const r = JSON.parse(localStorage.getItem("dumbofly_resume") || "null");
    if (standalone && r && r.trip && Date.now() - r.t < 12 * 3600 * 1000 && !/[?&]home=1/.test(location.search)) {
      location.replace("trip.html?trip=" + encodeURIComponent(r.trip));
      return;
    }
  } catch (_){}

  // ---------- config (same project as trip.html; no shared JS module in
  // this app, each page is self-contained by convention) ----------
  const SUPABASE_URL = "https://aczykqleoamxdekfsgqh.supabase.co";
  const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImFjenlrcWxlb2FteGRla2ZzZ3FoIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODQ4ODU0MjUsImV4cCI6MjEwMDQ2MTQyNX0.Iv8diOTpiKO0LzAUMcDXaP_3HBAP4PyYGNgosGtgjCA";
  const FUNCTIONS_URL = SUPABASE_URL + "/functions/v1/ai-assistant";
  // the same signage-weight hues the trip page uses for its days, so a trip's
  // colour here is the colour it keeps once you open it
  // The same six line colours trip.html gives its days — ginkgo, maple,
  // pine, autumn sky, persimmon, plum — so a trip wears one identity from
  // the list straight through to its itinerary.
  const CARD_PALETTE = ["#C08A00","#BE3E28","#2A7355","#2665A0","#C4651A","#6F4682"];

  function sbHeaders(extra){
    return Object.assign({
      "apikey": SUPABASE_ANON_KEY,
      "Authorization": "Bearer " + SUPABASE_ANON_KEY,
      "Content-Type": "application/json"
    }, extra || {});
  }
  const EMOJI_RE = /(?:[\u{1F000}-\u{1FAFF}\u{2600}-\u{27BF}\u{2B00}-\u{2BFF}\u{231A}-\u{23FF}\u{1F1E6}-\u{1F1FF}][\u{FE0F}\u{1F3FB}-\u{1F3FF}]?\u{200D}?)+[ \u3000]?/gu;
  function esc(s){
    return String(s == null ? "" : s).replace(EMOJI_RE, "").replace(/\u{FE0F}/gu, "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
  }

  // Same icon set as trip.html — 1.5px strokes on a 24 grid, currentColor, so
  // an icon takes the colour and weight of the text it sits in. Emoji could
  // do none of that and rendered differently on every device.
  const ICONS = {
    plane: '<path d="M10.4 3.4a1.6 1.6 0 0 1 3.2 0V9l7 4.1v2.3l-7-2.1v3.9l2.3 1.7v1.5L12 19.6l-3.9.8v-1.5l2.3-1.7v-3.9l-7 2.1v-2.3l7-4.1z"/>',
    contrast: '<circle cx="12" cy="12" r="8.2"/><path d="M12 3.8a8.2 8.2 0 0 1 0 16.4z" fill="currentColor" stroke="none"/>',
    upload: '<path d="M12 15.5V4.5"/><path d="m7.5 9 4.5-4.5L16.5 9"/><path d="M4.5 15v3.2a1.8 1.8 0 0 0 1.8 1.8h11.4a1.8 1.8 0 0 0 1.8-1.8V15"/>',
    sheet: '<rect x="4" y="3.5" width="16" height="17" rx="2"/><path d="M4 9h16M4 14.5h16M10 3.5v17"/>',
    image: '<rect x="3.5" y="4.5" width="17" height="15" rx="2"/><circle cx="9" cy="10" r="1.7"/><path d="m4 18 5.2-5.2 3.3 3.3 2.5-2.5L20 18.6"/>',
    x: '<path d="m6.5 6.5 11 11M17.5 6.5l-11 11"/>',
    pin: '<path d="M12 21s6.4-6.1 6.4-10.6a6.4 6.4 0 1 0-12.8 0C5.6 14.9 12 21 12 21z"/><circle cx="12" cy="10.3" r="2.4"/>',
    trash: '<path d="M4.8 6.8h14.4"/><path d="M9.3 6.8V4.9h5.4v1.9"/><path d="M6.6 6.8 7.5 20h9l.9-13.2"/>',
    // the app's own mark: an elephant in profile, one stroke, matching the icon
    dumbo: '<path d="M7.4 13V10.6a3.8 3.8 0 0 1 3.9-3.9h1a3.8 3.8 0 0 1 3.8 3.9V16a4 4 0 0 1-4.1 3.6c-1.9-.5-2.6-2.6-1.2-3.8 1-.7 2.2-.5 2.7.4"/><circle cx="9.4" cy="11.1" r="1.1" fill="currentColor" stroke="none"/>',
    chevron: '<path d="m9 5.6 6.4 6.4L9 18.4"/>',
    refresh: '<path d="M19.3 12a7.3 7.3 0 1 1-2.2-5.2"/><path d="M19.6 4.8v4.4h-4.4"/>',
    check: '<path d="m5 12.6 4.6 4.4L19 6.8"/>',
  };
  function icon(name){
    const d = ICONS[name];
    return d ? `<svg class="i" viewBox="0 0 24 24" aria-hidden="true" focusable="false">${d}</svg>` : "";
  }
  // When fetch can't reach the server at all it rejects with a TypeError whose
  // message is whatever the browser feels like ("Load failed" on Safari,
  // "Failed to fetch" on Chrome) — which tells the family nothing. The most
  // common real cause is the free-tier database auto-pausing after a week with
  // no traffic, so say that instead. Server-side errors keep their own message,
  // which already names the status code.
  function netMsg(e){
    return (e instanceof TypeError)
      ? "連唔到伺服器。可能係個資料庫暫時瞓着咗（免費方案冇人用夠一個星期就會自動暫停），等一兩分鐘再試下。"
      : e.message;
  }
  const $ = sel => document.querySelector(sel);

  // ---------- theme (shares the same toggle/localStorage key as trip.html) ----------
  // Shares the stored preference with trip.html, so the cycle and the names
  // have to match it exactly or the two pages disagree about what you picked.
  const THEMES = ["auto", "light", "dark", "navy"];
  const THEME_BAR = { light:"#F1F3EF", dark:"#0E1211", navy:"#0C1420" };
  function setThemeBar(t){
    let m = document.getElementById("theme-bar");
    if (t === "auto" || !THEME_BAR[t]){ if (m) m.remove(); return; }
    if (!m){
      m = document.createElement("meta");
      m.id = "theme-bar"; m.name = "theme-color";
      document.head.insertBefore(m, document.head.firstChild);
    }
    m.content = THEME_BAR[t];
  }
  function applyTheme(t){
    if (t === "auto") document.documentElement.removeAttribute("data-theme");
    else document.documentElement.setAttribute("data-theme", t);
    setThemeBar(t);
    localStorage.setItem("seoul_theme", t);
  }
  // the chrome's icons ship as empty spans so the SVG lives in one place
  (function paintChromeIcons(){
    const brand = document.querySelector(".brandmark .brand-i");
    if (brand) brand.innerHTML = icon("dumbo");
    const theme = document.querySelector("#btn-theme .theme-i");
    if (theme) theme.innerHTML = icon("contrast");
  })();

  applyTheme(localStorage.getItem("seoul_theme") || "auto");
  $("#btn-theme").addEventListener("click", () => {
    const cur = localStorage.getItem("seoul_theme") || "auto";
    applyTheme(THEMES[(THEMES.indexOf(cur) + 1 + THEMES.length) % THEMES.length]);
  });

  // ---------- AI edge function ----------
  async function callAi(payload){
    const res = await fetch(FUNCTIONS_URL, { method:"POST", headers: sbHeaders(), body: JSON.stringify(payload) });
    return res.json();
  }

  // ==================================================================
  // Destination picker — free text -> place-search -> pick one result
  // ==================================================================
  let picked = null;   // { name, address, lat, lng }
  let searchSeq = 0;
  const destInput = $("#f-dest");
  const suggestBox = $("#dest-suggest");
  const pickedBox = $("#dest-picked");
  let debounceTimer = null;

  function renderPicked(){
    pickedBox.innerHTML = picked
      ? `<div class="picked">${icon("pin")}已揀：${esc(picked.name)}${picked.address ? "・" + esc(picked.address) : ""}</div>`
      : "";
    updateGoState();
  }
  function clearSuggest(){ suggestBox.innerHTML = ""; }

  destInput.addEventListener("input", () => {
    picked = null;
    renderPicked();
    clearTimeout(debounceTimer);
    const q = destInput.value.trim();
    if (q.length < 2){ clearSuggest(); return; }
    debounceTimer = setTimeout(() => runSearch(q), 380);
  });
  destInput.addEventListener("blur", () => setTimeout(clearSuggest, 150));

  async function runSearch(q){
    const seq = ++searchSeq;
    let r;
    try { r = await callAi({ action:"place-search", query:q }); }
    catch (e){ return; }
    if (seq !== searchSeq) return;   // a newer keystroke already superseded this
    const places = (r && r.places) || [];
    if (!places.length){ clearSuggest(); return; }
    suggestBox.innerHTML = `<div class="suggest">${places.slice(0,6).map((p,i) =>
      `<button type="button" data-pick="${i}">${esc(p.name)}${p.address ? `<span class="sub">${esc(p.address)}</span>` : ""}</button>`
    ).join("")}</div>`;
    suggestBox.querySelectorAll("[data-pick]").forEach(btn => btn.addEventListener("mousedown", e => {
      e.preventDefault();
      const p = places[+btn.dataset.pick];
      picked = { name:p.name, address:p.address||"", lat:p.lat, lng:p.lng };
      destInput.value = p.name;
      clearSuggest();
      renderPicked();
    }));
  }

  // ==================================================================
  // Form -> create trip -> navigate
  // ==================================================================
  const startInput = $("#f-start");
  const endInput = $("#f-end");
  const reqInput = $("#f-req");
  const goBtn = $("#f-go");
  const errBox = $("#form-err");

  function todayIso(){ return new Date().toISOString().slice(0,10); }
  startInput.min = todayIso();
  startInput.addEventListener("change", () => { endInput.min = startInput.value || todayIso(); updateGoState(); });
  endInput.addEventListener("change", updateGoState);

  // An empty date input on iOS draws nothing at all, so with the borders gone
  // the two cells looked blank. A placeholder sits in the cell until a date is picked.
  function syncDatePh(){
    [startInput, endInput].forEach(el => el.parentElement.classList.toggle("empty", !el.value));
  }
  [startInput, endInput].forEach(el => { el.addEventListener("input", syncDatePh); el.addEventListener("change", syncDatePh); });
  setTimeout(syncDatePh, 0);
  function updateGoState(){
    const ok = !!picked && !!startInput.value && !!endInput.value && endInput.value >= startInput.value;
    goBtn.disabled = !ok;
  }
  updateGoState();

  // day.date is a hand-authored "10月24日（六）" style label, not ISO — this
  // is what trip.html's weekday-closure check (weekdayCharOfDate) parses,
  // so a fresh trip's skeleton has to match that shape exactly.
  const WD = ["日","一","二","三","四","五","六"];
  function dateLabel(d){ return `${d.getMonth()+1}月${d.getDate()}日（${WD[d.getDay()]}）`; }
  function buildDaySkeleton(dateStart, dateEnd){
    const days = [];
    const cur = new Date(dateStart + "T00:00:00");
    const end = new Date(dateEnd + "T00:00:00");
    let n = 1;
    while (cur <= end){
      days.push({
        id: "day" + n, num: "DAY " + n, date: dateLabel(cur), title: "第 " + n + " 日",
        desc: "", shortTag: "", badges: [], items: [], mapPoints: null, mapCap: ""
      });
      cur.setDate(cur.getDate() + 1);
      n++;
    }
    return days;
  }
  function formatEyebrow(dateStart, dateEnd){
    const [ , sm, sd] = dateStart.split("-");
    const [sy, em, ed] = dateEnd.split("-");
    return `${sm}.${sd} — ${em}.${ed} · ${sy}`;
  }

  goBtn.addEventListener("click", async () => {
    if (goBtn.disabled) return;
    errBox.innerHTML = "";
    goBtn.disabled = true;
    goBtn.textContent = "開緊行程…";
    try {
      const destinationLocal = picked.name;
      const dateStart = startInput.value, dateEnd = endInput.value;
      const requirements = reqInput.value.trim();
      const days = buildDaySkeleton(dateStart, dateEnd);

      // 1) create the trip row
      const tripRes = await fetch(`${SUPABASE_URL}/rest/v1/trips`, {
        method: "POST",
        headers: sbHeaders({ "Prefer": "return=representation" }),
        body: JSON.stringify({
          name: destinationLocal + " 行程",
          destination_local: destinationLocal,
          lat: Number.isFinite(picked.lat) ? picked.lat : null,
          lng: Number.isFinite(picked.lng) ? picked.lng : null,
          date_start: dateStart, date_end: dateEnd,
          cover_emoji: "",
        }),
      });
      if (!tripRes.ok) throw new Error("開唔到新行程 " + tripRes.status);
      const trip = (await tripRes.json())[0];

      // 2) seed the first snapshot — meta/tripBrief/eyebrow/facts must all be
      // set explicitly and non-empty here: trip.html's normalizeSnapshot()
      // and its hero fallback constants (DEFAULT_EYEBROW/DEFAULT_FACTS/
      // DEFAULT_BRIEF) are Seoul-specific, and only backfill a field that is
      // still null/empty — leaving any of these blank would silently show
      // (or reason about) the Seoul trip's dates/family/brief instead.
      const snapshot = {
        meta: {
          destinationLocal, lat: picked.lat, lng: picked.lng, dateStart, dateEnd,
          title: destinationLocal + " 行程",
          eyebrow: formatEyebrow(dateStart, dateEnd),
          facts: [days.length + " 日行程"],
          hotelTags: [],
        },
        tripBrief: `你係一個廣東話（香港口語）旅遊助理，幫緊去 ${destinationLocal}` +
          `（${dateStart} 至 ${dateEnd}）嘅一次旅行。${requirements || ""}`,
        days,
        // Two of trip.html's fixed overview blocks only make sense for some
        // trips: the seasonal note, and the accessibility legend (which came
        // from one family's specific needs). A new trip starts with both
        // hidden — nothing is deleted, and 主頁最底 has a 「顯示返」 for each.
        // …unless the requirements themselves ask for it
        hiddenSections: /輪椅|長者|老人|行動不便|拐杖|BB ?車|嬰兒車|手推車|無障礙|唔好行樓梯|膝頭/i.test(requirements)
          ? ["foliage"] : ["foliage", "access"],
      };
      const verRes = await fetch(`${SUPABASE_URL}/rest/v1/itinerary_versions`, {
        method: "POST",
        headers: sbHeaders(),
        body: JSON.stringify({ trip_id: trip.id, edited_by: "家人", source: "seed", summary: "開新行程", snapshot }),
      });
      if (!verRes.ok) throw new Error("儲存唔到初始行程 " + verRes.status);

      // 3) hand off to trip.html, which auto-generates the blank days on
      // load — it reads the requirements straight off tripBrief (already
      // seeded above and sent on every AI call automatically), no need to
      // pass them again via the URL.
      location.href = "trip.html?" + new URLSearchParams({ trip: trip.id, new: "1" }).toString();
    } catch (e){
      errBox.innerHTML = `<div class="errbox">${esc(e.message || "出咗問題，試多次啦。")}</div>`;
      goBtn.disabled = false;
      goBtn.textContent = "開始規劃";
    }
  });

  // IMPORT — an itinerary the family already has (Excel / CSV / screenshots)
  // The spreadsheet is turned into text here in the browser; pictures are

  const IMPORT_URL = SUPABASE_URL + "/functions/v1/trip-import";
  let importFiles = [];
  function loadScript(src){
    return new Promise((ok, bad) => {
      const el = document.createElement("script");
      el.src = src; el.onload = ok; el.onerror = () => bad(new Error("載入唔到讀 Excel 嘅工具，檢查吓網絡。"));
      document.head.appendChild(el);
    });
  }
  async function sheetToText(file){
    if (/\.(csv|txt|tsv)$/i.test(file.name)) return await file.text();
    if (!window.XLSX) await loadScript("https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js");
    const wb = window.XLSX.read(await file.arrayBuffer(), { type: "array", cellDates: true });
    return wb.SheetNames.map(n => {
      const csv = window.XLSX.utils.sheet_to_csv(wb.Sheets[n], { blankrows: false, dateNF: "yyyy-mm-dd" });
      return csv.trim() ? `# 工作表：${n}\n${csv}` : "";
    }).filter(Boolean).join("\n\n");
  }
  async function imageToPart(file){
    const url = URL.createObjectURL(file);
    try {
      const img = await new Promise((ok, bad) => { const i = new Image(); i.onload = () => ok(i); i.onerror = () => bad(new Error(`開唔到「${file.name}」呢張圖。`)); i.src = url; });
      const MAX = 1800, k = Math.min(1, MAX / Math.max(img.naturalWidth, img.naturalHeight));
      const c = document.createElement("canvas");
      c.width = Math.round(img.naturalWidth * k); c.height = Math.round(img.naturalHeight * k);
      c.getContext("2d").drawImage(img, 0, 0, c.width, c.height);
      return { mime: "image/jpeg", data: c.toDataURL("image/jpeg", 0.85).split(",")[1] };
    } finally { URL.revokeObjectURL(url); }
  }

    const d = new Date(isoStr + "T00:00:00"); d.setDate(d.getDate() + n);

  async function createImportedTrip(t, destination, title, dateStart){
    const dateEnd = addDaysIso(dateStart, t.days.length - 1);
    // the destination's own coordinates, so the maps open on the right city
    let lat = null, lng = null;
    try {
      const r = await callAi({ action: "place-search", query: destination });
      const p = r && r.places && r.places[0];
      if (p && Number.isFinite(p.lat)){ lat = p.lat; lng = p.lng; }
    } catch (_){}
    const days = buildDaySkeleton(dateStart, dateEnd);
    t.days.forEach((src, i) => {
      const d = days[i]; if (!d) return;
      if (src.title) d.title = src.title;
      d.items = src.items.map(x => x.kind === "note"
        ? { kind: "note", text: x.title + (x.desc ? "：" + x.desc : "") }
        : { kind: "stop", type: x.type === "eat" ? "eat" : "normal", marker: "", time: x.time, title: x.title, kr: x.kr,
            niecepick: [], desc: x.desc, eatboxHtml: "", eatMeta: [], mapUrl: "", accessBadges: [], tip: x.tip,
            photoUrl: "", placeId: "", lat: null, lng: null });
    });
    const stays = t.stays.map(s => ({
      name: s.name, kr: s.kr || "", desc: "", hoursChip: "", warning: "",
      mapUrl: `https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(s.kr || s.name)}`,
      from: (days[Math.min(s.fromDay, days.length) - 1] || days[0]).id,
      to: (days[Math.min(s.toDay, days.length) - 1] || days[days.length - 1]).id,
    }));
    const name = title || destination + " 行程";
    const tripRes = await fetch(`${SUPABASE_URL}/rest/v1/trips`, {
      method: "POST", headers: sbHeaders({ "Prefer": "return=representation" }),
      body: JSON.stringify({ name, destination_local: destination, lat, lng, date_start: dateStart, date_end: dateEnd, cover_emoji: "" }),
    });
    if (!tripRes.ok) throw new Error("開唔到新行程 " + tripRes.status);
    const trip = (await tripRes.json())[0];
    const snapshot = {
      meta: { destinationLocal: destination, lat, lng, dateStart, dateEnd, title: name,
        eyebrow: formatEyebrow(dateStart, dateEnd), facts: [days.length + " 日行程"], hotelTags: [] },
      tripBrief: `你係一個廣東話（香港口語）旅遊助理，幫緊去 ${destination}（${dateStart} 至 ${dateEnd}）嘅一次旅行。行程係由佢哋自己嘅資料導入，盡量保留原本嘅安排。`,
      days, stays, flights: Array.isArray(t.flights) ? t.flights : [],
      hiddenSections: ["foliage", "access"],
    };
    const verRes = await fetch(`${SUPABASE_URL}/rest/v1/itinerary_versions`, {
      method: "POST", headers: sbHeaders(),
      body: JSON.stringify({ trip_id: trip.id, edited_by: "家人", source: "seed", summary: "導入咗行程", snapshot }),
    });
    if (!verRes.ok) throw new Error("儲存唔到導入嘅行程 " + verRes.status);
    return trip.id;
  }

  // ==================================================================
  // Trip list — upcoming vs past
  // ==================================================================
  // The whole card used to be one <a>, so there was nowhere to put an action
  // button (a <button> inside an <a> is invalid and swallows the click). The
  // link is now a stretched overlay and the delete button sits above it.
  // Every trip leaves from Hong Kong, so each one is drawn as a boarding pass:
  // HKG → the destination's airport code, with a tear-off stub for the dates.
  const CITY_CODES = [
    [/首爾|首尔|서울|seoul/i, "SEL", "首爾"], [/東京|东京|tokyo/i, "TYO", "東京"],
    [/台北|臺北|taipei/i, "TPE", "台北"],   [/大阪|osaka/i, "OSA", "大阪"],
    [/京都|kyoto/i, "UKY", "京都"],          [/釜山|부산|busan/i, "PUS", "釜山"],
    [/福岡|fukuoka/i, "FUK", "福岡"],        [/札幌|sapporo|北海道|hokkaido/i, "SPK", "札幌"],
    [/沖繩|沖縄|okinawa/i, "OKA", "沖繩"],    [/名古屋|nagoya/i, "NGO", "名古屋"],
    [/濟州|济州|제주|jeju/i, "CJU", "濟州"],  [/曼谷|bangkok/i, "BKK", "曼谷"],
    [/新加坡|singapore/i, "SIN", "新加坡"],  [/台中|taichung/i, "RMQ", "台中"],
    [/高雄|kaohsiung/i, "KHH", "高雄"],      [/倫敦|london/i, "LON", "倫敦"],
    [/巴黎|paris/i, "PAR", "巴黎"],          [/香港|hong ?kong/i, "HKG", "香港"],
  ];
  function cityOf(t){
    const hay = [t.destination_local, t.name].filter(Boolean).join(" ");
    for (const [re, code, zh] of CITY_CODES) if (re.test(hay)) return { code, zh };
    const latin = String(t.destination_local || t.name || "").replace(/[^A-Za-z]/g, "").toUpperCase();
    return { code: latin.length >= 3 ? latin.slice(0, 3) : "", zh: t.destination_local || "" };
  }
  const WD_SHORT = ["日","一","二","三","四","五","六"];
  function passDate(iso){
    const [y, m, d] = String(iso || "").split("-").map(Number);
    if (!y) return { md: "—", wd: "" };
    return { md: `${String(m).padStart(2,"0")}.${String(d).padStart(2,"0")}`, wd: WD_SHORT[new Date(y, m - 1, d).getDay()] };
  }
  function daysBetween(a, b){
    return Math.round((Date.parse(b + "T00:00:00Z") - Date.parse(a + "T00:00:00Z")) / 86400000);
  }
  function passStatus(t){
    const today = todayIso(), end = t.date_end || t.date_start;
    if (!t.date_start) return { txt: "", cls: "" };
    if (today < t.date_start){
      const n = daysBetween(today, t.date_start);
      return { txt: n === 1 ? "聽日出發" : `${n} 日後出發`, cls: "soon" };
    }
    if (today <= end) return { txt: `旅程中 · 第 ${daysBetween(t.date_start, today) + 1} 日`, cls: "live" };
    return { txt: "已完成", cls: "done" };
  }
  function tripCardHtml(t, i){
    const color = CARD_PALETTE[i % CARD_PALETTE.length];
    const city = cityOf(t);
    const dest = t.destination_local || t.name;
    const a = passDate(t.date_start), b = passDate(t.date_end || t.date_start);
    const nDays = t.date_start ? daysBetween(t.date_start, t.date_end || t.date_start) + 1 : 0;
    const st = passStatus(t);
    return `<article class="pass ${st.cls}" style="--tc:${color}">
      <a class="pass-link" href="trip.html?trip=${t.id}" aria-label="${esc(t.name)}"></a>
      <button class="tripdel" data-del="${t.id}" data-delname="${esc(dest)}" title="刪除呢個行程" aria-label="刪除呢個行程">${icon("trash")}</button>
      <div class="pass-main">

          <div class="pass-flight" aria-hidden="true"><span class="pass-arc"></span>${icon("plane")}</div>
          <div class="pass-pt to"><span class="pass-code">${esc(city.code || dest)}</span><span class="pass-city">${esc(city.zh || dest)}</span></div>
        </div>
        <h3 class="pass-name">${esc(t.name)}</h3>
      </div>
      <div class="pass-stub">
        <div class="pass-cell"><span class="pass-lbl">出發</span><b>${a.md}</b><small>${a.wd ? "星期" + a.wd : ""}</small></div>
        <div class="pass-cell"><span class="pass-lbl">回程</span><b>${b.md}</b><small>${b.wd ? "星期" + b.wd : ""}</small></div>
        <div class="pass-cell"><span class="pass-lbl">行程</span><b>${nDays || "—"}</b><small>日</small></div>

  // Deleting is irreversible (the DB cascades every version + AI note away),
  // so it asks for the destination name to be typed rather than a single
  // mis-tappable confirm.
  function openDeleteSheet(id, name){
    const layer = $("#layer");

      <div class="scrim" data-close></div>

    const inp = layer.querySelector("#del-confirm");

      go.disabled = true; go.textContent = "刪緊…";
      try {
        const res = await fetch(`${SUPABASE_URL}/rest/v1/trips?id=eq.${encodeURIComponent(id)}`, {
          method: "DELETE", headers: sbHeaders(),
        });
        if (!res.ok) throw new Error("刪唔到 " + res.status + " " + (await res.text()));
        close();
        loadTrips();
      } catch (e){
        err.innerHTML = `<div class="errbox" style="margin-top:10px;">${esc(e.message)}</div>`;
        go.disabled = false; go.textContent = "永久刪除";
      }
    });
  }

  // A grey elephant calf drawn flat, like a picture-book illustration:
  // plain fills with a thin ink line, no shading. Big head, short body, a
  // trunk that curls. While something loads it does one of three things —
  // sniffs along with a magnifying glass, flaps its ears and floats, or reads
  // a map. Picked at random each time.
  function elephantSvg(move){
    const MOVES = ["sniff", "fly", "map"];       // inside, so it works before this line has run
    const m = move || MOVES[Math.floor(Math.random() * MOVES.length)];
    const trunk = "M24 52 C14 58 12 70 18 76 C21 79 25 77 24 73";
    return `<svg class="ele ele-${m}" viewBox="0 0 120 96" aria-hidden="true">
      <path class="ele-ground" d="M14 90 H108"/>
      <g class="ele-all">
        <path class="ele-tail" d="M92 58 q9 1 9 10"/>
        <rect class="ele-leg back l2" x="80" y="68" width="10" height="18" rx="4"/>
        <rect class="ele-leg back l3" x="58" y="68" width="10" height="18" rx="4"/>
        <ellipse class="ele-body" cx="72" cy="60" rx="24" ry="18"/>
        <rect class="ele-leg l1" x="52" y="70" width="11" height="18" rx="4"/>
        <rect class="ele-leg l4" x="74" y="70" width="11" height="18" rx="4"/>
        <g class="ele-head">
          <g class="ele-trunk"><path class="ele-trunk-line" d="${trunk}"/><path class="ele-trunk-fill" d="${trunk}"/>
            ${m === "sniff" ? `<g class="ele-lens"><path d="M27 80 l7 6"/><circle cx="22" cy="76" r="7"/></g>` : ""}</g>
          <circle class="ele-skull" cx="40" cy="42" r="21"/>
          <path class="ele-ear" d="M50 26 C66 20 74 36 70 50 C67 60 56 62 50 56 C46 46 44 34 50 26 Z"/>
          <circle class="ele-eye" cx="31" cy="40" r="2.4"/>
          <path class="ele-brow" d="M27 33 q4 -3 8 0"/>
        </g>
        ${m === "map" ? `<g class="ele-mapsheet"><path d="M8 62 l12 -4 l12 4 l12 -4 v20 l-12 4 l-12 -4 l-12 4z"/><path class="ele-route" d="M12 72 q8 -8 14 -2 t14 -4"/></g>` : ""}
      </g>
    </svg>`;
  }
  function elephantHtml(text, small){
    return `<div class="eleload${small ? " small" : ""}" role="status">${elephantSvg()}<span>${esc(text)}</span></div>`;
  }
  { const bl = document.getElementById("bootload"); if (bl) bl.innerHTML = elephantHtml("載入緊行程…"); }
  async function loadTrips(){
    const upEl = $("#upcoming"), pastEl = $("#past");
    let trips;
    try {
      const res = await fetch(`${SUPABASE_URL}/rest/v1/trips?select=*&order=date_start.desc`, { headers: sbHeaders() });
      if (!res.ok) throw new Error("讀取行程清單失敗 " + res.status);
      trips = await res.json();
    } catch (e){
      upEl.innerHTML = `<div class="errbox">${esc(netMsg(e))}
        <div style="margin-top:10px;"><button class="btn" id="retrytrips">再試一次</button></div></div>`;
      pastEl.innerHTML = "";
      $("#retrytrips").addEventListener("click", () => {
        upEl.innerHTML = `<div class="empty">${elephantHtml("載入緊行程…")}</div>`;
        loadTrips();
      });
      return;
    }
    const today = todayIso();
    // the next trip first; past trips stay most-recent-first
    const upcoming = trips.filter(t => (t.date_end || t.date_start) >= today)
      .sort((a, b) => String(a.date_start || "").localeCompare(String(b.date_start || "")));
    const past = trips.filter(t => (t.date_end || t.date_start) < today);
    $("#upcount").textContent = upcoming.length ? upcoming.length + " 個" : "";
    $("#pastcount").textContent = past.length ? past.length + " 個" : "";
    upEl.innerHTML = upcoming.length ? upcoming.map(tripCardHtml).join("") : `<div class="empty">重未有未去嘅行程，上面開一個啦。</div>`;
    pastEl.innerHTML = past.length ? past.map(tripCardHtml).join("") : `<div class="empty">重未有去過嘅行程。</div>`;
    document.querySelectorAll("[data-del]").forEach(b => b.addEventListener("click", e => {
      e.preventDefault(); e.stopPropagation();
      openDeleteSheet(b.dataset.del, b.dataset.delname);
    }));
  }
  // ==================================================================
  // PULL TO REFRESH — the same gesture as trip.html.
  // Installed to the home screen there is no browser chrome, so there is no
  // reload button and nothing to pull on; the trip list has to offer its own.
  // ==================================================================
  const PTR_TRIGGER = 72, PTR_MAX = 112;
  function wirePullToRefresh(){
    const el = $("#ptr");
    if (!el || !("ontouchstart" in window)) return;
    // a browser tab already has this gesture; ours would be the second spinner
    if (!((window.matchMedia && window.matchMedia("(display-mode: standalone)").matches)
          || window.navigator.standalone === true)) return;
    const mark = el.querySelector(".ptr-i"), label = el.querySelector(".ptr-t");
    let startY = 0, pulling = false, dist = 0, busy = false;

    const place = (y) => {
      el.style.transform = `translate(-50%, ${y}px)`;
      el.style.opacity = y > 0 ? String(Math.min(1, y / 40)) : "0";
    };
    const reset = () => {
      el.classList.add("settling");
      el.classList.remove("ready", "busy");
      el.style.transform = "translate(-50%,-150%)";
      el.style.opacity = "0";
      pulling = false; dist = 0;
    };

    document.addEventListener("touchstart", (e) => {
      if (busy || e.touches.length !== 1 || window.scrollY > 0) return;
      if ($("#layer").innerHTML !== "") return;
      if (e.target.closest("input, textarea, select")) return;
      startY = e.touches[0].clientY;
      pulling = true; dist = 0;
      el.classList.remove("settling");
      mark.innerHTML = icon("chevron");
    }, { passive: true });

    document.addEventListener("touchmove", (e) => {
      if (!pulling || busy) return;
      const raw = e.touches[0].clientY - startY;
      if (raw <= 0 || window.scrollY > 0){ if (dist) reset(); else pulling = false; return; }
      dist = Math.min(PTR_MAX, raw * 0.5);
      if (e.cancelable) e.preventDefault();
      const ready = dist >= PTR_TRIGGER;
      el.classList.toggle("ready", ready);
      label.textContent = ready ? "放手更新" : "拉低更新";
      place(dist + 10);
    }, { passive: false });

    document.addEventListener("touchend", async () => {
      if (!pulling || busy) return;
      if (dist < PTR_TRIGGER) return reset();
      busy = true;
      el.classList.add("settling", "busy");
      el.classList.remove("ready");
      mark.innerHTML = icon("refresh");
      label.textContent = "更新緊…";
      place(14);
      try { await loadTrips(); label.textContent = "更新咗"; }
      catch (err){ label.textContent = netMsg(err); }
      el.classList.remove("busy");
      mark.innerHTML = icon("check");
      setTimeout(reset, 900);
      busy = false;
    }, { passive: true });
  }

  // Makes the app installable and lets it open with no signal. Fire and
  // forget: a failure here must never stop the page working.
  function registerServiceWorker(){
    if (!("serviceWorker" in navigator)) return;
    if (location.protocol !== "https:" && location.hostname !== "localhost") return;
    window.addEventListener("load", () => {
      navigator.serviceWorker.register("/sw.js").catch(() => {});
    });
  }

  registerServiceWorker();
  // The little plane on every boarding pass flies its dashed arc, HKG to the
  // destination, then lands and goes again. One animation loop drives every
  // plane on the page; the arc is the top half of an ellipse (the border of
  // .tp-arc / .pass-arc), so the plane is placed on that curve and turned to
  // its tangent. Off when the system asks for reduced motion.
  (function flyPlanes(){
    if (window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches) return;
    const DUR = 5200, REST = 1400;
    const ease = t => t < .5 ? 2 * t * t : 1 - Math.pow(-2 * t + 2, 2) / 2;
    function frame(now){
      document.querySelectorAll(".tp-flight, .pass-flight").forEach((box, k) => {
        const arc = box.querySelector(".tp-arc, .pass-arc"), pl = box.querySelector(".i");
        if (!arc || !pl) return;
        const W = arc.offsetWidth, H = arc.offsetHeight;
        if (!W || !H) return;
        // each pass starts at its own moment so a list doesn't move in lockstep
        const cyc = (now + k * 900) % (DUR + REST);
        const p = ease(Math.min(1, cyc / DUR));
        const phi = Math.PI * p;                       // 0 = origin, π = destination
        const cx = arc.offsetLeft + W / 2, cy = arc.offsetTop + H;
        const x = cx - (W / 2) * Math.cos(phi), y = cy - H * Math.sin(phi);
        const ang = Math.atan2(-H * Math.cos(phi), (W / 2) * Math.sin(phi)) * 180 / Math.PI;
        pl.style.left = x + "px"; pl.style.top = y + "px";
        pl.style.transform = `translate(-50%, -50%) rotate(${90 + ang}deg)`;
      });
      requestAnimationFrame(frame);
    }
    requestAnimationFrame(frame);
  })();
  wirePullToRefresh();
  loadTrips();
})();
</script>
