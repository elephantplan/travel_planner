<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#F4F5F7" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0D1014" media="(prefers-color-scheme: dark)">
<title>旅程規劃</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wdth,wght@12..96,75..100,400..800&family=Noto+Sans+TC:wght@400;500;700;900&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  color-scheme: light dark;
  --paper:#F4F5F7;
  --surface:#FFFFFF;
  --surface-2:#EAEDF2;
  --ink:#14171C;
  --ink-soft:#5C6472;
  --ink-faint:#949CAA;
  --rule:#DDE2E9;
  --rule-soft:#EBEEF2;
  --shadow-1:0 1px 2px rgba(20,23,28,.05), 0 6px 16px -10px rgba(20,23,28,.16);
  --shadow-2:0 2px 6px rgba(20,23,28,.08), 0 18px 40px -18px rgba(20,23,28,.28);
  --ok:#0E9E52; --ok-bg:#E7F6ED;
  --warn:#C96A10; --warn-bg:#FDF0E1;
  --danger:#CE4034; --danger-bg:#FBEBE9;
  --info:#1D7FC4; --info-bg:#E7F2FB;
  --accent:#1D7FC4;
  --r-sm:8px; --r-md:12px; --r-lg:18px; --r-xl:26px;
  --tap:44px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --paper:#0D1014; --surface:#161A20; --surface-2:#1E232B;
    --ink:#E9ECF1; --ink-soft:#98A1B0; --ink-faint:#6C7686;
    --rule:#272D37; --rule-soft:#1E232B;
    --shadow-1:0 1px 2px rgba(0,0,0,.5), 0 6px 16px -10px rgba(0,0,0,.7);
    --shadow-2:0 2px 6px rgba(0,0,0,.55), 0 18px 40px -18px rgba(0,0,0,.85);
    --ok:#3CC177; --ok-bg:#12291C;
    --warn:#E5964A; --warn-bg:#2C2013;
    --danger:#E8695C; --danger-bg:#2E1917;
    --info:#54AEEA; --info-bg:#122534;
    --accent:#54AEEA;
  }
}
:root[data-theme="dark"]{
  --paper:#0D1014; --surface:#161A20; --surface-2:#1E232B;
  --ink:#E9ECF1; --ink-soft:#98A1B0; --ink-faint:#6C7686;
  --rule:#272D37; --rule-soft:#1E232B;
  --shadow-1:0 1px 2px rgba(0,0,0,.5), 0 6px 16px -10px rgba(0,0,0,.7);
  --shadow-2:0 2px 6px rgba(0,0,0,.55), 0 18px 40px -18px rgba(0,0,0,.85);
  --ok:#3CC177; --ok-bg:#12291C;
  --warn:#E5964A; --warn-bg:#2C2013;
  --danger:#E8695C; --danger-bg:#2E1917;
  --info:#54AEEA; --info-bg:#122534;
  --accent:#54AEEA;
}
*{box-sizing:border-box;}
html{-webkit-text-size-adjust:100%;}
body{
  margin:0;
  background:var(--paper);
  color:var(--ink);
  font-family:'Noto Sans TC','Hiragino Sans TC','Microsoft JhengHei',system-ui,sans-serif;
  font-size:15px;
  line-height:1.65;
  -webkit-font-smoothing:antialiased;
  padding-bottom:calc(48px + env(safe-area-inset-bottom));
}
:focus-visible{outline:2.5px solid var(--accent);outline-offset:2px;border-radius:4px;}
button{font-family:inherit;color:inherit;}
.mono{font-family:'JetBrains Mono',monospace;}
.disp{font-family:'Bricolage Grotesque',system-ui,sans-serif;}
a{color:inherit;}

.topbar{
  position:sticky; top:0; z-index:20;
  background:color-mix(in srgb, var(--paper) 88%, transparent);
  backdrop-filter:blur(10px);
  border-bottom:1px solid var(--rule);
}
.topbar-inner{
  max-width:720px; margin:0 auto; padding:14px 18px;
  display:flex; align-items:center; justify-content:space-between;
}
.brandmark{font-family:'Bricolage Grotesque',system-ui,sans-serif; font-weight:700; font-size:17px; letter-spacing:.01em;}
.iconbtn{
  width:var(--tap); height:var(--tap); border:1px solid var(--rule); background:var(--surface);
  border-radius:999px; font-size:16px; cursor:pointer;
}

.wrap{max-width:720px; margin:0 auto; padding:28px 18px 60px;}

.hero{padding:8px 2px 26px;}
.hero h1{
  font-family:'Bricolage Grotesque',system-ui,sans-serif;
  font-weight:800; font-size:clamp(28px,7vw,38px); line-height:1.18; margin:0 0 10px;
  letter-spacing:-.01em;
}
.hero p{color:var(--ink-soft); margin:0; font-size:15.5px;}

.card{
  background:var(--surface); border:1px solid var(--rule); border-radius:var(--r-xl);
  box-shadow:var(--shadow-1); padding:22px;
}
.formcard{margin-bottom:34px;}
.field{margin-bottom:16px; position:relative;}
.field label{display:block; font-size:13px; font-weight:700; color:var(--ink-soft); margin-bottom:6px;}
.field .hint{font-size:12.5px; color:var(--ink-faint); margin-top:5px;}
.input, textarea.input{
  width:100%; border:1.5px solid var(--rule); background:var(--paper); color:var(--ink);
  border-radius:var(--r-md); padding:12px 14px; font-size:15px; font-family:inherit;
  min-height:var(--tap);
}
textarea.input{min-height:84px; resize:vertical; line-height:1.55;}
.input:focus, textarea.input:focus{border-color:var(--accent);}
.daterow{display:grid; grid-template-columns:1fr 1fr; gap:12px;}

.suggest{
  position:absolute; left:0; right:0; top:calc(100% + 4px); z-index:5;
  background:var(--surface); border:1px solid var(--rule); border-radius:var(--r-md);
  box-shadow:var(--shadow-2); overflow:hidden;
}
.suggest button{
  display:block; width:100%; text-align:left; padding:11px 14px; border:0; background:transparent;
  border-bottom:1px solid var(--rule-soft); cursor:pointer; font-size:14.5px;
}
.suggest button:last-child{border-bottom:0;}
.suggest button:hover, .suggest button:focus-visible{background:var(--surface-2);}
.suggest .sub{display:block; font-size:12.5px; color:var(--ink-faint); margin-top:2px;}

.picked{
  display:flex; align-items:center; gap:8px; margin-top:8px; padding:9px 12px;
  background:var(--info-bg); color:var(--info); border-radius:var(--r-md); font-size:13.5px; font-weight:600;
}

.btn{
  display:inline-flex; align-items:center; justify-content:center; gap:6px;
  min-height:var(--tap); padding:0 18px; border-radius:999px; border:1.5px solid var(--rule);
  background:var(--surface); color:var(--ink); font-size:15px; font-weight:700; cursor:pointer;
}
.btn.primary{background:var(--accent); border-color:var(--accent); color:#fff;}
.btn.wide{width:100%;}
.btn:disabled{opacity:.5; cursor:not-allowed;}
.btn.primary:disabled{background:var(--ink-faint); border-color:var(--ink-faint);}

.errbox{background:var(--danger-bg); color:var(--danger); border-radius:var(--r-md); padding:12px 14px; font-size:14px;}

.triplist-head{display:flex; align-items:baseline; justify-content:space-between; margin:0 2px 12px;}
.triplist-head h2{font-family:'Bricolage Grotesque',system-ui,sans-serif; font-size:19px; margin:0;}
.triplist-head .count{color:var(--ink-faint); font-size:13px;}
section.triplist{margin-bottom:30px;}
.tripgrid{display:grid; gap:12px;}
a.tripcard{
  display:block; text-decoration:none; color:inherit;
  background:var(--surface); border:1px solid var(--rule); border-radius:var(--r-lg);
  box-shadow:var(--shadow-1); padding:16px 18px; position:relative; overflow:hidden;
  border-left:5px solid var(--tc, var(--accent));
}
a.tripcard:hover{box-shadow:var(--shadow-2);}
.tripcard .row1{display:flex; align-items:center; gap:8px; margin-bottom:4px;}
.tripcard .emoji{font-size:19px;}
.tripcard .dest{font-family:'Bricolage Grotesque',system-ui,sans-serif; font-weight:700; font-size:17px;}
.tripcard .dates{font-size:13px; color:var(--ink-soft);}
.tripcard .name{font-size:13.5px; color:var(--ink-faint); margin-top:2px;}
.empty{color:var(--ink-faint); font-size:14px; padding:18px 2px;}
.loading{color:var(--ink-faint); padding:18px 2px; font-size:14px;}
</style>
</head>
<body>

<header class="topbar">
  <div class="topbar-inner">
    <div class="brandmark">✈️ 旅程規劃</div>
    <button class="iconbtn" id="btn-theme" aria-label="切換深淺色">◐</button>
  </div>
</header>

<main class="wrap">
  <div class="hero">
    <h1>今次想去邊度？</h1>
    <p>打低目的地、日期同要求，AI 幫你由零砌一個完整行程——連天氣、建議、地圖都齊晒，好似而家嘅首爾行程咁。</p>
  </div>

  <div class="card formcard">
    <div class="field">
      <label for="f-dest">目的地</label>
      <input class="input" id="f-dest" autocomplete="off" placeholder="例如：東京、大阪、台北…">
      <div id="dest-suggest"></div>
      <div id="dest-picked"></div>
    </div>
    <div class="field">
      <label>日期</label>
      <div class="daterow">
        <input class="input mono" type="date" id="f-start">
        <input class="input mono" type="date" id="f-end">
      </div>
    </div>
    <div class="field">
      <label for="f-req">有咩要求？</label>
      <textarea class="input" id="f-req" placeholder="例如：3個大人1個小朋友、想輕鬆啲唔好行太多路、預算中等、鍾意食海鮮…"></textarea>
      <div class="hint">留空都得，AI 會自己睇住辦。</div>
    </div>
    <div id="form-err"></div>
    <button class="btn primary wide" id="f-go">開始規劃 →</button>
  </div>

  <section class="triplist">
    <div class="triplist-head"><h2>未去嘅行程</h2><span class="count" id="upcount"></span></div>
    <div class="tripgrid" id="upcoming"><div class="loading">載入緊…</div></div>
  </section>

  <section class="triplist">
    <div class="triplist-head"><h2>去過嘅行程</h2><span class="count" id="pastcount"></span></div>
    <div class="tripgrid" id="past"></div>
  </section>
</main>

<script>
(function(){
  "use strict";

  // ---------- config (same project as korea.html; no shared JS module in
  // this app, each page is self-contained by convention) ----------
  const SUPABASE_URL = "https://aczykqleoamxdekfsgqh.supabase.co";
  const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImFjenlrcWxlb2FteGRla2ZzZ3FoIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODQ4ODU0MjUsImV4cCI6MjEwMDQ2MTQyNX0.Iv8diOTpiKO0LzAUMcDXaP_3HBAP4PyYGNgosGtgjCA";
  const FUNCTIONS_URL = SUPABASE_URL + "/functions/v1/ai-assistant";
  const CARD_PALETTE = ["#1D7FC4","#0E9E52","#C96A10","#9B6FB0","#C93B92","#3C8DBC"];

  function sbHeaders(extra){
    return Object.assign({
      "apikey": SUPABASE_ANON_KEY,
      "Authorization": "Bearer " + SUPABASE_ANON_KEY,
      "Content-Type": "application/json"
    }, extra || {});
  }
  function esc(s){
    return String(s == null ? "" : s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
  }
  const $ = sel => document.querySelector(sel);

  // ---------- theme (shares the same toggle/localStorage key as korea.html) ----------
  function applyTheme(t){
    if (t === "auto") document.documentElement.removeAttribute("data-theme");
    else document.documentElement.setAttribute("data-theme", t);
    localStorage.setItem("seoul_theme", t);
  }
  applyTheme(localStorage.getItem("seoul_theme") || "auto");
  $("#btn-theme").addEventListener("click", () => {
    const cur = localStorage.getItem("seoul_theme") || "auto";
    applyTheme(cur === "auto" ? "light" : cur === "light" ? "dark" : "auto");
  });

  // ---------- AI edge function ----------
  async function callAi(payload){
    const res = await fetch(FUNCTIONS_URL, { method:"POST", headers: sbHeaders(), body: JSON.stringify(payload) });
    return res.json();
  }

  // ==================================================================
  // Destination picker — free text -> place-search -> pick one result
  // ==================================================================
  let picked = null;   // { name, address, lat, lng }
  let searchSeq = 0;
  const destInput = $("#f-dest");
  const suggestBox = $("#dest-suggest");
  const pickedBox = $("#dest-picked");
  let debounceTimer = null;

  function renderPicked(){
    pickedBox.innerHTML = picked
      ? `<div class="picked">📍 已揀：${esc(picked.name)}${picked.address ? "・" + esc(picked.address) : ""}</div>`
      : "";
    updateGoState();
  }
  function clearSuggest(){ suggestBox.innerHTML = ""; }

  destInput.addEventListener("input", () => {
    picked = null;
    renderPicked();
    clearTimeout(debounceTimer);
    const q = destInput.value.trim();
    if (q.length < 2){ clearSuggest(); return; }
    debounceTimer = setTimeout(() => runSearch(q), 380);
  });
  destInput.addEventListener("blur", () => setTimeout(clearSuggest, 150));

  async function runSearch(q){
    const seq = ++searchSeq;
    let r;
    try { r = await callAi({ action:"place-search", query:q }); }
    catch (e){ return; }
    if (seq !== searchSeq) return;   // a newer keystroke already superseded this
    const places = (r && r.places) || [];
    if (!places.length){ clearSuggest(); return; }
    suggestBox.innerHTML = `<div class="suggest">${places.slice(0,6).map((p,i) =>
      `<button type="button" data-pick="${i}">${esc(p.name)}${p.address ? `<span class="sub">${esc(p.address)}</span>` : ""}</button>`
    ).join("")}</div>`;
    suggestBox.querySelectorAll("[data-pick]").forEach(btn => btn.addEventListener("mousedown", e => {
      e.preventDefault();
      const p = places[+btn.dataset.pick];
      picked = { name:p.name, address:p.address||"", lat:p.lat, lng:p.lng };
      destInput.value = p.name;
      clearSuggest();
      renderPicked();
    }));
  }

  // ==================================================================
  // Form -> create trip -> navigate
  // ==================================================================
  const startInput = $("#f-start");
  const endInput = $("#f-end");
  const reqInput = $("#f-req");
  const goBtn = $("#f-go");
  const errBox = $("#form-err");

  function todayIso(){ return new Date().toISOString().slice(0,10); }
  startInput.min = todayIso();
  startInput.addEventListener("change", () => { endInput.min = startInput.value || todayIso(); updateGoState(); });
  endInput.addEventListener("change", updateGoState);

  function updateGoState(){
    const ok = !!picked && !!startInput.value && !!endInput.value && endInput.value >= startInput.value;
    goBtn.disabled = !ok;
  }
  updateGoState();

  // day.date is a hand-authored "10月24日（六）" style label, not ISO — this
  // is what korea.html's weekday-closure check (weekdayCharOfDate) parses,
  // so a fresh trip's skeleton has to match that shape exactly.
  const WD = ["日","一","二","三","四","五","六"];
  function dateLabel(d){ return `${d.getMonth()+1}月${d.getDate()}日（${WD[d.getDay()]}）`; }
  function buildDaySkeleton(dateStart, dateEnd){
    const days = [];
    const cur = new Date(dateStart + "T00:00:00");
    const end = new Date(dateEnd + "T00:00:00");
    let n = 1;
    while (cur <= end){
      days.push({
        id: "day" + n, num: "DAY " + n, date: dateLabel(cur), title: "第 " + n + " 日",
        desc: "", shortTag: "", badges: [], items: [], mapPoints: null, mapCap: ""
      });
      cur.setDate(cur.getDate() + 1);
      n++;
    }
    return days;
  }
  function formatEyebrow(dateStart, dateEnd){
    const [ , sm, sd] = dateStart.split("-");
    const [sy, em, ed] = dateEnd.split("-");
    return `${sm}.${sd} — ${em}.${ed} · ${sy}`;
  }

  goBtn.addEventListener("click", async () => {
    if (goBtn.disabled) return;
    errBox.innerHTML = "";
    goBtn.disabled = true;
    goBtn.textContent = "開緊行程…";
    try {
      const destinationLocal = picked.name;
      const dateStart = startInput.value, dateEnd = endInput.value;
      const requirements = reqInput.value.trim();
      const days = buildDaySkeleton(dateStart, dateEnd);

      // 1) create the trip row
      const tripRes = await fetch(`${SUPABASE_URL}/rest/v1/trips`, {
        method: "POST",
        headers: sbHeaders({ "Prefer": "return=representation" }),
        body: JSON.stringify({
          name: destinationLocal + " 行程",
          destination_local: destinationLocal,
          lat: Number.isFinite(picked.lat) ? picked.lat : null,
          lng: Number.isFinite(picked.lng) ? picked.lng : null,
          date_start: dateStart, date_end: dateEnd,
          cover_emoji: "🧳",
        }),
      });
      if (!tripRes.ok) throw new Error("開唔到新行程 " + tripRes.status);
      const trip = (await tripRes.json())[0];

      // 2) seed the first snapshot — meta/tripBrief/eyebrow/facts must all be
      // set explicitly and non-empty here: korea.html's normalizeSnapshot()
      // and its hero fallback constants (DEFAULT_EYEBROW/DEFAULT_FACTS/
      // DEFAULT_BRIEF) are Seoul-specific, and only backfill a field that is
      // still null/empty — leaving any of these blank would silently show
      // (or reason about) the Seoul trip's dates/family/brief instead.
      const snapshot = {
        meta: {
          destinationLocal, lat: picked.lat, lng: picked.lng, dateStart, dateEnd,
          title: destinationLocal + " 行程",
          eyebrow: formatEyebrow(dateStart, dateEnd),
          facts: [days.length + " 日行程"],
          hotelTags: [],
        },
        tripBrief: `你係一個廣東話（香港口語）旅遊助理，幫緊去 ${destinationLocal}` +
          `（${dateStart} 至 ${dateEnd}）嘅一次旅行。${requirements || ""}`,
        days,
        // "銀杏同紅葉時機" is baked into korea.html's overview page as a
        // fixed block — it was written for the original Seoul-autumn trip
        // and makes no sense for most destinations/seasons, so a brand-new
        // trip starts with it hidden (still viewable/unhide-able from 主頁
        // 最底 for anyone who genuinely wants it, e.g. another Korea trip).
        hiddenSections: ["foliage"],
      };
      const verRes = await fetch(`${SUPABASE_URL}/rest/v1/itinerary_versions`, {
        method: "POST",
        headers: sbHeaders(),
        body: JSON.stringify({ trip_id: trip.id, edited_by: "家人", source: "seed", summary: "開新行程", snapshot }),
      });
      if (!verRes.ok) throw new Error("儲存唔到初始行程 " + verRes.status);

      // 3) hand off to korea.html, which auto-generates the blank days on
      // load — it reads the requirements straight off tripBrief (already
      // seeded above and sent on every AI call automatically), no need to
      // pass them again via the URL.
      location.href = "korea.html?" + new URLSearchParams({ trip: trip.id, new: "1" }).toString();
    } catch (e){
      errBox.innerHTML = `<div class="errbox">${esc(e.message || "出咗問題，試多次啦。")}</div>`;
      goBtn.disabled = false;
      goBtn.textContent = "開始規劃 →";
    }
  });

  // ==================================================================
  // Trip list — upcoming vs past
  // ==================================================================
  function tripCardHtml(t, i){
    const color = CARD_PALETTE[i % CARD_PALETTE.length];
    return `<a class="tripcard" style="--tc:${color}" href="korea.html?trip=${t.id}">
      <div class="row1"><span class="emoji">${esc(t.cover_emoji || "🧳")}</span><span class="dest">${esc(t.destination_local || t.name)}</span></div>
      <div class="dates mono">${esc(t.date_start)} — ${esc(t.date_end)}</div>
      <div class="name">${esc(t.name)}</div>
    </a>`;
  }

  async function loadTrips(){
    const upEl = $("#upcoming"), pastEl = $("#past");
    let trips;
    try {
      const res = await fetch(`${SUPABASE_URL}/rest/v1/trips?select=*&order=date_start.desc`, { headers: sbHeaders() });
      if (!res.ok) throw new Error("讀取行程清單失敗 " + res.status);
      trips = await res.json();
    } catch (e){
      upEl.innerHTML = `<div class="errbox">${esc(e.message)}</div>`;
      pastEl.innerHTML = "";
      return;
    }
    const today = todayIso();
    const upcoming = trips.filter(t => (t.date_end || t.date_start) >= today);
    const past = trips.filter(t => (t.date_end || t.date_start) < today);
    $("#upcount").textContent = upcoming.length ? upcoming.length + " 個" : "";
    $("#pastcount").textContent = past.length ? past.length + " 個" : "";
    upEl.innerHTML = upcoming.length ? upcoming.map(tripCardHtml).join("") : `<div class="empty">重未有未去嘅行程，上面開一個啦。</div>`;
    pastEl.innerHTML = past.length ? past.map(tripCardHtml).join("") : `<div class="empty">重未有去過嘅行程。</div>`;
  }
  loadTrips();
})();
</script>
</body>
</html>
