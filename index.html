<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#F7F7F5" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0E1011" media="(prefers-color-scheme: dark)">
<title>旅程規劃</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600;700&family=Noto+Sans+TC:wght@400;500;700;900&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
/* ============================================================
   DEPARTURE BOARD — shared with trip.html.
   The home page is the same system with a shorter component list:
   a quiet neutral base, one accent, Instrument Sans + IBM Plex Mono
   + Noto Sans TC, hairlines instead of shadows.
   ============================================================ */
:root{
  color-scheme: light dark;
  --paper:#F7F7F5;
  --surface:#FFFFFF;
  --surface-2:#F0F0ED;
  --ink:#15181A;
  --ink-soft:#5B6166;
  --ink-faint:#8B9197;
  --rule:#E4E4DF;
  --rule-soft:#EFEFEB;
  --shadow-1:0 1px 2px rgba(20,23,26,.04);
  --shadow-2:0 8px 30px -12px rgba(20,23,26,.22), 0 2px 6px rgba(20,23,26,.05);
  --ok:#3F7D58;
  --warn:#8A5B17;
  --danger:#A8382C; --danger-bg:#F8EDEB;
  --accent:#2F6E9E;
  --f-disp:'Instrument Sans','Noto Sans TC',system-ui,sans-serif;
  --f-body:'Noto Sans TC','Hiragino Sans TC','Microsoft JhengHei',system-ui,sans-serif;
  --f-mono:'IBM Plex Mono',ui-monospace,monospace;
  --r-sm:6px; --r-md:10px; --r-lg:14px; --r-xl:22px;
  --tap:44px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --paper:#0E1011; --surface:#17191B; --surface-2:#1F2225;
    --ink:#ECEDEB; --ink-soft:#9BA1A6; --ink-faint:#6A7076;
    --rule:#262A2D; --rule-soft:#1E2124;
    --shadow-1:0 1px 2px rgba(0,0,0,.35);
    --shadow-2:0 10px 34px -14px rgba(0,0,0,.8), 0 2px 8px rgba(0,0,0,.4);
    --ok:#63B183; --warn:#D6A15C;
    --danger:#E0796B; --danger-bg:#261715;
    --accent:#6BA8D6;
  }
}
:root[data-theme="dark"]{
  --paper:#0E1011; --surface:#17191B; --surface-2:#1F2225;
  --ink:#ECEDEB; --ink-soft:#9BA1A6; --ink-faint:#6A7076;
  --rule:#262A2D; --rule-soft:#1E2124;
  --shadow-1:0 1px 2px rgba(0,0,0,.35);
  --shadow-2:0 10px 34px -14px rgba(0,0,0,.8), 0 2px 8px rgba(0,0,0,.4);
  --ok:#63B183; --warn:#D6A15C;
  --danger:#E0796B; --danger-bg:#261715;
  --accent:#6BA8D6;
}
*{box-sizing:border-box;}
html{-webkit-text-size-adjust:100%;}
body{
  margin:0;
  background:var(--paper);
  color:var(--ink);
  font-family:var(--f-body);
  font-size:15px;
  line-height:1.7;
  -webkit-font-smoothing:antialiased;
  padding-bottom:calc(48px + env(safe-area-inset-bottom));
  overflow-wrap:break-word;
  overflow-x:hidden;
}
img{max-width:100%;}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:4px;}
button{font-family:inherit;color:inherit;}
a{color:inherit;}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums;}
.disp{font-family:var(--f-disp);}
.i{
  width:1.15em;height:1.15em;flex:0 0 auto;display:inline-block;vertical-align:-.2em;
  fill:none;stroke:currentColor;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round;
}

.topbar{
  position:sticky; top:0; z-index:20;
  background:color-mix(in srgb, var(--paper) 90%, transparent);
  backdrop-filter:saturate(150%) blur(16px);
  -webkit-backdrop-filter:saturate(150%) blur(16px);
  border-bottom:1px solid var(--rule);
}
.topbar-inner{
  max-width:720px; margin:0 auto; padding:14px 18px;
  display:flex; align-items:center; justify-content:space-between; gap:12px;
}
.brandmark{
  display:flex;align-items:center;gap:8px;
  font-family:var(--f-body); font-weight:700; font-size:15px; letter-spacing:-.015em;
}
.brandmark .i{width:17px;height:17px;color:var(--ink-faint);}
.iconbtn{
  width:34px; height:34px; flex:0 0 auto; display:grid; place-items:center;
  border:1px solid var(--rule); background:var(--surface);
  border-radius:999px; cursor:pointer; color:var(--ink-soft);
}
.iconbtn .i{width:16px;height:16px;}
.iconbtn:active{transform:scale(.94);}

.wrap{max-width:720px; margin:0 auto; padding:32px 18px 64px;}

.hero{padding:6px 2px 30px;}
.hero h1{
  font-family:var(--f-body);
  font-weight:700; font-size:clamp(27px,7.4vw,38px); line-height:1.22; margin:0 0 12px;
  letter-spacing:-.025em;
}
.hero p{color:var(--ink-soft); margin:0; font-size:15px;}

.card{
  background:var(--surface); border:1px solid var(--rule); border-radius:var(--r-xl);
  padding:22px;
}
.formcard{margin-bottom:40px;}
.field{margin-bottom:18px; position:relative;}
.field label{display:block; font-size:11.5px; font-weight:500; color:var(--ink-faint); margin-bottom:7px; letter-spacing:.01em;}
.field .hint{font-size:12px; color:var(--ink-faint); margin-top:7px;}
.input, textarea.input{
  width:100%; min-width:0; border:1px solid var(--rule); background:var(--paper); color:var(--ink);
  border-radius:var(--r-md); padding:12px 14px; font-size:16px; font-family:inherit;
  min-height:var(--tap);
}
/* iOS gives date inputs an intrinsic min-content width based on the native
   picker text, which is wider than half this card at phone widths — without
   these it blows the grid out and the whole page scrolls sideways. */
input[type="date"].input{
  appearance:none; -webkit-appearance:none;
  display:block; width:100%; min-width:0;
  font-family:var(--f-mono); font-size:14px;
}
textarea.input{min-height:88px; resize:vertical; line-height:1.6;}
.input:focus, textarea.input:focus{outline:2px solid var(--accent);outline-offset:-1px;border-color:transparent;}
.daterow{display:grid; grid-template-columns:minmax(0,1fr) minmax(0,1fr); gap:10px;}
.daterow > *{min-width:0;}

.suggest{
  position:absolute; left:0; right:0; top:calc(100% + 6px); z-index:5;
  background:var(--surface); border:1px solid var(--rule); border-radius:var(--r-md);
  box-shadow:var(--shadow-2); overflow:hidden;
}
.suggest button{
  display:block; width:100%; text-align:left; padding:12px 14px; border:0; background:transparent;
  border-bottom:1px solid var(--rule-soft); cursor:pointer; font-size:14.5px; font-family:inherit;
}
.suggest button:last-child{border-bottom:0;}
.suggest button:hover, .suggest button:focus-visible{background:var(--surface-2);}
.suggest .sub{display:block; font-size:12px; color:var(--ink-faint); margin-top:2px;}

.picked{
  display:flex; align-items:center; gap:7px; margin-top:9px;
  color:var(--ink-soft); font-size:13px;
}
.picked .i{width:14px;height:14px;color:var(--ink-faint);}

.btn{
  display:inline-flex; align-items:center; justify-content:center; gap:7px;
  min-height:var(--tap); padding:0 20px; border-radius:999px; border:1px solid var(--rule);
  background:var(--surface); color:var(--ink); font-size:14px; font-weight:500;
  font-family:inherit; cursor:pointer;
}
.btn .i{width:15px;height:15px;}
.btn:hover{border-color:var(--ink-faint);}
.btn.primary{background:var(--ink); border-color:var(--ink); color:var(--paper);}
.btn.danger{color:var(--danger); border-color:color-mix(in srgb,var(--danger) 30%,transparent); background:transparent;}
.btn.wide{width:100%;}
.btn:disabled{opacity:.45; cursor:not-allowed;}
.btn.primary:disabled{background:var(--ink-faint); border-color:var(--ink-faint);}

.errbox{background:var(--danger-bg); color:var(--danger); border-radius:var(--r-md); padding:13px 15px; font-size:13.5px; line-height:1.65;}

.triplist-head{display:flex; align-items:baseline; justify-content:space-between; margin:0 2px 14px;}
.triplist-head h2{font-family:var(--f-body); font-weight:700; font-size:18px; margin:0; letter-spacing:-.015em;}
.triplist-head .count{font-family:var(--f-mono); color:var(--ink-faint); font-size:11.5px;}
section.triplist{margin-bottom:36px;}
.tripgrid{display:grid; gap:10px;}

/* one row per trip, the accent as a single tick on the left edge */
.tripcard{
  background:var(--surface); border:1px solid var(--rule); border-radius:var(--r-lg);
  padding:16px 18px; position:relative;
  transition:border-color .15s;
}
.tripcard::before{
  content:""; position:absolute; left:0; top:16px; bottom:16px; width:2px;
  border-radius:0 2px 2px 0; background:var(--tc, var(--accent));
}
.tripcard:hover{border-color:var(--ink-faint);}
/* stretched link: covers the card so the whole thing is tappable, but sits
   BELOW the delete button so that button still gets its own clicks */
.tripcard-link{position:absolute; inset:0; z-index:1; border-radius:inherit;}
.tripdel{
  position:absolute; top:10px; right:10px; z-index:2;
  width:32px; height:32px; display:grid; place-items:center;
  border:0; background:transparent; border-radius:var(--r-sm);
  color:var(--ink-faint); cursor:pointer;
}
.tripdel .i{width:16px;height:16px;}
.tripdel:hover{color:var(--danger); background:var(--surface-2);}
.row1{display:flex; align-items:baseline; gap:8px; padding-right:34px;}
.row1 .emoji{font-size:15px; line-height:1;}
.row1 .emoji:empty{display:none;}
.row1 .dest{font-size:16px; font-weight:600; letter-spacing:-.015em;}
.dates{font-family:var(--f-mono); font-size:11.5px; color:var(--ink-faint); margin-top:3px; font-variant-numeric:tabular-nums;}
.name{font-size:13px; color:var(--ink-soft); margin-top:5px;}

.loading, .empty{color:var(--ink-faint); font-size:13.5px; padding:16px 2px;}

.scrim{position:fixed; inset:0; z-index:80; background:color-mix(in srgb,var(--ink) 42%,transparent); backdrop-filter:blur(3px);}
.sheet{
  position:fixed; left:0; right:0; bottom:0; z-index:81; max-width:720px; margin:0 auto;
  background:var(--paper); border-radius:var(--r-xl) var(--r-xl) 0 0; border-top:1px solid var(--rule);
  box-shadow:var(--shadow-2);
  padding:24px 18px calc(24px + env(safe-area-inset-bottom));
  animation:rise .26s cubic-bezier(.2,.8,.3,1);
}
@keyframes rise{from{transform:translateY(14px);opacity:.4;}to{transform:none;opacity:1;}}
.sheet h3{font-size:17px; font-weight:700; margin:0 0 6px; letter-spacing:-.015em;}
.sheet-sub{font-size:13px; color:var(--ink-soft); margin:0 0 16px; line-height:1.65;}
.sheet-btns{display:flex; gap:9px; margin-top:16px;}
.sheet-btns .btn{flex:1;}

@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.001ms !important;transition-duration:.001ms !important;}
}
</style>
</head>
<body>

<header class="topbar">
  <div class="topbar-inner">
    <div class="brandmark"><span class="brand-i"></span>旅程規劃</div>
    <button class="iconbtn" id="btn-theme" aria-label="切換深淺色" title="切換深淺色"><span class="theme-i"></span></button>
  </div>
</header>

<div id="layer"></div>

<main class="wrap">
  <div class="hero">
    <h1>今次想去邊度？</h1>
    <p>打低目的地、日期同要求，AI 幫你由零砌一個完整行程——連天氣、住宿、建議、地圖都齊晒。</p>
  </div>

  <div class="card formcard">
    <div class="field">
      <label for="f-dest">目的地</label>
      <input class="input" id="f-dest" autocomplete="off" placeholder="例如：東京、大阪、台北…">
      <div id="dest-suggest"></div>
      <div id="dest-picked"></div>
    </div>
    <div class="field">
      <label>日期</label>
      <div class="daterow">
        <input class="input mono" type="date" id="f-start">
        <input class="input mono" type="date" id="f-end">
      </div>
    </div>
    <div class="field">
      <label for="f-req">有咩要求？</label>
      <textarea class="input" id="f-req" placeholder="例如：3個大人1個小朋友、想輕鬆啲唔好行太多路、預算中等、鍾意食海鮮…"></textarea>
      <div class="hint">留空都得，AI 會自己睇住辦。</div>
    </div>
    <div id="form-err"></div>
    <button class="btn primary wide" id="f-go">開始規劃</button>
  </div>

  <section class="triplist">
    <div class="triplist-head"><h2>未去嘅行程</h2><span class="count" id="upcount"></span></div>
    <div class="tripgrid" id="upcoming"><div class="loading">載入緊…</div></div>
  </section>

  <section class="triplist">
    <div class="triplist-head"><h2>去過嘅行程</h2><span class="count" id="pastcount"></span></div>
    <div class="tripgrid" id="past"></div>
  </section>
</main>

<script>
(function(){
  "use strict";

  // ---------- config (same project as trip.html; no shared JS module in
  // this app, each page is self-contained by convention) ----------
  const SUPABASE_URL = "https://aczykqleoamxdekfsgqh.supabase.co";
  const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImFjenlrcWxlb2FteGRla2ZzZ3FoIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODQ4ODU0MjUsImV4cCI6MjEwMDQ2MTQyNX0.Iv8diOTpiKO0LzAUMcDXaP_3HBAP4PyYGNgosGtgjCA";
  const FUNCTIONS_URL = SUPABASE_URL + "/functions/v1/ai-assistant";
  // the same signage-weight hues the trip page uses for its days, so a trip's
  // colour here is the colour it keeps once you open it
  const CARD_PALETTE = ["#2F6E9E","#3F7D58","#B4682A","#7A5E96","#8A6B34","#6B7785"];

  function sbHeaders(extra){
    return Object.assign({
      "apikey": SUPABASE_ANON_KEY,
      "Authorization": "Bearer " + SUPABASE_ANON_KEY,
      "Content-Type": "application/json"
    }, extra || {});
  }
  function esc(s){
    return String(s == null ? "" : s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
  }

  // Same icon set as trip.html — 1.5px strokes on a 24 grid, currentColor, so
  // an icon takes the colour and weight of the text it sits in. Emoji could
  // do none of that and rendered differently on every device.
  const ICONS = {
    plane: '<path d="M10.4 3.4a1.6 1.6 0 0 1 3.2 0V9l7 4.1v2.3l-7-2.1v3.9l2.3 1.7v1.5L12 19.6l-3.9.8v-1.5l2.3-1.7v-3.9l-7 2.1v-2.3l7-4.1z"/>',
    contrast: '<circle cx="12" cy="12" r="8.2"/><path d="M12 3.8a8.2 8.2 0 0 1 0 16.4z" fill="currentColor" stroke="none"/>',
    pin: '<path d="M12 21s6.4-6.1 6.4-10.6a6.4 6.4 0 1 0-12.8 0C5.6 14.9 12 21 12 21z"/><circle cx="12" cy="10.3" r="2.4"/>',
    trash: '<path d="M4.8 6.8h14.4"/><path d="M9.3 6.8V4.9h5.4v1.9"/><path d="M6.6 6.8 7.5 20h9l.9-13.2"/>',
  };
  function icon(name){
    const d = ICONS[name];
    return d ? `<svg class="i" viewBox="0 0 24 24" aria-hidden="true" focusable="false">${d}</svg>` : "";
  }
  // When fetch can't reach the server at all it rejects with a TypeError whose
  // message is whatever the browser feels like ("Load failed" on Safari,
  // "Failed to fetch" on Chrome) — which tells the family nothing. The most
  // common real cause is the free-tier database auto-pausing after a week with
  // no traffic, so say that instead. Server-side errors keep their own message,
  // which already names the status code.
  function netMsg(e){
    return (e instanceof TypeError)
      ? "連唔到伺服器。可能係個資料庫暫時瞓着咗（免費方案冇人用夠一個星期就會自動暫停），等一兩分鐘再試下。"
      : e.message;
  }
  const $ = sel => document.querySelector(sel);

  // ---------- theme (shares the same toggle/localStorage key as trip.html) ----------
  function applyTheme(t){
    if (t === "auto") document.documentElement.removeAttribute("data-theme");
    else document.documentElement.setAttribute("data-theme", t);
    localStorage.setItem("seoul_theme", t);
  }
  // the chrome's icons ship as empty spans so the SVG lives in one place
  (function paintChromeIcons(){
    const brand = document.querySelector(".brandmark .brand-i");
    if (brand) brand.innerHTML = icon("plane");
    const theme = document.querySelector("#btn-theme .theme-i");
    if (theme) theme.innerHTML = icon("contrast");
  })();

  applyTheme(localStorage.getItem("seoul_theme") || "auto");
  $("#btn-theme").addEventListener("click", () => {
    const cur = localStorage.getItem("seoul_theme") || "auto";
    applyTheme(cur === "auto" ? "light" : cur === "light" ? "dark" : "auto");
  });

  // ---------- AI edge function ----------
  async function callAi(payload){
    const res = await fetch(FUNCTIONS_URL, { method:"POST", headers: sbHeaders(), body: JSON.stringify(payload) });
    return res.json();
  }

  // ==================================================================
  // Destination picker — free text -> place-search -> pick one result
  // ==================================================================
  let picked = null;   // { name, address, lat, lng }
  let searchSeq = 0;
  const destInput = $("#f-dest");
  const suggestBox = $("#dest-suggest");
  const pickedBox = $("#dest-picked");
  let debounceTimer = null;

  function renderPicked(){
    pickedBox.innerHTML = picked
      ? `<div class="picked">${icon("pin")}已揀：${esc(picked.name)}${picked.address ? "・" + esc(picked.address) : ""}</div>`
      : "";
    updateGoState();
  }
  function clearSuggest(){ suggestBox.innerHTML = ""; }

  destInput.addEventListener("input", () => {
    picked = null;
    renderPicked();
    clearTimeout(debounceTimer);
    const q = destInput.value.trim();
    if (q.length < 2){ clearSuggest(); return; }
    debounceTimer = setTimeout(() => runSearch(q), 380);
  });
  destInput.addEventListener("blur", () => setTimeout(clearSuggest, 150));

  async function runSearch(q){
    const seq = ++searchSeq;
    let r;
    try { r = await callAi({ action:"place-search", query:q }); }
    catch (e){ return; }
    if (seq !== searchSeq) return;   // a newer keystroke already superseded this
    const places = (r && r.places) || [];
    if (!places.length){ clearSuggest(); return; }
    suggestBox.innerHTML = `<div class="suggest">${places.slice(0,6).map((p,i) =>
      `<button type="button" data-pick="${i}">${esc(p.name)}${p.address ? `<span class="sub">${esc(p.address)}</span>` : ""}</button>`
    ).join("")}</div>`;
    suggestBox.querySelectorAll("[data-pick]").forEach(btn => btn.addEventListener("mousedown", e => {
      e.preventDefault();
      const p = places[+btn.dataset.pick];
      picked = { name:p.name, address:p.address||"", lat:p.lat, lng:p.lng };
      destInput.value = p.name;
      clearSuggest();
      renderPicked();
    }));
  }

  // ==================================================================
  // Form -> create trip -> navigate
  // ==================================================================
  const startInput = $("#f-start");
  const endInput = $("#f-end");
  const reqInput = $("#f-req");
  const goBtn = $("#f-go");
  const errBox = $("#form-err");

  function todayIso(){ return new Date().toISOString().slice(0,10); }
  startInput.min = todayIso();
  startInput.addEventListener("change", () => { endInput.min = startInput.value || todayIso(); updateGoState(); });
  endInput.addEventListener("change", updateGoState);

  function updateGoState(){
    const ok = !!picked && !!startInput.value && !!endInput.value && endInput.value >= startInput.value;
    goBtn.disabled = !ok;
  }
  updateGoState();

  // day.date is a hand-authored "10月24日（六）" style label, not ISO — this
  // is what trip.html's weekday-closure check (weekdayCharOfDate) parses,
  // so a fresh trip's skeleton has to match that shape exactly.
  const WD = ["日","一","二","三","四","五","六"];
  function dateLabel(d){ return `${d.getMonth()+1}月${d.getDate()}日（${WD[d.getDay()]}）`; }
  function buildDaySkeleton(dateStart, dateEnd){
    const days = [];
    const cur = new Date(dateStart + "T00:00:00");
    const end = new Date(dateEnd + "T00:00:00");
    let n = 1;
    while (cur <= end){
      days.push({
        id: "day" + n, num: "DAY " + n, date: dateLabel(cur), title: "第 " + n + " 日",
        desc: "", shortTag: "", badges: [], items: [], mapPoints: null, mapCap: ""
      });
      cur.setDate(cur.getDate() + 1);
      n++;
    }
    return days;
  }
  function formatEyebrow(dateStart, dateEnd){
    const [ , sm, sd] = dateStart.split("-");
    const [sy, em, ed] = dateEnd.split("-");
    return `${sm}.${sd} — ${em}.${ed} · ${sy}`;
  }

  goBtn.addEventListener("click", async () => {
    if (goBtn.disabled) return;
    errBox.innerHTML = "";
    goBtn.disabled = true;
    goBtn.textContent = "開緊行程…";
    try {
      const destinationLocal = picked.name;
      const dateStart = startInput.value, dateEnd = endInput.value;
      const requirements = reqInput.value.trim();
      const days = buildDaySkeleton(dateStart, dateEnd);

      // 1) create the trip row
      const tripRes = await fetch(`${SUPABASE_URL}/rest/v1/trips`, {
        method: "POST",
        headers: sbHeaders({ "Prefer": "return=representation" }),
        body: JSON.stringify({
          name: destinationLocal + " 行程",
          destination_local: destinationLocal,
          lat: Number.isFinite(picked.lat) ? picked.lat : null,
          lng: Number.isFinite(picked.lng) ? picked.lng : null,
          date_start: dateStart, date_end: dateEnd,
          cover_emoji: "",
        }),
      });
      if (!tripRes.ok) throw new Error("開唔到新行程 " + tripRes.status);
      const trip = (await tripRes.json())[0];

      // 2) seed the first snapshot — meta/tripBrief/eyebrow/facts must all be
      // set explicitly and non-empty here: trip.html's normalizeSnapshot()
      // and its hero fallback constants (DEFAULT_EYEBROW/DEFAULT_FACTS/
      // DEFAULT_BRIEF) are Seoul-specific, and only backfill a field that is
      // still null/empty — leaving any of these blank would silently show
      // (or reason about) the Seoul trip's dates/family/brief instead.
      const snapshot = {
        meta: {
          destinationLocal, lat: picked.lat, lng: picked.lng, dateStart, dateEnd,
          title: destinationLocal + " 行程",
          eyebrow: formatEyebrow(dateStart, dateEnd),
          facts: [days.length + " 日行程"],
          hotelTags: [],
        },
        tripBrief: `你係一個廣東話（香港口語）旅遊助理，幫緊去 ${destinationLocal}` +
          `（${dateStart} 至 ${dateEnd}）嘅一次旅行。${requirements || ""}`,
        days,
        // Two of trip.html's fixed overview blocks only make sense for some
        // trips: the seasonal note, and the accessibility legend (which came
        // from one family's specific needs). A new trip starts with both
        // hidden — nothing is deleted, and 主頁最底 has a 「顯示返」 for each.
        hiddenSections: ["foliage", "access"],
      };
      const verRes = await fetch(`${SUPABASE_URL}/rest/v1/itinerary_versions`, {
        method: "POST",
        headers: sbHeaders(),
        body: JSON.stringify({ trip_id: trip.id, edited_by: "家人", source: "seed", summary: "開新行程", snapshot }),
      });
      if (!verRes.ok) throw new Error("儲存唔到初始行程 " + verRes.status);

      // 3) hand off to trip.html, which auto-generates the blank days on
      // load — it reads the requirements straight off tripBrief (already
      // seeded above and sent on every AI call automatically), no need to
      // pass them again via the URL.
      location.href = "trip.html?" + new URLSearchParams({ trip: trip.id, new: "1" }).toString();
    } catch (e){
      errBox.innerHTML = `<div class="errbox">${esc(e.message || "出咗問題，試多次啦。")}</div>`;
      goBtn.disabled = false;
      goBtn.textContent = "開始規劃";
    }
  });

  // ==================================================================
  // Trip list — upcoming vs past
  // ==================================================================
  // The whole card used to be one <a>, so there was nowhere to put an action
  // button (a <button> inside an <a> is invalid and swallows the click). The
  // link is now a stretched overlay and the delete button sits above it.
  function tripCardHtml(t, i){
    const color = CARD_PALETTE[i % CARD_PALETTE.length];
    return `<div class="tripcard" style="--tc:${color}">
      <a class="tripcard-link" href="trip.html?trip=${t.id}" aria-label="${esc(t.name)}"></a>
      <button class="tripdel" data-del="${t.id}" data-delname="${esc(t.destination_local || t.name)}" title="刪除呢個行程" aria-label="刪除呢個行程">${icon("trash")}</button>
      <div class="row1"><span class="emoji">${esc(t.cover_emoji || "")}</span><span class="dest">${esc(t.destination_local || t.name)}</span></div>
      <div class="dates mono">${esc(t.date_start)} — ${esc(t.date_end)}</div>
      <div class="name">${esc(t.name)}</div>
    </div>`;
  }

  // Deleting is irreversible (the DB cascades every version + AI note away),
  // so it asks for the destination name to be typed rather than a single
  // mis-tappable confirm.
  function openDeleteSheet(id, name){
    const layer = $("#layer");
    layer.innerHTML = `
      <div class="scrim" data-close></div>
      <div class="sheet">
        <h3>刪除「${esc(name)}」？</h3>
        <p class="sheet-sub">會連埋成個行程嘅所有版本紀錄同 AI 問答一齊永久刪除，<b>冇得復原</b>。</p>
        <p class="sheet-sub">如果確定，請喺下面打返 <b>${esc(name)}</b>：</p>
        <input class="input" id="del-confirm" autocomplete="off" placeholder="${esc(name)}">
        <div id="del-err"></div>
        <div class="sheet-btns">
          <button class="btn" data-close>取消</button>
          <button class="btn danger" id="del-go" disabled>永久刪除</button>
        </div>
      </div>`;
    const inp = layer.querySelector("#del-confirm");
    const go = layer.querySelector("#del-go");
    const err = layer.querySelector("#del-err");
    const close = () => { layer.innerHTML = ""; };
    layer.querySelectorAll("[data-close]").forEach(b => b.addEventListener("click", close));
    inp.addEventListener("input", () => { go.disabled = inp.value.trim() !== name; });
    inp.focus();
    go.addEventListener("click", async () => {
      go.disabled = true; go.textContent = "刪緊…";
      try {
        const res = await fetch(`${SUPABASE_URL}/rest/v1/trips?id=eq.${encodeURIComponent(id)}`, {
          method: "DELETE", headers: sbHeaders(),
        });
        if (!res.ok) throw new Error("刪唔到 " + res.status + " " + (await res.text()));
        close();
        loadTrips();
      } catch (e){
        err.innerHTML = `<div class="errbox" style="margin-top:10px;">${esc(e.message)}</div>`;
        go.disabled = false; go.textContent = "永久刪除";
      }
    });
  }

  async function loadTrips(){
    const upEl = $("#upcoming"), pastEl = $("#past");
    let trips;
    try {
      const res = await fetch(`${SUPABASE_URL}/rest/v1/trips?select=*&order=date_start.desc`, { headers: sbHeaders() });
      if (!res.ok) throw new Error("讀取行程清單失敗 " + res.status);
      trips = await res.json();
    } catch (e){
      upEl.innerHTML = `<div class="errbox">${esc(netMsg(e))}
        <div style="margin-top:10px;"><button class="btn" id="retrytrips">再試一次</button></div></div>`;
      pastEl.innerHTML = "";
      $("#retrytrips").addEventListener("click", () => {
        upEl.innerHTML = `<div class="empty">載入緊…</div>`;
        loadTrips();
      });
      return;
    }
    const today = todayIso();
    const upcoming = trips.filter(t => (t.date_end || t.date_start) >= today);
    const past = trips.filter(t => (t.date_end || t.date_start) < today);
    $("#upcount").textContent = upcoming.length ? upcoming.length + " 個" : "";
    $("#pastcount").textContent = past.length ? past.length + " 個" : "";
    upEl.innerHTML = upcoming.length ? upcoming.map(tripCardHtml).join("") : `<div class="empty">重未有未去嘅行程，上面開一個啦。</div>`;
    pastEl.innerHTML = past.length ? past.map(tripCardHtml).join("") : `<div class="empty">重未有去過嘅行程。</div>`;
    document.querySelectorAll("[data-del]").forEach(b => b.addEventListener("click", e => {
      e.preventDefault(); e.stopPropagation();
      openDeleteSheet(b.dataset.del, b.dataset.delname);
    }));
  }
  loadTrips();
})();
</script>
</body>
</html>
