# Keeps the Supabase project behind this app reachable, and wakes it back up
# by itself when it isn't.
#
# History of why this exists, because the obvious reading is wrong:
#   - Free-tier Supabase projects pause after ~7 days with no API traffic.
#     A daily ping was added for that, and it worked — the project stayed up
#     for 12 days straight (2026-09-03 → 09-15) on daily pings alone.
#   - It then paused anyway, ~24h after a successful ping, for a reason that
#     is NOT inactivity. So "ping often enough" is not a fix on its own.
# Hence: stop trying to prevent the pause, and make it self-healing instead.
# Every 30 minutes we ping; if the project is paused we call the Management
# API and restore it. Worst case the family sees a few minutes of downtime
# instead of the six days they got last time.
#
# A paused project has its DNS record withdrawn, so the ping fails with
# "Could not resolve host" (curl exit 6, HTTP 000) rather than an HTTP error.
# That's why the ping result alone can't tell "paused" from "broken" — we ask
# the Management API for the real status before touching anything.
#
# Requires one repository secret: SUPABASE_ACCESS_TOKEN
#   Supabase dashboard → Account → Access Tokens → Generate new token
#   GitHub repo → Settings → Secrets and variables → Actions → New secret
# Without it the workflow still pings and still reports, it just can't wake
# anything up.
name: keep-supabase-awake

on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:

# Two overlapping runs could both fire a restore at a project that's already
# coming up. One at a time.
concurrency:
  group: keep-supabase-awake
  cancel-in-progress: false

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping the database, and wake it if it has been paused
        shell: bash
        env:
          # Public on purpose: this anon key is already in index.html in plain
          # sight. The app is protected by the link being unguessable, not by
          # this key, so hiding it here would only be theatre.
          KEY: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImFjenlrcWxlb2FteGRla2ZzZ3FoIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODQ4ODU0MjUsImV4cCI6MjEwMDQ2MTQyNX0.Iv8diOTpiKO0LzAUMcDXaP_3HBAP4PyYGNgosGtgjCA
          PROJECT_REF: aczykqleoamxdekfsgqh
          # This one IS secret — a Supabase personal access token can manage
          # every project on the account, so it is never echoed below.
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          set -uo pipefail

          code=$(curl -sS -o /dev/null -w '%{http_code}' --max-time 25 \
            -H "apikey: $KEY" -H "Authorization: Bearer $KEY" \
            "https://$PROJECT_REF.supabase.co/rest/v1/trips?select=id&limit=1" 2>/dev/null) || true
          code=${code:-000}
          echo "REST ping -> HTTP $code"

          if [ "$code" = "200" ]; then
            echo "Project is awake. Nothing to do."
            exit 0
          fi

          if [ -z "${SUPABASE_ACCESS_TOKEN:-}" ]; then
            echo "::error::Ping failed (HTTP $code) and SUPABASE_ACCESS_TOKEN is not set, so the project cannot be checked or restored."
            exit 1
          fi

          status=$(curl -sS --max-time 25 \
            -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" \
            "https://api.supabase.com/v1/projects/$PROJECT_REF" 2>/dev/null \
            | jq -r '.status // empty') || true
          echo "Management API status -> ${status:-<unknown>}"

          case "${status:-}" in
            ACTIVE_HEALTHY)
              # Reachable according to Supabase but not to us: a genuine fault
              # (bad RLS policy, expired key, outage). Restoring would not help
              # and would hide it, so fail loudly instead.
              echo "::error::Project is ACTIVE_HEALTHY but the REST ping returned HTTP $code. This is a real fault, not a pause."
              exit 1
              ;;
            COMING_UP|RESTORING|RESTORING_FAILED_PITR|UPGRADING|PAUSING)
              echo "Project is mid-transition (${status}). Leaving it alone; the next run will confirm."
              exit 0
              ;;
            INACTIVE|PAUSE_FAILED)
              echo "Project is paused. Restoring..."
              ;;
            *)
              echo "::error::Unexpected project status '${status:-<unknown>}'. Not restoring automatically."
              exit 1
              ;;
          esac

          body=$(mktemp)
          http=$(curl -sS -o "$body" -w '%{http_code}' --max-time 60 -X POST \
            -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" \
            -H "Content-Type: application/json" \
            -d '{}' \
            "https://api.supabase.com/v1/projects/$PROJECT_REF/restore") || true
          http=${http:-000}
          echo "restore -> HTTP $http"
          cat "$body" || true

          case "$http" in
            2*)
              # A warning rather than a failure: the whole point is that this
              # heals without anyone being paged. A red X every time it works
              # would train everyone to ignore the mail.
              echo "::warning::Project was paused and has been restored automatically. It takes a minute or two to come up."
              echo "Woke the project at $(date -u '+%Y-%m-%d %H:%M UTC')." >> "$GITHUB_STEP_SUMMARY"
              ;;
            *)
              echo "::error::Restore request failed (HTTP $http). The project is still paused."
              exit 1
              ;;
          esac
