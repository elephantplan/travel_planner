<!doctype html>
<html lang="zh-HK">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>DumboFly 管理</title>
<link rel="icon" href="/favicon.ico">
<style>
:root{ color-scheme: light dark; --paper:#F1F3EF; --surface:#fff; --surface-2:#E8ECE6; --ink:#13181A; --ink-soft:#5A6560; --ink-faint:#8A948F;
  --rule:#D8DED7; --gold:#B8860B; --danger:#BE3E28; --danger-bg:#F6E7E4; --ok:#2A7355; }
@media (prefers-color-scheme: dark){ :root{ --paper:#0E1211; --surface:#161B1A; --surface-2:#1E2422; --ink:#EEF1EC; --ink-soft:#A9B3AD; --ink-faint:#737D78;
  --rule:#2A312F; --gold:#E2B24A; --danger:#E8765F; --danger-bg:#2A1612; --ok:#5DBB8E; } }
*{box-sizing:border-box;}
html,body{margin:0;overflow-x:clip;}
body{background:var(--paper);color:var(--ink);font:15px/1.6 system-ui,-apple-system,"Noto Sans HK",sans-serif;padding:0 16px calc(40px + env(safe-area-inset-bottom));}
main{max-width:760px;margin:0 auto;}
header{display:flex;align-items:center;gap:12px;padding:calc(14px + env(safe-area-inset-top)) 0 14px;border-bottom:1px solid var(--rule);margin-bottom:18px;}
header h1{font-size:18px;margin:0;flex:1;}
a{color:inherit;}
h2{font-size:15px;margin:26px 0 10px;display:flex;gap:8px;align-items:baseline;}
h2 small{font-weight:400;color:var(--ink-faint);}
.btn{min-height:36px;padding:0 14px;border-radius:999px;border:1px solid var(--rule);background:var(--surface);color:var(--ink);font:600 13px inherit;cursor:pointer;text-decoration:none;display:inline-flex;align-items:center;}
.btn.primary{background:var(--gold);border-color:var(--gold);color:#14110A;}
.btn.danger{color:var(--danger);border-color:color-mix(in srgb,var(--danger) 40%,transparent);}
.btn:disabled{opacity:.5;}
.card{background:var(--surface);border:1px solid var(--rule);border-radius:16px;padding:14px;margin-bottom:10px;}
.u-top{display:flex;gap:12px;align-items:center;}
.av{width:48px;height:48px;border-radius:50%;background:var(--surface-2);display:grid;place-items:center;font-weight:700;font-size:18px;overflow:hidden;flex:none;cursor:pointer;}
.av img{width:100%;height:100%;object-fit:cover;}
.u-id{flex:1;min-width:0;}
.u-id b{display:block;font-size:16px;}
.u-id span{display:block;font-size:12.5px;color:var(--ink-faint);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.tag{display:inline-block;padding:1px 8px;border-radius:999px;font-size:11px;font-weight:700;background:color-mix(in srgb,var(--gold) 20%,transparent);color:var(--gold);margin-left:6px;vertical-align:middle;}
.u-edit{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px;align-items:center;}
.u-edit input[type=text]{flex:1 1 160px;min-width:0;min-height:36px;padding:0 12px;border-radius:10px;border:1px solid var(--rule);background:var(--paper);color:var(--ink);font:inherit;}
.t-row{display:flex;flex-wrap:wrap;gap:8px;align-items:center;}
.t-row b{flex:1 1 160px;min-width:0;}
.t-row small{display:block;font-weight:400;color:var(--ink-faint);font-size:12.5px;}
select{min-height:36px;border-radius:10px;border:1px solid var(--rule);background:var(--paper);color:var(--ink);font:inherit;padding:0 8px;max-width:100%;}
.msg{padding:12px 14px;border-radius:12px;background:var(--danger-bg);color:var(--danger);margin:14px 0;}
.note{color:var(--ink-faint);font-size:13px;}
#toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom));transform:translateX(-50%);background:var(--ink);color:var(--paper);padding:8px 16px;border-radius:999px;font-size:13px;opacity:0;transition:opacity .2s;pointer-events:none;}
#toast.on{opacity:1;}
</style>
</head>
<body>
<main>
  <header><h1>DumboFly 管理</h1><a class="btn" href="index.html">返主頁</a></header>
  <div id="app"><p class="note">載入緊…</p></div>
</main>
<div id="toast"></div>
<script src="auth.js"></script>
<script>
(async function(){
  "use strict";
  const $ = s => document.querySelector(s);
  const esc = s => String(s == null ? "" : s).replace(/[&<>"']/g, c => ({ "&":"&amp;", "<":"&lt;", ">":"&gt;", '"':"&quot;", "'":"&#39;" }[c]));
  const toast = t => { const el = $("#toast"); el.textContent = t; el.classList.add("on"); setTimeout(() => el.classList.remove("on"), 1800); };
  const when = t => t ? new Date(t).toLocaleString("zh-HK", { year: "numeric", month: "numeric", day: "numeric", hour: "2-digit", minute: "2-digit" }) : "—";
  const app = $("#app");
  await TripAuth.ready;
  if (!TripAuth.loggedIn()){
    app.innerHTML = `<div class="msg">要先登入。</div><button class="btn primary" id="login">用 Google 登入</button>`;
    $("#login").addEventListener("click", () => TripAuth.signIn());
    return;
  }
  const me = TripAuth.user();

  async function load(){
    let users, trips;
    try { [users, trips] = await Promise.all([TripAuth.rpc("admin_users", {}), TripAuth.rpc("admin_trips", {})]); }
    catch (e){
      app.innerHTML = `<div class="msg">${/42501|not an admin/.test(e.message) ? "呢個 account 唔係 admin，睇唔到呢頁。" : /404|PGRST202/.test(e.message) ? "管理功能仲未開通（資料庫要更新）。" : esc(e.message)}</div>`;
      return;
    }
    const nameOf = id => (users.find(u => u.id === id) || {}).name || "（冇擁有人）";
    app.innerHTML = `
      <h2>用戶 <small>${users.length} 個</small></h2>
      ${users.map(u => `<div class="card" data-u="${esc(u.id)}">
        <div class="u-top">
          <label class="av" title="換頭像"><input type="file" accept="image/*" hidden data-file>${u.avatar ? `<img src="${esc(u.avatar)}" alt="" referrerpolicy="no-referrer">` : esc((u.name || "?").slice(0, 1))}</label>
          <div class="u-id"><b>${esc(u.name)}${u.is_admin ? `<span class="tag">admin</span>` : ""}${u.id === me.id ? `<span class="tag">你</span>` : ""}</b>
            <span>${esc(u.email || "")}</span>
            <span>註冊 ${when(u.created_at)}・上次登入 ${when(u.last_sign_in_at)}・自己開 ${u.trips} 個行程・獲分享 ${u.shared} 個</span></div>
        </div>
        <div class="u-edit">
          <input type="text" maxlength="40" value="${esc(u.display_name || "")}" placeholder="顯示名（留空用 Google 名）" data-name>
          <button class="btn primary" data-save>儲存名</button>
          ${u.id === me.id ? "" : `<button class="btn" data-admin="${u.is_admin ? 0 : 1}">${u.is_admin ? "取消 admin" : "設為 admin"}</button>
          <button class="btn danger" data-del>刪除用戶</button>`}
        </div></div>`).join("")}
      <h2>行程 <small>${trips.length} 個・你只會見到邊個擁有，睇唔到內容</small></h2>
      ${trips.map(t => `<div class="card t-row" data-t="${t.id}">
        <b>${esc(t.name || "未命名")}${t.deleted_at ? `<span class="tag">已刪除</span>` : ""}<small>${esc(t.date_start || "")}${t.date_end ? " → " + esc(t.date_end) : ""}・${t.members} 個成員</small></b>
        <select data-owner><option value="">（冇擁有人：任何人都開到）</option>${users.map(u => `<option value="${esc(u.id)}"${u.id === t.owner_id ? " selected" : ""}>${esc(u.name)}</option>`).join("")}</select>
      </div>`).join("")}`;

    app.querySelectorAll("[data-u]").forEach(card => {
      const uid = card.dataset.u, u = users.find(x => x.id === uid);
      card.querySelector("[data-save]").addEventListener("click", async () => {
        try { await TripAuth.rpc("admin_set_user", { uid, new_name: card.querySelector("[data-name]").value.trim() }); toast("儲存咗"); load(); } catch (e){ toast("儲唔到：" + e.message); }
      });
      card.querySelector("[data-file]").addEventListener("change", async e => {
        const f = e.target.files[0]; if (!f) return;
        try { const img = await TripAuth.shrinkImage(f, 128);
          await TripAuth.rpc("admin_set_user", { uid, new_name: card.querySelector("[data-name]").value.trim(), new_avatar: img }); toast("換咗頭像"); load(); }
        catch (err){ toast("換唔到：" + err.message); }
      });
      const ad = card.querySelector("[data-admin]");
      if (ad) ad.addEventListener("click", async () => {
        try { await TripAuth.rpc("admin_set_admin", { uid, make: ad.dataset.admin === "1" }); load(); } catch (e){ toast(e.message); }
      });
      const del = card.querySelector("[data-del]");
      if (del) del.addEventListener("click", async () => {
        const keep = await appConfirm(`刪除「${u.name}」？\n\n撳「確定」：保留佢開嘅 ${u.trips} 個行程（轉俾你）。\n撳「取消」之後會再問你係咪連行程一齊刪。`);
        let keepTrips = true;
        if (!keep){ if (!await appConfirm(`連埋「${u.name}」開嘅行程一齊永久刪除？撳「取消」就乜都唔做。`)) return; keepTrips = false; }
        try { await TripAuth.rpc("admin_delete_user", { uid, keep_trips: keepTrips }); toast("刪除咗"); load(); } catch (e){ toast("刪唔到：" + e.message); }
      });
    });
    app.querySelectorAll("[data-t]").forEach(row => row.querySelector("[data-owner]").addEventListener("change", async e => {
      try { await TripAuth.rpc("admin_set_trip_owner", { tid: Number(row.dataset.t), uid: e.target.value || null }); toast("轉咗擁有人：" + nameOf(e.target.value)); }
      catch (err){ toast("轉唔到：" + err.message); load(); }
    }));
  }
  load();
})();
</script>
</body>
</html>
